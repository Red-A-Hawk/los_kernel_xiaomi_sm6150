name: Build ARM64 Clang PGO v12

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            pahole \
            perl \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip \
            device-tree-compiler \
            binutils-aarch64-linux-gnu \
            openjdk-17-jdk

      # ============================================================
      # 3. DOWNLOAD TOOLCHAINS
      # ============================================================
      - name: Download toolchains
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/toolchains"

          echo "============================================================"
          echo "DOWNLOAD CLANG"
          echo "============================================================"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            "$GITHUB_WORKSPACE/toolchains/clang"

          echo
          echo "============================================================"
          echo "DOWNLOAD GCC64"
          echo "============================================================"

          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            "$GITHUB_WORKSPACE/toolchains/gcc64"

          echo
          echo "============================================================"
          echo "DOWNLOAD GCC32"
          echo "============================================================"

          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            "$GITHUB_WORKSPACE/toolchains/gcc32"

      # ============================================================
      # 4. SETUP TOOLCHAIN ENVIRONMENT
      # ============================================================
      - name: Setup toolchain environment
        shell: bash
        run: |
          set -e

          CLANG="$GITHUB_WORKSPACE/toolchains/clang"
          GCC64="$GITHUB_WORKSPACE/toolchains/gcc64"
          GCC32="$GITHUB_WORKSPACE/toolchains/gcc32"

          echo "CLANG=$CLANG" >> "$GITHUB_ENV"
          echo "GCC64=$GCC64" >> "$GITHUB_ENV"
          echo "GCC32=$GCC32" >> "$GITHUB_ENV"

          echo "$CLANG/bin" >> "$GITHUB_PATH"
          echo "$GCC64/bin" >> "$GITHUB_PATH"
          echo "$GCC32/bin" >> "$GITHUB_PATH"

          echo "CROSS_COMPILE=aarch64-linux-android-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-" >> "$GITHUB_ENV"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

      # ============================================================
      # 5. VERIFY TOOLCHAINS
      # ============================================================
      - name: Verify toolchains
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "CLANG"
          echo "============================================================"

          which clang
          clang --version

          echo
          echo "============================================================"
          echo "LLD"
          echo "============================================================"

          which ld.lld
          ld.lld --version

          echo
          echo "============================================================"
          echo "LLVM TOOLS"
          echo "============================================================"

          which llvm-ar
          which llvm-as
          which llvm-nm
          which llvm-objcopy
          which llvm-objdump
          which llvm-strip
          which llvm-profdata

          echo
          echo "============================================================"
          echo "GCC64"
          echo "============================================================"

          which aarch64-linux-android-gcc
          aarch64-linux-android-gcc --version | head -n 1

          echo
          echo "============================================================"
          echo "GCC32"
          echo "============================================================"

          which arm-linux-androideabi-gcc
          arm-linux-androideabi-gcc --version | head -n 1

      # ============================================================
      # 6. DOWNLOAD PGO PATCH
      # ============================================================
      - name: Download PGO Patch
        run: |
          set -e

          PATCH_URL="https://raw.githubusercontent.com/Red-A-Hawk/Patch/kernel_xiaomi_violet/0001-ARM64-Clang-PGO-4.14-RedHawk-final.patch"
          PATCH_FILE="$GITHUB_WORKSPACE/0001-ARM64-Clang-PGO-4.14-RedHawk-final.patch"

          echo "============================================================"
          echo "DOWNLOAD PGO PATCH"
          echo "============================================================"

          wget -O "$PATCH_FILE" "$PATCH_URL"

          echo
          echo "Patch size:"
          wc -c "$PATCH_FILE"

      # ============================================================
      # 7. APPLY PGO PATCH
      # ============================================================
      - name: Apply PGO patch
        shell: bash
        run: |
          set -e

          PATCH_FILE="$GITHUB_WORKSPACE/0001-ARM64-Clang-PGO-4.14-RedHawk-final.patch"

          echo "============================================================"
          echo "APPLY PGO PATCH"
          echo "============================================================"

          set +e

          patch -p1 \
            --fuzz=3 \
            --ignore-whitespace \
            --no-backup-if-mismatch \
            < "$PATCH_FILE"

          PATCH_STATUS=$?

          set -e

          echo
          echo "patch exit status: $PATCH_STATUS"

          # ----------------------------------------------------------
          # Handle ARM64 Kconfig reject manually if required.
          # ----------------------------------------------------------
          if [ -f "arch/arm64/Kconfig.rej" ]; then

            echo
            echo "============================================================"
            echo "HANDLE arch/arm64/Kconfig.rej"
            echo "============================================================"

            cat arch/arm64/Kconfig.rej

            if ! grep -q "ARCH_SUPPORTS_PGO_CLANG" arch/arm64/Kconfig; then

              echo
              echo "[FIX] Adding ARCH_SUPPORTS_PGO_CLANG"

              sed -i '/select ARCH_SUPPORTS_POLLY_CLANG/a\
	select ARCH_SUPPORTS_PGO_CLANG' \
                arch/arm64/Kconfig

            else
              echo "[OK] ARCH_SUPPORTS_PGO_CLANG already present"
            fi

            rm -f arch/arm64/Kconfig.rej
          fi

          # ----------------------------------------------------------
          # Remove patch backup/reject files.
          # ----------------------------------------------------------
          find . \
            -type f \
            \( -name "*.rej" -o -name "*.orig" \) \
            -print \
            -delete

          # ----------------------------------------------------------
          # No reject files may remain.
          # ----------------------------------------------------------
          REMAINING_REJ=$(find . -type f -name "*.rej" -print)

          if [ -n "$REMAINING_REJ" ]; then
            echo
            echo "[FAIL] Patch reject files remain:"
            echo "$REMAINING_REJ"
            exit 1
          fi

          # ----------------------------------------------------------
          # Required PGO support.
          # ----------------------------------------------------------
          if ! grep -q "ARCH_SUPPORTS_PGO_CLANG" arch/arm64/Kconfig; then
            echo "[FAIL] ARCH_SUPPORTS_PGO_CLANG missing"
            exit 1
          fi

          if ! grep -q 'source "kernel/pgo/Kconfig"' arch/Kconfig; then
            echo "[FAIL] kernel/pgo/Kconfig not included"
            exit 1
          fi

          if ! grep -q 'obj-\$(CONFIG_PGO_CLANG) += pgo/' kernel/Makefile; then
            echo "[FAIL] kernel/pgo not included in kernel/Makefile"
            exit 1
          fi

          echo
          echo "[OK] PGO patch integration base checks passed"

      # ============================================================
      # 8. FIX PGO LINKER CONTEXT
      # ============================================================
      - name: Fix PGO linker context
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "FIX PGO LINKER CONTEXT"
          echo "============================================================"

          python3 - <<'PY'
from pathlib import Path

path = Path("include/asm-generic/vmlinux.lds.h")

if not path.exists():
    print("[FAIL] include/asm-generic/vmlinux.lds.h not found")
    raise SystemExit(1)

lines = path.read_text().splitlines(True)

rw_start = None

for i, line in enumerate(lines):
    if line.startswith("#define RW_DATA_SECTION"):
        rw_start = i
        break

if rw_start is None:
    print("[FAIL] RW_DATA_SECTION not found")
    raise SystemExit(1)

bug_index = None

for i in range(rw_start + 1, len(lines)):
    if lines[i].startswith("#define "):
        break

    if "BUG_TABLE" in lines[i]:
        bug_index = i
        break

if bug_index is None:
    print("[FAIL] BUG_TABLE inside RW_DATA_SECTION not found")
    raise SystemExit(1)

if (
    bug_index + 1 < len(lines)
    and "PGO_CLANG_DATA" in lines[bug_index + 1]
):
    print("[OK] PGO_CLANG_DATA already follows BUG_TABLE")
else:
    indent = lines[bug_index][
        :len(lines[bug_index]) - len(lines[bug_index].lstrip())
    ]

    lines.insert(
        bug_index + 1,
        indent + "PGO_CLANG_DATA\n"
    )

    path.write_text("".join(lines))

    print("[FIX] Added PGO_CLANG_DATA after BUG_TABLE")
PY

          echo
          echo "============================================================"
          echo "VERIFY PGO LINKER CONTEXT"
          echo "============================================================"

          grep -n -A2 -B2 \
            "BUG_TABLE" \
            include/asm-generic/vmlinux.lds.h \
            | head -n 10

          echo

          if ! awk '
            /^#define RW_DATA_SECTION/ {
              in_rw=1
              next
            }

            in_rw && /^#define / {
              exit
            }

            in_rw && /BUG_TABLE/ {
              getline nextline

              if (nextline ~ /PGO_CLANG_DATA/) {
                found=1
              }

              exit
            }

            END {
              if (found)
                exit 0
              else
                exit 1
            }
          ' include/asm-generic/vmlinux.lds.h; then

            echo "[FAIL] PGO_CLANG_DATA is not immediately after BUG_TABLE"
            exit 1
          fi

          echo "[OK] PGO_CLANG_DATA follows BUG_TABLE"

          # ----------------------------------------------------------
          # The ARM64 kernel Makefile must NOT be modified.
          # ----------------------------------------------------------
          if ! git diff --quiet -- arch/arm64/kernel/Makefile; then
            echo "[FAIL] arch/arm64/kernel/Makefile was modified"
            git diff -- arch/arm64/kernel/Makefile
            exit 1
          fi

          echo "[OK] arch/arm64/kernel/Makefile unchanged"

          # ----------------------------------------------------------
          # vmlinux.lds.S must not contain a manual PGO modification.
          # ----------------------------------------------------------
          if git diff --quiet -- arch/arm64/kernel/vmlinux.lds.S; then
            echo "[OK] arch/arm64/kernel/vmlinux.lds.S unchanged"
          else
            echo "[FAIL] arch/arm64/kernel/vmlinux.lds.S was modified"
            git diff -- arch/arm64/kernel/vmlinux.lds.S
            exit 1
          fi

      # ============================================================
      # 9. VERIFY PGO INTEGRATION
      # ============================================================
      - name: Verify PGO integration
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "VERIFY PGO INTEGRATION"
          echo "============================================================"

          echo
          echo "--- PGO KCONFIG ---"

          grep -n "PGO_CLANG" kernel/pgo/Kconfig || true
          grep -n "ARCH_SUPPORTS_PGO_CLANG" arch/arm64/Kconfig

          echo
          echo "--- ROOT MAKEFILE ---"

          grep -n "CFLAGS_PGO_CLANG" Makefile

          echo
          echo "--- KERNEL MAKEFILE ---"

          grep -n "CONFIG_PGO_CLANG" kernel/Makefile

          echo
          echo "--- SCRIPTS/MAKEFILE.LIB ---"

          grep -n -A10 -B3 "CFLAGS_PGO_CLANG" scripts/Makefile.lib

          echo
          echo "--- VMLINUX LDS HEADER ---"

          grep -n -A30 -B3 "PGO_CLANG_DATA" \
            include/asm-generic/vmlinux.lds.h

          echo
          echo "--- RW_DATA_SECTION ---"

          sed -n \
            '/^#define RW_DATA_SECTION/,/^#define /p' \
            include/asm-generic/vmlinux.lds.h \
            | head -n 30

          echo
          echo "--- PROTECTED FILES ---"

          if ! git diff --quiet -- arch/arm64/kernel/Makefile; then
            echo "[FAIL] arch/arm64/kernel/Makefile changed"
            exit 1
          fi

          if ! git diff --quiet -- arch/arm64/kernel/vmlinux.lds.S; then
            echo "[FAIL] arch/arm64/kernel/vmlinux.lds.S changed"
            exit 1
          fi

          echo "[OK] Protected files unchanged"

          echo
          echo "[OK] PGO integration verified"

      # ============================================================
      # 10. VIOLET DEFCONFIG
      # ============================================================
      - name: Run Violet defconfig
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "VIOLET DEFCONFIG"
          echo "============================================================"

          rm -rf out

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            vendor/violet-perf_defconfig

          echo
          echo "============================================================"
          echo "PGO CONFIG"
          echo "============================================================"

          grep -E \
            'CONFIG_(PGO_CLANG|ARCH_SUPPORTS_PGO_CLANG|PROC_FS|LTO|THINLTO|LTO_CLANG|POLLY)' \
            out/.config || true

          echo
          echo "============================================================"
          echo "VERIFY PGO"
          echo "============================================================"

          if ! grep -q '^CONFIG_PGO_CLANG=y' out/.config; then
            echo "[FAIL] CONFIG_PGO_CLANG=y missing"
            exit 1
          fi

          if ! grep -q '^CONFIG_ARCH_SUPPORTS_PGO_CLANG=y' out/.config; then
            echo "[FAIL] CONFIG_ARCH_SUPPORTS_PGO_CLANG=y missing"
            exit 1
          fi

          echo "[OK] PGO enabled by defconfig"

      # ============================================================
      # 11. DEBUG PGO LINKER PREPROCESSING
      # ============================================================
      - name: Debug PGO linker preprocessing
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "PGO LINKER PREPROCESSING DEBUG"
          echo "============================================================"

          mkdir -p pgo-debug

          echo
          echo "============================================================"
          echo "RUN MAKE PREPARE"
          echo "============================================================"

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            prepare \
            2>&1 | tee pgo-debug/prepare.log

          echo
          echo "============================================================"
          echo "GENERATED VMLINUX.LDS"
          echo "============================================================"

          if [ -f out/arch/arm64/kernel/vmlinux.lds ]; then

            cp \
              out/arch/arm64/kernel/vmlinux.lds \
              pgo-debug/vmlinux.lds.generated

            grep -n \
              -E '__llvm_prf_|PGO_CLANG_DATA' \
              out/arch/arm64/kernel/vmlinux.lds \
              > pgo-debug/pgo-symbols.txt || true

            cat pgo-debug/pgo-symbols.txt || true

          else
            echo "[FAIL] Generated vmlinux.lds not found"
            exit 1
          fi

          echo
          echo "============================================================"
          echo "MANUAL PREPROCESSOR TEST"
          echo "============================================================"

          clang \
            -E \
            -P \
            -Uarm64 \
            -D__ASSEMBLY__ \
            -DLINKER_SCRIPT \
            -DTEXT_OFFSET=0x00080000 \
            -Iout/include \
            -Iinclude \
            -Iarch/arm64/include \
            -Iarch/arm64/include/generated \
            -Iout/arch/arm64/include \
            -Iout/arch/arm64/include/generated \
            arch/arm64/kernel/vmlinux.lds.S \
            > pgo-debug/vmlinux.lds.manual

          echo
          echo "PGO symbols from manual preprocessing:"

          grep -n \
            -E '__llvm_prf_|PGO_CLANG_DATA' \
            pgo-debug/vmlinux.lds.manual \
            || true

          echo
          echo "============================================================"
          echo "CHECK REQUIRED SYMBOLS"
          echo "============================================================"

          for symbol in \
            __llvm_prf_data_start \
            __llvm_prf_data_end \
            __llvm_prf_cnts_start \
            __llvm_prf_cnts_end \
            __llvm_prf_names_start \
            __llvm_prf_names_end \
            __llvm_prf_vals_start \
            __llvm_prf_vals_end \
            __llvm_prf_vnds_start \
            __llvm_prf_vnds_end
          do
            if grep -q "$symbol" pgo-debug/vmlinux.lds.generated; then
              echo "[OK] $symbol"
            else
              echo "[FAIL] $symbol missing"
            fi
          done

          cp \
            include/asm-generic/vmlinux.lds.h \
            pgo-debug/vmlinux.lds.h

      # ============================================================
      # 11A. UPLOAD DEBUG ARTIFACTS
      # ============================================================
      - name: Upload PGO debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgo-linker-debug
          path: pgo-debug/
          if-no-files-found: warn

      # ============================================================
      # 12. CHECK CLANG PGO SUPPORT
      # ============================================================
      - name: Check Clang PGO support
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "CHECK CLANG PGO SUPPORT"
          echo "============================================================"

          TMPDIR="$(mktemp -d)"

          cat > "$TMPDIR/test.c" <<'EOF'
          int test_function(int x)
          {
              return x + 1;
          }

          int main(void)
          {
              return test_function(1);
          }
          EOF

          echo
          echo "--- -fprofile-generate ---"

          clang \
            -fprofile-generate \
            "$TMPDIR/test.c" \
            -o "$TMPDIR/test-generate"

          echo "[OK] -fprofile-generate"

          echo
          echo "--- -fprofile-instr-generate ---"

          clang \
            -fprofile-instr-generate \
            "$TMPDIR/test.c" \
            -o "$TMPDIR/test-instr"

          echo "[OK] -fprofile-instr-generate"

          echo
          echo "--- llvm-profdata ---"

          llvm-profdata --version

          echo
          echo "[OK] Clang PGO support confirmed"

          rm -rf "$TMPDIR"

      # ============================================================
      # 13. BUILD FULL KERNEL
      # ============================================================
      - name: Build full kernel with Clang PGO
        shell: bash
        run: |
          set -o pipefail

          echo "============================================================"
          echo "BUILD FULL KERNEL"
          echo "============================================================"

          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            V=1 \
            2>&1 | tee pgo-build.log

      # ============================================================
      # 14. VERIFY PGO COMPILER FLAGS
      # ============================================================
      - name: Verify PGO compiler flags
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "VERIFY PGO COMPILER FLAGS"
          echo "============================================================"

          if grep -q -- '-fprofile-generate' pgo-build.log; then
            echo "[OK] -fprofile-generate found in build log"
          else
            echo "[FAIL] -fprofile-generate not found"
            exit 1
          fi

          echo
          echo "PGO compiler flag occurrences:"
          grep -n -- '-fprofile-generate' pgo-build.log | head -n 20 || true

      # ============================================================
      # 15. VERIFY LLVM PGO OBJECT SECTIONS
      # ============================================================
      - name: Verify LLVM PGO sections
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "VERIFY LLVM PGO OBJECT SECTIONS"
          echo "============================================================"

          FOUND=0

          while IFS= read -r obj; do

            if llvm-nm "$obj" 2>/dev/null \
              | grep -q '__llvm_prf_'; then

              echo "[OK] LLVM PGO symbols: $obj"
              llvm-nm "$obj" 2>/dev/null \
                | grep '__llvm_prf_' \
                | head -n 20

              FOUND=1
              break
            fi

          done < <(find out -type f -name '*.o' 2>/dev/null)

          if [ "$FOUND" -eq 0 ]; then
            echo "[FAIL] No LLVM PGO symbols found in object files"
            exit 1
          fi

          echo
          echo "[OK] LLVM PGO sections confirmed in object files"

      # ============================================================
      # 16. VERIFY FINAL VMLINUX PGO SECTIONS
      # ============================================================
      - name: Verify final vmlinux PGO sections
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "VERIFY FINAL VMLINUX PGO SECTIONS"
          echo "============================================================"

          if [ ! -f out/vmlinux ]; then
            echo "[FAIL] out/vmlinux not found"
            exit 1
          fi

          echo
          echo "--- LLVM PGO SYMBOLS ---"

          llvm-nm out/vmlinux \
            | grep '__llvm_prf_' \
            | head -n 100 || true

          echo
          echo "--- LLVM PGO SECTIONS ---"

          llvm-objdump -h out/vmlinux \
            | grep '__llvm_prf_' \
            || true

          REQUIRED=0

          for symbol in \
            __llvm_prf_data_start \
            __llvm_prf_data_end \
            __llvm_prf_cnts_start \
            __llvm_prf_cnts_end \
            __llvm_prf_names_start \
            __llvm_prf_names_end \
            __llvm_prf_vals_start \
            __llvm_prf_vals_end \
            __llvm_prf_vnds_start \
            __llvm_prf_vnds_end
          do

            if llvm-nm out/vmlinux \
              | grep -q "$symbol"; then

              echo "[OK] $symbol"

            else

              echo "[FAIL] $symbol missing"

              REQUIRED=1
            fi

          done

          if [ "$REQUIRED" -ne 0 ]; then
            echo
            echo "[FAIL] Final vmlinux is missing required PGO symbols"
            exit 1
          fi

          echo
          echo "[OK] Final vmlinux PGO symbols confirmed"

      # ============================================================
      # 17. SAVE FINAL CONFIG
      # ============================================================
      - name: Save final config
        run: |
          set -e

          cp out/.config final-defconfig

          echo "============================================================"
          echo "FINAL PGO CONFIG"
          echo "============================================================"

          grep -E \
            'CONFIG_(PGO_CLANG|ARCH_SUPPORTS_PGO_CLANG|PROC_FS|LTO|THINLTO|LTO_CLANG|POLLY)' \
            final-defconfig \
            || true

      # ============================================================
      # 18. UPLOAD BUILD ARTIFACTS
      # ============================================================
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: violet-clang-pgo-build
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtb
            out/arch/arm64/boot/dtbo.img
            out/vmlinux
            out/System.map
            final-defconfig
            pgo-build.log
          if-no-files-found: warn

      # ============================================================
      # 19. FINAL SUMMARY
      # ============================================================
      - name: Final summary
        if: always()
        shell: bash
        run: |
          echo
          echo "============================================================"
          echo "FINAL SUMMARY"
          echo "============================================================"

          echo
          echo "Kernel:"
          echo "  Linux 4.14.357-openela"

          echo
          echo "Target:"
          echo "  ARM64 Qualcomm SM6150 / Xiaomi Violet"

          echo
          echo "Clang:"
          clang --version | head -n 1 || true

          echo
          echo "PGO:"
          if grep -q '^CONFIG_PGO_CLANG=y' out/.config 2>/dev/null; then
            echo "  CONFIG_PGO_CLANG=y"
          else
            echo "  CONFIG_PGO_CLANG not confirmed"
          fi

          echo
          echo "PGO linker integration:"
          if grep -A1 'BUG_TABLE' \
              include/asm-generic/vmlinux.lds.h 2>/dev/null \
              | grep -q 'PGO_CLANG_DATA'; then
            echo "  PGO_CLANG_DATA follows BUG_TABLE"
          else
            echo "  PGO_CLANG_DATA placement not confirmed"
          fi

          echo
          echo "Protected ARM64 linker Makefile:"
          if git diff --quiet -- arch/arm64/kernel/Makefile; then
            echo "  unchanged"
          else
            echo "  MODIFIED"
          fi

          echo
          echo "vmlinux:"
          if [ -f out/vmlinux ]; then
            echo "  present"
            ls -lh out/vmlinux
          else
            echo "  missing"
          fi

          echo
          echo "============================================================"
          echo "DONE"
          echo "============================================================"
