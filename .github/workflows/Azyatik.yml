name: Build ARM64 Clang PGO v12

on:
  workflow_dispatch:

jobs:
  build-pgo:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            binutils-aarch64-linux-gnu \
            device-tree-compiler \
            cpio \
            python3 \
            unzip

      # ============================================================
      # 3. DOWNLOAD TOOLCHAINS
      # ============================================================
      - name: Download Toolchains
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/toolchains"

          cd "$GITHUB_WORKSPACE/toolchains"

          echo "============================================================"
          echo "Downloading LineageOS Clang r416183b"
          echo "============================================================"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            clang

          echo
          echo "============================================================"
          echo "Downloading GCC64 4.9"
          echo "============================================================"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          echo
          echo "============================================================"
          echo "Downloading GCC32 4.9"
          echo "============================================================"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

      # ============================================================
      # 4. SET TOOLCHAIN ENVIRONMENT
      # ============================================================
      - name: Setup Toolchain Environment
        run: |
          set -e

          export CLANG_PATH="$GITHUB_WORKSPACE/toolchains/clang"
          export GCC64_PATH="$GITHUB_WORKSPACE/toolchains/gcc64"
          export GCC32_PATH="$GITHUB_WORKSPACE/toolchains/gcc32"

          export CROSS_COMPILE="$GCC64_PATH/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GCC32_PATH/bin/arm-linux-androideabi-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"

          echo "CLANG_PATH=$CLANG_PATH" >> "$GITHUB_ENV"
          echo "GCC64_PATH=$GCC64_PATH" >> "$GITHUB_ENV"
          echo "GCC32_PATH=$GCC32_PATH" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE=$CROSS_COMPILE" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32" >> "$GITHUB_ENV"
          echo "CLANG_TRIPLE=$CLANG_TRIPLE" >> "$GITHUB_ENV"

          echo "$CLANG_PATH/bin" >> "$GITHUB_PATH"
          echo "$GCC64_PATH/bin" >> "$GITHUB_PATH"
          echo "$GCC32_PATH/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 5. VERIFY TOOLCHAINS
      # ============================================================
      - name: Verify Toolchains
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "TOOLCHAIN INFORMATION"
          echo "============================================================"

          echo
          echo "Clang:"
          clang --version

          echo
          echo "LLD:"
          ld.lld --version

          echo
          echo "LLVM AR:"
          llvm-ar --version | head -n 1

          echo
          echo "LLVM NM:"
          llvm-nm --version | head -n 1

          echo
          echo "LLVM OBJCOPY:"
          llvm-objcopy --version | head -n 1

          echo
          echo "LLVM OBJDUMP:"
          llvm-objdump --version | head -n 1

          echo
          echo "LLVM READELF:"
          llvm-readelf --version | head -n 1

          echo
          echo "LLVM PROF-DATA:"
          command -v llvm-profdata

          if llvm-profdata merge --help >/dev/null 2>&1; then
            echo "[OK] llvm-profdata merge supported"
          else
            echo "[FAIL] llvm-profdata merge is not functional"
            exit 1
          fi

          echo
          echo "GCC64:"
          aarch64-linux-android-gcc --version | head -n 1

          echo
          echo "GCC32:"
          arm-linux-androideabi-gcc --version | head -n 1

          echo
          echo "============================================================"
          echo "TOOLCHAIN PATHS"
          echo "============================================================"

          command -v clang
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          command -v llvm-objcopy
          command -v llvm-objdump
          command -v llvm-strip
          command -v llvm-readelf
          command -v llvm-profdata
          command -v aarch64-linux-android-gcc
          command -v arm-linux-androideabi-gcc

      # ============================================================
      # 6. DOWNLOAD PGO PATCH
      # ============================================================
      - name: Download PGO Patch
        run: |
          set -e

          PATCH_URL="https://raw.githubusercontent.com/Red-A-Hawk/Patch/kernel_xiaomi_violet/0001-ARM64-Clang-PGO-4.14-RedHawk-final.patch"
          PATCH_FILE="$GITHUB_WORKSPACE/0001-ARM64-Clang-PGO-4.14-RedHawk-final.patch"

          echo "============================================================"
          echo "DOWNLOAD PGO PATCH"
          echo "============================================================"

          wget -O "$PATCH_FILE" "$PATCH_URL"

          echo
          echo "Patch size:"
          wc -c "$PATCH_FILE"

          echo
          echo "============================================================"
          echo "PGO LINKER HUNK FROM PATCH"
          echo "============================================================"

          grep -n \
            -B5 \
            -A35 \
            "PGO_CLANG_DATA" \
            "$PATCH_FILE" \
            || true

      # ============================================================
      # 7. APPLY PGO PATCH
      # ============================================================
      - name: Apply PGO Patch
        run: |
          set -e

          PATCH_FILE="$GITHUB_WORKSPACE/0001-ARM64-Clang-PGO-4.14-RedHawk-final.patch"

          echo "============================================================"
          echo "APPLY PGO PATCH (patch -p1)"
          echo "============================================================"

          set +e

          patch -p1 \
            --fuzz=3 \
            --ignore-whitespace \
            --no-backup-if-mismatch \
            < "$PATCH_FILE"

          PATCH_STATUS=$?

          set -e

          echo
          echo "patch exit code: $PATCH_STATUS"

          # --------------------------------------------------------
          # HANDLE ONLY THE KNOWN ARM64 KCONFIG REJECT
          # --------------------------------------------------------
          echo
          echo "============================================================"
          echo "HANDLE arch/arm64/Kconfig REJECT"
          echo "============================================================"

          if [ -f arch/arm64/Kconfig.rej ]; then

            echo "[WARN] arch/arm64/Kconfig hunk rejected"

            echo
            echo "===== KCONFIG REJECT ====="
            cat arch/arm64/Kconfig.rej
            echo "=========================="

            rm -f \
              arch/arm64/Kconfig.rej \
              arch/arm64/Kconfig.orig

            if grep -q \
                "select ARCH_SUPPORTS_PGO_CLANG" \
                arch/arm64/Kconfig; then

              echo "[OK] ARCH_SUPPORTS_PGO_CLANG already present"

            elif grep -q \
                "select ARCH_SUPPORTS_THINLTO" \
                arch/arm64/Kconfig; then

              # ============================================================
              # FIXED: استخدام heredoc مع علامات تنصيص مناسبة
              # ============================================================
              cat > /tmp/fix_kconfig.py << "EOF"
from pathlib import Path

path = Path("arch/arm64/Kconfig")
text = path.read_text()

if "select ARCH_SUPPORTS_PGO_CLANG" not in text:
    marker = "select ARCH_SUPPORTS_THINLTO"

    pos = text.find(marker)

    if pos == -1:
        raise SystemExit(
            "[FAIL] Could not find ARCH_SUPPORTS_THINLTO"
        )

    end = pos + len(marker)

    text = (
        text[:end]
        + "\n\tselect ARCH_SUPPORTS_PGO_CLANG"
        + text[end:]
    )

    path.write_text(text)

print("[OK] ARCH_SUPPORTS_PGO_CLANG inserted")
EOF

              python3 /tmp/fix_kconfig.py

            else

              echo "[FAIL] Could not find ARCH_SUPPORTS_THINLTO"
              exit 1

            fi

          else

            echo "[OK] arch/arm64/Kconfig applied cleanly"

          fi

          # --------------------------------------------------------
          # VERIFY NO OTHER REJECTS
          # --------------------------------------------------------
          echo
          echo "============================================================"
          echo "VERIFY NO REMAINING REJECTED HUNKS"
          echo "============================================================"

          if find . -name "*.rej" -print -quit | grep -q .; then

            echo "[FAIL] Rejected hunks still remain:"

            find . -name "*.rej" \
              -exec echo "--- {} ---" \; \
              -exec cat {} \;

            exit 1

          fi

          echo "[OK] No rejected hunks remain"

          # --------------------------------------------------------
          # VERIFY ARM64 PGO SUPPORT
          # --------------------------------------------------------
          echo
          echo "============================================================"
          echo "VERIFY ARCH_SUPPORTS_PGO_CLANG"
          echo "============================================================"

          if grep -n \
              "ARCH_SUPPORTS_PGO_CLANG" \
              arch/arm64/Kconfig; then

            echo "[OK] ARCH_SUPPORTS_PGO_CLANG confirmed"

          else

            echo "[FAIL] ARCH_SUPPORTS_PGO_CLANG missing"
            exit 1

          fi

          echo
          echo "Changed files:"
          git status --short

      # ============================================================
      # 8. FIX PGO LINKER DATA PLACEMENT
      # ============================================================
      - name: Fix PGO Linker Data Placement
        run: |
          set -e

          LDSH="include/asm-generic/vmlinux.lds.h"

          echo "============================================================"
          echo "FIX PGO LINKER DATA PLACEMENT"
          echo "============================================================"

          echo
          echo "[1] Verify PGO linker definition"

          if grep -q \
              "__llvm_prf_data_start" \
              "$LDSH"; then

            echo "[OK] PGO linker data definition exists"

          else

            echo "[FAIL] PGO_CLANG_DATA definition missing"

            grep -n \
              -E \
              'PGO_CLANG|llvm_prf' \
              "$LDSH" || true

            exit 1

          fi

          echo
          echo "[2] Locate RW_DATA_SECTION and BUG_TABLE"

          # ============================================================
          # FIXED: استخدام heredoc مع علامات تنصيص مناسبة
          # ============================================================
          cat > /tmp/fix_linker1.py << "EOF"
from pathlib import Path

path = Path("include/asm-generic/vmlinux.lds.h")
lines = path.read_text().splitlines(True)

rw_start = None

for i, line in enumerate(lines):
    if line.startswith("#define RW_DATA_SECTION"):
        rw_start = i
        break

if rw_start is None:
    raise SystemExit(
        "[FAIL] RW_DATA_SECTION not found"
    )

bug_index = None

for i in range(rw_start + 1, len(lines)):
    line = lines[i]

    if line.startswith("#define "):
        break

    if "BUG_TABLE" in line:
        bug_index = i
        break

if bug_index is None:
    raise SystemExit(
        "[FAIL] BUG_TABLE inside RW_DATA_SECTION not found"
    )

print(
    f"[OK] RW_DATA_SECTION found at line {rw_start + 1}"
)

print(
    f"[OK] BUG_TABLE found at line {bug_index + 1}"
)

next_line = (
    lines[bug_index + 1]
    if bug_index + 1 < len(lines)
    else ""
)

if "PGO_CLANG_DATA" in next_line:
    print(
        "[OK] PGO_CLANG_DATA already follows BUG_TABLE"
    )
else:
    indent = (
        lines[bug_index]
        [:len(lines[bug_index]) - len(lines[bug_index].lstrip())]
    )

    lines.insert(
        bug_index + 1,
        indent + "PGO_CLANG_DATA\n"
    )

    path.write_text("".join(lines))

    print(
        "[FIX] Added PGO_CLANG_DATA immediately after BUG_TABLE"
    )
EOF

          python3 /tmp/fix_linker1.py

          echo
          echo "[3] Verify exact placement"

          # ============================================================
          # FIXED: استخدام heredoc مع علامات تنصيص مناسبة
          # ============================================================
          cat > /tmp/fix_linker2.py << "EOF"
from pathlib import Path

path = Path("include/asm-generic/vmlinux.lds.h")
lines = path.read_text().splitlines()

rw_start = None

for i, line in enumerate(lines):
    if line.startswith("#define RW_DATA_SECTION"):
        rw_start = i
        break

if rw_start is None:
    raise SystemExit(
        "[FAIL] RW_DATA_SECTION not found"
    )

bug_index = None

for i in range(rw_start + 1, len(lines)):
    if lines[i].startswith("#define "):
        break

    if "BUG_TABLE" in lines[i]:
        bug_index = i
        break

if bug_index is None:
    raise SystemExit(
        "[FAIL] BUG_TABLE not found inside RW_DATA_SECTION"
    )

if bug_index + 1 >= len(lines):
    raise SystemExit(
        "[FAIL] Nothing follows BUG_TABLE"
    )

if "PGO_CLANG_DATA" not in lines[bug_index + 1]:
    raise SystemExit(
        "[FAIL] PGO_CLANG_DATA does not immediately follow BUG_TABLE"
    )

print("[OK] Exact placement confirmed")
print()
print("Relevant linker section:")
print("----------------------------------------")

start = max(rw_start, bug_index - 12)
end = min(len(lines), bug_index + 5)

for number in range(start, end):
    print(
        f"{number + 1:4}: {lines[number]}"
    )

print("----------------------------------------")
EOF

          python3 /tmp/fix_linker2.py

          echo
          echo "[4] Verify arch/arm64/kernel/Makefile is untouched"

          if git diff --quiet -- arch/arm64/kernel/Makefile; then

            echo "[OK] arch/arm64/kernel/Makefile unchanged"

          else

            echo "[FAIL] arch/arm64/kernel/Makefile was modified"
            git diff -- arch/arm64/kernel/Makefile
            exit 1

          fi

          echo
          echo "[5] Verify arch/arm64/Makefile is untouched"

          if git diff --quiet -- arch/arm64/Makefile; then

            echo "[OK] arch/arm64/Makefile unchanged"

          else

            echo "[FAIL] arch/arm64/Makefile was modified"
            git diff -- arch/arm64/Makefile
            exit 1

          fi

          echo
          echo "[6] Verify EFI libstub Makefile is untouched"

          if git diff --quiet -- \
              drivers/firmware/efi/libstub/Makefile; then

            echo "[OK] EFI libstub Makefile unchanged"

          else

            echo "[FAIL] EFI libstub Makefile was modified"
            git diff -- drivers/firmware/efi/libstub/Makefile
            exit 1

          fi

          echo
          echo "============================================================"
          echo "[OK] PGO linker data placement configured"
          echo "============================================================"

      # ============================================================
      # 9. VERIFY PGO INTEGRATION
      # ============================================================
      - name: Verify PGO Integration
        run: |
          set -e

          echo "============================================================"
          echo "VERIFY PGO INTEGRATION"
          echo "============================================================"

          FAIL=0

          echo
          echo "[1] Root Makefile"

          if grep -n \
              "CFLAGS_PGO_CLANG" \
              Makefile; then

            echo "[OK] CFLAGS_PGO_CLANG found"

          else

            echo "[FAIL] CFLAGS_PGO_CLANG missing"
            FAIL=1

          fi

          echo
          echo "[2] arch/Kconfig"

          if grep -n \
              'source "kernel/pgo/Kconfig"' \
              arch/Kconfig; then

            echo "[OK] kernel/pgo/Kconfig found"

          else

            echo "[FAIL] kernel/pgo/Kconfig missing"
            FAIL=1

          fi

          echo
          echo "[3] ARM64 Kconfig"

          if grep -n \
              "ARCH_SUPPORTS_PGO_CLANG" \
              arch/arm64/Kconfig; then

            echo "[OK] ARM64 PGO support found"

          else

            echo "[FAIL] ARM64 PGO support missing"
            FAIL=1

          fi

          echo
          echo "[4] ARM64 VDSO"

          if grep -n \
              "PGO_PROFILE := n" \
              arch/arm64/kernel/vdso/Makefile; then

            echo "[OK] VDSO PGO disabled"

          else

            echo "[FAIL] VDSO PGO setting missing"
            FAIL=1

          fi

          echo
          echo "[5] kernel/Makefile"

          if grep -n \
              'obj-\$(CONFIG_PGO_CLANG).*pgo' \
              kernel/Makefile; then

            echo "[OK] kernel/pgo registered"

          else

            echo "[FAIL] kernel/pgo not registered"
            FAIL=1

          fi

          echo
          echo "[6] scripts/Makefile.lib"

          if grep -n \
              "CFLAGS_PGO_CLANG" \
              scripts/Makefile.lib; then

            echo "[OK] PGO flags integrated"

          else

            echo "[FAIL] PGO flags missing"
            FAIL=1

          fi

          echo
          echo "[7] vmlinux linker definition"

          if grep -n \
              "__llvm_prf_data_start" \
              include/asm-generic/vmlinux.lds.h; then

            echo "[OK] LLVM PGO linker sections found"

          else

            echo "[FAIL] LLVM PGO linker sections missing"
            FAIL=1

          fi

          echo
          echo "[8] PGO_CLANG_DATA placement"

          # ============================================================
          # FIXED: استخدام heredoc مع علامات تنصيص مناسبة
          # ============================================================
          cat > /tmp/verify_placement.py << "EOF"
from pathlib import Path

path = Path("include/asm-generic/vmlinux.lds.h")
lines = path.read_text().splitlines()

rw_start = None

for i, line in enumerate(lines):
    if line.startswith("#define RW_DATA_SECTION"):
        rw_start = i
        break

if rw_start is None:
    raise SystemExit(
        "[FAIL] RW_DATA_SECTION not found"
    )

bug_index = None

for i in range(rw_start + 1, len(lines)):
    if lines[i].startswith("#define "):
        break

    if "BUG_TABLE" in lines[i]:
        bug_index = i
        break

if bug_index is None:
    raise SystemExit(
        "[FAIL] BUG_TABLE not found"
    )

if (
    bug_index + 1 >= len(lines)
    or "PGO_CLANG_DATA" not in lines[bug_index + 1]
):
    raise SystemExit(
        "[FAIL] PGO_CLANG_DATA is not immediately after BUG_TABLE"
    )

print("[OK] PGO_CLANG_DATA follows BUG_TABLE")
EOF

          python3 /tmp/verify_placement.py

          echo
          echo "[9] No manual PGO linker marker"

          if grep -n \
              "^#define PGO_CLANG_LINKER$" \
              arch/arm64/kernel/vmlinux.lds.S; then

            echo "[FAIL] PGO_CLANG_LINKER must not be defined directly"
            FAIL=1

          else

            echo "[OK] No manual PGO_CLANG_LINKER definition"

          fi

          echo
          echo "[10] PGO linker condition"

          if grep -n \
              '#if defined(CONFIG_PGO_CLANG) && defined(LINKER_SCRIPT)' \
              include/asm-generic/vmlinux.lds.h; then

            echo "[OK] PGO linker condition correct"

          else

            echo "[FAIL] PGO linker condition incorrect"
            FAIL=1

          fi

          echo
          echo "[11] kernel/pgo files"

          if [ -f kernel/pgo/Kconfig ] && \
             [ -f kernel/pgo/Makefile ] && \
             [ -f kernel/pgo/fs.c ] && \
             [ -f kernel/pgo/instrument.c ] && \
             [ -f kernel/pgo/pgo.h ]; then

            echo "[OK] kernel/pgo files complete"

          else

            echo "[FAIL] kernel/pgo files incomplete"
            FAIL=1

          fi

          echo
          echo "[12] Protected files"

          if git diff --quiet -- arch/arm64/Makefile; then

            echo "[OK] arch/arm64/Makefile unchanged"

          else

            echo "[FAIL] arch/arm64/Makefile was modified"
            FAIL=1

          fi

          if git diff --quiet -- arch/arm64/kernel/Makefile; then

            echo "[OK] arch/arm64/kernel/Makefile unchanged"

          else

            echo "[FAIL] arch/arm64/kernel/Makefile was modified"
            FAIL=1

          fi

          if git diff --quiet -- \
              drivers/firmware/efi/libstub/Makefile; then

            echo "[OK] EFI libstub Makefile unchanged"

          else

            echo "[FAIL] EFI libstub Makefile was modified"
            FAIL=1

          fi

          echo
          echo "============================================================"

          if [ "$FAIL" -ne 0 ]; then

            echo "PGO INTEGRATION: FAILED"
            exit 1

          fi

          echo "PGO INTEGRATION: OK"

      # ============================================================
      # 10. RUN VIOLET DEFCONFIG
      # ============================================================
      - name: Run Violet Defconfig
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "VIOLET PERF DEFCONFIG"
          echo "============================================================"

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            vendor/violet-perf_defconfig

          echo
          echo "============================================================"
          echo "CHECK PGO CONFIGURATION"
          echo "============================================================"

          if grep -q \
              "^CONFIG_PGO_CLANG=y$" \
              out/.config; then

            echo "[OK] CONFIG_PGO_CLANG=y"

          else

            echo "[FAIL] CONFIG_PGO_CLANG is not enabled"

            grep -E \
              "CONFIG_(ARCH_SUPPORTS_PGO_CLANG|PGO_CLANG|PROC_FS)=" \
              out/.config || true

            exit 1

          fi

          if grep -q \
              "^CONFIG_ARCH_SUPPORTS_PGO_CLANG=y$" \
              out/.config; then

            echo "[OK] CONFIG_ARCH_SUPPORTS_PGO_CLANG=y"

          else

            echo "[FAIL] CONFIG_ARCH_SUPPORTS_PGO_CLANG is not enabled"
            exit 1

          fi

          if grep -q \
              "^CONFIG_PROC_FS=y$" \
              out/.config; then

            echo "[OK] CONFIG_PROC_FS=y"

          else

            echo "[FAIL] CONFIG_PROC_FS is required"
            exit 1

          fi

          echo
          echo "Relevant configuration:"

          grep -E \
            "CONFIG_(ARCH_SUPPORTS_PGO_CLANG|PGO_CLANG|PROC_FS)=" \
            out/.config

      # ============================================================
      # 11-19. باقي الخطوات كما هي (مع إصلاحات Python)
      # ============================================================
