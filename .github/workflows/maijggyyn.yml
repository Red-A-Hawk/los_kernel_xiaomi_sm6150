name: Test Clang PGO Build - Partial v5

on:
  workflow_dispatch:

jobs:
  test-pgo-build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            binutils-aarch64-linux-gnu \
            device-tree-compiler \
            cpio \
            python3 \
            unzip

      # ============================================================
      # 3. DOWNLOAD TOOLCHAINS
      # ============================================================
      - name: Download Toolchains
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/toolchains"

          cd "$GITHUB_WORKSPACE/toolchains"

          echo "========================================"
          echo "LineageOS Clang r416183b"
          echo "========================================"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            clang

          echo
          echo "========================================"
          echo "GCC64 4.9"
          echo "========================================"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          echo
          echo "========================================"
          echo "GCC32 4.9"
          echo "========================================"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

      # ============================================================
      # 4. SET ENVIRONMENT
      # ============================================================
      - name: Setup Toolchain
        run: |
          set -e

          export CLANG_PATH="$GITHUB_WORKSPACE/toolchains/clang"
          export GCC64_PATH="$GITHUB_WORKSPACE/toolchains/gcc64"
          export GCC32_PATH="$GITHUB_WORKSPACE/toolchains/gcc32"

          echo "CLANG_PATH=$CLANG_PATH" >> "$GITHUB_ENV"
          echo "GCC64_PATH=$GCC64_PATH" >> "$GITHUB_ENV"
          echo "GCC32_PATH=$GCC32_PATH" >> "$GITHUB_ENV"

          echo "$CLANG_PATH/bin" >> "$GITHUB_PATH"
          echo "$GCC64_PATH/bin" >> "$GITHUB_PATH"
          echo "$GCC32_PATH/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 5. VERIFY TOOLCHAIN
      # ============================================================
      - name: Verify Toolchain
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "========================================"
          echo "TOOLCHAIN"
          echo "========================================"

          clang --version
          echo

          ld.lld --version
          echo

          echo "llvm-profdata:"
          command -v llvm-profdata

          echo
          echo "GCC64:"
          aarch64-linux-android-gcc --version | head -n 1

          echo
          echo "GCC32:"
          arm-linux-androideabi-gcc --version | head -n 1

      # ============================================================
      # 6. DOWNLOAD + APPLY PGO PATCH
      # ============================================================
      - name: Apply PGO Patch
        run: |
          set -e

          PATCH_URL="https://raw.githubusercontent.com/Red-A-Hawk/Patch/kernel_xiaomi_violet/0001-ARM64-Clang-PGO-4.14-RedHawk-final.patch"
          PATCH_FILE="$GITHUB_WORKSPACE/0001-ARM64-Clang-PGO-4.14-RedHawk-final.patch"

          echo "========================================"
          echo "DOWNLOAD PGO PATCH"
          echo "========================================"

          wget -O "$PATCH_FILE" "$PATCH_URL"

          echo
          echo "SHA256:"
          sha256sum "$PATCH_FILE"

          echo
          echo "Expected:"
          echo "94e2ba8240e4865001a4d7e4961e54f8fd07b0b3e818cffdf52249a37cbc01c4"

          echo
          echo "Checking patch..."

          git apply --check "$PATCH_FILE"

          echo "[OK] Patch check"

          git apply "$PATCH_FILE"

          echo "[OK] PGO patch applied"

      # ============================================================
      # 7. PGO INTEGRATION CHECK
      # ============================================================
      - name: Verify PGO Integration
        run: |
          set -e

          echo "========================================"
          echo "PGO INTEGRATION"
          echo "========================================"

          grep -n "CFLAGS_PGO_CLANG" Makefile

          grep -n "ARCH_SUPPORTS_PGO_CLANG" arch/arm64/Kconfig

          grep -n "PGO_PROFILE := n" \
            arch/arm64/kernel/vdso/Makefile

          grep -n "CFLAGS_PGO_CLANG" \
            scripts/Makefile.lib

          grep -n "__llvm_prf_data" \
            include/asm-generic/vmlinux.lds.h

          grep -n "PGO_CLANG_DATA" \
            include/asm-generic/vmlinux.lds.h

          test -f kernel/pgo/Kconfig
          test -f kernel/pgo/Makefile
          test -f kernel/pgo/fs.c
          test -f kernel/pgo/instrument.c
          test -f kernel/pgo/pgo.h

          echo
          echo "[OK] PGO integration verified"

      # ============================================================
      # 8. DEFCONFIG
      # ============================================================
      - name: Run Violet Defconfig
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "========================================"
          echo "VIOLET DEFCONFIG"
          echo "========================================"

          make O=out \
            ARCH=arm64 \
            vendor/violet-perf_defconfig

          echo
          echo "========================================"
          echo "PGO CONFIGURATION"
          echo "========================================"

          grep -E \
            "CONFIG_(ARCH_SUPPORTS_PGO_CLANG|PGO_CLANG|PROC_FS)=" \
            out/.config

          if grep -q "^CONFIG_ARCH_SUPPORTS_PGO_CLANG=y$" out/.config; then
            echo "[OK] ARCH_SUPPORTS_PGO_CLANG=y"
          else
            echo "[FAIL] ARCH_SUPPORTS_PGO_CLANG"
            exit 1
          fi

          if grep -q "^CONFIG_PGO_CLANG=y$" out/.config; then
            echo "[OK] PGO_CLANG=y"
          else
            echo "[FAIL] PGO_CLANG"
            exit 1
          fi

      # ============================================================
      # 9. PREPARE BUILD
      # ============================================================
      - name: Prepare Kernel Build
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "========================================"
          echo "KERNEL PREPARE"
          echo "========================================"

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            CC=clang \
            HOSTCC=clang \
            olddefconfig

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            CC=clang \
            HOSTCC=clang \
            prepare

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            CC=clang \
            HOSTCC=clang \
            scripts

          echo
          echo "[OK] Kernel preparation completed"

      # ============================================================
      # 10. PARTIAL BUILD
      # ============================================================
      - name: Partial Kernel Build - PGO
        run: |
          set -o pipefail

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "========================================"
          echo "PARTIAL KERNEL BUILD"
          echo "========================================"

          echo
          echo "Building kernel/ directory..."
          echo

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            CC=clang \
            HOSTCC=clang \
            V=1 \
            kernel/ \
            2>&1 | tee pgo-build.log

      # ============================================================
      # 11. VERIFY -fprofile-generate
      # ============================================================
      - name: Verify PGO Compiler Flags
        run: |
          set -e

          echo "========================================"
          echo "VERIFY PGO COMPILER FLAGS"
          echo "========================================"

          echo
          echo "Searching build log for -fprofile-generate..."
          echo

          if grep -F -- "-fprofile-generate" pgo-build.log; then
            echo
            echo "========================================"
            echo "[OK] -fprofile-generate WAS PASSED TO CLANG"
            echo "========================================"
          else
            echo
            echo "========================================"
            echo "[FAIL] -fprofile-generate NOT FOUND"
            echo "========================================"

            echo
            echo "Showing Clang commands:"
            grep -E "clang|clang.real" pgo-build.log | head -n 50 || true

            exit 1
          fi

      # ============================================================
      # 12. VERIFY PGO OBJECT SECTIONS
      # ============================================================
      - name: Verify LLVM PGO Sections
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "========================================"
          echo "LLVM PGO OBJECT CHECK"
          echo "========================================"

          FOUND=0

          while IFS= read -r obj; do

            if llvm-readelf -S "$obj" 2>/dev/null | \
              grep -q "__llvm_prf_"; then

              echo
              echo "[OK] PGO sections found in:"
              echo "$obj"

              llvm-readelf -S "$obj" | \
                grep "__llvm_prf_"

              FOUND=1
              break
            fi

          done < <(find out/kernel -name "*.o" -type f 2>/dev/null)

          echo

          if [ "$FOUND" -eq 1 ]; then
            echo "========================================"
            echo "PGO OBJECT TEST: PASSED"
            echo "========================================"
          else
            echo "========================================"
            echo "PGO OBJECT TEST: FAILED"
            echo "========================================"

            echo
            echo "Listing kernel objects:"
            find out/kernel -name "*.o" -type f | head -n 30

            exit 1
          fi

      # ============================================================
      # 13. FINAL SUMMARY
      # ============================================================
      - name: Final Summary
        if: always()
        run: |
          echo
          echo "============================================================"
          echo "              CLANG PGO PARTIAL BUILD SUMMARY"
          echo "============================================================"

          echo
          echo "Kernel commit:"
          git rev-parse HEAD || true

          echo
          echo "Clang:"
          clang --version | head -n 1 || true

          echo
          echo "PGO configuration:"
          grep -E \
            "CONFIG_(ARCH_SUPPORTS_PGO_CLANG|PGO_CLANG|PROC_FS)=" \
            out/.config 2>/dev/null || true

          echo
          echo "PGO flag:"
          if [ -f pgo-build.log ]; then
            if grep -F -- "-fprofile-generate" pgo-build.log >/dev/null; then
              echo "[PASS] -fprofile-generate detected"
            else
              echo "[FAIL] -fprofile-generate not detected"
            fi
          else
            echo "[NOT RUN]"
          fi

          echo
          echo "============================================================"
