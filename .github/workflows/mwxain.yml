name: Analyze Manipvlator Stable Changes

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout loma
        uses: actions/checkout@v4
        with:
          ref: loma
          fetch-depth: 0

      - name: Fetch manipvlator stable
        run: |
          git remote add manipvlator https://github.com/manipvlator/los_kernel_xiaomi_sm6150.git
          git fetch manipvlator stable

      - name: Analyze trees
        run: |
          set -e

          BASE=d0aaf0bb8c44592ccfba215b39aa310cbe6ef837
          STABLE=manipvlator/stable

          echo "========================================"
          echo "CURRENT STATE"
          echo "========================================"

          echo "BASE:"
          git show -s --format='%H | %ad | %an | %s' "$BASE"

          echo
          echo "STABLE:"
          git show -s --format='%H | %ad | %an | %s' "$STABLE"

          echo
          echo "========================================"
          echo "TREE IDS"
          echo "========================================"

          echo "BASE TREE:"
          git rev-parse "$BASE^{tree}"

          echo "STABLE TREE:"
          git rev-parse "$STABLE^{tree}"

          echo
          echo "========================================"
          echo "TREE COMPARISON"
          echo "========================================"

          git diff --name-status "$BASE" "$STABLE" > stable-name-status.txt

          echo "Changed files:"
          cat stable-name-status.txt

          echo
          echo "========================================"
          echo "CHANGE STATISTICS"
          echo "========================================"

          git diff --stat "$BASE" "$STABLE"

          echo
          echo "========================================"
          echo "ADDED FILES"
          echo "========================================"

          git diff --name-only --diff-filter=A "$BASE" "$STABLE"

          echo
          echo "========================================"
          echo "DELETED FILES"
          echo "========================================"

          git diff --name-only --diff-filter=D "$BASE" "$STABLE"

          echo
          echo "========================================"
          echo "MODIFIED FILES"
          echo "========================================"

          git diff --name-only --diff-filter=M "$BASE" "$STABLE"

          echo
          echo "========================================"
          echo "RENAMED FILES"
          echo "========================================"

          git diff --name-status --diff-filter=R "$BASE" "$STABLE"

          echo
          echo "========================================"
          echo "DIFF"
          echo "========================================"

          git diff --no-ext-diff "$BASE" "$STABLE" > manipvlator-stable-tree.diff

          echo "Patch created:"
          ls -lh manipvlator-stable-tree.diff

          echo
          echo "========================================"
          echo "DIFF SUMMARY"
          echo "========================================"

          git diff --numstat "$BASE" "$STABLE" > stable-numstat.txt

          echo "Number of changed files:"
          wc -l < stable-name-status.txt

          echo "Total additions/deletions:"
          awk '{add += $1; del += $2} END {
            print "Additions:", add
            print "Deletions:", del
          }' stable-numstat.txt

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: manipvlator-stable-tree-analysis
          path: |
            stable-name-status.txt
            stable-numstat.txt
            manipvlator-stable-tree.diff
