name: Check Manipvlator Stable Ancestry

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout loma
        uses: actions/checkout@v4
        with:
          ref: loma
          fetch-depth: 0

      - name: Fetch manipvlator stable
        run: |
          git remote add manipvlator https://github.com/manipvlator/los_kernel_xiaomi_sm6150.git
          git fetch manipvlator stable

      - name: Check ancestry
        run: |
          echo "========================================"
          echo "ANCESTRY CHECK"
          echo "========================================"

          BASE=d0aaf0bb8c44592ccfba215b39aa310cbe6ef837
          STABLE=manipvlator/stable

          echo "loma:"
          git rev-parse loma

          echo "manipvlator/stable:"
          git rev-parse "$STABLE"

          echo "Last synced manipvlator commit:"
          echo "$BASE"

          echo
          echo "========================================"
          echo "CHECKING ANCESTRY"
          echo "========================================"

          if git merge-base --is-ancestor "$BASE" "$STABLE"
          then
              echo "RESULT: d0aaf0b IS an ancestor of manipvlator/stable"
              echo "=> We can safely calculate everything after the last sync."
          else
              echo "RESULT: d0aaf0b IS NOT an ancestor of manipvlator/stable"
              echo "=> stable has a different/re-written history."
          fi

          echo
          echo "========================================"
          echo "MERGE BASE"
          echo "========================================"

          MERGE_BASE=$(git merge-base "$BASE" "$STABLE" || true)

          if [ -n "$MERGE_BASE" ]; then
              echo "Common ancestor:"
              echo "$MERGE_BASE"

              echo
              git show -s \
                --format='Commit: %H%nAuthor: %an%nDate: %ad%nSubject: %s' \
                "$MERGE_BASE"
          else
              echo "No common ancestor found."
          fi

          echo
          echo "========================================"
          echo "DONE"
          echo "========================================"
