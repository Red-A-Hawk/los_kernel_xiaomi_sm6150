name: Build ARM64 Clang PGO v9

on:
  workflow_dispatch:

jobs:
  build-pgo:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            binutils-aarch64-linux-gnu \
            device-tree-compiler \
            cpio \
            python3 \
            unzip

      # ============================================================
      # 3. DOWNLOAD TOOLCHAINS
      # ============================================================
      - name: Download Toolchains
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/toolchains"

          cd "$GITHUB_WORKSPACE/toolchains"

          echo "============================================================"
          echo "Downloading LineageOS Clang r416183b"
          echo "============================================================"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            clang

          echo
          echo "============================================================"
          echo "Downloading GCC64 4.9"
          echo "============================================================"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          echo
          echo "============================================================"
          echo "Downloading GCC32 4.9"
          echo "============================================================"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

      # ============================================================
      # 4. SET TOOLCHAIN ENVIRONMENT
      # ============================================================
      - name: Setup Toolchain Environment
        run: |
          set -e

          export CLANG_PATH="$GITHUB_WORKSPACE/toolchains/clang"
          export GCC64_PATH="$GITHUB_WORKSPACE/toolchains/gcc64"
          export GCC32_PATH="$GITHUB_WORKSPACE/toolchains/gcc32"

          export CROSS_COMPILE="$GCC64_PATH/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GCC32_PATH/bin/arm-linux-androideabi-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"

          echo "CLANG_PATH=$CLANG_PATH" >> "$GITHUB_ENV"
          echo "GCC64_PATH=$GCC64_PATH" >> "$GITHUB_ENV"
          echo "GCC32_PATH=$GCC32_PATH" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE=$CROSS_COMPILE" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32" >> "$GITHUB_ENV"
          echo "CLANG_TRIPLE=$CLANG_TRIPLE" >> "$GITHUB_ENV"

          echo "$CLANG_PATH/bin" >> "$GITHUB_PATH"
          echo "$GCC64_PATH/bin" >> "$GITHUB_PATH"
          echo "$GCC32_PATH/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 5. VERIFY TOOLCHAINS
      # ============================================================
      - name: Verify Toolchains
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "TOOLCHAIN INFORMATION"
          echo "============================================================"

          echo
          echo "Clang:"
          clang --version

          echo
          echo "LLD:"
          ld.lld --version

          echo
          echo "LLVM AR:"
          llvm-ar --version | head -n 1

          echo
          echo "LLVM NM:"
          llvm-nm --version | head -n 1

          echo
          echo "LLVM OBJCOPY:"
          llvm-objcopy --version | head -n 1

          echo
          echo "LLVM OBJDUMP:"
          llvm-objdump --version | head -n 1

          echo
          echo "LLVM READELF:"
          llvm-readelf --version | head -n 1

          echo
          echo "LLVM PROF-DATA:"
          command -v llvm-profdata

          if llvm-profdata merge --help >/dev/null 2>&1; then
            echo "[OK] llvm-profdata merge supported"
          else
            echo "[FAIL] llvm-profdata merge is not functional"
            exit 1
          fi

          echo
          echo "GCC64:"
          aarch64-linux-android-gcc --version | head -n 1

          echo
          echo "GCC32:"
          arm-linux-androideabi-gcc --version | head -n 1

          echo
          echo "============================================================"
          echo "TOOLCHAIN PATHS"
          echo "============================================================"

          command -v clang
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          command -v llvm-objcopy
          command -v llvm-objdump
          command -v llvm-strip
          command -v llvm-readelf
          command -v llvm-profdata
          command -v aarch64-linux-android-gcc
          command -v arm-linux-androideabi-gcc

      # ============================================================
      # 6. DOWNLOAD PGO PATCH
      # ============================================================
      - name: Download PGO Patch
        run: |
          set -e

          PATCH_URL="https://raw.githubusercontent.com/Red-A-Hawk/Patch/kernel_xiaomi_violet/0001-ARM64-Clang-PGO-4.14-RedHawk-final.patch"
          PATCH_FILE="$GITHUB_WORKSPACE/0001-ARM64-Clang-PGO-4.14-RedHawk-final.patch"

          echo "============================================================"
          echo "DOWNLOAD PGO PATCH"
          echo "============================================================"

          wget -O "$PATCH_FILE" "$PATCH_URL"

          echo
          echo "Patch size:"
          wc -c "$PATCH_FILE"

      # ============================================================
      # 7. CHECK AND APPLY PGO PATCH
      # ============================================================
      - name: Apply PGO Patch
        run: |
          set -e

          PATCH_FILE="$GITHUB_WORKSPACE/0001-ARM64-Clang-PGO-4.14-RedHawk-final.patch"

          echo "============================================================"
          echo "APPLY PGO PATCH (patch -p1)"
          echo "============================================================"

          set +e

          patch -p1 \
            --fuzz=3 \
            --ignore-whitespace \
            --no-backup-if-mismatch \
            < "$PATCH_FILE"

          PATCH_STATUS=$?

          set -e

          echo
          echo "patch exit code: $PATCH_STATUS"

          echo
          echo "============================================================"
          echo "HANDLE arch/arm64/Kconfig SEPARATELY IF NEEDED"
          echo "============================================================"

          if [ -f arch/arm64/Kconfig.rej ]; then
            echo "[WARN] arch/arm64/Kconfig hunk rejected, applying manually"

            rm -f arch/arm64/Kconfig.rej arch/arm64/Kconfig.orig

            if grep -q "select ARCH_SUPPORTS_PGO_CLANG" arch/arm64/Kconfig; then
              echo "[OK] ARCH_SUPPORTS_PGO_CLANG already present"

            elif grep -q "select ARCH_SUPPORTS_THINLTO" arch/arm64/Kconfig; then

              sed -i \
                '/select ARCH_SUPPORTS_THINLTO/a\	select ARCH_SUPPORTS_PGO_CLANG' \
                arch/arm64/Kconfig

              echo "[OK] Inserted ARCH_SUPPORTS_PGO_CLANG after ARCH_SUPPORTS_THINLTO"

            else
              echo "[FAIL] Could not find ARCH_SUPPORTS_THINLTO"
              exit 1
            fi

          else
            echo "[OK] arch/arm64/Kconfig applied cleanly from patch"
          fi

          echo
          echo "============================================================"
          echo "VERIFY NO REMAINING REJECTED HUNKS"
          echo "============================================================"

          if find . -name "*.rej" | grep -q .; then
            echo "[FAIL] Rejected hunks still remain:"

            find . -name "*.rej" \
              -exec echo "--- {} ---" \; \
              -exec cat {} \;

            exit 1
          fi

          echo "[OK] No rejected hunks remain"

          echo
          echo "============================================================"
          echo "VERIFY ARCH_SUPPORTS_PGO_CLANG"
          echo "============================================================"

          if grep -n "ARCH_SUPPORTS_PGO_CLANG" arch/arm64/Kconfig; then
            echo "[OK] ARCH_SUPPORTS_PGO_CLANG confirmed"
          else
            echo "[FAIL] ARCH_SUPPORTS_PGO_CLANG missing"
            exit 1
          fi

          echo
          echo "Changed files:"
          git status --short

      # ============================================================
      # 8. FIX PGO LINKER CONTEXT
      # ============================================================
      - name: Fix PGO Linker Context
        run: |
          set -e

          LDSH="include/asm-generic/vmlinux.lds.h"
          ARM64_LDS_MK="arch/arm64/kernel/Makefile"
          ARM64_LDS_S="arch/arm64/kernel/vmlinux.lds.S"

          echo "============================================================"
          echo "FIX PGO LINKER CONTEXT"
          echo "============================================================"

          echo
          echo "[1] Verify PGO condition"

          if grep -q \
              '#if defined(CONFIG_PGO_CLANG) && defined(LINKER_SCRIPT)' \
              "$LDSH"; then

            echo "[OK] PGO linker condition uses LINKER_SCRIPT"

          else
            echo "[FAIL] Expected LINKER_SCRIPT PGO condition not found"

            grep -n \
              -E 'PGO_CLANG|LINKER_SCRIPT' \
              "$LDSH" || true

            exit 1
          fi

          echo
          echo "[2] Verify ARM64 linker CPPFLAGS"

          if grep -q \
              '^CPPFLAGS_vmlinux\.lds.*-DLINKER_SCRIPT' \
              "$ARM64_LDS_MK"; then

            echo "[OK] -DLINKER_SCRIPT already present"

          elif grep -q \
              '^CPPFLAGS_vmlinux\.lds[[:space:]]*:=' \
              "$ARM64_LDS_MK"; then

            sed -i \
              's/^\(CPPFLAGS_vmlinux\.lds[[:space:]]*:=[^$]*\)$/\1 -DLINKER_SCRIPT/' \
              "$ARM64_LDS_MK"

            echo "[OK] Added -DLINKER_SCRIPT to CPPFLAGS_vmlinux.lds"

          else
            echo "[FAIL] CPPFLAGS_vmlinux.lds not found"
            exit 1
          fi

          echo
          echo "[3] Verify vmlinux.lds.S has no manual PGO marker"

          if grep -q \
              "^#define PGO_CLANG_LINKER$" \
              "$ARM64_LDS_S"; then

            echo "[FAIL] PGO_CLANG_LINKER must not be defined in vmlinux.lds.S"
            exit 1

          else
            echo "[OK] No manual PGO linker marker in vmlinux.lds.S"
          fi

          echo
          echo "[4] Verify linker context"

          grep -n \
            "CPPFLAGS_vmlinux.lds" \
            "$ARM64_LDS_MK"

          echo

          grep -n \
            -B2 -A30 \
            "PGO_CLANG_DATA" \
            "$LDSH"

          echo
          echo "============================================================"
          echo "[OK] PGO linker context configured through -DLINKER_SCRIPT"
          echo "============================================================"

      # ============================================================
      # 9. VERIFY PGO INTEGRATION
      # ============================================================
      - name: Verify PGO Integration
        run: |
          set -e

          echo "============================================================"
          echo "VERIFY PGO INTEGRATION"
          echo "============================================================"

          FAIL=0

          echo
          echo "[1] Root Makefile"

          if grep -n "CFLAGS_PGO_CLANG" Makefile; then
            echo "[OK] CFLAGS_PGO_CLANG found"
          else
            echo "[FAIL] CFLAGS_PGO_CLANG missing"
            FAIL=1
          fi

          echo
          echo "[2] arch/Kconfig"

          if grep -n 'source "kernel/pgo/Kconfig"' arch/Kconfig; then
            echo "[OK] kernel/pgo/Kconfig found"
          else
            echo "[FAIL] kernel/pgo/Kconfig missing"
            FAIL=1
          fi

          echo
          echo "[3] ARM64 Kconfig"

          if grep -n "ARCH_SUPPORTS_PGO_CLANG" arch/arm64/Kconfig; then
            echo "[OK] ARM64 PGO support found"
          else
            echo "[FAIL] ARM64 PGO support missing"
            FAIL=1
          fi

          echo
          echo "[4] ARM64 VDSO"

          if grep -n "PGO_PROFILE := n" \
              arch/arm64/kernel/vdso/Makefile; then
            echo "[OK] VDSO PGO disabled"
          else
            echo "[FAIL] VDSO PGO setting missing"
            FAIL=1
          fi

          echo
          echo "[5] kernel/Makefile"

          if grep -n 'obj-\$(CONFIG_PGO_CLANG).*pgo' \
              kernel/Makefile; then
            echo "[OK] kernel/pgo registered"
          else
            echo "[FAIL] kernel/pgo not registered"
            FAIL=1
          fi

          echo
          echo "[6] scripts/Makefile.lib"

          if grep -n "CFLAGS_PGO_CLANG" \
              scripts/Makefile.lib; then
            echo "[OK] PGO flags integrated"
          else
            echo "[FAIL] PGO flags missing"
            FAIL=1
          fi

          echo
          echo "[7] vmlinux linker"

          if grep -n "__llvm_prf_data" \
              include/asm-generic/vmlinux.lds.h; then
            echo "[OK] LLVM PGO linker sections found"
          else
            echo "[FAIL] LLVM PGO linker sections missing"
            FAIL=1
          fi

          echo
          echo "[8] PGO linker marker"

          if grep -n "^#define PGO_CLANG_LINKER$" \
              arch/arm64/kernel/vmlinux.lds.S; then
            echo "[FAIL] PGO_CLANG_LINKER must not be defined directly in vmlinux.lds.S"
            FAIL=1
          else
            echo "[OK] No manual PGO_CLANG_LINKER definition"
          fi

          echo
          echo "[9] PGO linker CPPFLAGS"

          if grep -n \
              '^CPPFLAGS_vmlinux\.lds.*-DLINKER_SCRIPT' \
              arch/arm64/kernel/Makefile; then
            echo "[OK] LINKER_SCRIPT passed through CPPFLAGS"
          else
            echo "[FAIL] -DLINKER_SCRIPT missing from vmlinux.lds CPPFLAGS"
            FAIL=1
          fi

          echo
          echo "[10] PGO linker condition"

          if grep -n \
              '#if defined(CONFIG_PGO_CLANG) && defined(LINKER_SCRIPT)' \
              include/asm-generic/vmlinux.lds.h; then
            echo "[OK] PGO linker condition correct"
          else
            echo "[FAIL] PGO linker condition incorrect"
            FAIL=1
          fi

          echo
          echo "[11] kernel/pgo files"

          if [ -f kernel/pgo/Kconfig ] && \
             [ -f kernel/pgo/Makefile ] && \
             [ -f kernel/pgo/fs.c ] && \
             [ -f kernel/pgo/instrument.c ] && \
             [ -f kernel/pgo/pgo.h ]; then

            echo "[OK] kernel/pgo files complete"
          else
            echo "[FAIL] kernel/pgo files incomplete"
            FAIL=1
          fi

          echo
          echo "[12] Protected files"

          if git diff --quiet -- arch/arm64/Makefile; then
            echo "[OK] arch/arm64/Makefile unchanged"
          else
            echo "[FAIL] arch/arm64/Makefile was modified"
            FAIL=1
          fi

          if git diff --quiet -- \
              drivers/firmware/efi/libstub/Makefile; then
            echo "[OK] EFI libstub Makefile unchanged"
          else
            echo "[FAIL] EFI libstub Makefile was modified"
            FAIL=1
          fi

          echo
          echo "============================================================"

          if [ "$FAIL" -ne 0 ]; then
            echo "PGO INTEGRATION: FAILED"
            exit 1
          fi

          echo "PGO INTEGRATION: OK"

      # ============================================================
      # 10. RUN VIOLET DEFCONFIG
      # ============================================================
      - name: Run Violet Defconfig
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "VIOLET PERF DEFCONFIG"
          echo "============================================================"

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            vendor/violet-perf_defconfig

          echo
          echo "============================================================"
          echo "CHECK PGO CONFIGURATION"
          echo "============================================================"

          if grep -q "^CONFIG_PGO_CLANG=y$" out/.config; then
            echo "[OK] CONFIG_PGO_CLANG=y"
          else
            echo "[FAIL] CONFIG_PGO_CLANG is not enabled"

            grep -E \
              "CONFIG_(ARCH_SUPPORTS_PGO_CLANG|PGO_CLANG|PROC_FS)=" \
              out/.config || true

            exit 1
          fi

          if grep -q "^CONFIG_ARCH_SUPPORTS_PGO_CLANG=y$" out/.config; then
            echo "[OK] CONFIG_ARCH_SUPPORTS_PGO_CLANG=y"
          else
            echo "[FAIL] CONFIG_ARCH_SUPPORTS_PGO_CLANG is not enabled"
            exit 1
          fi

          if grep -q "^CONFIG_PROC_FS=y$" out/.config; then
            echo "[OK] CONFIG_PROC_FS=y"
          else
            echo "[FAIL] CONFIG_PROC_FS is required"
            exit 1
          fi

          echo
          echo "Relevant configuration:"
          grep -E \
            "CONFIG_(ARCH_SUPPORTS_PGO_CLANG|PGO_CLANG|PROC_FS)=" \
            out/.config

            # ============================================================
      # 11. DEBUG PGO LINKER PREPROCESSING
      # ============================================================
      - name: Debug PGO Linker Preprocessing
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "DEBUG PGO LINKER PREPROCESSING"
          echo "============================================================"

          echo
          echo "[1] Verify source configuration"

          grep -n \
            "CPPFLAGS_vmlinux.lds" \
            arch/arm64/kernel/Makefile

          grep -n \
            -B2 -A30 \
            "PGO_CLANG_DATA" \
            include/asm-generic/vmlinux.lds.h

          echo
          echo "============================================================"
          echo "[2] Ask Kbuild for the vmlinux.lds command"
          echo "============================================================"

          make V=1 -n O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            arch/arm64/kernel/vmlinux.lds \
            2>&1 | tee /tmp/vmlinux-lds-command.log

          echo
          echo "============================================================"
          echo "[3] Extract preprocessing command"
          echo "============================================================"

          grep -E \
            'vmlinux\.lds|LINKER_SCRIPT|cpp|clang' \
            /tmp/vmlinux-lds-command.log \
            || true

          echo
          echo "============================================================"
          echo "[OK] Kbuild command captured"
          echo "============================================================"
          

      # ============================================================
      # 12. CHECK CLANG PGO SUPPORT
      # ============================================================
      - name: Check Clang PGO Support
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "CLANG PGO SUPPORT"
          echo "============================================================"

          cat > pgo_test.c <<'EOF'
          int test_pgo(int x)
          {
              if (x > 100)
                  return x * 2;

              return x + 1;
          }

          int main(void)
          {
              return test_pgo(10);
          }
          EOF

          echo
          echo "Clang:"
          clang --version

          echo
          echo "llvm-profdata:"
          command -v llvm-profdata

          if llvm-profdata merge --help >/dev/null 2>&1; then
            echo "[OK] llvm-profdata merge supported"
          else
            echo "[FAIL] llvm-profdata merge failed"
            exit 1
          fi

          echo
          echo "============================================================"
          echo "TEST -fprofile-generate"
          echo "============================================================"

          clang \
            -O2 \
            -fprofile-generate \
            -c pgo_test.c \
            -o pgo_generate.o

          echo "[OK] -fprofile-generate supported"

          echo
          echo "============================================================"
          echo "TEST -fprofile-instr-generate"
          echo "============================================================"

          clang \
            -O2 \
            -fprofile-instr-generate \
            -c pgo_test.c \
            -o pgo_instr.o

          echo "[OK] -fprofile-instr-generate supported"

          echo
          echo "============================================================"
          echo "TEST -fprofile-instr-use"
          echo "============================================================"

          clang \
            -O2 \
            -fprofile-instr-use=/tmp/nonexistent.profdata \
            -c pgo_test.c \
            -o /dev/null \
            2>pgo-use-error.log || true

          if grep -qi "unknown argument" pgo-use-error.log; then
            echo "[FAIL] -fprofile-instr-use not recognized"
            cat pgo-use-error.log
            exit 1
          fi

          echo "[OK] -fprofile-instr-use recognized"

      # ============================================================
      # 13. BUILD KERNEL WITH PGO
      # ============================================================
      - name: Build Kernel With PGO
        run: |
          set -o pipefail

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "BUILD FULL KERNEL WITH PGO"
          echo "============================================================"

          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            V=1 \
            2>&1 | tee pgo-build.log

          echo
          echo "[OK] Full kernel build completed"

      # ============================================================
      # 14. VERIFY PGO COMPILER FLAGS
      # ============================================================
      - name: Verify PGO Compiler Flags
        run: |
          set -e

          echo "============================================================"
          echo "VERIFY PGO COMPILER FLAGS"
          echo "============================================================"

          if grep -q -- "-fprofile-generate" pgo-build.log; then
            echo "[OK] -fprofile-generate found in kernel build"
          else
            echo "[FAIL] -fprofile-generate not found in kernel build"
            exit 1
          fi

          echo
          echo "Number of occurrences:"
          grep -o -- "-fprofile-generate" pgo-build.log | wc -l

      # ============================================================
      # 15. VERIFY LLVM PGO SECTIONS IN OBJECTS
      # ============================================================
      - name: Verify LLVM PGO Sections
        if: always()
        run: |
          set +e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "VERIFY LLVM PGO SECTIONS IN OBJECTS"
          echo "============================================================"

          FOUND=0

          for OBJ in \
            out/kernel/pgo/fs.o \
            out/kernel/pgo/instrument.o
          do

            echo
            echo "------------------------------------------------------------"
            echo "OBJECT: $OBJ"
            echo "------------------------------------------------------------"

            if [ ! -f "$OBJ" ]; then
              echo "[WARN] Object not found"
              continue
            fi

            echo
            echo "--- ELF SECTIONS ---"

            llvm-readelf -SW "$OBJ" 2>/dev/null | \
              grep -E 'llvm_prf|profile' || true

            echo
            echo "--- LLVM PGO SYMBOLS ---"

            llvm-nm -a "$OBJ" 2>/dev/null | \
              grep -E '__llvm_prf_' || true

            if llvm-readelf -SW "$OBJ" 2>/dev/null | \
                grep -qE 'llvm_prf|profile'; then

              FOUND=1
            fi

          done

          echo
          echo "============================================================"

          if [ "$FOUND" -eq 1 ]; then
            echo "[OK] LLVM PGO sections confirmed in object files"
          else
            echo "[WARN] No LLVM PGO sections found in inspected objects"
          fi

      # ============================================================
      # 16. BUILD VMLINUX
      # ============================================================
      - name: Build Vmlinux With PGO
        run: |
          set -o pipefail

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "BUILD VMLINUX WITH PGO"
          echo "============================================================"

          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            V=1 \
            vmlinux \
            2>&1 | tee vmlinux-build.log

          echo
          echo "[OK] vmlinux build completed"

      # ============================================================
      # 17. VERIFY VMLINUX PGO SECTIONS
      # ============================================================
      - name: Verify Vmlinux PGO Sections
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "VMLINUX PGO SECTIONS"
          echo "============================================================"

          if [ ! -f out/vmlinux ]; then
            echo "[FAIL] out/vmlinux not found"
            exit 1
          fi

          if llvm-readelf -S out/vmlinux | \
              grep -qE 'llvm_prf|profile'; then

            echo "[OK] LLVM PGO sections found in vmlinux"

            echo
            llvm-readelf -SW out/vmlinux | \
              grep -E 'llvm_prf|profile'

          else
            echo "[FAIL] No LLVM PGO sections found in vmlinux"
            exit 1
          fi

      # ============================================================
      # 18. SAVE FINAL CONFIG
      # ============================================================
      - name: Save Final PGO Configuration
        run: |
          set -e

          cp out/.config pgo-final-defconfig

          echo "============================================================"
          echo "FINAL PGO CONFIGURATION"
          echo "============================================================"

          grep -E \
            "CONFIG_(ARCH_SUPPORTS_PGO_CLANG|PGO_CLANG|PROC_FS)=" \
            out/.config

      # ============================================================
      # 19. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload PGO Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-pgo-4.14-r416183b
          path: |
            out/vmlinux
            out/.config
            pgo-final-defconfig
            pgo-build.log
            vmlinux-build.log
            pgo-use-error.log
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # 20. FINAL SUMMARY
      # ============================================================
      - name: Final Summary
        if: always()
        run: |
          echo
          echo "============================================================"
          echo "             CLANG PGO BUILD SUMMARY"
          echo "============================================================"

          echo
          echo "Kernel:"
          git describe --always --dirty --broken || true

          echo
          echo "Branch:"
          git branch --show-current || true

          echo
          echo "Clang:"
          clang --version | head -n 1 || true

          echo
          echo "LLD:"
          ld.lld --version | head -n 1 || true

          echo
          echo "llvm-profdata:"
          command -v llvm-profdata || true

          echo
          echo "PGO configuration:"
          grep -E \
            "CONFIG_(ARCH_SUPPORTS_PGO_CLANG|PGO_CLANG|PROC_FS)=" \
            out/.config 2>/dev/null || true

          echo
          echo "PGO flags:"

          if [ -f pgo-build.log ]; then
            echo "-fprofile-generate occurrences:"
            grep -o -- "-fprofile-generate" pgo-build.log | wc -l || true
          fi

          echo
          echo "PGO linker marker:"
          grep -n \
            "^CPPFLAGS_vmlinux.lds.*-DLINKER_SCRIPT" \
            arch/arm64/kernel/Makefile 2>/dev/null || true

          echo
          echo "PGO linker condition:"
          grep -n \
            "LINKER_SCRIPT" \
            include/asm-generic/vmlinux.lds.h 2>/dev/null || true

          echo
          echo "vmlinux:"

          if [ -f out/vmlinux ]; then
            ls -lh out/vmlinux
          else
            echo "not built"
          fi

          echo
          echo "============================================================"
