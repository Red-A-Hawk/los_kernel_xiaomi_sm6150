name: Build ARM64 Clang PGO v8

on:
  workflow_dispatch:

jobs:
  build-pgo:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            binutils-aarch64-linux-gnu \
            device-tree-compiler \
            cpio \
            python3 \
            unzip

      # ============================================================
      # 3. DOWNLOAD TOOLCHAINS
      # ============================================================
      - name: Download Toolchains
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/toolchains"

          cd "$GITHUB_WORKSPACE/toolchains"

          echo "============================================================"
          echo "Downloading LineageOS Clang r416183b"
          echo "============================================================"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            clang

          echo
          echo "============================================================"
          echo "Downloading GCC64 4.9"
          echo "============================================================"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          echo
          echo "============================================================"
          echo "Downloading GCC32 4.9"
          echo "============================================================"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

      # ============================================================
      # 4. SET TOOLCHAIN ENVIRONMENT
      # ============================================================
      - name: Setup Toolchain Environment
        run: |
          set -e

          export CLANG_PATH="$GITHUB_WORKSPACE/toolchains/clang"
          export GCC64_PATH="$GITHUB_WORKSPACE/toolchains/gcc64"
          export GCC32_PATH="$GITHUB_WORKSPACE/toolchains/gcc32"

          export CROSS_COMPILE="$GCC64_PATH/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GCC32_PATH/bin/arm-linux-androideabi-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"

          echo "CLANG_PATH=$CLANG_PATH" >> "$GITHUB_ENV"
          echo "GCC64_PATH=$GCC64_PATH" >> "$GITHUB_ENV"
          echo "GCC32_PATH=$GCC32_PATH" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE=$CROSS_COMPILE" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32" >> "$GITHUB_ENV"
          echo "CLANG_TRIPLE=$CLANG_TRIPLE" >> "$GITHUB_ENV"

          echo "$CLANG_PATH/bin" >> "$GITHUB_PATH"
          echo "$GCC64_PATH/bin" >> "$GITHUB_PATH"
          echo "$GCC32_PATH/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 5. VERIFY TOOLCHAINS
      # ============================================================
      - name: Verify Toolchains
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "TOOLCHAIN INFORMATION"
          echo "============================================================"

          echo
          echo "Clang:"
          clang --version

          echo
          echo "LLD:"
          ld.lld --version

          echo
          echo "LLVM AR:"
          llvm-ar --version | head -n 1

          echo
          echo "LLVM NM:"
          llvm-nm --version | head -n 1

          echo
          echo "LLVM OBJCOPY:"
          llvm-objcopy --version | head -n 1

          echo
          echo "LLVM OBJDUMP:"
          llvm-objdump --version | head -n 1

          echo
          echo "LLVM READELF:"
          llvm-readelf --version | head -n 1

          echo
          echo "LLVM PROF-DATA:"
          command -v llvm-profdata

          if llvm-profdata merge --help >/dev/null 2>&1; then
            echo "[OK] llvm-profdata merge supported"
          else
            echo "[FAIL] llvm-profdata merge is not functional"
            exit 1
          fi

          echo
          echo "GCC64:"
          aarch64-linux-android-gcc --version | head -n 1

          echo
          echo "GCC32:"
          arm-linux-androideabi-gcc --version | head -n 1

          echo
          echo "============================================================"
          echo "TOOLCHAIN PATHS"
          echo "============================================================"

          command -v clang
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          command -v llvm-objcopy
          command -v llvm-objdump
          command -v llvm-strip
          command -v llvm-readelf
          command -v llvm-profdata
          command -v aarch64-linux-android-gcc
          command -v arm-linux-androideabi-gcc

      # ============================================================
      # 6. DOWNLOAD PGO PATCH
      # ============================================================
      - name: Download PGO Patch
        run: |
          set -e

          PATCH_URL="https://raw.githubusercontent.com/Red-A-Hawk/Patch/kernel_xiaomi_violet/0001-ARM64-Clang-PGO-4.14-RedHawk-final.patch"
          PATCH_FILE="$GITHUB_WORKSPACE/0001-ARM64-Clang-PGO-4.14-RedHawk-final.patch"


          echo "============================================================"
          echo "DOWNLOAD PGO PATCH"
          echo "============================================================"

          wget -O "$PATCH_FILE" "$PATCH_URL"

          echo
          echo "Patch size:"
          wc -c "$PATCH_FILE"

      # ============================================================
      # 7. CHECK AND APPLY PGO PATCH
      # ============================================================
      - name: Apply PGO Patch
        run: |
          set -e

          PATCH_FILE="$GITHUB_WORKSPACE/0001-ARM64-Clang-PGO-4.14-RedHawk-final.patch"

          echo "============================================================"
          echo "CHECK PGO PATCH"
          echo "============================================================"

          git apply --check "$PATCH_FILE"

          echo "[OK] git apply --check passed"

          echo
          echo "============================================================"
          echo "APPLY PGO PATCH"
          echo "============================================================"

          git apply "$PATCH_FILE"

          echo "[OK] PGO patch applied successfully"

          echo
          echo "Changed files:"
          git status --short

      # ============================================================
      # 8. VERIFY PGO INTEGRATION
      # ============================================================
      - name: Verify PGO Integration
        run: |
          set -e

          echo "============================================================"
          echo "VERIFY PGO INTEGRATION"
          echo "============================================================"

          FAIL=0

          echo
          echo "[1] Root Makefile"

          if grep -n "CFLAGS_PGO_CLANG" Makefile; then
            echo "[OK] CFLAGS_PGO_CLANG found"
          else
            echo "[FAIL] CFLAGS_PGO_CLANG missing"
            FAIL=1
          fi

          echo
          echo "[2] arch/Kconfig"

          if grep -n 'source "kernel/pgo/Kconfig"' arch/Kconfig; then
            echo "[OK] kernel/pgo/Kconfig found"
          else
            echo "[FAIL] kernel/pgo/Kconfig missing"
            FAIL=1
          fi

          echo
          echo "[3] ARM64 Kconfig"

          if grep -n "ARCH_SUPPORTS_PGO_CLANG" arch/arm64/Kconfig; then
            echo "[OK] ARM64 PGO support found"
          else
            echo "[FAIL] ARM64 PGO support missing"
            FAIL=1
          fi

          echo
          echo "[4] ARM64 VDSO"

          if grep -n "PGO_PROFILE := n" \
              arch/arm64/kernel/vdso/Makefile; then
            echo "[OK] VDSO PGO disabled"
          else
            echo "[FAIL] VDSO PGO setting missing"
            FAIL=1
          fi

          echo
          echo "[5] kernel/Makefile"

          if grep -n 'obj-\$(CONFIG_PGO_CLANG).*pgo' \
              kernel/Makefile; then
            echo "[OK] kernel/pgo registered"
          else
            echo "[FAIL] kernel/pgo not registered"
            FAIL=1
          fi

          echo
          echo "[6] scripts/Makefile.lib"

          if grep -n "CFLAGS_PGO_CLANG" \
              scripts/Makefile.lib; then
            echo "[OK] PGO flags integrated"
          else
            echo "[FAIL] PGO flags missing"
            FAIL=1
          fi

          echo
          echo "[7] vmlinux linker"

          if grep -n "__llvm_prf_data" \
              include/asm-generic/vmlinux.lds.h; then
            echo "[OK] __llvm_prf_data found"
          else
            echo "[FAIL] __llvm_prf_data missing"
            FAIL=1
          fi

          echo
          echo "[8] kernel/pgo files"

          if [ -f kernel/pgo/Kconfig ] && \
             [ -f kernel/pgo/Makefile ] && \
             [ -f kernel/pgo/fs.c ] && \
             [ -f kernel/pgo/instrument.c ] && \
             [ -f kernel/pgo/pgo.h ]; then
            echo "[OK] kernel/pgo files complete"
          else
            echo "[FAIL] kernel/pgo files incomplete"
            FAIL=1
          fi

          echo
          echo "[9] Protected files"

          if git diff --quiet -- arch/arm64/Makefile; then
            echo "[OK] arch/arm64/Makefile unchanged"
          else
            echo "[FAIL] arch/arm64/Makefile was modified"
            FAIL=1
          fi

          if git diff --quiet -- \
              drivers/firmware/efi/libstub/Makefile; then
            echo "[OK] EFI libstub Makefile unchanged"
          else
            echo "[FAIL] EFI libstub Makefile was modified"
            FAIL=1
          fi

          echo
          echo "============================================================"

          if [ "$FAIL" -ne 0 ]; then
            echo "PGO INTEGRATION: FAILED"
            exit 1
          fi

          echo "PGO INTEGRATION: OK"

      # ============================================================
      # 9. RUN VIOLET DEFCONFIG
      # ============================================================
      - name: Run Violet Defconfig
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "VIOLET PERF DEFCONFIG"
          echo "============================================================"

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            vendor/violet-perf_defconfig

          echo
          echo "============================================================"
          echo "CHECK PGO CONFIGURATION"
          echo "============================================================"

          if grep -q "^CONFIG_PGO_CLANG=y$" out/.config; then
            echo "[OK] CONFIG_PGO_CLANG=y"
          else
            echo "[FAIL] CONFIG_PGO_CLANG is not enabled"
            grep -E \
              "CONFIG_(ARCH_SUPPORTS_PGO_CLANG|PGO_CLANG|PROC_FS)=" \
              out/.config || true
            exit 1
          fi

          if grep -q "^CONFIG_ARCH_SUPPORTS_PGO_CLANG=y$" out/.config; then
            echo "[OK] CONFIG_ARCH_SUPPORTS_PGO_CLANG=y"
          else
            echo "[FAIL] CONFIG_ARCH_SUPPORTS_PGO_CLANG is not enabled"
            exit 1
          fi

          if grep -q "^CONFIG_PROC_FS=y$" out/.config; then
            echo "[OK] CONFIG_PROC_FS=y"
          else
            echo "[FAIL] CONFIG_PROC_FS is required"
            exit 1
          fi

          echo
          echo "Relevant configuration:"
          grep -E \
            "CONFIG_(ARCH_SUPPORTS_PGO_CLANG|PGO_CLANG|PROC_FS)=" \
            out/.config

      # ============================================================
      # 10. CHECK CLANG PGO SUPPORT
      # ============================================================
      - name: Check Clang PGO Support
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "CLANG PGO SUPPORT"
          echo "============================================================"

          cat > pgo_test.c <<'EOF'
          int test_pgo(int x)
          {
              if (x > 100)
                  return x * 2;

              return x + 1;
          }

          int main(void)
          {
              return test_pgo(10);
          }
          EOF

          echo
          echo "Clang:"
          clang --version

          echo
          echo "llvm-profdata:"
          command -v llvm-profdata

          if llvm-profdata merge --help >/dev/null 2>&1; then
            echo "[OK] llvm-profdata merge supported"
          else
            echo "[FAIL] llvm-profdata merge failed"
            exit 1
          fi

          echo
          echo "============================================================"
          echo "TEST -fprofile-generate"
          echo "============================================================"

          clang \
            -O2 \
            -fprofile-generate \
            -c pgo_test.c \
            -o pgo_generate.o

          echo "[OK] -fprofile-generate supported"

          echo
          echo "============================================================"
          echo "TEST -fprofile-instr-generate"
          echo "============================================================"

          clang \
            -O2 \
            -fprofile-instr-generate \
            -c pgo_test.c \
            -o pgo_instr.o

          echo "[OK] -fprofile-instr-generate supported"

          echo
          echo "============================================================"
          echo "TEST -fprofile-instr-use"
          echo "============================================================"

          clang \
            -O2 \
            -fprofile-instr-use=/tmp/nonexistent.profdata \
            -c pgo_test.c \
            -o /dev/null \
            2>pgo-use-error.log || true

          if grep -qi "unknown argument" pgo-use-error.log; then
            echo "[FAIL] -fprofile-instr-use not recognized"
            cat pgo-use-error.log
            exit 1
          fi

          echo "[OK] -fprofile-instr-use recognized"

      # ============================================================
      # 11. BUILD KERNEL WITH PGO
      # ============================================================
      - name: Build Kernel With PGO
        run: |
          set -o pipefail

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "BUILD KERNEL WITH PGO"
          echo "============================================================"

          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            V=1 \
            kernel/ \
            2>&1 | tee pgo-build.log

          echo
          echo "[OK] kernel/ build completed"

      # ============================================================
      # 12. VERIFY PGO FLAGS
      # ============================================================
      - name: Verify PGO Compiler Flags
        run: |
          set -e

          echo "============================================================"
          echo "VERIFY PGO COMPILER FLAGS"
          echo "============================================================"

          if grep -q -- "-fprofile-generate" pgo-build.log; then
            echo "[OK] -fprofile-generate found in kernel build"
          else
            echo "[FAIL] -fprofile-generate not found in kernel build"
            exit 1
          fi

          echo
          echo "Number of occurrences:"
          grep -o -- "-fprofile-generate" pgo-build.log | wc -l

      # ============================================================
      # 13. VERIFY LLVM PGO SECTIONS
      # ============================================================
      - name: Verify LLVM PGO Sections
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "VERIFY LLVM PGO SECTIONS"
          echo "============================================================"

          FOUND=0

          while IFS= read -r -d '' obj; do

            if llvm-readelf -S "$obj" 2>/dev/null | \
                grep -q "__llvm_prf_"; then

              echo "[OK] PGO sections found in:"
              echo "$obj"

              llvm-readelf -S "$obj" 2>/dev/null | \
                grep "__llvm_prf_"

              FOUND=1
              break
            fi

          done < <(
            find out/kernel \
              -type f \
              -name "*.o" \
              -print0 2>/dev/null
          )

          if [ "$FOUND" -eq 0 ]; then
            echo "[FAIL] No __llvm_prf_* sections found"
            exit 1
          fi

      # ============================================================
      # 14. BUILD VMLINUX
      # ============================================================
      - name: Build Vmlinux With PGO
        run: |
          set -o pipefail

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "BUILD VMLINUX WITH PGO"
          echo "============================================================"

          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            V=1 \
            vmlinux \
            2>&1 | tee vmlinux-build.log

          echo
          echo "[OK] vmlinux build completed"

      # ============================================================
      # 15. VERIFY VMLINUX PGO SECTIONS
      # ============================================================
      - name: Verify Vmlinux PGO Sections
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "VMLINUX PGO SECTIONS"
          echo "============================================================"

          if [ ! -f out/vmlinux ]; then
            echo "[FAIL] out/vmlinux not found"
            exit 1
          fi

          if llvm-readelf -S out/vmlinux | grep -q "__llvm_prf_"; then
            echo "[OK] LLVM PGO sections found in vmlinux"

            echo
            llvm-readelf -S out/vmlinux | \
              grep "__llvm_prf_"
          else
            echo "[FAIL] No LLVM PGO sections found in vmlinux"
            exit 1
          fi

      # ============================================================
      # 16. SAVE FINAL CONFIG
      # ============================================================
      - name: Save Final PGO Configuration
        run: |
          set -e

          cp out/.config pgo-final-defconfig

          echo "============================================================"
          echo "FINAL PGO CONFIGURATION"
          echo "============================================================"

          grep -E \
            "CONFIG_(ARCH_SUPPORTS_PGO_CLANG|PGO_CLANG|PROC_FS)=" \
            out/.config

      # ============================================================
      # 17. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload PGO Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-pgo-4.14-r416183b
          path: |
            out/vmlinux
            out/.config
            pgo-final-defconfig
            pgo-build.log
            vmlinux-build.log
            pgo-use-error.log
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # 18. FINAL SUMMARY
      # ============================================================
      - name: Final Summary
        if: always()
        run: |
          echo
          echo "============================================================"
          echo "             CLANG PGO BUILD SUMMARY"
          echo "============================================================"

          echo
          echo "Kernel:"
          git describe --always --dirty --broken || true

          echo
          echo "Branch:"
          git branch --show-current || true

          echo
          echo "Clang:"
          clang --version | head -n 1 || true

          echo
          echo "LLD:"
          ld.lld --version | head -n 1 || true

          echo
          echo "llvm-profdata:"
          command -v llvm-profdata || true

          echo
          echo "PGO configuration:"
          grep -E \
            "CONFIG_(ARCH_SUPPORTS_PGO_CLANG|PGO_CLANG|PROC_FS)=" \
            out/.config 2>/dev/null || true

          echo
          echo "PGO flags:"
          if [ -f pgo-build.log ]; then
            echo "-fprofile-generate occurrences:"
            grep -o -- "-fprofile-generate" pgo-build.log | wc -l || true
          fi

          echo
          echo "vmlinux:"
          if [ -f out/vmlinux ]; then
            ls -lh out/vmlinux
          else
            echo "not built"
          fi

          echo
          echo "============================================================"
