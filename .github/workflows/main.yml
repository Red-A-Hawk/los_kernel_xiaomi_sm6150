name: Generate Modern Violet Defconfig

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            make \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            python3

      - name: Show source information
        run: |
          set -e

          echo "========================================"
          echo "KERNEL SOURCE"
          echo "========================================"

          git branch --show-current || true
          git rev-parse HEAD

          echo
          echo "Kernel Makefile:"
          head -20 Makefile

          echo
          echo "Available vendor configs:"
          ls -lah arch/arm64/configs/vendor/

      - name: Check Violet config
        run: |
          set -e

          CONFIG="arch/arm64/configs/vendor/violet.config"

          echo "========================================"
          echo "CHECKING VIOLET CONFIG"
          echo "========================================"

          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: $CONFIG not found"
            exit 1
          fi

          echo "Found:"
          ls -lh "$CONFIG"

          echo
          echo "Lines:"
          wc -l "$CONFIG"

          echo
          echo "First lines:"
          head -20 "$CONFIG"

      - name: Prepare output directory
        run: |
          set -e

          rm -rf out
          mkdir -p out

      - name: Generate base configuration
        run: |
          set -e

          echo "========================================"
          echo "GENERATING BASE CONFIG"
          echo "========================================"

          make \
            O="$PWD/out" \
            ARCH=arm64 \
            defconfig

      - name: Merge Violet configuration
        run: |
          set -e

          echo "========================================"
          echo "MERGING VIOLET CONFIG"
          echo "========================================"

          ./scripts/kconfig/merge_config.sh \
            -O "$PWD/out" \
            "$PWD/out/.config" \
            "$PWD/arch/arm64/configs/vendor/violet.config"

      - name: Resolve final configuration
        run: |
          set -e

          echo "========================================"
          echo "RESOLVING CONFIGURATION"
          echo "========================================"

          make \
            O="$PWD/out" \
            ARCH=arm64 \
            olddefconfig

      - name: Verify generated configuration
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING GENERATED CONFIG"
          echo "========================================"

          test -f out/.config

          echo
          echo "Generated .config:"
          ls -lh out/.config

          echo
          echo "Violet-related options:"
          grep -E \
            'CONFIG_(MACH_XIAOMI_VIOLET|ARCH_SM6150|ARCH_QCOM|INPUT_FINGERPRINT|FINGERPRINT_|SND_SOC_TAS2563|TAS2563_)' \
            out/.config || true

          echo
          echo "Architecture:"
          grep -E \
            'CONFIG_(ARM64|ARCH_QCOM|ARCH_SM6150)' \
            out/.config || true

      - name: Generate minimal defconfig
        run: |
          set -e

          echo "========================================"
          echo "GENERATING MODERN DEFCONFIG"
          echo "========================================"

          make \
            O="$PWD/out" \
            ARCH=arm64 \
            savedefconfig

          test -f out/defconfig

          cp out/defconfig violet-perf_defconfig

          echo
          echo "Generated defconfig:"
          ls -lh violet-perf_defconfig

          echo
          echo "Line count:"
          wc -l violet-perf_defconfig

      - name: Re-test generated defconfig
        run: |
          set -e

          echo "========================================"
          echo "RE-TESTING GENERATED DEFCONFIG"
          echo "========================================"

          rm -rf verify
          mkdir -p verify

          cp violet-perf_defconfig \
            verify/violet-perf_defconfig

          cd verify

          make \
            -f ../Makefile \
            O="$PWD" \
            ARCH=arm64 \
            KCONFIG_CONFIG="$PWD/violet-perf_defconfig" \
            olddefconfig

          test -f "$PWD/violet-perf_defconfig"

          echo
          echo "Defconfig successfully re-read by Kconfig."

      - name: Compare generated configuration
        run: |
          set -e

          echo "========================================"
          echo "FINAL CONFIG CHECK"
          echo "========================================"

          echo
          echo "Generated defconfig:"
          wc -l violet-perf_defconfig

          echo
          echo "Important options:"
          grep -E \
            'CONFIG_(MACH_XIAOMI_VIOLET|ARCH_SM6150|ARCH_QCOM|INPUT_FINGERPRINT|FINGERPRINT_|SND_SOC_TAS2563|TAS2563_)' \
            violet-perf_defconfig || true

          echo
          echo "Last 20 lines:"
          tail -20 violet-perf_defconfig

      - name: Upload modern Violet defconfig
        uses: actions/upload-artifact@v4
        with:
          name: modern-violet-defconfig
          path: violet-perf_defconfig
          if-no-files-found: error

      - name: Upload generated full config
        uses: actions/upload-artifact@v4
        with:
          name: modern-violet-full-config
          path: out/.config
          if-no-files-found: error
