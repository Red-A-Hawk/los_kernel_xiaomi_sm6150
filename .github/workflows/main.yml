name: Generate Modern Violet Defconfig (Fixed)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex libssl-dev libelf-dev libncurses-dev \
            build-essential gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3

      # ============================================================
      # الخطوة الحاسمة الجديدة: نطبع محتوى مجلدات الكونفيغ فعليًا
      # بدل الافتراض. هذا يكشف أي defconfig كامل موجود فعلاً،
      # وأي fragments (.config) موجودة لجهاز violet.
      # ============================================================
      - name: List all available kernel configs (DIAGNOSTIC)
        run: |
          echo "========================================"
          echo "ALL FILES IN arch/arm64/configs/"
          echo "========================================"
          ls -la arch/arm64/configs/

          echo
          echo "========================================"
          echo "ALL FILES IN arch/arm64/configs/vendor/"
          echo "========================================"
          ls -la arch/arm64/configs/vendor/

          echo
          echo "========================================"
          echo "ANY FILE CONTAINING 'violet' (full recursive search)"
          echo "========================================"
          find . -iname "*violet*" -type f 2>/dev/null | grep -v "\.git" || echo "none found"

      - name: Determine correct base defconfig
        id: pick_base
        run: |
          set -e
          # نفضّل ملف defconfig الكامل الخاص بالجهاز إن وُجد
          if [ -f arch/arm64/configs/vendor/violet-perf_defconfig ]; then
            echo "BASE=vendor/violet-perf_defconfig" >> $GITHUB_OUTPUT
            echo "Found full device defconfig: vendor/violet-perf_defconfig"
          elif [ -f arch/arm64/configs/vendor/violet_defconfig ]; then
            echo "BASE=vendor/violet_defconfig" >> $GITHUB_OUTPUT
            echo "Found full device defconfig: vendor/violet_defconfig"
          else
            echo "::error::No full violet defconfig found. Only a fragment (violet.config) exists."
            echo "::error::You must inspect the diagnostic listing above and pick the correct"
            echo "::error::platform-wide base defconfig manually (it will NOT be arch/arm64/configs/defconfig)."
            exit 1
          fi

      - name: Generate base configuration from the correct device defconfig
        run: |
          set -e
          rm -rf out
          mkdir -p out
          make O=out ARCH=arm64 ${{ steps.pick_base.outputs.BASE }}
          test -f out/.config
          echo "Base config generated from ${{ steps.pick_base.outputs.BASE }}"

      - name: Merge latest Violet fragment on top (picks up newest updates)
        run: |
          set -e
          if [ -f arch/arm64/configs/vendor/violet.config ]; then
            ./scripts/kconfig/merge_config.sh -O out out/.config arch/arm64/configs/vendor/violet.config
          else
            echo "No violet.config fragment found, skipping merge."
          fi

      - name: Resolve configuration
        run: |
          set -e
          make O=out ARCH=arm64 olddefconfig
          test -f out/.config

      - name: Sanity check - must be Qualcomm/QCOM based, not generic ARM64
        run: |
          set -e
          echo "Checking for QCOM platform markers (should be present):"
          grep -E "^CONFIG_QCOM_SCM=y|^CONFIG_ARCH_QCOM" out/.config || \
            (echo "::error::Resulting config has NO Qualcomm markers - wrong base was used!" && exit 1)

          echo
          echo "Checking for generic/server markers (should be ABSENT):"
          if grep -qE "^CONFIG_ACPI=y|^CONFIG_KVM=y|^CONFIG_DRM_NOUVEAU" out/.config; then
            echo "::error::Resulting config contains generic ARM64/server options - wrong base was used!"
            exit 1
          fi
          echo "OK: config looks like a genuine Qualcomm sm6150 config."

      - name: Save full resolved config
        run: cp out/.config violet-full.config

      - name: Generate final defconfig
        run: |
          set -e
          make O=out ARCH=arm64 savedefconfig
          cp out/defconfig violet-perf_defconfig
          cat violet-perf_defconfig

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modern-violet-defconfig
          path: |
            violet-perf_defconfig
            violet-full.config
          if-no-files-found: error
          
