name: Generate Modern Violet Defconfig

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          sudo apt update

          sudo apt install -y \
            git \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            make \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            python3

      - name: Check source
        run: |
          set -e

          echo "========================================"
          echo "SOURCE CHECK"
          echo "========================================"

          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Branch:"
          git branch --show-current || true

          echo
          echo "Violet config:"
          test -f arch/arm64/configs/vendor/violet.config
          ls -lh arch/arm64/configs/vendor/violet.config

      - name: Clean output
        run: |
          set -e

          rm -rf out
          rm -rf verify

          mkdir -p out

      - name: Generate base configuration
        run: |
          set -e

          echo "========================================"
          echo "BASE DEFCONFIG"
          echo "========================================"

          make \
            O="$PWD/out" \
            ARCH=arm64 \
            defconfig

          test -f out/.config

      - name: Merge Violet configuration
        run: |
          set -e

          echo "========================================"
          echo "MERGING VIOLET CONFIG"
          echo "========================================"

          ./scripts/kconfig/merge_config.sh \
            -O "$PWD/out" \
            "$PWD/out/.config" \
            "$PWD/arch/arm64/configs/vendor/violet.config"

      - name: Resolve configuration
        run: |
          set -e

          echo "========================================"
          echo "OLDDEFCONFIG"
          echo "========================================"

          make \
            O="$PWD/out" \
            ARCH=arm64 \
            olddefconfig

          test -f out/.config

      - name: Check Violet configuration
        run: |
          set -e

          echo "========================================"
          echo "VIOLET CONFIGURATION"
          echo "========================================"

          echo
          echo "--- Architecture ---"

          grep -E \
            '^CONFIG_(ARM64|ARCH_QCOM|ARCH_SM6150)=' \
            out/.config || true

          echo
          echo "--- Device ---"

          grep -Ei \
            'VIOLET|XIAOMI' \
            out/.config || true

          echo
          echo "--- Fingerprint ---"

          grep -E \
            '^CONFIG_(INPUT_FINGERPRINT|FINGERPRINT_)' \
            out/.config || true

          echo
          echo "--- Audio ---"

          grep -E \
            '^CONFIG_(SND_SOC_TAS2563|TAS2563_)' \
            out/.config || true

      - name: Generate modern defconfig
        run: |
          set -e

          echo "========================================"
          echo "SAVING MODERN DEFCONFIG"
          echo "========================================"

          make \
            O="$PWD/out" \
            ARCH=arm64 \
            savedefconfig

          test -f out/defconfig

          cp out/defconfig violet-perf_defconfig

          echo
          echo "Generated:"
          ls -lh violet-perf_defconfig

          echo
          echo "Lines:"
          wc -l violet-perf_defconfig

      - name: Re-test generated defconfig
        run: |
          set -e

          echo "========================================"
          echo "RE-TESTING GENERATED DEFCONFIG"
          echo "========================================"

          rm -rf verify

          mkdir -p verify

          cp violet-perf_defconfig \
            verify/violet-perf_defconfig

          make \
            O="$PWD/verify" \
            ARCH=arm64 \
            KCONFIG_CONFIG="$PWD/verify/violet-perf_defconfig" \
            olddefconfig

          test -f verify/violet-perf_defconfig

          echo
          echo "Re-test successful."

      - name: Compare regenerated config
        run: |
          set -e

          echo "========================================"
          echo "FINAL VALIDATION"
          echo "========================================"

          echo
          echo "Original generated defconfig:"
          wc -l violet-perf_defconfig

          echo
          echo "Re-tested defconfig:"
          wc -l verify/violet-perf_defconfig

          echo
          echo "Important Violet options:"

          grep -E \
            '^CONFIG_(ARM64|ARCH_QCOM|ARCH_SM6150|INPUT_FINGERPRINT|FINGERPRINT_|SND_SOC_TAS2563|TAS2563_)' \
            verify/violet-perf_defconfig || true

      - name: Upload modern Violet defconfig
        uses: actions/upload-artifact@v4
        with:
          name: modern-violet-defconfig
          path: violet-perf_defconfig
          if-no-files-found: error

      - name: Upload full generated config
        uses: actions/upload-artifact@v4
        with:
          name: modern-violet-full-config
          path: out/.config
          if-no-files-found: error

      - name: Upload verification config
        uses: actions/upload-artifact@v4
        with:
          name: modern-violet-verified-config
          path: verify/violet-perf_defconfig
          if-no-files-found: error
