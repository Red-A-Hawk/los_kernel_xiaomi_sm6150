name: Generate Modern Violet Defconfig

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: hawki
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            build-essential \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            python3

      - name: Verify kernel tree
        run: |
          set -e

          echo "========================================"
          echo "KERNEL TREE"
          echo "========================================"

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "Required files:"

          test -f Makefile
          test -f arch/arm64/Kconfig
          test -f arch/arm64/Makefile
          test -f arch/arm64/configs/defconfig
          test -f arch/arm64/configs/vendor/violet.config
          test -f scripts/kconfig/merge_config.sh

          echo "All required files found."

      - name: Inspect Violet definition
        run: |
          set +e

          echo "========================================"
          echo "VIOLET SOURCE ANALYSIS"
          echo "========================================"

          echo
          echo "=== vendor/violet.config ==="
          cat arch/arm64/configs/vendor/violet.config

          echo
          echo "=== Violet references ==="

          grep -Rni "violet" \
            arch/arm64/Kconfig \
            arch/arm64/Kconfig.platforms \
            arch/arm64/configs \
            arch/arm64/boot/dts \
            2>/dev/null | head -300 || true

          echo
          echo "=== SM6150 references ==="

          grep -Rni "SM6150" \
            arch/arm64/Kconfig \
            arch/arm64/Kconfig.platforms \
            arch/arm64/configs \
            arch/arm64/boot/dts \
            2>/dev/null | head -300 || true

          echo
          echo "=== Xiaomi references ==="

          grep -Rni "XIAOMI" \
            arch/arm64/Kconfig \
            arch/arm64/Kconfig.platforms \
            arch/arm64/configs \
            arch/arm64/boot/dts \
            2>/dev/null | head -300 || true

          echo
          echo "=== Violet device-tree files ==="

          find arch/arm64/boot/dts \
            -type f \
            \( -iname '*violet*' -o -iname '*sm6150*' \) \
            -print 2>/dev/null | sort

      - name: Generate base configuration
        run: |
          set -e

          rm -rf out
          mkdir -p out

          echo "========================================"
          echo "GENERATING BASE CONFIG"
          echo "========================================"

          make O=out ARCH=arm64 defconfig

          test -f out/.config

          echo
          echo "Base configuration generated."

      - name: Merge Violet configuration
        run: |
          set -e

          echo "========================================"
          echo "MERGING VIOLET CONFIG"
          echo "========================================"

          ./scripts/kconfig/merge_config.sh \
            -O out \
            out/.config \
            arch/arm64/configs/vendor/violet.config

      - name: Resolve configuration
        run: |
          set -e

          echo "========================================"
          echo "RESOLVING CONFIGURATION"
          echo "========================================"

          make O=out ARCH=arm64 olddefconfig

          test -f out/.config

      - name: Analyze resolved configuration
        run: |
          set +e

          echo "========================================"
          echo "RESOLVED CONFIGURATION"
          echo "========================================"

          echo
          echo "=== VIOLET ==="
          grep -Ei 'violet' out/.config || true

          echo
          echo "=== XIAOMI ==="
          grep -Ei 'xiaomi' out/.config || true

          echo
          echo "=== SM6150 ==="
          grep -Ei 'sm6150' out/.config || true

          echo
          echo "=== QCOM ==="
          grep -Ei '^CONFIG_.*QCOM.*=' out/.config || true

          echo
          echo "=== ARM64 ==="
          grep -Ei '^CONFIG_ARCH.*=' out/.config || true

          echo
          echo "=== FINGERPRINT ==="
          grep -Ei \
            '^CONFIG_INPUT_FINGERPRINT=|^CONFIG_FINGERPRINT_' \
            out/.config || true

          echo
          echo "=== TOUCHSCREEN ==="
          grep -Ei \
            '^CONFIG_.*(FTS|NVT|NT36|GOODIX).*=' \
            out/.config || true

          echo
          echo "=== AUDIO ==="
          grep -Ei \
            '^CONFIG_.*TAS2563.*=' \
            out/.config || true

      - name: Generate modern Violet defconfig
        run: |
          set -e

          echo "========================================"
          echo "GENERATING DEFCONFIG"
          echo "========================================"

          make O=out ARCH=arm64 savedefconfig

          test -f out/defconfig

          cp out/defconfig violet-perf_defconfig

          echo
          echo "Generated defconfig:"
          wc -l violet-perf_defconfig

      - name: Show generated defconfig
        run: |
          echo "========================================"
          echo "GENERATED VIOLET DEFCONFIG"
          echo "========================================"

          cat violet-perf_defconfig

      - name: Re-validate generated defconfig
        run: |
          set -e

          echo "========================================"
          echo "RE-VALIDATING GENERATED DEFCONFIG"
          echo "========================================"

          rm -rf verify
          mkdir -p verify

          cp violet-perf_defconfig verify/.config

          make \
            O=verify \
            ARCH=arm64 \
            olddefconfig

          test -f verify/.config

          echo
          echo "Generated defconfig successfully reconstructed."

          echo
          echo "=== RECONSTRUCTED CONFIG ==="

          grep -Ei 'violet|xiaomi|sm6150' \
            verify/.config || true

          echo
          echo "=== FINGERPRINT ==="

          grep -Ei \
            '^CONFIG_INPUT_FINGERPRINT=|^CONFIG_FINGERPRINT_' \
            verify/.config || true

          echo
          echo "=== AUDIO ==="

          grep -Ei \
            '^CONFIG_.*TAS2563.*=' \
            verify/.config || true

          echo
          echo "=== CONFIG SIZE ==="

          wc -l verify/.config

      - name: Compare generated config
        run: |
          set -e

          echo "========================================"
          echo "CONFIG COMPARISON"
          echo "========================================"

          make \
            O=verify \
            ARCH=arm64 \
            savedefconfig

          echo
          echo "Comparing generated defconfig with reconstructed defconfig..."

          diff -u \
            violet-perf_defconfig \
            verify/defconfig \
            > defconfig.diff || true

          if [ -s defconfig.diff ]; then
            echo
            echo "Differences found:"
            cat defconfig.diff
          else
            echo
            echo "Defconfig is stable."
          fi

      - name: Upload modern Violet defconfig
        uses: actions/upload-artifact@v4
        with:
          name: modern-violet-defconfig
          path: violet-perf_defconfig
          if-no-files-found: error

      - name: Upload full resolved config
        uses: actions/upload-artifact@v4
        with:
          name: violet-full-config
          path: out/.config
          if-no-files-found: error

      - name: Upload verification config
        uses: actions/upload-artifact@v4
        with:
          name: violet-verification-config
          path: verify/.config
          if-no-files-found: error

      - name: Upload config comparison
        uses: actions/upload-artifact@v4
        with:
          name: violet-defconfig-comparison
          path: defconfig.diff
          if-no-files-found: warn
