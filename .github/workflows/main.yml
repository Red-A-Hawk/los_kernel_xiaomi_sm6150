name: Generate Modern Violet Defconfig

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            build-essential \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            python3

      - name: Verify kernel tree
        run: |
          set -e

          echo "========================================"
          echo "KERNEL TREE"
          echo "========================================"

          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "Checking required files..."

          test -f Makefile
          test -f arch/arm64/Kconfig
          test -f arch/arm64/Makefile
          test -f arch/arm64/configs/defconfig
          test -f arch/arm64/configs/vendor/violet.config
          test -f scripts/kconfig/merge_config.sh

          echo
          echo "All required files found."

      - name: Generate base configuration
        run: |
          set -e

          echo "========================================"
          echo "GENERATE BASE CONFIG"
          echo "========================================"

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            defconfig

          test -f out/.config

          echo
          echo "Base config generated successfully."

      - name: Merge Violet configuration
        run: |
          set -e

          echo "========================================"
          echo "MERGE VIOLET CONFIG"
          echo "========================================"

          ./scripts/kconfig/merge_config.sh \
            -O out \
            out/.config \
            arch/arm64/configs/vendor/violet.config

      - name: Resolve Violet configuration
        run: |
          set -e

          echo "========================================"
          echo "RESOLVE CONFIG"
          echo "========================================"

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          test -f out/.config

          echo
          echo "Resolved configuration created."

      - name: Validate Violet configuration
        run: |
          set +e

          echo "========================================"
          echo "VIOLET CONFIGURATION"
          echo "========================================"

          echo
          echo "--- Architecture ---"

          grep -Ei \
            '^CONFIG_ARCH_|^CONFIG_ARM64=' \
            out/.config || true

          echo
          echo "--- Device ---"

          grep -Ei \
            'VIOLET|XIAOMI|SM6150' \
            out/.config || true

          echo
          echo "--- Fingerprint ---"

          grep -Ei \
            '^CONFIG_INPUT_FINGERPRINT=|^CONFIG_FINGERPRINT_' \
            out/.config || true

          echo
          echo "--- Audio ---"

          grep -Ei \
            '^CONFIG_.*TAS2563.*=' \
            out/.config || true

          echo
          echo "--- Touchscreen ---"

          grep -Ei \
            '^CONFIG_.*(FTS|NVT|NT36|GOODIX).*=' \
            out/.config || true

      - name: Save resolved config
        run: |
          set -e

          echo "========================================"
          echo "SAVE RESOLVED CONFIG"
          echo "========================================"

          cp out/.config violet-full.config

          test -f violet-full.config

          echo
          echo "Full resolved config saved."

          wc -l violet-full.config

      - name: Generate modern defconfig
        run: |
          set -e

          echo "========================================"
          echo "GENERATE MODERN VIOLET DEFCONFIG"
          echo "========================================"

          make \
            O=out \
            ARCH=arm64 \
            savedefconfig

          test -f out/defconfig

          cp out/defconfig violet-perf_defconfig

          test -f violet-perf_defconfig

          echo
          echo "Modern Violet defconfig generated."

          echo
          echo "Lines:"
          wc -l violet-perf_defconfig

      - name: Show generated defconfig
        run: |
          set -e

          echo "========================================"
          echo "GENERATED VIOLET DEFCONFIG"
          echo "========================================"

          cat violet-perf_defconfig

      - name: Re-validate generated defconfig
        run: |
          set -e

          echo "========================================"
          echo "RE-VALIDATING GENERATED DEFCONFIG"
          echo "========================================"

          rm -rf verify
          mkdir -p verify

          cp violet-perf_defconfig verify/.config

          make \
            O=verify \
            ARCH=arm64 \
            olddefconfig

          test -f verify/.config

          echo
          echo "Defconfig successfully reconstructed."

          echo
          echo "Checking Violet-related options..."

          grep -Ei \
            'VIOLET|XIAOMI|SM6150' \
            verify/.config || true

          echo
          echo "Checking fingerprint..."

          grep -Ei \
            '^CONFIG_INPUT_FINGERPRINT=|^CONFIG_FINGERPRINT_' \
            verify/.config || true

          echo
          echo "Checking audio..."

          grep -Ei \
            '^CONFIG_.*TAS2563.*=' \
            verify/.config || true

      - name: Test defconfig stability
        run: |
          set -e

          echo "========================================"
          echo "TEST DEFCONFIG STABILITY"
          echo "========================================"

          make \
            O=verify \
            ARCH=arm64 \
            savedefconfig

          test -f verify/defconfig

          cp verify/defconfig verify-violet-perf_defconfig

          if cmp -s violet-perf_defconfig verify-violet-perf_defconfig; then
            echo
            echo "========================================"
            echo "DEFCONFIG IS STABLE"
            echo "========================================"
          else
            echo
            echo "========================================"
            echo "WARNING: DEFCONFIG CHANGED"
            echo "========================================"

            diff -u \
              violet-perf_defconfig \
              verify-violet-perf_defconfig \
              || true
          fi

      - name: Create report
        run: |
          set -e

          echo "========================================" > violet-report.txt
          echo "MODERN VIOLET DEFCONFIG REPORT" >> violet-report.txt
          echo "========================================" >> violet-report.txt

          echo >> violet-report.txt
          echo "Commit:" >> violet-report.txt
          git rev-parse HEAD >> violet-report.txt

          echo >> violet-report.txt
          echo "Branch:" >> violet-report.txt
          git branch --show-current >> violet-report.txt

          echo >> violet-report.txt
          echo "Defconfig lines:" >> violet-report.txt
          wc -l violet-perf_defconfig >> violet-report.txt

          echo >> violet-report.txt
          echo "Violet / Xiaomi / SM6150:" >> violet-report.txt
          grep -Ei \
            'VIOLET|XIAOMI|SM6150' \
            violet-full.config \
            >> violet-report.txt || true

          echo >> violet-report.txt
          echo "Fingerprint:" >> violet-report.txt
          grep -Ei \
            '^CONFIG_INPUT_FINGERPRINT=|^CONFIG_FINGERPRINT_' \
            violet-full.config \
            >> violet-report.txt || true

          echo >> violet-report.txt
          echo "Audio:" >> violet-report.txt
          grep -Ei \
            '^CONFIG_.*TAS2563.*=' \
            violet-full.config \
            >> violet-report.txt || true

      - name: Upload modern Violet defconfig
        uses: actions/upload-artifact@v4
        with:
          name: modern-violet-defconfig
          path: violet-perf_defconfig
          if-no-files-found: error

      - name: Upload full resolved config
        uses: actions/upload-artifact@v4
        with:
          name: violet-full-config
          path: violet-full.config
          if-no-files-found: error

      - name: Upload verification config
        uses: actions/upload-artifact@v4
        with:
          name: violet-verification-config
          path: verify/.config
          if-no-files-found: error

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: violet-config-report
          path: violet-report.txt
          if-no-files-found: error
