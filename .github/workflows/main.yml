name: Generate Modern Violet Defconfig (Fixed)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex libssl-dev libelf-dev libncurses-dev \
            build-essential gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3

      - name: List all available kernel configs (DIAGNOSTIC)
        run: |
          echo "========================================"
          echo "ALL FILES IN arch/arm64/configs/"
          echo "========================================"
          ls -la arch/arm64/configs/

          echo
          echo "========================================"
          echo "ALL FILES IN arch/arm64/configs/vendor/"
          echo "========================================"
          ls -la arch/arm64/configs/vendor/

          echo
          echo "========================================"
          echo "ANY FILE CONTAINING 'violet'"
          echo "========================================"
          find . -iname "*violet*" -type f 2>/dev/null | grep -v "\.git" || echo "none found"

      - name: Determine correct base defconfig
        id: pick_base
        run: |
          set -e

          # Always start from the shared Qualcomm/SM6150 platform base.
          # Do NOT reuse a previously generated violet-perf_defconfig.
          if [ -f arch/arm64/configs/vendor/sdmsteppe-perf_defconfig ]; then
            echo "BASE=vendor/sdmsteppe-perf_defconfig" >> "$GITHUB_OUTPUT"
            echo "Using shared Qualcomm SM6150 platform base:"
            echo "vendor/sdmsteppe-perf_defconfig"
          else
            echo "::error::vendor/sdmsteppe-perf_defconfig was not found."
            exit 1
          fi

      - name: Verify Violet fragment exists
        run: |
          set -e

          if [ ! -f arch/arm64/configs/vendor/violet.config ]; then
            echo "::error::arch/arm64/configs/vendor/violet.config was not found."
            exit 1
          fi

          echo "Found Violet fragment:"
          echo "arch/arm64/configs/vendor/violet.config"

          echo
          echo "Violet fragment:"
          cat arch/arm64/configs/vendor/violet.config

      - name: Generate base configuration
        run: |
          set -e

          rm -rf out
          mkdir -p out

          make O=out ARCH=arm64 ${{ steps.pick_base.outputs.BASE }}

          test -f out/.config

          echo
          echo "Base configuration generated successfully."

      - name: Verify base configuration
        run: |
          set -e

          echo "Checking base platform configuration..."

          grep -q "^CONFIG_ARCH_QCOM=y$" out/.config
          grep -q "^CONFIG_ARCH_SM6150=y$" out/.config

          echo "OK: Qualcomm platform base detected."
          echo
          grep -E "^CONFIG_ARCH_QCOM=y$|^CONFIG_ARCH_SM6150=y$|^CONFIG_ARCH_SDMMAGPIE=y$" out/.config || true

      - name: Merge Violet fragment
        run: |
          set -e

          ./scripts/kconfig/merge_config.sh \
            -O out \
            out/.config \
            arch/arm64/configs/vendor/violet.config

          test -f out/.config

          echo
          echo "Violet fragment merged."

      - name: Resolve configuration
        run: |
          set -e

          make O=out ARCH=arm64 olddefconfig

          test -f out/.config

          echo "Configuration resolved successfully."

      - name: Validate final Violet configuration
        run: |
          set -e

          echo "========================================"
          echo "FINAL VIOLET CONFIG VALIDATION"
          echo "========================================"

          FAIL=0

          check_config() {
            NAME="$1"
            EXPECTED="$2"

            if grep -q "^${NAME}=${EXPECTED}$" out/.config; then
              echo "[OK]   ${NAME}=${EXPECTED}"
            else
              echo "[FAIL] ${NAME} expected ${EXPECTED}"
              FAIL=1
            fi
          }

          echo
          echo "--- Qualcomm / SM6150 ---"

          check_config "CONFIG_ARCH_QCOM" "y"
          check_config "CONFIG_ARCH_SM6150" "y"

          echo
          echo "--- Violet device ---"

          if grep -q "^CONFIG_MACH_XIAOMI_VIOLET=y$" out/.config; then
            echo "[OK]   CONFIG_MACH_XIAOMI_VIOLET=y"
          else
            echo "[WARN] CONFIG_MACH_XIAOMI_VIOLET is not present after Kconfig resolution."
            echo "       This may mean the symbol is unavailable or renamed in this tree."
          fi

          echo
          echo "--- Violet touchscreen ---"

          check_config "CONFIG_TOUCHSCREEN_FTS_F7B" "y"
          check_config "CONFIG_TOUCHSCREEN_NT36xxx" "y"
          check_config "CONFIG_TOUCHSCREEN_XIAOMI_TOUCHFEATURE" "y"
          check_config "CONFIG_TOUCHSCREEN_XIAOMI_TOUCHFEATURE_GAMEMODE" "y"
          check_config "CONFIG_TOUCHSCREEN_NVT_F7B" "y"

          echo
          echo "--- Violet fingerprint ---"

          check_config "CONFIG_INPUT_FINGERPRINT" "y"
          check_config "CONFIG_FINGERPRINT_FPC1020" "y"
          check_config "CONFIG_FINGERPRINT_GF3208" "y"

          echo
          echo "--- Violet audio ---"

          check_config "CONFIG_SND_SOC_TAS2563" "y"
          check_config "CONFIG_TAS2563_CODEC" "y"
          check_config "CONFIG_TAS2563_MISC" "y"
          check_config "CONFIG_TAS2563_REGMAP" "y"

          echo
          echo "--- Generic/server configuration ---"

          if grep -qE "^CONFIG_ACPI=y$|^CONFIG_KVM=y$|^CONFIG_DRM_NOUVEAU=y$" out/.config; then
            echo "[FAIL] Generic/server configuration detected."
            FAIL=1
          else
            echo "[OK]   No unwanted generic/server markers detected."
          fi

          echo
          echo "========================================"

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Final configuration validation failed."
            exit 1
          fi

          echo "FINAL CONFIGURATION VALIDATION PASSED."

      - name: Save full resolved config
        run: |
          set -e

          cp out/.config violet-full.config

          test -s violet-full.config

          echo "Saved:"
          echo "violet-full.config"

      - name: Generate final defconfig
        run: |
          set -e

          make O=out ARCH=arm64 savedefconfig

          test -s out/defconfig

          cp out/defconfig violet-perf_defconfig

          echo
          echo "========================================"
          echo "FINAL VIOLET DEFCONFIG"
          echo "========================================"

          cat violet-perf_defconfig

      - name: Final defconfig validation
        run: |
          set -e

          echo "Checking generated defconfig..."

          grep -q "^CONFIG_ARCH_QCOM=y$" violet-perf_defconfig
          grep -q "^CONFIG_ARCH_SM6150=y$" violet-perf_defconfig

          grep -q "^CONFIG_TOUCHSCREEN_FTS_F7B=y$" violet-perf_defconfig
          grep -q "^CONFIG_TOUCHSCREEN_NT36xxx=y$" violet-perf_defconfig
          grep -q "^CONFIG_TOUCHSCREEN_XIAOMI_TOUCHFEATURE=y$" violet-perf_defconfig

          grep -q "^CONFIG_INPUT_FINGERPRINT=y$" violet-perf_defconfig

          grep -q "^CONFIG_SND_SOC_TAS2563=y$" violet-perf_defconfig

          echo "Generated defconfig passed final checks."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modern-violet-defconfig
          path: |
            violet-perf_defconfig
            violet-full.config
          if-no-files-found: error
