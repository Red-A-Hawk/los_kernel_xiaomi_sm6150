      - name: Analyze Joker configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "JOKER KCONFIG ANALYSIS"
          echo "========================================"

          : > reports/02_already_present.txt
          : > reports/03_missing_but_supported.txt
          : > reports/04_changed_by_kconfig.txt
          : > reports/05_not_supported.txt
          : > reports/06_dependency_conflicts.txt
          : > reports/07_final_candidates.txt

          TOTAL=0
          PRESENT=0
          MISSING=0
          CHANGED=0
          UNSUPPORTED=0
          CONFLICTS=0

          while IFS= read -r LINE
          do
            SYMBOL=$(printf '%s\n' "$LINE" | sed -n \
              -E 's/^(CONFIG_[A-Za-z0-9_]+)=.*/\1/p')

            if [ -z "$SYMBOL" ]; then
              SYMBOL=$(printf '%s\n' "$LINE" | sed -n \
                -E 's/^# (CONFIG_[A-Za-z0-9_]+) is not set$/\1/p')
            fi

            if [ -z "$SYMBOL" ]; then
              continue
            fi

            TOTAL=$((TOTAL + 1))

            CURRENT=$(grep -E \
              "^${SYMBOL}=|^# ${SYMBOL} is not set" \
              out/violet.config | head -n 1 || true)

            if [ "$CURRENT" = "$LINE" ]; then
              echo "$LINE" >> reports/02_already_present.txt
              PRESENT=$((PRESENT + 1))
              continue
            fi

            rm -rf out/test
            mkdir -p out/test

            cp out/violet.config out/test/.config

            printf '%s\n' "$LINE" > out/test/joker.config

            if ! ./scripts/kconfig/merge_config.sh \
              -O out/test \
              out/test/.config \
              out/test/joker.config \
              > /tmp/joker_merge.log 2>&1
            then
              {
                echo "REQUESTED: $LINE"
                echo "RESULT: MERGE FAILED"
                cat /tmp/joker_merge.log
                echo
              } >> reports/06_dependency_conflicts.txt

              CONFLICTS=$((CONFLICTS + 1))
              continue
            fi

            if ! make O=out/test olddefconfig \
              > /tmp/joker_kconfig.log 2>&1
            then
              {
                echo "REQUESTED: $LINE"
                echo "RESULT: KCONFIG FAILED"
                cat /tmp/joker_kconfig.log
                echo
              } >> reports/06_dependency_conflicts.txt

              CONFLICTS=$((CONFLICTS + 1))
              continue
            fi

            RESULT=$(grep -E \
              "^${SYMBOL}=|^# ${SYMBOL} is not set" \
              out/test/.config | head -n 1 || true)

            if [ "$RESULT" = "$LINE" ]; then

              echo "$LINE" >> reports/03_missing_but_supported.txt
              echo "$LINE" >> reports/07_final_candidates.txt

              MISSING=$((MISSING + 1))

            elif [ -n "$RESULT" ]; then

              {
                echo "REQUESTED: $LINE"
                echo "RESOLVED: $RESULT"
                echo
              } >> reports/04_changed_by_kconfig.txt

              CHANGED=$((CHANGED + 1))

            else

              echo "$LINE" >> reports/05_not_supported.txt

              UNSUPPORTED=$((UNSUPPORTED + 1))

            fi

          done < reports/01_joker_all.txt

          echo
          echo "========================================"
          echo "FINAL JOKER ANALYSIS"
          echo "========================================"

          echo "Total Joker settings       : $TOTAL"
          echo "Already present            : $PRESENT"
          echo "Missing but Kconfig accepts: $MISSING"
          echo "Changed by Kconfig         : $CHANGED"
          echo "Not supported              : $UNSUPPORTED"
          echo "Dependency conflicts       : $CONFLICTS"

          echo
          echo "========================================"
          echo "ANALYSIS COMPLETE"
          echo "========================================"
