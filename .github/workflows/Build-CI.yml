name: VIOLET Analyze Joker Candidates

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout VIOLET kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            make \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            device-tree-compiler \
            git \
            wget

      - name: Verify sources
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING SOURCES"
          echo "========================================"

          test -f Kconfig
          test -f arch/arm64/configs/vendor/sdmsteppe-perf_defconfig
          test -f arch/arm64/configs/vendor/violet.config
          test -x scripts/kconfig/merge_config.sh

          echo "Kconfig                   : OK"
          echo "sdmsteppe-perf_defconfig : OK"
          echo "violet.config             : OK"
          echo "merge_config.sh           : OK"

      - name: Download Joker defconfig
        run: |
          set -e

          mkdir -p joker
          mkdir -p reports

          wget -q \
            -O joker/violet-perf_defconfig \
            "https://raw.githubusercontent.com/Joker-V2/kernel_xiaomi_violet/sixteen/arch/arm64/configs/vendor/violet-perf_defconfig"

          test -s joker/violet-perf_defconfig

          echo "Joker defconfig: OK"

      - name: Prepare ARM64 compiler
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "========================================"
          echo "ARM64 TOOLCHAIN"
          echo "========================================"

          echo "ARCH=$ARCH"
          echo "CROSS_COMPILE=$CROSS_COMPILE"

          command -v aarch64-linux-gnu-gcc
          command -v aarch64-linux-gnu-ld

          aarch64-linux-gnu-gcc --version | head -n 1
          aarch64-linux-gnu-ld --version | head -n 1

      - name: Generate VIOLET base
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          rm -rf out

          mkdir -p out

          make O=out vendor/sdmsteppe-perf_defconfig

          cp out/.config out/sdmsteppe.config

          ./scripts/kconfig/merge_config.sh \
            -O out \
            out/sdmsteppe.config \
            arch/arm64/configs/vendor/violet.config

          make O=out olddefconfig

          cp out/.config out/violet.config.resolved

          echo "========================================"
          echo "VIOLET BASE READY"
          echo "========================================"

          wc -l out/violet.config.resolved

      - name: Extract Joker missing supported candidates
        run: |
          set -e

          echo "========================================"
          echo "EXTRACTING JOKER CANDIDATES"
          echo "========================================"

          : > reports/01_candidates.txt

          while IFS= read -r line
          do
            case "$line" in

              CONFIG_*=*)
                symbol="${line%%=*}"
                ;;

              "# CONFIG_"*" is not set")
                symbol="${line#\# }"
                symbol="${symbol% is not set}"
                ;;

              *)
                continue
                ;;

            esac

            current=$(grep -E \
              "^${symbol}=|^# ${symbol} is not set$" \
              out/violet.config.resolved \
              | head -n 1 || true)

            if [ "$current" != "$line" ]
            then
              echo "$line" >> reports/01_candidates.txt
            fi

          done < joker/violet-perf_defconfig

          sort -u \
            reports/01_candidates.txt \
            -o reports/01_candidates.txt

          echo "Candidate count:"
          wc -l reports/01_candidates.txt

      - name: Test candidates individually
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "========================================"
          echo "INDIVIDUAL KCONFIG TEST"
          echo "========================================"

          : > reports/02_violet_relevant.txt
          : > reports/03_generic_supported.txt
          : > reports/04_platform_specific.txt
          : > reports/05_changed_by_kconfig.txt
          : > reports/06_rejected.txt
          : > reports/07_dependency_info.txt

          total=0
          relevant=0
          generic=0
          platform=0
          changed=0
          rejected=0

          while IFS= read -r requested
          do

            [ -z "$requested" ] && continue

            total=$((total + 1))

            case "$requested" in

              CONFIG_*=*)
                symbol="${requested%%=*}"
                ;;

              "# CONFIG_"*" is not set")
                symbol="${requested#\# }"
                symbol="${symbol% is not set}"
                ;;

              *)
                continue
                ;;

            esac

            rm -rf candidate_test
            mkdir -p candidate_test

            cp out/violet.config.resolved \
              candidate_test/.config

            echo "$requested" > candidate_test/candidate.config

            if ! ./scripts/kconfig/merge_config.sh \
              -O candidate_test \
              candidate_test/.config \
              candidate_test/candidate.config \
              > /tmp/candidate_merge.log 2>&1
            then

              {
                echo "SYMBOL: $symbol"
                echo "REQUESTED: $requested"
                echo "STATUS: REJECTED"
                cat /tmp/candidate_merge.log
                echo
              } >> reports/06_rejected.txt

              rejected=$((rejected + 1))
              continue

            fi

            if ! make O=candidate_test olddefconfig \
              > /tmp/candidate_kconfig.log 2>&1
            then

              {
                echo "SYMBOL: $symbol"
                echo "REQUESTED: $requested"
                echo "STATUS: KCONFIG FAILED"
                cat /tmp/candidate_kconfig.log
                echo
              } >> reports/06_rejected.txt

              rejected=$((rejected + 1))
              continue

            fi

            result=$(grep -E \
              "^${symbol}=|^# ${symbol} is not set$" \
              candidate_test/.config \
              | head -n 1 || true)

            if [ "$result" != "$requested" ]
            then

              {
                echo "SYMBOL: $symbol"
                echo "REQUESTED: $requested"
                echo "RESULT: ${result:-NOT PRESENT}"
                echo "STATUS: CHANGED BY KCONFIG"
                echo
              } >> reports/05_changed_by_kconfig.txt

              changed=$((changed + 1))
              continue

            fi

            definition=$(grep -R \
              -n \
              -m 3 \
              "$symbol" \
              arch drivers fs net mm security 2>/dev/null \
              | head -n 3 || true)

            case "$symbol" in

              CONFIG_MSM_*SM8150*)
                {
                  echo "$requested"
                  echo "CLASS: SM8150"
                  echo "$definition"
                  echo
                } >> reports/04_platform_specific.txt

                platform=$((platform + 1))
                ;;

              CONFIG_MSM_*SM8150)
                {
                  echo "$requested"
                  echo "CLASS: SM8150"
                  echo "$definition"
                  echo
                } >> reports/04_platform_specific.txt

                platform=$((platform + 1))
                ;;

              CONFIG_VIDEO_*)
                {
                  echo "$requested"
                  echo "CLASS: VIDEO"
                  echo "$definition"
                  echo
                } >> reports/04_platform_specific.txt

                platform=$((platform + 1))
                ;;

              CONFIG_LCD_*)
                {
                  echo "$requested"
                  echo "CLASS: LCD"
                  echo "$definition"
                  echo
                } >> reports/04_platform_specific.txt

                platform=$((platform + 1))
                ;;

              CONFIG_WLAN_VENDOR_*)
                {
                  echo "$requested"
                  echo "CLASS: WLAN VENDOR"
                  echo "$definition"
                  echo
                } >> reports/04_platform_specific.txt

                platform=$((platform + 1))
                ;;

              CONFIG_USB_*)
                {
                  echo "$requested"
                  echo "CLASS: USB"
                  echo "$definition"
                  echo
                } >> reports/03_generic_supported.txt

                generic=$((generic + 1))
                ;;

              CONFIG_CRYPTO_*)
                {
                  echo "$requested"
                  echo "CLASS: CRYPTO"
                  echo "$definition"
                  echo
                } >> reports/03_generic_supported.txt

                generic=$((generic + 1))
                ;;

              CONFIG_F2FS_*)
                {
                  echo "$requested"
                  echo "CLASS: F2FS"
                  echo "$definition"
                  echo
                } >> reports/03_generic_supported.txt

                generic=$((generic + 1))
                ;;

              CONFIG_EROFS_*)
                {
                  echo "$requested"
                  echo "CLASS: EROFS"
                  echo "$definition"
                  echo
                } >> reports/03_generic_supported.txt

                generic=$((generic + 1))
                ;;

              CONFIG_MMC_*)
                {
                  echo "$requested"
                  echo "CLASS: MMC"
                  echo "$definition"
                  echo
                } >> reports/02_violet_relevant.txt

                relevant=$((relevant + 1))
                ;;

              CONFIG_TOUCHSCREEN_*)
                {
                  echo "$requested"
                  echo "CLASS: TOUCHSCREEN"
                  echo "$definition"
                  echo
                } >> reports/02_violet_relevant.txt

                relevant=$((relevant + 1))
                ;;

              CONFIG_MSM_*)
                {
                  echo "$requested"
                  echo "CLASS: QCOM MSM"
                  echo "$definition"
                  echo
                } >> reports/02_violet_relevant.txt

                relevant=$((relevant + 1))
                ;;

              CONFIG_QCOM_*)
                {
                  echo "$requested"
                  echo "CLASS: QCOM"
                  echo "$definition"
                  echo
                } >> reports/02_violet_relevant.txt

                relevant=$((relevant + 1))
                ;;

              *)
                {
                  echo "$requested"
                  echo "CLASS: GENERIC"
                  echo "$definition"
                  echo
                } >> reports/03_generic_supported.txt

                generic=$((generic + 1))
                ;;

            esac

            {
              echo "SYMBOL: $symbol"
              echo "REQUESTED: $requested"
              echo "KCONFIG: $result"
              echo "DEFINITION:"
              echo "$definition"
              echo
            } >> reports/07_dependency_info.txt

          done < reports/01_candidates.txt

          echo "========================================"
          echo "CANDIDATE ANALYSIS COMPLETE"
          echo "========================================"

          echo "Total candidates : $total"
          echo "VIOLET relevant  : $relevant"
          echo "Generic          : $generic"
          echo "Platform specific: $platform"
          echo "Changed          : $changed"
          echo "Rejected         : $rejected"

      - name: Create final summary
        run: |
          set -e

          {
            echo "========================================"
            echo "VIOLET JOKER CANDIDATE ANALYSIS"
            echo "========================================"
            echo
            echo "Kernel branch: 16"
            echo "Architecture: arm64"
            echo "Compiler: aarch64-linux-gnu-"
            echo
            echo "Base:"
            echo "sdmsteppe-perf_defconfig"
            echo
            echo "VIOLET:"
            echo "arch/arm64/configs/vendor/violet.config"
            echo
            echo "JOKER:"
            echo "Joker-V2/kernel_xiaomi_violet"
            echo "branch: sixteen"
            echo
            echo "========================================"
            echo "RESULTS"
            echo "========================================"
            echo
            echo "Candidate settings:"
            wc -l < reports/01_candidates.txt
            echo
            echo "VIOLET relevant:"
            grep -c '^CONFIG_' reports/02_violet_relevant.txt || true
            echo
            echo "Generic supported:"
            grep -c '^CONFIG_' reports/03_generic_supported.txt || true
            echo
            echo "Platform specific:"
            grep -c '^CONFIG_' reports/04_platform_specific.txt || true
            echo
            echo "Changed by Kconfig:"
            grep -c '^SYMBOL:' reports/05_changed_by_kconfig.txt || true
            echo
            echo "Rejected:"
            grep -c '^SYMBOL:' reports/06_rejected.txt || true
            echo
            echo "========================================"
            echo "NO KERNEL BUILD"
            echo "========================================"
            echo
            echo "This workflow performs Kconfig analysis only."
          } > reports/08_summary.txt

          cat reports/08_summary.txt

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: violet-joker-candidate-analysis
          path: |
            reports/01_candidates.txt
            reports/02_violet_relevant.txt
            reports/03_generic_supported.txt
            reports/04_platform_specific.txt
            reports/05_changed_by_kconfig.txt
            reports/06_rejected.txt
            reports/07_dependency_info.txt
            reports/08_summary.txt
          if-no-files-found: error
