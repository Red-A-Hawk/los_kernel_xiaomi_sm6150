name: VIOLET Deep Analysis - 296 Joker Candidates

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout VIOLET kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            make \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            git \
            wget \
            ripgrep

      - name: Verify sources
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING VIOLET SOURCES"
          echo "========================================"

          test -f Kconfig
          test -f arch/arm64/configs/vendor/sdmsteppe-perf_defconfig
          test -f arch/arm64/configs/vendor/violet.config
          test -x scripts/kconfig/merge_config.sh

          echo "Kconfig                   : OK"
          echo "sdmsteppe-perf_defconfig : OK"
          echo "violet.config             : OK"
          echo "merge_config.sh           : OK"

      - name: Download Joker defconfig
        run: |
          set -e

          mkdir -p joker
          mkdir -p reports

          wget -q \
            -O joker/violet-perf_defconfig \
            "https://raw.githubusercontent.com/Joker-V2/kernel_xiaomi_violet/sixteen/arch/arm64/configs/vendor/violet-perf_defconfig"

          test -s joker/violet-perf_defconfig

          echo "Joker defconfig:"
          wc -l joker/violet-perf_defconfig

      - name: Generate VIOLET base Kconfig
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          rm -rf out
          mkdir -p out

          echo "========================================"
          echo "GENERATING BASE CONFIG"
          echo "========================================"

          make O=out vendor/sdmsteppe-perf_defconfig

          cp out/.config out/sdmsteppe.config

          ./scripts/kconfig/merge_config.sh \
            -O out \
            out/sdmsteppe.config \
            arch/arm64/configs/vendor/violet.config \
            > reports/base_merge.log 2>&1

          make O=out olddefconfig \
            > reports/base_kconfig.log 2>&1

          cp out/.config out/violet.config.resolved

          echo
          echo "Resolved VIOLET configuration:"
          wc -l out/violet.config.resolved

      - name: Extract 296 candidates
        run: |
          set -e

          echo "========================================"
          echo "EXTRACTING JOKER CANDIDATES"
          echo "========================================"

          : > reports/01_all_296.txt

          while IFS= read -r line; do

            case "$line" in

              CONFIG_*=*)
                echo "$line" >> reports/01_all_296.txt
                ;;

              "# CONFIG_"*" is not set")
                echo "$line" >> reports/01_all_296.txt
                ;;

            esac

          done < joker/violet-perf_defconfig

          sort -u reports/01_all_296.txt \
            -o reports/01_all_296.txt

          echo "Total Joker entries:"
          wc -l reports/01_all_296.txt

      - name: Find missing but Kconfig accepted
        run: |
          set -e

          echo "========================================"
          echo "FINDING MISSING BUT SUPPORTED"
          echo "========================================"

          : > reports/02_missing_but_supported.txt

          get_value() {
            cfg="$1"
            sym="$2"

            grep -E "^${sym}=|^# ${sym} is not set$" \
              "$cfg" \
              | head -n 1 || true
          }

          while IFS= read -r requested; do

            [ -z "$requested" ] && continue

            case "$requested" in

              CONFIG_*=*)
                symbol="${requested%%=*}"
                ;;

              "# CONFIG_"*" is not set")
                symbol="${requested#\# }"
                symbol="${symbol% is not set}"
                ;;

              *)
                continue
                ;;

            esac

            current="$(get_value out/violet.config.resolved "$symbol")"

            if [ -n "$current" ]; then
              continue
            fi

            echo "$requested" \
              >> reports/02_missing_but_supported.txt

          done < reports/01_all_296.txt

          sort -u \
            reports/02_missing_but_supported.txt \
            -o reports/02_missing_but_supported.txt

          echo "Missing candidates:"
          wc -l reports/02_missing_but_supported.txt

      - name: Deep source tree analysis
        run: |
          set -e

          echo "========================================"
          echo "DEEP SOURCE TREE ANALYSIS"
          echo "========================================"

          : > reports/03_violet_relevant.txt
          : > reports/04_other_platform.txt
          : > reports/05_dependencies.txt
          : > reports/06_no_source_reference.txt
          : > reports/07_safe_candidates.txt

          total=0
          violet=0
          other=0
          deps=0
          none=0

          while IFS= read -r requested; do

            [ -z "$requested" ] && continue

            case "$requested" in

              CONFIG_*=*)
                symbol="${requested%%=*}"
                ;;

              "# CONFIG_"*" is not set")
                symbol="${requested#\# }"
                symbol="${symbol% is not set}"
                ;;

              *)
                continue
                ;;

            esac

            total=$((total + 1))

            tmp="reports/tmp_${symbol}.txt"
            : > "$tmp"

            echo "========================================" >> "$tmp"
            echo "SYMBOL: $symbol" >> "$tmp"
            echo "REQUEST: $requested" >> "$tmp"
            echo "========================================" >> "$tmp"

            echo >> "$tmp"
            echo "KCONFIG DEFINITIONS:" >> "$tmp"

            rg -n \
              --glob 'Kconfig*' \
              --glob '!out/**' \
              "config[[:space:]]+$symbol" \
              . >> "$tmp" 2>/dev/null || true

            echo >> "$tmp"
            echo "SOURCE REFERENCES:" >> "$tmp"

            rg -n \
              --glob '*.c' \
              --glob '*.h' \
              --glob '*.Kconfig*' \
              --glob 'Makefile*' \
              --glob '!out/**' \
              "$symbol" \
              . >> "$tmp" 2>/dev/null || true

            echo >> "$tmp"
            echo "PLATFORM REFERENCES:" >> "$tmp"

            rg -n \
              --glob '*.c' \
              --glob '*.h' \
              --glob 'Kconfig*' \
              --glob 'Makefile*' \
              --glob '!out/**' \
              'SM6150|SM6150P|VIOLET|XIAOMI_VIOLET|SDMSTEPPE|QCOM' \
              . >> "$tmp" 2>/dev/null || true

            echo >> "$tmp"
            echo "OTHER PLATFORM REFERENCES:" >> "$tmp"

            rg -n \
              --glob '*.c' \
              --glob '*.h' \
              --glob 'Kconfig*' \
              --glob 'Makefile*' \
              --glob '!out/**' \
              'SM8150|SM8250|SM8350|SM8450|SDM845|SDM855' \
              . >> "$tmp" 2>/dev/null || true

            definition_count="$(rg -c \
              --glob 'Kconfig*' \
              --glob '!out/**' \
              "config[[:space:]]+$symbol" \
              . 2>/dev/null \
              | awk -F: '{sum += $NF} END {print sum+0}')"

            source_count="$(rg -c \
              --glob '*.c' \
              --glob '*.h' \
              --glob '*.Kconfig*' \
              --glob 'Makefile*' \
              --glob '!out/**' \
              "$symbol" \
              . 2>/dev/null \
              | awk -F: '{sum += $NF} END {print sum+0}')"

            platform_count="$(rg -c \
              --glob '*.c' \
              --glob '*.h' \
              --glob 'Kconfig*' \
              --glob 'Makefile*' \
              --glob '!out/**' \
              'SM6150|SM6150P|VIOLET|XIAOMI_VIOLET|SDMSTEPPE|QCOM' \
              . 2>/dev/null \
              | awk -F: '{sum += $NF} END {print sum+0}')"

            other_count="$(rg -c \
              --glob '*.c' \
              --glob '*.h' \
              --glob 'Kconfig*' \
              --glob 'Makefile*' \
              --glob '!out/**' \
              'SM8150|SM8250|SM8350|SM8450|SDM845|SDM855' \
              . 2>/dev/null \
              | awk -F: '{sum += $NF} END {print sum+0}')"

            echo >> "$tmp"
            echo "DEFINITION COUNT: $definition_count" >> "$tmp"
            echo "SOURCE COUNT: $source_count" >> "$tmp"
            echo "VIOLET/QCOM PLATFORM COUNT: $platform_count" >> "$tmp"
            echo "OTHER PLATFORM COUNT: $other_count" >> "$tmp"

            echo >> "$tmp"

            if [ "$definition_count" -eq 0 ]; then

              echo "STATUS: NO KCONFIG DEFINITION FOUND" >> "$tmp"
              cat "$tmp" >> reports/06_no_source_reference.txt
              echo >> reports/06_no_source_reference.txt

              none=$((none + 1))

            elif [ "$other_count" -gt "$platform_count" ] && [ "$platform_count" -eq 0 ]; then

              echo "STATUS: OTHER PLATFORM" >> "$tmp"
              cat "$tmp" >> reports/04_other_platform.txt
              echo >> reports/04_other_platform.txt

              other=$((other + 1))

            elif [ "$platform_count" -gt 0 ]; then

              echo "STATUS: VIOLET/QCOM RELEVANT" >> "$tmp"
              cat "$tmp" >> reports/03_violet_relevant.txt
              echo >> reports/03_violet_relevant.txt

              violet=$((violet + 1))

              if [ "$source_count" -gt 0 ]; then
                echo "$requested" >> reports/07_safe_candidates.txt
              fi

            else

              echo "STATUS: DEFINED BUT PLATFORM RELATION UNCLEAR" >> "$tmp"
              cat "$tmp" >> reports/05_dependencies.txt
              echo >> reports/05_dependencies.txt

              deps=$((deps + 1))

            fi

            rm -f "$tmp"

          done < reports/02_missing_but_supported.txt

          sort -u reports/07_safe_candidates.txt \
            -o reports/07_safe_candidates.txt

          echo
          echo "========================================"
          echo "DEEP ANALYSIS RESULT"
          echo "========================================"
          echo "Candidates analyzed : $total"
          echo "VIOLET/QCOM relevant: $violet"
          echo "Other platform      : $other"
          echo "Unclear/dependency  : $deps"
          echo "No Kconfig/source   : $none"

      - name: Generate final summary
        run: |
          set -e

          total="$(wc -l < reports/02_missing_but_supported.txt)"
          violet="$(grep -c '^SYMBOL:' reports/03_violet_relevant.txt || true)"
          other="$(grep -c '^SYMBOL:' reports/04_other_platform.txt || true)"
          none="$(grep -c '^SYMBOL:' reports/06_no_source_reference.txt || true)"
          safe="$(wc -l < reports/07_safe_candidates.txt)"

          {
            echo "========================================"
            echo "VIOLET DEEP JOKER ANALYSIS"
            echo "========================================"
            echo
            echo "Joker missing candidates : $total"
            echo "VIOLET/QCOM relevant     : $violet"
            echo "Other platform           : $other"
            echo "No Kconfig/source        : $none"
            echo "Potential candidates     : $safe"
            echo
            echo "========================================"
            echo "SOURCE"
            echo "========================================"
            echo
            echo "VIOLET kernel branch: 16"
            echo "Base: sdmsteppe-perf_defconfig"
            echo "VIOLET: arch/arm64/configs/vendor/violet.config"
            echo "JOKER: Joker-V2/kernel_xiaomi_violet"
            echo "JOKER branch: sixteen"
            echo
            echo "Architecture: arm64"
            echo "Cross compiler: aarch64-linux-gnu-"
            echo
            echo "Kernel build: NOT PERFORMED"
            echo "violet.config: NOT MODIFIED"
            echo
            echo "This is source-tree and Kconfig analysis only."
            echo
            echo "========================================"
          } > reports/08_summary.txt

          cat reports/08_summary.txt

      - name: Upload deep analysis
        uses: actions/upload-artifact@v4
        with:
          name: violet-joker-deep-analysis
          path: |
            reports/01_all_296.txt
            reports/02_missing_but_supported.txt
            reports/03_violet_relevant.txt
            reports/04_other_platform.txt
            reports/05_dependencies.txt
            reports/06_no_source_reference.txt
            reports/07_safe_candidates.txt
            reports/08_summary.txt
            reports/base_merge.log
            reports/base_kconfig.log
          if-no-files-found: error
