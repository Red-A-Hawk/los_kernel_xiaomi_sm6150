name: VIOLET Deep Joker Kconfig Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout VIOLET kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            make \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            device-tree-compiler \
            git \
            wget

      - name: Syntax check
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SYNTAX CHECK"
          echo "========================================"

          cat > /tmp/test.sh <<'EOF'
          set -e
          echo syntax-ok
          EOF

          bash -n /tmp/test.sh

          echo "BASH SYNTAX: OK"

      - name: Verify sources
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING SOURCES"
          echo "========================================"

          test -f Kconfig
          test -f arch/arm64/configs/vendor/sdmsteppe-perf_defconfig
          test -f arch/arm64/configs/vendor/violet.config
          test -x scripts/kconfig/merge_config.sh

          echo "Kconfig                   : OK"
          echo "sdmsteppe-perf_defconfig : OK"
          echo "violet.config             : OK"
          echo "merge_config.sh           : OK"

      - name: Download Joker defconfig
        shell: bash
        run: |
          set -e

          mkdir -p joker
          mkdir -p reports

          wget -q \
            -O joker/violet-perf_defconfig \
            "https://raw.githubusercontent.com/Joker-V2/kernel_xiaomi_violet/sixteen/arch/arm64/configs/vendor/violet-perf_defconfig"

          test -s joker/violet-perf_defconfig

          echo "Joker violet-perf_defconfig: OK"
          echo "Joker lines:"
          wc -l joker/violet-perf_defconfig

      - name: Prepare ARM64 compiler
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "========================================"
          echo "ARM64 COMPILER"
          echo "========================================"

          echo "ARCH=$ARCH"
          echo "CROSS_COMPILE=$CROSS_COMPILE"

          command -v aarch64-linux-gnu-gcc
          command -v aarch64-linux-gnu-ld

          aarch64-linux-gnu-gcc --version | head -n 1
          aarch64-linux-gnu-ld --version | head -n 1

      - name: Generate VIOLET final base
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          rm -rf out

          mkdir -p out

          echo "========================================"
          echo "GENERATING VIOLET BASE"
          echo "========================================"

          echo "sdmsteppe-perf_defconfig"
          echo "+"
          echo "violet.config"
          echo "+"
          echo "Kconfig"

          make O=out vendor/sdmsteppe-perf_defconfig

          cp out/.config out/sdmsteppe.config

          ./scripts/kconfig/merge_config.sh \
            -O out \
            out/sdmsteppe.config \
            arch/arm64/configs/vendor/violet.config \
            > reports/violet_merge.log 2>&1

          make O=out olddefconfig \
            > reports/violet_kconfig.log 2>&1

          cp out/.config out/violet_final.config

          echo
          echo "VIOLET BASE READY"

          wc -l out/violet_final.config

      - name: Extract Joker candidates
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "EXTRACTING JOKER CANDIDATES"
          echo "========================================"

          : > reports/01_joker_candidates.txt

          while IFS= read -r line
          do
            case "$line" in

              CONFIG_*=*)
                symbol="${line%%=*}"
                ;;

              "# CONFIG_"*" is not set")
                symbol="${line#\# }"
                symbol="${symbol% is not set}"
                ;;

              *)
                continue
                ;;

            esac

            current="$(
              grep -E \
                "^${symbol}=|^# ${symbol} is not set$" \
                out/violet_final.config \
                | head -n 1 || true
            )"

            if [ "$current" != "$line" ]
            then
              echo "$line" >> reports/01_joker_candidates.txt
            fi

          done < joker/violet-perf_defconfig

          sort -u \
            reports/01_joker_candidates.txt \
            -o reports/01_joker_candidates.txt

          echo "Candidates:"
          wc -l reports/01_joker_candidates.txt

      - name: Build complete Kconfig symbol database
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILDING KCONFIG DATABASE"
          echo "========================================"

          : > reports/02_kconfig_database.txt

          find . \
            -type f \
            \( \
              -name 'Kconfig' \
              -o -name 'Kconfig.*' \
            \) \
            -not -path './.git/*' \
            -print0 |
          while IFS= read -r -d '' file
          do

            awk -v file="$file" '
              /^[[:space:]]*config[[:space:]]+[A-Za-z0-9_]+/ {
                print "FILE: " file
                print "LINE: " NR
                print $0
                print ""
              }

              /^[[:space:]]*menuconfig[[:space:]]+[A-Za-z0-9_]+/ {
                print "FILE: " file
                print "LINE: " NR
                print $0
                print ""
              }
            ' "$file" >> reports/02_kconfig_database.txt

          done

          echo "Kconfig definitions collected:"
          wc -l reports/02_kconfig_database.txt

      - name: Analyze Joker candidates
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "DEEP KCONFIG ANALYSIS"
          echo "========================================"

          : > reports/03_violet_relevant.txt
          : > reports/04_generic_supported.txt
          : > reports/05_platform_mismatch.txt
          : > reports/06_not_defined.txt
          : > reports/07_dependencies.txt
          : > reports/08_current_vs_joker.txt

          total=0
          defined=0
          undefined=0
          violet=0
          generic=0
          mismatch=0

          get_value()
          {
            cfg="$1"
            sym="$2"

            grep -E \
              "^${sym}=|^# ${sym} is not set$" \
              "$cfg" \
              | head -n 1 || true
          }

          while IFS= read -r requested
          do

            [ -z "$requested" ] && continue

            total=$((total + 1))

            case "$requested" in

              CONFIG_*=*)
                symbol="${requested%%=*}"
                ;;

              "# CONFIG_"*" is not set")
                symbol="${requested#\# }"
                symbol="${symbol% is not set}"
                ;;

              *)
                continue
                ;;

            esac

            current="$(get_value out/violet_final.config "$symbol")"

            definition="$(
              grep \
                -n \
                -E \
                "^[[:space:]]*(config|menuconfig)[[:space:]]+${symbol}[[:space:]]*$" \
                reports/02_kconfig_database.txt \
                | head -n 5 || true
            )"

            if [ -z "$definition" ]
            then

              {
                echo "SYMBOL: $symbol"
                echo "JOKER: $requested"
                echo "CURRENT: ${current:-NOT PRESENT}"
                echo "STATUS: NOT DEFINED IN KCONFIG DATABASE"
                echo
              } >> reports/06_not_defined.txt

              undefined=$((undefined + 1))

              continue

            fi

            defined=$((defined + 1))

            case "$symbol" in

              CONFIG_MACH_XIAOMI_VIOLET)
                class="VIOLET"
                ;;

              CONFIG_MMC*)
                class="VIOLET-HARDWARE"
                ;;

              CONFIG_TOUCHSCREEN*)
                class="VIOLET-HARDWARE"
                ;;

              CONFIG_FINGERPRINT*)
                class="VIOLET-HARDWARE"
                ;;

              CONFIG_MSM_*SM6150*)
                class="SM6150"
                ;;

              CONFIG_MSM_*SM8150*)
                class="SM8150"
                ;;

              CONFIG_MSM_*SM8250*)
                class="SM8250"
                ;;

              CONFIG_MSM_*SM8350*)
                class="SM8350"
                ;;

              CONFIG_QCOM_*)
                class="QCOM"
                ;;

              CONFIG_ARCH_*)
                class="ARCH"
                ;;

              CONFIG_VIDEO_*)
                class="VIDEO"
                ;;

              CONFIG_LCD_*)
                class="DISPLAY"
                ;;

              CONFIG_WLAN_VENDOR_*)
                class="WLAN"
                ;;

              CONFIG_USB_*)
                class="USB"
                ;;

              CONFIG_CRYPTO_*)
                class="CRYPTO"
                ;;

              CONFIG_F2FS_*)
                class="FILESYSTEM"
                ;;

              CONFIG_EROFS_*)
                class="FILESYSTEM"
                ;;

              *)
                class="GENERIC"
                ;;

            esac

            {
              echo "========================================"
              echo "SYMBOL: $symbol"
              echo "JOKER REQUEST: $requested"
              echo "CURRENT VIOLET: ${current:-NOT PRESENT}"
              echo "CLASS: $class"
              echo "KCONFIG:"
              echo "$definition"
              echo "========================================"
              echo
            } >> reports/08_current_vs_joker.txt

            case "$class" in

              SM8150|SM8250|SM8350)
                {
                  echo "SYMBOL: $symbol"
                  echo "REQUEST: $requested"
                  echo "CLASS: $class"
                  echo "STATUS: PLATFORM MISMATCH CANDIDATE"
                  echo
                } >> reports/05_platform_mismatch.txt

                mismatch=$((mismatch + 1))
                ;;

              VIOLET|VIOLET-HARDWARE|SM6150|QCOM)
                {
                  echo "SYMBOL: $symbol"
                  echo "REQUEST: $requested"
                  echo "CURRENT: ${current:-NOT PRESENT}"
                  echo "CLASS: $class"
                  echo "STATUS: VIOLET RELEVANT CANDIDATE"
                  echo
                } >> reports/03_violet_relevant.txt

                violet=$((violet + 1))
                ;;

              *)
                {
                  echo "SYMBOL: $symbol"
                  echo "REQUEST: $requested"
                  echo "CURRENT: ${current:-NOT PRESENT}"
                  echo "CLASS: $class"
                  echo "STATUS: GENERIC SUPPORTED CANDIDATE"
                  echo
                } >> reports/04_generic_supported.txt

                generic=$((generic + 1))
                ;;

            esac

            {
              echo "========================================"
              echo "SYMBOL: $symbol"
              echo "REQUEST: $requested"
              echo "CURRENT VIOLET: ${current:-NOT PRESENT}"
              echo
              echo "KCONFIG CONTEXT:"
              grep -n -B 3 -A 12 \
                -E \
                "^[[:space:]]*(config|menuconfig)[[:space:]]+${symbol}[[:space:]]*$" \
                reports/02_kconfig_database.txt \
                | head -n 30 || true
              echo
            } >> reports/07_dependencies.txt

          done < reports/01_joker_candidates.txt

          echo "========================================"
          echo "ANALYSIS COMPLETE"
          echo "========================================"

          echo "Total candidates : $total"
          echo "Defined          : $defined"
          echo "Not defined      : $undefined"
          echo "VIOLET/QCOM      : $violet"
          echo "Generic          : $generic"
          echo "Platform mismatch: $mismatch"

      - name: Generate clean candidate configs
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GENERATING CLEAN CONFIG LISTS"
          echo "========================================"

          grep \
            -E \
            '^SYMBOL: |^REQUEST: ' \
            reports/03_violet_relevant.txt \
            > reports/09_violet_relevant_summary.txt || true

          grep \
            -E \
            '^SYMBOL: |^REQUEST: ' \
            reports/04_generic_supported.txt \
            > reports/10_generic_summary.txt || true

          grep \
            -E \
            '^SYMBOL: |^REQUEST: ' \
            reports/05_platform_mismatch.txt \
            > reports/11_platform_mismatch_summary.txt || true

      - name: Final summary
        shell: bash
        run: |
          set -e

          total="$(wc -l < reports/01_joker_candidates.txt)"
          violet="$(grep -c '^SYMBOL:' reports/03_violet_relevant.txt || true)"
          generic="$(grep -c '^SYMBOL:' reports/04_generic_supported.txt || true)"
          mismatch="$(grep -c '^SYMBOL:' reports/05_platform_mismatch.txt || true)"
          undefined="$(grep -c '^SYMBOL:' reports/06_not_defined.txt || true)"

          {
            echo "========================================"
            echo "VIOLET DEEP JOKER KCONFIG AUDIT"
            echo "========================================"
            echo
            echo "Kernel branch       : 16"
            echo "Architecture        : arm64"
            echo "Cross compiler      : aarch64-linux-gnu-"
            echo
            echo "Base:"
            echo "sdmsteppe-perf_defconfig"
            echo
            echo "VIOLET:"
            echo "arch/arm64/configs/vendor/violet.config"
            echo
            echo "JOKER:"
            echo "Joker-V2/kernel_xiaomi_violet"
            echo "branch: sixteen"
            echo
            echo "========================================"
            echo "RESULT"
            echo "========================================"
            echo
            echo "Joker candidates    : $total"
            echo "VIOLET relevant     : $violet"
            echo "Generic             : $generic"
            echo "Platform mismatch   : $mismatch"
            echo "Not defined         : $undefined"
            echo
            echo "========================================"
            echo "IMPORTANT"
            echo "========================================"
            echo
            echo "No kernel was built."
            echo "violet.config was not modified."
            echo "This is Kconfig/source-tree analysis only."
            echo
          } > reports/12_final_summary.txt

          cat reports/12_final_summary.txt

      - name: Upload TXT reports
        uses: actions/upload-artifact@v4
        with:
          name: violet-deep-joker-kconfig-audit
          path: |
            reports/01_joker_candidates.txt
            reports/02_kconfig_database.txt
            reports/03_violet_relevant.txt
            reports/04_generic_supported.txt
            reports/05_platform_mismatch.txt
            reports/06_not_defined.txt
            reports/07_dependencies.txt
            reports/08_current_vs_joker.txt
            reports/09_violet_relevant_summary.txt
            reports/10_generic_summary.txt
            reports/11_platform_mismatch_summary.txt
            reports/12_final_summary.txt
            reports/violet_merge.log
            reports/violet_kconfig.log
          if-no-files-found: error
