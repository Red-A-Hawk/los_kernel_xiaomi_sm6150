name: VIOLET Deep Audit - Joker 296

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout VIOLET kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            make \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            git \
            wget \
            python3

      - name: Prepare reports
        run: |
          set -e
          rm -rf audit
          mkdir -p audit/reports
          mkdir -p audit/joker

          wget -q \
            -O audit/joker/violet-perf_defconfig \
            "https://raw.githubusercontent.com/Joker-V2/kernel_xiaomi_violet/sixteen/arch/arm64/configs/vendor/violet-perf_defconfig"

          test -s audit/joker/violet-perf_defconfig

      - name: Syntax validation
        run: |
          set -e

          echo "========================================"
          echo "SYNTAX VALIDATION"
          echo "========================================"

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          f = Path("audit/joker/violet-perf_defconfig")

          total = 0
          bad = 0

          for n, raw in enumerate(f.read_text(errors="replace").splitlines(), 1):
              line = raw.strip()

              if not line:
                  continue

              if line.startswith("# CONFIG_"):
                  if not re.fullmatch(r"# CONFIG_[A-Za-z0-9_]+ is not set", line):
                      print(f"BAD:{n}:{raw}")
                      bad += 1
                  else:
                      total += 1
                  continue

              if line.startswith("CONFIG_"):
                  if "=" not in line:
                      print(f"BAD:{n}:{raw}")
                      bad += 1
                  else:
                      name, value = line.split("=", 1)

                      if not re.fullmatch(r"CONFIG_[A-Za-z0-9_]+", name):
                          print(f"BAD:{n}:{raw}")
                          bad += 1
                      elif value == "":
                          print(f"BAD:{n}:{raw}")
                          bad += 1
                      else:
                          total += 1

          print("")
          print("Valid settings :", total)
          print("Syntax errors  :", bad)

          if bad:
              sys.exit(1)
          PY

          echo "Syntax: OK"

      - name: Extract the 296 candidates
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path("audit/joker/violet-perf_defconfig")
          out = Path("audit/reports/01_all_296.txt")

          lines = []

          for raw in src.read_text(errors="replace").splitlines():
              s = raw.strip()

              if re.match(r"^CONFIG_[A-Za-z0-9_]+=", s):
                  lines.append(s)

              elif re.match(r"^# CONFIG_[A-Za-z0-9_]+ is not set$", s):
                  lines.append(s)

          seen = set()
          final = []

          for x in lines:
              if x not in seen:
                  seen.add(x)
                  final.append(x)

          out.write_text("\n".join(final) + "\n")

          print("Candidate settings:", len(final))
          PY

      - name: Build Kconfig symbol database
        run: |
          set -e

          echo "========================================"
          echo "BUILDING KCONFIG DATABASE"
          echo "========================================"

          : > audit/reports/kconfig_database.txt

          grep -RhsE \
            '^[[:space:]]*(config|menuconfig)[[:space:]]+[A-Za-z0-9_]+' \
            --include='Kconfig' \
            --include='Kconfig.*' \
            . \
            2>/dev/null \
            | sort -u \
            > audit/reports/kconfig_database.txt

          wc -l audit/reports/kconfig_database.txt

      - name: Deep source tree analysis
        run: |
          set -e

          : > audit/reports/02_defined_in_kconfig.txt
          : > audit/reports/03_source_presence.txt
          : > audit/reports/04_dependency_analysis.txt
          : > audit/reports/05_safe_candidates.txt
          : > audit/reports/06_rejected.txt

          while IFS= read -r request; do

              [ -z "$request" ] && continue

              case "$request" in

                  CONFIG_*=*)
                      symbol="${request%%=*}"
                      ;;

                  "# CONFIG_"*" is not set")
                      symbol="${request#\# }"
                      symbol="${symbol% is not set}"
                      ;;

                  *)
                      continue
                      ;;

              esac

              name="${symbol#CONFIG_}"

              echo "========================================"
              echo "SYMBOL: $symbol"
              echo "REQUEST: $request"
              echo "========================================"

              config_hits="$(
                  grep -RIl \
                    --exclude-dir=.git \
                    --exclude='*.o' \
                    --exclude='*.ko' \
                    --exclude='*.a' \
                    --exclude='*.cmd' \
                    --exclude='*.d' \
                    -E "^[[:space:]]*(config|menuconfig)[[:space:]]+$name([[:space:]]|$)" \
                    . 2>/dev/null \
                    | head -n 50 || true
              )"

              if [ -n "$config_hits" ]; then

                  {
                      echo "========================================"
                      echo "SYMBOL: $symbol"
                      echo "REQUEST: $request"
                      echo "STATUS: DEFINED IN KCONFIG"
                      echo
                      echo "$config_hits"
                      echo
                  } >> audit/reports/02_defined_in_kconfig.txt

              else

                  {
                      echo "========================================"
                      echo "SYMBOL: $symbol"
                      echo "REQUEST: $request"
                      echo "STATUS: NOT DEFINED IN KCONFIG"
                      echo "========================================"
                      echo
                  } >> audit/reports/06_rejected.txt

                  continue
              fi

              source_hits="$(
                  grep -RIn \
                    --exclude-dir=.git \
                    --exclude='*.o' \
                    --exclude='*.ko' \
                    --exclude='*.a' \
                    --exclude='*.cmd' \
                    --exclude='*.d' \
                    -E "\b(CONFIG_${name}|IS_ENABLED\(CONFIG_${name}\)|IS_REACHABLE\(CONFIG_${name}\))\b" \
                    . 2>/dev/null \
                    | head -n 100 || true
              )"

              {
                  echo "========================================"
                  echo "SYMBOL: $symbol"
                  echo "REQUEST: $request"
                  echo "========================================"

                  if [ -n "$source_hits" ]; then
                      echo "SOURCE REFERENCES: FOUND"
                      echo
                      echo "$source_hits"
                  else
                      echo "SOURCE REFERENCES: NONE FOUND"
                  fi

                  echo
              } >> audit/reports/03_source_presence.txt

              dep_hits="$(
                  grep -RIn \
                    --exclude-dir=.git \
                    --include='Kconfig' \
                    --include='Kconfig.*' \
                    -E "depends on .*${name}|select .*${name}|imply .*${name}" \
                    . 2>/dev/null \
                    | head -n 100 || true
              )"

              {
                  echo "========================================"
                  echo "SYMBOL: $symbol"
                  echo "REQUEST: $request"
                  echo "========================================"

                  if [ -n "$dep_hits" ]; then
                      echo "DEPENDENCY / SELECT / IMPLY:"
                      echo
                      echo "$dep_hits"
                  else
                      echo "DEPENDENCY REFERENCES: NONE FOUND"
                  fi

                  echo
              } >> audit/reports/04_dependency_analysis.txt

              source_count=0
              dep_count=0

              if [ -n "$source_hits" ]; then
                  source_count=1
              fi

              if [ -n "$dep_hits" ]; then
                  dep_count=1
              fi

              if [ "$source_count" -eq 1 ]; then

                  {
                      echo "$request"
                  } >> audit/reports/05_safe_candidates.txt

              else

                  {
                      echo "========================================"
                      echo "SYMBOL: $symbol"
                      echo "REQUEST: $request"
                      echo "REASON: Kconfig exists but no source reference detected"
                      echo "========================================"
                      echo
                  } >> audit/reports/06_rejected.txt

              fi

          done < audit/reports/01_all_296.txt

      - name: Run Kconfig resolution test
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          rm -rf audit/out
          mkdir -p audit/out

          make O=audit/out vendor/sdmsteppe-perf_defconfig \
            > audit/reports/kconfig_base.log 2>&1

          cp audit/out/.config audit/out/base.config

          ./scripts/kconfig/merge_config.sh \
            -O audit/out \
            audit/out/base.config \
            audit/joker/violet-perf_defconfig \
            > audit/reports/kconfig_merge.log 2>&1 || true

          test -f audit/out/.config

          make O=audit/out olddefconfig \
            > audit/reports/kconfig_resolve.log 2>&1

          cp audit/out/.config audit/out/resolved.config

          echo "Kconfig resolution completed."

      - name: Final candidate verification
        run: |
          set -e

          tmp="audit/reports/safe.tmp"
          final="audit/reports/05_safe_candidates.txt"

          : > "$tmp"

          while IFS= read -r request; do

              [ -z "$request" ] && continue

              case "$request" in
                  CONFIG_*=*)
                      symbol="${request%%=*}"
                      ;;
                  "# CONFIG_"*" is not set")
                      symbol="${request#\# }"
                      symbol="${symbol% is not set}"
                      ;;
                  *)
                      continue
                      ;;
              esac

              if grep -q -F "$request" audit/out/resolved.config; then
                  echo "$request" >> "$tmp"
              fi

          done < audit/reports/01_all_296.txt

          sort -u "$tmp" > "$final"
          rm -f "$tmp"

      - name: Generate summary
        run: |
          set -e

          total=$(grep -c '^' audit/reports/01_all_296.txt || true)
          defined=$(grep -c '^SYMBOL:' audit/reports/02_defined_in_kconfig.txt || true)
          source_refs=$(grep -c '^SOURCE REFERENCES: FOUND' audit/reports/03_source_presence.txt || true)
          candidates=$(grep -c '^CONFIG_' audit/reports/05_safe_candidates.txt || true)
          rejected=$(grep -c '^SYMBOL:' audit/reports/06_rejected.txt || true)

          {
              echo "========================================"
              echo "VIOLET DEEP JOKER AUDIT"
              echo "========================================"
              echo
              echo "Joker settings       : $total"
              echo "Defined in Kconfig   : $defined"
              echo "Source references    : $source_refs"
              echo "Final candidates     : $candidates"
              echo "Rejected             : $rejected"
              echo
              echo "========================================"
              echo "ANALYSIS"
              echo "========================================"
              echo
              echo "Syntax validation    : PASSED"
              echo "Kconfig resolution   : PERFORMED"
              echo "Source tree scan     : PERFORMED"
              echo "Dependency scan      : PERFORMED"
              echo "Kernel build         : NOT PERFORMED"
              echo
              echo "violet.config        : NOT MODIFIED"
              echo
              echo "========================================"
          } > audit/reports/07_summary.txt

          cat audit/reports/07_summary.txt

      - name: Upload seven reports
        uses: actions/upload-artifact@v4
        with:
          name: violet-joker-deep-audit
          path: |
            audit/reports/01_all_296.txt
            audit/reports/02_defined_in_kconfig.txt
            audit/reports/03_source_presence.txt
            audit/reports/04_dependency_analysis.txt
            audit/reports/05_safe_candidates.txt
            audit/reports/06_rejected.txt
            audit/reports/07_summary.txt
          if-no-files-found: error
