name: Build BBG Only - Linux 4.14

on:
  workflow_dispatch:

jobs:
  bbg-only:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          sudo apt update

          sudo apt install -y \
            git \
            curl \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            device-tree-compiler \
            build-essential \
            make \
            gcc \
            g++ \
            python3

      - name: Show default Make
        run: |
          set -e

          echo "========================================"
          echo "DEFAULT MAKE"
          echo "========================================"

          which make
          make --version

      - name: Build and install GNU Make 4.4.1
        run: |
          set -e

          echo "========================================"
          echo "BUILDING GNU MAKE 4.4.1"
          echo "========================================"

          cd /tmp

          curl -LO https://ftp.gnu.org/gnu/make/make-4.4.1.tar.gz

          tar xzf make-4.4.1.tar.gz

          cd make-4.4.1

          ./configure --prefix=/usr/local

          make -j"$(nproc)"

          sudo make install

          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Verify Make 4.4.1
        run: |
          set -e

          export PATH="/usr/local/bin:$PATH"

          echo "========================================"
          echo "UPDATED MAKE"
          echo "========================================"

          which make
          make --version

      - name: Clone LineageOS Toolchains
        run: |
          set -e

          echo "========================================"
          echo "CLONING TOOLCHAINS"
          echo "========================================"

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            clang

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

      - name: Setup Toolchain
        run: |
          set -e

          export PATH="/usr/local/bin:$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          echo "PATH=$PATH" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE=aarch64-linux-android-" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-" >> "$GITHUB_ENV"

          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

          echo "========================================"
          echo "CLANG"
          echo "========================================"

          which clang
          clang --version

          echo
          echo "========================================"
          echo "LLD"
          echo "========================================"

          which ld.lld
          ld.lld --version

          echo
          echo "========================================"
          echo "LLVM TOOLS"
          echo "========================================"

          which llvm-ar
          which llvm-nm
          which llvm-objcopy
          which llvm-objdump
          which llvm-strip

          echo
          echo "========================================"
          echo "GCC 64"
          echo "========================================"

          which aarch64-linux-android-gcc
          aarch64-linux-android-gcc --version | head -1

          echo
          echo "========================================"
          echo "GCC 32"
          echo "========================================"

          which arm-linux-androideabi-gcc
          arm-linux-androideabi-gcc --version | head -1

      - name: Clone Baseband-guard
        run: |
          set -e

          echo "========================================"
          echo "CLONING BASEBAND-GUARD"
          echo "========================================"

          git clone \
            --depth=1 \
            https://github.com/vc-teahouse/Baseband-guard.git \
            Baseband-guard

      - name: Prepare Baseband-guard
        run: |
          set -e

          echo "========================================"
          echo "BASEBAND-GUARD SETUP"
          echo "========================================"

          chmod +x Baseband-guard/setup.sh

          ./Baseband-guard/setup.sh

          echo
          echo "========================================"
          echo "BBG FILES AFTER SETUP"
          echo "========================================"

          ls -la security/baseband-guard

      - name: Select Violet Defconfig
      - name: Select Violet Perf Defconfig
        run: |
          set -e

          echo "========================================"
          echo "SELECT DEFCONFIG"
          echo "========================================"

          DEFCONFIG="vendor/violet-perf_defconfig"

          if [ ! -f "arch/arm64/configs/$DEFCONFIG" ]; then
            echo "[ERROR] Defconfig not found:"
            echo "arch/arm64/configs/$DEFCONFIG"
            exit 1
          fi

          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_ENV"

          echo "[OK] Selected: $DEFCONFIG"

      - name: Generate Kernel Configuration
        run: |
          set -e

          echo "========================================"
          echo "GENERATE KERNEL CONFIG"
          echo "========================================"

          make O=out \
            ARCH=arm64 \
            "$DEFCONFIG"

          echo
          echo "========================================"
          echo "INITIAL CONFIG"
          echo "========================================"

          grep -E \
            '^(CONFIG_SECURITY=|CONFIG_SECURITY_SELINUX=|CONFIG_LSM=|CONFIG_BBG=|CONFIG_BBG_BLOCK_)' \
            out/.config \
            || true

      - name: Force BBG Configuration
        run: |
          set -e

          echo "========================================"
          echo "FORCE BBG"
          echo "========================================"

          scripts/config \
            --file out/.config \
            --enable BBG

          CURRENT_LSM="$(grep '^CONFIG_LSM=' out/.config | sed 's/^CONFIG_LSM="//; s/"$//' || true)"

          if [ -z "$CURRENT_LSM" ]; then
            echo "[ERROR] CONFIG_LSM not found"
            exit 1
          fi

          echo
          echo "CURRENT CONFIG_LSM:"
          echo "$CURRENT_LSM"

          case ",$CURRENT_LSM," in
            *,baseband_guard,*)
              echo "[OK] baseband_guard already exists"
              ;;
            *)
              NEW_LSM="${CURRENT_LSM},baseband_guard"

              echo
              echo "NEW CONFIG_LSM:"
              echo "$NEW_LSM"

              scripts/config \
                --file out/.config \
                --set-str LSM "$NEW_LSM"
              ;;
          esac

          make O=out \
            ARCH=arm64 \
            olddefconfig

      - name: Verify Final BBG Configuration
        run: |
          set -e

          echo "========================================"
          echo "FINAL BBG CONFIGURATION"
          echo "========================================"

          grep -E \
            '^(CONFIG_SECURITY=|CONFIG_SECURITY_SELINUX=|CONFIG_INTEGRITY=|CONFIG_LSM=|CONFIG_BBG=|CONFIG_BBG_BLOCK_)' \
            out/.config \
            || true

          echo
          echo "========================================"
          echo "BBG CHECKS"
          echo "========================================"

          if grep -q '^CONFIG_BBG=y$' out/.config; then
            echo "[OK] CONFIG_BBG=y"
          else
            echo "[FAIL] CONFIG_BBG=y missing"
            exit 1
          fi

          if grep -q '^CONFIG_LSM=.*baseband_guard' out/.config; then
            echo "[OK] baseband_guard present in CONFIG_LSM"
          else
            echo "[FAIL] baseband_guard missing from CONFIG_LSM"
            exit 1
          fi

          echo
          echo "========================================"
          echo "BBG SOURCE INTEGRATION"
          echo "========================================"

          grep -n \
            'baseband-guard' \
            security/Makefile \
            security/Kconfig \
            || true

      - name: Prepare Kernel Headers Only
        run: |
          set -e

          echo "========================================"
          echo "MODULES PREPARE"
          echo "========================================"

          make -j2 \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            modules_prepare

      - name: Build BBG Objects Only
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILD BASEBAND-GUARD ONLY"
          echo "========================================"

          echo
          echo "IMPORTANT:"
          echo "No kernel Image target will be requested."
          echo "Only security/baseband-guard is built."

          echo
          echo "========================================"
          echo "BBG BUILD START"
          echo "========================================"

          make V=1 \
            -j2 \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            security/baseband-guard/ \
            2>&1 | tee bbg-build.log

          BUILD_RESULT=${PIPESTATUS[0]}

          echo "$BUILD_RESULT" > bbg-build-result.txt

          echo
          echo "========================================"
          echo "BBG BUILD EXIT CODE"
          echo "========================================"

          cat bbg-build-result.txt

          exit "$BUILD_RESULT"

      - name: Analyze BBG Build
        if: always()
        run: |
          set +e

          echo "========================================"
          echo "BBG BUILD ANALYSIS"
          echo "========================================"

          echo
          echo "========================================"
          echo "BBG OBJECT FILES"
          echo "========================================"

          find out/security/baseband-guard \
            -type f \
            \( \
              -name '*.o' \
              -o -name '*.lto.o' \
              -o -name '*.cmd' \
              -o -name '*.symversions' \
              -o -name '*.mod.c' \
              -o -name '*.mod.o' \
            \) \
            -print \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "BBG DIRECTORY"
          echo "========================================"

          find out/security/baseband-guard \
            -maxdepth 2 \
            -type f \
            -print \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "BASEBAND-GUARD BUILD MESSAGES"
          echo "========================================"

          grep -i -E \
            'baseband|bbg|clang|llvm|error|warning|CC |LD |AR ' \
            bbg-build.log \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "ERRORS"
          echo "========================================"

          grep -n -E \
            'error:|Error:|ERROR:|undefined reference|No rule to make target|recipe for target' \
            bbg-build.log \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "WARNINGS"
          echo "========================================"

          grep -n -E \
            'warning:|Warning:|WARNING:' \
            bbg-build.log \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "SYMVERSION FILES"
          echo "========================================"

          find out/security/baseband-guard \
            -type f \
            -name '*.symversions' \
            -print \
            -exec sh -c '
              echo
              echo "===== $1 ====="
              wc -l "$1"
              cat "$1"
            ' _ {} \; \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "CONFIG"
          echo "========================================"

          grep -E \
            '^(CONFIG_SECURITY=|CONFIG_SECURITY_SELINUX=|CONFIG_LSM=|CONFIG_BBG=|CONFIG_BBG_BLOCK_)' \
            out/.config \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "KERNEL IMAGE CHECK"
          echo "========================================"

          if [ -f out/arch/arm64/boot/Image ]; then
            echo "[WARNING] Kernel Image exists."
            echo "This workflow did NOT request an Image build."
          else
            echo "[OK] No Kernel Image was built."
          fi

          echo
          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          cat bbg-build-result.txt 2>/dev/null || true

          echo
          echo "========================================"
          echo "DONE"
          echo "========================================"

      - name: Upload BBG Diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bbg-only-linux-4.14-diagnostic
          path: |
            bbg-build.log
            bbg-build-result.txt
            out/.config
            out/security/baseband-guard/
            security/baseband-guard/
          if-no-files-found: warn
