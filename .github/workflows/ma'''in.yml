name: Analyze Patch Equivalence

on:
  workflow_dispatch:

jobs:
  patch-equivalence:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout loma
        uses: actions/checkout@v4
        with:
          ref: loma
          fetch-depth: 0

      - name: Fetch manipvlator branches
        run: |
          set -e

          git remote add manipvlator https://github.com/manipvlator/los_kernel_xiaomi_sm6150.git

          git fetch manipvlator stable
          git fetch manipvlator new-base

      - name: Analyze patch equivalence
        shell: bash
        run: |
          set -e

          LOMA="loma"
          LAST_16="d0aaf0bb8c44592ccfba215b39aa310cbe6ef837"
          OLD_16="decff20960fbe1dda48b9bcf8d60a3cf5e63b9ba"
          STABLE="manipvlator/stable"
          NEW_BASE="manipvlator/new-base"
          BASE="e03e5ba22586be70673afb5d3c3f70510524e658"

          echo "=================================================="
          echo "PATCH EQUIVALENCE ANALYSIS"
          echo "=================================================="

          echo
          echo "LOMA:"
          git show -s --format='%H | %ad | %an | %s' --date=iso "$LOMA"

          echo
          echo "LAST 16 SYNC:"
          git show -s --format='%H | %ad | %an | %s' --date=iso "$LAST_16"

          echo
          echo "OLD 16 POINT:"
          git show -s --format='%H | %ad | %an | %s' --date=iso "$OLD_16"

          echo
          echo "STABLE:"
          git show -s --format='%H | %ad | %an | %s' --date=iso "$STABLE"

          echo
          echo "NEW-BASE:"
          git show -s --format='%H | %ad | %an | %s' --date=iso "$NEW_BASE"

          echo
          echo "COMMON BASE:"
          git show -s --format='%H | %ad | %an | %s' --date=iso "$BASE"

          echo
          echo "=================================================="
          echo "1. STABLE VS LOMA"
          echo "=================================================="

          echo
          echo "Commits in stable not in loma:"
          git log --oneline --decorate "$LOMA..$STABLE"

          echo
          echo "Patch-equivalent analysis:"
          git cherry -v "$LOMA" "$STABLE"

          echo
          echo "=================================================="
          echo "2. NEW-BASE VS LOMA"
          echo "=================================================="

          echo
          echo "Commits in new-base not in loma:"
          git log --oneline --decorate "$LOMA..$NEW_BASE"

          echo
          echo "Patch-equivalent analysis:"
          git cherry -v "$LOMA" "$NEW_BASE"

          echo
          echo "=================================================="
          echo "3. LAST 16 SYNC VS STABLE"
          echo "=================================================="

          echo
          echo "Commits after d0aaf0b according to stable:"
          git log --oneline --decorate "$LAST_16..$STABLE"

          echo
          echo "Patch-equivalence against d0aaf0b:"
          git cherry -v "$LAST_16" "$STABLE"

          echo
          echo "=================================================="
          echo "4. LAST 16 SYNC VS NEW-BASE"
          echo "=================================================="

          echo
          echo "Commits after d0aaf0b according to new-base:"
          git log --oneline --decorate "$LAST_16..$NEW_BASE"

          echo
          echo "Patch-equivalence against d0aaf0b:"
          git cherry -v "$LAST_16" "$NEW_BASE"

          echo
          echo "=================================================="
          echo "5. OLD 16 POINT VS STABLE"
          echo "=================================================="

          echo
          echo "Patch-equivalence:"
          git cherry -v "$OLD_16" "$STABLE"

          echo
          echo "=================================================="
          echo "6. OLD 16 POINT VS NEW-BASE"
          echo "=================================================="

          echo
          echo "Patch-equivalence:"
          git cherry -v "$OLD_16" "$NEW_BASE"

          echo
          echo "=================================================="
          echo "7. SUMMARY COUNTS"
          echo "=================================================="

          echo
          echo "Stable unique commits:"
          git rev-list --count "$LOMA..$STABLE"

          echo
          echo "New-base unique commits:"
          git rev-list --count "$LOMA..$NEW_BASE"

          echo
          echo "Stable unique patch-equivalents:"
          git cherry "$LOMA" "$STABLE" | grep '^+' | wc -l

          echo
          echo "Stable already-equivalent patches:"
          git cherry "$LOMA" "$STABLE" | grep '^-' | wc -l

          echo
          echo "New-base unique patch-equivalents:"
          git cherry "$LOMA" "$NEW_BASE" | grep '^+' | wc -l

          echo
          echo "New-base already-equivalent patches:"
          git cherry "$LOMA" "$NEW_BASE" | grep '^-' | wc -l
