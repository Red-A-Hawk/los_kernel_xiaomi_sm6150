name: LTO MODPOST Diagnostic (violet)

on:
  workflow_dispatch:

jobs:
  diagnostic:

    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: k

    steps:

    # ============================================================
    # 1. CHECKOUT
    # ============================================================

    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: 16
        fetch-depth: 1
        path: k


    # ============================================================
    # 2. DEPENDENCIES
    # ============================================================

    - name: Install dependencies
      run: |
        set -e

        sudo apt-get update

        sudo apt-get install -y \
          git \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          libncurses-dev \
          device-tree-compiler \
          make \
          python3 \
          zip \
          unzip \
          curl \
          wget


    # ============================================================
    # 3. TOOLCHAINS
    # ============================================================

    - name: Download LineageOS Toolchains
      run: |
        set -e

        echo "============================================================"
        echo "DOWNLOADING TOOLCHAINS"
        echo "============================================================"

        rm -rf clang gcc64 gcc32 out

        git clone \
          --depth=1 \
          https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
          clang

        git clone \
          --depth=1 \
          https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
          gcc64

        git clone \
          --depth=1 \
          https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
          gcc32

        echo "[PASS] Toolchains downloaded"


    # ============================================================
    # 4. ENVIRONMENT
    # ============================================================

    - name: Setup LLVM Environment
      run: |
        set -e

        export CLANG_PATH="$GITHUB_WORKSPACE/k/clang"
        export GCC64_PATH="$GITHUB_WORKSPACE/k/gcc64"
        export GCC32_PATH="$GITHUB_WORKSPACE/k/gcc32"

        echo "CLANG_PATH=$CLANG_PATH" >> "$GITHUB_ENV"
        echo "GCC64_PATH=$GCC64_PATH" >> "$GITHUB_ENV"
        echo "GCC32_PATH=$GCC32_PATH" >> "$GITHUB_ENV"

        echo "CROSS_COMPILE=aarch64-linux-android-" >> "$GITHUB_ENV"
        echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-" >> "$GITHUB_ENV"
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

        echo "LLVM=1" >> "$GITHUB_ENV"
        echo "LLVM_IAS=1" >> "$GITHUB_ENV"

        echo "PATH=$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH" >> "$GITHUB_ENV"


    # ============================================================
    # 5. TOOLCHAIN DIAGNOSTIC
    # ============================================================

    - name: Toolchain Diagnostic
      run: |
        set +e

        REPORT="toolchain-diagnostic.txt"

        : > "$REPORT"

        echo "============================================================" >> "$REPORT"
        echo "TOOLCHAIN DIAGNOSTIC" >> "$REPORT"
        echo "============================================================" >> "$REPORT"

        echo "" >> "$REPORT"
        echo "PATH=$PATH" >> "$REPORT"

        echo "" >> "$REPORT"
        echo "CLANG" >> "$REPORT"

        CLANG_BIN="$CLANG_PATH/bin/clang"

        if [ -x "$CLANG_BIN" ]; then
          echo "[PASS] clang executable exists" >> "$REPORT"
          "$CLANG_BIN" --version >> "$REPORT" 2>&1
        else
          echo "[FAIL] clang executable missing" >> "$REPORT"
        fi

        echo "" >> "$REPORT"
        echo "LLD" >> "$REPORT"

        LLD_BIN="$CLANG_PATH/bin/ld.lld"

        if [ -x "$LLD_BIN" ]; then
          echo "[PASS] ld.lld executable exists" >> "$REPORT"
          "$LLD_BIN" --version >> "$REPORT" 2>&1
        else
          echo "[FAIL] ld.lld executable missing" >> "$REPORT"
        fi

        echo "" >> "$REPORT"
        echo "LLVM BINARIES" >> "$REPORT"

        for tool in \
          llvm-ar \
          llvm-nm \
          llvm-objcopy \
          llvm-objdump \
          llvm-strip \
          llvm-readelf
        do

          if command -v "$tool" >/dev/null 2>&1; then
            echo "[PASS] $tool" >> "$REPORT"
          else
            echo "[FAIL] $tool" >> "$REPORT"
          fi

        done

        echo "" >> "$REPORT"
        echo "AARCH64 GCC" >> "$REPORT"

        if [ -x "$GCC64_PATH/bin/aarch64-linux-android-gcc" ]; then
          echo "[PASS] AArch64 GCC exists" >> "$REPORT"
          "$GCC64_PATH/bin/aarch64-linux-android-gcc" --version \
            | head -3 >> "$REPORT" 2>&1
        else
          echo "[FAIL] AArch64 GCC missing" >> "$REPORT"
        fi

        echo "" >> "$REPORT"
        echo "ARM32 GCC" >> "$REPORT"

        if [ -x "$GCC32_PATH/bin/arm-linux-androideabi-gcc" ]; then
          echo "[PASS] ARM32 GCC exists" >> "$REPORT"
          "$GCC32_PATH/bin/arm-linux-androideabi-gcc" --version \
            | head -3 >> "$REPORT" 2>&1
        else
          echo "[FAIL] ARM32 GCC missing" >> "$REPORT"
        fi

        cat "$REPORT"


    # ============================================================
    # 6. LOAD DEFCONFIG
    # ============================================================

    - name: Load violet-perf defconfig
      run: |
        set -e

        export ARCH=arm64

        mkdir -p out

        make O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          AS=llvm-as \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          CROSS_COMPILE="$CROSS_COMPILE" \
          CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
          CLANG_TRIPLE="$CLANG_TRIPLE" \
          vendor/violet-perf_defconfig

        test -f out/.config

        echo "[PASS] violet-perf defconfig generated"


    # ============================================================
    # 7. KERNEL CONFIGURATION
    # ============================================================

    - name: Kernel Configuration Diagnostic
      run: |
        set -e

        REPORT="kernel-configuration.txt"

        : > "$REPORT"

        echo "============================================================" >> "$REPORT"
        echo "KERNEL CONFIGURATION" >> "$REPORT"
        echo "============================================================" >> "$REPORT"

        for cfg in \
          CONFIG_LTO_CLANG \
          CONFIG_LTO_CLANG_FULL \
          CONFIG_LTO_CLANG_THIN \
          CONFIG_LTO_CLANG_NONE \
          CONFIG_MODVERSIONS \
          CONFIG_MODULES \
          CONFIG_HAVE_ARCH_PREL32_RELOCATIONS \
          CONFIG_KPROBES \
          CONFIG_KALLSYMS \
          CONFIG_KALLSYMS_ALL \
          CONFIG_TRIM_UNUSED_KSYMS \
          CONFIG_CFI_CLANG \
          CONFIG_LD_IS_LLD \
          CONFIG_LD_VERSION
        do

          value=$(grep "^${cfg}=" out/.config 2>/dev/null | head -1)

          if [ -n "$value" ]; then
            echo "$value" >> "$REPORT"
          else
            echo "${cfg}=NOT_SET" >> "$REPORT"
          fi

        done

        cat "$REPORT"


    # ============================================================
    # 8. LTO COMPATIBILITY
    # ============================================================

    - name: LTO Compatibility Diagnostic
      run: |
        set -e

        REPORT="lto-compatibility.txt"

        : > "$REPORT"

        echo "============================================================" >> "$REPORT"
        echo "LTO COMPATIBILITY" >> "$REPORT"
        echo "============================================================" >> "$REPORT"

        LTO=$(grep '^CONFIG_LTO_CLANG=' out/.config | head -1)
        MODVERSIONS=$(grep '^CONFIG_MODVERSIONS=' out/.config | head -1)
        PREL32=$(grep '^CONFIG_HAVE_ARCH_PREL32_RELOCATIONS=' out/.config | head -1)

        echo "LTO          : ${LTO:-NOT_SET}" >> "$REPORT"
        echo "MODVERSIONS  : ${MODVERSIONS:-NOT_SET}" >> "$REPORT"
        echo "PREL32       : ${PREL32:-NOT_SET}" >> "$REPORT"

        if grep -q '^CONFIG_LTO_CLANG=y' out/.config; then
          echo "[PASS] CONFIG_LTO_CLANG enabled" >> "$REPORT"
        else
          echo "[WARN] CONFIG_LTO_CLANG disabled" >> "$REPORT"
        fi

        if grep -q '^CONFIG_MODVERSIONS=y' out/.config; then
          echo "[PASS] CONFIG_MODVERSIONS enabled" >> "$REPORT"
        else
          echo "[WARN] CONFIG_MODVERSIONS disabled" >> "$REPORT"
        fi

        cat "$REPORT"


    # ============================================================
    # 9. MAKEFILE BUILD
    # ============================================================

    - name: Makefile Build Diagnostic
      run: |
        set +e

        REPORT="makefile-build-diagnostic.txt"

        : > "$REPORT"

        echo "============================================================" >> "$REPORT"
        echo "MAKEFILE.BUILD" >> "$REPORT"
        echo "============================================================" >> "$REPORT"

        if [ -f scripts/Makefile.build ]; then
          echo "[PASS] scripts/Makefile.build exists" >> "$REPORT"
        else
          echo "[FAIL] scripts/Makefile.build missing" >> "$REPORT"
        fi

        echo "" >> "$REPORT"
        echo "--- update_lto_symversions ---" >> "$REPORT"

        grep -n \
          -A15 \
          -B5 \
          "update_lto_symversions" \
          scripts/Makefile.build \
          >> "$REPORT" 2>&1 || true

        echo "" >> "$REPORT"
        echo "--- cmd_link_multi ---" >> "$REPORT"

        grep -n \
          -A15 \
          -B5 \
          "cmd_link_multi" \
          scripts/Makefile.build \
          >> "$REPORT" 2>&1 || true

        echo "" >> "$REPORT"
        echo "--- link_multi_deps ---" >> "$REPORT"

        grep -n \
          -A10 \
          -B5 \
          "link_multi_deps" \
          scripts/Makefile.build \
          >> "$REPORT" 2>&1 || true

        echo "" >> "$REPORT"
        echo "--- response files ---" >> "$REPORT"

        grep -n \
          -E '\.rsp|\$\(file >' \
          scripts/Makefile.build \
          >> "$REPORT" 2>&1 || true

        echo "" >> "$REPORT"
        echo "--- symversion implementation ---" >> "$REPORT"

        if grep -q 'foreach n' scripts/Makefile.build && \
           grep -q 'wildcard.*symversions' scripts/Makefile.build
        then
          echo "[PASS] Argument-list-safe symversion implementation detected" >> "$REPORT"
        else
          echo "[WARN] Expected symversion fix not detected" >> "$REPORT"
        fi

        cat "$REPORT"


    # ============================================================
    # 10. MODPOST SOURCE DIAGNOSTIC
    # ============================================================

    - name: MODPOST Source Diagnostic
      run: |
        set +e

        REPORT="modpost-source-diagnostic.txt"

        : > "$REPORT"

        echo "============================================================" >> "$REPORT"
        echo "MODPOST" >> "$REPORT"
        echo "============================================================" >> "$REPORT"

        for file in \
          scripts/mod/modpost.c \
          scripts/mod/modpost.h \
          scripts/Makefile.modpost \
          scripts/Makefile.lib \
          include/linux/export.h
        do

          echo "" >> "$REPORT"
          echo "--- $file ---" >> "$REPORT"

          if [ -f "$file" ]; then
            echo "[PASS] file exists" >> "$REPORT"
          else
            echo "[FAIL] file missing" >> "$REPORT"
          fi

        done

        echo "" >> "$REPORT"
        echo "--- version generation code ---" >> "$REPORT"

        grep -n \
          -A12 \
          -B8 \
          "version generation failed" \
          scripts/mod/modpost.c \
          >> "$REPORT" 2>&1 || true

        echo "" >> "$REPORT"
        echo "--- handle_modversions ---" >> "$REPORT"

        grep -n \
          -A35 \
          -B8 \
          "handle_modversions" \
          scripts/mod/modpost.c \
          >> "$REPORT" 2>&1 || true

        echo "" >> "$REPORT"
        echo "--- CRC handling ---" >> "$REPORT"

        grep -n \
          -A20 \
          -B10 \
          "__crc_" \
          scripts/mod/modpost.c \
          >> "$REPORT" 2>&1 || true

        cat "$REPORT"


    # ============================================================
    # 11. EXPORT.H DIAGNOSTIC
    # ============================================================

    - name: Export Symbol Diagnostic
      run: |
        set +e

        REPORT="export-symbol-diagnostic.txt"

        : > "$REPORT"

        echo "============================================================" >> "$REPORT"
        echo "EXPORT / SYMBOL VERSIONING" >> "$REPORT"
        echo "============================================================" >> "$REPORT"

        echo "--- export.h CRC code ---" >> "$REPORT"

        grep -n \
          -A12 \
          -B8 \
          "__CRC_SYMBOL" \
          include/linux/export.h \
          >> "$REPORT" 2>&1 || true

        echo "" >> "$REPORT"
        echo "--- EXPORT_SYMBOL definitions ---" >> "$REPORT"

        grep -n \
          -A8 \
          -B4 \
          "EXPORT_SYMBOL" \
          include/linux/export.h \
          >> "$REPORT" 2>&1 || true

        cat "$REPORT"


    # ============================================================
    # 12. GSPCA SOURCE DIAGNOSTIC
    # ============================================================

    - name: GSPCA Diagnostic
      run: |
        set +e

        REPORT="gspca-diagnostic.txt"

        : > "$REPORT"

        echo "============================================================" >> "$REPORT"
        echo "GSPCA EXPORTS" >> "$REPORT"
        echo "============================================================" >> "$REPORT"

        for file in \
          drivers/media/usb/gspca/gspca.c \
          drivers/media/usb/gspca/gspca.h
        do

          echo "" >> "$REPORT"
          echo "--- $file ---" >> "$REPORT"

          if [ -f "$file" ]; then
            echo "[PASS] file exists" >> "$REPORT"
          else
            echo "[FAIL] file missing" >> "$REPORT"
          fi

        done

        echo "" >> "$REPORT"
        echo "--- EXPORT_SYMBOL references ---" >> "$REPORT"

        grep -n \
          -E 'EXPORT_SYMBOL|EXPORT_SYMBOL_GPL' \
          drivers/media/usb/gspca/gspca.c \
          >> "$REPORT" 2>&1 || true

        echo "" >> "$REPORT"
        echo "--- exported gspca symbols ---" >> "$REPORT"

        grep -n \
          -E \
          'gspca_debug|gspca_dev_probe|gspca_dev_probe2|gspca_disconnect|gspca_frame_add|gspca_suspend|gspca_resume|gspca_expo_autogain|gspca_coarse_grained_expo_autogain' \
          drivers/media/usb/gspca/gspca.c \
          >> "$REPORT" 2>&1 || true

        echo "" >> "$REPORT"
        echo "--- header declarations ---" >> "$REPORT"

        grep -n \
          -E \
          'gspca_debug|gspca_dev_probe|gspca_dev_probe2|gspca_disconnect|gspca_frame_add|gspca_suspend|gspca_resume' \
          drivers/media/usb/gspca/gspca.h \
          >> "$REPORT" 2>&1 || true

        cat "$REPORT"


    # ============================================================
    # 13. BUILD VARIABLES
    # ============================================================

    - name: LLVM Make Variable Diagnostic
      run: |
        set +e

        REPORT="build-variables.txt"

        : > "$REPORT"

        echo "============================================================" >> "$REPORT"
        echo "BUILD VARIABLES" >> "$REPORT"
        echo "============================================================" >> "$REPORT"

        make -s \
          O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          AS=llvm-as \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          CROSS_COMPILE="$CROSS_COMPILE" \
          CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
          CLANG_TRIPLE="$CLANG_TRIPLE" \
          -pn 2>/dev/null \
          | grep -E \
          '^(AR|AS|CC|LD|NM|OBJCOPY|OBJDUMP|STRIP|ARCH|CLANG_TRIPLE|CONFIG_MODVERSIONS|CROSS_COMPILE|CROSS_COMPILE_ARM32|LLVM|LLVM_IAS)[[:space:]]*=' \
          | sort -u \
          >> "$REPORT"

        echo "" >> "$REPORT"
        echo "[INFO] LLVM-aware Make database inspection completed" >> "$REPORT"

        cat "$REPORT"


    # ============================================================
    # 14. CROSS COMPILER TEST
    # ============================================================

    - name: Clang AArch64 Test
      run: |
        set -e

        rm -f /tmp/clang-test.o

        clang \
          --target=aarch64-linux-gnu \
          -c \
          -x c \
          /dev/null \
          -o /tmp/clang-test.o

        test -f /tmp/clang-test.o

        echo "[PASS] Clang AArch64 object compilation"


    # ============================================================
    # 15. LLD TEST
    # ============================================================

    - name: LLD AArch64 Test
      run: |
        set -e

        rm -f /tmp/lld-test.o
        rm -f /tmp/lld-test.elf

        cat > /tmp/lld-test.s <<'EOF'
        .text
        .global _start
        _start:
            nop
        EOF

        clang \
          --target=aarch64-linux-gnu \
          -c \
          /tmp/lld-test.s \
          -o /tmp/lld-test.o

        ld.lld \
          -m aarch64elf \
          -e _start \
          -o /tmp/lld-test.elf \
          /tmp/lld-test.o

        test -f /tmp/lld-test.elf

        echo "[PASS] LLD AArch64 link test"


    # ============================================================
    # 16. LLVM LTO OBJECT TEST
    # ============================================================

    - name: LLVM LTO Object Test
      run: |
        set -e

        rm -f /tmp/lto-test.o

        cat > /tmp/lto-test.c <<'EOF'
        int lto_test_function(int x)
        {
            return x + 1;
        }
        EOF

        clang \
          --target=aarch64-linux-gnu \
          -flto \
          -c \
          /tmp/lto-test.c \
          -o /tmp/lto-test.o

        test -f /tmp/lto-test.o

        echo "[PASS] LLVM LTO object generated"


    # ============================================================
    # 17. GSPCA EXPORT CRC TEST
    # ============================================================

    - name: GSPCA CRC Diagnostic
      run: |
        set +e

        REPORT="gspca-crc-diagnostic.txt"

        : > "$REPORT"

        echo "============================================================" >> "$REPORT"
        echo "GSPCA CRC / LTO DIAGNOSTIC" >> "$REPORT"
        echo "============================================================" >> "$REPORT"

        echo "" >> "$REPORT"
        echo "--- Existing build outputs ---" >> "$REPORT"

        find out \
          -type f \
          \( \
            -name 'gspca*.o' \
            -o -name 'gspca*.ko' \
            -o -name 'Module.symvers' \
            -o -name '*.symversions' \
          \) \
          -print \
          >> "$REPORT" 2>&1 || true

        echo "" >> "$REPORT"
        echo "--- Existing GSPCA CRC symbols ---" >> "$REPORT"

        if command -v llvm-nm >/dev/null 2>&1; then

          find out \
            -type f \
            \( \
              -name 'gspca*.o' \
              -o -name 'gspca*.ko' \
            \) \
            -print0 2>/dev/null \
            | while IFS= read -r -d '' file
            do
              echo "" >> "$REPORT"
              echo "FILE: $file" >> "$REPORT"

              llvm-nm \
                -a \
                "$file" \
                2>/dev/null \
                | grep -E '__crc_|gspca_(debug|dev_probe|dev_probe2|disconnect|frame_add|suspend|resume|expo_autogain)' \
                >> "$REPORT" 2>&1 || true
            done

        fi

        echo "" >> "$REPORT"
        echo "--- Module.symvers GSPCA entries ---" >> "$REPORT"

        find out \
          -name Module.symvers \
          -type f \
          -print0 2>/dev/null \
          | while IFS= read -r -d '' file
          do

            echo "" >> "$REPORT"
            echo "FILE: $file" >> "$REPORT"

            grep -E \
              'gspca_(debug|dev_probe|dev_probe2|disconnect|frame_add|suspend|resume|expo_autogain|coarse_grained_expo_autogain)' \
              "$file" \
              >> "$REPORT" 2>&1 || true

          done

        echo "" >> "$REPORT"
        echo "--- symversions GSPCA entries ---" >> "$REPORT"

        find out \
          -name '*.symversions' \
          -type f \
          -print0 2>/dev/null \
          | while IFS= read -r -d '' file
          do

            echo "" >> "$REPORT"
            echo "FILE: $file" >> "$REPORT"

            grep -E \
              'gspca_|__crc_' \
              "$file" \
              >> "$REPORT" 2>&1 || true

          done

        cat "$REPORT"


    # ============================================================
    # 18. LTO SOURCE REFERENCES
    # ============================================================

    - name: LTO Source References
      run: |
        set +e

        REPORT="lto-source-references.txt"

        : > "$REPORT"

        echo "============================================================" >> "$REPORT"
        echo "LTO SOURCE REFERENCES" >> "$REPORT"
        echo "============================================================" >> "$REPORT"

        grep -R -n \
          -E \
          'CONFIG_LTO_CLANG|update_lto_symversions|cmd_link_multi|module-lto' \
          scripts \
          arch/arm64/Makefile \
          arch/arm64/Kconfig \
          2>/dev/null \
          >> "$REPORT" || true

        cat "$REPORT"


    # ============================================================
    # 19. ARGUMENT LIST RISK
    # ============================================================

    - name: Argument List Diagnostic
      run: |
        set +e

        REPORT="argument-list-diagnostic.txt"

        : > "$REPORT"

        echo "============================================================" >> "$REPORT"
        echo "ARGUMENT LIST RISK" >> "$REPORT"
        echo "============================================================" >> "$REPORT"

        echo "--- suspicious command constructions ---" >> "$REPORT"

        grep -R -n \
          -E \
          'for .* in \$\(|\$\([^)]*_deps\)|\$\(link_multi_deps\)|\$\(filter-out FORCE' \
          scripts/Makefile.build \
          >> "$REPORT" 2>&1 || true

        echo "" >> "$REPORT"
        echo "--- response files ---" >> "$REPORT"

        grep -R -n \
          -E \
          '\.rsp|\$\(file >' \
          scripts/Makefile.build \
          >> "$REPORT" 2>&1 || true

        cat "$REPORT"


    # ============================================================
    # 20. SOURCE TREE
    # ============================================================

    - name: Source Tree Diagnostic
      run: |
        set -e

        REPORT="source-tree-diagnostic.txt"

        : > "$REPORT"

        echo "============================================================" >> "$REPORT"
        echo "SOURCE TREE CHECK" >> "$REPORT"
        echo "============================================================" >> "$REPORT"

        for path in \
          Makefile \
          Kconfig \
          scripts/Makefile \
          scripts/Makefile.build \
          scripts/Makefile.lib \
          scripts/Makefile.modpost \
          scripts/mod/modpost.c \
          scripts/mod/modpost.h \
          include/linux/export.h \
          arch/arm64/Makefile \
          arch/arm64/Kconfig \
          drivers/media/usb/gspca/gspca.c \
          drivers/media/usb/gspca/gspca.h
        do

          if [ -f "$path" ]; then
            echo "[PASS] $path" >> "$REPORT"
          else
            echo "[FAIL] $path" >> "$REPORT"
          fi

        done

        cat "$REPORT"


    # ============================================================
    # 21. FINAL SUMMARY
    # ============================================================

    - name: Final Diagnostic Summary
      run: |
        set +e

        REPORT="FINAL-LTO-MODPOST-DIAGNOSTIC.txt"

        : > "$REPORT"

        echo "============================================================" >> "$REPORT"
        echo "FINAL SUMMARY" >> "$REPORT"
        echo "============================================================" >> "$REPORT"

        echo "" >> "$REPORT"
        echo "Toolchain:" >> "$REPORT"

        if [ -x "$CLANG_PATH/bin/clang" ]; then
          echo "[PASS] clang" >> "$REPORT"
        else
          echo "[FAIL] clang" >> "$REPORT"
        fi

        if [ -x "$CLANG_PATH/bin/ld.lld" ]; then
          echo "[PASS] ld.lld" >> "$REPORT"
        else
          echo "[FAIL] ld.lld" >> "$REPORT"
        fi

        echo "" >> "$REPORT"
        echo "Configuration:" >> "$REPORT"

        grep -E \
          '^CONFIG_(LTO_CLANG|MODVERSIONS|MODULES)=' \
          out/.config \
          >> "$REPORT" 2>&1 || true

        echo "" >> "$REPORT"
        echo "Important LTO files:" >> "$REPORT"

        for file in \
          scripts/Makefile.build \
          scripts/mod/modpost.c \
          scripts/mod/modpost.h \
          scripts/Makefile.modpost \
          scripts/Makefile.lib \
          include/linux/export.h
        do

          if [ -f "$file" ]; then
            echo "[PASS] $file" >> "$REPORT"
          else
            echo "[FAIL] $file" >> "$REPORT"
          fi

        done

        echo "" >> "$REPORT"
        echo "Tests:" >> "$REPORT"

        echo "[PASS] Clang AArch64 object test" >> "$REPORT"
        echo "[PASS] LLD AArch64 link test" >> "$REPORT"
        echo "[PASS] LLVM LTO object test" >> "$REPORT"

        echo "" >> "$REPORT"
        echo "Important:" >> "$REPORT"
        echo "This workflow performs diagnostics only." >> "$REPORT"
        echo "No kernel build was started." >> "$REPORT"

        echo "" >> "$REPORT"
        echo "============================================================" >> "$REPORT"
        echo "DIAGNOSTIC COMPLETE" >> "$REPORT"
        echo "============================================================" >> "$REPORT"

        cat "$REPORT"


    # ============================================================
    # 22. UPLOAD ALL DIAGNOSTICS
    # ============================================================

    - name: Upload Diagnostic Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: LTO-MODPOST-Diagnostic-${{ github.run_number }}
        path: |
          k/*diagnostic*.txt
          k/*Diagnostic*.txt
          k/FINAL-LTO-MODPOST-DIAGNOSTIC.txt
          k/lto-compatibility.txt
          k/kernel-configuration.txt
          k/build-variables.txt
          k/gspca-crc-diagnostic.txt
          k/lto-source-references.txt
          k/argument-list-diagnostic.txt
          k/source-tree-diagnostic.txt
        if-no-files-found: warn
