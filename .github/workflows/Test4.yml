name: Kernel LTO Diagnostic (violet)

on:
  workflow_dispatch:

jobs:

  diagnostic:

    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: k

    steps:

    # ============================================================
    # 1. CHECKOUT
    # ============================================================

    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: 16
        fetch-depth: 1
        path: k


    # ============================================================
    # 2. DEPENDENCIES
    # ============================================================

    - name: Install dependencies
      run: |
        set -e

        sudo apt-get update

        sudo apt-get install -y \
          git \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          libncurses-dev \
          make \
          device-tree-compiler \
          python3 \
          curl \
          wget


    # ============================================================
    # 3. TOOLCHAINS
    # ============================================================

    - name: Download LineageOS Toolchains
      run: |
        set -e

        echo "============================================================"
        echo "DOWNLOADING TOOLCHAINS"
        echo "============================================================"

        rm -rf clang gcc64 gcc32

        git clone \
          --depth=1 \
          https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
          clang

        git clone \
          --depth=1 \
          https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
          gcc64

        git clone \
          --depth=1 \
          https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
          gcc32

        echo
        echo "TOOLCHAINS READY"


    # ============================================================
    # 4. ENVIRONMENT
    # ============================================================

    - name: Setup environment
      run: |
        set -e

        echo "CLANG_PATH=$GITHUB_WORKSPACE/k/clang" >> "$GITHUB_ENV"
        echo "GCC64_PATH=$GITHUB_WORKSPACE/k/gcc64" >> "$GITHUB_ENV"
        echo "GCC32_PATH=$GITHUB_WORKSPACE/k/gcc32" >> "$GITHUB_ENV"

        echo "CROSS_COMPILE=aarch64-linux-android-" >> "$GITHUB_ENV"
        echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-" >> "$GITHUB_ENV"
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"


    # ============================================================
    # 5. TOOLCHAIN DIAGNOSTIC
    # ============================================================

    - name: Toolchain diagnostic
      run: |
        set +e

        REPORT="$GITHUB_WORKSPACE/k/diagnostic.txt"

        : > "$REPORT"

        echo "============================================================" | tee -a "$REPORT"
        echo "TOOLCHAIN DIAGNOSTIC" | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"

        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo | tee -a "$REPORT"
        echo "PATH=$PATH" | tee -a "$REPORT"

        echo | tee -a "$REPORT"
        echo "CLANG" | tee -a "$REPORT"
        command -v clang | tee -a "$REPORT"
        clang --version 2>&1 | head -5 | tee -a "$REPORT"

        echo | tee -a "$REPORT"
        echo "LLD" | tee -a "$REPORT"
        command -v ld.lld | tee -a "$REPORT"
        ld.lld --version 2>&1 | head -3 | tee -a "$REPORT"

        echo | tee -a "$REPORT"
        echo "LLVM BINARIES" | tee -a "$REPORT"

        for tool in \
          llvm-ar \
          llvm-nm \
          llvm-objcopy \
          llvm-objdump \
          llvm-strip \
          llvm-readelf \
          llvm-objdump; do

          if command -v "$tool" >/dev/null 2>&1; then
            echo "[PASS] $tool" | tee -a "$REPORT"
          else
            echo "[FAIL] $tool" | tee -a "$REPORT"
          fi

        done

        echo | tee -a "$REPORT"
        echo "AARCH64 GCC" | tee -a "$REPORT"

        if [ -x "$GCC64_PATH/bin/aarch64-linux-android-gcc" ]; then
          echo "[PASS] AArch64 GCC exists" | tee -a "$REPORT"
          "$GCC64_PATH/bin/aarch64-linux-android-gcc" --version 2>&1 | head -3 | tee -a "$REPORT"
        else
          echo "[FAIL] AArch64 GCC missing" | tee -a "$REPORT"
        fi

        echo | tee -a "$REPORT"
        echo "ARM32 GCC" | tee -a "$REPORT"

        if [ -x "$GCC32_PATH/bin/arm-linux-androideabi-gcc" ]; then
          echo "[PASS] ARM32 GCC exists" | tee -a "$REPORT"
          "$GCC32_PATH/bin/arm-linux-androideabi-gcc" --version 2>&1 | head -3 | tee -a "$REPORT"
        else
          echo "[FAIL] ARM32 GCC missing" | tee -a "$REPORT"
        fi


    # ============================================================
    # 6. LOAD DEFCONFIG
    # ============================================================

    - name: Generate kernel configuration
      run: |
        set -e

        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo "============================================================"
        echo "GENERATING DEFCONFIG"
        echo "============================================================"

        rm -rf out

        make O=out \
          ARCH=arm64 \
          vendor/violet-perf_defconfig

        test -f out/.config

        echo
        echo "[PASS] out/.config generated"


    # ============================================================
    # 7. CONFIGURATION DIAGNOSTIC
    # ============================================================

    - name: Configuration diagnostic
      run: |
        set +e

        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        REPORT="$GITHUB_WORKSPACE/k/diagnostic.txt"

        echo | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"
        echo "KERNEL CONFIGURATION" | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"

        CONFIGS="
        CONFIG_LTO_CLANG
        CONFIG_LTO_CLANG_FULL
        CONFIG_LTO_CLANG_THIN
        CONFIG_LTO_CLANG_NONE
        CONFIG_MODVERSIONS
        CONFIG_MODULES
        CONFIG_HAVE_ARCH_PREL32_RELOCATIONS
        CONFIG_KPROBES
        CONFIG_KALLSYMS
        CONFIG_KALLSYMS_ALL
        CONFIG_TRIM_UNUSED_KSYMS
        CONFIG_CFI_CLANG
        CONFIG_LD_IS_LLD
        CONFIG_LD_VERSION
        "

        for cfg in $CONFIGS; do

          value=$(grep "^${cfg}=" out/.config 2>/dev/null | head -1)

          if [ -n "$value" ]; then
            echo "$value" | tee -a "$REPORT"
          else
            echo "$cfg=NOT_SET" | tee -a "$REPORT"
          fi

        done


    # ============================================================
    # 8. NORMALIZE CONFIG
    # ============================================================

    - name: Run olddefconfig
      run: |
        set -e

        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        make O=out \
          ARCH=arm64 \
          olddefconfig

        test -f out/.config

        echo "[PASS] olddefconfig completed"


    # ============================================================
    # 9. LTO CONFIG CHECK
    # ============================================================

    - name: LTO compatibility check
      run: |
        set +e

        REPORT="$GITHUB_WORKSPACE/k/diagnostic.txt"

        echo | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"
        echo "LTO COMPATIBILITY" | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"

        LTO=$(grep '^CONFIG_LTO_CLANG=' out/.config 2>/dev/null)
        MODVERSIONS=$(grep '^CONFIG_MODVERSIONS=' out/.config 2>/dev/null)
        PREL32=$(grep '^CONFIG_HAVE_ARCH_PREL32_RELOCATIONS=' out/.config 2>/dev/null)

        echo "LTO          : ${LTO:-NOT_SET}" | tee -a "$REPORT"
        echo "MODVERSIONS  : ${MODVERSIONS:-NOT_SET}" | tee -a "$REPORT"
        echo "PREL32       : ${PREL32:-NOT_SET}" | tee -a "$REPORT"

        if grep -q '^CONFIG_LTO_CLANG=y' out/.config; then
          echo "[PASS] CONFIG_LTO_CLANG enabled" | tee -a "$REPORT"
        else
          echo "[WARN] CONFIG_LTO_CLANG disabled" | tee -a "$REPORT"
        fi

        if grep -q '^CONFIG_MODVERSIONS=y' out/.config; then
          echo "[PASS] CONFIG_MODVERSIONS enabled" | tee -a "$REPORT"
        else
          echo "[WARN] CONFIG_MODVERSIONS disabled" | tee -a "$REPORT"
        fi


    # ============================================================
    # 10. MAKEFILE.BUILD INSPECTION
    # ============================================================

    - name: Inspect scripts/Makefile.build
      run: |
        set +e

        REPORT="$GITHUB_WORKSPACE/k/diagnostic.txt"

        echo | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"
        echo "MAKEFILE.BUILD" | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"

        if [ ! -f scripts/Makefile.build ]; then
          echo "[FAIL] scripts/Makefile.build missing" | tee -a "$REPORT"
          exit 0
        fi

        echo "[PASS] scripts/Makefile.build exists" | tee -a "$REPORT"

        echo | tee -a "$REPORT"
        echo "--- update_lto_symversions ---" | tee -a "$REPORT"

        grep -n \
          -A20 \
          -B8 \
          "update_lto_symversions" \
          scripts/Makefile.build \
          2>&1 | head -80 | tee -a "$REPORT"

        echo | tee -a "$REPORT"
        echo "--- cmd_link_multi ---" | tee -a "$REPORT"

        grep -n \
          -A20 \
          -B8 \
          "cmd_link_multi" \
          scripts/Makefile.build \
          2>&1 | head -100 | tee -a "$REPORT"


    # ============================================================
    # 11. VERIFY SYMVERSION FIX
    # ============================================================

    - name: Verify LTO symversion implementation
      run: |
        set +e

        REPORT="$GITHUB_WORKSPACE/k/diagnostic.txt"

        echo | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"
        echo "SYMVERSION IMPLEMENTATION" | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"

        if grep -q 'foreach n' scripts/Makefile.build 2>/dev/null && \
           grep -q 'wildcard.*symversions' scripts/Makefile.build 2>/dev/null; then

          echo "[PASS] Argument-list-safe symversion implementation detected" | tee -a "$REPORT"

        else

          echo "[WARN] Argument-list-safe symversion implementation NOT detected" | tee -a "$REPORT"

        fi


    # ============================================================
    # 12. RESPONSE FILE CHECK
    # ============================================================

    - name: Check response file implementation
      run: |
        set +e

        REPORT="$GITHUB_WORKSPACE/k/diagnostic.txt"

        echo | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"
        echo "RESPONSE FILE" | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"

        if grep -q '\.rsp' scripts/Makefile.build 2>/dev/null; then

          echo "[PASS] .rsp response-file reference detected" | tee -a "$REPORT"

          grep -n \
            -E '\.rsp|\$file' \
            scripts/Makefile.build \
            2>/dev/null | head -40 | tee -a "$REPORT"

        else

          echo "[INFO] No .rsp response file implementation detected" | tee -a "$REPORT"

        fi


    # ============================================================
    # 13. LINK_MULTI_DEPS
    # ============================================================

    - name: Inspect link_multi_deps
      run: |
        set +e

        REPORT="$GITHUB_WORKSPACE/k/diagnostic.txt"

        echo | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"
        echo "LINK_MULTI_DEPS" | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"

        grep -n \
          -A12 \
          -B5 \
          "link_multi_deps" \
          scripts/Makefile.build \
          2>&1 | head -100 | tee -a "$REPORT"

        echo | tee -a "$REPORT"
        echo "--- link commands ---" | tee -a "$REPORT"

        grep -n \
          -E \
          'cmd_link_multi|quiet_cmd_link_multi' \
          scripts/Makefile.build \
          2>&1 | head -80 | tee -a "$REPORT"


    # ============================================================
    # 14. MODPOST FILES
    # ============================================================

    - name: Inspect modpost implementation
      run: |
        set +e

        REPORT="$GITHUB_WORKSPACE/k/diagnostic.txt"

        echo | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"
        echo "MODPOST" | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"

        for file in \
          scripts/mod/modpost.c \
          scripts/mod/modpost.h \
          scripts/Makefile.modpost \
          scripts/Makefile.lib \
          include/linux/export.h; do

          echo | tee -a "$REPORT"
          echo "--- $file ---" | tee -a "$REPORT"

          if [ -f "$file" ]; then
            echo "[PASS] file exists" | tee -a "$REPORT"
          else
            echo "[FAIL] file missing" | tee -a "$REPORT"
          fi

        done


    # ============================================================
    # 15. EXPORT / VERSIONING INSPECTION
    # ============================================================

    - name: Inspect export and versioning code
      run: |
        set +e

        REPORT="$GITHUB_WORKSPACE/k/diagnostic.txt"

        echo | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"
        echo "EXPORT / SYMBOL VERSIONING" | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"

        echo "--- modpost symbol version references ---" | tee -a "$REPORT"

        grep -n \
          -E \
          'symvers|version|EXPORT_SYMBOL|crc' \
          scripts/mod/modpost.c \
          2>/dev/null | head -120 | tee -a "$REPORT"

        echo | tee -a "$REPORT"
        echo "--- export.h references ---" | tee -a "$REPORT"

        grep -n \
          -E \
          'EXPORT_SYMBOL|__CRC|MODVERSIONS' \
          include/linux/export.h \
          2>/dev/null | head -100 | tee -a "$REPORT"


    # ============================================================
    # 16. GSPCA INSPECTION
    # ============================================================

    - name: Inspect GSPCA exports
      run: |
        set +e

        REPORT="$GITHUB_WORKSPACE/k/diagnostic.txt"

        echo | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"
        echo "GSPCA EXPORTS" | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"

        for file in \
          drivers/media/usb/gspca/gspca.c \
          drivers/media/usb/gspca/gspca.h; do

          echo | tee -a "$REPORT"
          echo "--- $file ---" | tee -a "$REPORT"

          if [ -f "$file" ]; then

            grep -n \
              -E \
              'EXPORT_SYMBOL|EXPORT_SYMBOL_GPL|gspca_debug|gspca_dev_probe|gspca_disconnect|gspca_frame_add|gspca_resume|gspca_suspend' \
              "$file" \
              2>/dev/null | head -100 | tee -a "$REPORT"

          else

            echo "[INFO] File not found" | tee -a "$REPORT"

          fi

        done


    # ============================================================
    # 17. ARM64 BUILD VARIABLES
    # ============================================================

    - name: Inspect kernel build variables
      run: |
        set +e

        REPORT="$GITHUB_WORKSPACE/k/diagnostic.txt"

        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"
        echo "BUILD VARIABLES" | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"

        make -s O=out ARCH=arm64 -pn 2>/dev/null \
          | grep -E \
          '^(ARCH|CC|LD|AR|AS|NM|OBJCOPY|OBJDUMP|STRIP|CROSS_COMPILE|CROSS_COMPILE_ARM32|CLANG_TRIPLE|LLVM|LLVM_IAS|CONFIG_LTO_CLANG|CONFIG_MODVERSIONS)[[:space:]]*=' \
          | sort -u \
          | head -100 \
          | tee -a "$REPORT"

        echo | tee -a "$REPORT"
        echo "[INFO] Make database inspection completed" | tee -a "$REPORT"


    # ============================================================
    # 18. CROSS COMPILER TEST
    # ============================================================

    - name: Cross compiler functional test
      run: |
        set +e

        REPORT="$GITHUB_WORKSPACE/k/diagnostic.txt"

        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"
        echo "CROSS COMPILER TEST" | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"

        cat > /tmp/test.c <<'EOF'
        int test_function(int a)
        {
          return a + 1;
        }
        EOF

        clang \
          --target=aarch64-linux-gnu \
          -c \
          /tmp/test.c \
          -o /tmp/test.o \
          2>&1 | tee -a "$REPORT"

        if [ -f /tmp/test.o ]; then
          echo "[PASS] Clang AArch64 object compilation" | tee -a "$REPORT"
        else
          echo "[FAIL] Clang AArch64 object compilation" | tee -a "$REPORT"
        fi


    # ============================================================
    # 19. LLD TEST
    # ============================================================

    - name: LLD functional test
      run: |
        set +e

        REPORT="$GITHUB_WORKSPACE/k/diagnostic.txt"

        export PATH="$CLANG_PATH/bin:$GCC64_PATH_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"
        echo "LLD TEST" | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"

        clang \
          --target=aarch64-linux-gnu \
          -c \
          /tmp/test.c \
          -o /tmp/test.o \
          2>&1 | tee -a "$REPORT"

        ld.lld \
          -m aarch64linux \
          -o /tmp/test.elf \
          /tmp/test.o \
          2>&1 | tee -a "$REPORT"

        if [ -f /tmp/test.elf ]; then
          echo "[PASS] LLD AArch64 link test" | tee -a "$REPORT"
        else
          echo "[FAIL] LLD AArch64 link test" | tee -a "$REPORT"
        fi


    # ============================================================
    # 20. LTO OBJECT TEST
    # ============================================================

    - name: LLVM LTO object test
      run: |
        set +e

        REPORT="$GITHUB_WORKSPACE/k/diagnostic.txt"

        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"
        echo "LLVM LTO OBJECT TEST" | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"

        clang \
          --target=aarch64-linux-gnu \
          -flto \
          -c \
          /tmp/test.c \
          -o /tmp/test-lto.o \
          2>&1 | tee -a "$REPORT"

        if [ -f /tmp/test-lto.o ]; then
          echo "[PASS] LLVM LTO object generated" | tee -a "$REPORT"
        else
          echo "[FAIL] LLVM LTO object generation failed" | tee -a "$REPORT"
        fi


    # ============================================================
    # 21. ARCHITECTURE MAKEFILE
    # ============================================================

    - name: Inspect ARM64 Makefile
      run: |
        set +e

        REPORT="$GITHUB_WORKSPACE/k/diagnostic.txt"

        echo | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"
        echo "ARM64 MAKEFILE" | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"

        if [ -f arch/arm64/Makefile ]; then

          grep -n \
            -E \
            'LTO|LLVM|CLANG|CROSS_COMPILE|COMPAT|ARM32' \
            arch/arm64/Makefile \
            2>/dev/null | head -150 | tee -a "$REPORT"

        else

          echo "[FAIL] arch/arm64/Makefile missing" | tee -a "$REPORT"

        fi


    # ============================================================
    # 22. SEARCH LTO REFERENCES
    # ============================================================

    - name: Search LTO implementation
      run: |
        set +e

        REPORT="$GITHUB_WORKSPACE/k/diagnostic.txt"

        echo | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"
        echo "LTO SOURCE REFERENCES" | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"

        grep -R -n \
          -E \
          'CONFIG_LTO_CLANG|LTO_CLANG|update_lto_symversions|\.lto\.o|lto\.ko' \
          scripts \
          arch/arm64 \
          2>/dev/null \
          | head -250 \
          | tee -a "$REPORT"


    # ============================================================
    # 23. ARGUMENT-LIST RISK
    # ============================================================

    - name: Detect argument list risks
      run: |
        set +e

        REPORT="$GITHUB_WORKSPACE/k/diagnostic.txt"

        echo | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"
        echo "ARGUMENT LIST RISK" | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"

        grep -R -n \
          -E \
          'for .* in \$\(|\$\(.*_deps|\$link_multi_deps|filter-out FORCE' \
          scripts/Makefile.build \
          2>/dev/null \
          | head -150 \
          | tee -a "$REPORT"

        echo | tee -a "$REPORT"
        echo "--- response files ---" | tee -a "$REPORT"

        grep -R -n \
          -E \
          '\.rsp|\$\(file >' \
          scripts/Makefile.build \
          2>/dev/null \
          | head -100 \
          | tee -a "$REPORT"


    # ============================================================
    # 24. FINAL DIRECTORY CHECK
    # ============================================================

    - name: Final source tree check
      run: |
        set +e

        REPORT="$GITHUB_WORKSPACE/k/diagnostic.txt"

        echo | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"
        echo "SOURCE TREE CHECK" | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"

        for path in \
          Makefile \
          Kconfig \
          scripts/Makefile.build \
          scripts/Makefile.lib \
          scripts/Makefile.modpost \
          scripts/mod/modpost.c \
          scripts/mod/modpost.h \
          include/linux/export.h \
          arch/arm64/Makefile \
          arch/arm64/Kconfig \
          drivers/media/usb/gspca/gspca.c \
          drivers/media/usb/gspca/gspca.h; do

          if [ -f "$path" ]; then
            echo "[PASS] $path" | tee -a "$REPORT"
          else
            echo "[FAIL] $path" | tee -a "$REPORT"
          fi

        done


    # ============================================================
    # 25. FINAL SUMMARY
    # ============================================================

    - name: Final diagnostic summary
      run: |
        set +e

        REPORT="$GITHUB_WORKSPACE/k/diagnostic.txt"

        echo | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"
        echo "FINAL SUMMARY" | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"

        echo | tee -a "$REPORT"
        echo "Toolchain:" | tee -a "$REPORT"

        command -v clang >/dev/null 2>&1 \
          && echo "[PASS] clang" | tee -a "$REPORT" \
          || echo "[FAIL] clang" | tee -a "$REPORT"

        command -v ld.lld >/dev/null 2>&1 \
          && echo "[PASS] ld.lld" | tee -a "$REPORT" \
          || echo "[FAIL] ld.lld" | tee -a "$REPORT"

        echo | tee -a "$REPORT"
        echo "Configuration:" | tee -a "$REPORT"

        grep '^CONFIG_LTO_CLANG=' out/.config 2>/dev/null | tee -a "$REPORT"
        grep '^CONFIG_MODVERSIONS=' out/.config 2>/dev/null | tee -a "$REPORT"

        echo | tee -a "$REPORT"
        echo "Important LTO files:" | tee -a "$REPORT"

        test -f scripts/Makefile.build \
          && echo "[PASS] scripts/Makefile.build" | tee -a "$REPORT" \
          || echo "[FAIL] scripts/Makefile.build" | tee -a "$REPORT"

        test -f scripts/mod/modpost.c \
          && echo "[PASS] scripts/mod/modpost.c" | tee -a "$REPORT" \
          || echo "[FAIL] scripts/mod/modpost.c" | tee -a "$REPORT"

        echo | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"
        echo "DIAGNOSTIC COMPLETE" | tee -a "$REPORT"
        echo "============================================================" | tee -a "$REPORT"

        echo
        echo "Diagnostic completed."
        echo "No kernel build was started."


    # ============================================================
    # 26. UPLOAD REPORT
    # ============================================================

    - name: Upload diagnostic report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: violet-lto-diagnostic
        path: k/diagnostic.txt
        if-no-files-found: error
