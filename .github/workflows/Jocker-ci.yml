name: VIOLET Joker Kconfig Analyzer

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout VIOLET kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            make \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            device-tree-compiler \
            git \
            wget

      - name: Verify VIOLET sources
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING VIOLET SOURCES"
          echo "========================================"

          test -f Kconfig
          test -f arch/arm64/configs/vendor/sdmsteppe-perf_defconfig
          test -f arch/arm64/configs/vendor/violet.config
          test -x scripts/kconfig/merge_config.sh

          echo "Kconfig                   : OK"
          echo "sdmsteppe-perf_defconfig : OK"
          echo "violet.config             : OK"
          echo "merge_config.sh           : OK"

      - name: Download Joker VIOLET defconfig
        run: |
          set -e

          mkdir -p joker
          mkdir -p reports

          wget -q \
            -O joker/violet-perf_defconfig \
            "https://raw.githubusercontent.com/Joker-V2/kernel_xiaomi_violet/sixteen/arch/arm64/configs/vendor/violet-perf_defconfig"

          test -s joker/violet-perf_defconfig

          echo "========================================"
          echo "JOKER SOURCE"
          echo "========================================"

          echo "Joker violet-perf_defconfig : OK"
          echo
          echo "Lines:"
          wc -l joker/violet-perf_defconfig

      - name: Prepare ARM64 environment
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "========================================"
          echo "ARM64 TOOLCHAIN"
          echo "========================================"

          echo "ARCH=$ARCH"
          echo "CROSS_COMPILE=$CROSS_COMPILE"

          command -v aarch64-linux-gnu-gcc
          command -v aarch64-linux-gnu-ld

          aarch64-linux-gnu-gcc --version | head -n 1
          aarch64-linux-gnu-ld --version | head -n 1

      - name: Generate VIOLET base configuration
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          rm -rf out

          mkdir -p out

          echo "========================================"
          echo "BASE KCONFIG"
          echo "========================================"

          echo "Using:"
          echo "  sdmsteppe-perf_defconfig"
          echo "  + violet.config"

          make O=out vendor/sdmsteppe-perf_defconfig

          cp out/.config out/sdmsteppe.config

          ./scripts/kconfig/merge_config.sh \
            -O out \
            out/sdmsteppe.config \
            arch/arm64/configs/vendor/violet.config

          make O=out olddefconfig

          cp out/.config out/violet.config.resolved

          echo
          echo "Base VIOLET configuration:"
          wc -l out/violet.config.resolved

      - name: Extract Joker requests
        run: |
          set -e

          echo "========================================"
          echo "EXTRACTING JOKER REQUESTS"
          echo "========================================"

          : > reports/01_joker_all.txt

          while IFS= read -r line; do
            case "$line" in

              CONFIG_*=*)
                echo "$line" >> reports/01_joker_all.txt
                ;;

              "# CONFIG_"*" is not set")
                echo "$line" >> reports/01_joker_all.txt
                ;;

            esac
          done < joker/violet-perf_defconfig

          sort -u \
            reports/01_joker_all.txt \
            -o reports/01_joker_all.txt

          echo "Joker settings:"
          wc -l reports/01_joker_all.txt

      - name: Test Joker configuration through Kconfig
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "========================================"
          echo "JOKER KCONFIG TEST"
          echo "========================================"

          rm -rf joker_test
          mkdir -p joker_test

          cp out/violet.config.resolved \
            joker_test/base.config

          ./scripts/kconfig/merge_config.sh \
            -O joker_test \
            joker_test/base.config \
            joker/violet-perf_defconfig \
            > reports/merge.log 2>&1 || true

          if [ ! -f joker_test/.config ]; then
            echo "ERROR: Kconfig did not produce .config"
            cat reports/merge.log
            exit 1
          fi

          make O=joker_test olddefconfig \
            > reports/kconfig.log 2>&1

          cp joker_test/.config \
            reports/joker_resolved.config

          echo "Kconfig resolution completed."

      - name: Classify every Joker setting
        run: |
          set -e

          echo "========================================"
          echo "CLASSIFYING JOKER SETTINGS"
          echo "========================================"

          : > reports/02_already_present.txt
          : > reports/03_missing_but_supported.txt
          : > reports/04_changed_by_kconfig.txt
          : > reports/05_not_supported.txt
          : > reports/06_dependency_conflicts.txt
          : > reports/07_final_candidates.txt

          total=0
          already=0
          missing=0
          changed=0
          unsupported=0
          dependency=0

          get_value() {
            cfg="$1"
            sym="$2"

            grep -E "^${sym}=|^# ${sym} is not set$" \
              "$cfg" \
              | head -n 1 || true
          }

          while IFS= read -r requested; do

            [ -z "$requested" ] && continue

            total=$((total + 1))

            case "$requested" in

              CONFIG_*=*)
                symbol="${requested%%=*}"
                ;;

              "# CONFIG_"*" is not set")
                symbol="${requested#\# }"
                symbol="${symbol% is not set}"
                ;;

              *)
                continue
                ;;

            esac

            current="$(get_value out/violet.config.resolved "$symbol")"
            resolved="$(get_value joker_test/.config "$symbol")"

            if [ -z "$resolved" ]; then

              {
                echo "========================================"
                echo "SYMBOL: $symbol"
                echo "JOKER REQUEST: $requested"
                echo "STATUS: NOT REPRESENTED AFTER KCONFIG"
                echo "========================================"
                echo
              } >> reports/05_not_supported.txt

              unsupported=$((unsupported + 1))

              continue
            fi

            if [ "$current" = "$requested" ]; then

              echo "$requested" \
                >> reports/02_already_present.txt

              already=$((already + 1))

            elif [ "$resolved" = "$requested" ]; then

              {
                echo "========================================"
                echo "SYMBOL: $symbol"
                echo "REQUEST: $requested"
                echo "CURRENT VIOLET: ${current:-NOT PRESENT}"
                echo "KCONFIG RESULT: $resolved"
                echo "STATUS: MISSING BUT SUPPORTED"
                echo "========================================"
                echo
              } >> reports/03_missing_but_supported.txt

              echo "$requested" \
                >> reports/07_final_candidates.txt

              missing=$((missing + 1))

            else

              {
                echo "========================================"
                echo "SYMBOL: $symbol"
                echo "REQUEST: $requested"
                echo "CURRENT VIOLET: ${current:-NOT PRESENT}"
                echo "KCONFIG RESULT: ${resolved:-NOT PRESENT}"
                echo "STATUS: CHANGED BY KCONFIG"
                echo "========================================"
                echo
              } >> reports/04_changed_by_kconfig.txt

              changed=$((changed + 1))

              if [ "$requested" != "$resolved" ]; then
                {
                  echo "SYMBOL: $symbol"
                  echo "REQUESTED: $requested"
                  echo "RESOLVED: $resolved"
                  echo
                } >> reports/06_dependency_conflicts.txt

                dependency=$((dependency + 1))
              fi

            fi

          done < reports/01_joker_all.txt

          sort -u \
            reports/02_already_present.txt \
            -o reports/02_already_present.txt

          sort -u \
            reports/07_final_candidates.txt \
            -o reports/07_final_candidates.txt

          {
            echo "========================================"
            echo "JOKER VIOLET KCONFIG SUMMARY"
            echo "========================================"
            echo
            echo "Total Joker settings       : $total"
            echo "Already present in VIOLET  : $already"
            echo "Missing but Kconfig accepts: $missing"
            echo "Changed by Kconfig         : $changed"
            echo "Not supported              : $unsupported"
            echo "Dependency conflicts       : $dependency"
            echo
            echo "========================================"
            echo "SOURCE"
            echo "========================================"
            echo
            echo "Base:"
            echo "sdmsteppe-perf_defconfig"
            echo
            echo "VIOLET:"
            echo "arch/arm64/configs/vendor/violet.config"
            echo
            echo "JOKER:"
            echo "Joker-V2/kernel_xiaomi_violet"
            echo "branch: sixteen"
            echo
            echo "Architecture: arm64"
            echo "Cross compiler: aarch64-linux-gnu-"
            echo
            echo "Kernel build: NOT PERFORMED"
            echo "Analysis type: KCONFIG ONLY"
            echo
            echo "========================================"
          } > reports/08_summary.txt

      - name: Generate candidate fragment
        run: |
          set -e

          echo "========================================"
          echo "FINAL CANDIDATE CONFIG"
          echo "========================================"

          cp reports/07_final_candidates.txt \
            reports/violet_joker_candidates.config

          echo
          echo "Candidate settings:"
          grep -c '^CONFIG_' \
            reports/violet_joker_candidates.config || true

          echo
          echo "Candidate file:"
          cat reports/violet_joker_candidates.config

      - name: Final report
        run: |
          set -e

          echo
          echo "========================================"
          echo "FINAL JOKER ANALYSIS"
          echo "========================================"

          cat reports/08_summary.txt

          echo
          echo "========================================"
          echo "ARTIFACTS"
          echo "========================================"

          ls -lh reports/

      - name: Upload TXT analysis
        uses: actions/upload-artifact@v4
        with:
          name: violet-joker-kconfig-analysis
          path: |
            reports/01_joker_all.txt
            reports/02_already_present.txt
            reports/03_missing_but_supported.txt
            reports/04_changed_by_kconfig.txt
            reports/05_not_supported.txt
            reports/06_dependency_conflicts.txt
            reports/07_final_candidates.txt
            reports/08_summary.txt
            reports/violet_joker_candidates.config
            reports/merge.log
            reports/kconfig.log
          if-no-files-found: error
