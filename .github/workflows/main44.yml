name: Droidspaces Kernel Integration

on:
  workflow_dispatch:

jobs:
  droidspaces:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT KERNEL
      # ============================================================

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            make \
            patch


      # ============================================================
      # CLONE DROIDSPACES
      # ============================================================

      - name: Clone Droidspaces
        run: |
          set -e

          echo "========================================"
          echo "CLONING DROIDSPACES"
          echo "========================================"

          rm -rf droidspaces

          git clone --depth=1 \
            https://github.com/ravindu644/Droidspaces-OSS.git \
            droidspaces

          echo
          echo "Droidspaces commit:"
          git -C droidspaces log -1 --oneline


      # ============================================================
      # VERIFY KERNEL
      # ============================================================

      - name: Verify kernel and defconfig
        run: |
          set -e

          echo
          echo "========================================"
          echo "DROIDSPACES KERNEL VERIFICATION"
          echo "========================================"

          echo
          echo "Kernel:"
          make kernelversion

          echo
          echo "Defconfig:"

          DEFCONFIG="arch/arm64/configs/vendor/violet-perf_defconfig"

          if [ ! -f "$DEFCONFIG" ]; then
            echo
            echo "ERROR:"
            echo "$DEFCONFIG"
            echo "does not exist."
            echo
            echo "Available violet defconfigs:"
            find arch/arm64/configs \
              -type f \
              -iname '*violet*' \
              -print \
              | sort

            exit 1
          fi

          echo "FOUND:"
          echo "$DEFCONFIG"


      # ============================================================
      # PREPARE BASE CONFIG
      # ============================================================

      - name: Generate base .config
        run: |
          set -e

          echo
          echo "========================================"
          echo "GENERATING BASE KCONFIG"
          echo "========================================"

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/violet-perf_defconfig

          if [ ! -f out/.config ]; then
            echo "ERROR: out/.config was not generated."
            exit 1
          fi

          echo
          echo "BASE CONFIG:"
          echo "out/.config"


      # ============================================================
      # EXTRACT DROIDSPACES NON-GKI REQUIREMENTS
      # DIRECTLY FROM DROIDSPACES DOCUMENTATION
      # ============================================================

      - name: Extract Droidspaces requirements
        run: |
          set -e

          echo
          echo "========================================"
          echo "DROIDSPACES NON-GKI REQUIREMENTS"
          echo "========================================"

          DOC="droidspaces/Documentation/Kernel-Configuration.md"

          if [ ! -f "$DOC" ]; then
            echo "ERROR: Droidspaces Kernel-Configuration.md not found."
            exit 1
          fi

          rm -f droidspaces_required_configs

          awk '
            /### Step 1: Mandatory Configuration/ {
              active=1
              next
            }

            /### Step 2: Firewall Support/ {
              active=0
            }

            active && /CONFIG_[A-Z0-9_]+=/ {
              for (i=1; i<=NF; i++) {
                if ($i ~ /^CONFIG_[A-Z0-9_]+=/) {
                  sub(/=.*/, "", $i)
                  print $i
                }
              }
            }
          ' "$DOC" \
            | sort -u \
            > droidspaces_required_configs

          if [ ! -s droidspaces_required_configs ]; then
            echo "ERROR: Could not extract Droidspaces requirements."
            exit 1
          fi

          echo
          echo "DROIDSPACES REQUIRED CONFIGS:"
          echo

          cat droidspaces_required_configs

          echo
          echo "TOTAL:"
          wc -l droidspaces_required_configs


      # ============================================================
      # APPLY DROIDSPACES NON-GKI PATCHES
      # ============================================================

      - name: Apply Droidspaces non-GKI patches
        run: |
          set -e

          echo
          echo "========================================"
          echo "DROIDSPACES NON-GKI PATCHES"
          echo "========================================"

          PATCH_DIR="droidspaces/Documentation/resources/kernel-patches/non-GKI"

          if [ ! -d "$PATCH_DIR" ]; then
            echo "ERROR: Non-GKI patch directory not found."
            exit 1
          fi

          rm -f droidspaces_patch_status

          for patch_file in "$PATCH_DIR"/*.patch; do

            [ -f "$patch_file" ] || continue

            patch_name="$(basename "$patch_file")"

            echo
            echo "----------------------------------------"
            echo "Checking:"
            echo "$patch_name"
            echo "----------------------------------------"

            targets="$(
              grep '^diff --git ' "$patch_file" \
              | sed -E 's#^diff --git a/([^ ]+) b/([^ ]+)#\2#' \
              || true
            )"

            if [ -z "$targets" ]; then
              echo "WARNING: No patch targets detected."
              echo "$patch_name: SKIPPED_NO_TARGET" \
                | tee -a droidspaces_patch_status
              continue
            fi

            missing=0

            while read -r target; do

              [ -z "$target" ] && continue

              echo "TARGET:"
              echo "$target"

              if [ ! -f "$target" ]; then
                echo "STATUS: MISSING"
                missing=1
              else
                echo "STATUS: FOUND"
              fi

            done <<< "$targets"

            if [ "$missing" -eq 1 ]; then

              echo
              echo "$patch_name: SKIPPED_MISSING_TARGET" \
                | tee -a droidspaces_patch_status

              continue
            fi

            echo
            echo "Checking patch applicability..."

            if git apply --check "$patch_file"; then

              git apply "$patch_file"

              echo
              echo "$patch_name: APPLIED" \
                | tee -a droidspaces_patch_status

            else

              echo
              echo "$patch_name: SKIPPED_NOT_APPLICABLE" \
                | tee -a droidspaces_patch_status

            fi

          done


      # ============================================================
      # CONFIG CHECK
      # ============================================================

      - name: Droidspaces Kconfig check
        run: |
          set -e

          echo
          echo "========================================"
          echo "DROIDSPACES CONFIG CHECK"
          echo "========================================"

          CONFIG="out/.config"

          : > droidspaces_missing
          : > droidspaces_disabled
          : > droidspaces_enabled
          : > droidspaces_not_available

          while read -r symbol; do

            [ -z "$symbol" ] && continue

            current="$(
              grep -E \
                "^${symbol}=|^# ${symbol} is not set$" \
                "$CONFIG" \
                || true
            )"

            if [ "$current" = "${symbol}=y" ]; then

              echo "$symbol=y" >> droidspaces_enabled

            elif [ "$current" = "# ${symbol} is not set" ]; then

              echo "$symbol" >> droidspaces_disabled

            elif [ -z "$current" ]; then

              echo "$symbol" >> droidspaces_missing

            else

              echo "$symbol ($current)" >> droidspaces_disabled

            fi

          done < droidspaces_required_configs


          echo
          echo "MISSING:"
          if [ -s droidspaces_missing ]; then
            cat droidspaces_missing
          else
            echo "(none)"
          fi


          echo
          echo "DISABLED:"
          if [ -s droidspaces_disabled ]; then
            cat droidspaces_disabled
          else
            echo "(none)"
          fi


          echo
          echo "ALREADY ENABLED:"
          if [ -s droidspaces_enabled ]; then
            cat droidspaces_enabled
          else
            echo "(none)"
          fi


          echo
          echo "NOT AVAILABLE IN THIS KERNEL:"
          if [ -s droidspaces_not_available ]; then
            cat droidspaces_not_available
          else
            echo "(none)"
          fi


      # ============================================================
      # SAVE BEFORE CONFIG
      # ============================================================

      - name: Save original configuration
        run: |
          set -e

          cp \
            out/.config \
            out/.config.droidspaces.before


      # ============================================================
      # MODIFY CONFIG
      # ============================================================

      - name: Apply Droidspaces Kconfig changes
        run: |
          set -e

          echo
          echo "========================================"
          echo "DROIDSPACES KCONFIG MODIFICATIONS"
          echo "========================================"

          CONFIG="out/.config"

          changed=0
          unchanged=0
          unavailable=0

          while read -r symbol; do

            [ -z "$symbol" ] && continue

            before="$(
              grep -E \
                "^${symbol}=|^# ${symbol} is not set$" \
                "$CONFIG" \
                || true
            )"


            # ----------------------------------------
            # ALREADY ENABLED
            # ----------------------------------------

            if grep -q "^${symbol}=y$" "$CONFIG"; then

              echo
              echo "$symbol"
              echo "  BEFORE: $before"
              echo "  REQUIRED: y"
              echo "  ACTION: UNCHANGED"
              echo "  AFTER: ${symbol}=y"

              unchanged=$((unchanged + 1))

              continue
            fi


            # ----------------------------------------
            # DISABLED
            # ----------------------------------------

            if grep -q "^# ${symbol} is not set$" "$CONFIG"; then

              sed -i \
                "s/^# ${symbol} is not set$/${symbol}=y/" \
                "$CONFIG"

              echo
              echo "$symbol"
              echo "  BEFORE: $before"
              echo "  REQUIRED: y"
              echo "  ACTION: ENABLED"
              echo "  AFTER: ${symbol}=y"

              changed=$((changed + 1))

              continue
            fi


            # ----------------------------------------
            # EXISTS WITH ANOTHER VALUE
            # ----------------------------------------

            if grep -q "^${symbol}=" "$CONFIG"; then

              sed -i \
                "s/^${symbol}=.*/${symbol}=y/" \
                "$CONFIG"

              echo
              echo "$symbol"
              echo "  BEFORE: $before"
              echo "  REQUIRED: y"
              echo "  ACTION: CHANGED TO y"
              echo "  AFTER: ${symbol}=y"

              changed=$((changed + 1))

              continue
            fi


            # ----------------------------------------
            # NOT PRESENT IN RESOLVED CONFIG
            # ----------------------------------------

            echo
            echo "$symbol"
            echo "  BEFORE: NOT PRESENT"
            echo "  REQUIRED: y"
            echo "  ACTION: ADDING TO CONFIG"

            echo "${symbol}=y" >> "$CONFIG"

            echo "  AFTER: ${symbol}=y"

            changed=$((changed + 1))

          done < droidspaces_required_configs


          echo
          echo "========================================"
          echo "KCONFIG MODIFICATION SUMMARY"
          echo "========================================"

          echo "CHANGED:   $changed"
          echo "UNCHANGED: $unchanged"
          echo "ADDED:     $changed"


      # ============================================================
      # RESOLVE ALL KCONFIG DEPENDENCIES
      # ============================================================

      - name: Resolve Kconfig dependencies
        run: |
          set -e

          echo
          echo "========================================"
          echo "KCONFIG DEPENDENCY RESOLUTION"
          echo "========================================"

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          if [ ! -f out/.config ]; then
            echo "ERROR: out/.config disappeared."
            exit 1
          fi

          echo
          echo "KCONFIG RESOLUTION COMPLETE."


      # ============================================================
      # FINAL CONFIG CHECK
      # ============================================================

      - name: Final Droidspaces config check
        run: |
          set -e

          echo
          echo "========================================"
          echo "FINAL DROIDSPACES CONFIG CHECK"
          echo "========================================"

          CONFIG="out/.config"

          final_missing=0

          while read -r symbol; do

            [ -z "$symbol" ] && continue

            if grep -q "^${symbol}=y$" "$CONFIG"; then

              echo "[ OK ] $symbol=y"

            else

              echo "[FAIL] $symbol"

              final_missing=1

            fi

          done < droidspaces_required_configs


          echo

          if [ "$final_missing" -eq 1 ]; then

            echo "WARNING:"
            echo "Some Droidspaces requirements are still unavailable."

          else

            echo "ALL DROIDSPACES MANDATORY CONFIGS ARE ENABLED."

          fi


      # ============================================================
      # GENERATE FULL DEFCONFIG
      # ============================================================

      - name: Generate full defconfig
        run: |
          set -e

          echo
          echo "========================================"
          echo "GENERATING FULL DEFCONFIG"
          echo "========================================"

          OUTPUT="arch/arm64/configs/vendor/violet-perf_defconfig.full"

          cp \
            out/.config \
            "$OUTPUT"

          echo
          echo "SOURCE:"
          echo "out/.config"

          echo
          echo "OUTPUT:"
          echo "$OUTPUT"

          echo
          echo "LINES:"
          wc -l "$OUTPUT"

          echo
          echo "CONFIG SIZE:"
          du -h "$OUTPUT"


      # ============================================================
      # FINAL PATCH STATUS
      # ============================================================

      - name: Show patch status
        run: |
          set -e

          echo
          echo "========================================"
          echo "DROIDSPACES PATCH STATUS"
          echo "========================================"

          if [ -f droidspaces_patch_status ]; then
            cat droidspaces_patch_status
          else
            echo "No patch status generated."
          fi


      # ============================================================
      # FINAL SUMMARY
      # ============================================================

      - name: Final summary
        run: |
          set -e

          echo
          echo "========================================"
          echo "DROIDSPACES INTEGRATION COMPLETE"
          echo "========================================"

          echo
          echo "Kernel:"
          make kernelversion

          echo
          echo "Original defconfig:"
          echo "arch/arm64/configs/vendor/violet-perf_defconfig"

          echo
          echo "Generated full defconfig:"
          echo "arch/arm64/configs/vendor/violet-perf_defconfig.full"

          echo
          echo "Resolved config:"
          echo "out/.config"

          echo
          echo "Kernel build:"
          echo "NOT PERFORMED"

          echo
          echo "Droidspaces integration only."


      # ============================================================
      # UPLOAD RESULTS
      # ============================================================

      - name: Upload Droidspaces results
        uses: actions/upload-artifact@v4
        with:
          name: droidspaces-kernel-results
          path: |
            arch/arm64/configs/vendor/violet-perf_defconfig.full
            out/.config
            out/.config.droidspaces.before
            droidspaces_required_configs
            droidspaces_missing
            droidspaces_disabled
            droidspaces_enabled
            droidspaces_not_available
            droidspaces_patch_status
          if-no-files-found: warn
