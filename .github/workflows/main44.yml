name: Build Kernel with Droidspaces + ReKernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            build-essential \
            cpio \
            curl \
            wget \
            rsync \
            unzip \
            zip \
            libssl-dev \
            libelf-dev \
            device-tree-compiler \
            python3 \
            clang \
            lld \
            llvm

      - name: Clone Droidspaces
        run: |
          set -e

          echo "========================================"
          echo "CLONING REAL DROIDSPACES"
          echo "========================================"

          rm -rf droidspaces

          git clone --depth=1 \
            https://github.com/ravindu644/Droidspaces-OSS.git \
            droidspaces

          echo ""
          echo "Droidspaces commit:"
          git -C droidspaces rev-parse HEAD

          echo ""
          echo "Droidspaces version:"
          git -C droidspaces describe --tags --always || true

      - name: Verify Droidspaces Non-GKI patches
        run: |
          set -e

          echo "========================================"
          echo "DROIDSPACES NON-GKI PATCHES"
          echo "========================================"

          PATCH_DIR="droidspaces/Documentation/resources/kernel-patches/non-GKI"

          if [ ! -d "$PATCH_DIR" ]; then
            echo "ERROR: Non-GKI patch directory not found"
            exit 1
          fi

          find "$PATCH_DIR" \
            -type f \
            -name "*.patch" \
            -print | sort

      - name: Apply Droidspaces Non-GKI patches
        run: |
          set -e

          echo "========================================"
          echo "APPLYING DROIDSPACES NON-GKI PATCHES"
          echo "========================================"

          PATCH_DIR="droidspaces/Documentation/resources/kernel-patches/non-GKI"

          mapfile -t PATCHES < <(
            find "$PATCH_DIR" \
              -type f \
              -name "*.patch" \
              -print | sort
          )

          if [ "${#PATCHES[@]}" -eq 0 ]; then
            echo "ERROR: No Droidspaces Non-GKI patches found"
            exit 1
          fi

          for patch_file in "${PATCHES[@]}"; do
            echo ""
            echo "----------------------------------------"
            echo "Checking:"
            echo "$patch_file"
            echo "----------------------------------------"

            patch -p1 --dry-run < "$patch_file"

            echo ""
            echo "Applying:"
            echo "$patch_file"

            patch -p1 < "$patch_file"
          done

      - name: Configure Droidspaces for Kernel 4.14
        run: |
          set -e

          echo "========================================"
          echo "DROIDSPACES KERNEL CONFIGURATION"
          echo "========================================"

          DEFCONFIG="arch/arm64/configs/defconfig"

          if [ ! -f "$DEFCONFIG" ]; then
            echo "ERROR: $DEFCONFIG not found"
            exit 1
          fi

          cat > /tmp/droidspaces.config <<'EOF'
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y

          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y

          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y

          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y

          CONFIG_DEVTMPFS=y

          CONFIG_OVERLAY_FS=y

          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y

          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y

          CONFIG_NETFILTER_XT_MATCH_COMMENT=y
          CONFIG_NETFILTER_XT_MATCH_STATE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y
          CONFIG_NETFILTER_XT_MATCH_HL=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_IP_NF_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_IP_NF_TARGET_ULOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_NETFILTER_XT_MATCH_LIMIT=y
          CONFIG_NETFILTER_XT_MATCH_HASHLIMIT=y
          CONFIG_NETFILTER_XT_MATCH_OWNER=y
          CONFIG_NETFILTER_XT_MATCH_PKTTYPE=y
          CONFIG_NETFILTER_XT_MATCH_MARK=y
          CONFIG_NETFILTER_XT_TARGET_MARK=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_NETFILTER_NETLINK_QUEUE=y
          CONFIG_NETFILTER_NETLINK_LOG=y
          CONFIG_NETFILTER_XT_TARGET_NFLOG=y
          EOF

          while IFS='=' read -r CONFIG VALUE; do
            [ -z "$CONFIG" ] && continue

            if grep -q "^${CONFIG}=" "$DEFCONFIG"; then
              sed -i "s|^${CONFIG}=.*|${CONFIG}=${VALUE}|" "$DEFCONFIG"

            elif grep -q "^# ${CONFIG} is not set" "$DEFCONFIG"; then
              sed -i "s|^# ${CONFIG} is not set|${CONFIG}=${VALUE}|" "$DEFCONFIG"

            else
              echo "${CONFIG}=${VALUE}" >> "$DEFCONFIG"
            fi

          done < /tmp/droidspaces.config

          echo ""
          echo "Droidspaces configuration applied."

      - name: Clone ReKernel
        run: |
          set -e

          echo "========================================"
          echo "CLONING REAL REKERNEL"
          echo "========================================"

          rm -rf rekernel

          git clone --depth=1 \
            https://github.com/Sakion-Team/Re-Kernel.git \
            rekernel

          echo ""
          echo "ReKernel commit:"
          git -C rekernel rev-parse HEAD

      - name: Apply ReKernel
        run: |
          set -e

          echo "========================================"
          echo "APPLYING REKERNEL"
          echo "========================================"

          if [ ! -f "rekernel/Integrate/patches.sh" ]; then
            echo "ERROR: ReKernel patches.sh not found"
            exit 1
          fi

          cp -a rekernel/Integrate/rekernel .

          bash rekernel/Integrate/patches.sh

      - name: Verify Droidspaces kernel support
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING DROIDSPACES CONFIG"
          echo "========================================"

          DEFCONFIG="arch/arm64/configs/defconfig"

          REQUIRED_CONFIGS="
          CONFIG_SYSCTL
          CONFIG_SYSVIPC
          CONFIG_POSIX_MQUEUE
          CONFIG_NAMESPACES
          CONFIG_PID_NS
          CONFIG_UTS_NS
          CONFIG_IPC_NS
          CONFIG_SECCOMP
          CONFIG_SECCOMP_FILTER
          CONFIG_CGROUPS
          CONFIG_CGROUP_DEVICE
          CONFIG_CGROUP_PIDS
          CONFIG_MEMCG
          CONFIG_CGROUP_SCHED
          CONFIG_FAIR_GROUP_SCHED
          CONFIG_CGROUP_FREEZER
          CONFIG_CGROUP_NET_PRIO
          CONFIG_DEVTMPFS
          CONFIG_OVERLAY_FS
          CONFIG_TMPFS_POSIX_ACL
          CONFIG_TMPFS_XATTR
          CONFIG_FW_LOADER
          CONFIG_FW_LOADER_USER_HELPER
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK
          CONFIG_NETFILTER_XT_MATCH_MULTIPORT
          CONFIG_NETFILTER_XT_MATCH_OWNER
          CONFIG_NETFILTER_XT_MATCH_MARK
          CONFIG_NETFILTER_XT_SET
          CONFIG_NETFILTER_NETLINK_QUEUE
          CONFIG_NETFILTER_NETLINK_LOG
          "

          FAILED=0

          for CONFIG in $REQUIRED_CONFIGS; do
            if grep -q "^${CONFIG}=y$" "$DEFCONFIG"; then
              echo "[OK] $CONFIG"
            else
              echo "[MISSING] $CONFIG"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "ERROR: Required Droidspaces configuration is missing."
            exit 1
          fi

          echo ""
          echo "All required Droidspaces options are enabled."

      - name: Verify ReKernel integration
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING REKERNEL"
          echo "========================================"

          test -d drivers/rekernel
          test -f drivers/rekernel/rekernel.c
          test -f drivers/rekernel/rekernel.h
          test -f drivers/rekernel/Kconfig

          grep -Rni "CONFIG_REKERNEL" \
            drivers/Kconfig \
            drivers/Makefile \
            arch/arm64/configs/defconfig

          grep -Rni "rekernel" \
            drivers/android/binder.c \
            kernel/signal.c

          echo ""
          echo "ReKernel integration verified."

      - name: Prepare kernel
        run: |
          set -e

          echo "========================================"
          echo "PREPARING KERNEL"
          echo "========================================"

          export ARCH=arm64
          export SUBARCH=arm64

          export LLVM=1
          export LLVM_IAS=1

          make O=out ARCH=arm64 defconfig

          echo ""
          echo "Final Droidspaces configuration:"

          grep -E \
            'CONFIG_(SYSVIPC|POSIX_MQUEUE|NAMESPACES|PID_NS|UTS_NS|IPC_NS|SECCOMP|CGROUPS|CGROUP_DEVICE|CGROUP_PIDS|MEMCG|CGROUP_FREEZER|DEVTMPFS|OVERLAY_FS)=' \
            out/.config || true

      - name: Build kernel
        run: |
          set -e

          echo "========================================"
          echo "BUILDING KERNEL 4.14"
          echo "========================================"

          export ARCH=arm64
          export SUBARCH=arm64

          export LLVM=1
          export LLVM_IAS=1

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1

      - name: Verify kernel output
        run: |
          set -e

          echo "========================================"
          echo "KERNEL OUTPUT"
          echo "========================================"

          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            -print

          if [ ! -f "out/arch/arm64/boot/Image" ]; then
            echo "ERROR: Kernel Image was not generated"
            exit 1
          fi

          file out/arch/arm64/boot/Image

      - name: Prepare Droidspaces source artifact
        run: |
          set -e

          mkdir -p artifacts/droidspaces

          cp -a droidspaces/Documentation \
            artifacts/droidspaces/

          cp -a droidspaces/Android \
            artifacts/droidspaces/ 2>/dev/null || true

          cp -a droidspaces/init \
            artifacts/droidspaces/ 2>/dev/null || true

          echo "Droidspaces source prepared."

      - name: Collect kernel
        run: |
          set -e

          mkdir -p artifacts/kernel

          cp out/arch/arm64/boot/Image \
            artifacts/kernel/

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz \
              artifacts/kernel/
          fi

          echo ""
          echo "========================================"
          echo "FINAL ARTIFACTS"
          echo "========================================"

          find artifacts -type f -print

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-4.14-droidspaces-rekernel
          path: artifacts/
