name: Droidspaces 4.14 Integration

on:
  workflow_dispatch:

jobs:
  droidspaces:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT KERNEL
      # ============================================================
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            build-essential \
            cpio \
            kmod \
            libssl-dev \
            libelf-dev \
            device-tree-compiler \
            rsync \
            patch \
            wget \
            unzip

      # ============================================================
      # 3. CLONE DROIDSPACES
      # ============================================================
      - name: Clone Droidspaces
        run: |
          set -e

          git clone --depth=1 \
            https://github.com/ravindu644/Droidspaces-OSS.git \
            droidspaces

          echo
          echo "========================================"
          echo "DROIDSPACES SOURCE"
          echo "========================================"

          git -C droidspaces log -1 --oneline

      # ============================================================
      # 4. KERNEL / DEFCONFIG CHECK
      # ============================================================
      - name: Check kernel and defconfig
        run: |
          set -e

          DEFCONFIG="arch/arm64/configs/vendor/violet-perf_defconfig"

          echo
          echo "========================================"
          echo "KERNEL CHECK"
          echo "========================================"

          make kernelversion || true

          echo
          echo "Defconfig:"
          echo "$DEFCONFIG"

          if [ ! -f "$DEFCONFIG" ]; then
            echo "ERROR: defconfig not found"
            exit 1
          fi

          echo
          echo "Kernel release:"
          head -20 Makefile

          echo
          echo "Defconfig size:"
          wc -l "$DEFCONFIG"

      # ============================================================
      # 5. BACKUP ORIGINAL DEFCONFIG
      # ============================================================
      - name: Backup original defconfig
        run: |
          set -e

          cp \
            arch/arm64/configs/vendor/violet-perf_defconfig \
            violet-perf_defconfig.original

      # ============================================================
      # 6. FIND ALL DROIDSPACES PATCHES
      # ============================================================
      - name: Find Droidspaces patches
        run: |
          set +e

          echo
          echo "========================================"
          echo "DROIDSPACES PATCHES"
          echo "========================================"

          PATCH_DIR="droidspaces/Documentation/resources/kernel-patches/non-GKI"

          if [ ! -d "$PATCH_DIR" ]; then
            echo "ERROR: Droidspaces non-GKI patch directory not found"
            exit 1
          fi

          find "$PATCH_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.patch' \
            -print \
            | sort

      # ============================================================
      # 7. PATCH TARGET ANALYSIS
      # ============================================================
      - name: Analyze patch targets
        run: |
          set +e

          PATCH_DIR="droidspaces/Documentation/resources/kernel-patches/non-GKI"

          echo
          echo "========================================"
          echo "DROIDSPACES PATCH TARGET ANALYSIS"
          echo "========================================"

          mkdir -p droidspaces-results

          : > droidspaces-results/patch-analysis.txt

          for PATCH in "$PATCH_DIR"/*.patch; do

            [ -f "$PATCH" ] || continue

            NAME=$(basename "$PATCH")

            echo
            echo "----------------------------------------"
            echo "PATCH: $NAME"
            echo "----------------------------------------"

            echo "PATCH: $NAME" >> droidspaces-results/patch-analysis.txt

            TARGETS=$(grep '^+++ b/' "$PATCH" \
              | sed 's/^+++ b\///' \
              | sort -u)

            for TARGET in $TARGETS; do

              if [ -f "$TARGET" ]; then
                echo "AVAILABLE: $TARGET"
                echo "AVAILABLE: $TARGET" \
                  >> droidspaces-results/patch-analysis.txt
              else
                echo "NOT AVAILABLE: $TARGET"
                echo "NOT AVAILABLE: $TARGET" \
                  >> droidspaces-results/patch-analysis.txt
              fi

            done

            echo >> droidspaces-results/patch-analysis.txt

          done

      # ============================================================
      # 8. APPLY ONLY COMPATIBLE PATCHES
      # ============================================================
      - name: Apply compatible Droidspaces patches
        run: |
          set +e

          PATCH_DIR="droidspaces/Documentation/resources/kernel-patches/non-GKI"

          echo
          echo "========================================"
          echo "APPLYING DROIDSPACES NON-GKI PATCHES"
          echo "========================================"

          mkdir -p droidspaces-results/patch-status

          for PATCH in "$PATCH_DIR"/*.patch; do

            [ -f "$PATCH" ] || continue

            NAME=$(basename "$PATCH")

            echo
            echo "----------------------------------------"
            echo "Checking:"
            echo "$NAME"
            echo "----------------------------------------"

            TARGETS=$(grep '^+++ b/' "$PATCH" \
              | sed 's/^+++ b\///' \
              | sort -u)

            MISSING=0

            for TARGET in $TARGETS; do

              if [ ! -f "$TARGET" ]; then
                echo "Target missing: $TARGET"
                MISSING=1
              fi

            done

            if [ "$MISSING" -eq 1 ]; then
              echo "SKIPPED: missing target file"
              echo "SKIPPED_MISSING_TARGET" \
                > "droidspaces-results/patch-status/$NAME"
              continue
            fi

            echo
            echo "Dry-run:"

            patch \
              --dry-run \
              -p1 \
              < "$PATCH"

            if [ "$?" -ne 0 ]; then
              echo
              echo "SKIPPED: patch does not apply cleanly"

              echo "SKIPPED_DRY_RUN" \
                > "droidspaces-results/patch-status/$NAME"

              continue
            fi

            echo
            echo "Applying:"

            patch \
              -p1 \
              < "$PATCH"

            if [ "$?" -eq 0 ]; then
              echo
              echo "APPLIED"

              echo "APPLIED" \
                > "droidspaces-results/patch-status/$NAME"
            else
              echo
              echo "FAILED"

              echo "FAILED" \
                > "droidspaces-results/patch-status/$NAME"
            fi

          done

      # ============================================================
      # 9. DROIDSPACES CONFIG REQUIREMENTS
      # ============================================================
      - name: Droidspaces config check
        run: |
          set +e

          DEFCONFIG="arch/arm64/configs/vendor/violet-perf_defconfig"

          echo
          echo "========================================"
          echo "DROIDSPACES CONFIG CHECK"
          echo "========================================"

          cat > droidspaces-required-configs.txt <<'EOF'
          CONFIG_NAMESPACES
          CONFIG_UTS_NS
          CONFIG_IPC_NS
          CONFIG_PID_NS
          CONFIG_NET_NS
          CONFIG_CGROUPS
          CONFIG_CGROUP_FREEZER
          CONFIG_CGROUP_DEVICE
          CONFIG_CGROUP_CPUACCT
          CONFIG_CGROUP_SCHED
          CONFIG_CGROUP_PIDS
          CONFIG_CGROUP_NET_PRIO
          CONFIG_CGROUP_NET_CLASSID
          CONFIG_SECCOMP
          CONFIG_SECCOMP_FILTER
          CONFIG_NETFILTER
          CONFIG_NETFILTER_XTABLES
          CONFIG_NETFILTER_XT_TARGET_MARK
          CONFIG_NETFILTER_XT_MATCH_COMMENT
          CONFIG_NETFILTER_XT_MATCH_CONNMARK
          CONFIG_NETFILTER_XT_MATCH_OWNER
          CONFIG_NETFILTER_XT_MATCH_SOCKET
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
          CONFIG_VETH
          CONFIG_BRIDGE
          CONFIG_BRIDGE_NETFILTER
          CONFIG_OVERLAY_FS
          CONFIG_TMPFS
          CONFIG_DEVTMPFS
          CONFIG_DEVTMPFS_MOUNT
          CONFIG_EXT4_FS
          CONFIG_PROC_FS
          CONFIG_SYSFS
          EOF

          sed -i 's/^[[:space:]]*//' \
            droidspaces-required-configs.txt

          : > droidspaces-results/missing.txt
          : > droidspaces-results/disabled.txt
          : > droidspaces-results/enabled.txt
          : > droidspaces-results/unavailable.txt

          while read -r CONFIG; do

            [ -z "$CONFIG" ] && continue

            SYMBOL="${CONFIG#CONFIG_}"

            if grep -q "^${CONFIG}=y" "$DEFCONFIG"; then

              echo "$CONFIG=y"
              echo "$CONFIG=y" \
                >> droidspaces-results/enabled.txt

            elif grep -q "^${CONFIG}=m" "$DEFCONFIG"; then

              echo "$CONFIG=m"
              echo "$CONFIG=m" \
                >> droidspaces-results/enabled.txt

            elif grep -q "^# ${CONFIG} is not set" "$DEFCONFIG"; then

              echo "$CONFIG: DISABLED"
              echo "$CONFIG" \
                >> droidspaces-results/disabled.txt

            elif grep -Rqs \
              --include='Kconfig' \
              --include='Kconfig.*' \
              "config ${SYMBOL}" \
              . \
              2>/dev/null; then

              echo "$CONFIG: MISSING"
              echo "$CONFIG" \
                >> droidspaces-results/missing.txt

            else

              echo "$CONFIG: NOT AVAILABLE"
              echo "$CONFIG" \
                >> droidspaces-results/unavailable.txt

            fi

          done < droidspaces-required-configs.txt

          echo
          echo "========================================"
          echo "DROIDSPACES CONFIG CHECK"
          echo "========================================"

          echo
          echo "MISSING:"
          cat droidspaces-results/missing.txt

          echo
          echo "DISABLED:"
          cat droidspaces-results/disabled.txt

          echo
          echo "ALREADY ENABLED:"
          cat droidspaces-results/enabled.txt

          echo
          echo "NOT AVAILABLE IN THIS KERNEL:"
          cat droidspaces-results/unavailable.txt

      # ============================================================
      # 10. GENERATE MODIFIED DEFCONFIG
      # ============================================================
      - name: Generate Droidspaces defconfig
        run: |
          set -e

          ORIGINAL="arch/arm64/configs/vendor/violet-perf_defconfig"

          cp \
            "$ORIGINAL" \
            violet-perf_defconfig.droidspaces

          while read -r CONFIG; do

            [ -z "$CONFIG" ] && continue

            if grep -q "^${CONFIG}=y" \
              violet-perf_defconfig.droidspaces; then
              continue
            fi

            if grep -q "^${CONFIG}=m" \
              violet-perf_defconfig.droidspaces; then
              continue
            fi

            if grep -q "^# ${CONFIG} is not set" \
              violet-perf_defconfig.droidspaces; then

              sed -i \
                "s/^# ${CONFIG} is not set/${CONFIG}=y/" \
                violet-perf_defconfig.droidspaces

            else

              echo "${CONFIG}=y" \
                >> violet-perf_defconfig.droidspaces

            fi

          done < droidspaces-results/missing.txt

          echo
          echo "========================================"
          echo "DROIDSPACES DEFCONFIG GENERATED"
          echo "========================================"

          wc -l \
            violet-perf_defconfig.original \
            violet-perf_defconfig.droidspaces

      # ============================================================
      # 11. USE MODIFIED DEFCONFIG
      # ============================================================
      - name: Validate modified defconfig
        run: |
          set -e

          cp \
            violet-perf_defconfig.droidspaces \
            arch/arm64/configs/vendor/violet-perf_defconfig

          make \
            ARCH=arm64 \
            vendor/violet-perf_defconfig

          echo
          echo "========================================"
          echo "FINAL DROIDSPACES CONFIG"
          echo "========================================"

          while read -r CONFIG; do

            [ -z "$CONFIG" ] && continue

            grep \
              -E "^${CONFIG}=|^# ${CONFIG} is not set" \
              .config \
              || echo "$CONFIG: NOT SET"

          done < droidspaces-required-configs.txt

      # ============================================================
      # 12. FINAL CONFIG REPORT
      # ============================================================
      - name: Generate final report
        run: |
          set +e

          echo
          echo "========================================"
          echo "DROIDSPACES FINAL REPORT"
          echo "========================================"

          {
            echo "DROIDSPACES CONFIG CHECK"
            echo "========================"
            echo
            echo "MISSING:"
            cat droidspaces-results/missing.txt
            echo
            echo "DISABLED:"
            cat droidspaces-results/disabled.txt
            echo
            echo "ALREADY ENABLED:"
            cat droidspaces-results/enabled.txt
            echo
            echo "NOT AVAILABLE IN THIS KERNEL:"
            cat droidspaces-results/unavailable.txt
            echo
            echo "PATCH STATUS:"
            for FILE in droidspaces-results/patch-status/*; do
              [ -f "$FILE" ] || continue
              echo "$(basename "$FILE"): $(cat "$FILE")"
            done
          } > droidspaces-results/droidspaces-final-report.txt

          cat \
            droidspaces-results/droidspaces-final-report.txt

      # ============================================================
      # 13. DEFCONFIG DIFF
      # ============================================================
      - name: Generate defconfig diff
        run: |
          set +e

          diff -u \
            violet-perf_defconfig.original \
            violet-perf_defconfig.droidspaces \
            > droidspaces-results/defconfig.diff

          true

          echo
          echo "========================================"
          echo "DROIDSPACES DEFCONFIG CHANGES"
          echo "========================================"

          cat \
            droidspaces-results/defconfig.diff \
            || true

      # ============================================================
      # 14. SAVE FINAL FULL DEFCONFIG
      # ============================================================
      - name: Save final full defconfig
        run: |
          set -e

          cp \
            violet-perf_defconfig.droidspaces \
            droidspaces-results/violet-perf_defconfig.full

          cp \
            .config \
            droidspaces-results/droidspaces.final.config

      # ============================================================
      # 15. UPLOAD EVERYTHING
      # ============================================================
      - name: Upload Droidspaces results
        uses: actions/upload-artifact@v4
        with:
          name: droidspaces-4.14-integration
          path: droidspaces-results/
