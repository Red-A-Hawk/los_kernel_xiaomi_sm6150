name: Droidspaces Kernel Integration

on:
  workflow_dispatch:

jobs:
  droidspaces:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            make \
            patch

      - name: Clone Droidspaces
        run: |
          set -e

          rm -rf droidspaces

          git clone --depth=1 \
            https://github.com/ravindu644/Droidspaces-OSS.git \
            droidspaces

          echo
          echo "========================================"
          echo "DROIDSPACES"
          echo "========================================"
          git -C droidspaces log -1 --oneline
          echo

      - name: Verify kernel and defconfig
        run: |
          set -e

          echo "========================================"
          echo "DROIDSPACES KERNEL VERIFICATION"
          echo "========================================"

          echo
          echo "Kernel:"
          make kernelversion

          echo
          echo "Defconfig:"

          if [ ! -f vendor/violet-perf_defconfig ]; then
            echo "ERROR: vendor/violet-perf_defconfig not found"
            exit 1
          fi

          echo "FOUND: vendor/violet-perf_defconfig"

      - name: Generate base .config
        run: |
          set -e

          echo "========================================"
          echo "GENERATING BASE KCONFIG"
          echo "========================================"

          rm -rf out
          mkdir -p out

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/violet-perf_defconfig

          if [ ! -f out/.config ]; then
            echo "ERROR: out/.config was not generated"
            exit 1
          fi

          echo
          echo "BASE CONFIG GENERATED:"
          echo "out/.config"

      - name: Discover Droidspaces kernel requirements
        run: |
          set -e

          echo "========================================"
          echo "DROIDSPACES REQUIREMENTS DISCOVERY"
          echo "========================================"

          PATCH_DIR="droidspaces/Documentation/resources/kernel-patches/non-GKI"

          if [ ! -d "$PATCH_DIR" ]; then
            echo "ERROR: Droidspaces non-GKI patch directory not found"
            exit 1
          fi

          echo
          echo "Non-GKI patches:"
          find "$PATCH_DIR" -maxdepth 1 -type f -name '*.patch' -print | sort

          echo
          echo "Searching Droidspaces documentation for CONFIG requirements..."

          {
            grep -RhoE 'CONFIG_[A-Z0-9_]+' \
              droidspaces/Documentation \
              droidspaces/src \
              droidspaces/init \
              2>/dev/null || true
          } | sort -u > droidspaces_configs.raw

          if [ ! -s droidspaces_configs.raw ]; then
            echo "WARNING: No CONFIG symbols found automatically"
          else
            echo
            echo "CONFIG symbols discovered:"
            cat droidspaces_configs.raw
          fi

      - name: Build Droidspaces requirement list
        run: |
          set -e

          echo "========================================"
          echo "BUILDING DROIDSPACES CONFIG LIST"
          echo "========================================"

          cat > droidspaces_required_configs <<'EOF'
CONFIG_NAMESPACES
CONFIG_UTS_NS
CONFIG_IPC_NS
CONFIG_PID_NS
CONFIG_NET_NS

CONFIG_CGROUPS
CONFIG_CGROUP_FREEZER
CONFIG_CGROUP_SCHED
CONFIG_CGROUP_CPUACCT
CONFIG_CGROUP_DEVICE
CONFIG_CGROUP_PIDS
CONFIG_CGROUP_NET_PRIO
CONFIG_CGROUP_NET_CLASSID

CONFIG_SECCOMP
CONFIG_SECCOMP_FILTER

CONFIG_NETFILTER
CONFIG_NETFILTER_XTABLES
CONFIG_NETFILTER_XT_TARGET_MARK
CONFIG_NETFILTER_XT_MATCH_COMMENT
CONFIG_NETFILTER_XT_MATCH_CONNMARK
CONFIG_NETFILTER_XT_MATCH_OWNER
CONFIG_NETFILTER_XT_MATCH_SOCKET
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE

CONFIG_BRIDGE
CONFIG_BRIDGE_NETFILTER
CONFIG_VETH

CONFIG_DEVTMPFS
CONFIG_DEVTMPFS_MOUNT

CONFIG_OVERLAY_FS
CONFIG_TMPFS
CONFIG_EXT4_FS
CONFIG_PROC_FS
CONFIG_SYSFS
EOF

          sort -u droidspaces_required_configs \
            -o droidspaces_required_configs

          echo
          cat droidspaces_required_configs

      - name: Droidspaces Kconfig check
        run: |
          set -e

          echo
          echo "========================================"
          echo "DROIDSPACES CONFIG CHECK"
          echo "========================================"

          CONFIG="out/.config"

          : > droidspaces_missing
          : > droidspaces_disabled
          : > droidspaces_enabled
          : > droidspaces_unavailable

          while read -r symbol; do
            [ -z "$symbol" ] && continue

            line=$(grep -E "^${symbol}=" "$CONFIG" || true)
            disabled=$(grep -E "^# ${symbol} is not set$" "$CONFIG" || true)

            if [ -n "$line" ]; then
              if [ "$line" = "${symbol}=y" ]; then
                echo "$symbol=y" >> droidspaces_enabled
              else
                echo "$symbol ($line)" >> droidspaces_disabled
              fi

            elif [ -n "$disabled" ]; then
              echo "$symbol" >> droidspaces_disabled

            else
              echo "$symbol" >> droidspaces_missing
            fi
          done < droidspaces_required_configs

          echo
          echo "MISSING:"
          if [ -s droidspaces_missing ]; then
            cat droidspaces_missing
          else
            echo "(none)"
          fi

          echo
          echo "DISABLED:"
          if [ -s droidspaces_disabled ]; then
            cat droidspaces_disabled
          else
            echo "(none)"
          fi

          echo
          echo "ALREADY ENABLED:"
          if [ -s droidspaces_enabled ]; then
            cat droidspaces_enabled
          else
            echo "(none)"
          fi

          echo
          echo "NOT AVAILABLE IN THIS KERNEL:"
          if [ -s droidspaces_unavailable ]; then
            cat droidspaces_unavailable
          else
            echo "(none)"
          fi

      - name: Apply Droidspaces Kconfig changes
        run: |
          set -e

          echo
          echo "========================================"
          echo "DROIDSPACES KCONFIG MODIFICATIONS"
          echo "========================================"

          CONFIG="out/.config"

          cp "$CONFIG" out/.config.droidspaces.before

          changed=0
          unchanged=0
          unavailable=0

          while read -r symbol; do
            [ -z "$symbol" ] && continue

            before=$(grep -E "^${symbol}=|^# ${symbol} is not set$" "$CONFIG" || true)

            if grep -q "^${symbol}=y$" "$CONFIG"; then
              echo
              echo "$symbol"
              echo "  BEFORE: $before"
              echo "  REQUIRED: y"
              echo "  ACTION: UNCHANGED"
              echo "  AFTER: $symbol=y"
              unchanged=$((unchanged + 1))
              continue
            fi

            if grep -q "^# ${symbol} is not set$" "$CONFIG"; then
              sed -i "s/^# ${symbol} is not set$/${symbol}=y/" "$CONFIG"

              echo
              echo "$symbol"
              echo "  BEFORE: $before"
              echo "  REQUIRED: y"
              echo "  ACTION: ENABLED"
              echo "  AFTER: $symbol=y"

              changed=$((changed + 1))
              continue
            fi

            if grep -q "^${symbol}=" "$CONFIG"; then
              sed -i "s/^${symbol}=.*/${symbol}=y/" "$CONFIG"

              echo
              echo "$symbol"
              echo "  BEFORE: $before"
              echo "  REQUIRED: y"
              echo "  ACTION: CHANGED TO y"
              echo "  AFTER: $symbol=y"

              changed=$((changed + 1))
              continue
            fi

            echo
            echo "$symbol"
            echo "  BEFORE: NOT AVAILABLE"
            echo "  REQUIRED: y"
            echo "  ACTION: NOT AVAILABLE"

            echo "$symbol" >> droidspaces_unavailable
            unavailable=$((unavailable + 1))

          done < droidspaces_required_configs

          echo
          echo "========================================"
          echo "KCONFIG MODIFICATION SUMMARY"
          echo "========================================"
          echo "CHANGED:     $changed"
          echo "UNCHANGED:   $unchanged"
          echo "UNAVAILABLE: $unavailable"

      - name: Apply Droidspaces non-GKI patches
        run: |
          set -e

          echo
          echo "========================================"
          echo "APPLYING DROIDSPACES NON-GKI PATCHES"
          echo "========================================"

          PATCH_DIR="droidspaces/Documentation/resources/kernel-patches/non-GKI"

          for patch_file in "$PATCH_DIR"/*.patch; do
            [ -f "$patch_file" ] || continue

            echo
            echo "----------------------------------------"
            echo "Checking:"
            echo "$patch_file"
            echo "----------------------------------------"

            target_files=$(grep -E '^diff --git a/[^ ]+ b/[^ ]+' "$patch_file" \
              | sed -E 's#^diff --git a/[^ ]+ b/([^ ]+)#\1#' || true)

            can_apply=true

            while read -r target; do
              [ -z "$target" ] && continue

              if [ ! -f "$target" ]; then
                echo "Target missing: $target"
                can_apply=false
              else
                echo "Target found: $target"
              fi
            done <<< "$target_files"

            if [ "$can_apply" != true ]; then
              echo "$(basename "$patch_file"): SKIPPED_MISSING_TARGET"
              continue
            fi

            if git apply --check "$patch_file"; then
              git apply "$patch_file"
              echo "$(basename "$patch_file"): APPLIED"
            else
              echo "$(basename "$patch_file"): SKIPPED_NOT_APPLICABLE"
            fi

          done

      - name: Resolve Kconfig dependencies
        run: |
          set -e

          echo
          echo "========================================"
          echo "RESOLVING KCONFIG DEPENDENCIES"
          echo "========================================"

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo
          echo "KCONFIG DEPENDENCIES RESOLVED"

      - name: Generate full defconfig
        run: |
          set -e

          echo
          echo "========================================"
          echo "GENERATING FULL DEFCONFIG"
          echo "========================================"

          FULL_DEFCONFIG="vendor/violet-perf_defconfig.full"

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            savedefconfig

          cp out/defconfig "$FULL_DEFCONFIG"

          echo
          echo "FULL DEFCONFIG:"
          echo "$FULL_DEFCONFIG"

          echo
          echo "SIZE:"
          wc -l "$FULL_DEFCONFIG"

      - name: Final Droidspaces verification
        run: |
          set -e

          echo
          echo "========================================"
          echo "FINAL DROIDSPACES VERIFICATION"
          echo "========================================"

          CONFIG="out/.config"

          echo
          echo "Kernel:"
          make kernelversion

          echo
          echo "Defconfig:"
          echo "vendor/violet-perf_defconfig"

          echo
          echo "Full defconfig:"
          echo "vendor/violet-perf_defconfig.full"

          echo
          echo "Final required configuration:"

          while read -r symbol; do
            [ -z "$symbol" ] && continue

            grep -E "^${symbol}=|^# ${symbol} is not set$" "$CONFIG" \
              || echo "$symbol: NOT PRESENT"

          done < droidspaces_required_configs

          echo
          echo "========================================"
          echo "NO FULL KERNEL BUILD"
          echo "========================================"
          echo "Droidspaces integration stage completed."

      - name: Upload Droidspaces artifacts
        uses: actions/upload-artifact@v4
        with:
          name: droidspaces-kernel-results
          path: |
            vendor/violet-perf_defconfig.full
            out/.config
            out/.config.droidspaces.before
            droidspaces_required_configs
            droidspaces_configs.raw
            droidspaces_missing
            droidspaces_disabled
            droidspaces_enabled
            droidspaces_unavailable
            droidspaces
          if-no-files-found: warn
