name: Droidspaces Kernel Configuration

on:
  workflow_dispatch:

jobs:
  droidspaces:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            make \
            gcc \
            patch \
            rsync

      - name: Clone Droidspaces
        run: |
          set -e

          rm -rf droidspaces

          git clone --depth=1 \
            https://github.com/ravindu644/Droidspaces-OSS.git \
            droidspaces

      - name: Verify kernel
        run: |
          set -e

          echo "========================================"
          echo "DROIDSPACES KERNEL VERIFICATION"
          echo "========================================"

          echo
          echo "Kernel:"
          make kernelversion || true

          echo
          echo "Defconfig:"
          test -f vendor/violet-perf_defconfig

          echo "vendor/violet-perf_defconfig: FOUND"

      - name: Apply Droidspaces non-GKI patches
        shell: bash
        run: |
          set +e

          echo
          echo "========================================"
          echo "APPLYING DROIDSPACES NON-GKI PATCHES"
          echo "========================================"

          PATCHDIR="droidspaces/Documentation/resources/kernel-patches/non-GKI"

          if [ ! -d "$PATCHDIR" ]; then
            echo "ERROR: Droidspaces non-GKI patch directory not found"
            exit 1
          fi

          for patch in "$PATCHDIR"/*.patch; do

            [ -f "$patch" ] || continue

            name="$(basename "$patch")"

            echo
            echo "----------------------------------------"
            echo "Checking: $name"
            echo "----------------------------------------"

            target="$(grep -m1 '^diff --git ' "$patch" | sed -E 's#diff --git a/(.*) b/.*#\1#')"

            if [ -z "$target" ]; then
              echo "STATUS: INVALID_PATCH_TARGET"
              continue
            fi

            echo "Target: $target"

            if [ ! -f "$target" ]; then
              echo "STATUS: SKIPPED_MISSING_TARGET"
              continue
            fi

            echo "Target exists."

            if patch --dry-run -p1 < "$patch" >/tmp/ds_patch_check.log 2>&1; then

              if patch -p1 < "$patch" >/tmp/ds_patch_apply.log 2>&1; then
                echo "STATUS: APPLIED"
              else
                echo "STATUS: APPLY_FAILED"
                cat /tmp/ds_patch_apply.log
              fi

            else

              echo "STATUS: SKIPPED_NOT_APPLICABLE"
              cat /tmp/ds_patch_check.log

            fi

          done

      - name: Prepare base defconfig
        shell: bash
        run: |
          set -e

          echo
          echo "========================================"
          echo "PREPARING DEFCONFIG"
          echo "========================================"

          cp vendor/violet-perf_defconfig /tmp/violet-perf_defconfig.original

          echo "Original defconfig:"
          wc -l vendor/violet-perf_defconfig

      - name: Generate Kconfig baseline
        shell: bash
        run: |
          set -e

          echo
          echo "========================================"
          echo "GENERATING KCONFIG BASELINE"
          echo "========================================"

          make O=out ARCH=arm64 vendor/violet-perf_defconfig

          cp out/.config /tmp/violet-kconfig-before

          echo "Kconfig baseline generated."

      - name: Droidspaces requirement analysis
        shell: bash
        run: |
          set +e

          echo
          echo "========================================"
          echo "DROIDSPACES CONFIG CHECK"
          echo "========================================"

          echo
          echo "Kernel version:"
          make kernelversion

          echo
          echo "Checking actual Kconfig symbols..."
          echo

          REQUIRED_CONFIGS=(

            CONFIG_SYSCTL
            CONFIG_SYSVIPC
            CONFIG_POSIX_MQUEUE

            CONFIG_NAMESPACES
            CONFIG_PID_NS
            CONFIG_UTS_NS
            CONFIG_IPC_NS
            CONFIG_NET_NS

            CONFIG_SECCOMP
            CONFIG_SECCOMP_FILTER

            CONFIG_CGROUPS
            CONFIG_CGROUP_DEVICE
            CONFIG_CGROUP_PIDS
            CONFIG_MEMCG
            CONFIG_CGROUP_SCHED
            CONFIG_FAIR_GROUP_SCHED
            CONFIG_CGROUP_FREEZER
            CONFIG_CGROUP_NET_PRIO

            CONFIG_DEVTMPFS

            CONFIG_OVERLAY_FS

            CONFIG_TMPFS_POSIX_ACL
            CONFIG_TMPFS_XATTR

            CONFIG_FW_LOADER
            CONFIG_FW_LOADER_USER_HELPER
            CONFIG_FW_LOADER_COMPRESS

            CONFIG_VETH
            CONFIG_BRIDGE

            CONFIG_NETFILTER
            CONFIG_NETFILTER_XTABLES
            CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
            CONFIG_BRIDGE_NETFILTER

            CONFIG_EXT4_FS
            CONFIG_PROC_FS
            CONFIG_SYSFS
            CONFIG_DEVPTS_FS
          )

          : > /tmp/droidspaces_config_report

          echo "DROIDSPACES CONFIG CHECK" | tee -a /tmp/droidspaces_config_report
          echo "========================" | tee -a /tmp/droidspaces_config_report
          echo | tee -a /tmp/droidspaces_config_report

          echo "MISSING:" | tee -a /tmp/droidspaces_config_report

          missing=0

          for cfg in "${REQUIRED_CONFIGS[@]}"; do

            symbol="${cfg#CONFIG_}"

            if ! grep -q "^${cfg}=" out/.config && \
               ! grep -q "^# ${cfg} is not set" out/.config; then

              echo "$cfg" | tee -a /tmp/droidspaces_config_report
              missing=$((missing + 1))

            fi

          done

          [ "$missing" -eq 0 ] && echo "(none)" | tee -a /tmp/droidspaces_config_report

          echo | tee -a /tmp/droidspaces_config_report
          echo "DISABLED:" | tee -a /tmp/droidspaces_config_report

          disabled=0

          for cfg in "${REQUIRED_CONFIGS[@]}"; do

            if grep -q "^# ${cfg} is not set" out/.config; then

              echo "$cfg" | tee -a /tmp/droidspaces_config_report
              disabled=$((disabled + 1))

            fi

          done

          [ "$disabled" -eq 0 ] && echo "(none)" | tee -a /tmp/droidspaces_config_report

          echo | tee -a /tmp/droidspaces_config_report
          echo "ALREADY ENABLED:" | tee -a /tmp/droidspaces_config_report

          enabled=0

          for cfg in "${REQUIRED_CONFIGS[@]}"; do

            if grep -q "^${cfg}=" out/.config; then

              value="$(grep "^${cfg}=" out/.config | head -1)"
              echo "$value" | tee -a /tmp/droidspaces_config_report
              enabled=$((enabled + 1))

            fi

          done

          [ "$enabled" -eq 0 ] && echo "(none)" | tee -a /tmp/droidspaces_config_report

          echo | tee -a /tmp/droidspaces_config_report
          echo "NOT AVAILABLE IN THIS KERNEL:" | tee -a /tmp/droidspaces_config_report

          unavailable=0

          for cfg in "${REQUIRED_CONFIGS[@]}"; do

            symbol="${cfg#CONFIG_}"

            if ! grep -Rqs \
              "^config ${symbol}$\|^menuconfig ${symbol}$" \
              --include='Kconfig*' \
              --exclude-dir=.git \
              .; then

              echo "$cfg" | tee -a /tmp/droidspaces_config_report
              unavailable=$((unavailable + 1))

            fi

          done

          [ "$unavailable" -eq 0 ] && echo "(none)" | tee -a /tmp/droidspaces_config_report

          echo | tee -a /tmp/droidspaces_config_report

          cat /tmp/droidspaces_config_report

      - name: Enable Droidspaces required configs
        shell: bash
        run: |
          set -e

          echo
          echo "========================================"
          echo "ENABLING DROIDSPACES CONFIGS"
          echo "========================================"

          CONFIG_FRAGMENT="out/droidspaces.fragment"

          cat > "$CONFIG_FRAGMENT" <<'EOF'
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y

          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_NET_NS=y

          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y

          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y

          CONFIG_DEVTMPFS=y

          CONFIG_OVERLAY_FS=y

          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y

          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y

          CONFIG_VETH=y
          CONFIG_BRIDGE=y

          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XTABLES=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_BRIDGE_NETFILTER=y

          CONFIG_EXT4_FS=y
          CONFIG_PROC_FS=y
          CONFIG_SYSFS=y
          CONFIG_DEVPTS_FS=y
          EOF

          ./scripts/kconfig/merge_config.sh \
            -m \
            out/.config \
            "$CONFIG_FRAGMENT"

          make O=out ARCH=arm64 olddefconfig

          echo
          echo "Kconfig dependency resolution completed."

      - name: Validate final Droidspaces configuration
        shell: bash
        run: |
          set +e

          echo
          echo "========================================"
          echo "FINAL DROIDSPACES CONFIG CHECK"
          echo "========================================"

          CONFIGS=(

            CONFIG_SYSCTL
            CONFIG_SYSVIPC
            CONFIG_POSIX_MQUEUE

            CONFIG_NAMESPACES
            CONFIG_PID_NS
            CONFIG_UTS_NS
            CONFIG_IPC_NS
            CONFIG_NET_NS

            CONFIG_SECCOMP
            CONFIG_SECCOMP_FILTER

            CONFIG_CGROUPS
            CONFIG_CGROUP_DEVICE
            CONFIG_CGROUP_PIDS
            CONFIG_MEMCG
            CONFIG_CGROUP_SCHED
            CONFIG_FAIR_GROUP_SCHED
            CONFIG_CGROUP_FREEZER
            CONFIG_CGROUP_NET_PRIO

            CONFIG_DEVTMPFS
            CONFIG_OVERLAY_FS

            CONFIG_TMPFS_POSIX_ACL
            CONFIG_TMPFS_XATTR

            CONFIG_FW_LOADER
            CONFIG_FW_LOADER_USER_HELPER
            CONFIG_FW_LOADER_COMPRESS

            CONFIG_VETH
            CONFIG_BRIDGE

            CONFIG_NETFILTER
            CONFIG_NETFILTER_XTABLES
            CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
            CONFIG_BRIDGE_NETFILTER

            CONFIG_EXT4_FS
            CONFIG_PROC_FS
            CONFIG_SYSFS
            CONFIG_DEVPTS_FS
          )

          failed=0

          for cfg in "${CONFIGS[@]}"; do

            if grep -q "^${cfg}=y$" out/.config; then

              echo "OK      $cfg=y"

            elif grep -q "^${cfg}=m$" out/.config; then

              echo "MODULE  $cfg=m"
              failed=1

            elif grep -q "^# ${cfg} is not set" out/.config; then

              echo "FAIL    $cfg=n"
              failed=1

            else

              echo "MISSING $cfg"
              failed=1

            fi

          done

          echo

          if [ "$failed" -eq 0 ]; then
            echo "DROIDSPACES FINAL CHECK: PASS"
          else
            echo "DROIDSPACES FINAL CHECK: REVIEW REQUIRED"
          fi

      - name: Generate full Droidspaces defconfig
        shell: bash
        run: |
          set -e

          echo
          echo "========================================"
          echo "GENERATING FULL DEFCONFIG"
          echo "========================================"

          make O=out ARCH=arm64 savedefconfig

          cp out/defconfig vendor/violet-perf_defconfig.full

          echo
          echo "Generated:"
          echo "vendor/violet-perf_defconfig.full"

          wc -l vendor/violet-perf_defconfig.full

      - name: Generate final complete config
        shell: bash
        run: |
          set -e

          cp out/.config vendor/violet-perf_defconfig.complete

          echo
          echo "========================================"
          echo "OUTPUT FILES"
          echo "========================================"

          ls -lh \
            vendor/violet-perf_defconfig.full \
            vendor/violet-perf_defconfig.complete

      - name: Final report
        shell: bash
        run: |
          echo
          echo "========================================"
          echo "DROIDSPACES FINAL REPORT"
          echo "========================================"

          echo
          cat /tmp/droidspaces_config_report

          echo
          echo "========================================"
          echo "GENERATED FILES"
          echo "========================================"

          echo "1. vendor/violet-perf_defconfig.full"
          echo "   Minimal savedefconfig containing the resolved Droidspaces configuration."

          echo
          echo "2. vendor/violet-perf_defconfig.complete"
          echo "   Complete resolved Kconfig."

          echo
          echo "NO KERNEL BUILD WAS PERFORMED."

      - name: Upload Droidspaces configuration
        uses: actions/upload-artifact@v4
        with:
          name: droidspaces-violet-config
          path: |
            vendor/violet-perf_defconfig.full
            vendor/violet-perf_defconfig.complete
            /tmp/droidspaces_config_report
            droidspaces/Documentation/resources/kernel-patches/non-GKI/*.patch
          if-no-files-found: error
          retention-days: 30
