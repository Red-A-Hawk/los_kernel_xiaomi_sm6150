name: Droidspaces 4.14 Integration Check

on:
  workflow_dispatch:

jobs:
  droidspaces:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT KERNEL
      # ============================================================
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            build-essential \
            cpio \
            kmod \
            libssl-dev \
            libelf-dev \
            device-tree-compiler \
            python3 \
            rsync \
            patch \
            wget \
            unzip

      # ============================================================
      # 3. CLONE DROIDSPACES
      # ============================================================
      - name: Clone Droidspaces
        run: |
          set -e

          git clone --depth=1 \
            https://github.com/ravindu644/Droidspaces-OSS.git \
            droidspaces

          echo
          echo "========================================"
          echo "DROIDSPACES SOURCE"
          echo "========================================"

          git -C droidspaces log -1 --oneline

      # ============================================================
      # 4. BASIC KERNEL DETECTION
      # ============================================================
      - name: Detect kernel
        run: |
          set -e

          echo
          echo "========================================"
          echo "KERNEL DETECTION"
          echo "========================================"

          echo "Kernel:"
          make kernelversion || true

          echo
          echo "Architecture:"
          grep -E '^CONFIG_(ARM64|ARM)=' arch/arm64/configs/vendor/violet-perf_defconfig 2>/dev/null || true

          echo
          echo "Defconfig:"
          test -f arch/arm64/configs/vendor/violet-perf_defconfig

          echo "arch/arm64/configs/vendor/violet-perf_defconfig"

      # ============================================================
      # 5. LOCATE DROIDSPACES NON-GKI PATCHES
      # ============================================================
      - name: Locate Droidspaces patches
        run: |
          set +e

          echo
          echo "========================================"
          echo "DROIDSPACES NON-GKI PATCHES"
          echo "========================================"

          PATCH_DIR="droidspaces/Documentation/resources/kernel-patches/non-GKI"

          if [ -d "$PATCH_DIR" ]; then
            find "$PATCH_DIR" -maxdepth 1 -type f -name '*.patch' -print | sort
          else
            echo "Patch directory not found"
          fi

      # ============================================================
      # 6. CHECK PATCH TARGET FILES
      # ============================================================
      - name: Check patch targets
        run: |
          set +e

          echo
          echo "========================================"
          echo "DROIDSPACES PATCH TARGET CHECK"
          echo "========================================"

          PATCH_DIR="droidspaces/Documentation/resources/kernel-patches/non-GKI"

          for PATCH in "$PATCH_DIR"/*.patch; do

            [ -f "$PATCH" ] || continue

            echo
            echo "----------------------------------------"
            echo "Checking:"
            echo "$PATCH"
            echo "----------------------------------------"

            TARGETS=$(grep '^+++ b/' "$PATCH" | sed 's/^+++ b\///' | sort -u)

            for TARGET in $TARGETS; do

              if [ -f "$TARGET" ]; then
                echo "AVAILABLE: $TARGET"
              else
                echo "NOT AVAILABLE: $TARGET"
              fi

            done

          done

      # ============================================================
      # 7. DROIDSPACES CONFIG REQUIREMENTS
      # ============================================================
      - name: Droidspaces config check
        run: |
          set +e

          DEFCONFIG="arch/arm64/configs/vendor/violet-perf_defconfig"

          echo
          echo "========================================"
          echo "DROIDSPACES CONFIG CHECK"
          echo "========================================"

          echo
          echo "DEFCONFIG:"
          echo "$DEFCONFIG"

          echo
          echo "----------------------------------------"
          echo "DROIDSPACES CONFIG REQUIREMENTS"
          echo "----------------------------------------"

          cat > /tmp/droidspaces_required_configs <<'EOF'
CONFIG_NAMESPACES
CONFIG_UTS_NS
CONFIG_IPC_NS
CONFIG_PID_NS
CONFIG_NET_NS
CONFIG_CGROUPS
CONFIG_CGROUP_FREEZER
CONFIG_CGROUP_DEVICE
CONFIG_CGROUP_CPUACCT
CONFIG_CGROUP_SCHED
CONFIG_CGROUP_PIDS
CONFIG_CGROUP_NET_PRIO
CONFIG_CGROUP_NET_CLASSID
CONFIG_SECCOMP
CONFIG_SECCOMP_FILTER
CONFIG_NETFILTER
CONFIG_NETFILTER_XTABLES
CONFIG_NETFILTER_XT_TARGET_MARK
CONFIG_NETFILTER_XT_MATCH_COMMENT
CONFIG_NETFILTER_XT_MATCH_CONNMARK
CONFIG_NETFILTER_XT_MATCH_OWNER
CONFIG_NETFILTER_XT_MATCH_SOCKET
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
CONFIG_VETH
CONFIG_BRIDGE
CONFIG_BRIDGE_NETFILTER
CONFIG_OVERLAY_FS
CONFIG_TMPFS
CONFIG_DEVTMPFS
CONFIG_DEVTMPFS_MOUNT
CONFIG_EXT4_FS
CONFIG_PROC_FS
CONFIG_SYSFS
EOF

          : > /tmp/droid_missing
          : > /tmp/droid_disabled
          : > /tmp/droid_enabled
          : > /tmp/droid_unavailable

          for CONFIG in $(cat /tmp/droidspaces_required_configs); do

            SYMBOL="${CONFIG#CONFIG_}"

            echo -n "$CONFIG: "

            if grep -q "^${CONFIG}=y" "$DEFCONFIG"; then
              echo "ENABLED"
              echo "$CONFIG" >> /tmp/droid_enabled
              continue
            fi

            if grep -q "^${CONFIG}=m" "$DEFCONFIG"; then
              echo "MODULE"
              echo "$CONFIG" >> /tmp/droid_enabled
              continue
            fi

            if grep -q "^# ${CONFIG} is not set" "$DEFCONFIG"; then
              echo "DISABLED"
              echo "$CONFIG" >> /tmp/droid_disabled
              continue
            fi

            if grep -Rqs \
              --include='Kconfig' \
              --include='Kconfig.*' \
              "config ${SYMBOL}" \
              . \
              2>/dev/null; then

              echo "MISSING"
              echo "$CONFIG" >> /tmp/droid_missing

            else

              echo "NOT AVAILABLE"
              echo "$CONFIG" >> /tmp/droid_unavailable

            fi

          done

          echo
          echo "========================================"
          echo "DROIDSPACES CONFIG CHECK"
          echo "========================================"

          echo
          echo "MISSING:"
          cat /tmp/droid_missing 2>/dev/null || true

          echo
          echo "DISABLED:"
          cat /tmp/droid_disabled 2>/dev/null || true

          echo
          echo "ALREADY ENABLED:"
          cat /tmp/droid_enabled 2>/dev/null || true

          echo
          echo "NOT AVAILABLE IN THIS KERNEL:"
          cat /tmp/droid_unavailable 2>/dev/null || true

      # ============================================================
      # 8. APPLY ONLY COMPATIBLE DROIDSPACES PATCHES
      # ============================================================
      - name: Apply compatible Droidspaces patches
        run: |
          set +e

          PATCH_DIR="droidspaces/Documentation/resources/kernel-patches/non-GKI"

          echo
          echo "========================================"
          echo "APPLYING DROIDSPACES NON-GKI PATCHES"
          echo "========================================"

          mkdir -p /tmp/droidspaces_patch_status

          for PATCH in "$PATCH_DIR"/*.patch; do

            [ -f "$PATCH" ] || continue

            NAME=$(basename "$PATCH")

            echo
            echo "----------------------------------------"
            echo "Checking:"
            echo "$PATCH"
            echo "----------------------------------------"

            TARGETS=$(grep '^+++ b/' "$PATCH" | sed 's/^+++ b\///' | sort -u)

            MISSING_TARGET=0

            for TARGET in $TARGETS; do

              if [ ! -f "$TARGET" ]; then
                echo "SKIP: target does not exist:"
                echo "$TARGET"
                MISSING_TARGET=1
              fi

            done

            if [ "$MISSING_TARGET" -eq 1 ]; then
              echo "SKIPPED: $NAME"
              echo "SKIPPED" > "/tmp/droidspaces_patch_status/$NAME"
              continue
            fi

            patch --dry-run -p1 < "$PATCH"

            if [ "$?" -ne 0 ]; then
              echo "SKIPPED: patch does not apply cleanly"
              echo "FAILED_DRY_RUN" > "/tmp/droidspaces_patch_status/$NAME"
              continue
            fi

            patch -p1 < "$PATCH"

            if [ "$?" -eq 0 ]; then
              echo "APPLIED: $NAME"
              echo "APPLIED" > "/tmp/droidspaces_patch_status/$NAME"
            else
              echo "FAILED: $NAME"
              echo "FAILED" > "/tmp/droidspaces_patch_status/$NAME"
            fi

          done

      # ============================================================
      # 9. COPY DROIDSPACES KERNEL COMPONENTS IF REQUIRED
      # ============================================================
      - name: Inspect Droidspaces kernel integration
        run: |
          set +e

          echo
          echo "========================================"
          echo "DROIDSPACES KERNEL INTEGRATION"
          echo "========================================"

          find droidspaces \
            -type f \
            \( -name 'Kconfig' -o -name '*.c' -o -name '*.h' -o -name '*.patch' \) \
            | grep -E 'kernel|non-GKI|patch' \
            | head -300

      # ============================================================
      # 10. SAVE ORIGINAL DEFCONFIG
      # ============================================================
      - name: Save original defconfig
        run: |
          set -e

          cp \
            arch/arm64/configs/vendor/violet-perf_defconfig \
            violet-perf_defconfig.original

      # ============================================================
      # 11. CREATE DROIDSPACES DEFCONFIG
      # ============================================================
      - name: Create Droidspaces defconfig
        run: |
          set -e

          ORIGINAL="arch/arm64/configs/vendor/violet-perf_defconfig"
          OUTPUT="violet-perf_defconfig.droidspaces"

          cp "$ORIGINAL" "$OUTPUT"

          while read -r CONFIG; do

            [ -z "$CONFIG" ] && continue

            if grep -q "^${CONFIG}=y" "$OUTPUT"; then
              continue
            fi

            if grep -q "^${CONFIG}=m" "$OUTPUT"; then
              continue
            fi

            if grep -q "^# ${CONFIG} is not set" "$OUTPUT"; then
              sed -i \
                "s/^# ${CONFIG} is not set/${CONFIG}=y/" \
                "$OUTPUT"
            else
              echo "${CONFIG}=y" >> "$OUTPUT"
            fi

          done < /tmp/droid_missing

          sort -u "$OUTPUT" -o "$OUTPUT"

          echo
          echo "========================================"
          echo "DROIDSPACES DEFCONFIG GENERATED"
          echo "========================================"

          echo "Output:"
          echo "$OUTPUT"

      # ============================================================
      # 12. VALIDATE DEFCONFIG
      # ============================================================
      - name: Validate Droidspaces defconfig
        run: |
          set -e

          cp \
            violet-perf_defconfig.droidspaces \
            arch/arm64/configs/vendor/violet-perf_defconfig

          make ARCH=arm64 vendor/violet-perf_defconfig

          echo
          echo "========================================"
          echo "FINAL DROIDSPACES CONFIG"
          echo "========================================"

          for CONFIG in $(cat /tmp/droidspaces_required_configs); do

            VALUE=$(grep "^${CONFIG}=" .config 2>/dev/null || true)

            if [ -z "$VALUE" ]; then
              VALUE=$(grep "^# ${CONFIG} is not set" .config 2>/dev/null || true)
            fi

            echo "$VALUE"

          done

      # ============================================================
      # 13. FINAL CONFIG REPORT
      # ============================================================
      - name: Final Droidspaces config report
        run: |
          set +e

          echo
          echo "========================================"
          echo "FINAL DROIDSPACES CONFIG REPORT"
          echo "========================================"

          : > droidspaces-final-report.txt

          echo "DROIDSPACES CONFIG CHECK" >> droidspaces-final-report.txt
          echo "=========================" >> droidspaces-final-report.txt
          echo >> droidspaces-final-report.txt

          echo "MISSING BEFORE MODIFICATION:" >> droidspaces-final-report.txt
          cat /tmp/droid_missing >> droidspaces-final-report.txt
          echo >> droidspaces-final-report.txt

          echo "DISABLED BEFORE MODIFICATION:" >> droidspaces-final-report.txt
          cat /tmp/droid_disabled >> droidspaces-final-report.txt
          echo >> droidspaces-final-report.txt

          echo "ALREADY ENABLED:" >> droidspaces-final-report.txt
          cat /tmp/droid_enabled >> droidspaces-final-report.txt
          echo >> droidspaces-final-report.txt

          echo "NOT AVAILABLE IN THIS KERNEL:" >> droidspaces-final-report.txt
          cat /tmp/droid_unavailable >> droidspaces-final-report.txt

          echo
          cat droidspaces-final-report.txt

      # ============================================================
      # 14. PATCH STATUS
      # ============================================================
      - name: Droidspaces patch report
        run: |
          set +e

          echo
          echo "========================================"
          echo "DROIDSPACES PATCH STATUS"
          echo "========================================"

          for FILE in /tmp/droidspaces_patch_status/*; do
            [ -f "$FILE" ] || continue

            echo "$(basename "$FILE"): $(cat "$FILE")"

          done

      # ============================================================
      # 15. COMPILE ONLY AFFECTED KERNEL OBJECTS
      # ============================================================
      - name: Compile Droidspaces affected components
        run: |
          set +e

          echo
          echo "========================================"
          echo "DROIDSPACES PARTIAL KERNEL BUILD"
          echo "========================================"

          BUILD_FAILED=0

          echo
          echo "Building kernel/signal.o"

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=gcc \
            kernel/signal.o

          if [ "$?" -ne 0 ]; then
            BUILD_FAILED=1
          fi

          echo
          echo "Building net/netfilter/xt_qtaguid.o"

          if [ -f net/netfilter/xt_qtaguid.c ]; then

            make \
              ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CC=gcc \
              net/netfilter/xt_qtaguid.o

            if [ "$?" -ne 0 ]; then
              BUILD_FAILED=1
            fi

          else
            echo "xt_qtaguid.c not available - skipped"
          fi

          echo
          echo "========================================"
          echo "PARTIAL BUILD RESULT"
          echo "========================================"

          if [ "$BUILD_FAILED" -eq 0 ]; then
            echo "DROIDSPACES PARTIAL BUILD: SUCCESS"
          else
            echo "DROIDSPACES PARTIAL BUILD: FAILED"
          fi

      # ============================================================
      # 16. GENERATE CONFIG DIFF
      # ============================================================
      - name: Generate defconfig diff
        run: |
          set +e

          echo
          echo "========================================"
          echo "DEFCONFIG DIFF"
          echo "========================================"

          diff -u \
            violet-perf_defconfig.original \
            violet-perf_defconfig.droidspaces \
            > droidspaces-defconfig.diff || true

          cat droidspaces-defconfig.diff || true

      # ============================================================
      # 17. PACKAGE RESULTS
      # ============================================================
      - name: Prepare artifacts
        run: |
          set -e

          mkdir -p droidspaces-results

          cp \
            violet-perf_defconfig.original \
            droidspaces-results/

          cp \
            violet-perf_defconfig.droidspaces \
            droidspaces-results/

          cp \
            .config \
            droidspaces-results/droidspaces.config

          cp \
            droidspaces-final-report.txt \
            droidspaces-results/

          cp \
            droidspaces-defconfig.diff \
            droidspaces-results/

          cp \
            /tmp/droid_missing \
            droidspaces-results/missing.txt

          cp \
            /tmp/droid_disabled \
            droidspaces-results/disabled.txt

          cp \
            /tmp/droid_enabled \
            droidspaces-results/enabled.txt

          cp \
            /tmp/droid_unavailable \
            droidspaces-results/unavailable.txt

          cp -r \
            /tmp/droidspaces_patch_status \
            droidspaces-results/patch-status

      # ============================================================
      # 18. UPLOAD RESULTS
      # ============================================================
      - name: Upload Droidspaces results
        uses: actions/upload-artifact@v4
        with:
          name: droidspaces-4.14-results
          path: droidspaces-results/
