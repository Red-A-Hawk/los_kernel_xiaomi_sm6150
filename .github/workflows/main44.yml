name: Droidspaces Kernel Integration

on:
workflow_dispatch:

jobs:
droidspaces:
runs-on: ubuntu-22.04

steps:

  # ============================================================
  # CHECKOUT KERNEL
  # ============================================================

  - name: Checkout kernel
    uses: actions/checkout@v4
    with:
      fetch-depth: 1


  # ============================================================
  # DEPENDENCIES
  # ============================================================

  - name: Install dependencies
    run: |
      set -e

      sudo apt-get update

      sudo apt-get install -y \
        git \
        bc \
        bison \
        flex \
        libssl-dev \
        libelf-dev \
        device-tree-compiler \
        gcc-aarch64-linux-gnu \
        make \
        patch


  # ============================================================
  # CLONE DROIDSPACES
  # ============================================================

  - name: Clone Droidspaces
    run: |
      set -e

      echo "========================================"
      echo "CLONING DROIDSPACES"
      echo "========================================"

      rm -rf droidspaces

      git clone --depth=1 \
        https://github.com/ravindu644/Droidspaces-OSS.git \
        droidspaces

      echo
      echo "DROIDSPACES COMMIT:"
      git -C droidspaces log -1 --oneline


  # ============================================================
  # VERIFY KERNEL
  # ============================================================

  - name: Verify kernel
    run: |
      set -e

      echo
      echo "========================================"
      echo "DROIDSPACES KERNEL VERIFICATION"
      echo "========================================"

      echo
      echo "KERNEL VERSION:"
      make O=out ARCH=arm64 kernelversion

      echo
      echo "DEFCONFIG:"

      DEFCONFIG="arch/arm64/configs/vendor/violet-perf_defconfig"

      if [ ! -f "$DEFCONFIG" ]; then
        echo
        echo "ERROR: DEFCONFIG NOT FOUND"
        echo "$DEFCONFIG"
        echo
        echo "AVAILABLE VIOLET DEFCONFIGS:"
        find arch/arm64/configs \
          -type f \
          -iname '*violet*' \
          -print \
          | sort

        exit 1
      fi

      echo "FOUND:"
      echo "$DEFCONFIG"


  # ============================================================
  # GENERATE BASE CONFIG
  # ============================================================

  - name: Generate base Kconfig
    run: |
      set -e

      echo
      echo "========================================"
      echo "GENERATING BASE KCONFIG"
      echo "========================================"

      rm -rf out
      mkdir -p out

      make \
        O=out \
        ARCH=arm64 \
        CROSS_COMPILE=aarch64-linux-gnu- \
        vendor/violet-perf_defconfig

      if [ ! -f out/.config ]; then
        echo "ERROR: out/.config was not generated."
        exit 1
      fi

      echo
      echo "BASE CONFIG:"
      echo "out/.config"


  # ============================================================
  # SAVE ORIGINAL CONFIG
  # ============================================================

  - name: Save original configuration
    run: |
      set -e

      cp \
        out/.config \
        out/.config.droidspaces.before


  # ============================================================
  # APPLY NON-GKI PATCHES
  # ============================================================

  - name: Apply Droidspaces non-GKI patches
    run: |
      set -e

      echo
      echo "========================================"
      echo "DROIDSPACES NON-GKI PATCHES"
      echo "========================================"

      PATCH_DIR="droidspaces/Documentation/resources/kernel-patches/non-GKI"

      if [ ! -d "$PATCH_DIR" ]; then
        echo "ERROR: Non-GKI patch directory not found."
        exit 1
      fi

      : > droidspaces_patch_status

      for patch_file in "$PATCH_DIR"/*.patch; do

        [ -f "$patch_file" ] || continue

        patch_name="$(basename "$patch_file")"

        echo
        echo "----------------------------------------"
        echo "CHECKING:"
        echo "$patch_name"
        echo "----------------------------------------"

        targets="$(
          grep '^diff --git ' "$patch_file" \
          | sed -E 's#^diff --git a/([^ ]+) b/([^ ]+)#\2#' \
          || true
        )"

        if [ -z "$targets" ]; then
          echo "$patch_name: SKIPPED_NO_TARGET" \
            | tee -a droidspaces_patch_status
          continue
        fi

        missing=0

        while read -r target; do

          [ -z "$target" ] && continue

          echo
          echo "TARGET:"
          echo "$target"

          if [ -f "$target" ]; then
            echo "STATUS: FOUND"
          else
            echo "STATUS: MISSING"
            missing=1
          fi

        done <<< "$targets"

        if [ "$missing" -eq 1 ]; then

          echo
          echo "$patch_name: SKIPPED_MISSING_TARGET" \
            | tee -a droidspaces_patch_status

          continue
        fi

        echo
        echo "CHECKING PATCH APPLICABILITY..."

        if git apply --check "$patch_file" 2>/tmp/droidspaces_patch_error; then

          git apply "$patch_file"

          echo
          echo "$patch_name: APPLIED" \
            | tee -a droidspaces_patch_status

        else

          echo
          echo "PATCH CHECK FAILED:"
          cat /tmp/droidspaces_patch_error

          echo
          echo "$patch_name: SKIPPED_NOT_APPLICABLE" \
            | tee -a droidspaces_patch_status

        fi

      done


  # ============================================================
  # DROIDSPACES REQUIREMENTS
  #
  # Taken from the Non-GKI configuration requirements.
  #
  # IMPORTANT:
  # ANDROID_PARANOID_NETWORK MUST BE "n".
  # ============================================================

  - name: Define Droidspaces requirements
    run: |
      set -e

      echo
      echo "========================================"
      echo "DROIDSPACES NON-GKI REQUIREMENTS"
      echo "========================================"

      cat > droidspaces_requirements <<'EOF'
      CONFIG_SYSCTL=y
      CONFIG_SYSVIPC=y
      CONFIG_POSIX_MQUEUE=y

      CONFIG_NAMESPACES=y
      CONFIG_PID_NS=y
      CONFIG_UTS_NS=y
      CONFIG_IPC_NS=y

      CONFIG_SECCOMP=y
      CONFIG_SECCOMP_FILTER=y

      CONFIG_CGROUPS=y
      CONFIG_CGROUP_DEVICE=y
      CONFIG_CGROUP_PIDS=y
      CONFIG_MEMCG=y
      CONFIG_CGROUP_SCHED=y
      CONFIG_FAIR_GROUP_SCHED=y
      CONFIG_CGROUP_FREEZER=y
      CONFIG_CGROUP_NET_PRIO=y

      CONFIG_DEVTMPFS=y

      CONFIG_OVERLAY_FS=y

      CONFIG_TMPFS_POSIX_ACL=y
      CONFIG_TMPFS_XATTR=y

      CONFIG_FW_LOADER=y
      CONFIG_FW_LOADER_USER_HELPER=y
      CONFIG_FW_LOADER_COMPRESS=y

      CONFIG_NET_NS=y
      CONFIG_VETH=y
      CONFIG_BRIDGE=y
      CONFIG_NETFILTER=y
      CONFIG_BRIDGE_NETFILTER=y
      CONFIG_NETFILTER_ADVANCED=y
      CONFIG_NF_CONNTRACK=y
      CONFIG_IP_NF_IPTABLES=y
      CONFIG_IP_NF_FILTER=y
      CONFIG_NF_NAT=y
      CONFIG_IP_NF_TARGET_MASQUERADE=y
      CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
      CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
      CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
      CONFIG_NF_CONNTRACK_NETLINK=y
      CONFIG_NF_NAT_REDIRECT=y
      CONFIG_NF_TABLES=y
      CONFIG_NF_CONNTRACK_IPV4=y
      CONFIG_NF_NAT_IPV4=y
      CONFIG_IP_NF_NAT=y
      CONFIG_IP_ADVANCED_ROUTER=y
      CONFIG_IP_MULTIPLE_TABLES=y

      CONFIG_ANDROID_PARANOID_NETWORK=n

      CONFIG_USER_NS=y
      EOF

      sed -i 's/^[[:space:]]*//' droidspaces_requirements

      grep '^CONFIG_' droidspaces_requirements \
        > droidspaces_required_configs

      echo
      cat droidspaces_required_configs


  # ============================================================
  # FIND ACTUAL KERNEL SYMBOLS
  #
  # This detects differences between Droidspaces documentation
  # and old kernel Kconfig names.
  #
  # Example:
  #
  # CONFIG_NF_CONNTRACK_NETLINK
  #
  # may be implemented by:
  #
  # CONFIG_NF_CT_NETLINK
  # ============================================================

  - name: Resolve kernel Kconfig symbols
    run: |
      set -e

      echo
      echo "========================================"
      echo "RESOLVING KERNEL KCONFIG SYMBOLS"
      echo "========================================"

      : > droidspaces_symbol_map
      : > droidspaces_not_available

      while IFS='=' read -r requested value; do

        [ -z "$requested" ] && continue

        actual="$requested"

        if grep -Rqs \
          --include='Kconfig' \
          --include='Kconfig.*' \
          "^config ${requested#CONFIG_}$" \
          .; then

          actual="$requested"

        else

          case "$requested" in

            CONFIG_NF_CONNTRACK_NETLINK)

              if grep -Rqs \
                --include='Kconfig' \
                --include='Kconfig.*' \
                '^config NF_CT_NETLINK$' \
                .; then

                actual="CONFIG_NF_CT_NETLINK"

              fi
              ;;

          esac

        fi

        if grep -Rqs \
          --include='Kconfig' \
          --include='Kconfig.*' \
          "^config ${actual#CONFIG_}$" \
          .; then

          echo "${requested}|${value}|${actual}" \
            >> droidspaces_symbol_map

        else

          echo "${requested}|${value}|NOT_AVAILABLE" \
            >> droidspaces_symbol_map

          echo "$requested" \
            >> droidspaces_not_available

        fi

      done < droidspaces_required_configs

      echo
      echo "DROIDSPACES -> KERNEL SYMBOL MAP:"
      echo

      cat droidspaces_symbol_map

      echo
      echo "NOT AVAILABLE:"
      if [ -s droidspaces_not_available ]; then
        cat droidspaces_not_available
      else
        echo "(none)"
      fi


  # ============================================================
  # BASE CONFIG CHECK
  # ============================================================

  - name: Check base Droidspaces configuration
    run: |
      set -e

      echo
      echo "========================================"
      echo "DROIDSPACES BASE CONFIG CHECK"
      echo "========================================"

      CONFIG="out/.config"

      : > droidspaces_enabled
      : > droidspaces_disabled
      : > droidspaces_missing
      : > droidspaces_not_available

      while IFS='|' read -r requested required actual; do

        [ -z "$requested" ] && continue

        if [ "$actual" = "NOT_AVAILABLE" ]; then

          echo "$requested" >> droidspaces_not_available
          continue

        fi

        current="$(
          grep -E \
            "^${actual}=|^# ${actual} is not set$" \
            "$CONFIG" \
            || true
        )"

        if [ "$required" = "y" ]; then

          if [ "$current" = "${actual}=y" ]; then

            echo "${requested}=${actual}=y" \
              >> droidspaces_enabled

          elif [ "$current" = "# ${actual} is not set" ]; then

            echo "${requested}=${actual}" \
              >> droidspaces_disabled

          elif [ -z "$current" ]; then

            echo "${requested}=${actual}" \
              >> droidspaces_missing

          else

            echo "${requested}=${actual} (${current})" \
              >> droidspaces_disabled

          fi

        elif [ "$required" = "n" ]; then

          if [ "$current" = "# ${actual} is not set" ]; then

            echo "${requested}=${actual}=n" \
              >> droidspaces_enabled

          elif [ "$current" = "${actual}=y" ]; then

            echo "${requested}=${actual}" \
              >> droidspaces_disabled

          elif [ -z "$current" ]; then

            echo "${requested}=${actual}" \
              >> droidspaces_missing

          else

            echo "${requested}=${actual} (${current})" \
              >> droidspaces_disabled

          fi

        fi

      done < droidspaces_symbol_map


      echo
      echo "MISSING:"
      if [ -s droidspaces_missing ]; then
        cat droidspaces_missing
      else
        echo "(none)"
      fi

      echo
      echo "DISABLED:"
      if [ -s droidspaces_disabled ]; then
        cat droidspaces_disabled
      else
        echo "(none)"
      fi

      echo
      echo "ALREADY ENABLED / CORRECT:"
      if [ -s droidspaces_enabled ]; then
        cat droidspaces_enabled
      else
        echo "(none)"
      fi

      echo
      echo "NOT AVAILABLE IN THIS KERNEL:"
      if [ -s droidspaces_not_available ]; then
        cat droidspaces_not_available
      else
        echo "(none)"
      fi


  # ============================================================
  # APPLY KCONFIG REQUIREMENTS
  #
  # Do NOT blindly append unknown symbols.
  # Only symbols actually defined by this kernel are modified.
  # ============================================================

  - name: Apply Droidspaces Kconfig requirements
    run: |
      set -e

      echo
      echo "========================================"
      echo "DROIDSPACES KCONFIG MODIFICATIONS"
      echo "========================================"

      CONFIG="out/.config"

      changed=0
      unchanged=0
      unavailable=0

      while IFS='|' read -r requested required actual; do

        [ -z "$requested" ] && continue

        echo
        echo "REQUESTED:"
        echo "$requested"
        echo "REQUIRED:"
        echo "$required"
        echo "KERNEL SYMBOL:"
        echo "$actual"

        if [ "$actual" = "NOT_AVAILABLE" ]; then

          echo "ACTION: NOT AVAILABLE"

          unavailable=$((unavailable + 1))

          continue
        fi

        before="$(
          grep -E \
            "^${actual}=|^# ${actual} is not set$" \
            "$CONFIG" \
            || true
        )"

        echo "BEFORE:"
        if [ -n "$before" ]; then
          echo "$before"
        else
          echo "(not present)"
        fi

        if [ "$required" = "y" ]; then

          if [ "$before" = "${actual}=y" ]; then

            echo "ACTION: UNCHANGED"
            unchanged=$((unchanged + 1))

          elif [ "$before" = "# ${actual} is not set" ]; then

            sed -i \
              "s/^# ${actual} is not set$/${actual}=y/" \
              "$CONFIG"

            echo "ACTION: ENABLED"
            changed=$((changed + 1))

          elif grep -q "^${actual}=" "$CONFIG"; then

            sed -i \
              "s/^${actual}=.*/${actual}=y/" \
              "$CONFIG"

            echo "ACTION: CHANGED TO y"
            changed=$((changed + 1))

          else

            echo "${actual}=y" >> "$CONFIG"

            echo "ACTION: ADDED"
            changed=$((changed + 1))

          fi

        elif [ "$required" = "n" ]; then

          if [ "$before" = "# ${actual} is not set" ]; then

            echo "ACTION: UNCHANGED"
            unchanged=$((unchanged + 1))

          elif [ "$before" = "${actual}=y" ]; then

            sed -i \
              "s/^${actual}=y/# ${actual} is not set/" \
              "$CONFIG"

            echo "ACTION: DISABLED"
            changed=$((changed + 1))

          elif grep -q "^${actual}=" "$CONFIG"; then

            sed -i \
              "s/^${actual}=.*/# ${actual} is not set/" \
              "$CONFIG"

            echo "ACTION: DISABLED"
            changed=$((changed + 1))

          else

            echo "# ${actual} is not set" >> "$CONFIG"

            echo "ACTION: ADDED AS DISABLED"
            changed=$((changed + 1))

          fi

        fi

      done < droidspaces_symbol_map


      echo
      echo "========================================"
      echo "KCONFIG MODIFICATION SUMMARY"
      echo "========================================"

      echo "CHANGED:     $changed"
      echo "UNCHANGED:   $unchanged"
      echo "UNAVAILABLE: $unavailable"


  # ============================================================
  # RESOLVE DEPENDENCIES
  # ============================================================

  - name: Resolve Kconfig dependencies
    run: |
      set -e

      echo
      echo "========================================"
      echo "KCONFIG DEPENDENCY RESOLUTION"
      echo "========================================"

      make \
        O=out \
        ARCH=arm64 \
        CROSS_COMPILE=aarch64-linux-gnu- \
        olddefconfig

      if [ ! -f out/.config ]; then
        echo "ERROR: out/.config not found."
        exit 1
      fi

      echo
      echo "KCONFIG RESOLUTION COMPLETE."


  # ============================================================
  # FINAL CONFIG CHECK
  # ============================================================

  - name: Final Droidspaces config verification
    run: |
      set -e

      echo
      echo "========================================"
      echo "FINAL DROIDSPACES CONFIG VERIFICATION"
      echo "========================================"

      CONFIG="out/.config"

      : > droidspaces_final_ok
      : > droidspaces_final_fail
      : > droidspaces_final_unavailable

      while IFS='|' read -r requested required actual; do

        [ -z "$requested" ] && continue

        if [ "$actual" = "NOT_AVAILABLE" ]; then

          echo "$requested" \
            >> droidspaces_final_unavailable

          echo "[UNAVAILABLE] $requested"

          continue
        fi

        if [ "$required" = "y" ]; then

          if grep -q "^${actual}=y$" "$CONFIG"; then

            echo "[ OK ] $requested -> $actual=y"

            echo "$requested -> $actual=y" \
              >> droidspaces_final_ok

          else

            echo "[FAIL] $requested -> $actual"

            echo "$requested -> $actual" \
              >> droidspaces_final_fail

          fi

        elif [ "$required" = "n" ]; then

          if grep -q "^# ${actual} is not set$" "$CONFIG"; then

            echo "[ OK ] $requested -> $actual=n"

            echo "$requested -> $actual=n" \
              >> droidspaces_final_ok

          else

            echo "[FAIL] $requested -> $actual"

            echo "$requested -> $actual" \
              >> droidspaces_final_fail

          fi

        fi

      done < droidspaces_symbol_map


      echo
      echo "========================================"
      echo "FINAL SUMMARY"
      echo "========================================"

      echo
      echo "SUCCESSFUL:"
      if [ -s droidspaces_final_ok ]; then
        cat droidspaces_final_ok
      else
        echo "(none)"
      fi

      echo
      echo "FAILED:"
      if [ -s droidspaces_final_fail ]; then
        cat droidspaces_final_fail
      else
        echo "(none)"
      fi

      echo
      echo "UNAVAILABLE:"
      if [ -s droidspaces_final_unavailable ]; then
        cat droidspaces_final_unavailable
      else
        echo "(none)"
      fi


  # ============================================================
  # GENERATE FULL DEFCONFIG
  # ============================================================

  - name: Generate full defconfig
    run: |
      set -e

      echo
      echo "========================================"
      echo "GENERATING FULL DEFCONFIG"
      echo "========================================"

      OUTPUT="arch/arm64/configs/vendor/violet-perf_defconfig.full"

      cp \
        out/.config \
        "$OUTPUT"

      echo
      echo "SOURCE:"
      echo "out/.config"

      echo
      echo "OUTPUT:"
      echo "$OUTPUT"

      echo
      echo "LINES:"
      wc -l "$OUTPUT"

      echo
      echo "SIZE:"
      du -h "$OUTPUT"


  # ============================================================
  # PATCH STATUS
  # ============================================================

  - name: Show patch status
    run: |
      set -e

      echo
      echo "========================================"
      echo "DROIDSPACES PATCH STATUS"
      echo "========================================"

      if [ -f droidspaces_patch_status ]; then
        cat droidspaces_patch_status
      else
        echo "No patch status generated."
      fi


  # ============================================================
  # FINAL SUMMARY
  # ============================================================

  - name: Final summary
    run: |
      set -e

      echo
      echo "========================================"
      echo "DROIDSPACES INTEGRATION COMPLETE"
      echo "========================================"

      echo
      echo "Kernel:"
      make O=out ARCH=arm64 kernelversion

      echo
      echo "Original defconfig:"
      echo "arch/arm64/configs/vendor/violet-perf_defconfig"

      echo
      echo "Generated full defconfig:"
      echo "arch/arm64/configs/vendor/violet-perf_defconfig.full"

      echo
      echo "Resolved config:"
      echo "out/.config"

      echo
      echo "Kernel build:"
      echo "NOT PERFORMED"

      echo
      echo "Droidspaces integration only."

      echo
      echo "IMPORTANT:"
      echo "A successful integration check does not mean the kernel was built."


  # ============================================================
  # UPLOAD RESULTS
  # ============================================================

  - name: Upload Droidspaces results
    uses: actions/upload-artifact@v4
    with:
      name: droidspaces-kernel-results
      path: |
        arch/arm64/configs/vendor/violet-perf_defconfig.full
        out/.config
        out/.config.droidspaces.before

        droidspaces_requirements
        droidspaces_required_configs
        droidspaces_symbol_map

        droidspaces_enabled
        droidspaces_disabled
        droidspaces_missing
        droidspaces_not_available

        droidspaces_final_ok
        droidspaces_final_fail
        droidspaces_final_unavailable

        droidspaces_patch_status

      if-no-files-found: warn
