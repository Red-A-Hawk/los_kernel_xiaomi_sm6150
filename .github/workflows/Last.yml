name: Build Kernel (violet)

on:
  push:
    branches:
      - 16
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    # 1. Checkout kernel source
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: 16
        fetch-depth: 1

    # 2. Install dependencies
    - name: Install dependencies
      run: |
        set -e

        sudo apt update

        sudo apt install -y \
          git \
          bc \
          bison \
          flex \
          libssl-dev \
          make \
          zip \
          unzip \
          curl \
          wget \
          libelf-dev \
          libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          device-tree-compiler \
          python3 \
          openjdk-17-jre-headless

    # 3. Setup ZyCromerZ Clang 16.0.6
    - name: Setup Clang
      run: |
        set -e

        mkdir -p clang

        wget -q \
          https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz

        tar -xzf \
          Clang-16.0.6-20260807.tar.gz \
          -C clang

        echo "$PWD/clang/bin" >> "$GITHUB_PATH"

    # 4. Verify toolchain
    - name: Verify toolchain
      run: |
        set -e

        echo "========================================"
        echo "CLANG"
        echo "========================================"

        which clang
        clang --version

        echo
        echo "========================================"
        echo "LLD"
        echo "========================================"

        which ld.lld
        ld.lld --version

        echo
        echo "========================================"
        echo "DTC"
        echo "========================================"

        which dtc
        dtc --version

    # 5. Export build environment
    - name: Export build environment
      run: |
        echo "ARCH=arm64" >> "$GITHUB_ENV"
        echo "SUBARCH=arm64" >> "$GITHUB_ENV"
        echo "CC=clang" >> "$GITHUB_ENV"
        echo "LD=ld.lld" >> "$GITHUB_ENV"
        echo "LLVM=1" >> "$GITHUB_ENV"
        echo "LLVM_IAS=1" >> "$GITHUB_ENV"
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"

    # 6. Inspect Violet Device Tree
    - name: Inspect Violet Device Tree
      run: |
        set -e

        echo "========================================"
        echo "VIOLET DEVICE TREE FILES"
        echo "========================================"

        if [ -d arch/arm64/boot/dts/qcom/xiaomi/violet ]; then
          find \
            arch/arm64/boot/dts/qcom/xiaomi/violet \
            -maxdepth 1 \
            -type f \
            -print \
            | sort
        else
          echo "VIOLET DIRECTORY NOT FOUND"
          exit 1
        fi

        echo
        echo "========================================"
        echo "ALL VIOLET DTS/DTSI FILES"
        echo "========================================"

        find \
          arch/arm64/boot/dts/qcom/xiaomi/violet \
          -maxdepth 1 \
          -type f \
          \( -name "*.dts" -o -name "*.dtsi" \) \
          -print \
          | sort

        echo
        echo "========================================"
        echo "VIOLET REFERENCES"
        echo "========================================"

        grep -R -n \
          "violet-sm6150" \
          arch/arm64/boot/dts/qcom/xiaomi/violet \
          arch/arm64/boot/dts/qcom \
          2>/dev/null \
          | head -200 || true

        echo
        echo "========================================"
        echo "DTS MAKEFILE ENTRIES"
        echo "========================================"

        grep -R -n \
          -E "violet|sm6150" \
          arch/arm64/boot/dts/qcom/xiaomi/violet/Makefile \
          arch/arm64/boot/dts/qcom/Makefile \
          2>/dev/null \
          | head -200 || true

    # 7. Inspect the modified files
    - name: Inspect Modified Violet DTS Files
      run: |
        set -e

        echo "========================================"
        echo "violet-sm6150.dtsi"
        echo "========================================"

        if [ -f arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150.dtsi ]; then
          nl -ba \
            arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150.dtsi \
            | sed -n '1,160p'
        else
          echo "violet-sm6150.dtsi NOT FOUND"
        fi

        echo
        echo "========================================"
        echo "violet-sm6150-memory.dtsi"
        echo "========================================"

        if [ -f arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150-memory.dtsi ]; then
          nl -ba \
            arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150-memory.dtsi \
            | sed -n '1,220p'
        else
          echo "violet-sm6150-memory.dtsi NOT FOUND"
        fi

    # 8. Load defconfig
    - name: Load defconfig
      run: |
        set -e

        make O=out vendor/violet-perf_defconfig

    # 9. Detect the actual Violet DTS target
    - name: Detect Violet DTS target
      run: |
        set -e

        echo "========================================"
        echo "DETECTING VIOLET DTS TARGET"
        echo "========================================"

        DTS_DIR="arch/arm64/boot/dts/qcom/xiaomi/violet"

        if [ ! -d "$DTS_DIR" ]; then
          echo "ERROR: $DTS_DIR does not exist"
          exit 1
        fi

        echo
        echo "DTS files:"

        find "$DTS_DIR" \
          -maxdepth 1 \
          -type f \
          -name "*.dts" \
          -print \
          | sort

        echo
        echo "DTSI files:"

        find "$DTS_DIR" \
          -maxdepth 1 \
          -type f \
          -name "*.dtsi" \
          -print \
          | sort

        echo
        echo "Searching for violet-sm6150 DTS..."

        FOUND=""

        while IFS= read -r file; do
          base="$(basename "$file" .dts)"

          if grep -q \
            'violet-sm6150\.dtsi\|violet-sm6150' \
            "$file" 2>/dev/null; then

            echo "FOUND: $file"
            FOUND="$base"
          fi
        done < <(
          find "$DTS_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.dts" \
            -print \
            | sort
        )

        if [ -z "$FOUND" ]; then
          echo
          echo "No DTS directly referencing violet-sm6150 found."
          echo "Listing all DTS files for manual inspection:"

          find "$DTS_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.dts" \
            -print \
            | sort

          exit 1
        fi

        echo
        echo "Selected DTS:"
        echo "$FOUND"

        echo "VIOLET_DTS_TARGET=$FOUND" >> "$GITHUB_ENV"

    # 10. Compile the actual Violet Device Tree
    - name: Compile Violet Device Tree
      run: |
        set +e

        echo "========================================"
        echo "VIOLET DTS COMPILATION"
        echo "========================================"

        echo "Target: $VIOLET_DTS_TARGET"

        echo
        echo "Running kernel DTS build..."

        make O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          "arch/arm64/boot/dts/qcom/xiaomi/violet/${VIOLET_DTS_TARGET}.dtb" \
          2>&1 | tee dts-error.log

        DTS_RESULT=${PIPESTATUS[0]}

        echo
        echo "========================================"
        echo "DTS RETURN CODE: $DTS_RESULT"
        echo "========================================"

        echo
        echo "========================================"
        echo "DTS ERROR LOG"
        echo "========================================"

        cat dts-error.log

        exit "$DTS_RESULT"

    # 11. Build kernel
    - name: Build kernel
      run: |
        set -e

        make O=out -j$(nproc) 2>&1 | tee build.log

    # 12. Verify output
    - name: Check build output
      run: |
        set -e

        echo "========================================"
        echo "KERNEL OUTPUT"
        echo "========================================"

        test -f out/arch/arm64/boot/Image.gz

        echo "Image.gz found."

        if [ -f out/arch/arm64/boot/dtbo.img ]; then
          echo "dtbo.img found."
        else
          echo "dtbo.img not found."
        fi

    # 13. Package AnyKernel3
    - name: Package AnyKernel3
      run: |
        set -e

        git clone \
          --depth=1 \
          -b sixteen \
          https://github.com/Joker-V2/AnyKernel3.git \
          AK3

        cp \
          out/arch/arm64/boot/Image.gz \
          AK3/

        if [ -f out/arch/arm64/boot/dtbo.img ]; then
          cp \
            out/arch/arm64/boot/dtbo.img \
            AK3/
        fi

        cd AK3

        zip -r9 \
          ../Kernel-violet.zip \
          *

    # 14. Upload kernel
    - name: Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-violet
        path: Kernel-violet.zip

    # 15. Upload build log
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log

    # 16. Upload DTS debug log
    - name: Upload DTS debug log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: violet-dts-debug
        path: |
          dts-error.log
          arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150.dtsi
          arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150-memory.dtsi
