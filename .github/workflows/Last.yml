name: Build Kernel (violet)

on:
  push:
    branches:
      - 16
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: 16
        fetch-depth: 1

    - name: Install dependencies
      run: |
        set -e

        sudo apt update

        sudo apt install -y \
          git \
          bc \
          bison \
          flex \
          libssl-dev \
          make \
          zip \
          unzip \
          curl \
          wget \
          libelf-dev \
          libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          device-tree-compiler \
          python3 \
          openjdk-17-jre-headless

    - name: Setup Clang
      run: |
        set -e

        CLANG_ARCHIVE="Clang-16.0.6-20260807.tar.gz"
        CLANG_URL="https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/${CLANG_ARCHIVE}"

        echo "========================================"
        echo "DOWNLOADING CLANG"
        echo "========================================"

        wget -q --show-progress "$CLANG_URL"

        test -f "$CLANG_ARCHIVE"

        mkdir -p clang

        tar -xzf "$CLANG_ARCHIVE" -C clang

        test -x clang/bin/clang

        echo "$PWD/clang/bin" >> "$GITHUB_PATH"

    - name: Verify toolchain
      run: |
        set -e

        echo "========================================"
        echo "CLANG"
        echo "========================================"

        which clang
        clang --version

        echo
        echo "========================================"
        echo "LLD"
        echo "========================================"

        which ld.lld
        ld.lld --version

        echo
        echo "========================================"
        echo "DTC"
        echo "========================================"

        which dtc
        dtc --version

    - name: Export build environment
      run: |
        echo "ARCH=arm64" >> "$GITHUB_ENV"
        echo "SUBARCH=arm64" >> "$GITHUB_ENV"
        echo "CC=clang" >> "$GITHUB_ENV"
        echo "LD=ld.lld" >> "$GITHUB_ENV"
        echo "LLVM=1" >> "$GITHUB_ENV"
        echo "LLVM_IAS=1" >> "$GITHUB_ENV"
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"

    - name: Detect Violet DTS
      run: |
        set +e

        echo "========================================"
        echo "DETECTING VIOLET DTS TARGET"
        echo "========================================"

        echo
        echo "DTS files:"
        find arch/arm64/boot/dts \
          -type f \
          -name "*.dts" \
          | grep -i violet \
          | sort

        echo
        echo "DTSI files:"
        find arch/arm64/boot/dts/qcom/xiaomi/violet \
          -maxdepth 1 \
          -type f \
          -name "*.dtsi" \
          | sort

        echo
        echo "Searching for violet-sm6150 references:"

        grep -R -n \
          "violet-sm6150" \
          arch/arm64/boot/dts \
          2>/dev/null \
          || true

    - name: Load defconfig
      run: |
        set -e

        make O=out vendor/violet-perf_defconfig

    - name: Validate memory labels
      run: |
        set -e

        FILE="arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150-memory.dtsi"

        echo "========================================"
        echo "MEMORY LABEL DEFINITIONS"
        echo "========================================"

        grep -R -nE \
          "^[[:space:]]*[A-Za-z0-9_]+:" \
          arch/arm64/boot/dts/qcom \
          2>/dev/null \
          | grep -E \
          "reserved_memory|qcom_seecom|qcom_smcinvoke|pil_modem_mem|pil_video_mem|wlan_msa_mem|pil_cdsp_mem|pil_adsp_mem|pil_ipa_fw_mem|pil_ipa_gsi_mem|pil_gpu_mem|dfps_data_memory|disp_rdump_memory" \
          || true

        echo
        echo "========================================"
        echo "MEMORY LABEL REFERENCES"
        echo "========================================"

        grep -nE \
          "^[[:space:]]*&[A-Za-z0-9_]+" \
          "$FILE" \
          || true

        echo
        echo "========================================"
        echo "CHECKING LABELS"
        echo "========================================"

        labels="
        qcom_seecom
        qcom_smcinvoke
        pil_modem_mem
        pil_video_mem
        wlan_msa_mem
        pil_cdsp_mem
        pil_adsp_mem
        pil_ipa_fw_mem
        pil_ipa_gsi_mem
        pil_gpu_mem
        dfps_data_memory
        disp_rdump_memory
        reserved_memory
        "

        for label in $labels; do
          if grep -R -qE \
            "^[[:space:]]*${label}:" \
            arch/arm64/boot/dts/qcom; then

            echo "FOUND   : $label"

          else

            echo "MISSING : $label"

          fi
        done

    - name: Fix unsupported disp_rdump_memory
      run: |
        set -e

        FILE="arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150-memory.dtsi"

        echo "========================================"
        echo "CHECKING disp_rdump_memory"
        echo "========================================"

        if grep -R -qE \
          "^[[:space:]]*disp_rdump_memory:" \
          arch/arm64/boot/dts/qcom; then

          echo "disp_rdump_memory exists."
          echo "Keeping override."

        else

          echo "disp_rdump_memory does not exist."
          echo "Removing unsupported override."

          sed -i \
            '/^[[:space:]]*&disp_rdump_memory[[:space:]]*{/,/^[[:space:]]*};[[:space:]]*$/d' \
            "$FILE"

          echo "Override removed."

        fi

        echo
        echo "========================================"
        echo "FINAL MEMORY FILE"
        echo "========================================"

        cat "$FILE"

    - name: Build Device Trees
      run: |
        set +e

        echo "========================================"
        echo "BUILDING DEVICE TREES"
        echo "========================================"

        make O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          dtbs \
          2>&1 | tee dts-error.log

        DTS_RESULT=${PIPESTATUS[0]}

        echo
        echo "========================================"
        echo "DTS RETURN CODE: $DTS_RESULT"
        echo "========================================"

        echo
        echo "========================================"
        echo "DTS ERRORS"
        echo "========================================"

        grep -nE \
          "Error:|error:|FATAL ERROR|Label or path|No rule to make target|syntax error" \
          dts-error.log \
          || true

        exit "$DTS_RESULT"

    - name: Build kernel
      run: |
        set -e

        echo "========================================"
        echo "BUILDING KERNEL"
        echo "========================================"

        make O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          -j$(nproc) \
          2>&1 | tee build.log

    - name: Check build output
      run: |
        set -e

        echo "========================================"
        echo "CHECKING KERNEL"
        echo "========================================"

        test -f out/arch/arm64/boot/Image.gz

        echo "Image.gz found."

        echo
        echo "========================================"
        echo "DTB FILES"
        echo "========================================"

        find out/arch/arm64/boot/dts \
          -type f \
          \( -name "*.dtb" -o -name "*.dtbo" \) \
          -print \
          2>/dev/null \
          | sort

    - name: Package AnyKernel3
      run: |
        set -e

        git clone \
          --depth=1 \
          -b sixteen \
          https://github.com/Joker-V2/AnyKernel3.git \
          AK3

        cp \
          out/arch/arm64/boot/Image.gz \
          AK3/

        if [ -f out/arch/arm64/boot/dtbo.img ]; then
          cp \
            out/arch/arm64/boot/dtbo.img \
            AK3/
        fi

        cd AK3

        zip -r9 \
          ../Kernel-violet.zip \
          *

    - name: Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-violet
        path: Kernel-violet.zip

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log

    - name: Upload DTS diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: violet-dts-diagnostics
        path: |
          dts-error.log
          arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150.dtsi
          arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150-memory.dtsi
