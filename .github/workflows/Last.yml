name: Build Kernel (violet)

on:
  push:
    branches:
      - 16
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    # 1. Checkout kernel source
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: 16
        fetch-depth: 1

    # 2. Install dependencies
    - name: Install dependencies
      run: |
        set -e

        sudo apt update

        sudo apt install -y \
          git \
          bc \
          bison \
          flex \
          libssl-dev \
          make \
          zip \
          unzip \
          curl \
          wget \
          libelf-dev \
          libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          device-tree-compiler \
          python3 \
          openjdk-17-jre-headless

    # 3. Setup ZyCromerZ Clang 16.0.6
    - name: Setup Clang
      run: |
        set -e

        mkdir -p clang

        wget -q \
          https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz

        tar -xzf \
          Clang-16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz \
          -C clang

        echo "$PWD/clang/bin" >> "$GITHUB_PATH"

    # 4. Verify toolchain
    - name: Verify toolchain
      run: |
        set -e

        echo "========================================"
        echo "CLANG"
        echo "========================================"

        which clang
        clang --version

        echo
        echo "========================================"
        echo "LLD"
        echo "========================================"

        which ld.lld
        ld.lld --version

        echo
        echo "========================================"
        echo "DTC"
        echo "========================================"

        which dtc
        dtc --version

    # 5. Export build environment
    - name: Export build environment
      run: |
        echo "ARCH=arm64" >> "$GITHUB_ENV"
        echo "SUBARCH=arm64" >> "$GITHUB_ENV"
        echo "CC=clang" >> "$GITHUB_ENV"
        echo "LD=ld.lld" >> "$GITHUB_ENV"
        echo "LLVM=1" >> "$GITHUB_ENV"
        echo "LLVM_IAS=1" >> "$GITHUB_ENV"
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"

    # 6. Inspect complete Device Tree structure
    - name: Inspect Device Tree
      run: |
        set +e

        echo "========================================"
        echo "ALL DTS FILES"
        echo "========================================"

        find arch/arm64/boot/dts \
          -type f \
          -name "*.dts" \
          -print \
          | sort

        echo
        echo "========================================"
        echo "ALL VIOLET REFERENCES"
        echo "========================================"

        grep -R -n \
          -i "violet" \
          arch/arm64/boot/dts \
          2>/dev/null \
          | head -500

        echo
        echo "========================================"
        echo "violet-sm6150.dtsi INCLUDES"
        echo "========================================"

        grep -R -n \
          '#include.*violet-sm6150.dtsi' \
          arch/arm64/boot/dts \
          2>/dev/null \
          | head -200

        echo
        echo "========================================"
        echo "VIOLET DIRECTORY"
        echo "========================================"

        find \
          arch/arm64/boot/dts/qcom/xiaomi/violet \
          -maxdepth 1 \
          -type f \
          -print \
          | sort

        echo
        echo "========================================"
        echo "MAKEFILE REFERENCES"
        echo "========================================"

        grep -R -n \
          -E "violet|sm6150" \
          arch/arm64/boot/dts \
          --include="Makefile" \
          2>/dev/null \
          | head -300

    # 7. Inspect modified DTSI files
    - name: Inspect Violet DTSI
      run: |
        set -e

        echo "========================================"
        echo "violet-sm6150.dtsi"
        echo "========================================"

        nl -ba \
          arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150.dtsi \
          | sed -n '1,220p'

        echo
        echo "========================================"
        echo "violet-sm6150-memory.dtsi"
        echo "========================================"

        nl -ba \
          arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150-memory.dtsi \
          | sed -n '1,260p'

    # 8. Check memory labels
    - name: Check Memory Labels
      run: |
        set +e

        echo "========================================"
        echo "MEMORY LABEL DEFINITIONS"
        echo "========================================"

        grep -R -n -E \
          "qcom_seecom:|qcom_smcinvoke:|pil_modem_mem:|pil_video_mem:|wlan_msa_mem:|pil_cdsp_mem:|pil_adsp_mem:|pil_ipa_fw_mem:|pil_ipa_gsi_mem:|pil_gpu_mem:|dfps_data_memory:|disp_rdump_memory:|reserved_memory:" \
          arch/arm64/boot/dts \
          2>/dev/null \
          | head -500

        echo
        echo "========================================"
        echo "MEMORY LABEL REFERENCES"
        echo "========================================"

        grep -n \
          '^&' \
          arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150-memory.dtsi

    # 9. Load defconfig
    - name: Load defconfig
      run: |
        set -e

        make O=out vendor/violet-perf_defconfig

    # 10. Build all Device Trees
    - name: Build Device Trees
      run: |
        set +e

        echo "========================================"
        echo "BUILDING DEVICE TREES"
        echo "========================================"

        make O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          dtbs \
          2>&1 | tee dts-error.log

        DTS_RESULT=${PIPESTATUS[0]}

        echo
        echo "========================================"
        echo "DTB RETURN CODE: $DTS_RESULT"
        echo "========================================"

        echo
        echo "========================================"
        echo "IMPORTANT DTS ERRORS"
        echo "========================================"

        grep -n -E \
          "Error:|error:|ERROR:|syntax error|FATAL ERROR|No rule to make target" \
          dts-error.log \
          2>/dev/null \
          || true

        echo
        echo "========================================"
        echo "FULL DTS LOG"
        echo "========================================"

        cat dts-error.log

        exit "$DTS_RESULT"

    # 11. Build kernel
    - name: Build kernel
      run: |
        set -e

        make O=out \
          -j$(nproc) \
          2>&1 | tee build.log

    # 12. Verify kernel
    - name: Check build output
      run: |
        set -e

        echo "========================================"
        echo "KERNEL OUTPUT"
        echo "========================================"

        test -f out/arch/arm64/boot/Image.gz

        echo "Image.gz found."

        echo
        echo "DTB FILES:"
        find out/arch/arm64/boot/dts \
          -type f \
          \( -name "*.dtb" -o -name "*.dtbo" \) \
          -print \
          2>/dev/null \
          | sort

        if [ -f out/arch/arm64/boot/dtbo.img ]; then
          echo
          echo "dtbo.img found."
        else
          echo
          echo "dtbo.img not found."
        fi

    # 13. Package AnyKernel3
    - name: Package AnyKernel3
      run: |
        set -e

        git clone \
          --depth=1 \
          -b sixteen \
          https://github.com/Joker-V2/AnyKernel3.git \
          AK3

        cp \
          out/arch/arm64/boot/Image.gz \
          AK3/

        if [ -f out/arch/arm64/boot/dtbo.img ]; then
          cp \
            out/arch/arm64/boot/dtbo.img \
            AK3/
        fi

        cd AK3

        zip -r9 \
          ../Kernel-violet.zip \
          *

    # 14. Upload kernel
    - name: Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-violet
        path: Kernel-violet.zip

    # 15. Upload build log
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log

    # 16. Upload DTS log
    - name: Upload DTS diagnostic log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: violet-dts-diagnostics
        path: |
          dts-error.log
          arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150.dtsi
          arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150-memory.dtsi
