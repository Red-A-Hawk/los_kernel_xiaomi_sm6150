name: Build Kernel (violet)

on:
  push:
    branches:
      - 16
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    # 1. Checkout kernel source
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: 16
        fetch-depth: 1

    # 2. Install dependencies
    - name: Install dependencies
      run: |
        set -e

        sudo apt update

        sudo apt install -y \
          git \
          bc \
          bison \
          flex \
          libssl-dev \
          make \
          zip \
          unzip \
          curl \
          wget \
          libelf-dev \
          libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          device-tree-compiler \
          python3 \
          openjdk-17-jre-headless

    # 3. Setup ZyCromerZ Clang 16.0.6
    - name: Setup Clang
      run: |
        set -e

        CLANG_ARCHIVE="Clang-16.0.6-20260807.tar.gz"
        CLANG_URL="https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/${CLANG_ARCHIVE}"

        echo "========================================"
        echo "DOWNLOADING CLANG"
        echo "========================================"

        wget -q --show-progress "$CLANG_URL"

        test -f "$CLANG_ARCHIVE"

        mkdir -p clang

        echo
        echo "========================================"
        echo "EXTRACTING CLANG"
        echo "========================================"

        tar -xzf "$CLANG_ARCHIVE" -C clang

        test -x clang/bin/clang

        echo "$PWD/clang/bin" >> "$GITHUB_PATH"

        echo "Clang setup completed."

    # 4. Verify toolchain
    - name: Verify toolchain
      run: |
        set -e

        echo "========================================"
        echo "CLANG"
        echo "========================================"

        which clang
        clang --version

        echo
        echo "========================================"
        echo "LLD"
        echo "========================================"

        which ld.lld
        ld.lld --version

        echo
        echo "========================================"
        echo "DTC"
        echo "========================================"

        which dtc
        dtc --version

    # 5. Export build environment
    - name: Export build environment
      run: |
        echo "ARCH=arm64" >> "$GITHUB_ENV"
        echo "SUBARCH=arm64" >> "$GITHUB_ENV"
        echo "CC=clang" >> "$GITHUB_ENV"
        echo "LD=ld.lld" >> "$GITHUB_ENV"
        echo "LLVM=1" >> "$GITHUB_ENV"
        echo "LLVM_IAS=1" >> "$GITHUB_ENV"
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"

    # 6. Inspect actual Violet DTS target
    - name: Detect Violet DTS
      run: |
        set +e

        echo "========================================"
        echo "VIOLET DTS TARGET"
        echo "========================================"

        echo
        echo "DTS files:"
        find arch/arm64/boot/dts \
          -type f \
          -name "*.dts" \
          | grep -i violet \
          | sort

        echo
        echo "DTSI files:"
        find arch/arm64/boot/dts/qcom/xiaomi/violet \
          -maxdepth 1 \
          -type f \
          -name "*.dtsi" \
          | sort

        echo
        echo "========================================"
        echo "VIOLET REFERENCES"
        echo "========================================"

        grep -R -n \
          -i "violet" \
          arch/arm64/boot/dts \
          2>/dev/null \
          | head -500

        echo
        echo "========================================"
        echo "violet-sm6150.dtsi INCLUDE"
        echo "========================================"

        grep -R -n \
          '#include.*violet-sm6150.dtsi' \
          arch/arm64/boot/dts \
          2>/dev/null \
          || true

    # 7. Load defconfig
    - name: Load defconfig
      run: |
        set -e

        make O=out vendor/violet-perf_defconfig

    # 8. Validate Violet memory labels
    - name: Validate Violet memory labels
      run: |
        set -e

        FILE="arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150-memory.dtsi"

        echo "========================================"
        echo "VALIDATING MEMORY LABELS"
        echo "========================================"

        test -f "$FILE"

        echo
        echo "Referenced labels:"
        grep -n '^&' "$FILE"

        echo
        echo "========================================"
        echo "CHECKING LABEL DEFINITIONS"
        echo "========================================"

        labels=(
          qcom_seecom
          qcom_smcinvoke
          pil_modem_mem
          pil_video_mem
          wlan_msa_mem
          pil_cdsp_mem
          pil_adsp_mem
          pil_ipa_fw_mem
          pil_ipa_gsi_mem
          pil_gpu_mem
          dfps_data_memory
          disp_rdump_memory
          reserved_memory
        )

        missing=0

        for label in "${labels[@]}"; do
          if grep -R -qE "(^|[[:space:]])${label}:" arch/arm64/boot/dts/qcom; then
            echo "FOUND    : $label"
          else
            echo "MISSING  : $label"
            missing=$((missing + 1))
          fi
        done

        echo
        echo "Missing labels: $missing"

    # 9. Disable only unsupported disp_rdump_memory override
    - name: Fix unsupported disp_rdump_memory
      run: |
        set -e

        FILE="arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150-memory.dtsi"

        echo "========================================"
        echo "CHECKING disp_rdump_memory"
        echo "========================================"

        if grep -R -qE "(^|[[:space:]])disp_rdump_memory:" arch/arm64/boot/dts/qcom; then

          echo "disp_rdump_memory exists."
          echo "Keeping original override."

        else

          echo "disp_rdump_memory does NOT exist."
          echo "Removing only its unsupported override."

          python3 - "$FILE" <<'PY'
import sys

path = sys.argv[1]

with open(path, "r", encoding="utf-8") as f:
    data = f.read()

old = '''&disp_rdump_memory{
    reg = <0x0 0x9d100000 0x0 0x01000000>;
};
'''

old2 = '''&disp_rdump_memory {
    reg = <0x0 0x9d100000 0x0 0x01000000>;
};
'''

if old in data:
    data = data.replace(old, "")
elif old2 in data:
    data = data.replace(old2, "")
else:
    print("WARNING: disp_rdump_memory block was not found.")
    sys.exit(0)

with open(path, "w", encoding="utf-8") as f:
    f.write(data)

print("disp_rdump_memory override removed.")
PY

        fi

        echo
        echo "========================================"
        echo "FINAL MEMORY DTSI"
        echo "========================================"

        nl -ba "$FILE" | sed -n '1,220p'

    # 10. Build Device Trees
    - name: Build Device Trees
      run: |
        set +e

        echo "========================================"
        echo "BUILDING DEVICE TREES"
        echo "========================================"

        make O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          dtbs \
          2>&1 | tee dts-error.log

        DTS_RESULT=${PIPESTATUS[0]}

        echo
        echo "========================================"
        echo "DTB RETURN CODE: $DTS_RESULT"
        echo "========================================"

        echo
        echo "========================================"
        echo "IMPORTANT ERRORS"
        echo "========================================"

        grep -n -E \
          "Error:|error:|ERROR:|syntax error|FATAL ERROR|Label or path|No rule to make target" \
          dts-error.log \
          2>/dev/null \
          || true

        echo
        echo "========================================"
        echo "DTS LOG"
        echo "========================================"

        cat dts-error.log

        exit "$DTS_RESULT"

    # 11. Build kernel
    - name: Build kernel
      run: |
        set -e

        echo "========================================"
        echo "BUILDING KERNEL"
        echo "========================================"

        make O=out \
          -j$(nproc) \
          2>&1 | tee build.log

    # 12. Verify kernel output
    - name: Check build output
      run: |
        set -e

        echo "========================================"
        echo "KERNEL OUTPUT"
        echo "========================================"

        test -f out/arch/arm64/boot/Image.gz

        echo "Image.gz found."

        echo
        echo "========================================"
        echo "DTB OUTPUT"
        echo "========================================"

        find out/arch/arm64/boot/dts \
          -type f \
          \( -name "*.dtb" -o -name "*.dtbo" \) \
          -print \
          2>/dev/null \
          | sort

        echo
        echo "========================================"
        echo "DTBO"
        echo "========================================"

        if [ -f out/arch/arm64/boot/dtbo.img ]; then
          echo "dtbo.img found."
        else
          echo "dtbo.img not found."
        fi

    # 13. Package AnyKernel3
    - name: Package AnyKernel3
      run: |
        set -e

        git clone \
          --depth=1 \
          -b sixteen \
          https://github.com/Joker-V2/AnyKernel3.git \
          AK3

        cp \
          out/arch/arm64/boot/Image.gz \
          AK3/

        if [ -f out/arch/arm64/boot/dtbo.img ]; then
          cp \
            out/arch/arm64/boot/dtbo.img \
            AK3/
        fi

        cd AK3

        zip -r9 \
          ../Kernel-violet.zip \
          *

    # 14. Upload kernel
    - name: Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-violet
        path: Kernel-violet.zip

    # 15. Upload build log
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log

    # 16. Upload DTS diagnostic
    - name: Upload DTS diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: violet-dts-diagnostics
        path: |
          dts-error.log
          arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150.dtsi
          arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150-memory.dtsi
