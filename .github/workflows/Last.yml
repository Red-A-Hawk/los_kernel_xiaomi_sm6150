name: Build Kernel (violet)

on:
  push:
    branches:
      - 16
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            libssl-dev \
            make \
            zip \
            unzip \
            curl \
            wget \
            libelf-dev \
            libncurses-dev \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            device-tree-compiler \
            python3 \
            openjdk-17-jre-headless

      - name: Setup Clang
        run: |
          set -eux

          echo "========================================"
          echo "SETTING UP CLANG"
          echo "========================================"

          CLANG_ARCHIVE="Clang-16.0.6-20260807.tar.gz"
          CLANG_URL="https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/${CLANG_ARCHIVE}"

          echo
          echo "Downloading:"
          echo "$CLANG_URL"

          rm -f "$CLANG_ARCHIVE"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            -o "$CLANG_ARCHIVE" \
            "$CLANG_URL"

          echo
          echo "========================================"
          echo "VERIFYING ARCHIVE"
          echo "========================================"

          ls -lh "$CLANG_ARCHIVE"

          test -s "$CLANG_ARCHIVE"

          echo
          echo "Archive type:"
          file "$CLANG_ARCHIVE"

          echo
          echo "Testing gzip:"
          gzip -t "$CLANG_ARCHIVE"

          echo
          echo "Testing tar:"
          tar -tzf "$CLANG_ARCHIVE" >/dev/null

          echo
          echo "Archive is valid."

          echo
          echo "========================================"
          echo "EXTRACTING CLANG"
          echo "========================================"

          rm -rf clang
          mkdir -p clang

          tar -xzf "$CLANG_ARCHIVE" -C clang

          echo
          echo "Extraction completed."

          echo
          echo "========================================"
          echo "SEARCHING FOR CLANG"
          echo "========================================"

          find clang \
            -type f \
            -name clang \
            -print

          CLANG_BIN="$(find "$PWD/clang" -type f -name clang -print | head -n 1)"

          if [ -z "$CLANG_BIN" ]; then
            echo
            echo "ERROR: clang binary was not found."
            echo
            echo "Extracted files:"
            find clang -maxdepth 4 -type f | head -n 200
            exit 1
          fi

          echo
          echo "Clang binary:"
          echo "$CLANG_BIN"

          chmod +x "$CLANG_BIN"

          CLANG_DIR="$(dirname "$CLANG_BIN")"

          echo
          echo "Clang directory:"
          echo "$CLANG_DIR"

          echo "$CLANG_DIR" >> "$GITHUB_PATH"

          if [ -d "$CLANG_DIR/../bin" ]; then
            echo "$(cd "$CLANG_DIR/../bin" && pwd)" >> "$GITHUB_PATH"
          fi

          echo
          echo "========================================"
          echo "VERIFYING CLANG"
          echo "========================================"

          "$CLANG_BIN" --version

          echo
          echo "========================================"
          echo "VERIFYING LLD"
          echo "========================================"

          LLD_BIN="$(find "$PWD/clang" -type f -name ld.lld -print | head -n 1)"

          if [ -n "$LLD_BIN" ]; then
            chmod +x "$LLD_BIN"
            echo "LLD:"
            echo "$LLD_BIN"
            "$LLD_BIN" --version
          else
            echo "WARNING: ld.lld was not found inside Clang archive."
          fi

          echo
          echo "========================================"
          echo "CLANG SETUP COMPLETE"
          echo "========================================"

      - name: Export build environment
        run: |
          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "SUBARCH=arm64" >> "$GITHUB_ENV"
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "LD=ld.lld" >> "$GITHUB_ENV"
          echo "LLVM=1" >> "$GITHUB_ENV"
          echo "LLVM_IAS=1" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"

      - name: Detect Violet DTS
        run: |
          set -e

          echo "========================================"
          echo "DETECTING VIOLET DTS"
          echo "========================================"

          echo
          echo "Violet DTS files:"
          find arch/arm64/boot/dts \
            -type f \
            -name "*.dts" \
            -print \
            | grep -i violet \
            | sort || true

          echo
          echo "Violet DTSI files:"

          if [ -d arch/arm64/boot/dts/qcom/xiaomi/violet ]; then
            find arch/arm64/boot/dts/qcom/xiaomi/violet \
              -maxdepth 1 \
              -type f \
              -name "*.dtsi" \
              -print \
              | sort
          fi

          echo
          echo "Violet references:"
          grep -R -n "violet-sm6150" \
            arch/arm64/boot/dts \
            2>/dev/null || true

      - name: Load defconfig
        run: |
          set -e

          make O=out vendor/violet-perf_defconfig

      - name: Inspect SM6150 memory labels
        run: |
          set -e

          BASE="arch/arm64/boot/dts/qcom/sm6150.dtsi"
          MEMORY="arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150-memory.dtsi"

          echo "========================================"
          echo "SM6150 MEMORY LABELS"
          echo "========================================"

          echo
          echo "Base DTSI:"
          grep -nE \
            "reserved_memory:|qcom_seecom:|qcom_smcinvoke:|pil_modem_mem:|pil_video_mem:|wlan_msa_mem:|pil_cdsp_mem:|pil_adsp_mem:|pil_ipa_fw_mem:|pil_ipa_gsi_mem:|pil_gpu_mem:|dfps_data_memory:|disp_rdump_memory:" \
            "$BASE" || true

          echo
          echo "Violet memory references:"
          grep -nE \
            "^[[:space:]]*&[A-Za-z0-9_]+" \
            "$MEMORY" || true

      - name: Fix Violet memory DTSI
        run: |
          set -e

          FILE="arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150-memory.dtsi"
          BASE="arch/arm64/boot/dts/qcom/sm6150.dtsi"

          echo "========================================"
          echo "FIXING VIOLET MEMORY DTSI"
          echo "========================================"

          test -f "$FILE"
          test -f "$BASE"

          echo
          echo "Checking disp_rdump_memory in SM6150 base..."

          if grep -qE \
            "^[[:space:]]*disp_rdump_memory:" \
            "$BASE"; then

            echo "disp_rdump_memory exists in sm6150.dtsi."
            echo "Keeping override."

          else

            echo "disp_rdump_memory does NOT exist in sm6150.dtsi."
            echo "Removing unsupported override."

            sed -i \
              '/^[[:space:]]*&disp_rdump_memory[[:space:]]*{/,/^[[:space:]]*};[[:space:]]*$/d' \
              "$FILE"

            echo "disp_rdump_memory override removed."

          fi

          echo
          echo "========================================"
          echo "FINAL MEMORY FILE"
          echo "========================================"

          cat "$FILE"

      - name: Verify final memory references
        run: |
          set -e

          FILE="arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150-memory.dtsi"
          BASE="arch/arm64/boot/dts/qcom/sm6150.dtsi"

          echo "========================================"
          echo "FINAL LABEL CHECK"
          echo "========================================"

          labels="
          qcom_seecom
          qcom_smcinvoke
          pil_modem_mem
          pil_video_mem
          wlan_msa_mem
          pil_cdsp_mem
          pil_adsp_mem
          pil_ipa_fw_mem
          pil_ipa_gsi_mem
          pil_gpu_mem
          dfps_data_memory
          disp_rdump_memory
          reserved_memory
          "

          for label in $labels; do

            if grep -qE \
              "^[[:space:]]*${label}:" \
              "$BASE"; then

              echo "BASE FOUND    : $label"

            else

              if grep -qE \
                "^[[:space:]]*&${label}[[:space:]]*[{]" \
                "$FILE"; then

                echo "BASE MISSING  : $label"
                echo "REFERENCE     : $label"

              else

                echo "NOT USED      : $label"

              fi

            fi

          done

      - name: Build Device Trees
        run: |
          set +e

          echo "========================================"
          echo "BUILDING DEVICE TREES"
          echo "========================================"

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            dtbs \
            2>&1 | tee dts-error.log

          DTS_RESULT=${PIPESTATUS[0]}

          echo
          echo "========================================"
          echo "DTS RETURN CODE: $DTS_RESULT"
          echo "========================================"

          echo
          echo "========================================"
          echo "DTS ERRORS"
          echo "========================================"

          grep -nE \
            "Error:|error:|FATAL ERROR|Label or path|No rule to make target|syntax error" \
            dts-error.log || true

          exit "$DTS_RESULT"

      - name: Build kernel
        run: |
          set -e

          echo "========================================"
          echo "BUILDING KERNEL"
          echo "========================================"

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)" \
            2>&1 | tee build.log

      - name: Check build output
        run: |
          set -e

          echo "========================================"
          echo "CHECKING KERNEL OUTPUT"
          echo "========================================"

          test -f out/arch/arm64/boot/Image.gz

          echo "Image.gz found."

          echo
          echo "========================================"
          echo "DTB FILES"
          echo "========================================"

          find out/arch/arm64/boot/dts \
            -type f \
            \( -name "*.dtb" -o -name "*.dtbo" \) \
            -print \
            2>/dev/null \
            | sort

      - name: Package AnyKernel3
        run: |
          set -e

          echo "========================================"
          echo "PACKAGING KERNEL"
          echo "========================================"

          git clone \
            --depth=1 \
            -b sixteen \
            https://github.com/Joker-V2/AnyKernel3.git \
            AK3

          cp \
            out/arch/arm64/boot/Image.gz \
            AK3/

          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp \
              out/arch/arm64/boot/dtbo.img \
              AK3/
          fi

          cd AK3

          zip -r9 \
            ../Kernel-violet.zip \
            *

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-violet
          path: Kernel-violet.zip

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload DTS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violet-dts-diagnostics
          path: |
            dts-error.log
            arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150.dtsi
            arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150-memory.dtsi
