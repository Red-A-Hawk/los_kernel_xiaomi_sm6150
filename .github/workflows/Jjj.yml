name: Generate VIOLET Config From Joker

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout LOS kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            make \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            device-tree-compiler

      - name: Set ARM64 environment
        run: |
          set -e

          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

          echo "=== TOOLCHAIN ==="
          aarch64-linux-gnu-gcc --version | head -n 1
          aarch64-linux-gnu-ld --version | head -n 1

      - name: Download Joker VIOLET defconfig
        run: |
          set -e

          mkdir -p reference

          curl -L \
            --fail \
            --retry 3 \
            -o reference/joker-violet-perf_defconfig \
            https://raw.githubusercontent.com/Red-A-Hawk/kernel_xiaomi_violet/sixteen/arch/arm64/configs/vendor/violet-perf_defconfig

          test -s reference/joker-violet-perf_defconfig

          echo "=== JOKER DEFCONFIG ==="
          wc -l reference/joker-violet-perf_defconfig

      - name: Verify LOS VIOLET DTS
        run: |
          set -e

          test -f arch/arm64/boot/dts/qcom/sm6150.dtsi

          echo "=== LOS SM6150 DTS ==="
          grep -n \
            -E \
            'qseecom_ta_mem|sp_mem|secure_display_memory|cont_splash_memory|dfps_data_memory|linux,cma' \
            arch/arm64/boot/dts/qcom/sm6150.dtsi || true

      - name: Extract Joker VIOLET fragment
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          source = Path("reference/joker-violet-perf_defconfig")
          output = Path("violet.config")

          wanted_prefixes = (
              "CONFIG_ARCH_",
              "CONFIG_MACH_XIAOMI",
              "CONFIG_MSM_",
              "CONFIG_QCOM_",
              "CONFIG_MMC",
              "CONFIG_SCSI",
              "CONFIG_UFS",
              "CONFIG_IOMMU",
              "CONFIG_ARM_SMMU",
              "CONFIG_DMA",
              "CONFIG_DMABUF",
              "CONFIG_ION",
              "CONFIG_DRM",
              "CONFIG_FB",
              "CONFIG_MSM_KGSL",
              "CONFIG_KGSL",
              "CONFIG_MDSS",
              "CONFIG_MDP",
              "CONFIG_DSI",
              "CONFIG_USB",
              "CONFIG_TYPEC",
              "CONFIG_PHY_",
              "CONFIG_REGULATOR",
              "CONFIG_QPNP",
              "CONFIG_SPMI",
              "CONFIG_RPM",
              "CONFIG_RPMH",
              "CONFIG_PM_",
              "CONFIG_CPUFREQ",
              "CONFIG_CPU_FREQ",
              "CONFIG_CPU_IDLE",
              "CONFIG_DEVFREQ",
              "CONFIG_THERMAL",
              "CONFIG_POWER_SUPPLY",
              "CONFIG_RTC",
              "CONFIG_INPUT",
              "CONFIG_TOUCHSCREEN",
              "CONFIG_HID",
              "CONFIG_WLAN",
              "CONFIG_BT",
              "CONFIG_RFKILL",
              "CONFIG_CFG80211",
              "CONFIG_MAC80211",
              "CONFIG_NET",
              "CONFIG_SOUND",
              "CONFIG_SND",
              "CONFIG_VIDEO",
              "CONFIG_MEDIA",
              "CONFIG_LEDS",
              "CONFIG_VIBRATOR",
              "CONFIG_NVMEM",
              "CONFIG_INTERCONNECT",
              "CONFIG_MAILBOX",
              "CONFIG_REMOTEPROC",
              "CONFIG_RPMSG",
              "CONFIG_QSEECOM",
              "CONFIG_QCOM_SCM",
              "CONFIG_QCOM_SMEM",
              "CONFIG_QCOM_SMP2P",
              "CONFIG_QCOM_GLINK",
              "CONFIG_QCOM_LLCC",
              "CONFIG_QCOM_RPMH",
          )

          exact_symbols = {
              "CONFIG_ARM64",
              "CONFIG_64BIT",
              "CONFIG_SMP",
              "CONFIG_NR_CPUS",
              "CONFIG_PREEMPT",
              "CONFIG_HZ",
          }

          selected = []
          seen = set()

          for raw in source.read_text().splitlines():
              line = raw.strip()

              if not line:
                  continue

              if line.startswith("CONFIG_") and "=" in line:
                  symbol = line.split("=", 1)[0]

              elif line.startswith("# CONFIG_") and line.endswith(" is not set"):
                  symbol = line[2:].split(" is not set", 1)[0]

              else:
                  continue

              if symbol in exact_symbols or symbol.startswith(wanted_prefixes):
                  if symbol not in seen:
                      selected.append(line)
                      seen.add(symbol)

          output.write_text(
              "# VIOLET configuration extracted from Joker VIOLET defconfig\n"
              "# Automatically filtered for LOS SM6150\n\n"
              + "\n".join(selected)
              + "\n"
          )

          print(f"Selected symbols: {len(selected)}")
          PY

          test -s violet.config

          echo
          echo "=== GENERATED VIOLET.CONFIG ==="
          wc -l violet.config

      - name: Remove unsupported Kconfig symbols
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          config = Path("violet.config")
          kconfig = Path("out/.config")

          lines = config.read_text().splitlines()

          symbols = set()

          for path in Path(".").rglob("Kconfig*"):
              try:
                  text = path.read_text(errors="ignore")
              except Exception:
                  continue

              for match in re.finditer(
                  r'^\s*(?:config|menuconfig)\s+([A-Za-z0-9_]+)',
                  text,
                  re.MULTILINE
              ):
                  symbols.add("CONFIG_" + match.group(1))

          output = []
          removed = []

          for line in lines:
              symbol = None

              if line.startswith("CONFIG_") and "=" in line:
                  symbol = line.split("=", 1)[0]

              elif line.startswith("# CONFIG_") and line.endswith(" is not set"):
                  symbol = line[2:].split(" is not set", 1)[0]

              if symbol and symbol not in symbols:
                  removed.append(symbol)
                  continue

              output.append(line)

          config.write_text("\n".join(output) + "\n")

          print("=== REMOVED UNSUPPORTED SYMBOLS ===")

          for symbol in sorted(set(removed)):
              print(symbol)

          print()
          print(f"Removed: {len(set(removed))}")
          PY

      - name: Generate base configuration
        run: |
          set -e

          rm -rf out artifact
          mkdir -p out artifact

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/sdmsteppe-perf_defconfig

          test -s out/.config

      - name: Merge VIOLET configuration
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          config = Path("out/.config")
          fragment = Path("violet.config")

          data = config.read_text().splitlines()
          fragment_lines = fragment.read_text().splitlines()

          wanted = {}

          for line in fragment_lines:
              line = line.strip()

              if not line:
                  continue

              if line.startswith("CONFIG_") and "=" in line:
                  key = line.split("=", 1)[0]
                  wanted[key] = line

              elif line.startswith("# CONFIG_") and line.endswith(" is not set"):
                  key = line[2:].split(" is not set", 1)[0]
                  wanted[key] = line

          result = []
          seen = set()

          for line in data:
              key = None

              if line.startswith("CONFIG_") and "=" in line:
                  key = line.split("=", 1)[0]

              elif line.startswith("# CONFIG_") and line.endswith(" is not set"):
                  key = line[2:].split(" is not set", 1)[0]

              if key in wanted:
                  if key not in seen:
                      result.append(wanted[key])
                      seen.add(key)
                  continue

              result.append(line)

          for key, line in wanted.items():
              if key not in seen:
                  result.append(line)

          config.write_text("\n".join(result) + "\n")
          PY

          test -s out/.config

      - name: Resolve configuration with Kconfig
        run: |
          set -e

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          test -s out/.config

      - name: Validate final VIOLET configuration
        run: |
          set -e

          CONFIG="out/.config"

          check_enabled() {
              symbol="$1"

              if ! grep -q "^${symbol}=y$" "$CONFIG"; then
                  echo "ERROR: ${symbol} is not enabled"
                  grep -E "^${symbol}=|^# ${symbol} is not set" "$CONFIG" || true
                  exit 1
              fi

              echo "OK: ${symbol}=y"
          }

          echo "========================================"
          echo "VIOLET CONFIGURATION VALIDATION"
          echo "========================================"

          check_enabled CONFIG_ARM64
          check_enabled CONFIG_64BIT

          check_enabled CONFIG_ARCH_QCOM
          check_enabled CONFIG_ARCH_SM6150

          check_enabled CONFIG_MACH_XIAOMI
          check_enabled CONFIG_MACH_XIAOMI_SM6150
          check_enabled CONFIG_MACH_XIAOMI_VIOLET

          check_enabled CONFIG_MMC
          check_enabled CONFIG_MMC_SDHCI
          check_enabled CONFIG_MMC_SDHCI_PLTFM
          check_enabled CONFIG_MMC_SDHCI_MSM

          echo
          echo "========================================"
          echo "VIOLET CONFIGURATION: PASSED"
          echo "========================================"

      - name: Generate comparison report
        run: |
          set -e

          {
            echo "========================================"
            echo "JOKER vs LOS VIOLET CONFIGURATION"
            echo "========================================"
            echo

            echo "Joker lines:"
            wc -l reference/joker-violet-perf_defconfig

            echo
            echo "Generated fragment:"
            wc -l violet.config

            echo
            echo "Final resolved config:"
            wc -l out/.config

            echo
            echo "=== VIOLET CORE ==="

            grep -E \
              '^CONFIG_ARCH_QCOM=y$|^CONFIG_ARCH_SM6150=y$|^CONFIG_MACH_XIAOMI=y$|^CONFIG_MACH_XIAOMI_SM6150=y$|^CONFIG_MACH_XIAOMI_VIOLET=y$|^CONFIG_MMC=y$|^CONFIG_MMC_SDHCI=y$|^CONFIG_MMC_SDHCI_PLTFM=y$|^CONFIG_MMC_SDHCI_MSM=y$' \
              out/.config || true

            echo
            echo "=== MEMORY / SECURITY ==="

            grep -E \
              '^CONFIG_(CMA|DMA_CMA|DMA_SHARED_BUFFER|DMABUF|ION|QSEECOM|HDCP_QSEECOM|IOMMU|ARM_SMMU)' \
              out/.config || true

            echo
            echo "=== QCOM ==="

            grep -E \
              '^CONFIG_QCOM_(SMEM|SMEM_STATE|SMP2P|SCM|GLINK|LLCC|RPMH)' \
              out/.config || true

          } > artifact/violet-comparison.txt

      - name: Export files
        run: |
          set -e

          cp violet.config artifact/violet.config
          cp out/.config artifact/violet_full_defconfig

          test -s artifact/violet.config
          test -s artifact/violet_full_defconfig
          test -s artifact/violet-comparison.txt

      - name: Upload VIOLET artifacts
        uses: actions/upload-artifact@v4
        with:
          name: violet-config-analysis
          path: artifact/
          if-no-files-found: error
