name: Analyze SM6150 Reserved Memory

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Show SM6150 memory definitions
        run: |
          set -e

          FILE="arch/arm64/boot/dts/qcom/sm6150.dtsi"

          echo "========================================"
          echo "SM6150 RESERVED MEMORY"
          echo "========================================"

          nl -ba "$FILE" | sed -n '530,650p'

          echo
          echo "========================================"
          echo "DISP RDUMP SEARCH"
          echo "========================================"

          git grep -n "disp_rdump" -- \
            '*.dts' '*.dtsi' || true

          echo
          echo "========================================"
          echo "DFPS SEARCH"
          echo "========================================"

          git grep -n "dfps_data_memory" -- \
            '*.dts' '*.dtsi' || true
