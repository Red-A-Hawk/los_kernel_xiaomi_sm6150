name: Generate VIOLET Config From Joker

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout LOS kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            make \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            device-tree-compiler \
            curl \
            python3

      - name: Set ARM64 environment
        run: |
          set -e

          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

          echo "========================================"
          echo "TOOLCHAIN"
          echo "========================================"

          aarch64-linux-gnu-gcc --version | head -n 1
          aarch64-linux-gnu-ld --version | head -n 1

      - name: Verify kernel tree
        run: |
          set -e

          test -f Makefile
          test -f Kconfig
          test -f arch/arm64/Kconfig
          test -f arch/arm64/boot/dts/qcom/sm6150.dtsi
          test -f arch/arm64/configs/vendor/sdmsteppe-perf_defconfig

          echo "Kernel tree: OK"

      - name: Download Joker VIOLET defconfig
        run: |
          set -e

          mkdir -p reference

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            -o reference/joker-violet-perf_defconfig \
            https://raw.githubusercontent.com/Red-A-Hawk/kernel_xiaomi_violet/sixteen/arch/arm64/configs/vendor/violet-perf_defconfig

          test -s reference/joker-violet-perf_defconfig

          echo "========================================"
          echo "JOKER DEFCONFIG"
          echo "========================================"

          wc -l reference/joker-violet-perf_defconfig

      - name: Download LOS reference defconfig
        run: |
          set -e

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            -o reference/los-violet-perf_defconfig \
            https://raw.githubusercontent.com/Red-A-Hawk/los_kernel_xiaomi_sm6150/16/arch/arm64/configs/vendor/violet-perf_defconfig

          test -s reference/los-violet-perf_defconfig

          echo "========================================"
          echo "LOS REFERENCE DEFCONFIG"
          echo "========================================"

          wc -l reference/los-violet-perf_defconfig

      - name: Verify Joker VIOLET configuration
        run: |
          set -e

          echo "========================================"
          echo "JOKER VIOLET CORE"
          echo "========================================"

          grep -E \
            '^CONFIG_ARM64=y$|^CONFIG_64BIT=y$|^CONFIG_ARCH_QCOM=y$|^CONFIG_ARCH_SM6150=y$|^CONFIG_MACH_XIAOMI=y$|^CONFIG_MACH_XIAOMI_SM6150=y$|^CONFIG_MACH_XIAOMI_VIOLET=y$|^CONFIG_MMC=y$|^CONFIG_MMC_SDHCI=y$|^CONFIG_MMC_SDHCI_PLTFM=y$|^CONFIG_MMC_SDHCI_MSM=y$' \
            reference/joker-violet-perf_defconfig || true

      - name: Verify LOS VIOLET configuration
        run: |
          set -e

          echo "========================================"
          echo "LOS VIOLET CORE"
          echo "========================================"

          grep -E \
            '^CONFIG_ARM64=y$|^CONFIG_64BIT=y$|^CONFIG_ARCH_QCOM=y$|^CONFIG_ARCH_SM6150=y$|^CONFIG_MACH_XIAOMI=y$|^CONFIG_MACH_XIAOMI_SM6150=y$|^CONFIG_MACH_XIAOMI_VIOLET=y$|^CONFIG_MMC=y$|^CONFIG_MMC_SDHCI=y$|^CONFIG_MMC_SDHCI_PLTFM=y$|^CONFIG_MMC_SDHCI_MSM=y$' \
            reference/los-violet-perf_defconfig || true

      - name: Compare Joker and LOS defconfig
        run: |
          set -e

          mkdir -p artifact

          python3 - <<'PY'
          from pathlib import Path

          joker = Path("reference/joker-violet-perf_defconfig").read_text().splitlines()
          los = Path("reference/los-violet-perf_defconfig").read_text().splitlines()

          def parse(lines):
              result = {}

              for line in lines:
                  line = line.strip()

                  if line.startswith("CONFIG_") and "=" in line:
                      key = line.split("=", 1)[0]
                      result[key] = line

                  elif line.startswith("# CONFIG_") and line.endswith(" is not set"):
                      key = line[2:].split(" is not set", 1)[0]
                      result[key] = line

              return result

          j = parse(joker)
          l = parse(los)

          added = []
          removed = []
          changed = []

          for key in sorted(set(j) | set(l)):
              if key not in j:
                  added.append((key, "", l[key]))

              elif key not in l:
                  removed.append((key, j[key], ""))

              elif j[key] != l[key]:
                  changed.append((key, j[key], l[key]))

          with open("artifact/joker-vs-los-diff.txt", "w") as f:

              f.write("========================================\n")
              f.write("JOKER vs LOS VIOLET DEFCONFIG\n")
              f.write("========================================\n\n")

              f.write(f"Joker symbols: {len(j)}\n")
              f.write(f"LOS symbols:   {len(l)}\n")
              f.write(f"Added to LOS:  {len(added)}\n")
              f.write(f"Removed LOS:   {len(removed)}\n")
              f.write(f"Changed:       {len(changed)}\n\n")

              f.write("========================================\n")
              f.write("ONLY IN LOS\n")
              f.write("========================================\n")

              for key, old, new in added:
                  f.write(f"{new}\n")

              f.write("\n========================================\n")
              f.write("ONLY IN JOKER\n")
              f.write("========================================\n")

              for key, old, new in removed:
                  f.write(f"{old}\n")

              f.write("\n========================================\n")
              f.write("DIFFERENT VALUES\n")
              f.write("========================================\n")

              for key, old, new in changed:
                  f.write(f"{key}\n")
                  f.write(f"  JOKER: {old}\n")
                  f.write(f"  LOS:   {new}\n")

          print("Comparison report generated.")
          PY

      - name: Diagnose VIOLET Kconfig definition
        run: |
          set +e

          mkdir -p artifact

          {
            echo "========================================"
            echo "MACH_XIAOMI_VIOLET KCONFIG DIAGNOSIS"
            echo "========================================"
            echo

            echo "=== ALL MACH_XIAOMI_VIOLET REFERENCES ==="
            grep -R -n \
              -E \
              'MACH_XIAOMI_VIOLET' \
              arch drivers 2>/dev/null || true

            echo
            echo "=== CONFIG DEFINITION ==="

            grep -R -n \
              -B 25 \
              -A 40 \
              'config MACH_XIAOMI_VIOLET' \
              arch 2>/dev/null || true

            echo
            echo "=== XIAOMI MACHINE DEFINITIONS ==="

            grep -R -n \
              'config MACH_XIAOMI_' \
              arch/arm64 2>/dev/null || true

            echo
            echo "=== KCONFIG DEPENDENCIES ==="

            grep -R -n \
              -E \
              'depends on|select |imply ' \
              arch/arm64 2>/dev/null | \
              grep -E \
              'XIAOMI|SM6150|VIOLET|MACH_' || true

          } | tee artifact/violet-kconfig-diagnosis.txt

      - name: Verify VIOLET symbol exists
        run: |
          set +e

          echo "========================================"
          echo "VIOLET SYMBOL EXISTENCE"
          echo "========================================"

          if grep -R -q \
            -E \
            '^[[:space:]]*(config|menuconfig)[[:space:]]+MACH_XIAOMI_VIOLET([[:space:]]|$)' \
            arch drivers 2>/dev/null; then

              echo "CONFIG_MACH_XIAOMI_VIOLET definition: FOUND"

          else

              echo "CONFIG_MACH_XIAOMI_VIOLET definition: NOT FOUND"

          fi

      - name: Prepare build output
        run: |
          set -e

          rm -rf out
          mkdir -p out

      - name: Generate LOS base configuration
        run: |
          set -e

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/sdmsteppe-perf_defconfig

          test -s out/.config

          echo "========================================"
          echo "BASE CONFIGURATION"
          echo "========================================"

          grep -E \
            '^CONFIG_ARM64=|^CONFIG_ARCH_QCOM=|^CONFIG_ARCH_SM6150=|^CONFIG_MACH_XIAOMI=|^CONFIG_MACH_XIAOMI_SM6150=|^CONFIG_MACH_XIAOMI_VIOLET=' \
            out/.config || true

      - name: Extract VIOLET hardware fragment from Joker
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          source = Path("reference/joker-violet-perf_defconfig")
          output = Path("violet.config")

          prefixes = (
              "CONFIG_ARCH_QCOM",
              "CONFIG_ARCH_SM6150",
              "CONFIG_ARCH_SDMMAGPIE",
              "CONFIG_MACH_XIAOMI",
              "CONFIG_QCOM_",
              "CONFIG_MSM_",
              "CONFIG_QSEECOM",
              "CONFIG_HDCP_QSEECOM",
              "CONFIG_MMC",
              "CONFIG_SDHCI",
              "CONFIG_SCSI",
              "CONFIG_UFS",
              "CONFIG_IOMMU",
              "CONFIG_ARM_SMMU",
              "CONFIG_DMA",
              "CONFIG_DMABUF",
              "CONFIG_ION",
              "CONFIG_DRM",
              "CONFIG_FB",
              "CONFIG_MSM_KGSL",
              "CONFIG_KGSL",
              "CONFIG_MDSS",
              "CONFIG_MDP",
              "CONFIG_DSI",
              "CONFIG_USB",
              "CONFIG_USB_QCOM",
              "CONFIG_TYPEC",
              "CONFIG_PHY_",
              "CONFIG_REGULATOR",
              "CONFIG_QPNP",
              "CONFIG_SPMI",
              "CONFIG_RPM",
              "CONFIG_RPMH",
              "CONFIG_PM_",
              "CONFIG_CPUFREQ",
              "CONFIG_CPU_FREQ",
              "CONFIG_CPU_IDLE",
              "CONFIG_DEVFREQ",
              "CONFIG_THERMAL",
              "CONFIG_POWER_SUPPLY",
              "CONFIG_RTC",
              "CONFIG_INPUT",
              "CONFIG_TOUCHSCREEN",
              "CONFIG_HID",
              "CONFIG_WLAN",
              "CONFIG_BT",
              "CONFIG_RFKILL",
              "CONFIG_CFG80211",
              "CONFIG_MAC80211",
              "CONFIG_LEDS",
              "CONFIG_VIBRATOR",
              "CONFIG_NVMEM",
              "CONFIG_INTERCONNECT",
              "CONFIG_MAILBOX",
              "CONFIG_REMOTEPROC",
              "CONFIG_RPMSG",
          )

          exact = {
              "CONFIG_ARM64",
              "CONFIG_64BIT",
              "CONFIG_SMP",
          }

          result = []
          seen = set()

          for raw in source.read_text().splitlines():
              line = raw.strip()

              if not line:
                  continue

              if line.startswith("CONFIG_") and "=" in line:
                  symbol = line.split("=", 1)[0]

              elif line.startswith("# CONFIG_") and line.endswith(" is not set"):
                  symbol = line[2:].split(" is not set", 1)[0]

              else:
                  continue

              if symbol in exact or symbol.startswith(prefixes):
                  if symbol not in seen:
                      result.append(line)
                      seen.add(symbol)

          header = [
              "# VIOLET hardware fragment",
              "# Source: Joker kernel_xiaomi_violet",
              "# Branch: sixteen",
              "# Automatically filtered for LOS SM6150",
              "",
          ]

          output.write_text(
              "\n".join(header + result) + "\n"
          )

          print(f"Generated symbols: {len(result)}")
          PY

          test -s violet.config

          cp violet.config artifact/violet.config

          echo "========================================"
          echo "GENERATED VIOLET.CONFIG"
          echo "========================================"

          wc -l violet.config

      - name: Check VIOLET symbol in generated fragment
        run: |
          set -e

          echo "========================================"
          echo "VIOLET SYMBOL IN FRAGMENT"
          echo "========================================"

          grep -n \
            '^CONFIG_MACH_XIAOMI_VIOLET=' \
            violet.config || true

      - name: Merge VIOLET fragment
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          config = Path("out/.config")
          fragment = Path("violet.config")

          data = config.read_text().splitlines()

          wanted = {}

          for raw in fragment.read_text().splitlines():
              line = raw.strip()

              if not line:
                  continue

              if line.startswith("CONFIG_") and "=" in line:
                  key = line.split("=", 1)[0]
                  wanted[key] = line

              elif line.startswith("# CONFIG_") and line.endswith(" is not set"):
                  key = line[2:].split(" is not set", 1)[0]
                  wanted[key] = line

          result = []
          seen = set()

          for line in data:

              key = None

              if line.startswith("CONFIG_") and "=" in line:
                  key = line.split("=", 1)[0]

              elif line.startswith("# CONFIG_") and line.endswith(" is not set"):
                  key = line[2:].split(" is not set", 1)[0]

              if key in wanted:

                  if key not in seen:
                      result.append(wanted[key])
                      seen.add(key)

                  continue

              result.append(line)

          for key, line in wanted.items():

              if key not in seen:
                  result.append(line)

          config.write_text(
              "\n".join(result) + "\n"
          )
          PY

          echo "VIOLET fragment merged."

      - name: Check VIOLET before Kconfig resolution
        run: |
          set +e

          echo "========================================"
          echo "VIOLET BEFORE OLDDEFCONFIG"
          echo "========================================"

          grep -E \
            '^CONFIG_MACH_XIAOMI_VIOLET=|^# CONFIG_MACH_XIAOMI_VIOLET is not set' \
            out/.config || true

      - name: Resolve configuration with Kconfig
        run: |
          set -e

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          test -s out/.config

          echo "========================================"
          echo "KCONFIG RESOLUTION COMPLETE"
          echo "========================================"

      - name: Diagnose final VIOLET result
        if: always()
        run: |
          set +e

          mkdir -p artifact

          {
            echo "========================================"
            echo "FINAL VIOLET RESULT"
            echo "========================================"
            echo

            echo "=== VIOLET SYMBOL ==="

            grep -E \
              '^CONFIG_MACH_XIAOMI_VIOLET=|^# CONFIG_MACH_XIAOMI_VIOLET is not set' \
              out/.config || true

            echo
            echo "=== CORE MACHINE CONFIG ==="

            grep -E \
              '^CONFIG_ARCH_QCOM=|^CONFIG_ARCH_SM6150=|^CONFIG_ARCH_SDMMAGPIE=|^CONFIG_MACH_XIAOMI=|^CONFIG_MACH_XIAOMI_SM6150=|^CONFIG_MACH_XIAOMI_VIOLET=' \
              out/.config || true

            echo
            echo "=== MEMORY / SECURITY ==="

            grep -E \
              '^CONFIG_(CMA|DMA_CMA|DMA_SHARED_BUFFER|DMABUF|ION|QSEECOM|HDCP_QSEECOM|IOMMU|ARM_SMMU)' \
              out/.config || true

            echo
            echo "=== QCOM ==="

            grep -E \
              '^CONFIG_QCOM_(SMEM|SMEM_STATE|SMP2P|SCM|GLINK|LLCC|RPMH|RPMHPD)' \
              out/.config || true

            echo
            echo "=== MMC / STORAGE ==="

            grep -E \
              '^CONFIG_(MMC|MMC_SDHCI|MMC_SDHCI_PLTFM|MMC_SDHCI_MSM|SCSI|SCSI_UFS|SCSI_UFS_QCOM|UFS)' \
              out/.config || true

            echo
            echo "=== IOMMU ==="

            grep -E \
              '^CONFIG_(IOMMU|IOMMU_API|IOMMU_SUPPORT|ARM_SMMU|ARM_SMMU_V3|QCOM_SMMU)' \
              out/.config || true

          } | tee artifact/final-violet-diagnosis.txt

      - name: Validate final VIOLET configuration
        run: |
          set -e

          CONFIG="out/.config"

          check_enabled() {
              symbol="$1"

              if ! grep -q "^${symbol}=y$" "$CONFIG"; then
                  echo "ERROR: ${symbol} is not enabled"
                  grep -E "^${symbol}=|^# ${symbol} is not set" "$CONFIG" || true
                  exit 1
              fi

              echo "OK: ${symbol}=y"
          }

          echo "========================================"
          echo "VIOLET CONFIGURATION VALIDATION"
          echo "========================================"

          check_enabled CONFIG_ARM64
          check_enabled CONFIG_64BIT
          check_enabled CONFIG_ARCH_QCOM
          check_enabled CONFIG_ARCH_SM6150
          check_enabled CONFIG_MACH_XIAOMI
          check_enabled CONFIG_MACH_XIAOMI_SM6150
          check_enabled CONFIG_MACH_XIAOMI_VIOLET

          echo
          echo "========================================"
          echo "VIOLET VALIDATION: PASSED"
          echo "========================================"

      - name: Export final configuration
        if: always()
        run: |
          set +e

          mkdir -p artifact

          if [ -s out/.config ]; then
              cp out/.config artifact/violet_full_defconfig
          fi

          echo "========================================"
          echo "ARTIFACTS"
          echo "========================================"

          find artifact -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload VIOLET analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violet-config-analysis
          path: artifact/
          if-no-files-found: warn
