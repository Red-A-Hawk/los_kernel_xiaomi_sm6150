name: Diagnose Violet DTS Memory References

on:
workflow_dispatch:

jobs:
diagnose:
runs-on: ubuntu-22.04

steps:
  - name: Checkout kernel
    uses: actions/checkout@v4
    with:
      ref: 16
      fetch-depth: 1

  - name: Diagnose Violet memory references
    run: |
      set +e

      echo "========================================"
      echo "VIOLET DTS MEMORY REFERENCE DIAGNOSTIC"
      echo "========================================"

      SM="arch/arm64/boot/dts/qcom/sm6150.dtsi"
      VIOLET="arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150-memory.dtsi"
      DTS="arch/arm64/boot/dts/qcom/violet-sm6150.dts"

      echo
      echo "[1] disp_rdump_memory DEFINITIONS"
      echo "========================================"

      git grep -n "disp_rdump_memory:" -- \
        '*.dts' '*.dtsi' || true

      echo
      echo "[2] disp_rdump_memory REFERENCES"
      echo "========================================"

      git grep -n "&disp_rdump_memory" -- \
        '*.dts' '*.dtsi' || true

      echo
      echo "[3] DFPS DEFINITIONS / REFERENCES"
      echo "========================================"

      git grep -n "dfps_data_memory:" -- \
        '*.dts' '*.dtsi' || true

      git grep -n "&dfps_data_memory" -- \
        '*.dts' '*.dtsi' || true

      echo
      echo "[4] VIOLET INCLUDE CHAIN"
      echo "========================================"

      grep -n '#include' "$DTS" || true

      echo
      echo "[5] VIOLET MEMORY FILE"
      echo "========================================"

      nl -ba "$VIOLET" || true

      echo
      echo "[6] SM6150 MEMORY DEFINITIONS"
      echo "========================================"

      grep -n -E \
        'reserved_memory:|qseecom_mem:|cont_splash_memory:|dfps_data_memory:|linux,cma|adsp_mem:|sdsp_mem:' \
        "$SM" || true

      echo
      echo "[7] ADDRESS RANGE CHECK"
      echo "========================================"

      python3 - <<'PY'
      regions = [
          ("SM6150 cont_splash", 0x9c000000, 0x0f00000),
          ("SM6150 dfps",         0x9cf00000, 0x0100000),
          ("Violet dfps",         0x9d000000, 0x0100000),
          ("Violet disp_rdump",   0x9d100000, 0x01000000),
          ("SM6150 qseecom",      0x9e400000, 0x01400000),
      ]

      print("NAME                  START       END         SIZE")
      print("------------------------------------------------------")

      for name, start, size in regions:
          end = start + size
          print(f"{name:21} 0x{start:08x} 0x{end:08x} 0x{size:x}")

      print()
      print("OVERLAP CHECK")
      print("------------------------------------------------------")

      for i in range(len(regions)):
          n1, s1, z1 = regions[i]
          e1 = s1 + z1

          for j in range(i + 1, len(regions)):
              n2, s2, z2 = regions[j]
              e2 = s2 + z2

              if s1 < e2 and s2 < e1:
                  print(f"OVERLAP: {n1} <-> {n2}")
              else:
                  print(f"OK:      {n1} / {n2}")

      print()
      print("KEY GAP")
      print("------------------------------------------------------")

      disp_end = 0x9d100000 + 0x01000000
      qsee_start = 0x9e400000

      print(f"disp_rdump END : 0x{disp_end:08x}")
      print(f"qseecom START  : 0x{qsee_start:08x}")
      print(f"GAP            : 0x{qsee_start - disp_end:x}")
      print(f"GAP MiB        : {(qsee_start - disp_end) / 0x100000:.1f}")

      PY

      echo
      echo "[8] SUMMARY"
      echo "========================================"

      if git grep -q "disp_rdump_memory:" -- \
        arch/arm64/boot/dts/qcom/sm6150.dtsi \
        arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150-memory.dtsi; then
        echo "disp_rdump_memory: DEFINED"
      else
        echo "disp_rdump_memory: NOT DEFINED IN SM6150/VIOLET FILES"
      fi

      echo
      echo "Diagnostic complete."
      echo "========================================"
      exit 0
