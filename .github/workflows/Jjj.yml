      - name: DEBUG disp_rdump_memory
        run: |
          set +e

          echo "========================================"
          echo "DISP_RDUMP_MEMORY DEBUG"
          echo "========================================"

          echo
          echo "=== TARGET FILE ==="
          sed -n '1,100p' \
            arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150-memory.dtsi

          echo
          echo "=== ALL disp_rdump_memory REFERENCES ==="
          grep -Rni "disp_rdump_memory" \
            arch/arm64/boot/dts/qcom/ \
            --include='*.dts' \
            --include='*.dtsi' \
            2>/dev/null || true

          echo
          echo "=== ALL RDUMP REFERENCES ==="
          grep -RniE "rdump|disp.*memory|memory.*disp" \
            arch/arm64/boot/dts/qcom/ \
            --include='*.dts' \
            --include='*.dtsi' \
            2>/dev/null || true

          echo
          echo "=== VIOLET DTS INCLUDES ==="
          grep -n "#include" \
            arch/arm64/boot/dts/qcom/violet-sm6150.dts \
            2>/dev/null || true

          echo
          echo "=== VIOLET DTSI INCLUDES ==="
          grep -Rni "#include" \
            arch/arm64/boot/dts/qcom/xiaomi/violet/ \
            --include='*.dts' \
            --include='*.dtsi' \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "DEBUG COMPLETE"
          echo "========================================"
