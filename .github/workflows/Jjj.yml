name: Diagnose Violet DTS Memory

on:
workflow_dispatch:

jobs:
diagnose:
runs-on: ubuntu-22.04

steps:
  - name: Checkout kernel
    uses: actions/checkout@v4
    with:
      ref: 16
      fetch-depth: 1

  - name: Run diagnostic
    run: |
      set +e

      echo "========================================"
      echo "VIOLET DTS MEMORY DIAGNOSTIC"
      echo "========================================"

      SM="arch/arm64/boot/dts/qcom/sm6150.dtsi"
      VM="arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150-memory.dtsi"
      DTS="arch/arm64/boot/dts/qcom/violet-sm6150.dts"

      echo
      echo "[1] DTS INCLUDE CHAIN"
      echo "========================================"
      grep -n '#include' "$DTS"

      echo
      echo "[2] DISP RDUMP DEFINITIONS"
      echo "========================================"
      git grep -n 'disp_rdump_memory:' -- '*.dts' '*.dtsi'

      echo
      echo "[3] DISP RDUMP REFERENCES"
      echo "========================================"
      git grep -n '&disp_rdump_memory' -- '*.dts' '*.dtsi'

      echo
      echo "[4] DFPS DEFINITIONS"
      echo "========================================"
      git grep -n 'dfps_data_memory:' -- '*.dts' '*.dtsi'

      echo
      echo "[5] DFPS REFERENCES"
      echo "========================================"
      git grep -n '&dfps_data_memory' -- '*.dts' '*.dtsi'

      echo
      echo "[6] VIOLET MEMORY FILE"
      echo "========================================"
      nl -ba "$VM"

      echo
      echo "[7] SM6150 MEMORY NODES"
      echo "========================================"
      nl -ba "$SM" | sed -n '490,650p'

      echo
      echo "[8] ADDRESS CHECK"
      echo "========================================"

      python3 - <<'PY'
      disp_start=0x9d100000
      disp_size=0x01000000
      disp_end=disp_start+disp_size

      qsee_start=0x9e400000
      qsee_size=0x01400000
      qsee_end=qsee_start+qsee_size

      print("Violet disp_rdump:")
      print("START:", hex(disp_start))
      print("END:  ", hex(disp_end))
      print("SIZE: ", hex(disp_size))

      print()
      print("SM6150 qseecom:")
      print("START:", hex(qsee_start))
      print("END:  ", hex(qsee_end))
      print("SIZE: ", hex(qsee_size))

      print()

      if disp_start < qsee_end and qsee_start < disp_end:
          print("RESULT: OVERLAP DETECTED")
      else:
          gap=qsee_start-disp_end
          print("RESULT: NO OVERLAP")
          print("GAP:", hex(gap))
          print("GAP MiB:", gap/0x100000)
      PY

      echo
      echo "========================================"
      echo "DIAGNOSTIC COMPLETE"
      echo "========================================"
