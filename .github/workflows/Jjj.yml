name: Check Violet Memory Address Conflicts

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Scan memory address conflicts
        run: |
          set -e

          REPORT="violet_memory_conflict_report.txt"

          {
            echo "========================================"
            echo "VIOLET MEMORY ADDRESS CONFLICT SCAN"
            echo "========================================"
            echo
            echo "COMMIT: $(git rev-parse HEAD)"
            echo

            echo "========================================"
            echo "[1] TARGET ADDRESSES"
            echo "========================================"

            for addr in \
              0x9c000000 \
              0x9cf00000 \
              0x9d000000 \
              0x9d100000 \
              0x9e000000 \
              0x9e100000 \
              0x9e400000
            do
              echo
              echo "----- ADDRESS: $addr -----"

              git grep -ni "$addr" -- \
                '*.dts' '*.dtsi' || true
            done

            echo

            echo "========================================"
            echo "[2] RELEVANT MEMORY NODES"
            echo "========================================"

            git grep -niE \
              'cont_splash_region|dfps_data_region|disp_rdump_region|qseecom_region|reserved-memory|linux,cma' -- \
              '*.dts' '*.dtsi' || true

            echo

            echo "========================================"
            echo "[3] VIOLET MEMORY OVERRIDES"
            echo "========================================"

            nl -ba \
              arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150-memory.dtsi \
              | sed -n '40,70p'

            echo

            echo "========================================"
            echo "[4] SM6150 MEMORY MAP"
            echo "========================================"

            nl -ba \
              arch/arm64/boot/dts/qcom/sm6150.dtsi \
              | sed -n '580,645p'

            echo

            echo "========================================"
            echo "[5] ADDRESS RANGE CHECK"
            echo "========================================"

            echo "Expected Violet disp_rdump:"
            echo "START : 0x9d100000"
            echo "SIZE  : 0x01000000"
            echo "END   : 0x9e100000"
            echo

            echo "Existing SM6150 qseecom:"
            echo "START : 0x9e400000"
            echo "SIZE  : 0x01400000"
            echo "END   : 0x9f800000"
            echo

            echo "Gap between disp_rdump and qseecom:"
            echo "0x9e400000 - 0x9e100000 = 0x300000 (3 MiB)"
            echo

            echo "========================================"
            echo "[6] DISP RDUMP DEFINITIONS"
            echo "========================================"

            git grep -ni -E \
              'disp_rdump_memory[[:space:]]*:' -- \
              '*.dts' '*.dtsi' || true

            echo

            echo "========================================"
            echo "[7] DISP RDUMP REFERENCES"
            echo "========================================"

            git grep -ni -E \
              '&disp_rdump_memory' -- \
              '*.dts' '*.dtsi' || true

            echo

            echo "========================================"
            echo "END OF REPORT"
            echo "========================================"

          } > "$REPORT"

          cat "$REPORT"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: violet-memory-conflict-report
          path: violet_memory_conflict_report.txt
          if-no-files-found: error
