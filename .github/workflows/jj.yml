name: Diagnose Violet DTS Memory References

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Diagnose Violet memory references
        run: |
          set +e

          echo "========================================"
          echo "VIOLET DTS MEMORY REFERENCE DIAGNOSTIC"
          echo "========================================"

          FILE="arch/arm64/boot/dts/qcom/xiaomi/violet/violet-sm6150-memory.dtsi"

          echo
          echo "[1] VIOLET MEMORY FILE"
          echo "========================================"

          if [ -f "$FILE" ]; then
            echo "FOUND: $FILE"
            nl -ba "$FILE"
          else
            echo "ERROR: FILE NOT FOUND"
          fi

          echo
          echo "[2] CHECK REFERENCED LABELS"
          echo "========================================"

          for label in \
            qcom_seecom \
            qcom_smcinvoke \
            pil_modem_mem \
            pil_video_mem \
            wlan_msa_mem \
            pil_cdsp_mem \
            pil_adsp_mem \
            pil_ipa_fw_mem \
            pil_ipa_gsi_mem \
            pil_gpu_mem \
            dfps_data_memory \
            disp_rdump_memory
          do
            echo
            echo "----- $label -----"

            echo "Definitions:"
            git grep -n "${label}:" -- \
              'arch/arm64/boot/dts/qcom/*.dts' \
              'arch/arm64/boot/dts/qcom/*.dtsi' \
              'arch/arm64/boot/dts/qcom/xiaomi/*.dts' \
              'arch/arm64/boot/dts/qcom/xiaomi/*.dtsi' \
              2>/dev/null || true

            echo "References:"
            git grep -n "&${label}" -- \
              'arch/arm64/boot/dts/qcom/*.dts' \
              'arch/arm64/boot/dts/qcom/*.dtsi' \
              'arch/arm64/boot/dts/qcom/xiaomi/*.dts' \
              'arch/arm64/boot/dts/qcom/xiaomi/*.dtsi' \
              2>/dev/null || true
          done

          echo
          echo "[3] DISP RDUMP"
          echo "========================================"

          git grep -n "disp_rdump_memory" -- \
            'arch/arm64/boot/dts/qcom/*.dts' \
            'arch/arm64/boot/dts/qcom/*.dtsi' \
            2>/dev/null || true

          echo
          echo "[4] DFPS"
          echo "========================================"

          git grep -n "dfps_data_memory" -- \
            'arch/arm64/boot/dts/qcom/*.dts' \
            'arch/arm64/boot/dts/qcom/*.dtsi' \
            2>/dev/null || true

          echo
          echo "[5] MEMORY ADDRESS REFERENCES"
          echo "========================================"

          git grep -n -E \
            "0x9c000000|0x9cf00000|0x9d000000|0x9d100000|0x9e000000|0x9e400000|0x9f800000" \
            -- \
            'arch/arm64/boot/dts/qcom/*.dts' \
            'arch/arm64/boot/dts/qcom/*.dtsi' \
            2>/dev/null || true

          echo
          echo "[6] SM6150 RESERVED MEMORY"
          echo "========================================"

          SM="arch/arm64/boot/dts/qcom/sm6150.dtsi"

          if [ -f "$SM" ]; then
            nl -ba "$SM" | sed -n '490,650p'
          else
            echo "ERROR: $SM NOT FOUND"
          fi

          echo
          echo "[7] DTB BUILD CHECK"
          echo "========================================"

          if command -v dtc >/dev/null 2>&1; then
            dtc --version
          else
            echo "dtc not installed"
          fi

          echo
          echo "========================================"
          echo "DIAGNOSTIC COMPLETE"
          echo "========================================"
