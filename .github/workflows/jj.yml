name: Violet DTS Deep Memory Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install DTS tools
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y device-tree-compiler python3

      - name: Deep Violet DTS Diagnostic
        run: |
          set +e

          echo "========================================"
          echo "VIOLET DTS DEEP MEMORY DIAGNOSTIC"
          echo "========================================"
          echo

          BASE="arch/arm64/boot/dts/qcom"
          VIOLET="$BASE/xiaomi/violet"

          echo "[1] VIOLET DTS FILES"
          echo "========================================"

          find "$VIOLET" -type f \( \
            -name "*.dts" -o \
            -name "*.dtsi" \
          \) | sort

          echo
          echo "[2] VIOLET MAIN DTS CANDIDATES"
          echo "========================================"

          grep -RIl \
            "violet-sm6150-memory.dtsi\|model.*Violet\|xiaomi,violet" \
            "$VIOLET" \
            2>/dev/null | sort -u

          echo
          echo "[3] MEMORY FILE"
          echo "========================================"

          MEMORY="$VIOLET/violet-sm6150-memory.dtsi"

          if [ -f "$MEMORY" ]; then
            echo "FOUND: $MEMORY"
            nl -ba "$MEMORY"
          else
            echo "ERROR: Violet memory file not found"
          fi

          echo
          echo "[4] INCLUDE CHAIN"
          echo "========================================"

          grep -RIn \
            "#include.*violet-sm6150-memory.dtsi\|#include.*sm6150.dtsi" \
            "$BASE" \
            2>/dev/null | head -300

          echo
          echo "[5] LABEL DEFINITIONS"
          echo "========================================"

          LABELS="
          qcom_seecom
          qcom_smcinvoke
          pil_modem_mem
          pil_video_mem
          wlan_msa_mem
          pil_cdsp_mem
          pil_adsp_mem
          pil_ipa_fw_mem
          pil_ipa_gsi_mem
          pil_gpu_mem
          dfps_data_memory
          disp_rdump_memory
          "

          for label in $LABELS; do
            echo
            echo "----- $label -----"

            grep -RIn \
              "$label:" \
              "$BASE" \
              2>/dev/null | head -50

            echo "References:"
            grep -RIn \
              "&$label" \
              "$BASE/xiaomi/violet" \
              2>/dev/null | head -50
          done

          echo
          echo "[6] SM6150 ORIGINAL MEMORY DEFINITIONS"
          echo "========================================"

          SM6150="$BASE/sm6150.dtsi"

          if [ -f "$SM6150" ]; then
            grep -n -A8 -B2 \
              "pil_modem_mem:\|pil_video_mem:\|wlan_msa_mem:\|pil_cdsp_mem:\|pil_adsp_mem:\|pil_ipa_fw_mem:\|pil_ipa_gsi_mem:\|pil_gpu_mem:\|dfps_data_memory:\|disp_rdump_memory:" \
              "$SM6150" \
              2>/dev/null
          fi

          echo
          echo "[7] VIOLET MEMORY REG VALUES"
          echo "========================================"

          grep -n \
            "reg =" \
            "$MEMORY" \
            2>/dev/null

          echo
          echo "[8] ALL RELEVANT MEMORY ADDRESSES"
          echo "========================================"

          grep -RIn \
            -E "reg = <.*0x(8b|92|93|95|97|9c|9d|a1)" \
            "$BASE" \
            2>/dev/null | head -500

          echo
          echo "[9] RESERVED MEMORY DEFINITIONS"
          echo "========================================"

          grep -RIn \
            -E "reserved-memory:|reserved-memory \{|@0x|@8|@9|@a" \
            "$VIOLET" \
            2>/dev/null | head -500

          echo
          echo "[10] MEMORY OVERLAP ANALYSIS"
          echo "========================================"

          python3 <<'PY'
          import os
          import re

          root = "arch/arm64/boot/dts/qcom/xiaomi/violet"

          regions = []

          for dirpath, _, filenames in os.walk(root):
              for filename in filenames:
                  if not filename.endswith((".dts", ".dtsi")):
                      continue

                  path = os.path.join(dirpath, filename)

                  try:
                      data = open(path, "r", errors="ignore").read()
                  except:
                      continue

                  lines = data.splitlines()

                  current = None

                  for i, line in enumerate(lines, 1):

                      node = re.search(
                          r'([A-Za-z0-9_,.@+-]+)\s*\{',
                          line
                      )

                      if node:
                          current = node.group(1)

                      reg = re.search(
                          r'reg\s*=\s*<\s*'
                          r'(0x[0-9a-fA-F]+|\d+)\s+'
                          r'(0x[0-9a-fA-F]+|\d+)\s+'
                          r'(0x[0-9a-fA-F]+|\d+)\s+'
                          r'(0x[0-9a-fA-F]+|\d+)',
                          line
                      )

                      if not reg:
                          continue

                      try:
                          hi = int(reg.group(1), 0)
                          lo = int(reg.group(2), 0)
                          shi = int(reg.group(3), 0)
                          slo = int(reg.group(4), 0)

                          start = (hi << 32) | lo
                          size = (shi << 32) | slo
                          end = start + size

                          regions.append(
                              (start, end, size, path, i, current)
                          )
                      except:
                          pass

          regions.sort()

          print("Detected regions:")
          print()

          for start, end, size, path, line, node in regions:
              print(
                  f"0x{start:016x} - "
                  f"0x{end:016x} "
                  f"size=0x{size:x} "
                  f"{path}:{line} "
                  f"{node}"
              )

          print()
          print("Possible overlaps:")
          print()

          found = False

          for i in range(len(regions)):
              a = regions[i]

              for j in range(i + 1, len(regions)):
                  b = regions[j]

                  if b[0] >= a[1]:
                      break

                  if a[0] < b[1] and b[0] < a[1]:
                      found = True

                      print(
                          "OVERLAP:"
                      )

                      print(
                          f"  A: 0x{a[0]:x}-0x{a[1]:x} "
                          f"{a[3]}:{a[4]} {a[5]}"
                      )

                      print(
                          f"  B: 0x{b[0]:x}-0x{b[1]:x} "
                          f"{b[3]}:{b[4]} {b[5]}"
                      )

          if not found:
              print("NO OVERLAPS DETECTED IN VIOLET DTS FILES")
          PY

          echo
          echo "[11] CHECK VIOLET OVERRIDES"
          echo "========================================"

          for label in $LABELS; do
            echo
            echo "----- $label -----"

            grep -RIn \
              "^&$label" \
              "$VIOLET" \
              2>/dev/null
          done

          echo
          echo "[12] DISP RDUMP COMPARISON"
          echo "========================================"

          echo "SM6150:"
          grep -n -A5 -B2 \
            "disp_rdump_memory:" \
            "$SM6150" \
            2>/dev/null

          echo
          echo "VIOLET:"
          grep -n -A5 -B2 \
            "&disp_rdump_memory" \
            "$MEMORY" \
            2>/dev/null

          echo
          echo "[13] DFPS COMPARISON"
          echo "========================================"

          echo "SM6150:"
          grep -n -A5 -B2 \
            "dfps_data_memory:" \
            "$SM6150" \
            2>/dev/null

          echo
          echo "VIOLET:"
          grep -n -A5 -B2 \
            "&dfps_data_memory" \
            "$MEMORY" \
            2>/dev/null

          echo
          echo "[14] DTS COMPILER VERSION"
          echo "========================================"

          dtc --version

          echo
          echo "[15] DTS SYNTAX CHECK"
          echo "========================================"

          mkdir -p /tmp/violet-dts-check

          MAIN_DTS=""

          for f in \
            "$VIOLET"/*.dts \
            "$BASE"/xiaomi/*.dts
          do
            [ -f "$f" ] || continue

            if grep -q \
              "violet-sm6150-memory.dtsi" \
              "$f" 2>/dev/null; then

              MAIN_DTS="$f"
              break
            fi
          done

          if [ -n "$MAIN_DTS" ]; then

            echo "Candidate DTS:"
            echo "$MAIN_DTS"
            echo

            dtc \
              -I dts \
              -O dtb \
              -o /tmp/violet-dts-check/violet.dtb \
              "$MAIN_DTS" \
              2>&1 | tee \
              /tmp/violet-dts-check/dtc.log

            DTC_STATUS=${PIPESTATUS[0]}

            echo
            echo "DTC EXIT STATUS: $DTC_STATUS"

            if [ "$DTC_STATUS" -eq 0 ]; then
              echo "DTC RESULT: SUCCESS"
            else
              echo "DTC RESULT: FAILED"
              echo "This is important."
            fi

          else
            echo "WARNING: Could not automatically identify main Violet DTS."
            echo "DTC compilation skipped."
          fi

          echo
          echo "[16] FINAL DIAGNOSTIC SUMMARY"
          echo "========================================"

          echo
          echo "Violet memory file:"
          [ -f "$MEMORY" ] && echo "FOUND" || echo "MISSING"

          echo
          echo "SM6150 DTS:"
          [ -f "$SM6150" ] && echo "FOUND" || echo "MISSING"

          echo
          echo "Required labels:"

          for label in $LABELS; do
            if grep -Rqs \
              "$label:" \
              "$BASE" \
              2>/dev/null; then
              echo "OK      $label"
            else
              echo "MISSING $label"
            fi
          done

          echo
          echo "========================================"
          echo "DIAGNOSTIC COMPLETE"
          echo "========================================"

          exit 0

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violet-dts-deep-memory-diagnostic
          path: |
            arch/arm64/boot/dts/qcom/xiaomi/violet/*.dts
            arch/arm64/boot/dts/qcom/xiaomi/violet/*.dtsi
            /tmp/violet-dts-check/
          if-no-files-found: warn
          retention-days: 7
