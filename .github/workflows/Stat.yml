name: Generate Violet Defconfigs

on:
  workflow_dispatch:

jobs:
  generate-defconfig:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Base
          - KSU
          - KSU-NoMount
          - KSU-SUSFS
          - KSU-SUSFS-NoMount

    steps:

    # ============================================================
    # 1. CHECKOUT
    # ============================================================
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: 16
        fetch-depth: 1

    # ============================================================
    # 2. DEPENDENCIES
    # ============================================================
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git \
          bc \
          bison \
          flex \
          libssl-dev \
          make \
          zip \
          unzip \
          curl \
          wget \
          libelf-dev \
          libncurses-dev \
          python3 \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi

    # ============================================================
    # 3. TOOLCHAINS
    # ============================================================
    - name: Clone Toolchains
      run: |
        mkdir -p clang
        cd clang

        wget -q \
          https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20230725-release/Clang-17.0.0-20230725.tar.gz

        tar -xzf Clang-17.0.0-20230725.tar.gz
        rm -f Clang-17.0.0-20230725.tar.gz

        cd ..

        git clone \
          --depth=1 \
          -b main \
          https://github.com/greenforce-project/gcc-arm64 \
          gcc64

        git clone \
          --depth=1 \
          -b main \
          https://github.com/greenforce-project/gcc-arm \
          gcc32

    # ============================================================
    # 4. ENVIRONMENT
    # ============================================================
    - name: Setup environment
      run: |
        echo "BUILD_TIME=$(date '+%d%m%Y-%H%M')" >> "$GITHUB_ENV"

        echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> "$GITHUB_ENV"
        echo "GCC64_PATH=$GITHUB_WORKSPACE/gcc64" >> "$GITHUB_ENV"
        echo "GCC32_PATH=$GITHUB_WORKSPACE/gcc32" >> "$GITHUB_ENV"

    # ============================================================
    # 5. TOOLCHAIN CHECK
    # ============================================================
    - name: Verify toolchains
      run: |
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo "=== CLANG ==="
        clang --version

        echo
        echo "=== LLD ==="
        ld.lld --version

        echo
        echo "=== GCC64 ==="
        ls -la "$GCC64_PATH/bin" | head

        echo
        echo "=== GCC32 ==="
        ls -la "$GCC32_PATH/bin" | head

    # ============================================================
    # 6. NOMOUNT
    # Must be installed before defconfig
    # ============================================================
    - name: Setup NoMount
      if: ${{ matrix.build_type == 'KSU-NoMount' || matrix.build_type == 'KSU-SUSFS-NoMount' }}
      run: |
        curl -LSs \
          https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh \
          | bash -

    # ============================================================
    # 7. KERNELSU-NEXT
    # Must be installed before defconfig
    # ============================================================
    - name: Setup KernelSU-Next
      if: ${{ matrix.build_type != 'Base' }}
      run: |
        curl -LSs \
          "https://raw.githubusercontent.com/manipvlator/KernelSU-Next/stable/kernel/setup.sh" \
          | bash -s syscall

    # ============================================================
    # 8. LOAD ORIGINAL DEFCONFIG
    # ============================================================
    - name: Load violet-perf_defconfig
      run: |
        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        make \
          O=out \
          ARCH=arm64 \
          vendor/violet-perf_defconfig

        echo
        echo "Original defconfig loaded."

    # ============================================================
    # 9. CONFIGURE MATRIX
    # ============================================================
    - name: Configure ${{ matrix.build_type }}
      run: |
        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        CONFIG="out/.config"

        echo "========================================"
        echo "BUILD TYPE: ${{ matrix.build_type }}"
        echo "========================================"

        # --------------------------------------------------------
        # Function to safely set a CONFIG option
        # --------------------------------------------------------
        set_config() {
          SYMBOL="$1"
          VALUE="$2"

          if grep -q "^${SYMBOL}=" "$CONFIG"; then
            sed -i "s/^${SYMBOL}=.*/${SYMBOL}=${VALUE}/" "$CONFIG"
          elif grep -q "^# ${SYMBOL} is not set" "$CONFIG"; then
            sed -i "s/^# ${SYMBOL} is not set/${SYMBOL}=${VALUE}/" "$CONFIG"
          else
            echo "${SYMBOL}=${VALUE}" >> "$CONFIG"
          fi
        }

        # --------------------------------------------------------
        # Disable helper
        # --------------------------------------------------------
        disable_config() {
          SYMBOL="$1"

          if grep -q "^${SYMBOL}=" "$CONFIG"; then
            sed -i "s/^${SYMBOL}=.*/# ${SYMBOL} is not set/" "$CONFIG"
          elif ! grep -q "^# ${SYMBOL} is not set" "$CONFIG"; then
            echo "# ${SYMBOL} is not set" >> "$CONFIG"
          fi
        }

        case "${{ matrix.build_type }}" in

          Base)

            echo "Using original violet-perf_defconfig."

            ;;

          KSU)

            set_config CONFIG_KSU y
            set_config CONFIG_KSU_EXTRAS y
            set_config CONFIG_KSU_TAMPER_SYSCALL_TABLE y
            set_config CONFIG_KSU_LSM_SECURITY_HOOKS y
            set_config CONFIG_KSU_FEATURE_SULOG y
            set_config CONFIG_KSU_FEATURE_ADBROOT y
            set_config CONFIG_KSU_HEURISTIC_IN_TREE_BUILD y

            disable_config CONFIG_KPROBES

            ;;

          KSU-NoMount)

            set_config CONFIG_KSU y
            set_config CONFIG_KSU_EXTRAS y
            set_config CONFIG_KSU_TAMPER_SYSCALL_TABLE y
            set_config CONFIG_KSU_LSM_SECURITY_HOOKS y
            set_config CONFIG_KSU_FEATURE_SULOG y
            set_config CONFIG_KSU_FEATURE_ADBROOT y
            set_config CONFIG_KSU_HEURISTIC_IN_TREE_BUILD y

            set_config CONFIG_NOMOUNT y

            disable_config CONFIG_KPROBES

            ;;

          KSU-SUSFS)

            set_config CONFIG_KSU y
            set_config CONFIG_KSU_EXTRAS y
            set_config CONFIG_KSU_TAMPER_SYSCALL_TABLE y
            set_config CONFIG_KSU_LSM_SECURITY_HOOKS y
            set_config CONFIG_KSU_FEATURE_SULOG y
            set_config CONFIG_KSU_FEATURE_ADBROOT y
            set_config CONFIG_KSU_HEURISTIC_IN_TREE_BUILD y

            set_config CONFIG_KSU_SUSFS y
            set_config CONFIG_KSU_SUSFS_SUS_PATH y
            set_config CONFIG_KSU_SUSFS_SUS_MOUNT y
            set_config CONFIG_KSU_SUSFS_SUS_KSTAT y
            set_config CONFIG_KSU_SUSFS_TRY_UMOUNT y
            set_config CONFIG_KSU_SUSFS_SPOOF_UNAME y
            set_config CONFIG_KSU_SUSFS_ENABLE_LOG y
            set_config CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS y
            set_config CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG y
            set_config CONFIG_KSU_SUSFS_OPEN_REDIRECT y
            set_config CONFIG_KSU_SUSFS_SUS_MAP y

            disable_config CONFIG_KPROBES

            ;;

          KSU-SUSFS-NoMount)

            set_config CONFIG_KSU y
            set_config CONFIG_KSU_EXTRAS y
            set_config CONFIG_KSU_TAMPER_SYSCALL_TABLE y
            set_config CONFIG_KSU_LSM_SECURITY_HOOKS y
            set_config CONFIG_KSU_FEATURE_SULOG y
            set_config CONFIG_KSU_FEATURE_ADBROOT y
            set_config CONFIG_KSU_HEURISTIC_IN_TREE_BUILD y

            set_config CONFIG_KSU_SUSFS y
            set_config CONFIG_KSU_SUSFS_SUS_PATH y
            set_config CONFIG_KSU_SUSFS_SUS_MOUNT y
            set_config CONFIG_KSU_SUSFS_SUS_KSTAT y
            set_config CONFIG_KSU_SUSFS_TRY_UMOUNT y
            set_config CONFIG_KSU_SUSFS_SPOOF_UNAME y
            set_config CONFIG_KSU_SUSFS_ENABLE_LOG y
            set_config CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS y
            set_config CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG y
            set_config CONFIG_KSU_SUSFS_OPEN_REDIRECT y
            set_config CONFIG_KSU_SUSFS_SUS_MAP y

            set_config CONFIG_NOMOUNT y

            disable_config CONFIG_KPROBES

            ;;

        esac

        # --------------------------------------------------------
        # Let Kconfig resolve dependencies
        # --------------------------------------------------------
        make \
          O=out \
          ARCH=arm64 \
          olddefconfig

        echo
        echo "========================================"
        echo "FINAL CONFIG"
        echo "========================================"

        grep -E \
          '^(CONFIG_KSU=|CONFIG_KSU_|CONFIG_NOMOUNT=|CONFIG_KPROBES=)' \
          out/.config || true

    # ============================================================
    # 10. SAVE DEFCONFIG
    # ============================================================
    - name: Generate final defconfig
      run: |
        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        mkdir -p defconfigs

        make \
          O=out \
          ARCH=arm64 \
          savedefconfig

        cp \
          out/defconfig \
          "defconfigs/violet-${{ matrix.build_type }}_defconfig"

        echo
        echo "========================================"
        echo "DEFCONFIG CREATED"
        echo "========================================"

        ls -lh \
          "defconfigs/violet-${{ matrix.build_type }}_defconfig"

        echo
        echo "=== KSU / SUSFS / NOMOUNT ==="

        grep -E \
          '^(CONFIG_KSU=|CONFIG_KSU_|CONFIG_NOMOUNT=)' \
          "defconfigs/violet-${{ matrix.build_type }}_defconfig" || true

    # ============================================================
    # 11. UPLOAD DEFCONFIG
    # ============================================================
    - name: Upload defconfig
      uses: actions/upload-artifact@v4
      with:
        name: violet-${{ matrix.build_type }}-defconfig-${{ env.BUILD_TIME }}
        path: defconfigs/violet-${{ matrix.build_type }}_defconfig
