name: Build Kernel (violet)

on:
  push:
    branches:
      - 16
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Base
          - KSU
          - KSU-NoMount
          - KSU-SUSFS
          - KSU-SUSFS-NoMount

    steps:

    # 1. Checkout kernel source
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: 16
        fetch-depth: 1

    # 2. Install dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          make zip unzip curl wget \
          libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          python3 \
          openjdk-17-jre-headless

    # 3. Clone toolchains
    - name: Clone Toolchains
      run: |
        mkdir -p clang
        cd clang

        wget https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20230725-release/Clang-17.0.0-20230725.tar.gz

        tar -xzf Clang-17.0.0-20230725.tar.gz
        rm Clang-17.0.0-20230725.tar.gz

        cd ..

        git clone \
          https://github.com/greenforce-project/gcc-arm64 \
          -b main \
          --depth=1 \
          gcc64

        git clone \
          https://github.com/greenforce-project/gcc-arm \
          -b main \
          --depth=1 \
          gcc32

    # 4. Setup environment
    - name: Setup Environment
      run: |
        echo "BUILD_TIME=$(TZ=Asia/Jakarta date '+%d%m%Y-%H%M')" >> $GITHUB_ENV

        echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> $GITHUB_ENV
        echo "GCC64_PATH=$GITHUB_WORKSPACE/gcc64" >> $GITHUB_ENV
        echo "GCC32_PATH=$GITHUB_WORKSPACE/gcc32" >> $GITHUB_ENV

    # 5. Verify toolchains
    - name: Verify toolchains
      run: |
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo "========================================"
        echo "CLANG"
        echo "========================================"

        which clang
        clang --version

        echo
        echo "========================================"
        echo "LLD"
        echo "========================================"

        which ld.lld
        ld.lld --version

        echo
        echo "========================================"
        echo "GCC64"
        echo "========================================"

        ls -la "$GCC64_PATH/bin"

        echo
        echo "========================================"
        echo "GCC32"
        echo "========================================"

        ls -la "$GCC32_PATH/bin"

    # 6. Setup NoMount
    # Must happen BEFORE KernelSU and BEFORE defconfig
    - name: Setup NoMount
      if: ${{ matrix.build_type == 'KSU-NoMount' || matrix.build_type == 'KSU-SUSFS-NoMount' }}
      run: |
        echo "========================================"
        echo "SETTING UP NOMOUNT"
        echo "========================================"

        curl -LSs \
          "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" \
          | bash -

    # 7. Setup KernelSU-Next
    # Must happen BEFORE defconfig
    - name: Setup KernelSU-Next
      if: ${{ matrix.build_type != 'Base' }}
      run: |
        echo "========================================"
        echo "SETTING UP KERNELSU-NEXT"
        echo "========================================"

        curl -LSs \
          "https://raw.githubusercontent.com/manipvlator/KernelSU-Next/stable/kernel/setup.sh" \
          | bash -s syscall

    # 8. Show source tree status
    - name: Verify Kernel Integrations
      if: ${{ matrix.build_type != 'Base' }}
      run: |
        echo "========================================"
        echo "KERNEL INTEGRATION CHECK"
        echo "========================================"

        echo
        echo "KernelSU:"
        ls -ld drivers/kernelsu 2>/dev/null || true

        echo
        echo "NoMount:"
        ls -ld fs/nomount 2>/dev/null || true

        echo
        echo "drivers/Makefile:"
        grep -n "kernelsu" drivers/Makefile 2>/dev/null || true

        echo
        echo "drivers/Kconfig:"
        grep -n "kernelsu" drivers/Kconfig 2>/dev/null || true

        echo
        echo "fs/Makefile:"
        grep -n "nomount" fs/Makefile 2>/dev/null || true

        echo
        echo "fs/Kconfig:"
        grep -n "nomount" fs/Kconfig 2>/dev/null || true

    # 9. Load original violet defconfig
    - name: Load Original violet-perf defconfig
      run: |
        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo "========================================"
        echo "LOADING ORIGINAL DEFCONFIG"
        echo "========================================"

        make O=out \
          ARCH=arm64 \
          vendor/violet-perf_defconfig

    # 10. Configure Matrix
    - name: Configure Matrix
      run: |
        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo "========================================"
        echo "CONFIGURING MATRIX"
        echo "BUILD TYPE: ${{ matrix.build_type }}"
        echo "========================================"

        case "${{ matrix.build_type }}" in

          Base)

            echo "Base kernel"
            echo "No KernelSU"
            echo "No SUSFS"
            echo "No NoMount"

            DEFCONFIG_NAME="violet-perf_defconfig"

            ;;

          KSU)

            echo "KernelSU-Next"

            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE \
              --disable CONFIG_KPROBES

            DEFCONFIG_NAME="violet-ksu_defconfig"

            ;;

          KSU-NoMount)

            echo "KernelSU-Next + NoMount"

            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE \
              --enable CONFIG_NOMOUNT \
              --disable CONFIG_KPROBES

            DEFCONFIG_NAME="violet-ksu-nomount_defconfig"

            ;;

          KSU-SUSFS)

            echo "KernelSU-Next + SUSFS"

            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE \
              --enable CONFIG_KSU_SUSFS \
              --disable CONFIG_KPROBES

            DEFCONFIG_NAME="violet-ksu-susfs_defconfig"

            ;;

          KSU-SUSFS-NoMount)

            echo "KernelSU-Next + SUSFS + NoMount"

            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE \
              --enable CONFIG_KSU_SUSFS \
              --enable CONFIG_NOMOUNT \
              --disable CONFIG_KPROBES

            DEFCONFIG_NAME="violet-ksu-susfs-nomount_defconfig"

            ;;

        esac

        echo
        echo "Running olddefconfig..."

        make O=out \
          ARCH=arm64 \
          olddefconfig

        echo
        echo "========================================"
        echo "FINAL CONFIG"
        echo "========================================"

        grep -E \
          '^(CONFIG_KSU=|CONFIG_KSU_|CONFIG_NOMOUNT=|CONFIG_KPROBES=)' \
          out/.config || true

        echo
        echo "========================================"
        echo "CREATING DEFCONFIG"
        echo "========================================"

        make O=out \
          ARCH=arm64 \
          savedefconfig

        cp out/defconfig \
          "out/${DEFCONFIG_NAME}"

        echo
        echo "Generated:"
        ls -lh "out/${DEFCONFIG_NAME}"

        echo
        echo "========================================"
        echo "DEFCONFIG CONTENT"
        echo "========================================"

        cat "out/${DEFCONFIG_NAME}"

    # 11. Clean stray source-tree generated config
    # Prevents:
    # ".. is not clean, please run 'make mrproper'"
    - name: Clean stray source config
      run: |
        echo "========================================"
        echo "CLEANING SOURCE TREE"
        echo "========================================"

        rm -f .config

        if [ -d include/config ]; then
          rm -rf include/config
        fi

        echo "Source-tree cleanup complete."

    # 12. Build kernel
    - name: Build Kernel
      run: |
        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        export KBUILD_BUILD_USER=Manipulator
        export KBUILD_BUILD_HOST=LineageOS
        export KBUILD_COMPILER_STRING="$CLANG_PATH/clang"

        echo "========================================"
        echo "BUILDING KERNEL"
        echo "TYPE: ${{ matrix.build_type }}"
        echo "========================================"

        make -j$(nproc --all) \
          O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang \
          CLANG_TRIPLE=$CLANG_PATH/aarch64-linux-gnu- \
          CROSS_COMPILE=$GCC64_PATH/bin/aarch64-elf- \
          CROSS_COMPILE_ARM32=$GCC32_PATH/bin/arm-eabi- \
          2>&1 | tee build.log

    # 13. Verify kernel output
    - name: Check Build Output
      run: |
        echo "========================================"
        echo "CHECKING BUILD"
        echo "========================================"

        test -f out/arch/arm64/boot/Image.gz

        echo
        echo "BUILD SUCCESS"
        echo "TYPE: ${{ matrix.build_type }}"

        ls -lh out/arch/arm64/boot/Image.gz

    # 14. Package AnyKernel3
    - name: Package AnyKernel3
      run: |
        echo "========================================"
        echo "PACKAGING ANYKERNEL3"
        echo "========================================"

        git clone \
          --depth=1 \
          -b sixteen \
          https://github.com/Joker-V2/AnyKernel3.git \
          AK3

        cp out/arch/arm64/boot/Image.gz AK3/

        if [ -f out/arch/arm64/boot/dtbo.img ]; then
          cp out/arch/arm64/boot/dtbo.img AK3/
        fi

        cd AK3

        zip -r9 \
          "../Kernel-violet-${{ matrix.build_type }}-${BUILD_TIME}.zip" \
          *

        cd ..

        ls -lh \
          "Kernel-violet-${{ matrix.build_type }}-${BUILD_TIME}.zip"

    # 15. Upload Kernel ZIP
    - name: Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-violet-${{ matrix.build_type }}-${{ env.BUILD_TIME }}
        path: Kernel-violet-${{ matrix.build_type }}-${{ env.BUILD_TIME }}.zip

    # 16. Upload generated defconfig
    - name: Upload Generated Defconfig
      uses: actions/upload-artifact@v4
      with:
        name: defconfig-${{ matrix.build_type }}-${{ env.BUILD_TIME }}
        path: |
          out/*defconfig

    # 17. Upload full .config
    - name: Upload Full Config
      uses: actions/upload-artifact@v4
      with:
        name: full-config-${{ matrix.build_type }}-${{ env.BUILD_TIME }}
        path: out/.config

    # 18. Upload build log
    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ matrix.build_type }}-${{ env.BUILD_TIME }}
        path: build.log
