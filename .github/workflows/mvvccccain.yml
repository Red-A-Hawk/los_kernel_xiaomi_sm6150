name: Extract Real Clang PGO PROCS V1

on:
  workflow_dispatch:

jobs:
  extract-pgo-patch:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT KERNEL
      # ============================================================
      - name: Checkout Kernel Branch 16
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      # ============================================================
      # 2. DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl

      # ============================================================
      # 3. CLEAN TREE
      # ============================================================
      - name: Clean Working Tree
        run: |
          git reset --hard HEAD
          git clean -fdx

      # ============================================================
      # 4. DOWNLOAD ORIGINAL PGO PATCH (NEW URL)
      # ============================================================
      - name: Download Original PGO Patch
        run: |
          PATCH="$RUNNER_TEMP/original-pgo.patch"

          curl -L \
            "https://raw.githubusercontent.com/Red-A-Hawk/Patch/e22214b40cf651583c9f1595f65d28dd326c8c90/0001-ARM64-Clang-PGO-4.14-RedHawk-final2.patch" \
            -o "$PATCH"

          echo "PATCH=$PATCH" >> "$GITHUB_ENV"

          echo "============================================================"
          echo "PATCH"
          echo "============================================================"

          ls -lh "$PATCH"

          echo
          echo "Lines:"
          wc -l "$PATCH"

          echo
          echo "PGO sections:"
          grep -n "diff --git a/kernel/pgo/" "$PATCH"

      # ============================================================
      # 5. EXTRACT NEW PGO FILES
      # ============================================================
      - name: Extract New PGO Files
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "EXTRACT NEW PGO FILES"
          echo "============================================================"

          extract_new_file() {
              local file="$1"
              local output="$GITHUB_WORKSPACE/$file"
              local marker="diff --git a/$file b/$file"

              echo
              echo "------------------------------------------------------------"
              echo "FILE: $file"
              echo "------------------------------------------------------------"

              mkdir -p "$(dirname "$output")"

              awk -v m="$marker" '
                  $0 == m {
                      in_diff=1
                      in_hunk=0
                      next
                  }

                  in_diff && /^diff --git / {
                      exit
                  }

                  in_diff && /^@@ / {
                      in_hunk=1
                      next
                  }

                  in_hunk && /^\+/ {
                      print substr($0, 2)
                  }
              ' "$PATCH" > "$output"

              if [ ! -s "$output" ]; then
                  echo "[ERROR] Failed to extract $file"
                  echo
                  echo "Searching patch:"
                  grep -nF "$marker" "$PATCH" || true
                  exit 1
              fi

              echo "[OK] Extracted $file"
              echo "Lines: $(wc -l < "$output")"

              echo
              echo "First lines:"
              sed -n '1,12p' "$output"
          }

          extract_new_file "kernel/pgo/Kconfig"
          extract_new_file "kernel/pgo/Makefile"
          extract_new_file "kernel/pgo/fs.c"
          extract_new_file "kernel/pgo/instrument.c"
          extract_new_file "kernel/pgo/pgo.h"

      # ============================================================
      # 6. REMOVE CC_IS_CLANG DEPENDENCY
      # ============================================================
      - name: Remove CC_IS_CLANG Dependency
        run: |
          set -e

          FILE="kernel/pgo/Kconfig"

          echo "============================================================"
          echo "REMOVE CC_IS_CLANG"
          echo "============================================================"

          grep -n "CC_IS_CLANG" "$FILE" || true

          sed -i '/^[[:space:]]*depends on CC_IS_CLANG[[:space:]]*$/d' "$FILE"

          echo
          echo "After modification:"
          grep -n "depends on" "$FILE" || true

          if grep -q "CC_IS_CLANG" "$FILE"; then
              echo "[ERROR] CC_IS_CLANG still exists"
              exit 1
          fi

      # ============================================================
      # 7. arch/Kconfig
      # ============================================================
      - name: Modify arch Kconfig
        run: |
          set -e

          FILE="arch/Kconfig"

          echo "============================================================"
          echo "MODIFY arch/Kconfig"
          echo "============================================================"

          if grep -q 'source "kernel/pgo/Kconfig"' "$FILE"; then
              echo "[OK] Already present"
          else
              sed -i \
                '/source "kernel\/gcov\/Kconfig"/a source "kernel/pgo/Kconfig"' \
                "$FILE"
          fi

          grep -n -A2 -B2 'kernel/pgo/Kconfig' "$FILE"

      # ============================================================
      # 8. arch/arm64/Kconfig
      # ============================================================
      - name: Modify arm64 Kconfig
        run: |
          set -e

          FILE="arch/arm64/Kconfig"

          echo "============================================================"
          echo "MODIFY arch/arm64/Kconfig"
          echo "============================================================"

          if grep -q 'select ARCH_SUPPORTS_PGO_CLANG' "$FILE"; then
              echo "[OK] Already present"
          else
              sed -i \
                '/select ARCH_SUPPORTS_THINLTO/a\  select ARCH_SUPPORTS_PGO_CLANG' \
                "$FILE"
          fi

          grep -n -A3 -B3 'ARCH_SUPPORTS_PGO_CLANG' "$FILE"

      # ============================================================
      # 9. DEFCONFIG
      # ============================================================
      - name: Modify Violet Defconfig
        run: |
          set -e

          FILE="arch/arm64/configs/vendor/violet-perf_defconfig"

          echo "============================================================"
          echo "MODIFY DEFCONFIG"
          echo "============================================================"

          if grep -q '^CONFIG_DEBUG_FS=y$' "$FILE"; then
              echo "[OK] CONFIG_DEBUG_FS already enabled"
          elif grep -q '^# CONFIG_DEBUG_FS is not set$' "$FILE"; then
              sed -i \
                's/^# CONFIG_DEBUG_FS is not set$/CONFIG_DEBUG_FS=y/' \
                "$FILE"
          else
              echo "CONFIG_DEBUG_FS=y" >> "$FILE"
          fi

          grep -n 'CONFIG_DEBUG_FS' "$FILE"

      # ============================================================
      # 10. VDSO
      # ============================================================
      - name: Modify VDSO Makefile
        run: |
          set -e

          FILE="arch/arm64/kernel/vdso/Makefile"

          echo "============================================================"
          echo "MODIFY VDSO MAKEFILE"
          echo "============================================================"

          if grep -q '^PGO_PROFILE := n$' "$FILE"; then
              echo "[OK] Already present"
          else
              sed -i \
                '/^GCOV_PROFILE := n$/a PGO_PROFILE := n' \
                "$FILE"
          fi

          grep -n -A2 -B2 'PGO_PROFILE' "$FILE"

      # ============================================================
      # 11. LINKER HEADER
      # ============================================================
      - name: Modify vmlinux.lds.h
        run: |
          set -e

          FILE="include/asm-generic/vmlinux.lds.h"

          echo "============================================================"
          echo "MODIFY vmlinux.lds.h"
          echo "============================================================"

          if grep -q '^#define PGO_CLANG_DATA' "$FILE"; then
              echo "[OK] PGO linker macro already exists"
          else
              awk '
          BEGIN {
              in_bug_table = 0
              inserted = 0
          }

          /^#ifdef CONFIG_GENERIC_BUG$/ && !inserted {
              in_bug_table = 1
          }

          {
              print
          }

          in_bug_table && /^#endif$/ && !inserted {
              print ""
              print "#ifdef CONFIG_PGO_CLANG"
              print "#define PGO_CLANG_DATA \\"
              print "  __llvm_prf_data : AT(ADDR(__llvm_prf_data) - LOAD_OFFSET) { \\"
              print "    VMLINUX_SYMBOL(__llvm_prf_data_start) = .; \\"
              print "    *(__llvm_prf_data) \\"
              print "    VMLINUX_SYMBOL(__llvm_prf_data_end) = .; \\"
              print "  } \\"
              print "  __llvm_prf_cnts : AT(ADDR(__llvm_prf_cnts) - LOAD_OFFSET) { \\"
              print "    VMLINUX_SYMBOL(__llvm_prf_cnts_start) = .; \\"
              print "    *(__llvm_prf_cnts) \\"
              print "    VMLINUX_SYMBOL(__llvm_prf_cnts_end) = .; \\"
              print "  } \\"
              print "  __llvm_prf_names : AT(ADDR(__llvm_prf_names) - LOAD_OFFSET) { \\"
              print "    VMLINUX_SYMBOL(__llvm_prf_names_start) = .; \\"
              print "    *(__llvm_prf_names) \\"
              print "    VMLINUX_SYMBOL(__llvm_prf_names_end) = .; \\"
              print "  } \\"
              print "  __llvm_prf_vals : AT(ADDR(__llvm_prf_vals) - LOAD_OFFSET) { \\"
              print "    VMLINUX_SYMBOL(__llvm_prf_vals_start) = .; \\"
              print "    *(__llvm_prf_vals) \\"
              print "    VMLINUX_SYMBOL(__llvm_prf_vals_end) = .; \\"
              print "  } \\"
              print "  __llvm_prf_vnds : AT(ADDR(__llvm_prf_vnds) - LOAD_OFFSET) { \\"
              print "    VMLINUX_SYMBOL(__llvm_prf_vnds_start) = .; \\"
              print "    *(__llvm_prf_vnds) \\"
              print "    VMLINUX_SYMBOL(__llvm_prf_vnds_end) = .; \\"
              print "  }"
              print "#else"
              print "#define PGO_CLANG_DATA"
              print "#endif"

              in_bug_table = 0
              inserted = 1
          }
          ' "$FILE" > "$FILE.tmp"

          mv "$FILE.tmp" "$FILE"

          if ! grep -q '^#define PGO_CLANG_DATA' "$FILE"; then
              echo "[ERROR] PGO_CLANG_DATA was not inserted"
              exit 1
          fi

          echo "[OK] PGO linker macro inserted"
          fi

      # ============================================================
      # 12. INSERT PGO_CLANG_DATA INTO RW_DATA_SECTION
      # ============================================================
      - name: Insert PGO Data Into RW_DATA_SECTION
        run: |
          set -e

          FILE="include/asm-generic/vmlinux.lds.h"

          echo "============================================================"
          echo "INSERT PGO_CLANG_DATA"
          echo "============================================================"

          if grep -A2 -B2 'BUG_TABLE.*\\' "$FILE" | grep -q 'PGO_CLANG_DATA'; then
              echo "[OK] PGO_CLANG_DATA already referenced"
              exit 0
          fi

          awk '
          /#define RW_DATA_SECTION/ { in_rw=1 }

          in_rw && /BUG_TABLE/ && !inserted {
              print
              print "PGO_CLANG_DATA"
              inserted=1
              next
          }

          { print }
          ' "$FILE" > "$FILE.tmp"

          mv "$FILE.tmp" "$FILE"

          if ! grep -n -A3 -B3 'PGO_CLANG_DATA' "$FILE"; then
              echo "[ERROR] PGO_CLANG_DATA reference missing"
              exit 1
          fi

      # ============================================================
      # 13. kernel/Makefile
      # ============================================================
      - name: Modify kernel Makefile
        run: |
          set -e

          FILE="kernel/Makefile"

          echo "============================================================"
          echo "MODIFY kernel/Makefile"
          echo "============================================================"

          if grep -q 'obj-\$(CONFIG_PGO_CLANG) += pgo/' "$FILE"; then
              echo "[OK] Already present"
          else
              sed -i \
                '/obj-\$(CONFIG_CFI_CLANG) += cfi.o/a obj-$(CONFIG_PGO_CLANG) += pgo/' \
                "$FILE"
          fi

          grep -n 'CONFIG_PGO_CLANG' "$FILE"

      # ============================================================
      # 14. TOP Makefile
      # ============================================================
      - name: Modify Top Makefile
        run: |
          set -e

          FILE="Makefile"

          echo "============================================================"
          echo "MODIFY TOP Makefile"
          echo "============================================================"

          if ! grep -q '^CFLAGS_PGO_CLANG := -fprofile-generate$' "$FILE"; then
              printf '\nCFLAGS_PGO_CLANG := -fprofile-generate\n' >> "$FILE"
              printf 'export CFLAGS_PGO_CLANG\n' >> "$FILE"
          fi

          if ! grep -q '^ifdef CONFIG_PGO_CLANG$' "$FILE"; then
              awk '
          /^ifdef CONFIG_CFI_CLANG/ && !inserted {
              print "ifdef CONFIG_PGO_CLANG"
              print "# NOTE: do not enable together with LTO_CLANG / POLLY_CLANG. Instrumented"
              print "# builds should be compiled with PGO_CLANG alone; re-enable LTO/Polly only"
              print "# for the final rebuild that consumes the collected .profdata."
              print "KBUILD_CFLAGS  += -mllvm -disable-preinline -fno-if-conversion"
              print "endif"
              print ""
              inserted=1
          }
          { print }
          ' "$FILE" > "$FILE.tmp"
          mv "$FILE.tmp" "$FILE"
          fi

          grep -n -A8 -B3 'CONFIG_PGO_CLANG' "$FILE"

      # ============================================================
      # 15. scripts/Makefile.lib
      # ============================================================
      - name: Modify scripts/Makefile.lib
        run: |
          set -e

          FILE="scripts/Makefile.lib"

          echo "============================================================"
          echo "MODIFY scripts/Makefile.lib"
          echo "============================================================"

          if grep -q 'CFLAGS_PGO_CLANG' "$FILE"; then
              echo "[OK] PGO flags already present"
              exit 0
          fi

          awk '
          /# Enable gcov profiling flags/ {
              print
              print ""
              print "#"
              print "# Enable clang'\''s PGO profiling flags for a file or directory depending on"
              print "# variables PGO_PROFILE_obj.o and PGO_PROFILE."
              print "#"
              print "ifeq ($(CONFIG_PGO_CLANG),y)"
              print "_c_flags += $(if $(patsubst n%,, \\"
              print "  $(PGO_PROFILE_$(basetarget).o)$(PGO_PROFILE)y), \\"
              print "  $(CFLAGS_PGO_CLANG))"
              print "endif"
              next
          }

          { print }
          ' "$FILE" > "$FILE.tmp"

          mv "$FILE.tmp" "$FILE"

          grep -n -A12 -B3 'CFLAGS_PGO_CLANG' "$FILE"

      # ============================================================
      # 16. VERIFY MODIFIED FILES
      # ============================================================
      - name: Verify PGO Integration
        run: |
          set -e

          echo "============================================================"
          echo "VERIFY PGO INTEGRATION"
          echo "============================================================"

          echo
          echo "PGO files:"
          find kernel/pgo -type f -maxdepth 1 -print

          echo
          echo "CC_IS_CLANG:"
          if grep -Rnw "CC_IS_CLANG" kernel/pgo; then
              echo "[ERROR] CC_IS_CLANG still present"
              exit 1
          else
              echo "[OK] CC_IS_CLANG removed"
          fi

          echo
          echo "CONFIG_PGO_CLANG:"
          grep -Rnw "CONFIG_PGO_CLANG" \
            kernel/pgo \
            arch/Kconfig \
            arch/arm64/Kconfig \
            kernel/Makefile \
            Makefile \
            scripts/Makefile.lib \
            include/asm-generic/vmlinux.lds.h || true

          echo
          echo "PGO linker sections:"
          grep -n "__llvm_prf_" include/asm-generic/vmlinux.lds.h || true

      # ============================================================
      # 16A. UPLOAD MODIFIED FILES ONLY
      # ============================================================
      - name: Upload Modified Files Only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgo-modified-files
          path: |
            kernel/pgo/
            arch/Kconfig
            arch/arm64/Kconfig
            arch/arm64/configs/vendor/violet-perf_defconfig
            arch/arm64/kernel/vdso/Makefile
            include/asm-generic/vmlinux.lds.h
            kernel/Makefile
            Makefile
            scripts/Makefile.lib
          if-no-files-found: warn

      # ============================================================
      # 17. INTENT-TO-ADD NEW FILES
      # ============================================================
      - name: Add New PGO Files To Git Diff
        run: |
          set -e

          echo "============================================================"
          echo "REGISTER NEW FILES FOR GIT DIFF"
          echo "============================================================"

          git add -N \
            kernel/pgo/Kconfig \
            kernel/pgo/Makefile \
            kernel/pgo/fs.c \
            kernel/pgo/instrument.c \
            kernel/pgo/pgo.h

          git status --short

      # ============================================================
      # 18. GENERATE REAL PATCH
      # ============================================================
      - name: Generate Real PGO Patch
        run: |
          set -e

          OUTPUT="$GITHUB_WORKSPACE/0001-Add-Clang-PGO-support-4.14-debugfs.patch"

          echo "============================================================"
          echo "GENERATE REAL PATCH"
          echo "============================================================"

          git diff \
            --binary \
            --full-index \
            --no-ext-diff \
            > "$OUTPUT"

          echo
          echo "Patch:"
          ls -lh "$OUTPUT"

          echo
          echo "Lines:"
          wc -l "$OUTPUT"

          echo
          echo "Files:"
          grep '^diff --git ' "$OUTPUT"

          echo
          echo "New PGO files:"
          grep '^diff --git a/kernel/pgo/' "$OUTPUT"

      # ============================================================
      # 19. VERIFY PATCH FILE COUNT
      # ============================================================
      - name: Verify Generated Patch
        run: |
          set -e

          PATCH="$GITHUB_WORKSPACE/0001-Add-Clang-PGO-support-4.14-debugfs.patch"

          echo "============================================================"
          echo "VERIFY GENERATED PATCH"
          echo "============================================================"

          EXPECTED=13

          ACTUAL=$(grep -c '^diff --git ' "$PATCH")

          echo "Expected files: $EXPECTED"
          echo "Actual files:   $ACTUAL"

          if [ "$ACTUAL" -ne "$EXPECTED" ]; then
              echo "[ERROR] Wrong number of files"
              echo
              grep '^diff --git ' "$PATCH"
              exit 1
          fi

          for FILE in \
            "kernel/pgo/Kconfig" \
            "kernel/pgo/Makefile" \
            "kernel/pgo/fs.c" \
            "kernel/pgo/instrument.c" \
            "kernel/pgo/pgo.h" \
            "arch/Kconfig" \
            "arch/arm64/Kconfig" \
            "arch/arm64/configs/vendor/violet-perf_defconfig" \
            "arch/arm64/kernel/vdso/Makefile" \
            "include/asm-generic/vmlinux.lds.h" \
            "kernel/Makefile" \
            "Makefile" \
            "scripts/Makefile.lib"
          do
              if ! grep -qF "diff --git a/$FILE b/$FILE" "$PATCH"; then
                  echo "[ERROR] Missing: $FILE"
                  exit 1
              fi
          done

          echo
          echo "[OK] All 13 files are present"

      # ============================================================
      # 20. TEST PATCH ON CLEAN BRANCH 16
      # ============================================================
      - name: Test Patch On Clean Branch
        run: |
          set -e

          echo "============================================================"
          echo "TEST PATCH ON CLEAN BRANCH 16"
          echo "============================================================"

          TEST_DIR="$RUNNER_TEMP/pgo-patch-test"

          rm -rf "$TEST_DIR"

          git clone \
            --depth 1 \
            --branch 16 \
            "https://github.com/Red-A-Hawk/los_kernel_xiaomi_sm6150.git" \
            "$TEST_DIR"

          cd "$TEST_DIR"

          git apply --check "$GITHUB_WORKSPACE/0001-Add-Clang-PGO-support-4.14-debugfs.patch"

          echo
          echo "[OK] git apply --check passed"

          git apply "$GITHUB_WORKSPACE/0001-Add-Clang-PGO-support-4.14-debugfs.patch"

          echo
          echo "[OK] Patch applied"

          echo
          echo "PGO files:"
          find kernel/pgo -type f -maxdepth 1 -print

          echo
          echo "Check CC_IS_CLANG:"
          if grep -Rnw "CC_IS_CLANG" kernel/pgo; then
              echo "[ERROR] CC_IS_CLANG found"
              exit 1
          fi

          echo
          echo "[OK] Clean-tree patch verification passed"

      # ============================================================
      # 21. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload PGO Patch
        uses: actions/upload-artifact@v4
        with:
          name: clang-pgo-4.14-debugfs-patch
          path: |
            0001-Add-Clang-PGO-support-4.14-debugfs.patch
            ${{ env.PATCH }}
          if-no-files-found: error
