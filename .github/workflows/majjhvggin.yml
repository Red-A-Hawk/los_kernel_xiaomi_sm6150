name: Build PGO Only - Kernel 4.14 ARM64

on:
  workflow_dispatch:

jobs:
  pgo-build:
    name: PGO ARM64 Instrumented Build
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout kernel
      # ============================================================

      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1


      # ============================================================
      # 2. Install dependencies
      # ============================================================

      - name: Install Dependencies
        run: |
          set -e

          sudo apt update

          sudo apt install -y \
            git curl bc bison flex \
            libssl-dev libelf-dev libdw-dev \
            device-tree-compiler \
            build-essential \
            gcc g++ \
            python3 \
            cpio rsync unzip


      # ============================================================
      # 3. Download LineageOS Clang r416183b
      # ============================================================

      - name: Download Clang r416183b
        run: |
          set -e

          echo "========================================"
          echo "DOWNLOADING LINEAGEOS CLANG r416183b"
          echo "========================================"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            clang


      # ============================================================
      # 4. Download GCC 64-bit 4.9
      # ============================================================

      - name: Download GCC 64-bit 4.9
        run: |
          set -e

          echo "========================================"
          echo "DOWNLOADING AARCH64 GCC 4.9"
          echo "========================================"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64


      # ============================================================
      # 5. Download GCC 32-bit 4.9
      # ============================================================

      - name: Download GCC 32-bit 4.9
        run: |
          set -e

          echo "========================================"
          echo "DOWNLOADING ARM32 GCC 4.9"
          echo "========================================"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32


      # ============================================================
      # 6. Setup toolchain
      #
      # Same compiler execution method as the known-working
      # Neutron build workflow.
      # ============================================================

      - name: Setup Toolchain
        run: |
          set -e

          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/gcc64/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/gcc32/bin" >> "$GITHUB_PATH"

          echo "ARCH=arm64" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"

          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

          echo "LLVM=1" >> "$GITHUB_ENV"
          echo "LLVM_IAS=1" >> "$GITHUB_ENV"

          echo "PATH=$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH" >> "$GITHUB_ENV"


      # ============================================================
      # 7. Verify toolchain
      # ============================================================

      - name: Verify Toolchain
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          echo "========================================"
          echo "CLANG"
          echo "========================================"

          which clang
          clang --version

          echo
          echo "========================================"
          echo "LLD"
          echo "========================================"

          which ld.lld
          ld.lld --version

          echo
          echo "========================================"
          echo "LLVM PROF-DATA"
          echo "========================================"

          if command -v llvm-profdata >/dev/null 2>&1; then
            echo "[OK] llvm-profdata found"
            which llvm-profdata
          else
            echo "[FAIL] llvm-profdata missing"
            exit 1
          fi

          echo
          echo "Testing llvm-profdata..."

          llvm-profdata show --help >/dev/null 2>&1

          echo "[OK] llvm-profdata is functional"

          echo
          echo "========================================"
          echo "CROSS COMPILERS"
          echo "========================================"

          which aarch64-linux-gnu-gcc || true
          which arm-linux-gnueabi-gcc || true


      # ============================================================
      # 8. Verify Clang PGO support
      # ============================================================

      - name: Verify PGO Support
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          echo "========================================"
          echo "CLANG PGO CAPABILITY TEST"
          echo "========================================"

          cat > /tmp/pgo_test.c <<'EOF'
          int foo(int x)
          {
              if (x > 10)
                  return x * 2;

              return x + 1;
          }

          int main(void)
          {
              return foo(5);
          }
          EOF

          echo
          echo "[1/2] Testing PGO instrumentation..."

          clang \
            -fprofile-instr-generate \
            -c /tmp/pgo_test.c \
            -o /tmp/pgo_test.o

          echo "[OK] PGO instrumentation supported"

          echo
          echo "[2/2] Testing PGO profile-use option..."

          clang \
            -fprofile-instr-use=/tmp/nonexistent.profdata \
            -c /tmp/pgo_test.c \
            -o /tmp/pgo_test_use.o \
            2>&1 | tee /tmp/pgo-use.log || true

          if grep -Eiq \
            "could not read profile|profile.*not found|no such file|cannot open profile" \
            /tmp/pgo-use.log; then

            echo "[OK] PGO profile-use option recognized"

          else

            echo "[FAIL] PGO profile-use option was not recognized"
            cat /tmp/pgo-use.log
            exit 1

          fi


      # ============================================================
      # 9. Prepare build directory
      # ============================================================

      - name: Prepare Build Directory
        run: |
          set -e

          rm -rf out
          mkdir -p out

          echo "[OK] Build directory prepared"


      # ============================================================
      # 10. Check PGO patch
      # ============================================================

      - name: Check PGO Patch
        run: |
          set -e

          echo "========================================"
          echo "CHECKING PGO PATCH"
          echo "========================================"

          if [ ! -f pgo-arm64-4.14.patch ]; then
            echo "[FAIL] pgo-arm64-4.14.patch not found"
            exit 1
          fi

          echo "[OK] PGO patch found"

          echo
          echo "Checking patch applicability..."

          git apply --check pgo-arm64-4.14.patch

          echo "[OK] Patch applies cleanly"


      # ============================================================
      # 11. Apply ARM64 PGO patch
      # ============================================================

      - name: Apply ARM64 PGO Patch
        run: |
          set -e

          echo "========================================"
          echo "APPLYING ARM64 PGO PATCH"
          echo "========================================"

          git apply pgo-arm64-4.14.patch

          echo "[OK] PGO patch applied"


      # ============================================================
      # 12. Verify PGO infrastructure
      # ============================================================

      - name: Verify PGO Infrastructure
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING PGO INFRASTRUCTURE"
          echo "========================================"

          required_files="
          kernel/pgo/Kconfig
          kernel/pgo/Makefile
          kernel/pgo/fs.c
          kernel/pgo/instrument.c
          kernel/pgo/pgo.h
          "

          for file in $required_files; do
            if [ ! -f "$file" ]; then
              echo "[FAIL] Missing: $file"
              exit 1
            fi

            echo "[OK] $file"
          done

          echo
          echo "Searching PGO integration..."

          grep -R \
            "CONFIG_PGO_CLANG\|PGO_CLANG_DATA\|CFLAGS_PGO_CLANG" \
            kernel/pgo \
            arch/arm64 \
            include \
            scripts \
            Makefile \
            2>/dev/null || true


      # ============================================================
      # 13. Generate defconfig
      #
      # Same basic build method as the known-working workflow.
      # ============================================================

      - name: Generate Defconfig
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-

          echo "========================================"
          echo "GENERATING DEFCONFIG"
          echo "========================================"

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            vendor/violet-perf_defconfig

          echo "[OK] defconfig generated"


      # ============================================================
      # 14. Prepare scripts/config
      # ============================================================

      - name: Prepare Kernel Scripts
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-

          if [ ! -x scripts/config ]; then

            echo "[INFO] Building scripts/config..."

            make \
              O=out \
              ARCH=arm64 \
              CC=clang \
              LLVM=1 \
              LLVM_IAS=1 \
              scripts

          fi

          if [ ! -x scripts/config ]; then
            echo "[FAIL] scripts/config unavailable"
            exit 1
          fi

          echo "[OK] scripts/config available"


      # ============================================================
      # 15. Enable PGO
      # ============================================================

      - name: Enable PGO
        run: |
          set -e

          echo "========================================"
          echo "ENABLING CLANG PGO"
          echo "========================================"

          scripts/config \
            --file out/.config \
            --enable PGO_CLANG

          echo "[OK] CONFIG_PGO_CLANG requested"


      # ============================================================
      # 16. Disable LTO
      # ============================================================

      - name: Disable LTO
        run: |
          set -e

          echo "========================================"
          echo "DISABLING LTO"
          echo "========================================"

          for cfg in \
            LTO \
            LTO_CLANG \
            THINLTO
          do
            if grep -q "^CONFIG_${cfg}=" out/.config; then

              scripts/config \
                --file out/.config \
                --disable "$cfg"

              echo "[DISABLED] CONFIG_${cfg}"

            else

              echo "[NOT PRESENT] CONFIG_${cfg}"

            fi
          done


      # ============================================================
      # 17. Finalize configuration
      # ============================================================

      - name: Finalize PGO Configuration
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-

          echo "========================================"
          echo "FINALIZING PGO CONFIGURATION"
          echo "========================================"

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo
          echo "========================================"
          echo "PGO / LTO CONFIGURATION"
          echo "========================================"

          grep -E \
            '^CONFIG_(PGO_CLANG|CC_IS_CLANG|LTO|LTO_CLANG|THINLTO)' \
            out/.config || true

          echo

          if grep -q '^CONFIG_PGO_CLANG=y$' out/.config; then
            echo "[OK] CONFIG_PGO_CLANG=y"
          else
            echo "[FAIL] CONFIG_PGO_CLANG is not enabled"
            exit 1
          fi

          if grep -q '^CONFIG_LTO_CLANG=y$' out/.config; then
            echo "[FAIL] LTO_CLANG is still enabled"
            exit 1
          fi

          if grep -q '^CONFIG_THINLTO=y$' out/.config; then
            echo "[FAIL] THINLTO is still enabled"
            exit 1
          fi

          echo "[OK] LTO disabled"


      # ============================================================
      # 18. Build PGO instrumented kernel
      #
      # This follows the known-working build invocation.
      # ============================================================

      - name: Build PGO Instrumented Kernel
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-

          echo "========================================"
          echo "BUILDING PGO INSTRUMENTED KERNEL"
          echo "========================================"

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            -j"$(nproc --all)"


      # ============================================================
      # 19. Verify kernel output
      # ============================================================

      - name: Verify Kernel Output
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING KERNEL OUTPUT"
          echo "========================================"

          if [ -f out/arch/arm64/boot/Image ]; then
            echo "[OK] Image"
            ls -lh out/arch/arm64/boot/Image
          else
            echo "[FAIL] Image not found"
            exit 1
          fi

          if [ -f out/vmlinux ]; then
            echo "[OK] vmlinux"
            ls -lh out/vmlinux
          else
            echo "[FAIL] vmlinux not found"
            exit 1
          fi


      # ============================================================
      # 20. Verify LLVM PGO sections
      # ============================================================

      - name: Verify PGO Sections
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING LLVM PGO SECTIONS"
          echo "========================================"

          llvm-readelf -S out/vmlinux \
            > /tmp/vmlinux-sections.txt

          echo
          echo "LLVM PGO sections:"
          grep -E \
            '__llvm_prf_(data|cnts|names|vals|vnds)' \
            /tmp/vmlinux-sections.txt || true

          echo

          found=0

          for section in \
            __llvm_prf_data \
            __llvm_prf_cnts \
            __llvm_prf_names
          do

            if grep -q "$section" /tmp/vmlinux-sections.txt; then
              echo "[FOUND] $section"
              found=1
            else
              echo "[MISSING] $section"
            fi

          done

          if [ "$found" -eq 0 ]; then
            echo
            echo "[FAIL] No LLVM PGO sections found"
            exit 1
          fi

          echo
          echo "[OK] LLVM PGO instrumentation present"


      # ============================================================
      # 21. Save final configuration
      # ============================================================

      - name: Save Final Defconfig
        run: |
          set -e

          cp out/.config pgo-final.config

          make \
            O=out \
            ARCH=arm64 \
            savedefconfig

          cp out/defconfig pgo-defconfig

          echo "[OK] Configuration saved"


      # ============================================================
      # 22. Upload artifacts
      # ============================================================

      - name: Upload PGO Kernel
        uses: actions/upload-artifact@v4
        with:
          name: PGO-Kernel-ARM64-4.14
          if-no-files-found: error
          path: |
            out/arch/arm64/boot/Image
            out/vmlinux
            pgo-final.config
            pgo-defconfig


      # ============================================================
      # 23. Final summary
      # ============================================================

      - name: Final Summary
        if: always()
        run: |
          set +e

          echo
          echo "========================================"
          echo "PGO BUILD FINAL SUMMARY"
          echo "========================================"

          echo
          echo "Clang:"
          clang --version 2>/dev/null || true

          echo
          echo "PGO:"
          if grep -q '^CONFIG_PGO_CLANG=y$' out/.config 2>/dev/null; then
            echo "[ENABLED] CONFIG_PGO_CLANG=y"
          else
            echo "[NOT ENABLED]"
          fi

          echo
          echo "LTO:"
          grep -E '^CONFIG_(LTO|LTO_CLANG|THINLTO)=' \
            out/.config 2>/dev/null || \
            echo "[NO LTO CONFIG ENABLED]"

          echo
          echo "Kernel:"
          if [ -f out/arch/arm64/boot/Image ]; then
            echo "[SUCCESS] Image exists"
            ls -lh out/arch/arm64/boot/Image
          else
            echo "[FAILED] Image missing"
          fi

          echo
          echo "========================================"
          echo "PGO INSTRUMENTED BUILD COMPLETE"
          echo "========================================"
