name: Inspect GSPCA Symversions

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            device-tree-compiler \
            make

      - name: Clone LineageOS Toolchains
        run: |
          set -e

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            clang

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

      - name: Setup Toolchain
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          echo "PATH=$PATH" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE=aarch64-linux-android-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-" >> "$GITHUB_ENV"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

          echo "========================================"
          echo "CLANG"
          echo "========================================"

          which clang
          clang --version

          echo
          echo "========================================"
          echo "LLD"
          echo "========================================"

          which ld.lld
          ld.lld --version

          echo
          echo "========================================"
          echo "LLVM TOOLS"
          echo "========================================"

          which llvm-ar
          which llvm-nm
          which llvm-objcopy
          which llvm-objdump
          which llvm-strip

      - name: Load violet-perf defconfig
        run: |
          set -e

          make O=out \
            ARCH=arm64 \
            vendor/violet-perf_defconfig

          echo
          echo "========================================"
          echo "LTO / MODVERSIONS"
          echo "========================================"

          grep -E \
            '^(CONFIG_LTO=|CONFIG_LTO_CLANG=|CONFIG_THINLTO=|CONFIG_LTO_NONE=|CONFIG_MODVERSIONS=|CONFIG_ARCH_SUPPORTS_LTO_CLANG=|CONFIG_ARCH_SUPPORTS_THINLTO=)' \
            out/.config || true

      - name: Prepare kernel
        run: |
          set -e

          make -j2 \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            modules_prepare

      - name: Build GSPCA
        run: |
          set +e

          echo "========================================"
          echo "BUILDING GSPCA"
          echo "========================================"

          make -j2 \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            M=drivers/media/usb/gspca \
            modules \
            2>&1 | tee gspca-build.log

          echo
          echo "========================================"
          echo "BUILD EXIT CODE"
          echo "========================================"

          echo "${PIPESTATUS[0]}"

      - name: Inspect GSPCA Symversions
        run: |
          set +e

          echo "========================================"
          echo "GSPCA FILES"
          echo "========================================"

          find out/drivers/media/usb/gspca \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*.symversions' \
              -o -name '*.o' \
              -o -name '*.lto.o' \
              -o -name '*.ko' \
              -o -name '*.mod.c' \
            \) \
            -print | sort

          echo
          echo "========================================"
          echo "SYMVERSION FILES"
          echo "========================================"

          find out/drivers/media/usb/gspca \
            -maxdepth 1 \
            -type f \
            -name '*.symversions' \
            -print \
            -exec sh -c '
              echo
              echo "===== $1 ====="
              cat "$1"
            ' _ {} \;

          echo
          echo "========================================"
          echo "ALL __crc SYMBOLS"
          echo "========================================"

          grep -R -n -E '__crc_' \
            out/drivers/media/usb/gspca \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "GSPCA SYMBOL VERSION WARNINGS"
          echo "========================================"

          grep -n \
            "version generation failed" \
            gspca-build.log \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "MODPOST OUTPUT"
          echo "========================================"

          grep -n -E \
            'MODPOST|EXPORT symbol|version generation|gspca_' \
            gspca-build.log \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "DONE"
          echo "========================================"

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gspca-symversions-diagnostic
          path: |
            gspca-build.log
            out/drivers/media/usb/gspca/
          if-no-files-found: warn
