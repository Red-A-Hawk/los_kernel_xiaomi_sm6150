name: Inspect GSPCA Symversions

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          sudo apt update

          sudo apt install -y \
            git \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            device-tree-compiler \
            make

      - name: Clone LineageOS Toolchains
        run: |
          set -e

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            clang

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

      - name: Setup Toolchain
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          echo "PATH=$PATH" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE=aarch64-linux-android-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-" >> "$GITHUB_ENV"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

          echo "========================================"
          echo "CLANG"
          echo "========================================"

          which clang
          clang --version

          echo
          echo "========================================"
          echo "LLD"
          echo "========================================"

          which ld.lld
          ld.lld --version

          echo
          echo "========================================"
          echo "LLVM TOOLS"
          echo "========================================"

          which llvm-ar
          which llvm-nm
          which llvm-objcopy
          which llvm-objdump
          which llvm-strip

      - name: Load violet-perf defconfig
        run: |
          set -e

          make O=out \
            ARCH=arm64 \
            vendor/violet-perf_defconfig

          echo
          echo "========================================"
          echo "LTO / MODVERSIONS CONFIGURATION"
          echo "========================================"

          grep -E \
            '^(CONFIG_LTO=|CONFIG_LTO_CLANG=|CONFIG_THINLTO=|CONFIG_LTO_NONE=|CONFIG_MODVERSIONS=|CONFIG_ARCH_SUPPORTS_LTO_CLANG=|CONFIG_ARCH_SUPPORTS_THINLTO=|CONFIG_THIN_ARCHIVES=)' \
            out/.config || true

          echo
          echo "========================================"
          echo "CONFIG VALUES"
          echo "========================================"

          for cfg in \
            CONFIG_LTO \
            CONFIG_LTO_CLANG \
            CONFIG_THINLTO \
            CONFIG_LTO_NONE \
            CONFIG_MODVERSIONS \
            CONFIG_ARCH_SUPPORTS_LTO_CLANG \
            CONFIG_ARCH_SUPPORTS_THINLTO \
            CONFIG_THIN_ARCHIVES
          do
            grep -E "^${cfg}=" out/.config || echo "${cfg}=NOT_PRESENT"
          done

      - name: Inspect Kbuild LTO Logic
        run: |
          set +e

          echo "========================================"
          echo "KBUILD LTO LOGIC"
          echo "========================================"

          grep -R -n \
            -E 'update_lto_symversions|symversions|THIN_ARCHIVES|LLVM_AR|llvm-ar' \
            scripts \
            Makefile \
            arch/arm64 \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "MAKEFILE BUILD"
          echo "========================================"

          grep -n \
            -E 'update_lto_symversions|symversions|thin|archive|llvm-ar' \
            scripts/Makefile.build \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "MAKEFILE MODPOST"
          echo "========================================"

          grep -n \
            -E 'symversions|Module.symvers|modpost|LTO' \
            scripts/Makefile.modpost \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "MAKEFILE LIB"
          echo "========================================"

          grep -n \
            -E 'symversions|THIN_ARCHIVES|llvm-ar|LLVM_AR' \
            scripts/Makefile.lib \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "ARCH ARM64 MAKEFILES"
          echo "========================================"

          grep -R -n \
            -E 'symversions|LTO|THIN_ARCHIVES|llvm-ar' \
            arch/arm64/Makefile \
            arch/arm64/Makefile* \
            2>/dev/null || true

      - name: Prepare kernel
        run: |
          set -e

          make -j2 \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            modules_prepare

      - name: Build Kernel Image
        run: |
          set +e

          echo "========================================"
          echo "BUILDING KERNEL IMAGE"
          echo "========================================"

          make V=1 -j2 \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            Image \
            2>&1 | tee kernel-build.log

          BUILD_RESULT=${PIPESTATUS[0]}

          echo "$BUILD_RESULT" > kernel-build-result.txt

          echo
          echo "========================================"
          echo "KERNEL BUILD RESULT"
          echo "========================================"

          cat kernel-build-result.txt

      - name: Inspect Module Symvers
        if: always()
        run: |
          set +e

          echo "========================================"
          echo "MODULE SYMVERS STATUS"
          echo "========================================"

          if [ -f out/Module.symvers ]; then
            echo "FOUND: out/Module.symvers"
            ls -lh out/Module.symvers
            wc -l out/Module.symvers
          else
            echo "MISSING: out/Module.symvers"
          fi

          echo
          echo "========================================"
          echo "MODULE SYMVERS SAMPLE"
          echo "========================================"

          if [ -f out/Module.symvers ]; then
            head -50 out/Module.symvers
          fi

          echo
          echo "========================================"
          echo "GSPCA SYMBOLS IN MODULE.SYMVERS"
          echo "========================================"

          if [ -f out/Module.symvers ]; then
            grep -E \
              'gspca_|gspca_main' \
              out/Module.symvers \
              2>/dev/null || true
          fi

      - name: Build GSPCA
        run: |
          set +e

          echo "========================================"
          echo "BUILDING GSPCA"
          echo "========================================"

          make V=1 -j2 \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            M=drivers/media/usb/gspca \
            modules \
            2>&1 | tee gspca-build.log

          BUILD_RESULT=${PIPESTATUS[0]}

          echo "$BUILD_RESULT" > gspca-build-result.txt

          echo
          echo "========================================"
          echo "BUILD EXIT CODE"
          echo "========================================"

          cat gspca-build-result.txt

      - name: Inspect GSPCA Symversions
        if: always()
        run: |
          set +e

          echo "========================================"
          echo "GSPCA FILES"
          echo "========================================"

          find out/drivers/media/usb/gspca \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*.symversions' \
              -o -name '*.o' \
              -o -name '*.lto.o' \
              -o -name '*.ko' \
              -o -name '*.mod.c' \
              -o -name '*.mod.o' \
              -o -name '*.cmd' \
              -o -name 'Module.symvers' \
            \) \
            -print | sort

          echo
          echo "========================================"
          echo "SYMVERSION FILES"
          echo "========================================"

          find out \
            -type f \
            -name '*.symversions' \
            -print \
            -exec sh -c '
              echo
              echo "===== $1 ====="
              wc -l "$1"
              cat "$1"
            ' _ {} \;

          echo
          echo "========================================"
          echo "GSPCA MAIN SYMVERSIONS"
          echo "========================================"

          find out \
            -type f \
            -name 'gspca_main.o.symversions' \
            -print \
            -exec sh -c '
              echo
              echo "===== $1 ====="
              cat "$1"
            ' _ {} \;

          echo
          echo "========================================"
          echo "GSPCA LTO SYMVERSIONS"
          echo "========================================"

          find out \
            -type f \
            -name 'gspca_main.lto.o.symversions' \
            -print \
            -exec sh -c '
              echo
              echo "===== $1 ====="
              cat "$1"
            ' _ {} \;

          echo
          echo "========================================"
          echo "ALL __crc SYMBOLS"
          echo "========================================"

          grep -R -n -E '__crc_' \
            out/drivers/media/usb/gspca \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "GSPCA SYMBOLS IN GLOBAL MODULE.SYMVERS"
          echo "========================================"

          grep -E \
            'gspca_|gspca_main' \
            out/Module.symvers \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "SYMVERSION REFERENCES"
          echo "========================================"

          grep -R -n -E \
            'symversions|update_lto_symversions|LLVM_AR|llvm-ar' \
            out/drivers/media/usb/gspca \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "KBUILD COMMAND FILES"
          echo "========================================"

          find out/drivers/media/usb/gspca \
            -type f \
            -name '.*.cmd' \
            -print \
            -exec sh -c '
              echo
              echo "===== $1 ====="
              grep -E \
                "clang|llvm|symversion|genksyms|llvm-ar|ar |lto" \
                "$1" || true
            ' _ {} \;

          echo
          echo "========================================"
          echo "GSPCA SYMBOL VERSION WARNINGS"
          echo "========================================"

          grep -n \
            "version generation failed" \
            gspca-build.log \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "MODPOST OUTPUT"
          echo "========================================"

          grep -n -E \
            'MODPOST|EXPORT symbol|version generation|gspca_' \
            gspca-build.log \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "KERNEL BUILD WARNINGS"
          echo "========================================"

          grep -n -E \
            'Module.symvers|symvers|LTO|thin|archive|modversion' \
            kernel-build.log \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "BUILD RESULTS"
          echo "========================================"

          echo "Kernel:"
          cat kernel-build-result.txt 2>/dev/null || true

          echo
          echo "GSPCA:"
          cat gspca-build-result.txt 2>/dev/null || true

          echo
          echo "========================================"
          echo "DONE"
          echo "========================================"

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gspca-symversions-diagnostic
          path: |
            kernel-build.log
            kernel-build-result.txt
            gspca-build.log
            gspca-build-result.txt
            out/Module.symvers
            out/drivers/media/usb/gspca/
            scripts/Makefile.build
            scripts/Makefile.modpost
            scripts/Makefile.lib
          if-no-files-found: warn
