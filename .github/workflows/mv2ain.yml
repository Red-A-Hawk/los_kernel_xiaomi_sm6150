name: Build PGO v2 - Kernel 4.14 - Clang r416183b

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: PGO Kernel Build
    runs-on: ubuntu-22.04

    env:
      KERNEL_REPO: https://github.com/Red-A-Hawk/los_kernel_xiaomi_sm6150.git
      KERNEL_BRANCH: 16

      PGO_PATCH_URL: https://raw.githubusercontent.com/Red-A-Hawk/Patch/kernel_xiaomi_violet/0001-ARM64-Clang-PGO-4.14-RedHawk-v2.patch

      CLANG_REPO: https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git

      KERNEL_DIR: ${{ github.workspace }}/kernel
      CLANG_DIR: ${{ github.workspace }}/clang

      ARCH: arm64
      DEFCONFIG: vendor/violet-perf_defconfig

    steps:

      # ============================================================
      # 1. Install dependencies
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            device-tree-compiler \
            python3 \
            python3-pip \
            rsync \
            unzip \
            cpio \
            xz-utils \
            zstd \
            lz4 \
            binutils-aarch64-linux-gnu

      # ============================================================
      # 2. Setup swap
      # ============================================================
      - name: Setup swap
        shell: bash
        run: |
          set -eux

          if ! swapon --show | grep -q /swapfile; then
            sudo fallocate -l 16G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi

          echo "=========================================="
          echo "MEMORY"
          echo "=========================================="

          free -h

          echo
          echo "SWAP:"
          swapon --show

      # ============================================================
      # 3. Clone kernel branch 16
      # ============================================================
      - name: Clone kernel
        shell: bash
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            "${KERNEL_DIR}"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "KERNEL"
          echo "=========================================="

          echo "Branch:"
          git branch --show-current

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Commit message:"
          git log -1 --oneline

          echo
          echo "Kernel version:"
          make kernelversion

      # ============================================================
      # 4. Clone Clang r416183b
      # ============================================================
      - name: Setup Clang r416183b
        shell: bash
        run: |
          set -eux

          git clone \
            --depth=1 \
            "${CLANG_REPO}" \
            "${CLANG_DIR}"

          echo "${CLANG_DIR}/bin" >> "${GITHUB_PATH}"

          echo "=========================================="
          echo "CLANG"
          echo "=========================================="

          "${CLANG_DIR}/bin/clang" --version

          echo
          echo "=========================================="
          echo "LLD"
          echo "=========================================="

          "${CLANG_DIR}/bin/ld.lld" --version

      # ============================================================
      # 5. Verify LLVM tools
      # ============================================================
      - name: Verify LLVM tools
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "LLVM TOOLCHAIN CHECK"
          echo "=========================================="

          for tool in \
            clang \
            clang++ \
            ld.lld \
            llvm-ar \
            llvm-nm \
            llvm-objcopy \
            llvm-objdump \
            llvm-strip \
            llvm-profdata
          do
            if [ ! -x "${CLANG_DIR}/bin/${tool}" ]; then
              echo "ERROR: Missing tool: ${tool}"
              exit 1
            fi

            echo "FOUND: ${tool}"
          done

          echo
          echo "=========================================="
          echo "LLVM PROFData"
          echo "=========================================="

          # Old llvm-profdata from Clang r416183b
          # does NOT support --version.
          "${CLANG_DIR}/bin/llvm-profdata" merge --help >/dev/null

          echo "llvm-profdata: WORKING"

          echo
          echo "Supported llvm-profdata commands:"
          "${CLANG_DIR}/bin/llvm-profdata" \
            merge --help \
            | head -20

          echo
          echo "Checking opt..."

          if [ -x "${CLANG_DIR}/bin/opt" ]; then
            echo "opt: FOUND"
          else
            echo "opt: NOT FOUND"
            echo "opt is not required for this PGO instrumentation build."
          fi

      # ============================================================
      # 6. Download PGO v2 patch
      # ============================================================
      - name: Download PGO v2 patch
        shell: bash
        run: |
          set -eux

          cd "${KERNEL_DIR}"

          curl \
            -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            -o 0001-ARM64-Clang-PGO-4.14-RedHawk-v2.patch \
            "${PGO_PATCH_URL}"

          echo "=========================================="
          echo "PGO PATCH"
          echo "=========================================="

          echo "SHA256:"
          sha256sum \
            0001-ARM64-Clang-PGO-4.14-RedHawk-v2.patch

          echo
          echo "Lines:"
          wc -l \
            0001-ARM64-Clang-PGO-4.14-RedHawk-v2.patch

          echo
          echo "Header:"
          head -15 \
            0001-ARM64-Clang-PGO-4.14-RedHawk-v2.patch

      # ============================================================
      # 7. STRICT git apply --check
      # ============================================================
      - name: Check PGO v2 patch
        shell: bash
        run: |
          set -eux

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "STRICT PATCH CHECK"
          echo "=========================================="

          git status --short

          git apply \
            --check \
            0001-ARM64-Clang-PGO-4.14-RedHawk-v2.patch

          echo
          echo "=========================================="
          echo "PGO V2 PATCH CHECK PASSED"
          echo "=========================================="

      # ============================================================
      # 8. Apply PGO v2 patch
      # ============================================================
      - name: Apply PGO v2 patch
        shell: bash
        run: |
          set -eux

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "APPLYING PGO V2"
          echo "=========================================="

          git apply \
            0001-ARM64-Clang-PGO-4.14-RedHawk-v2.patch

          echo
          echo "Running git diff --check..."

          git diff --check

          echo
          echo "=========================================="
          echo "PGO V2 APPLIED SUCCESSFULLY"
          echo "=========================================="

          git status --short

      # ============================================================
      # 9. Verify PGO source integration
      # ============================================================
      - name: Verify PGO integration
        shell: bash
        run: |
          set -eux

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "PGO SOURCE CHECK"
          echo "=========================================="

          test -f kernel/pgo/Kconfig
          test -f kernel/pgo/Makefile
          test -f kernel/pgo/fs.c
          test -f kernel/pgo/instrument.c
          test -f kernel/pgo/pgo.h

          echo "PGO source files: OK"

          echo
          echo "Checking arch/Kconfig..."

          grep -q \
            'source "kernel/pgo/Kconfig"' \
            arch/Kconfig

          echo "arch/Kconfig: OK"

          echo
          echo "Checking arm64 Kconfig..."

          grep -q \
            'ARCH_SUPPORTS_PGO_CLANG' \
            arch/arm64/Kconfig

          echo "arm64 Kconfig: OK"

          echo
          echo "Checking root Makefile..."

          grep -q \
            'CFLAGS_PGO_CLANG' \
            Makefile

          echo "Makefile: OK"

          echo
          echo "Checking kernel Makefile..."

          grep -q \
            'kernel/pgo' \
            kernel/Makefile

          echo "kernel/Makefile: OK"

          echo
          echo "Checking scripts/Makefile.lib..."

          grep -q \
            'PGO_PROFILE' \
            scripts/Makefile.lib

          echo "scripts/Makefile.lib: OK"

          echo
          echo "Checking linker script..."

          grep -q \
            'PGO_CLANG_DATA' \
            include/asm-generic/vmlinux.lds.h

          echo "vmlinux.lds.h: OK"

          echo
          echo "=========================================="
          echo "PGO SOURCE INTEGRATION PASSED"
          echo "=========================================="

      # ============================================================
      # 10. Prepare output directory
      # ============================================================
      - name: Prepare output directory
        shell: bash
        run: |
          set -eux

          cd "${KERNEL_DIR}"

          rm -rf out
          mkdir -p out

      # ============================================================
      # 11. Load vendor/violet-perf_defconfig
      # ============================================================
      - name: Load violet-perf_defconfig
        shell: bash
        run: |
          set -eux

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "LOADING DEFCONFIG"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            CC="${CLANG_DIR}/bin/clang" \
            LD="${CLANG_DIR}/bin/ld.lld" \
            AR="${CLANG_DIR}/bin/llvm-ar" \
            NM="${CLANG_DIR}/bin/llvm-nm" \
            OBJCOPY="${CLANG_DIR}/bin/llvm-objcopy" \
            OBJDUMP="${CLANG_DIR}/bin/llvm-objdump" \
            STRIP="${CLANG_DIR}/bin/llvm-strip" \
            "${DEFCONFIG}"

          test -f out/.config

          echo
          echo "Defconfig loaded successfully."

      # ============================================================
      # 12. Enable PGO
      # ============================================================
      - name: Enable PGO
        shell: bash
        run: |
          set -eux

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "ENABLE PGO"
          echo "=========================================="

          test -f out/.config
          test -f scripts/config

          scripts/config \
            --file out/.config \
            --enable CONFIG_PROC_FS

          scripts/config \
            --file out/.config \
            --enable CONFIG_PGO_CLANG

          # No Polly is added.
          # No BOLT is added.
          # Existing LTO/ThinLTO configuration from
          # vendor/violet-perf_defconfig is left untouched.

          make \
            O=out \
            ARCH=arm64 \
            CC="${CLANG_DIR}/bin/clang" \
            LD="${CLANG_DIR}/bin/ld.lld" \
            olddefconfig

      # ============================================================
      # 13. Validate final configuration
      # ============================================================
      - name: Validate PGO configuration
        shell: bash
        run: |
          set -eux

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "FINAL KERNEL CONFIG"
          echo "=========================================="

          grep -E \
            '^CONFIG_(PROC_FS|PGO_CLANG|LTO|THINLTO|LTO_CLANG|POLLY)' \
            out/.config \
            || true

          echo
          echo "Required options:"

          grep \
            '^CONFIG_PROC_FS=y$' \
            out/.config

          grep \
            '^CONFIG_PGO_CLANG=y$' \
            out/.config

          echo
          echo "PGO configuration: PASSED"

      # ============================================================
      # 14. Verify compiler PGO flag
      # ============================================================
      - name: Verify PGO compiler flags
        shell: bash
        run: |
          set -eux

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "PGO COMPILER FLAGS"
          echo "=========================================="

          grep -n \
            'CFLAGS_PGO_CLANG.*-fprofile-generate' \
            Makefile

          echo
          echo "PGO Makefile rules:"

          grep -n \
            'PGO_PROFILE' \
            scripts/Makefile.lib

          echo
          echo "PGO compiler integration: PASSED"

      # ============================================================
      # 15. Build instrumented PGO kernel
      # ============================================================
      - name: Build PGO kernel
        shell: bash
        run: |
          set -eux
          set -o pipefail

          cd "${KERNEL_DIR}"

          export PATH="${CLANG_DIR}/bin:${PATH}"

          echo "=========================================="
          echo "BUILD ENVIRONMENT"
          echo "=========================================="

          echo
          echo "Clang:"
          clang --version

          echo
          echo "LLD:"
          ld.lld --version

          echo
          echo "CPU:"
          nproc --all

          echo
          echo "Memory:"
          free -h

          echo
          echo "=========================================="
          echo "BUILDING PGO INSTRUMENTED KERNEL"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            -j"$(nproc --all)" \
            2>&1 | tee ../pgo-build.log

      # ============================================================
      # 16. Verify kernel output
      # ============================================================
      - name: Verify kernel output
        shell: bash
        run: |
          set -eux

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "KERNEL OUTPUT"
          echo "=========================================="

          test -f out/vmlinux

          echo
          echo "vmlinux:"
          ls -lh out/vmlinux

          if [ -f out/arch/arm64/boot/Image ]; then
            echo
            echo "Image:"
            ls -lh out/arch/arm64/boot/Image
          fi

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo
            echo "Image.gz:"
            ls -lh out/arch/arm64/boot/Image.gz
          fi

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo
            echo "Image.gz-dtb:"
            ls -lh out/arch/arm64/boot/Image.gz-dtb
          fi

          echo
          echo "vmlinux file:"
          file out/vmlinux

      # ============================================================
      # 17. Verify LLVM PGO sections
      # ============================================================
      - name: Verify LLVM PGO sections
        shell: bash
        run: |
          set -eux

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "LLVM PGO SECTION CHECK"
          echo "=========================================="

          echo
          echo "LLVM PGO symbols:"

          llvm-nm \
            out/vmlinux \
            2>/dev/null \
            | grep -E \
              '__llvm_prf_(data|cnts|names|vals|vnds)' \
            | head -100 \
            || true

          echo
          echo "ELF PGO sections:"

          readelf \
            -S \
            out/vmlinux \
            2>/dev/null \
            | grep -E \
              '__llvm_prf|pgo' \
            || true

      # ============================================================
      # 18. Save final configuration
      # ============================================================
      - name: Save final configuration
        shell: bash
        run: |
          set -eux

          cd "${KERNEL_DIR}"

          cp \
            out/.config \
            out/PGO-final-defconfig

          echo "=========================================="
          echo "FINAL PGO CONFIG"
          echo "=========================================="

          grep \
            '^CONFIG_PGO_CLANG=' \
            out/.config

      # ============================================================
      # 19. Generate build information
      # ============================================================
      - name: Generate build information
        if: always()
        shell: bash
        run: |
          set +e

          cd "${KERNEL_DIR}"

          {
            echo "=========================================="
            echo "PGO BUILD INFORMATION"
            echo "=========================================="

            echo
            echo "[Kernel branch]"
            git branch --show-current

            echo
            echo "[Kernel commit]"
            git rev-parse HEAD

            echo
            echo "[Kernel commit message]"
            git log -1 --oneline

            echo
            echo "[Kernel version]"
            make kernelversion

            echo
            echo "[Clang]"
            "${CLANG_DIR}/bin/clang" --version

            echo
            echo "[LLD]"
            "${CLANG_DIR}/bin/ld.lld" --version

            echo
            echo "[LLVM Profdata]"
            "${CLANG_DIR}/bin/llvm-profdata" merge --help | head -20

            echo
            echo "[PGO configuration]"
            grep -E \
              '^CONFIG_(PROC_FS|PGO_CLANG|LTO|THINLTO|LTO_CLANG|POLLY)' \
              out/.config 2>/dev/null

            echo
            echo "[Patch SHA256]"
            sha256sum \
              0001-ARM64-Clang-PGO-4.14-RedHawk-v2.patch

          } > pgo-build-info.txt

      # ============================================================
      # 20. Upload kernel
      # ============================================================
      - name: Upload PGO kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-pgo-r416183b
          if-no-files-found: error
          path: |
            kernel/out/vmlinux
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/dts/**/*.dtb
            kernel/out/.config
            kernel/out/PGO-final-defconfig

      # ============================================================
      # 21. Upload logs and patch
      # ============================================================
      - name: Upload PGO debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgo-build-debug
          if-no-files-found: warn
          path: |
            pgo-build.log
            kernel/pgo-build-info.txt
            kernel/0001-ARM64-Clang-PGO-4.14-RedHawk-v2.patch
