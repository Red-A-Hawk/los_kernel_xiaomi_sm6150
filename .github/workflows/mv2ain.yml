name: Check Clang PGO v3 - r416183b

on:
  workflow_dispatch:

jobs:
  check-toolchain:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout kernel
      # ============================================================

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1


      # ============================================================
      # 2. Install dependencies
      # ============================================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt update

          sudo apt install -y \
            git \
            curl \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            device-tree-compiler \
            build-essential \
            gcc \
            g++ \
            python3


      # ============================================================
      # 3. Clone LineageOS Toolchains
      # ============================================================

      - name: Clone LineageOS Toolchains
        run: |
          set -e

          echo "========================================"
          echo "CLONING TOOLCHAINS"
          echo "========================================"

          rm -rf clang gcc64 gcc32

          echo
          echo "========================================"
          echo "CLANG r416183b"
          echo "========================================"

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            clang

          echo
          echo "========================================"
          echo "GCC64 4.9"
          echo "========================================"

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          echo
          echo "========================================"
          echo "GCC32 4.9"
          echo "========================================"

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32


      # ============================================================
      # 4. Setup Toolchain
      # ============================================================

      - name: Setup Toolchain
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          echo "PATH=$PATH" >> "$GITHUB_ENV"

          echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> "$GITHUB_ENV"
          echo "GCC64_PATH=$GITHUB_WORKSPACE/gcc64" >> "$GITHUB_ENV"
          echo "GCC32_PATH=$GITHUB_WORKSPACE/gcc32" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE=aarch64-linux-android-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-" >> "$GITHUB_ENV"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"


      # ============================================================
      # 5. Verify Toolchain
      # ============================================================

      - name: Verify Toolchain
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "========================================"
          echo "CLANG"
          echo "========================================"

          which clang
          clang --version

          echo
          echo "========================================"
          echo "LLD"
          echo "========================================"

          which ld.lld
          ld.lld --version

          echo
          echo "========================================"
          echo "LLVM TOOLS"
          echo "========================================"

          for tool in \
            llvm-ar \
            llvm-nm \
            llvm-objcopy \
            llvm-objdump \
            llvm-strip \
            llvm-profdata
          do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "[FOUND] $tool"
            else
              echo "[MISSING] $tool"
            fi
          done

          echo
          echo "========================================"
          echo "GCC64"
          echo "========================================"

          which aarch64-linux-android-gcc
          aarch64-linux-android-gcc --version | head -1

          echo
          echo "========================================"
          echo "GCC32"
          echo "========================================"

          which arm-linux-androideabi-gcc
          arm-linux-androideabi-gcc --version | head -1


      # ============================================================
      # 6. Apply ARM64 Clang PGO Patch
      # ============================================================

      - name: Apply ARM64 Clang PGO Patch
        run: |
          set -e

          echo "========================================"
          echo "DOWNLOADING PGO PATCH"
          echo "========================================"

          curl -L \
            --fail \
            --retry 3 \
            -o 0001-ARM64-Clang-PGO-4.14-RedHawk.patch \
            https://raw.githubusercontent.com/Red-A-Hawk/Patch/kernel_xiaomi_violet/0001-ARM64-Clang-PGO-4.14-RedHawk-final.patch

          echo
          echo "========================================"
          echo "PATCH INFORMATION"
          echo "========================================"

          ls -lh 0001-ARM64-Clang-PGO-4.14-RedHawk.patch

          sha256sum \
            0001-ARM64-Clang-PGO-4.14-RedHawk.patch

          echo
          echo "========================================"
          echo "CHECKING PATCH"
          echo "========================================"

          git apply --check \
            0001-ARM64-Clang-PGO-4.14-RedHawk.patch

          echo "[OK] Patch applies cleanly"

          echo
          echo "========================================"
          echo "APPLYING PATCH"
          echo "========================================"

          git apply \
            0001-ARM64-Clang-PGO-4.14-RedHawk.patch

          echo "[OK] PGO patch applied"


      # ============================================================
      # 7. Verify PGO Patch Integration
      # ============================================================

      - name: Verify PGO Patch Integration
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "========================================"
          echo "VERIFYING PGO INTEGRATION"
          echo "========================================"

          echo
          echo "Checking PGO files..."

          test -f kernel/pgo/Kconfig
          test -f kernel/pgo/Makefile
          test -f kernel/pgo/fs.c
          test -f kernel/pgo/instrument.c
          test -f kernel/pgo/pgo.h

          echo "[OK] kernel/pgo files found"

          echo
          echo "Checking Kconfig..."

          grep -n \
            "ARCH_SUPPORTS_PGO_CLANG\|PGO_CLANG" \
            kernel/pgo/Kconfig

          echo
          echo "Checking Makefiles..."

          grep -n \
            "CFLAGS_PGO_CLANG" \
            Makefile

          grep -n \
            "PGO_PROFILE" \
            scripts/Makefile.lib

          grep -n \
            "CONFIG_PGO_CLANG" \
            kernel/Makefile

          echo
          echo "Checking linker integration..."

          grep -n \
            "PGO_CLANG_DATA\|__llvm_prf_" \
            include/asm-generic/vmlinux.lds.h

          echo
          echo "Checking ARM64 support..."

          grep -n \
            "ARCH_SUPPORTS_PGO_CLANG" \
            arch/arm64/Kconfig

          echo
          echo "Checking VDSO exclusion..."

          grep -n \
            "PGO_PROFILE" \
            arch/arm64/kernel/vdso/Makefile

          echo
          echo "========================================"
          echo "PGO PATCH INTEGRATION: OK"
          echo "========================================"


      # ============================================================
      # 8. Run defconfig
      # ============================================================

      - name: Verify PGO Kconfig with defconfig
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export LLVM=1

          echo "========================================"
          echo "RUNNING DEFCONFIG"
          echo "========================================"

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            vendor/violet-perf_defconfig

          echo
          echo "========================================"
          echo "CHECKING PGO KCONFIG"
          echo "========================================"

          if grep -q \
            "^CONFIG_ARCH_SUPPORTS_PGO_CLANG=y" \
            out/.config; then

            echo "[OK] ARCH_SUPPORTS_PGO_CLANG=y"

          else

            echo "[FAIL] ARCH_SUPPORTS_PGO_CLANG not enabled"

            grep -i "PGO" out/.config || true

            exit 1
          fi

          echo
          echo "PGO_CLANG status:"

          grep -E \
            "PGO|PROC_FS" \
            out/.config || true


      # ============================================================
      # 9. Check Clang PGO Capability
      # ============================================================

      - name: Check Clang PGO Support
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "========================================"
          echo "CLANG PGO SUPPORT"
          echo "========================================"

          cat > pgo_test.c <<'EOF'
          int test_pgo(int x)
          {
              if (x > 100)
                  return x * 2;

              return x + 1;
          }

          int main(void)
          {
              return test_pgo(10);
          }
          EOF

          echo
          echo "========================================"
          echo "CLANG VERSION"
          echo "========================================"

          clang --version

          echo
          echo "========================================"
          echo "LLVM PROFILING TOOLS"
          echo "========================================"

          if command -v llvm-profdata >/dev/null 2>&1; then
            echo "[OK] llvm-profdata found"
            llvm-profdata --version
          else
            echo "[FAIL] llvm-profdata NOT found"
            exit 1
          fi

          echo
          echo "========================================"
          echo "TEST -fprofile-generate"
          echo "========================================"

          if clang \
              -O2 \
              -fprofile-generate \
              -c \
              pgo_test.c \
              -o pgo_generate.o; then

            echo "[OK] -fprofile-generate supported"

          else

            echo "[FAIL] -fprofile-generate NOT supported"
            exit 1

          fi

          echo
          echo "========================================"
          echo "TEST -fprofile-instr-generate"
          echo "========================================"

          if clang \
              -O2 \
              -fprofile-instr-generate \
              -c \
              pgo_test.c \
              -o pgo_instr.o; then

            echo "[OK] -fprofile-instr-generate supported"

          else

            echo "[FAIL] -fprofile-instr-generate NOT supported"
            exit 1

          fi

          echo
          echo "========================================"
          echo "TEST -fprofile-instr-use"
          echo "========================================"

          clang \
            -O2 \
            -fprofile-instr-use=/tmp/nonexistent.profdata \
            -c \
            pgo_test.c \
            -o /dev/null \
            2>pgo-use-error.log || true

          if grep -qi "unknown argument" pgo-use-error.log; then

            echo "[FAIL] -fprofile-instr-use NOT supported"
            cat pgo-use-error.log
            exit 1

          else

            echo "[OK] -fprofile-instr-use recognized"

          fi

          echo
          echo "========================================"
          echo "PGO CAPABILITY: SUPPORTED"
          echo "========================================"


      # ============================================================
      # 10. Final PGO Summary
      # ============================================================

      - name: Final PGO Capability Summary
        if: always()
        run: |
          set +e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo
          echo "========================================"
          echo "FINAL PGO SUMMARY"
          echo "========================================"

          echo
          echo "CLANG:"
          clang --version

          echo
          echo "PGO:"
          if clang \
              -O2 \
              -fprofile-generate \
              -c \
              pgo_test.c \
              -o /tmp/pgo-final.o \
              2>/dev/null; then

            echo "[SUPPORTED] Clang PGO"

          else

            echo "[NOT SUPPORTED] Clang PGO"

          fi

          echo
          echo "LLVM PROFTOOLS:"
          if command -v llvm-profdata >/dev/null 2>&1; then
            echo "[FOUND] llvm-profdata"
          else
            echo "[MISSING] llvm-profdata"
          fi

          echo
          echo "PGO KERNEL FILES:"

          for file in \
            kernel/pgo/Kconfig \
            kernel/pgo/Makefile \
            kernel/pgo/fs.c \
            kernel/pgo/instrument.c \
            kernel/pgo/pgo.h
          do
            if [ -f "$file" ]; then
              echo "[FOUND] $file"
            else
              echo "[MISSING] $file"
            fi
          done

          echo
          echo "========================================"
          echo "DONE"
          echo "========================================"
