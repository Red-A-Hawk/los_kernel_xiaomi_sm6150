name: ARM64 Linker Files Only

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dump ARM64 linker files
        run: |
          echo "## ARM64 Linker Files" > report.txt
          echo "" >> report.txt

          echo "### arch/arm64/kernel/vmlinux.lds.S" >> report.txt
          echo '```' >> report.txt
          nl -ba arch/arm64/kernel/vmlinux.lds.S >> report.txt
          echo '```' >> report.txt
          echo "" >> report.txt

          echo "### arch/arm64/kernel/Makefile" >> report.txt
          echo '```' >> report.txt
          nl -ba arch/arm64/kernel/Makefile >> report.txt
          echo '```' >> report.txt

          cat report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: arm64-linker-files
          path: report.txt
