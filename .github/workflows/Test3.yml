name: Build Kernel (violet)

on:
  push:
    branches:
      - 16
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Base
          - KSU
          - KSU-NoMount
          - KSU-SUSFS
          - KSU-SUSFS-NoMount

    steps:

    # ============================================================
    # 1. Checkout
    # ============================================================

    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: 16
        fetch-depth: 1


    # ============================================================
    # 1.5. Free Disk Space
    # ============================================================

    - name: Free disk space
      run: |
        set -e

        echo "========================================"
        echo "DISK SPACE BEFORE CLEANUP"
        echo "========================================"

        df -h

        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force || true

        echo
        echo "========================================"
        echo "DISK SPACE AFTER CLEANUP"
        echo "========================================"

        df -h


    # ============================================================
    # 2. Dependencies
    # ============================================================

    - name: Install dependencies
      run: |
        set -e

        sudo apt update

        sudo apt install -y \
          git \
          bc \
          bison \
          flex \
          libssl-dev \
          make \
          zip \
          unzip \
          curl \
          wget \
          libelf-dev \
          libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          python3 \
          jq \
          openjdk-17-jre-headless


    # ============================================================
    # 3. Setup Toolchains
    #
    # AOSP Clang + GCC64 + GCC32
    # ============================================================

    - name: Setup Toolchains
      run: |
        set -e

        echo "========================================"
        echo "SETTING UP TOOLCHAINS"
        echo "========================================"

        # --------------------------------------------------------
        # AOSP Clang
        # --------------------------------------------------------

        CLANG_URL="https://github.com/bachnxuan/aosp_clang_mirror/releases/download/clang-r614150-16165221/clang-r614150.tar.gz"

        echo
        echo "========================================"
        echo "DOWNLOADING AOSP CLANG"
        echo "========================================"

        echo "AOSP Clang URL:"
        echo "$CLANG_URL"

        rm -rf clang
        rm -f clang-r614150.tar.gz

        if ! curl -L \
          --fail \
          --retry 3 \
          --retry-delay 2 \
          -o clang-r614150.tar.gz \
          "$CLANG_URL"; then

          echo "ERROR: Failed to download AOSP Clang"
          exit 1
        fi

        echo
        echo "========================================"
        echo "VERIFYING CLANG ARCHIVE"
        echo "========================================"

        ls -lh clang-r614150.tar.gz

        test -s clang-r614150.tar.gz

        echo "Testing gzip archive..."

        gzip -t clang-r614150.tar.gz

        echo "Archive integrity: OK"


        # --------------------------------------------------------
        # Extract AOSP Clang
        # --------------------------------------------------------

        echo
        echo "========================================"
        echo "EXTRACTING AOSP CLANG"
        echo "========================================"

        mkdir -p clang

        if ! tar -C clang -xf clang-r614150.tar.gz; then

          echo
          echo "ERROR: AOSP Clang extraction failed"
          echo "Cleaning incomplete extraction..."

          rm -rf clang
          rm -f clang-r614150.tar.gz

          exit 1
        fi

        rm -f clang-r614150.tar.gz


        # --------------------------------------------------------
        # Normalize possible top-level directory
        # --------------------------------------------------------

        if [ ! -d "clang/bin" ]; then

          echo
          echo "Clang archive contains a top-level directory."
          echo "Searching for clang/bin..."

          CLANG_SUBDIR="$(find clang \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | head -n 1)"

          if [ -n "$CLANG_SUBDIR" ] && [ -d "$CLANG_SUBDIR/bin" ]; then

            echo "Found:"
            echo "$CLANG_SUBDIR"

            shopt -s dotglob

            mv "$CLANG_SUBDIR"/* clang/

            rmdir "$CLANG_SUBDIR"

          fi
        fi


        # --------------------------------------------------------
        # Validate Clang
        # --------------------------------------------------------

        echo
        echo "========================================"
        echo "CHECKING AOSP CLANG"
        echo "========================================"

        test -d clang/bin
        test -x clang/bin/clang
        test -x clang/bin/ld.lld

        echo "Clang directory: OK"
        echo "clang binary: OK"
        echo "ld.lld binary: OK"


        # --------------------------------------------------------
        # GCC64
        # --------------------------------------------------------

        echo
        echo "========================================"
        echo "CLONING GCC64"
        echo "========================================"

        rm -rf gcc64

        git clone \
          --depth=1 \
          -b main \
          https://github.com/greenforce-project/gcc-arm64.git \
          gcc64

        test -d gcc64

        echo "GCC64: OK"


        # --------------------------------------------------------
        # GCC32
        # --------------------------------------------------------

        echo
        echo "========================================"
        echo "CLONING GCC32"
        echo "========================================"

        rm -rf gcc32

        git clone \
          --depth=1 \
          -b main \
          https://github.com/greenforce-project/gcc-arm.git \
          gcc32

        test -d gcc32

        echo "GCC32: OK"


        # --------------------------------------------------------
        # Environment
        # --------------------------------------------------------

        echo
        echo "========================================"
        echo "SETTING ENVIRONMENT"
        echo "========================================"

        echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> "$GITHUB_ENV"
        echo "GCC64_PATH=$GITHUB_WORKSPACE/gcc64" >> "$GITHUB_ENV"
        echo "GCC32_PATH=$GITHUB_WORKSPACE/gcc32" >> "$GITHUB_ENV"

        echo "BUILD_TIME=$(TZ=Asia/Jakarta date '+%d%m%Y-%H%M')" >> "$GITHUB_ENV"


        # --------------------------------------------------------
        # PATH
        # --------------------------------------------------------

        export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"


        # --------------------------------------------------------
        # Verify Clang
        # --------------------------------------------------------

        echo
        echo "========================================"
        echo "AOSP CLANG VERSION"
        echo "========================================"

        command -v clang
        clang --version


        # --------------------------------------------------------
        # Verify LLD
        # --------------------------------------------------------

        echo
        echo "========================================"
        echo "LLD VERSION"
        echo "========================================"

        command -v ld.lld
        ld.lld --version


        # --------------------------------------------------------
        # Verify LLVM tools
        # --------------------------------------------------------

        echo
        echo "========================================"
        echo "LLVM TOOLS"
        echo "========================================"

        command -v llvm-ar
        command -v llvm-as
        command -v llvm-nm
        command -v llvm-objcopy
        command -v llvm-objdump
        command -v llvm-strip

        echo "LLVM tools: OK"


        # --------------------------------------------------------
        # GCC64 inspection
        # --------------------------------------------------------

        echo
        echo "========================================"
        echo "GCC64 BINARIES"
        echo "========================================"

        ls -la "$GITHUB_WORKSPACE/gcc64/bin" | head -50


        # --------------------------------------------------------
        # GCC32 inspection
        # --------------------------------------------------------

        echo
        echo "========================================"
        echo "GCC32 BINARIES"
        echo "========================================"

        ls -la "$GITHUB_WORKSPACE/gcc32/bin" | head -50


        echo
        echo "========================================"
        echo "TOOLCHAINS READY"
        echo "========================================"


    # ============================================================
    # 4. Setup NoMount
    # ============================================================

    - name: Setup NoMount
      if: ${{ matrix.build_type == 'KSU-NoMount' || matrix.build_type == 'KSU-SUSFS-NoMount' }}
      run: |
        set -e

        echo "========================================"
        echo "SETTING UP NOMOUNT"
        echo "========================================"

        curl -LSs \
          "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" \
          | bash -

        echo
        echo "========================================"
        echo "NOMOUNT CHECK"
        echo "========================================"

        test -d fs/nomount

        ls -ld fs/nomount

        grep -n "nomount" fs/Makefile || true
        grep -n "nomount" fs/Kconfig || true


    # ============================================================
    # 5. Setup KernelSU-Next
    # ============================================================

    - name: Setup KernelSU-Next
      if: ${{ matrix.build_type != 'Base' }}
      run: |
        set -e

        echo "========================================"
        echo "SETTING UP KERNELSU-NEXT"
        echo "========================================"

        curl -LSs \
          "https://raw.githubusercontent.com/manipvlator/KernelSU-Next/stable/kernel/setup.sh" \
          | bash -s syscall

        echo
        echo "========================================"
        echo "KERNELSU CHECK"
        echo "========================================"

        test -d drivers/kernelsu

        ls -ld drivers/kernelsu

        echo
        grep -n "kernelsu" drivers/Makefile || true

        echo
        grep -n "kernelsu" drivers/Kconfig || true


    # ============================================================
    # 6. Load Original violet-perf defconfig
    # ============================================================

    - name: Load Original violet-perf defconfig
      run: |
        set -e

        export ARCH=arm64

        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo "========================================"
        echo "LOADING ORIGINAL VIOLET-PERF DEFCONFIG"
        echo "========================================"

        make O=out \
          ARCH=arm64 \
          vendor/violet-perf_defconfig

        test -f out/.config


    # ============================================================
    # 7. Configure Matrix
    # ============================================================

    - name: Configure Matrix
      run: |
        set -e

        export ARCH=arm64

        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        BUILD_TYPE="${{ matrix.build_type }}"

        echo "========================================"
        echo "BUILD TYPE"
        echo "$BUILD_TYPE"
        echo "========================================"


        case "$BUILD_TYPE" in

          # ======================================================
          # BASE
          # ======================================================

          Base)

            echo "KernelSU: DISABLED"
            echo "SUSFS: DISABLED"
            echo "NoMount: DISABLED"

            scripts/config \
              --file out/.config \
              --disable CONFIG_KSU \
              --disable CONFIG_KSU_SUSFS \
              --disable CONFIG_NOMOUNT

            DEFCONFIG_NAME="violet-perf-full_defconfig"

            ;;


          # ======================================================
          # KSU
          # ======================================================

          KSU)

            echo "KernelSU: ENABLED"
            echo "SUSFS: DISABLED"
            echo "NoMount: DISABLED"

            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_EXTRAS \
              --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE \
              --enable CONFIG_KSU_LSM_SECURITY_HOOKS \
              --enable CONFIG_KSU_FEATURE_SULOG \
              --enable CONFIG_KSU_FEATURE_ADBROOT \
              --enable CONFIG_KSU_HEURISTIC_IN_TREE_BUILD \
              --disable CONFIG_KSU_SUSFS \
              --disable CONFIG_NOMOUNT \
              --disable CONFIG_KPROBES

            DEFCONFIG_NAME="violet-ksu-full_defconfig"

            ;;


          # ======================================================
          # KSU + NOMOUNT
          # ======================================================

          KSU-NoMount)

            echo "KernelSU: ENABLED"
            echo "SUSFS: DISABLED"
            echo "NoMount: ENABLED"

            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_EXTRAS \
              --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE \
              --enable CONFIG_KSU_LSM_SECURITY_HOOKS \
              --enable CONFIG_KSU_FEATURE_SULOG \
              --enable CONFIG_KSU_FEATURE_ADBROOT \
              --enable CONFIG_KSU_HEURISTIC_IN_TREE_BUILD \
              --disable CONFIG_KSU_SUSFS \
              --enable CONFIG_NOMOUNT \
              --disable CONFIG_KPROBES

            DEFCONFIG_NAME="violet-ksu-nomount-full_defconfig"

            ;;


          # ======================================================
          # KSU + SUSFS
          # ======================================================

          KSU-SUSFS)

            echo "KernelSU: ENABLED"
            echo "SUSFS: ENABLED"
            echo "NoMount: DISABLED"

            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_EXTRAS \
              --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE \
              --enable CONFIG_KSU_LSM_SECURITY_HOOKS \
              --enable CONFIG_KSU_FEATURE_SULOG \
              --enable CONFIG_KSU_FEATURE_ADBROOT \
              --enable CONFIG_KSU_HEURISTIC_IN_TREE_BUILD \
              --enable CONFIG_KSU_SUSFS \
              --disable CONFIG_NOMOUNT \
              --disable CONFIG_KPROBES

            DEFCONFIG_NAME="violet-ksu-susfs-full_defconfig"

            ;;


          # ======================================================
          # KSU + SUSFS + NOMOUNT
          # ======================================================

          KSU-SUSFS-NoMount)

            echo "KernelSU: ENABLED"
            echo "SUSFS: ENABLED"
            echo "NoMount: ENABLED"

            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_EXTRAS \
              --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE \
              --enable CONFIG_KSU_LSM_SECURITY_HOOKS \
              --enable CONFIG_KSU_FEATURE_SULOG \
              --enable CONFIG_KSU_FEATURE_ADBROOT \
              --enable CONFIG_KSU_HEURISTIC_IN_TREE_BUILD \
              --enable CONFIG_KSU_SUSFS \
              --enable CONFIG_NOMOUNT \
              --disable CONFIG_KPROBES

            DEFCONFIG_NAME="violet-ksu-susfs-nomount-full_defconfig"

            ;;


          *)

            echo "ERROR: Unknown build type: $BUILD_TYPE"
            exit 1

            ;;

        esac


        # ========================================================
        # Resolve Kconfig dependencies
        # ========================================================

        echo
        echo "========================================"
        echo "RUNNING OLDDEFCONFIG"
        echo "========================================"

        make O=out \
          ARCH=arm64 \
          olddefconfig


        # ========================================================
        # Final configuration
        # ========================================================

        echo
        echo "========================================"
        echo "FINAL CONFIGURATION"
        echo "========================================"

        echo
        echo "--- KernelSU ---"

        grep -E '^CONFIG_KSU' \
          out/.config || true

        echo
        echo "--- SUSFS ---"

        grep -E '^CONFIG_KSU_SUSFS' \
          out/.config || true

        echo
        echo "--- NoMount ---"

        grep -E '^CONFIG_NOMOUNT' \
          out/.config || true

        echo
        echo "--- KPROBES ---"

        grep -E '^CONFIG_KPROBES' \
          out/.config || true


        # ========================================================
        # SUSFS validation
        # ========================================================

        echo
        echo "========================================"
        echo "SUSFS VALIDATION"
        echo "========================================"

        case "$BUILD_TYPE" in

          KSU|KSU-NoMount)

            if grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
              echo "ERROR: SUSFS MUST BE DISABLED FOR $BUILD_TYPE"
              exit 1
            fi

            echo "OK: SUSFS IS DISABLED"

            ;;


          KSU-SUSFS|KSU-SUSFS-NoMount)

            if grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
              echo "OK: SUSFS IS ENABLED"
            else
              echo "ERROR: SUSFS MUST BE ENABLED FOR $BUILD_TYPE"
              exit 1
            fi

            ;;


          Base)

            if grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
              echo "ERROR: SUSFS MUST BE DISABLED FOR BASE"
              exit 1
            fi

            echo "OK: SUSFS IS DISABLED"

            ;;

        esac


        # ========================================================
        # NoMount validation
        # ========================================================

        echo
        echo "========================================"
        echo "NOMOUNT VALIDATION"
        echo "========================================"

        case "$BUILD_TYPE" in

          KSU-NoMount|KSU-SUSFS-NoMount)

            if grep -q '^CONFIG_NOMOUNT=y' out/.config; then
              echo "OK: NOMOUNT IS ENABLED"
            else
              echo "ERROR: NOMOUNT MUST BE ENABLED FOR $BUILD_TYPE"
              exit 1
            fi

            ;;


          Base|KSU|KSU-SUSFS)

            if grep -q '^CONFIG_NOMOUNT=y' out/.config; then
              echo "ERROR: NOMOUNT MUST BE DISABLED FOR $BUILD_TYPE"
              exit 1
            fi

            echo "OK: NOMOUNT IS DISABLED"

            ;;

        esac


        # ========================================================
        # KPROBES validation
        # ========================================================

        echo
        echo "========================================"
        echo "KPROBES VALIDATION"
        echo "========================================"

        if grep -q '^CONFIG_KPROBES=y' out/.config; then
          echo "ERROR: CONFIG_KPROBES MUST BE DISABLED"
          exit 1
        else
          echo "OK: CONFIG_KPROBES IS NOT ENABLED"
        fi


        # ========================================================
        # Save FULL final configuration
        # ========================================================

        echo
        echo "========================================"
        echo "SAVING FULL FINAL DEFCONFIG"
        echo "========================================"

        cp \
          out/.config \
          "out/${DEFCONFIG_NAME}"


        echo
        echo "========================================"
        echo "FULL FINAL DEFCONFIG"
        echo "========================================"

        ls -lh \
          "out/${DEFCONFIG_NAME}"

        echo
        echo "LINE COUNT:"
        wc -l \
          "out/${DEFCONFIG_NAME}"


        echo
        echo "========================================"
        echo "KERNELSU CONFIG"
        echo "========================================"

        grep -E '^CONFIG_KSU' \
          "out/${DEFCONFIG_NAME}" || true


        echo
        echo "========================================"
        echo "SUSFS CONFIG"
        echo "========================================"

        grep -E '^CONFIG_KSU_SUSFS' \
          "out/${DEFCONFIG_NAME}" || true


        echo
        echo "========================================"
        echo "NOMOUNT CONFIG"
        echo "========================================"

        grep -E '^CONFIG_NOMOUNT' \
          "out/${DEFCONFIG_NAME}" || true


        echo
        echo "========================================"
        echo "FULL FINAL DEFCONFIG READY"
        echo "========================================"


    # ============================================================
    # 8. Upload Full Final Defconfig
    # ============================================================

    - name: Upload Full Final Defconfig Before Build
      uses: actions/upload-artifact@v4
      with:
        name: full-final-defconfig-${{ matrix.build_type }}-${{ env.BUILD_TIME }}
        path: out/*-full_defconfig
        if-no-files-found: error


    # ============================================================
    # 9. Verify Build Configuration
    # ============================================================

    - name: Verify Build Configuration
      run: |
        set -e

        export ARCH=arm64

        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo "========================================"
        echo "VERIFYING ACTIVE BUILD CONFIG"
        echo "========================================"

        test -f out/.config

        echo
        echo "CONFIG LINE COUNT:"
        wc -l out/.config

        echo
        echo "BUILD TYPE:"
        echo "${{ matrix.build_type }}"

        echo
        echo "KERNELSU:"
        grep -E '^CONFIG_KSU' out/.config || true

        echo
        echo "SUSFS:"
        grep -E '^CONFIG_KSU_SUSFS' out/.config || true

        echo
        echo "NOMOUNT:"
        grep -E '^CONFIG_NOMOUNT' out/.config || true

        echo
        echo "KPROBES:"
        grep -E '^CONFIG_KPROBES' out/.config || true


        echo
        echo "========================================"
        echo "BUILD CONFIG READY"
        echo "========================================"


    # ============================================================
    # 10. Verify Cross Compiler
    # ============================================================

    - name: Verify Cross Compiler
      run: |
        set -e

        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo "========================================"
        echo "VERIFYING CROSS COMPILERS"
        echo "========================================"

        echo
        echo "--- GCC64 ---"

        command -v aarch64-linux-android-gcc || true
        command -v aarch64-linux-android-ld || true
        command -v aarch64-linux-android-as || true

        echo
        echo "--- GCC32 ---"

        command -v arm-linux-androideabi-gcc || true
        command -v arm-linux-androideabi-ld || true
        command -v arm-linux-androideabi-as || true

        echo
        echo "========================================"
        echo "CROSS COMPILER PATHS"
        echo "========================================"

        find "$GCC64_PATH/bin" \
          -maxdepth 1 \
          -type f \
          | grep 'aarch64-linux-android' \
          | head -30 || true

        find "$GCC32_PATH/bin" \
          -maxdepth 1 \
          -type f \
          | grep 'arm-linux-androideabi' \
          | head -30 || true

        echo
        echo "========================================"
        echo "CROSS COMPILER CHECK COMPLETE"
        echo "========================================"


    # ============================================================
    # 11. Build Kernel
    #
    # AOSP Clang
    # GCC64 Android 4.9
    # GCC32 Android 4.9
    # ============================================================

    - name: Build Kernel
      run: |
        set -o pipefail

        export ARCH=arm64

        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        export KBUILD_BUILD_USER=Manipulator
        export KBUILD_BUILD_HOST=LineageOS
        export KBUILD_COMPILER_STRING="$CLANG_PATH/bin/clang"


        echo "========================================"
        echo "BUILDING KERNEL"
        echo "========================================"

        echo "BUILD TYPE:"
        echo "${{ matrix.build_type }}"

        echo
        echo "========================================"
        echo "CLANG"
        echo "========================================"

        clang --version

        echo
        echo "========================================"
        echo "LLD"
        echo "========================================"

        ld.lld --version

        echo
        echo "========================================"
        echo "CROSS COMPILE SETTINGS"
        echo "========================================"

        echo "ARCH=arm64"
        echo "LLVM=1"
        echo "LLVM_IAS=1"
        echo "CC=clang"
        echo "LD=ld.lld"
        echo "AR=llvm-ar"
        echo "AS=llvm-as"
        echo "NM=llvm-nm"
        echo "OBJCOPY=llvm-objcopy"
        echo "OBJDUMP=llvm-objdump"
        echo "STRIP=llvm-strip"

        echo
        echo "CROSS_COMPILE=aarch64-linux-android-"
        echo "CROSS_COMPILE_COMPAT=arm-linux-androideabi-"
        echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-"
        echo "CLANG_TRIPLE=aarch64-linux-gnu-"


        echo
        echo "========================================"
        echo "STARTING KERNEL BUILD"
        echo "========================================"


        make -j"$(nproc --all)" \
          O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          AS=llvm-as \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_COMPAT=arm-linux-androideabi- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          2>&1 | tee build.log


    # ============================================================
    # 12. Verify Kernel
    # ============================================================

    - name: Check Build Output
      run: |
        set -e

        echo "========================================"
        echo "CHECKING BUILD"
        echo "========================================"

        test -f out/arch/arm64/boot/Image.gz

        echo
        echo "========================================"
        echo "BUILD SUCCESS"
        echo "========================================"

        echo "TYPE:"
        echo "${{ matrix.build_type }}"

        echo
        echo "KERNEL:"
        ls -lh \
          out/arch/arm64/boot/Image.gz


    # ============================================================
    # 13. Package AnyKernel3
    # ============================================================

    - name: Package AnyKernel3
      run: |
        set -e

        echo "========================================"
        echo "PACKAGING ANYKERNEL3"
        echo "========================================"

        rm -rf AK3

        git clone \
          --depth=1 \
          -b sixteen \
          https://github.com/Joker-V2/AnyKernel3.git \
          AK3

        test -d AK3

        cp \
          out/arch/arm64/boot/Image.gz \
          AK3/


        if [ -f out/arch/arm64/boot/dtbo.img ]; then

          cp \
            out/arch/arm64/boot/dtbo.img \
            AK3/

        fi


        cd AK3

        zip -r9 \
          "../Kernel-violet-${{ matrix.build_type }}-${BUILD_TIME}.zip" \
          *

        cd ..


        echo
        echo "========================================"
        echo "ANYKERNEL3 PACKAGE"
        echo "========================================"

        ls -lh \
          "Kernel-violet-${{ matrix.build_type }}-${BUILD_TIME}.zip"


    # ============================================================
    # 14. Upload Kernel ZIP
    # ============================================================

    - name: Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-violet-${{ matrix.build_type }}-${{ env.BUILD_TIME }}
        path: Kernel-violet-${{ matrix.build_type }}-${{ env.BUILD_TIME }}.zip
        if-no-files-found: error


    # ============================================================
    # 15. Upload Full Active .config
    # ============================================================

    - name: Upload Full Active Config
      uses: actions/upload-artifact@v4
      with:
        name: active-config-${{ matrix.build_type }}-${{ env.BUILD_TIME }}
        path: out/.config
        include-hidden-files: true
        if-no-files-found: error


    # ============================================================
    # 16. Upload Build Log
    # ============================================================

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ matrix.build_type }}-${{ env.BUILD_TIME }}
        path: build.log
        if-no-files-found: warn
