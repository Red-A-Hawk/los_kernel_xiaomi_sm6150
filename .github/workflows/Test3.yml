name: Build Kernel (violet)

on:
  push:
    branches:
      - 16
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Base
          - KSU
          - KSU-NoMount
          - KSU-SUSFS
          - KSU-SUSFS-NoMount

    steps:

    # ============================================================
    # 1. Checkout
    # ============================================================

    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: 16
        fetch-depth: 1


    # ============================================================
    # 2. Dependencies
    # ============================================================

    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          git \
          bc \
          bison \
          flex \
          libssl-dev \
          make \
          zip \
          unzip \
          curl \
          wget \
          libelf-dev \
          libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          python3 \
          jq \
          openjdk-17-jre-headless


    # ============================================================
    # 3. Setup Toolchains
    #
    # AOSP Clang
    # GCC64
    # GCC32
    # ============================================================

    - name: Setup Toolchains
      shell: bash
      run: |
        set -e

        echo "========================================"
        echo "SETTING UP TOOLCHAINS"
        echo "========================================"

        CLANG_ROOT="$GITHUB_WORKSPACE/clang"
        GCC64_ROOT="$GITHUB_WORKSPACE/gcc64"
        GCC32_ROOT="$GITHUB_WORKSPACE/gcc32"

        export CLANG_ROOT
        export GCC64_ROOT
        export GCC32_ROOT

        # --------------------------------------------------------
        # AOSP Clang
        # --------------------------------------------------------

        echo
        echo "========================================"
        echo "DOWNLOADING AOSP CLANG"
        echo "========================================"

        AOSP_URL="$(curl -fsSL \
          https://api.github.com/repos/bachnxuan/aosp_clang_mirror/releases/latest \
          | jq -r '.assets[] | select(.name | endswith(".tar.gz")) | .browser_download_url' \
          | head -n 1)"

        if [ -z "$AOSP_URL" ] || [ "$AOSP_URL" = "null" ]; then
          echo "ERROR: Could not find AOSP Clang release archive"
          exit 1
        fi

        echo "AOSP Clang URL:"
        echo "$AOSP_URL"

        rm -rf "$CLANG_ROOT"
        mkdir -p "$CLANG_ROOT"

        curl -fL \
          --retry 3 \
          --retry-delay 2 \
          -o "$GITHUB_WORKSPACE/aosp-clang.tar.gz" \
          "$AOSP_URL"

        echo
        echo "AOSP Clang archive:"
        ls -lh "$GITHUB_WORKSPACE/aosp-clang.tar.gz"

        echo
        echo "========================================"
        echo "VERIFYING AOSP ARCHIVE"
        echo "========================================"

        tar -tzf "$GITHUB_WORKSPACE/aosp-clang.tar.gz" >/dev/null

        echo "Archive verification: OK"

        echo
        echo "========================================"
        echo "EXTRACTING AOSP CLANG"
        echo "========================================"

        tar \
          --no-same-owner \
          -xzf "$GITHUB_WORKSPACE/aosp-clang.tar.gz" \
          -C "$CLANG_ROOT"

        rm -f "$GITHUB_WORKSPACE/aosp-clang.tar.gz"

        # --------------------------------------------------------
        # Normalize extraction directory.
        #
        # Some archives contain:
        #
        # clang/bin/clang
        #
        # while others contain:
        #
        # bin/clang
        # --------------------------------------------------------

        if [ ! -x "$CLANG_ROOT/bin/clang" ]; then

          FOUND_CLANG="$(find "$CLANG_ROOT" \
            -type f \
            -path "*/bin/clang" \
            -print -quit)"

          if [ -n "$FOUND_CLANG" ]; then

            REAL_ROOT="$(dirname "$(dirname "$FOUND_CLANG")")"

            echo "Detected nested Clang directory:"
            echo "$REAL_ROOT"

            TEMP_CLANG="$GITHUB_WORKSPACE/clang.tmp"

            rm -rf "$TEMP_CLANG"
            mkdir -p "$TEMP_CLANG"

            cp -a "$REAL_ROOT"/. "$TEMP_CLANG"/

            rm -rf "$CLANG_ROOT"
            mv "$TEMP_CLANG" "$CLANG_ROOT"

          fi
        fi

        if [ ! -x "$CLANG_ROOT/bin/clang" ]; then
          echo "ERROR: AOSP Clang was extracted but bin/clang was not found"
          echo
          find "$CLANG_ROOT" -maxdepth 4 -type f | head -100
          exit 1
        fi

        echo "AOSP Clang extraction: OK"


        # --------------------------------------------------------
        # GCC64
        # --------------------------------------------------------

        echo
        echo "========================================"
        echo "CLONING GCC64"
        echo "========================================"

        rm -rf "$GCC64_ROOT"

        git clone \
          --depth=1 \
          https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
          "$GCC64_ROOT"

        if [ ! -d "$GCC64_ROOT/bin" ]; then
          echo "ERROR: GCC64 bin directory not found"
          exit 1
        fi


        # --------------------------------------------------------
        # GCC32
        # --------------------------------------------------------

        echo
        echo "========================================"
        echo "CLONING GCC32"
        echo "========================================"

        rm -rf "$GCC32_ROOT"

        git clone \
          --depth=1 \
          https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
          "$GCC32_ROOT"

        if [ ! -d "$GCC32_ROOT/bin" ]; then
          echo "ERROR: GCC32 bin directory not found"
          exit 1
        fi


        # --------------------------------------------------------
        # Environment
        # --------------------------------------------------------

        echo
        echo "========================================"
        echo "EXPORTING TOOLCHAIN ENVIRONMENT"
        echo "========================================"

        echo "CLANG_PATH=$CLANG_ROOT" >> "$GITHUB_ENV"
        echo "GCC64_PATH=$GCC64_ROOT" >> "$GITHUB_ENV"
        echo "GCC32_PATH=$GCC32_ROOT" >> "$GITHUB_ENV"

        echo "PATH=$CLANG_ROOT/bin:$GCC64_ROOT/bin:$GCC32_ROOT/bin:$PATH" >> "$GITHUB_ENV"

        echo "Toolchains installed successfully."


    # ============================================================
    # 4. Verify Toolchains
    # ============================================================

    - name: Verify Toolchains
      shell: bash
      run: |
        set -e

        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo "========================================"
        echo "TOOLCHAIN VERIFICATION"
        echo "========================================"

        echo
        echo "CLANG"
        echo "----------------------------------------"

        which clang
        clang --version


        echo
        echo "LLD"
        echo "----------------------------------------"

        which ld.lld
        ld.lld --version


        echo
        echo "LLVM AR"
        echo "----------------------------------------"

        which llvm-ar
        llvm-ar --version


        echo
        echo "GCC64"
        echo "----------------------------------------"

        ls -la "$GCC64_PATH/bin"

        echo
        echo "Searching GCC64:"
        find "$GCC64_PATH/bin" \
          -maxdepth 1 \
          -type f \
          \( -name 'aarch64-linux-android-*' -o -name '*aarch64*' \) \
          -print | head -50


        echo
        echo "GCC32"
        echo "----------------------------------------"

        ls -la "$GCC32_PATH/bin"

        echo
        echo "Searching GCC32:"
        find "$GCC32_PATH/bin" \
          -maxdepth 1 \
          -type f \
          \( -name 'arm-linux-androideabi-*' -o -name '*arm*' \) \
          -print | head -50


        echo
        echo "========================================"
        echo "CROSS COMPILE CHECK"
        echo "========================================"

        A64="$GCC64_PATH/bin/aarch64-linux-android-"
        A32="$GCC32_PATH/bin/arm-linux-androideabi-"

        if [ -x "${A64}gcc" ]; then
          echo "GCC64 compiler: OK"
          "${A64}gcc" --version | head -1
        else
          echo "WARNING: aarch64-linux-android-gcc not found"
        fi

        if [ -x "${A32}gcc" ]; then
          echo "GCC32 compiler: OK"
          "${A32}gcc" --version | head -1
        else
          echo "WARNING: arm-linux-androideabi-gcc not found"
        fi


        echo
        echo "========================================"
        echo "FINAL PATH"
        echo "========================================"

        echo "$PATH"


    # ============================================================
    # 5. Setup NoMount
    # ============================================================

    - name: Setup NoMount
      if: ${{ matrix.build_type == 'KSU-NoMount' || matrix.build_type == 'KSU-SUSFS-NoMount' }}
      shell: bash
      run: |
        set -e

        echo "========================================"
        echo "SETTING UP NOMOUNT"
        echo "========================================"

        curl -LSs \
          "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" \
          | bash -

        echo
        echo "========================================"
        echo "NOMOUNT CHECK"
        echo "========================================"

        test -d fs/nomount

        ls -ld fs/nomount

        grep -n "nomount" fs/Makefile || true
        grep -n "nomount" fs/Kconfig || true


    # ============================================================
    # 6. Setup KernelSU-Next
    # ============================================================

    - name: Setup KernelSU-Next
      if: ${{ matrix.build_type != 'Base' }}
      shell: bash
      run: |
        set -e

        echo "========================================"
        echo "SETTING UP KERNELSU-NEXT"
        echo "========================================"

        curl -LSs \
          "https://raw.githubusercontent.com/manipvlator/KernelSU-Next/stable/kernel/setup.sh" \
          | bash -s syscall

        echo
        echo "========================================"
        echo "KERNELSU CHECK"
        echo "========================================"

        test -d drivers/kernelsu

        ls -ld drivers/kernelsu

        echo
        grep -n "kernelsu" drivers/Makefile || true

        echo
        grep -n "kernelsu" drivers/Kconfig || true


    # ============================================================
    # 7. Load Original violet-perf Defconfig
    # ============================================================

    - name: Load Original violet-perf defconfig
      shell: bash
      run: |
        set -e

        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo "========================================"
        echo "LOADING ORIGINAL VIOLET-PERF DEFCONFIG"
        echo "========================================"

        make O=out \
          ARCH=arm64 \
          vendor/violet-perf_defconfig

        test -f out/.config


    # ============================================================
    # 8. Configure Matrix
    # ============================================================

    - name: Configure Matrix
      shell: bash
      run: |
        set -e

        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        BUILD_TYPE="${{ matrix.build_type }}"

        echo "========================================"
        echo "BUILD TYPE"
        echo "$BUILD_TYPE"
        echo "========================================"

        case "$BUILD_TYPE" in

          Base)

            echo "Base kernel"
            echo "KernelSU: DISABLED"
            echo "SUSFS: DISABLED"
            echo "NoMount: DISABLED"

            scripts/config \
              --file out/.config \
              --disable CONFIG_KSU \
              --disable CONFIG_KSU_SUSFS \
              --disable CONFIG_NOMOUNT

            DEFCONFIG_NAME="violet-perf-full_defconfig"

            ;;


          KSU)

            echo "KernelSU-Next"
            echo "SUSFS: DISABLED"
            echo "NoMount: DISABLED"

            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_EXTRAS \
              --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE \
              --enable CONFIG_KSU_LSM_SECURITY_HOOKS \
              --enable CONFIG_KSU_FEATURE_SULOG \
              --enable CONFIG_KSU_FEATURE_ADBROOT \
              --enable CONFIG_KSU_HEURISTIC_IN_TREE_BUILD \
              --disable CONFIG_KSU_SUSFS \
              --disable CONFIG_NOMOUNT \
              --disable CONFIG_KPROBES

            DEFCONFIG_NAME="violet-ksu-full_defconfig"

            ;;


          KSU-NoMount)

            echo "KernelSU-Next"
            echo "SUSFS: DISABLED"
            echo "NoMount: ENABLED"

            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_EXTRAS \
              --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE \
              --enable CONFIG_KSU_LSM_SECURITY_HOOKS \
              --enable CONFIG_KSU_FEATURE_SULOG \
              --enable CONFIG_KSU_FEATURE_ADBROOT \
              --enable CONFIG_KSU_HEURISTIC_IN_TREE_BUILD \
              --disable CONFIG_KSU_SUSFS \
              --enable CONFIG_NOMOUNT \
              --disable CONFIG_KPROBES

            DEFCONFIG_NAME="violet-ksu-nomount-full_defconfig"

            ;;


          KSU-SUSFS)

            echo "KernelSU-Next"
            echo "SUSFS: ENABLED"
            echo "NoMount: DISABLED"

            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_EXTRAS \
              --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE \
              --enable CONFIG_KSU_LSM_SECURITY_HOOKS \
              --enable CONFIG_KSU_FEATURE_SULOG \
              --enable CONFIG_KSU_FEATURE_ADBROOT \
              --enable CONFIG_KSU_HEURISTIC_IN_TREE_BUILD \
              --enable CONFIG_KSU_SUSFS \
              --disable CONFIG_NOMOUNT \
              --disable CONFIG_KPROBES

            DEFCONFIG_NAME="violet-ksu-susfs-full_defconfig"

            ;;


          KSU-SUSFS-NoMount)

            echo "KernelSU-Next"
            echo "SUSFS: ENABLED"
            echo "NoMount: ENABLED"

            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_EXTRAS \
              --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE \
              --enable CONFIG_KSU_LSM_SECURITY_HOOKS \
              --enable CONFIG_KSU_FEATURE_SULOG \
              --enable CONFIG_KSU_FEATURE_ADBROOT \
              --enable CONFIG_KSU_HEURISTIC_IN_TREE_BUILD \
              --enable CONFIG_KSU_SUSFS \
              --enable CONFIG_NOMOUNT \
              --disable CONFIG_KPROBES

            DEFCONFIG_NAME="violet-ksu-susfs-nomount-full_defconfig"

            ;;


          *)

            echo "ERROR: Unknown build type: $BUILD_TYPE"
            exit 1

            ;;

        esac


        echo
        echo "========================================"
        echo "RUNNING OLDDEFCONFIG"
        echo "========================================"

        make O=out \
          ARCH=arm64 \
          olddefconfig


        echo
        echo "========================================"
        echo "FINAL CONFIGURATION"
        echo "========================================"

        echo
        echo "--- KernelSU ---"
        grep -E '^CONFIG_KSU' out/.config || true

        echo
        echo "--- NoMount ---"
        grep -E '^CONFIG_NOMOUNT' out/.config || true

        echo
        echo "--- KPROBES ---"
        grep -E '^CONFIG_KPROBES' out/.config || true


        echo
        echo "========================================"
        echo "SUSFS VALIDATION"
        echo "========================================"

        case "$BUILD_TYPE" in

          KSU|KSU-NoMount)

            if grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
              echo "ERROR: SUSFS MUST BE DISABLED FOR $BUILD_TYPE"
              exit 1
            fi

            echo "OK: SUSFS IS DISABLED"

            ;;


          KSU-SUSFS|KSU-SUSFS-NoMount)

            if grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
              echo "OK: SUSFS IS ENABLED"
            else
              echo "ERROR: SUSFS MUST BE ENABLED FOR $BUILD_TYPE"
              exit 1
            fi

            ;;


          Base)

            if grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
              echo "ERROR: SUSFS MUST BE DISABLED FOR BASE"
              exit 1
            fi

            echo "OK: SUSFS IS DISABLED"

            ;;

        esac


        echo
        echo "========================================"
        echo "NOMOUNT VALIDATION"
        echo "========================================"

        case "$BUILD_TYPE" in

          KSU-NoMount|KSU-SUSFS-NoMount)

            if grep -q '^CONFIG_NOMOUNT=y' out/.config; then
              echo "OK: NOMOUNT IS ENABLED"
            else
              echo "ERROR: NOMOUNT MUST BE ENABLED FOR $BUILD_TYPE"
              exit 1
            fi

            ;;


          Base|KSU|KSU-SUSFS)

            if grep -q '^CONFIG_NOMOUNT=y' out/.config; then
              echo "ERROR: NOMOUNT MUST BE DISABLED FOR $BUILD_TYPE"
              exit 1
            fi

            echo "OK: NOMOUNT IS DISABLED"

            ;;

        esac


        echo
        echo "========================================"
        echo "KPROBES VALIDATION"
        echo "========================================"

        if grep -q '^CONFIG_KPROBES=y' out/.config; then
          echo "ERROR: CONFIG_KPROBES MUST BE DISABLED"
          exit 1
        else
          echo "OK: CONFIG_KPROBES IS NOT ENABLED"
        fi


        echo
        echo "========================================"
        echo "SAVING FULL FINAL DEFCONFIG"
        echo "========================================"

        cp \
          out/.config \
          "out/${DEFCONFIG_NAME}"

        ls -lh \
          "out/${DEFCONFIG_NAME}"

        echo
        echo "LINE COUNT:"
        wc -l \
          "out/${DEFCONFIG_NAME}"

        echo
        echo "KERNELSU CONFIG:"
        grep -E '^CONFIG_KSU' \
          "out/${DEFCONFIG_NAME}" || true

        echo
        echo "SUSFS CONFIG:"
        grep -E '^CONFIG_KSU_SUSFS' \
          "out/${DEFCONFIG_NAME}" || true

        echo
        echo "NOMOUNT CONFIG:"
        grep -E '^CONFIG_NOMOUNT' \
          "out/${DEFCONFIG_NAME}" || true

        echo
        echo "========================================"
        echo "FULL FINAL DEFCONFIG READY"
        echo "========================================"


    # ============================================================
    # 9. Upload Full Final Defconfig
    # ============================================================

    - name: Upload Full Final Defconfig Before Build
      uses: actions/upload-artifact@v4
      with:
        name: full-final-defconfig-${{ matrix.build_type }}-${{ github.run_number }}
        path: out/*-full_defconfig
        if-no-files-found: error


    # ============================================================
    # 10. Verify Active Build Configuration
    # ============================================================

    - name: Verify Build Configuration
      shell: bash
      run: |
        set -e

        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo "========================================"
        echo "VERIFYING ACTIVE BUILD CONFIG"
        echo "========================================"

        test -f out/.config

        echo
        echo "CONFIG LINE COUNT:"
        wc -l out/.config

        echo
        echo "BUILD TYPE:"
        echo "${{ matrix.build_type }}"

        echo
        echo "KERNELSU:"
        grep -E '^CONFIG_KSU' out/.config || true

        echo
        echo "SUSFS:"
        grep -E '^CONFIG_KSU_SUSFS' out/.config || true

        echo
        echo "NOMOUNT:"
        grep -E '^CONFIG_NOMOUNT' out/.config || true

        echo
        echo "========================================"
        echo "BUILD CONFIG READY"
        echo "========================================"


    # ============================================================
    # 11. Build Kernel
    #
    # AOSP Clang + GCC64 + GCC32
    #
    # IMPORTANT:
    # Do NOT use aarch64-elf- here.
    # Do NOT use arm-eabi- here.
    #
    # Use Android GCC prefixes:
    #
    # aarch64-linux-android-
    # arm-linux-androideabi-
    # ============================================================

    - name: Build Kernel
      shell: bash
      run: |
        set -o pipefail

        export ARCH=arm64

        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        export KBUILD_BUILD_USER=Manipulator
        export KBUILD_BUILD_HOST=LineageOS

        export KBUILD_COMPILER_STRING="$CLANG_PATH/bin/clang"

        echo "========================================"
        echo "BUILDING KERNEL"
        echo "========================================"

        echo "BUILD TYPE:"
        echo "${{ matrix.build_type }}"

        echo
        echo "========================================"
        echo "COMPILERS"
        echo "========================================"

        which clang
        clang --version | head -3

        echo
        which ld.lld
        ld.lld --version | head -1

        echo
        echo "========================================"
        echo "CROSS COMPILE"
        echo "========================================"

        echo "CROSS_COMPILE:"
        echo "aarch64-linux-android-"

        echo "CROSS_COMPILE_COMPAT:"
        echo "arm-linux-androideabi-"

        echo "CROSS_COMPILE_ARM32:"
        echo "arm-linux-androideabi-"

        echo
        echo "========================================"
        echo "MAKE"
        echo "========================================"

        make \
          -j"$(nproc --all)" \
          O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_COMPAT=arm-linux-androideabi- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          2>&1 | tee build.log

        BUILD_STATUS=${PIPESTATUS[0]}

        echo
        echo "========================================"
        echo "MAKE EXIT CODE"
        echo "========================================"

        echo "$BUILD_STATUS"

        if [ "$BUILD_STATUS" -ne 0 ]; then
          echo
          echo "========================================"
          echo "KERNEL BUILD FAILED"
          echo "========================================"

          exit "$BUILD_STATUS"
        fi

        echo
        echo "========================================"
        echo "KERNEL BUILD FINISHED"
        echo "========================================"


    # ============================================================
    # 12. Check Build Output
    # ============================================================

    - name: Check Build Output
      shell: bash
      run: |
        set -e

        echo "========================================"
        echo "CHECKING BUILD"
        echo "========================================"

        test -f out/arch/arm64/boot/Image.gz

        echo
        echo "========================================"
        echo "BUILD SUCCESS"
        echo "========================================"

        echo "TYPE:"
        echo "${{ matrix.build_type }}"

        echo
        ls -lh \
          out/arch/arm64/boot/Image.gz


    # ============================================================
    # 13. Package AnyKernel3
    # ============================================================

    - name: Package AnyKernel3
      shell: bash
      run: |
        set -e

        echo "========================================"
        echo "PACKAGING ANYKERNEL3"
        echo "========================================"

        git clone \
          --depth=1 \
          -b sixteen \
          https://github.com/Joker-V2/AnyKernel3.git \
          AK3

        cp \
          out/arch/arm64/boot/Image.gz \
          AK3/

        if [ -f out/arch/arm64/boot/dtbo.img ]; then
          cp \
            out/arch/arm64/boot/dtbo.img \
            AK3/
        fi

        cd AK3

        zip -r9 \
          "../Kernel-violet-${{ matrix.build_type }}-${{ github.run_number }}.zip" \
          *

        cd ..

        echo
        ls -lh \
          "Kernel-violet-${{ matrix.build_type }}-${{ github.run_number }}.zip"


    # ============================================================
    # 14. Upload Kernel ZIP
    # ============================================================

    - name: Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-violet-${{ matrix.build_type }}-${{ github.run_number }}
        path: Kernel-violet-${{ matrix.build_type }}-${{ github.run_number }}.zip
        if-no-files-found: error


    # ============================================================
    # 15. Upload Full Active Config
    # ============================================================

    - name: Upload Full Active Config
      uses: actions/upload-artifact@v4
      with:
        name: active-config-${{ matrix.build_type }}-${{ github.run_number }}
        path: out/.config
        include-hidden-files: true
        if-no-files-found: error


    # ============================================================
    # 16. Upload Build Log
    # ============================================================

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ matrix.build_type }}-${{ github.run_number }}
        path: build.log
        if-no-files-found: warn
