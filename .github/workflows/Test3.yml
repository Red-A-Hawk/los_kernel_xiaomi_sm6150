name: Build Kernel (violet)

on:
  push:
    branches:
      - 16
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Base
          - KSU
          - KSU-NoMount
          - KSU-SUSFS
          - KSU-SUSFS-NoMount

    steps:

    # ============================================================
    # 1. Checkout
    # ============================================================

    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: 16
        fetch-depth: 1


    # ============================================================
    # 2. Dependencies
    # ============================================================

    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          git \
          bc \
          bison \
          flex \
          libssl-dev \
          make \
          zip \
          unzip \
          curl \
          wget \
          libelf-dev \
          libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          python3 \
          jq \
          openjdk-17-jre-headless


    # ============================================================
    # 3. Toolchains
    #
    # AOSP Clang
    # LineageOS GCC 4.9 AArch64
    # LineageOS GCC 4.9 ARM32
    # ============================================================

    - name: Clone Toolchains
      run: |
        echo "========================================"
        echo "SETTING UP TOOLCHAINS"
        echo "========================================"

        # --------------------------------------------------------
        # AOSP Clang Latest
        # --------------------------------------------------------

        echo
        echo "Downloading latest AOSP Clang..."

        AOSP_CLANG_URL=$(curl -fsSL \
          https://api.github.com/repos/bachnxuan/aosp_clang_mirror/releases/latest \
          | jq -r '
              .assets[]
              | select(.browser_download_url | test("\\.(tar\\.gz|tgz)$"))
              | .browser_download_url
            ' \
          | head -n 1)

        if [ -z "$AOSP_CLANG_URL" ] || [ "$AOSP_CLANG_URL" = "null" ]; then
          echo "ERROR: Failed to obtain AOSP Clang download URL"
          exit 1
        fi

        echo "AOSP Clang URL:"
        echo "$AOSP_CLANG_URL"

        mkdir -p clang

        curl -fL \
          "$AOSP_CLANG_URL" \
          -o clang.tar.gz

        echo
        echo "Extracting AOSP Clang..."

        tar -xzf clang.tar.gz \
          -C clang \
          --strip-components=1

        rm -f clang.tar.gz

        test -x clang/bin/clang
        test -x clang/bin/ld.lld

        echo "AOSP Clang installed successfully."


        # --------------------------------------------------------
        # LineageOS GCC64
        # --------------------------------------------------------

        echo
        echo "Cloning LineageOS GCC64..."

        git clone \
          https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
          --depth=1 \
          gcc64

        test -x gcc64/bin/aarch64-linux-android-gcc

        echo "GCC64 installed successfully."


        # --------------------------------------------------------
        # LineageOS GCC32
        # --------------------------------------------------------

        echo
        echo "Cloning LineageOS GCC32..."

        git clone \
          https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
          --depth=1 \
          gcc32

        test -x gcc32/bin/arm-linux-androideabi-gcc

        echo "GCC32 installed successfully."


        echo
        echo "========================================"
        echo "TOOLCHAINS READY"
        echo "========================================"


    # ============================================================
    # 4. Environment
    # ============================================================

    - name: Setup Environment
      run: |
        echo "BUILD_TIME=$(TZ=Asia/Jakarta date '+%d%m%Y-%H%M')" >> "$GITHUB_ENV"

        echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> "$GITHUB_ENV"
        echo "GCC64_PATH=$GITHUB_WORKSPACE/gcc64" >> "$GITHUB_ENV"
        echo "GCC32_PATH=$GITHUB_WORKSPACE/gcc32" >> "$GITHUB_ENV"


    # ============================================================
    # 5. Verify toolchains
    # ============================================================

    - name: Verify toolchains
      run: |
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo "========================================"
        echo "AOSP CLANG"
        echo "========================================"

        which clang
        clang --version

        echo
        echo "========================================"
        echo "LLD"
        echo "========================================"

        which ld.lld
        ld.lld --version

        echo
        echo "========================================"
        echo "LLVM TOOLS"
        echo "========================================"

        which llvm-ar
        which llvm-as
        which llvm-nm
        which llvm-objcopy
        which llvm-objdump
        which llvm-strip

        echo
        echo "========================================"
        echo "GCC64"
        echo "========================================"

        test -x "$GCC64_PATH/bin/aarch64-linux-android-gcc"

        "$GCC64_PATH/bin/aarch64-linux-android-gcc" \
          --version | head -n 1

        echo
        echo "========================================"
        echo "GCC32"
        echo "========================================"

        test -x "$GCC32_PATH/bin/arm-linux-androideabi-gcc"

        "$GCC32_PATH/bin/arm-linux-androideabi-gcc" \
          --version | head -n 1

        echo
        echo "========================================"
        echo "CROSS COMPILE TOOLS"
        echo "========================================"

        echo "AARCH64:"
        ls -l "$GCC64_PATH/bin/aarch64-linux-android-"* | head -n 20

        echo
        echo "ARM32:"
        ls -l "$GCC32_PATH/bin/arm-linux-androideabi-"* | head -n 20

        echo
        echo "========================================"
        echo "TOOLCHAIN VERIFICATION PASSED"
        echo "========================================"


    # ============================================================
    # 6. Setup NoMount
    #
    # Only installed for NoMount variants.
    # ============================================================

    - name: Setup NoMount
      if: ${{ matrix.build_type == 'KSU-NoMount' || matrix.build_type == 'KSU-SUSFS-NoMount' }}
      run: |
        echo "========================================"
        echo "SETTING UP NOMOUNT"
        echo "========================================"

        curl -LSs \
          "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" \
          | bash -

        echo
        echo "========================================"
        echo "NOMOUNT CHECK"
        echo "========================================"

        test -d fs/nomount

        ls -ld fs/nomount

        grep -n "nomount" fs/Makefile || true
        grep -n "nomount" fs/Kconfig || true


    # ============================================================
    # 7. Setup KernelSU-Next
    #
    # syscall is intentionally used for ALL KSU variants.
    # Base does not install KernelSU.
    # ============================================================

    - name: Setup KernelSU-Next
      if: ${{ matrix.build_type != 'Base' }}
      run: |
        echo "========================================"
        echo "SETTING UP KERNELSU-NEXT"
        echo "========================================"

        curl -LSs \
          "https://raw.githubusercontent.com/manipvlator/KernelSU-Next/stable/kernel/setup.sh" \
          | bash -s syscall

        echo
        echo "========================================"
        echo "KERNELSU CHECK"
        echo "========================================"

        test -d drivers/kernelsu

        ls -ld drivers/kernelsu

        echo
        grep -n "kernelsu" drivers/Makefile || true

        echo
        grep -n "kernelsu" drivers/Kconfig || true


    # ============================================================
    # 8. Load Original violet-perf defconfig
    # ============================================================

    - name: Load Original violet-perf defconfig
      run: |
        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo "========================================"
        echo "LOADING ORIGINAL VIOLET-PERF DEFCONFIG"
        echo "========================================"

        make O=out \
          ARCH=arm64 \
          vendor/violet-perf_defconfig

        test -f out/.config


    # ============================================================
    # 9. Configure Matrix
    # ============================================================

    - name: Configure Matrix
      run: |
        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        BUILD_TYPE="${{ matrix.build_type }}"

        echo "========================================"
        echo "BUILD TYPE"
        echo "$BUILD_TYPE"
        echo "========================================"

        case "$BUILD_TYPE" in

          # ------------------------------------------------------
          # BASE
          # ------------------------------------------------------

          Base)

            echo "Base kernel"
            echo "KernelSU: DISABLED"
            echo "SUSFS: DISABLED"
            echo "NoMount: DISABLED"

            scripts/config \
              --file out/.config \
              --disable CONFIG_KSU \
              --disable CONFIG_KSU_SUSFS \
              --disable CONFIG_NOMOUNT

            DEFCONFIG_NAME="violet-perf-full_defconfig"

            ;;


          # ------------------------------------------------------
          # KSU
          # ------------------------------------------------------

          KSU)

            echo "KernelSU-Next"
            echo "SUSFS: DISABLED"
            echo "NoMount: DISABLED"

            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_EXTRAS \
              --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE \
              --enable CONFIG_KSU_LSM_SECURITY_HOOKS \
              --enable CONFIG_KSU_FEATURE_SULOG \
              --enable CONFIG_KSU_FEATURE_ADBROOT \
              --enable CONFIG_KSU_HEURISTIC_IN_TREE_BUILD \
              --disable CONFIG_KSU_SUSFS \
              --disable CONFIG_NOMOUNT \
              --disable CONFIG_KPROBES

            DEFCONFIG_NAME="violet-ksu-full_defconfig"

            ;;


          # ------------------------------------------------------
          # KSU + NOMOUNT
          # ------------------------------------------------------

          KSU-NoMount)

            echo "KernelSU-Next"
            echo "SUSFS: DISABLED"
            echo "NoMount: ENABLED"

            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_EXTRAS \
              --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE \
              --enable CONFIG_KSU_LSM_SECURITY_HOOKS \
              --enable CONFIG_KSU_FEATURE_SULOG \
              --enable CONFIG_KSU_FEATURE_ADBROOT \
              --enable CONFIG_KSU_HEURISTIC_IN_TREE_BUILD \
              --disable CONFIG_KSU_SUSFS \
              --enable CONFIG_NOMOUNT \
              --disable CONFIG_KPROBES

            DEFCONFIG_NAME="violet-ksu-nomount-full_defconfig"

            ;;


          # ------------------------------------------------------
          # KSU + SUSFS
          # ------------------------------------------------------

          KSU-SUSFS)

            echo "KernelSU-Next"
            echo "SUSFS: ENABLED"
            echo "NoMount: DISABLED"

            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_EXTRAS \
              --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE \
              --enable CONFIG_KSU_LSM_SECURITY_HOOKS \
              --enable CONFIG_KSU_FEATURE_SULOG \
              --enable CONFIG_KSU_FEATURE_ADBROOT \
              --enable CONFIG_KSU_HEURISTIC_IN_TREE_BUILD \
              --enable CONFIG_KSU_SUSFS \
              --disable CONFIG_NOMOUNT \
              --disable CONFIG_KPROBES

            DEFCONFIG_NAME="violet-ksu-susfs-full_defconfig"

            ;;


          # ------------------------------------------------------
          # KSU + SUSFS + NOMOUNT
          # ------------------------------------------------------

          KSU-SUSFS-NoMount)

            echo "KernelSU-Next"
            echo "SUSFS: ENABLED"
            echo "NoMount: ENABLED"

            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_EXTRAS \
              --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE \
              --enable CONFIG_KSU_LSM_SECURITY_HOOKS \
              --enable CONFIG_KSU_FEATURE_SULOG \
              --enable CONFIG_KSU_FEATURE_ADBROOT \
              --enable CONFIG_KSU_HEURISTIC_IN_TREE_BUILD \
              --enable CONFIG_KSU_SUSFS \
              --enable CONFIG_NOMOUNT \
              --disable CONFIG_KPROBES

            DEFCONFIG_NAME="violet-ksu-susfs-nomount-full_defconfig"

            ;;


          *)

            echo "ERROR: Unknown build type: $BUILD_TYPE"
            exit 1

            ;;

        esac


        # ========================================================
        # Resolve Kconfig dependencies
        # ========================================================

        echo
        echo "========================================"
        echo "RUNNING OLDDEFCONFIG"
        echo "========================================"

        make O=out \
          ARCH=arm64 \
          olddefconfig


        # ========================================================
        # Verify final configuration
        # ========================================================

        echo
        echo "========================================"
        echo "FINAL CONFIGURATION"
        echo "========================================"

        echo
        echo "--- KernelSU ---"

        grep -E '^CONFIG_KSU' \
          out/.config || true

        echo
        echo "--- NoMount ---"

        grep -E '^CONFIG_NOMOUNT' \
          out/.config || true

        echo
        echo "--- KPROBES ---"

        grep -E '^CONFIG_KPROBES' \
          out/.config || true


        # ========================================================
        # SUSFS validation
        # ========================================================

        echo
        echo "========================================"
        echo "SUSFS VALIDATION"
        echo "========================================"

        case "$BUILD_TYPE" in

          KSU|KSU-NoMount)

            if grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
              echo "ERROR: SUSFS MUST BE DISABLED FOR $BUILD_TYPE"
              exit 1
            fi

            echo "OK: SUSFS IS DISABLED"

            ;;


          KSU-SUSFS|KSU-SUSFS-NoMount)

            if grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
              echo "OK: SUSFS IS ENABLED"
            else
              echo "ERROR: SUSFS MUST BE ENABLED FOR $BUILD_TYPE"
              exit 1
            fi

            ;;


          Base)

            if grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
              echo "ERROR: SUSFS MUST BE DISABLED FOR BASE"
              exit 1
            fi

            echo "OK: SUSFS IS DISABLED"

            ;;

        esac


        # ========================================================
        # NoMount validation
        # ========================================================

        echo
        echo "========================================"
        echo "NOMOUNT VALIDATION"
        echo "========================================"

        case "$BUILD_TYPE" in

          KSU-NoMount|KSU-SUSFS-NoMount)

            if grep -q '^CONFIG_NOMOUNT=y' out/.config; then
              echo "OK: NOMOUNT IS ENABLED"
            else
              echo "ERROR: NOMOUNT MUST BE ENABLED FOR $BUILD_TYPE"
              exit 1
            fi

            ;;


          Base|KSU|KSU-SUSFS)

            if grep -q '^CONFIG_NOMOUNT=y' out/.config; then
              echo "ERROR: NOMOUNT MUST BE DISABLED FOR $BUILD_TYPE"
              exit 1
            fi

            echo "OK: NOMOUNT IS DISABLED"

            ;;

        esac


        # ========================================================
        # KPROBES validation
        # ========================================================

        echo
        echo "========================================"
        echo "KPROBES VALIDATION"
        echo "========================================"

        if grep -q '^CONFIG_KPROBES=y' out/.config; then
          echo "ERROR: CONFIG_KPROBES MUST BE DISABLED"
          exit 1
        else
          echo "OK: CONFIG_KPROBES IS NOT ENABLED"
        fi


        # ========================================================
        # Save FULL final configuration
        #
        # This is the complete active .config.
        # It is NOT savedefconfig.
        # ========================================================

        echo
        echo "========================================"
        echo "SAVING FULL FINAL DEFCONFIG"
        echo "========================================"

        cp \
          out/.config \
          "out/${DEFCONFIG_NAME}"


        echo
        echo "========================================"
        echo "FULL FINAL DEFCONFIG"
        echo "========================================"

        ls -lh \
          "out/${DEFCONFIG_NAME}"


        echo
        echo "========================================"
        echo "LINE COUNT"
        echo "========================================"

        wc -l \
          "out/${DEFCONFIG_NAME}"


        echo
        echo "========================================"
        echo "KERNELSU CONFIG"
        echo "========================================"

        grep -E '^CONFIG_KSU' \
          "out/${DEFCONFIG_NAME}" || true


        echo
        echo "========================================"
        echo "SUSFS CONFIG"
        echo "========================================"

        grep -E '^CONFIG_KSU_SUSFS' \
          "out/${DEFCONFIG_NAME}" || true


        echo
        echo "========================================"
        echo "NOMOUNT CONFIG"
        echo "========================================"

        grep -E '^CONFIG_NOMOUNT' \
          "out/${DEFCONFIG_NAME}" || true


        echo
        echo "========================================"
        echo "FULL FINAL DEFCONFIG READY"
        echo "========================================"


    # ============================================================
    # 10. Upload Full Final Defconfig BEFORE BUILD
    # ============================================================

    - name: Upload Full Final Defconfig Before Build
      uses: actions/upload-artifact@v4
      with:
        name: full-final-defconfig-${{ matrix.build_type }}-${{ env.BUILD_TIME }}
        path: out/*-full_defconfig
        if-no-files-found: error


    # ============================================================
    # 11. Verify the exact config used for build
    # ============================================================

    - name: Verify Build Configuration
      run: |
        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo "========================================"
        echo "VERIFYING ACTIVE BUILD CONFIG"
        echo "========================================"

        test -f out/.config

        echo
        echo "CONFIG LINE COUNT:"
        wc -l out/.config

        echo
        echo "BUILD TYPE:"
        echo "${{ matrix.build_type }}"

        echo
        echo "KERNELSU:"
        grep -E '^CONFIG_KSU' out/.config || true

        echo
        echo "SUSFS:"
        grep -E '^CONFIG_KSU_SUSFS' out/.config || true

        echo
        echo "NOMOUNT:"
        grep -E '^CONFIG_NOMOUNT' out/.config || true

        echo
        echo "========================================"
        echo "BUILD CONFIG READY"
        echo "========================================"


    # ============================================================
    # 12. Build Kernel
    # ============================================================

    - name: Build Kernel
      run: |
        export ARCH=arm64

        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        export KBUILD_BUILD_USER=Manipulator
        export KBUILD_BUILD_HOST=LineageOS
        export KBUILD_COMPILER_STRING="$CLANG_PATH/bin/clang"

        echo "========================================"
        echo "BUILDING KERNEL"
        echo "========================================"

        echo "BUILD TYPE: ${{ matrix.build_type }}"

        echo
        echo "========================================"
        echo "TOOLCHAIN"
        echo "========================================"

        clang --version | head -n 1
        ld.lld --version | head -n 1

        echo
        echo "========================================"
        echo "CROSS COMPILE"
        echo "========================================"

        echo "CROSS_COMPILE=aarch64-linux-android-"
        echo "CROSS_COMPILE_COMPAT=arm-linux-androideabi-"
        echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-"
        echo "CLANG_TRIPLE=aarch64-linux-gnu-"

        echo
        echo "========================================"
        echo "STARTING BUILD"
        echo "========================================"

        make -j$(nproc --all) \
          O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          AS=llvm-as \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_COMPAT=arm-linux-androideabi- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          2>&1 | tee build.log


    # ============================================================
    # 13. Verify Kernel
    # ============================================================

    - name: Check Build Output
      run: |
        echo "========================================"
        echo "CHECKING BUILD"
        echo "========================================"

        test -f out/arch/arm64/boot/Image.gz

        echo
        echo "========================================"
        echo "BUILD SUCCESS"
        echo "========================================"

        echo "TYPE: ${{ matrix.build_type }}"

        ls -lh \
          out/arch/arm64/boot/Image.gz


    # ============================================================
    # 14. Package AnyKernel3
    # ============================================================

    - name: Package AnyKernel3
      run: |
        echo "========================================"
        echo "PACKAGING ANYKERNEL3"
        echo "========================================"

        git clone \
          --depth=1 \
          -b sixteen \
          https://github.com/Joker-V2/AnyKernel3.git \
          AK3

        cp \
          out/arch/arm64/boot/Image.gz \
          AK3/

        if [ -f out/arch/arm64/boot/dtbo.img ]; then
          cp \
            out/arch/arm64/boot/dtbo.img \
            AK3/
        fi

        cd AK3

        zip -r9 \
          "../Kernel-violet-${{ matrix.build_type }}-${BUILD_TIME}.zip" \
          *

        cd ..

        echo
        ls -lh \
          "Kernel-violet-${{ matrix.build_type }}-${BUILD_TIME}.zip"


    # ============================================================
    # 15. Upload Kernel ZIP
    # ============================================================

    - name: Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-violet-${{ matrix.build_type }}-${{ env.BUILD_TIME }}
        path: Kernel-violet-${{ matrix.build_type }}-${{ env.BUILD_TIME }}.zip
        if-no-files-found: error


    # ============================================================
    # 16. Upload Full Active .config
    #
    # IMPORTANT:
    # .config is a hidden file.
    # include-hidden-files is required by upload-artifact@v4.
    # ============================================================

    - name: Upload Full Active Config
      uses: actions/upload-artifact@v4
      with:
        name: active-config-${{ matrix.build_type }}-${{ env.BUILD_TIME }}
        path: out/.config
        include-hidden-files: true
        if-no-files-found: error


    # ============================================================
    # 17. Upload Build Log
    # ============================================================

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ matrix.build_type }}-${{ env.BUILD_TIME }}
        path: build.log
        if-no-files-found: warn
