name: Build Kernel (violet)

on:
  push:
    branches:
      - 16
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Base
          - KSU
          - KSU-NoMount
          - KSU-SUSFS
          - KSU-SUSFS-NoMount

    steps:

    # ============================================================
    # 1. Checkout
    # ============================================================

    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: 16
        fetch-depth: 1


    # ============================================================
    # 2. Dependencies
    # ============================================================

    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          git \
          bc \
          bison \
          flex \
          libssl-dev \
          make \
          zip \
          unzip \
          curl \
          wget \
          libelf-dev \
          libncurses-dev \
          python3 \
          openjdk-17-jre-headless


    # ============================================================
    # 3. AOSP Clang Only
    # ============================================================

    - name: Setup AOSP Clang
      run: |
        set -e

        echo "========================================"
        echo "SETTING UP AOSP CLANG ONLY"
        echo "========================================"

        rm -rf clang

        echo
        echo "========================================"
        echo "DOWNLOADING AOSP CLANG"
        echo "========================================"

        TC_URL=$(curl -fsSL \
          https://api.github.com/repos/bachnxuan/aosp_clang_mirror/releases/latest \
          | grep '"browser_download_url"' \
          | head -n 1 \
          | cut -d '"' -f 4)

        if [ -z "$TC_URL" ]; then
          echo "ERROR: Failed to obtain AOSP Clang download URL"
          exit 1
        fi

        echo "AOSP CLANG URL:"
        echo "$TC_URL"

        echo
        echo "========================================"
        echo "DOWNLOAD"
        echo "========================================"

        curl -L \
          --fail \
          --retry 3 \
          -o clang.tar.gz \
          "$TC_URL"

        echo
        echo "========================================"
        echo "EXTRACTING CLANG"
        echo "========================================"

        mkdir -p clang

        if ! tar \
          -C clang \
          -xf clang.tar.gz; then

          echo "ERROR: Clang extraction failed"
          rm -rf clang clang.tar.gz
          exit 1
        fi

        rm -f clang.tar.gz

        echo
        echo "========================================"
        echo "CLANG DIRECTORY"
        echo "========================================"

        ls -la clang

        if [ ! -d clang/bin ]; then
          echo "ERROR: clang/bin does not exist"
          exit 1
        fi

        echo
        echo "AOSP CLANG SETUP COMPLETE"


    # ============================================================
    # 4. Environment
    # ============================================================

    - name: Setup Environment
      run: |
        echo "BUILD_TIME=$(TZ=Asia/Jakarta date '+%d%m%Y-%H%M')" >> "$GITHUB_ENV"

        echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> "$GITHUB_ENV"

        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
        echo "CROSS_COMPILE_COMPAT=arm-linux-gnueabi-" >> "$GITHUB_ENV"
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"


    # ============================================================
    # 5. Verify AOSP Clang
    # ============================================================

    - name: Verify AOSP Clang
      run: |
        set -e

        export PATH="$CLANG_PATH/bin:$PATH"

        echo "========================================"
        echo "VERIFYING AOSP CLANG"
        echo "========================================"

        echo
        echo "========================================"
        echo "CLANG"
        echo "========================================"

        which clang
        clang --version

        echo
        echo "========================================"
        echo "LLD"
        echo "========================================"

        which ld.lld
        ld.lld --version

        echo
        echo "========================================"
        echo "LLVM TOOLS"
        echo "========================================"

        which llvm-ar
        which llvm-nm
        which llvm-objcopy
        which llvm-objdump
        which llvm-strip

        echo
        echo "========================================"
        echo "AOSP CLANG ONLY"
        echo "========================================"

        echo "CLANG_PATH=$CLANG_PATH"
        echo "CROSS_COMPILE=$CROSS_COMPILE"
        echo "CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT"
        echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"


    # ============================================================
    # 6. Setup NoMount
    # ============================================================

    - name: Setup NoMount
      if: ${{ matrix.build_type == 'KSU-NoMount' || matrix.build_type == 'KSU-SUSFS-NoMount' }}
      run: |
        set -e

        echo "========================================"
        echo "SETTING UP NOMOUNT"
        echo "========================================"

        curl -LSs \
          "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" \
          | bash -

        echo
        echo "========================================"
        echo "NOMOUNT CHECK"
        echo "========================================"

        test -d fs/nomount

        ls -ld fs/nomount

        grep -n "nomount" fs/Makefile || true
        grep -n "nomount" fs/Kconfig || true


    # ============================================================
    # 7. Setup KernelSU-Next
    # ============================================================

    - name: Setup KernelSU-Next
      if: ${{ matrix.build_type != 'Base' }}
      run: |
        set -e

        echo "========================================"
        echo "SETTING UP KERNELSU-NEXT"
        echo "========================================"

        curl -LSs \
          "https://raw.githubusercontent.com/manipvlator/KernelSU-Next/stable/kernel/setup.sh" \
          | bash -s syscall

        echo
        echo "========================================"
        echo "KERNELSU CHECK"
        echo "========================================"

        test -d drivers/kernelsu

        ls -ld drivers/kernelsu

        echo
        grep -n "kernelsu" drivers/Makefile || true

        echo
        grep -n "kernelsu" drivers/Kconfig || true


    # ============================================================
    # 8. Load Original violet-perf defconfig
    # ============================================================

    - name: Load Original violet-perf defconfig
      run: |
        set -e

        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$PATH"

        echo "========================================"
        echo "LOADING ORIGINAL VIOLET-PERF DEFCONFIG"
        echo "========================================"

        make O=out \
          ARCH=arm64 \
          vendor/violet-perf_defconfig

        test -f out/.config


    # ============================================================
    # 9. Configure Matrix
    # ============================================================

    - name: Configure Matrix
      run: |
        set -e

        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$PATH"

        BUILD_TYPE="${{ matrix.build_type }}"

        echo "========================================"
        echo "BUILD TYPE"
        echo "$BUILD_TYPE"
        echo "========================================"

        case "$BUILD_TYPE" in

          Base)

            echo "Base kernel"
            echo "KernelSU: DISABLED"
            echo "SUSFS: DISABLED"
            echo "NoMount: DISABLED"

            scripts/config \
              --file out/.config \
              --disable CONFIG_KSU \
              --disable CONFIG_KSU_SUSFS \
              --disable CONFIG_NOMOUNT

            DEFCONFIG_NAME="violet-perf-full_defconfig"

            ;;


          KSU)

            echo "KernelSU-Next"
            echo "SUSFS: DISABLED"
            echo "NoMount: DISABLED"

            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_EXTRAS \
              --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE \
              --enable CONFIG_KSU_LSM_SECURITY_HOOKS \
              --enable CONFIG_KSU_FEATURE_SULOG \
              --enable CONFIG_KSU_FEATURE_ADBROOT \
              --enable CONFIG_KSU_HEURISTIC_IN_TREE_BUILD \
              --disable CONFIG_KSU_SUSFS \
              --disable CONFIG_NOMOUNT \
              --disable CONFIG_KPROBES

            DEFCONFIG_NAME="violet-ksu-full_defconfig"

            ;;


          KSU-NoMount)

            echo "KernelSU-Next"
            echo "SUSFS: DISABLED"
            echo "NoMount: ENABLED"

            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_EXTRAS \
              --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE \
              --enable CONFIG_KSU_LSM_SECURITY_HOOKS \
              --enable CONFIG_KSU_FEATURE_SULOG \
              --enable CONFIG_KSU_FEATURE_ADBROOT \
              --enable CONFIG_KSU_HEURISTIC_IN_TREE_BUILD \
              --disable CONFIG_KSU_SUSFS \
              --enable CONFIG_NOMOUNT \
              --disable CONFIG_KPROBES

            DEFCONFIG_NAME="violet-ksu-nomount-full_defconfig"

            ;;


          KSU-SUSFS)

            echo "KernelSU-Next"
            echo "SUSFS: ENABLED"
            echo "NoMount: DISABLED"

            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_EXTRAS \
              --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE \
              --enable CONFIG_KSU_LSM_SECURITY_HOOKS \
              --enable CONFIG_KSU_FEATURE_SULOG \
              --enable CONFIG_KSU_FEATURE_ADBROOT \
              --enable CONFIG_KSU_HEURISTIC_IN_TREE_BUILD \
              --enable CONFIG_KSU_SUSFS \
              --disable CONFIG_NOMOUNT \
              --disable CONFIG_KPROBES

            DEFCONFIG_NAME="violet-ksu-susfs-full_defconfig"

            ;;


          KSU-SUSFS-NoMount)

            echo "KernelSU-Next"
            echo "SUSFS: ENABLED"
            echo "NoMount: ENABLED"

            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_EXTRAS \
              --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE \
              --enable CONFIG_KSU_LSM_SECURITY_HOOKS \
              --enable CONFIG_KSU_FEATURE_SULOG \
              --enable CONFIG_KSU_FEATURE_ADBROOT \
              --enable CONFIG_KSU_HEURISTIC_IN_TREE_BUILD \
              --enable CONFIG_KSU_SUSFS \
              --enable CONFIG_NOMOUNT \
              --disable CONFIG_KPROBES

            DEFCONFIG_NAME="violet-ksu-susfs-nomount-full_defconfig"

            ;;


          *)

            echo "ERROR: Unknown build type: $BUILD_TYPE"
            exit 1

            ;;

        esac


        echo
        echo "========================================"
        echo "RUNNING OLDDEFCONFIG"
        echo "========================================"

        make O=out \
          ARCH=arm64 \
          olddefconfig


        echo
        echo "========================================"
        echo "FINAL CONFIGURATION"
        echo "========================================"

        echo
        echo "--- KernelSU ---"

        grep -E '^CONFIG_KSU' \
          out/.config || true

        echo
        echo "--- NoMount ---"

        grep -E '^CONFIG_NOMOUNT' \
          out/.config || true

        echo
        echo "--- KPROBES ---"

        grep -E '^CONFIG_KPROBES' \
          out/.config || true


        echo
        echo "========================================"
        echo "SUSFS VALIDATION"
        echo "========================================"

        case "$BUILD_TYPE" in

          KSU|KSU-NoMount)

            if grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
              echo "ERROR: SUSFS MUST BE DISABLED FOR $BUILD_TYPE"
              exit 1
            fi

            echo "OK: SUSFS IS DISABLED"

            ;;


          KSU-SUSFS|KSU-SUSFS-NoMount)

            if grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
              echo "OK: SUSFS IS ENABLED"
            else
              echo "ERROR: SUSFS MUST BE ENABLED FOR $BUILD_TYPE"
              exit 1
            fi

            ;;


          Base)

            if grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
              echo "ERROR: SUSFS MUST BE DISABLED FOR BASE"
              exit 1
            fi

            echo "OK: SUSFS IS DISABLED"

            ;;

        esac


        echo
        echo "========================================"
        echo "NOMOUNT VALIDATION"
        echo "========================================"

        case "$BUILD_TYPE" in

          KSU-NoMount|KSU-SUSFS-NoMount)

            if grep -q '^CONFIG_NOMOUNT=y' out/.config; then
              echo "OK: NOMOUNT IS ENABLED"
            else
              echo "ERROR: NOMOUNT MUST BE ENABLED FOR $BUILD_TYPE"
              exit 1
            fi

            ;;


          Base|KSU|KSU-SUSFS)

            if grep -q '^CONFIG_NOMOUNT=y' out/.config; then
              echo "ERROR: NOMOUNT MUST BE DISABLED FOR $BUILD_TYPE"
              exit 1
            fi

            echo "OK: NOMOUNT IS DISABLED"

            ;;

        esac


        echo
        echo "========================================"
        echo "KPROBES VALIDATION"
        echo "========================================"

        if grep -q '^CONFIG_KPROBES=y' out/.config; then
          echo "ERROR: CONFIG_KPROBES MUST BE DISABLED"
          exit 1
        else
          echo "OK: CONFIG_KPROBES IS NOT ENABLED"
        fi


        echo
        echo "========================================"
        echo "SAVING FULL FINAL DEFCONFIG"
        echo "========================================"

        cp \
          out/.config \
          "out/${DEFCONFIG_NAME}"


        echo
        echo "========================================"
        echo "FULL FINAL DEFCONFIG"
        echo "========================================"

        ls -lh \
          "out/${DEFCONFIG_NAME}"

        echo
        echo "LINE COUNT"

        wc -l \
          "out/${DEFCONFIG_NAME}"

        echo
        echo "KERNELSU CONFIG"

        grep -E '^CONFIG_KSU' \
          "out/${DEFCONFIG_NAME}" || true

        echo
        echo "SUSFS CONFIG"

        grep -E '^CONFIG_KSU_SUSFS' \
          "out/${DEFCONFIG_NAME}" || true

        echo
        echo "NOMOUNT CONFIG"

        grep -E '^CONFIG_NOMOUNT' \
          "out/${DEFCONFIG_NAME}" || true


    # ============================================================
    # 10. Upload Full Final Defconfig
    # ============================================================

    - name: Upload Full Final Defconfig Before Build
      uses: actions/upload-artifact@v4
      with:
        name: full-final-defconfig-${{ matrix.build_type }}-${{ env.BUILD_TIME }}
        path: out/*-full_defconfig
        if-no-files-found: error


    # ============================================================
    # 11. Verify Build Configuration
    # ============================================================

    - name: Verify Build Configuration
      run: |
        set -e

        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$PATH"

        echo "========================================"
        echo "VERIFYING ACTIVE BUILD CONFIG"
        echo "========================================"

        test -f out/.config

        echo
        echo "CONFIG LINE COUNT:"
        wc -l out/.config

        echo
        echo "BUILD TYPE:"
        echo "${{ matrix.build_type }}"

        echo
        echo "KERNELSU:"
        grep -E '^CONFIG_KSU' out/.config || true

        echo
        echo "SUSFS:"
        grep -E '^CONFIG_KSU_SUSFS' out/.config || true

        echo
        echo "NOMOUNT:"
        grep -E '^CONFIG_NOMOUNT' out/.config || true

        echo
        echo "========================================"
        echo "BUILD CONFIG READY"
        echo "========================================"


    # ============================================================
    # 12. Build Kernel
    #
    # AOSP Clang Only
    #
    # MAKE_ARGS method
    # ============================================================

    - name: Build Kernel
      run: |
        set -o pipefail

        export ARCH=arm64
        export CLANG_ROOT="$CLANG_PATH"

        export PATH="$CLANG_ROOT/bin:$PATH"

        export KBUILD_BUILD_USER=Manipulator
        export KBUILD_BUILD_HOST=LineageOS
        export KBUILD_COMPILER_STRING="$CLANG_ROOT/bin/clang"

        echo "========================================"
        echo "BUILDING KERNEL"
        echo "========================================"

        echo "BUILD TYPE: ${{ matrix.build_type }}"

        echo
        echo "========================================"
        echo "AOSP CLANG ONLY"
        echo "========================================"

        echo "CLANG_ROOT=$CLANG_ROOT"

        echo
        echo "========================================"
        echo "COMPILER"
        echo "========================================"

        which clang
        clang --version

        echo
        echo "========================================"
        echo "LINKER"
        echo "========================================"

        which ld.lld
        ld.lld --version

        echo
        echo "========================================"
        echo "LLVM TOOLS"
        echo "========================================"

        which llvm-ar
        which llvm-nm
        which llvm-objcopy
        which llvm-objdump
        which llvm-strip

        echo
        echo "========================================"
        echo "MAKE_ARGS"
        echo "========================================"

        export MAKE_ARGS=(
          ARCH=arm64
          LLVM=1
          LLVM_IAS=1
          LD=ld.lld
          CROSS_COMPILE=aarch64-linux-gnu-
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        )

        printf '%s\n' "${MAKE_ARGS[@]}"

        echo
        echo "========================================"
        echo "CROSS COMPILE"
        echo "========================================"

        echo "CROSS_COMPILE=aarch64-linux-gnu-"
        echo "CROSS_COMPILE_COMPAT=arm-linux-gnueabi-"
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

        echo
        echo "========================================"
        echo "BUILD START"
        echo "========================================"

        make -j$(nproc --all) \
          O=out \
          "${MAKE_ARGS[@]}" \
          2>&1 | tee build.log


    # ============================================================
    # 13. Verify Kernel
    # ============================================================

    - name: Check Build Output
      run: |
        set -e

        echo "========================================"
        echo "CHECKING BUILD"
        echo "========================================"

        test -f out/arch/arm64/boot/Image.gz

        echo
        echo "========================================"
        echo "BUILD SUCCESS"
        echo "========================================"

        echo "TYPE: ${{ matrix.build_type }}"

        ls -lh \
          out/arch/arm64/boot/Image.gz


    # ============================================================
    # 14. Package AnyKernel3
    # ============================================================

    - name: Package AnyKernel3
      run: |
        set -e

        echo "========================================"
        echo "PACKAGING ANYKERNEL3"
        echo "========================================"

        git clone \
          --depth=1 \
          -b sixteen \
          https://github.com/Joker-V2/AnyKernel3.git \
          AK3

        cp \
          out/arch/arm64/boot/Image.gz \
          AK3/

        if [ -f out/arch/arm64/boot/dtbo.img ]; then
          cp \
            out/arch/arm64/boot/dtbo.img \
            AK3/
        fi

        cd AK3

        zip -r9 \
          "../Kernel-violet-${{ matrix.build_type }}-${BUILD_TIME}.zip" \
          *

        cd ..

        echo
        ls -lh \
          "Kernel-violet-${{ matrix.build_type }}-${BUILD_TIME}.zip"


    # ============================================================
    # 15. Upload Kernel ZIP
    # ============================================================

    - name: Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-violet-${{ matrix.build_type }}-${{ env.BUILD_TIME }}
        path: Kernel-violet-${{ matrix.build_type }}-${{ env.BUILD_TIME }}.zip
        if-no-files-found: error


    # ============================================================
    # 16. Upload Full Active .config
    # ============================================================

    - name: Upload Full Active Config
      uses: actions/upload-artifact@v4
      with:
        name: active-config-${{ matrix.build_type }}-${{ env.BUILD_TIME }}
        path: out/.config
        include-hidden-files: true
        if-no-files-found: error


    # ============================================================
    # 17. Upload Build Log
    # ============================================================

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ matrix.build_type }}-${{ env.BUILD_TIME }}
        path: build.log
        if-no-files-found: warn
