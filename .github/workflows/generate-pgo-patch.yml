name: Generate PGO DebugFS Patch

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout pgo-debugfs
        uses: actions/checkout@v4
        with:
          ref: pgo-debugfs
          fetch-depth: 0

      - name: Check branch
        run: |
          echo "Branch:"
          git branch --show-current
          echo "Commit:"
          git rev-parse HEAD

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            patch \
            diffutils

      # ============================================================
      # 3. SHOW BASE TREE
      # ============================================================
      - name: Verify base tree
        run: |
          set -e

          echo "============================================================"
          echo "BASE TREE"
          echo "============================================================"

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Kernel version:"
          grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' Makefile

          echo
          echo "Working tree:"
          git status --short

          echo
          echo "Required existing files:"
          for f in \
            arch/Kconfig \
            arch/arm64/Kconfig \
            arch/arm64/configs/vendor/violet-perf_defconfig \
            arch/arm64/kernel/vdso/Makefile \
            include/asm-generic/vmlinux.lds.h \
            kernel/Makefile \
            Makefile \
            scripts/Makefile.lib
          do
            if [ ! -f "$f" ]; then
              echo "[FAIL] Missing: $f"
              exit 1
            fi

            echo "[OK] $f"
          done

      # ============================================================
      # 4. DOWNLOAD ORIGINAL PATCH 2
      # ============================================================
      - name: Download original Patch 2
        run: |
          set -e

          PATCH_URL="https://raw.githubusercontent.com/Red-A-Hawk/Patch/kernel_xiaomi_violet/0001-Add-Clang-PGO-support.patch"

          wget -O /tmp/original-pgo.patch "$PATCH_URL"

          echo "============================================================"
          echo "ORIGINAL PATCH"
          echo "============================================================"

          wc -l /tmp/original-pgo.patch
          wc -c /tmp/original-pgo.patch

          echo
          echo "Patch header:"
          sed -n '1,45p' /tmp/original-pgo.patch

      # ============================================================
      # 5. SAVE ORIGINAL TREE STATE
      # ============================================================
      - name: Save base tree
        run: |
          set -e

          git status --short > /tmp/base-status.txt
          git rev-parse HEAD > /tmp/base-commit.txt

          echo "[OK] Base tree saved"

      # ============================================================
      # 6. CREATE PGO DIRECTORY
      # ============================================================
      - name: Create PGO directory
        run: |
          set -e

          mkdir -p kernel/pgo

          echo "[OK] kernel/pgo created"

      # ============================================================
      # 7. EXTRACT NEW PGO FILES FROM PATCH 2
      #
      # These are genuinely new files.
      # ============================================================
      - name: Extract new PGO files
        shell: bash
        run: |
          set -e

          PATCH=/tmp/original-pgo.patch

          extract_new_file() {
            local file="$1"
            local output="$2"

            echo "Extracting: $file"

            awk -v target="$file" '
              $0 == ("diff --git a/" target " b/" target) {
                found=1
                next
              }

              found && /^diff --git / {
                exit
              }

              found && /^@@ / {
                in_hunk=1
                next
              }

              found && in_hunk {
                if ($0 ~ /^\+/) {
                  line=substr($0,2)

                  if (line != "\\ No newline at end of file")
                    print line
                }
              }
            ' "$PATCH" > "$output"

            if [ ! -s "$output" ]; then
              echo "[FAIL] Could not extract $file"
              exit 1
            fi

            echo "[OK] $file"
            wc -l "$output"
          }

          extract_new_file \
            "kernel/pgo/Kconfig" \
            kernel/pgo/Kconfig

          extract_new_file \
            "kernel/pgo/Makefile" \
            kernel/pgo/Makefile

          extract_new_file \
            "kernel/pgo/pgo.h" \
            kernel/pgo/pgo.h

          extract_new_file \
            "kernel/pgo/instrument.c" \
            kernel/pgo/instrument.c

          extract_new_file \
            "kernel/pgo/fs.c" \
            kernel/pgo/fs.c

      # ============================================================
      # 8. REMOVE CC_IS_CLANG DEPENDENCY
      #
      # Kernel 4.14 tree does not provide CC_IS_CLANG.
      # ============================================================
      - name: Adapt PGO Kconfig for kernel 4.14
        run: |
          set -e

          sed -i \
            '/depends on CC_IS_CLANG/d' \
            kernel/pgo/Kconfig

          echo "============================================================"
          echo "PGO KCONFIG"
          echo "============================================================"

          cat kernel/pgo/Kconfig

          if grep -q 'depends on CC_IS_CLANG' kernel/pgo/Kconfig; then
            echo "[FAIL] CC_IS_CLANG dependency still exists"
            exit 1
          fi

          echo
          echo "[OK] CC_IS_CLANG dependency removed"

      # ============================================================
      # 9. MODIFY arch/Kconfig
      # ============================================================
      - name: Modify arch/Kconfig
        run: |
          set -e

          FILE=arch/Kconfig

          grep -q 'source "kernel/gcov/Kconfig"' "$FILE"

          if grep -q 'source "kernel/pgo/Kconfig"' "$FILE"; then
            echo "[INFO] PGO source already exists"
          else
            sed -i \
              '/source "kernel\/gcov\/Kconfig"/a source "kernel/pgo/Kconfig"' \
              "$FILE"

            echo "[OK] Added kernel/pgo/Kconfig"
          fi

      # ============================================================
      # 10. MODIFY arch/arm64/Kconfig
      # ============================================================
      - name: Modify arch/arm64/Kconfig
        run: |
          set -e

          FILE=arch/arm64/Kconfig

          grep -q 'select ARCH_SUPPORTS_LTO_CLANG' "$FILE"

          if grep -q 'select ARCH_SUPPORTS_PGO_CLANG' "$FILE"; then
            echo "[INFO] ARCH_SUPPORTS_PGO_CLANG already exists"
          else
            sed -i \
              '/select ARCH_SUPPORTS_THINLTO/a\	select ARCH_SUPPORTS_PGO_CLANG' \
              "$FILE"

            echo "[OK] Added ARCH_SUPPORTS_PGO_CLANG"
          fi

      # ============================================================
      # 11. MODIFY VIOLET PERF DEFCONFIG
      # ============================================================
      - name: Enable DEBUG_FS in violet defconfig
        run: |
          set -e

          FILE=arch/arm64/configs/vendor/violet-perf_defconfig

          if grep -q '^CONFIG_DEBUG_FS=y$' "$FILE"; then
            echo "[INFO] CONFIG_DEBUG_FS already enabled"
          elif grep -q '^# CONFIG_DEBUG_FS is not set$' "$FILE"; then
            sed -i \
              's/^# CONFIG_DEBUG_FS is not set$/CONFIG_DEBUG_FS=y/' \
              "$FILE"

            echo "[OK] CONFIG_DEBUG_FS enabled"
          else
            echo "CONFIG_DEBUG_FS=y" >> "$FILE"
            echo "[OK] CONFIG_DEBUG_FS added"
          fi

      # ============================================================
      # 12. MODIFY VDSO MAKEFILE
      # ============================================================
      - name: Disable PGO for VDSO
        run: |
          set -e

          FILE=arch/arm64/kernel/vdso/Makefile

          if grep -q '^PGO_PROFILE := n$' "$FILE"; then
            echo "[INFO] PGO_PROFILE already disabled"
          else
            sed -i \
              '/^GCOV_PROFILE := n$/a PGO_PROFILE := n' \
              "$FILE"

            echo "[OK] Added PGO_PROFILE := n"
          fi

      # ============================================================
      # 13. MODIFY kernel/Makefile
      # ============================================================
      - name: Add PGO kernel object
        run: |
          set -e

          FILE=kernel/Makefile

          if grep -q 'obj-\$(CONFIG_PGO_CLANG) += pgo/' "$FILE"; then
            echo "[INFO] kernel/pgo already present"
          else
            sed -i \
              '/obj-\$(CONFIG_CFI_CLANG) += cfi.o/a obj-$(CONFIG_PGO_CLANG) += pgo/' \
              "$FILE"

            echo "[OK] Added kernel/pgo"
          fi

      # ============================================================
      # 14. MODIFY include/asm-generic/vmlinux.lds.h
      # ============================================================
      - name: Add PGO linker sections
        shell: bash
        run: |
          set -e

          FILE=include/asm-generic/vmlinux.lds.h

          if grep -q '#define PGO_CLANG_DATA' "$FILE"; then
            echo "[INFO] PGO linker section already exists"
            exit 0
          fi

          awk '
          /#ifdef CONFIG_UNWINDER_ORC/ && !inserted {
            print "#ifdef CONFIG_PGO_CLANG"
            print "#define PGO_CLANG_DATA \\"
            print "	__llvm_prf_data : AT(ADDR(__llvm_prf_data) - LOAD_OFFSET) { \\"
            print "		VMLINUX_SYMBOL(__llvm_prf_data_start) = .; \\"
            print "		*(__llvm_prf_data) \\"
            print "		VMLINUX_SYMBOL(__llvm_prf_data_end) = .; \\"
            print "	} \\"
            print "	__llvm_prf_cnts : AT(ADDR(__llvm_prf_cnts) - LOAD_OFFSET) { \\"
            print "		VMLINUX_SYMBOL(__llvm_prf_cnts_start) = .; \\"
            print "		*(__llvm_prf_cnts) \\"
            print "		VMLINUX_SYMBOL(__llvm_prf_cnts_end) = .; \\"
            print "	} \\"
            print "	__llvm_prf_names : AT(ADDR(__llvm_prf_names) - LOAD_OFFSET) { \\"
            print "		VMLINUX_SYMBOL(__llvm_prf_names_start) = .; \\"
            print "		*(__llvm_prf_names) \\"
            print "		VMLINUX_SYMBOL(__llvm_prf_names_end) = .; \\"
            print "	} \\"
            print "	__llvm_prf_vals : AT(ADDR(__llvm_prf_vals) - LOAD_OFFSET) { \\"
            print "		VMLINUX_SYMBOL(__llvm_prf_vals_start) = .; \\"
            print "		*(__llvm_prf_vals) \\"
            print "		VMLINUX_SYMBOL(__llvm_prf_vals_end) = .; \\"
            print "	} \\"
            print "	__llvm_prf_vnds : AT(ADDR(__llvm_prf_vnds) - LOAD_OFFSET) { \\"
            print "		VMLINUX_SYMBOL(__llvm_prf_vnds_start) = .; \\"
            print "		*(__llvm_prf_vnds) \\"
            print "		VMLINUX_SYMBOL(__llvm_prf_vnds_end) = .; \\"
            print "	}"
            print "#else"
            print "#define PGO_CLANG_DATA"
            print "#endif"
            print ""
            inserted=1
          }

          {
            print
          }
          ' "$FILE" > "$FILE.tmp"

          mv "$FILE.tmp" "$FILE"

          echo "[OK] PGO linker sections added"

      # ============================================================
      # 15. INSERT PGO_CLANG_DATA INTO RW_DATA_SECTION
      # ============================================================
      - name: Insert PGO linker data
        run: |
          set -e

          FILE=include/asm-generic/vmlinux.lds.h

          if grep -A3 -B3 'PGO_CLANG_DATA' "$FILE" | grep -q 'BUG_TABLE'; then
            echo "[INFO] PGO_CLANG_DATA already referenced"
          else
            sed -i '/^[[:space:]]*BUG_TABLE[[:space:]]*\\$/a\	PGO_CLANG_DATA' "$FILE"
            echo "[OK] PGO_CLANG_DATA referenced"
          fi

      # ============================================================
      # 16. MODIFY TOP-LEVEL Makefile
      # ============================================================
      - name: Add PGO compiler flags
        shell: bash
        run: |
          set -e

          FILE=Makefile

          if ! grep -q 'CFLAGS_PGO_CLANG := -fprofile-generate' "$FILE"; then
            sed -i \
              '/^all: vmlinux$/a\\\nCFLAGS_PGO_CLANG := -fprofile-generate\nexport CFLAGS_PGO_CLANG\n' \
              "$FILE"
          fi

          if ! grep -q 'KBUILD_CFLAGS.*-disable-preinline' "$FILE"; then
            awk '
            /ifdef CONFIG_CFI_CLANG/ && !inserted {
              print "ifdef CONFIG_PGO_CLANG"
              print "KBUILD_CFLAGS	+= -mllvm -disable-preinline -fno-if-conversion"
              print "endif"
              print ""
              inserted=1
            }
            {
              print
            }
            ' "$FILE" > "$FILE.tmp"

            mv "$FILE.tmp" "$FILE"
          fi

          echo "[OK] Top-level Makefile modified"

      # ============================================================
      # 17. MODIFY scripts/Makefile.lib
      # ============================================================
      - name: Add PGO Makefile logic
        shell: bash
        run: |
          set -e

          FILE=scripts/Makefile.lib

          if grep -q 'CFLAGS_PGO_CLANG' "$FILE"; then
            echo "[INFO] PGO Makefile logic already exists"
            exit 0
          fi

          awk '
          /^#.*Enable address sanitizer flags/ && !inserted {
            print "#"
            print "# Enable clang PGO profiling flags."
            print "#"
            print "ifeq ($(CONFIG_PGO_CLANG),y)"
            print "_c_flags += $(if $(patsubst n%,, \\"
            print "		$(PGO_PROFILE_$(basetarget).o)$(PGO_PROFILE)y), \\"
            print "		$(CFLAGS_PGO_CLANG))"
            print "endif"
            print ""
            inserted=1
          }

          {
            print
          }
          ' "$FILE" > "$FILE.tmp"

          mv "$FILE.tmp" "$FILE"

          echo "[OK] scripts/Makefile.lib modified"

      # ============================================================
      # 18. VERIFY ACTUAL MODIFICATIONS
      # ============================================================
      - name: Verify PGO modifications
        run: |
          set -e

          echo "============================================================"
          echo "VERIFY PGO MODIFICATIONS"
          echo "============================================================"

          echo
          echo "[1] arch/Kconfig"
          grep -n 'kernel/pgo/Kconfig' arch/Kconfig

          echo
          echo "[2] arch/arm64/Kconfig"
          grep -n 'ARCH_SUPPORTS_PGO_CLANG' arch/arm64/Kconfig

          echo
          echo "[3] defconfig"
          grep -n 'CONFIG_DEBUG_FS=y' \
            arch/arm64/configs/vendor/violet-perf_defconfig

          echo
          echo "[4] VDSO"
          grep -n 'PGO_PROFILE' \
            arch/arm64/kernel/vdso/Makefile

          echo
          echo "[5] kernel/Makefile"
          grep -n 'CONFIG_PGO_CLANG.*pgo' kernel/Makefile

          echo
          echo "[6] linker"
          grep -n 'PGO_CLANG_DATA' \
            include/asm-generic/vmlinux.lds.h

          echo
          echo "[7] PGO files"
          ls -lh kernel/pgo/

          echo
          echo "[OK] PGO modifications detected"

      # ============================================================
      # 19. CHECK NEW FILES
      # ============================================================
      - name: Verify new PGO files
        run: |
          set -e

          for f in \
            kernel/pgo/Kconfig \
            kernel/pgo/Makefile \
            kernel/pgo/pgo.h \
            kernel/pgo/instrument.c \
            kernel/pgo/fs.c
          do
            if [ ! -s "$f" ]; then
              echo "[FAIL] Missing or empty: $f"
              exit 1
            fi

            echo "[OK] $f"
          done

      # ============================================================
      # 20. CHECK DIFF
      # ============================================================
      - name: Check Git diff
        run: |
          set -e

          echo "============================================================"
          echo "GIT DIFF CHECK"
          echo "============================================================"

          git diff --check

          echo
          echo "[OK] git diff --check passed"

      # ============================================================
      # 21. SHOW GENERATED DIFF
      # ============================================================
      - name: Show generated diff
        run: |
          set -e

          git diff --stat

          echo
          echo "============================================================"
          echo "DIFF HEADER"
          echo "============================================================"

          git diff | sed -n '1,180p'

      # ============================================================
      # 22. GENERATE PATCH
      # ============================================================
      - name: Generate final patch
        run: |
          set -e

          PATCH_FILE="$GITHUB_WORKSPACE/0001-Add-Clang-PGO-support-4.14-debugfs.patch"

          git diff --binary > "$PATCH_FILE"

          echo "============================================================"
          echo "GENERATED PATCH"
          echo "============================================================"

          wc -l "$PATCH_FILE"
          wc -c "$PATCH_FILE"

          echo
          echo "Patch header:"
          sed -n '1,45p' "$PATCH_FILE"

      # ============================================================
      # 23. VERIFY PATCH FORMAT
      # ============================================================
      - name: Verify generated patch format
        run: |
          set -e

          PATCH_FILE="$GITHUB_WORKSPACE/0001-Add-Clang-PGO-support-4.14-debugfs.patch"

          echo "============================================================"
          echo "VERIFY PATCH FORMAT"
          echo "============================================================"

          if grep -q 'index 0000000..0000000' "$PATCH_FILE"; then
            echo "[FAIL] Invalid zero index detected"
            exit 1
          fi

          if grep -q '^diff --git a/kernel/pgo/' "$PATCH_FILE"; then
            echo "[OK] New PGO files detected"
          else
            echo "[FAIL] New PGO files missing"
            exit 1
          fi

          if grep -q '^diff --git a/arch/Kconfig b/arch/Kconfig' "$PATCH_FILE"; then
            echo "[OK] arch/Kconfig is a modification"
          else
            echo "[FAIL] arch/Kconfig modification missing"
            exit 1
          fi

          if grep -q '^diff --git a/arch/arm64/Kconfig b/arch/arm64/Kconfig' "$PATCH_FILE"; then
            echo "[OK] arch/arm64/Kconfig is a modification"
          else
            echo "[FAIL] arch/arm64/Kconfig modification missing"
            exit 1
          fi

          echo
          echo "[OK] Patch format looks correct"

      # ============================================================
      # 24. TEST PATCH ON CLEAN TREE
      # ============================================================
      - name: Test generated patch with git apply
        run: |
          set -e

          PATCH_FILE="$GITHUB_WORKSPACE/0001-Add-Clang-PGO-support-4.14-debugfs.patch"

          echo "============================================================"
          echo "TEST git apply --check"
          echo "============================================================"

          git reset --hard HEAD
          git clean -fd

          git apply --check "$PATCH_FILE"

          echo
          echo "[OK] git apply --check passed"

      # ============================================================
      # 25. APPLY GENERATED PATCH
      # ============================================================
      - name: Apply generated patch
        run: |
          set -e

          PATCH_FILE="$GITHUB_WORKSPACE/0001-Add-Clang-PGO-support-4.14-debugfs.patch"

          git apply "$PATCH_FILE"

          echo "[OK] Generated patch applied successfully"

      # ============================================================
      # 26. FINAL VALIDATION
      # ============================================================
      - name: Final validation
        run: |
          set -e

          echo "============================================================"
          echo "FINAL VALIDATION"
          echo "============================================================"

          git diff --check

          grep -q 'source "kernel/pgo/Kconfig"' arch/Kconfig
          grep -q 'select ARCH_SUPPORTS_PGO_CLANG' arch/arm64/Kconfig
          grep -q '^CONFIG_DEBUG_FS=y$' \
            arch/arm64/configs/vendor/violet-perf_defconfig
          grep -q '^PGO_PROFILE := n$' \
            arch/arm64/kernel/vdso/Makefile
          grep -q 'CONFIG_PGO_CLANG.*pgo/' kernel/Makefile
          grep -q '#define PGO_CLANG_DATA' \
            include/asm-generic/vmlinux.lds.h

          test -s kernel/pgo/Kconfig
          test -s kernel/pgo/Makefile
          test -s kernel/pgo/pgo.h
          test -s kernel/pgo/instrument.c
          test -s kernel/pgo/fs.c

          echo
          echo "[OK] All final checks passed"

      # ============================================================
      # 27. UPLOAD PATCH
      # ============================================================
      - name: Upload generated patch
        uses: actions/upload-artifact@v4
        with:
          name: Clang-PGO-4.14-debugFS-Patch
          path: 0001-Add-Clang-PGO-support-4.14-debugfs.patch
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 28. FINAL SUMMARY
      # ============================================================
      - name: Final summary
        run: |
          echo
          echo "============================================================"
          echo "CLANG PGO DEBUGFS PATCH GENERATED"
          echo "============================================================"
          echo
          echo "Branch:"
          echo "  pgo-debugfs"
          echo
          echo "Patch:"
          echo "  0001-Add-Clang-PGO-support-4.14-debugfs.patch"
          echo
          echo "Validation:"
          echo "  git diff --check       : PASS"
          echo "  git apply --check      : PASS"
          echo "  git apply              : PASS"
          echo
          echo "Artifact:"
          echo "  Clang-PGO-4.14-debugFS-Patch"
          echo
          echo "============================================================"
