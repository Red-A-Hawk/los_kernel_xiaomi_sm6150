name: Build Kernel (violet)

on:
  push:
    branches:
      - 16
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Base
          - KSU
          - KSU-NoMount
          - KSU-SUSFS
          - KSU-SUSFS-NoMount

    steps:

    # ============================================================
    # 1. Checkout
    # ============================================================

    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: 16
        fetch-depth: 1


    # ============================================================
    # 2. Dependencies
    # ============================================================

    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          git \
          bc \
          bison \
          flex \
          libssl-dev \
          make \
          zip \
          unzip \
          curl \
          wget \
          libelf-dev \
          libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          python3 \
          openjdk-17-jre-headless


    # ============================================================
    # 3. Toolchains
    # ============================================================

    - name: Clone Toolchains
      run: |
        mkdir -p clang
        cd clang

        wget \
          https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20230725-release/Clang-17.0.0-20230725.tar.gz

        tar -xzf Clang-17.0.0-20230725.tar.gz

        rm Clang-17.0.0-20230725.tar.gz

        cd ..

        git clone \
          https://github.com/greenforce-project/gcc-arm64 \
          -b main \
          --depth=1 \
          gcc64

        git clone \
          https://github.com/greenforce-project/gcc-arm \
          -b main \
          --depth=1 \
          gcc32


    # ============================================================
    # 4. Environment
    # ============================================================

    - name: Setup Environment
      run: |
        echo "BUILD_TIME=$(TZ=Asia/Jakarta date '+%d%m%Y-%H%M')" >> "$GITHUB_ENV"

        echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> "$GITHUB_ENV"
        echo "GCC64_PATH=$GITHUB_WORKSPACE/gcc64" >> "$GITHUB_ENV"
        echo "GCC32_PATH=$GITHUB_WORKSPACE/gcc32" >> "$GITHUB_ENV"


    # ============================================================
    # 5. Verify toolchains
    # ============================================================

    - name: Verify toolchains
      run: |
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo "========================================"
        echo "CLANG"
        echo "========================================"

        which clang
        clang --version

        echo
        echo "========================================"
        echo "LLD"
        echo "========================================"

        which ld.lld
        ld.lld --version

        echo
        echo "========================================"
        echo "GCC64"
        echo "========================================"

        ls -la "$GCC64_PATH/bin"

        echo
        echo "========================================"
        echo "GCC32"
        echo "========================================"

        ls -la "$GCC32_PATH/bin"


    # ============================================================
    # 6. Setup NoMount
    # ============================================================

    - name: Setup NoMount
      if: ${{ matrix.build_type == 'KSU-NoMount' || matrix.build_type == 'KSU-SUSFS-NoMount' }}
      run: |
        set -e

        echo "========================================"
        echo "SETTING UP NOMOUNT"
        echo "========================================"

        curl -LSs \
          "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" \
          | bash -

        echo
        echo "========================================"
        echo "NOMOUNT CHECK"
        echo "========================================"

        test -d fs/nomount

        ls -ld fs/nomount

        grep -n "nomount" fs/Makefile || true
        grep -n "nomount" fs/Kconfig || true


    # ============================================================
    # 7. Setup KernelSU-Next
    # ============================================================

    - name: Setup KernelSU-Next
      if: ${{ matrix.build_type != 'Base' }}
      run: |
        set -e

        echo "========================================"
        echo "SETTING UP KERNELSU-NEXT"
        echo "========================================"

        curl -LSs \
          "https://raw.githubusercontent.com/manipvlator/KernelSU-Next/stable/kernel/setup.sh" \
          | bash -s syscall

        echo
        echo "========================================"
        echo "KERNELSU CHECK"
        echo "========================================"

        test -d drivers/kernelsu

        ls -ld drivers/kernelsu

        echo
        echo "KERNELSU PATH:"
        readlink -f drivers/kernelsu || true

        echo
        echo "KERNELSU FILES:"
        find drivers/kernelsu \
          -maxdepth 2 \
          -type f \
          | sort


    # ============================================================
    # 8. Check KernelSU syscall symbols
    # ============================================================

    - name: Check KernelSU syscall symbols
      if: ${{ matrix.build_type != 'Base' }}
      run: |
        set -e

        echo "========================================"
        echo "KERNELSU SYSCALL SYMBOL CHECK"
        echo "========================================"

        echo
        echo "Searching for:"
        echo "  ksu_handle_stat"
        echo "  ksu_handle_faccessat"
        echo "  ksu_handle_execveat"

        echo
        echo "========================================"
        echo "1. ALL SOURCE DEFINITIONS / REFERENCES"
        echo "========================================"

        grep -Rnw \
          --exclude-dir=.git \
          --exclude-dir=out \
          --include='*.c' \
          --include='*.h' \
          -E \
          'ksu_handle_stat|ksu_handle_faccessat|ksu_handle_execveat' \
          . || true

        echo
        echo "========================================"
        echo "2. KERNELSU DIRECTORY ONLY"
        echo "========================================"

        grep -Rnw \
          --include='*.c' \
          --include='*.h' \
          -E \
          'ksu_handle_stat|ksu_handle_faccessat|ksu_handle_execveat' \
          drivers/kernelsu || true

        echo
        echo "========================================"
        echo "3. FS HOOKS"
        echo "========================================"

        echo
        echo "--- fs/stat.c ---"

        grep -n \
          -E \
          'ksu_handle_stat|ksu_handle_faccessat|ksu_handle_execveat' \
          fs/stat.c || true

        echo
        echo "--- fs/open.c ---"

        grep -n \
          -E \
          'ksu_handle_stat|ksu_handle_faccessat|ksu_handle_execveat' \
          fs/open.c || true

        echo
        echo "--- fs/exec.c ---"

        grep -n \
          -E \
          'ksu_handle_stat|ksu_handle_faccessat|ksu_handle_execveat' \
          fs/exec.c || true

        echo
        echo "========================================"
        echo "4. EXACT FUNCTION DEFINITIONS"
        echo "========================================"

        echo
        echo "ksu_handle_stat definitions:"

        grep -Rnw \
          --exclude-dir=.git \
          --exclude-dir=out \
          --include='*.c' \
          -E \
          '^[[:space:]]*(static[[:space:]]+)?(inline[[:space:]]+)?(int|long|void|bool)[[:space:]]+ksu_handle_stat[[:space:]]*\(' \
          . || true

        echo
        echo "ksu_handle_faccessat definitions:"

        grep -Rnw \
          --exclude-dir=.git \
          --exclude-dir=out \
          --include='*.c' \
          -E \
          '^[[:space:]]*(static[[:space:]]+)?(inline[[:space:]]+)?(int|long|void|bool)[[:space:]]+ksu_handle_faccessat[[:space:]]*\(' \
          . || true

        echo
        echo "ksu_handle_execveat definitions:"

        grep -Rnw \
          --exclude-dir=.git \
          --exclude-dir=out \
          --include='*.c' \
          -E \
          '^[[:space:]]*(static[[:space:]]+)?(inline[[:space:]]+)?(int|long|void|bool)[[:space:]]+ksu_handle_execveat[[:space:]]*\(' \
          . || true


    # ============================================================
    # 9. Load Original violet-perf defconfig
    # ============================================================

    - name: Load Original violet-perf defconfig
      run: |
        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo "========================================"
        echo "LOADING ORIGINAL VIOLET-PERF DEFCONFIG"
        echo "========================================"

        make O=out \
          ARCH=arm64 \
          vendor/violet-perf_defconfig

        test -f out/.config


    # ============================================================
    # 10. Configure Matrix
    # ============================================================

    - name: Configure Matrix
      run: |
        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        BUILD_TYPE="${{ matrix.build_type }}"

        echo "========================================"
        echo "BUILD TYPE"
        echo "$BUILD_TYPE"
        echo "========================================"

        case "$BUILD_TYPE" in

          Base)

            scripts/config \
              --file out/.config \
              --disable CONFIG_KSU \
              --disable CONFIG_KSU_SUSFS \
              --disable CONFIG_NOMOUNT

            DEFCONFIG_NAME="violet-perf-full_defconfig"

            ;;


          KSU)

            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_EXTRAS \
              --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE \
              --enable CONFIG_KSU_LSM_SECURITY_HOOKS \
              --enable CONFIG_KSU_FEATURE_SULOG \
              --enable CONFIG_KSU_FEATURE_ADBROOT \
              --enable CONFIG_KSU_HEURISTIC_IN_TREE_BUILD \
              --disable CONFIG_KSU_SUSFS \
              --disable CONFIG_NOMOUNT \
              --disable CONFIG_KPROBES

            DEFCONFIG_NAME="violet-ksu-full_defconfig"

            ;;


          KSU-NoMount)

            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_EXTRAS \
              --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE \
              --enable CONFIG_KSU_LSM_SECURITY_HOOKS \
              --enable CONFIG_KSU_FEATURE_SULOG \
              --enable CONFIG_KSU_FEATURE_ADBROOT \
              --enable CONFIG_KSU_HEURISTIC_IN_TREE_BUILD \
              --disable CONFIG_KSU_SUSFS \
              --enable CONFIG_NOMOUNT \
              --disable CONFIG_KPROBES

            DEFCONFIG_NAME="violet-ksu-nomount-full_defconfig"

            ;;


          KSU-SUSFS)

            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_EXTRAS \
              --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE \
              --enable CONFIG_KSU_LSM_SECURITY_HOOKS \
              --enable CONFIG_KSU_FEATURE_SULOG \
              --enable CONFIG_KSU_FEATURE_ADBROOT \
              --enable CONFIG_KSU_HEURISTIC_IN_TREE_BUILD \
              --enable CONFIG_KSU_SUSFS \
              --disable CONFIG_NOMOUNT \
              --disable CONFIG_KPROBES

            DEFCONFIG_NAME="violet-ksu-susfs-full_defconfig"

            ;;


          KSU-SUSFS-NoMount)

            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_EXTRAS \
              --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE \
              --enable CONFIG_KSU_LSM_SECURITY_HOOKS \
              --enable CONFIG_KSU_FEATURE_SULOG \
              --enable CONFIG_KSU_FEATURE_ADBROOT \
              --enable CONFIG_KSU_HEURISTIC_IN_TREE_BUILD \
              --enable CONFIG_KSU_SUSFS \
              --enable CONFIG_NOMOUNT \
              --disable CONFIG_KPROBES

            DEFCONFIG_NAME="violet-ksu-susfs-nomount-full_defconfig"

            ;;


          *)

            echo "ERROR: Unknown build type: $BUILD_TYPE"
            exit 1

            ;;

        esac


        echo
        echo "========================================"
        echo "RUNNING OLDDEFCONFIG"
        echo "========================================"

        make O=out \
          ARCH=arm64 \
          olddefconfig


        echo
        echo "========================================"
        echo "FINAL CONFIGURATION"
        echo "========================================"

        grep -E '^CONFIG_KSU' \
          out/.config || true

        grep -E '^CONFIG_KSU_SUSFS' \
          out/.config || true

        grep -E '^CONFIG_NOMOUNT' \
          out/.config || true

        grep -E '^CONFIG_KPROBES' \
          out/.config || true


        echo
        echo "========================================"
        echo "KPROBES VALIDATION"
        echo "========================================"

        if grep -q '^CONFIG_KPROBES=y' out/.config; then
          echo "ERROR: CONFIG_KPROBES MUST BE DISABLED"
          exit 1
        else
          echo "OK: CONFIG_KPROBES IS NOT ENABLED"
        fi


        cp \
          out/.config \
          "out/${DEFCONFIG_NAME}"

        echo
        echo "FULL DEFCONFIG:"
        ls -lh "out/${DEFCONFIG_NAME}"

        wc -l "out/${DEFCONFIG_NAME}"


    # ============================================================
    # 11. Verify KernelSU sucompat Build
    # ============================================================

    - name: Verify KernelSU sucompat Build
      if: ${{ matrix.build_type != 'Base' }}
      run: |
        set -e

        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo "========================================"
        echo "VERIFY KERNELSU SUCOMPAT BUILD"
        echo "========================================"

        echo
        echo "CONFIG:"
        grep -E '^CONFIG_KSU|^CONFIG_KPROBES' out/.config || true

        echo
        echo "========================================"
        echo "KSU MAKEFILES"
        echo "========================================"

        find drivers/kernelsu \
          -name Makefile \
          -print

        echo
        echo "========================================"
        echo "SEARCH SUCOMPAT BUILD RULE"
        echo "========================================"

        grep -Rnw \
          --include='Makefile' \
          drivers/kernelsu \
          -e 'sucompat.o' \
          -e 'sucompat' || true

        echo
        echo "========================================"
        echo "CHECK SUCOMPAT SOURCE"
        echo "========================================"

        test -f drivers/kernelsu/feature/sucompat.c

        ls -lh \
          drivers/kernelsu/feature/sucompat.c

        echo
        echo "========================================"
        echo "SUCOMPAT DEFINITIONS"
        echo "========================================"

        grep -n \
          -E \
          'ksu_handle_stat|ksu_handle_faccessat|ksu_handle_execveat' \
          drivers/kernelsu/feature/sucompat.c

        echo
        echo "========================================"
        echo "CHECK SUCOMPAT OBJECT"
        echo "========================================"

        find out/drivers/kernelsu \
          -type f \
          \( \
            -name 'sucompat.o' \
            -o \
            -name 'sucompat.a' \
          \) \
          -print || true

        echo
        echo "========================================"
        echo "SYMBOL SEARCH IN SUCOMPAT OBJECT"
        echo "========================================"

        if [ -f out/drivers/kernelsu/feature/sucompat.o ]; then

          echo "FOUND: sucompat.o"

          llvm-nm \
            out/drivers/kernelsu/feature/sucompat.o \
            | grep -E \
              'ksu_handle_stat|ksu_handle_faccessat|ksu_handle_execveat' \
            || true

        else

          echo "WARNING: sucompat.o DOES NOT EXIST"

        fi

        echo
        echo "========================================"
        echo "SUCOMPAT VERIFICATION COMPLETE"
        echo "========================================"


    # ============================================================
    # 12. Upload Full Final Defconfig
    # ============================================================

    - name: Upload Full Final Defconfig Before Build
      uses: actions/upload-artifact@v4
      with:
        name: full-final-defconfig-${{ matrix.build_type }}-${{ env.BUILD_TIME }}
        path: out/*-full_defconfig
        if-no-files-found: error
        retention-days: 7


    # ============================================================
    # 13. Verify Build Configuration
    # ============================================================

    - name: Verify Build Configuration
      run: |
        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo "========================================"
        echo "VERIFYING ACTIVE BUILD CONFIG"
        echo "========================================"

        test -f out/.config

        echo
        echo "CONFIG LINE COUNT:"
        wc -l out/.config

        echo
        echo "BUILD TYPE:"
        echo "${{ matrix.build_type }}"

        echo
        echo "KERNELSU:"
        grep -E '^CONFIG_KSU' out/.config || true

        echo
        echo "SUSFS:"
        grep -E '^CONFIG_KSU_SUSFS' out/.config || true

        echo
        echo "NOMOUNT:"
        grep -E '^CONFIG_NOMOUNT' out/.config || true

        echo
        echo "========================================"
        echo "BUILD CONFIG READY"
        echo "========================================"


    # ============================================================
    # 14. Build Kernel
    # ============================================================

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        export KBUILD_BUILD_USER=Manipulator
        export KBUILD_BUILD_HOST=LineageOS
        export KBUILD_COMPILER_STRING="$CLANG_PATH/clang"

        echo "========================================"
        echo "BUILDING KERNEL"
        echo "========================================"

        echo "BUILD TYPE: ${{ matrix.build_type }}"

        make -j$(nproc --all) \
          O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang \
          CLANG_TRIPLE=$CLANG_PATH/aarch64-linux-gnu- \
          CROSS_COMPILE=$GCC64_PATH/bin/aarch64-elf- \
          CROSS_COMPILE_ARM32=$GCC32_PATH/bin/arm-eabi- \
          2>&1 | tee build.log


    # ============================================================
    # 15. Verify Kernel
    # ============================================================

    - name: Check Build Output
      run: |
        echo "========================================"
        echo "CHECKING BUILD"
        echo "========================================"

        test -f out/arch/arm64/boot/Image.gz

        echo
        echo "========================================"
        echo "BUILD SUCCESS"
        echo "========================================"

        echo "TYPE: ${{ matrix.build_type }}"

        ls -lh \
          out/arch/arm64/boot/Image.gz


    # ============================================================
    # 16. Package AnyKernel3
    # ============================================================

    - name: Package AnyKernel3
      run: |
        echo "========================================"
        echo "PACKAGING ANYKERNEL3"
        echo "========================================"

        git clone \
          --depth=1 \
          -b sixteen \
          https://github.com/Joker-V2/AnyKernel3.git \
          AK3

        cp \
          out/arch/arm64/boot/Image.gz \
          AK3/

        if [ -f out/arch/arm64/boot/dtbo.img ]; then
          cp \
            out/arch/arm64/boot/dtbo.img \
            AK3/
        fi

        cd AK3

        zip -r9 \
          "../Kernel-violet-${{ matrix.build_type }}-${BUILD_TIME}.zip" \
          *

        cd ..

        echo
        ls -lh \
          "Kernel-violet-${{ matrix.build_type }}-${BUILD_TIME}.zip"


    # ============================================================
    # 17. Upload Kernel ZIP
    # ============================================================

    - name: Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-violet-${{ matrix.build_type }}-${{ env.BUILD_TIME }}
        path: Kernel-violet-${{ matrix.build_type }}-${{ env.BUILD_TIME }}.zip
        if-no-files-found: error
        retention-days: 7


    # ============================================================
    # 18. Upload Build Log
    # ============================================================

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ matrix.build_type }}-${{ env.BUILD_TIME }}
        path: build.log
        if-no-files-found: warn
        retention-days: 7
