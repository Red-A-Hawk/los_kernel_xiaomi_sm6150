name: CROSS_COMPILE 13-REFERENCE DIAGNOSTIC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run 13-reference diagnostic
        shell: bash
        run: |
          set +e

          REPORT="cross_compile_13_report.txt"
          : > "$REPORT"

          echo "========================================" | tee -a "$REPORT"
          echo "CROSS_COMPILE 13-REFERENCE DIAGNOSTIC" | tee -a "$REPORT"
          echo "========================================" | tee -a "$REPORT"
          echo "" | tee -a "$REPORT"

          PASS=0
          WARN=0
          FAIL=0

          check() {
            local name="$1"
            local result="$2"
            local detail="$3"

            echo "[$result] $name" | tee -a "$REPORT"
            echo "    $detail" | tee -a "$REPORT"
            echo "" | tee -a "$REPORT"

            case "$result" in
              PASS) PASS=$((PASS + 1)) ;;
              WARN) WARN=$((WARN + 1)) ;;
              FAIL) FAIL=$((FAIL + 1)) ;;
            esac
          }

          echo "========================================" | tee -a "$REPORT"
          echo "REFERENCE 1: TOP-LEVEL CROSS_COMPILE" | tee -a "$REPORT"
          echo "========================================" | tee -a "$REPORT"

          if grep -nE '^[[:space:]]*CROSS_COMPILE[[:space:]]*[?:+]?=' Makefile 2>/dev/null; then
            check \
              "Makefile CROSS_COMPILE definition" \
              "PASS" \
              "Top-level Kbuild CROSS_COMPILE definition detected."
          else
            check \
              "Makefile CROSS_COMPILE definition" \
              "WARN" \
              "No direct top-level CROSS_COMPILE assignment detected."
          fi


          echo "========================================" | tee -a "$REPORT"
          echo "REFERENCE 2: KERNEL CONFIG CROSS_COMPILE" | tee -a "$REPORT"
          echo "========================================" | tee -a "$REPORT"

          if grep -nE 'config CROSS_COMPILE|CONFIG_CROSS_COMPILE' \
              init/Kconfig arch/arm64/configs 2>/dev/null; then
            check \
              "CONFIG_CROSS_COMPILE" \
              "PASS" \
              "Kconfig/defconfig CROSS_COMPILE references detected."
          else
            check \
              "CONFIG_CROSS_COMPILE" \
              "WARN" \
              "No CONFIG_CROSS_COMPILE reference detected."
          fi


          echo "========================================" | tee -a "$REPORT"
          echo "REFERENCE 3: GCC TOOL DEFINITIONS" | tee -a "$REPORT"
          echo "========================================" | tee -a "$REPORT"

          GCC_REFS=$(grep -nE \
            '(^|[^A-Za-z0-9_])(CC|LD|AR|NM|OBJCOPY|OBJDUMP|READELF|STRIP)[[:space:]]*=' \
            Makefile 2>/dev/null)

          if echo "$GCC_REFS" | grep -q 'CROSS_COMPILE'; then
            check \
              "GCC CROSS_COMPILE tool mapping" \
              "PASS" \
              "CC/LD/AR/NM/OBJCOPY/OBJDUMP/READELF/STRIP are mapped through CROSS_COMPILE."
          else
            check \
              "GCC CROSS_COMPILE tool mapping" \
              "WARN" \
              "Expected GCC tool mapping was not detected."
          fi


          echo "========================================" | tee -a "$REPORT"
          echo "REFERENCE 4: ARCH/ARM64 CROSS_COMPILE" | tee -a "$REPORT"
          echo "========================================" | tee -a "$REPORT"

          ARCH_REFS=$(grep -RInE \
            'CROSS_COMPILE[[:space:]]*[:?+]?=' \
            arch/arm64 2>/dev/null)

          if [ -n "$ARCH_REFS" ]; then
            echo "$ARCH_REFS" | tee -a "$REPORT"
            check \
              "arch/arm64 CROSS_COMPILE" \
              "PASS" \
              "Architecture-specific CROSS_COMPILE references detected."
          else
            check \
              "arch/arm64 CROSS_COMPILE" \
              "PASS" \
              "No arch/arm64 override detected; top-level value remains authoritative."
          fi


          echo "========================================" | tee -a "$REPORT"
          echo "REFERENCE 5: CROSS_COMPILE_ARM32" | tee -a "$REPORT"
          echo "========================================" | tee -a "$REPORT"

          ARM32_REFS=$(grep -RInE \
            'CROSS_COMPILE_ARM32|CROSS_COMPILE_COMPAT' \
            --exclude-dir=.git \
            --exclude='cross_compile_13_report.txt' \
            . 2>/dev/null)

          if echo "$ARM32_REFS" | grep -q 'CROSS_COMPILE_ARM32'; then
            echo "$ARM32_REFS" | tee -a "$REPORT"
            check \
              "CROSS_COMPILE_ARM32" \
              "WARN" \
              "ARM32/compat references exist. These must be evaluated separately from arm64 GCC/Clang."
          else
            check \
              "CROSS_COMPILE_ARM32" \
              "PASS" \
              "No CROSS_COMPILE_ARM32 reference detected."
          fi


          echo "========================================" | tee -a "$REPORT"
          echo "REFERENCE 6: CROSS_COMPILE_COMPAT" | tee -a "$REPORT"
          echo "========================================" | tee -a "$REPORT"

          if echo "$ARM32_REFS" | grep -q 'CROSS_COMPILE_COMPAT'; then
            check \
              "CROSS_COMPILE_COMPAT" \
              "WARN" \
              "Compat cross compiler reference detected."
          else
            check \
              "CROSS_COMPILE_COMPAT" \
              "PASS" \
              "No CROSS_COMPILE_COMPAT reference detected."
          fi


          echo "========================================" | tee -a "$REPORT"
          echo "REFERENCE 7: AndroidKernel.mk" | tee -a "$REPORT"
          echo "========================================" | tee -a "$REPORT"

          if [ -f AndroidKernel.mk ]; then
            AK_REFS=$(grep -nE \
              'CROSS_COMPILE|KERNEL_CROSS_COMPILE|TARGET_KERNEL_CROSS_COMPILE_PREFIX' \
              AndroidKernel.mk 2>/dev/null)

            echo "$AK_REFS" | tee -a "$REPORT"

            if echo "$AK_REFS" | grep -q 'KERNEL_CROSS_COMPILE'; then
              check \
                "AndroidKernel.mk CROSS_COMPILE" \
                "WARN" \
                "AndroidKernel.mk explicitly supplies KERNEL_CROSS_COMPILE to kernel make."
            else
              check \
                "AndroidKernel.mk CROSS_COMPILE" \
                "PASS" \
                "AndroidKernel.mk contains no active KERNEL_CROSS_COMPILE assignment."
            fi
          else
            check \
              "AndroidKernel.mk CROSS_COMPILE" \
              "PASS" \
              "AndroidKernel.mk does not exist in this tree."
          fi


          echo "========================================" | tee -a "$REPORT"
          echo "REFERENCE 8: build.config.aarch64" | tee -a "$REPORT"
          echo "========================================" | tee -a "$REPORT"

          if [ -f build.config.aarch64 ]; then
            grep -nE 'CROSS_COMPILE|GCC_CROSS_COMPILE' \
              build.config.aarch64 | tee -a "$REPORT"

            check \
              "build.config.aarch64" \
              "PASS" \
              "AArch64 build configuration contains CROSS_COMPILE information."
          else
            check \
              "build.config.aarch64" \
              "PASS" \
              "build.config.aarch64 not present."
          fi


          echo "========================================" | tee -a "$REPORT"
          echo "REFERENCE 9: GCC TOOLCHAIN PATHS" | tee -a "$REPORT"
          echo "========================================" | tee -a "$REPORT"

          GCC_PATH_REFS=$(grep -RInE \
            'prebuilts/gcc|gcc.*CROSS_COMPILE|CROSS_COMPILE.*gcc' \
            --exclude-dir=.git \
            --exclude='cross_compile_13_report.txt' \
            . 2>/dev/null)

          if [ -n "$GCC_PATH_REFS" ]; then
            echo "$GCC_PATH_REFS" | tee -a "$REPORT"
            check \
              "GCC toolchain path references" \
              "PASS" \
              "GCC toolchain references detected."
          else
            check \
              "GCC toolchain path references" \
              "WARN" \
              "No GCC toolchain path reference detected."
          fi


          echo "========================================" | tee -a "$REPORT"
          echo "REFERENCE 10: CLANG REFERENCES" | tee -a "$REPORT"
          echo "========================================" | tee -a "$REPORT"

          CLANG_REFS=$(grep -RInE \
            '(^|[^A-Za-z0-9_])(CC[[:space:]]*=[[:space:]]*clang|LLVM=|clang|ld\.lld|llvm-ar|llvm-nm|llvm-objcopy|llvm-objdump|llvm-strip)' \
            --exclude-dir=.git \
            --exclude='cross_compile_13_report.txt' \
            . 2>/dev/null)

          if [ -n "$CLANG_REFS" ]; then
            echo "$CLANG_REFS" | head -n 200 | tee -a "$REPORT"
            check \
              "Clang/LLVM references" \
              "PASS" \
              "Clang/LLVM tool references detected."
          else
            check \
              "Clang/LLVM references" \
              "WARN" \
              "No Clang/LLVM references detected."
          fi


          echo "========================================" | tee -a "$REPORT"
          echo "REFERENCE 11: CLANG + CROSS_COMPILE RELATION" | tee -a "$REPORT"
          echo "========================================" | tee -a "$REPORT"

          if grep -RInE \
            'CC[[:space:]]*=[[:space:]]*clang|LLVM[[:space:]]*=' \
            --exclude-dir=.git \
            --exclude='cross_compile_13_report.txt' \
            . >/tmp/clang_refs 2>/dev/null; then

            if grep -RInE \
              'CROSS_COMPILE[[:space:]]*=' \
              --exclude-dir=.git \
              --exclude='cross_compile_13_report.txt' \
              . >/tmp/cross_refs 2>/dev/null; then

              check \
                "Clang CROSS_COMPILE relationship" \
                "PASS" \
                "Clang and CROSS_COMPILE are independently represented; CROSS_COMPILE is not being used as clang binary prefix."
            else
              check \
                "Clang CROSS_COMPILE relationship" \
                "PASS" \
                "Clang is configured without an explicit CROSS_COMPILE override."
            fi
          else
            check \
              "Clang CROSS_COMPILE relationship" \
              "WARN" \
              "No explicit Clang configuration detected."
          fi


          echo "========================================" | tee -a "$REPORT"
          echo "REFERENCE 12: GNU BINUTILS USED WITH CLANG" | tee -a "$REPORT"
          echo "========================================" | tee -a "$REPORT"

          GNU_WITH_CLANG=$(grep -RInE \
            'CC[[:space:]]*=[[:space:]]*clang|LLVM=' \
            --exclude-dir=.git \
            --exclude='cross_compile_13_report.txt' \
            . 2>/dev/null)

          GNU_BINUTILS=$(grep -RInE \
            'LD[[:space:]]*=[[:space:]]*[^ ]*ld([[:space:]]|$)|AR[[:space:]]*=[[:space:]]*[^ ]*ar([[:space:]]|$)|OBJCOPY[[:space:]]*=' \
            --exclude-dir=.git \
            --exclude='cross_compile_13_report.txt' \
            . 2>/dev/null)

          if [ -n "$GNU_WITH_CLANG" ] && [ -n "$GNU_BINUTILS" ]; then
            echo "$GNU_BINUTILS" | head -n 100 | tee -a "$REPORT"
            check \
              "Clang/GNU binutils mixing" \
              "WARN" \
              "Clang configuration and GNU binutils references coexist. Verify intentionally."
          else
            check \
              "Clang/GNU binutils mixing" \
              "PASS" \
              "No suspicious explicit Clang/GNU binutils conflict detected."
          fi


          echo "========================================" | tee -a "$REPORT"
          echo "REFERENCE 13: FINAL EFFECTIVE CONFIG" | tee -a "$REPORT"
          echo "========================================" | tee -a "$REPORT"

          {
            echo "ARCH=${ARCH:-<not-set>}"
            echo "CROSS_COMPILE=${CROSS_COMPILE:-<not-set>}"
            echo "CROSS_COMPILE_ARM32=${CROSS_COMPILE_ARM32:-<not-set>}"
            echo "CROSS_COMPILE_COMPAT=${CROSS_COMPILE_COMPAT:-<not-set>}"
            echo "CC=${CC:-<not-set>}"
            echo "LD=${LD:-<not-set>}"
            echo "AR=${AR:-<not-set>}"
            echo "NM=${NM:-<not-set>}"
            echo "OBJCOPY=${OBJCOPY:-<not-set>}"
            echo "OBJDUMP=${OBJDUMP:-<not-set>}"
            echo "READELF=${READELF:-<not-set>}"
            echo "STRIP=${STRIP:-<not-set>}"
          } | tee -a "$REPORT"

          echo "" | tee -a "$REPORT"

          echo "========================================" | tee -a "$REPORT"
          echo "RECOMMENDED MODEL" | tee -a "$REPORT"
          echo "========================================" | tee -a "$REPORT"

          cat <<'EOF' | tee -a "$REPORT"

          GCC:
            CROSS_COMPILE=<GCC PREFIX>

          Clang:
            CC=clang
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            READELF=llvm-readelf
            STRIP=llvm-strip

          IMPORTANT:
            CROSS_COMPILE must not be used as the clang executable prefix.

            With Clang, CROSS_COMPILE may still be used as the target
            triple/prefix when required by this kernel's Kbuild.

            CROSS_COMPILE_ARM32 and CROSS_COMPILE_COMPAT are independent
            compatibility/32-bit paths and must not be invented unless
            the source tree actually requires them.

          EOF

          echo "========================================" | tee -a "$REPORT"
          echo "SUMMARY" | tee -a "$REPORT"
          echo "========================================" | tee -a "$REPORT"

          echo "PASS = $PASS" | tee -a "$REPORT"
          echo "WARN = $WARN" | tee -a "$REPORT"
          echo "FAIL = $FAIL" | tee -a "$REPORT"
          echo "" | tee -a "$REPORT"

          if [ "$FAIL" -gt 0 ]; then
            echo "FINAL RESULT: FAIL" | tee -a "$REPORT"
          elif [ "$WARN" -gt 0 ]; then
            echo "FINAL RESULT: WARN" | tee -a "$REPORT"
          else
            echo "FINAL RESULT: PASS" | tee -a "$REPORT"
          fi

          echo ""
          echo "========================================"
          echo "REPORT: $REPORT"
          echo "========================================"

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: cross-compile-13-diagnostic
          path: cross_compile_13_report.txt
