name: Build Real Clang PGO PROCS V1.1 (finale)

"on":
  workflow_dispatch:

jobs:
  build-pgo:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            curl \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            binutils-aarch64-linux-gnu \
            device-tree-compiler \
            cpio \
            python3 \
            unzip

      # ============================================================
      # 3. DOWNLOAD TOOLCHAINS
      # ============================================================
      - name: Download Toolchains
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/toolchains"
          cd "$GITHUB_WORKSPACE/toolchains"

          echo "============================================================"
          echo "Downloading LineageOS Clang r416183b"
          echo "============================================================"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            clang

          echo
          echo "============================================================"
          echo "Downloading GCC64 4.9"
          echo "============================================================"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          echo
          echo "============================================================"
          echo "Downloading GCC32 4.9"
          echo "============================================================"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

      # ============================================================
      # 4. SET TOOLCHAIN ENVIRONMENT
      # ============================================================
      - name: Setup Toolchain Environment
        run: |
          set -e

          export CLANG_PATH="$GITHUB_WORKSPACE/toolchains/clang"
          export GCC64_PATH="$GITHUB_WORKSPACE/toolchains/gcc64"
          export GCC32_PATH="$GITHUB_WORKSPACE/toolchains/gcc32"

          export CROSS_COMPILE="$GCC64_PATH/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GCC32_PATH/bin/arm-linux-androideabi-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"

          echo "CLANG_PATH=$CLANG_PATH" >> "$GITHUB_ENV"
          echo "GCC64_PATH=$GCC64_PATH" >> "$GITHUB_ENV"
          echo "GCC32_PATH=$GCC32_PATH" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE=$CROSS_COMPILE" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32" >> "$GITHUB_ENV"
          echo "CLANG_TRIPLE=$CLANG_TRIPLE" >> "$GITHUB_ENV"

          echo "$CLANG_PATH/bin" >> "$GITHUB_PATH"
          echo "$GCC64_PATH/bin" >> "$GITHUB_PATH"
          echo "$GCC32_PATH/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 5. VERIFY TOOLCHAINS
      # ============================================================
      - name: Verify Toolchains
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "TOOLCHAIN INFORMATION"
          echo "============================================================"

          echo
          echo "Clang:"
          clang --version

          echo
          echo "LLD:"
          ld.lld --version

          echo
          echo "LLVM AR:"
          llvm-ar --version | head -n 1

          echo
          echo "LLVM NM:"
          llvm-nm --version | head -n 1

          echo
          echo "LLVM OBJCOPY:"
          llvm-objcopy --version | head -n 1

          echo
          echo "LLVM OBJDUMP:"
          llvm-objdump --version | head -n 1

          echo
          echo "LLVM READELF:"
          llvm-readelf --version | head -n 1

          echo
          echo "LLVM PROF-DATA:"
          command -v llvm-profdata

          if llvm-profdata merge --help >/dev/null 2>&1; then
            echo "[OK] llvm-profdata merge supported"
          else
            echo "[FAIL] llvm-profdata merge is not functional"
            exit 1
          fi

          echo
          echo "GCC64:"
          aarch64-linux-android-gcc --version | head -n 1

          echo
          echo "GCC32:"
          arm-linux-androideabi-gcc --version | head -n 1

          echo
          echo "============================================================"
          echo "TOOLCHAIN PATHS"
          echo "============================================================"

          command -v clang
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          command -v llvm-objcopy
          command -v llvm-objdump
          command -v llvm-strip
          command -v llvm-readelf
          command -v llvm-profdata
          command -v aarch64-linux-android-gcc
          command -v arm-linux-androideabi-gcc

      # ============================================================
      # 6. DOWNLOAD PGO PATCH
      # ============================================================
      - name: Download PGO Patch
        run: |
          set -e

          PATCH_URL="https://raw.githubusercontent.com/Red-A-Hawk/Patch/kernel_xiaomi_violet/0001-ARM64-Clang-PGO-4.14-RedHawk-final2.patch"
          PATCH_FILE="$GITHUB_WORKSPACE/0001-ARM64-Clang-PGO-4.14-RedHawk-final.patch"

          echo "============================================================"
          echo "DOWNLOAD PGO PATCH"
          echo "============================================================"

          wget -O "$PATCH_FILE" "$PATCH_URL"

          echo
          echo "Patch size:"
          wc -c "$PATCH_FILE"

      # ============================================================
      # 7. APPLY PGO PATCH
      # ============================================================
      - name: Apply PGO Patch
        run: |
          set -e

          PATCH_FILE="$GITHUB_WORKSPACE/0001-ARM64-Clang-PGO-4.14-RedHawk-final.patch"

          echo "============================================================"
          echo "APPLY PGO PATCH (patch -p1)"
          echo "============================================================"

          set +e

          patch -p1 \
            --fuzz=3 \
            --ignore-whitespace \
            --no-backup-if-mismatch \
            < "$PATCH_FILE"

          PATCH_STATUS=$?

          set -e

          echo
          echo "patch exit code: $PATCH_STATUS"

          echo
          echo "============================================================"
          echo "HANDLE arch/arm64/Kconfig SEPARATELY IF NEEDED"
          echo "============================================================"

          if [ -f arch/arm64/Kconfig.rej ]; then

            echo "[WARN] arch/arm64/Kconfig hunk rejected, applying manually"

            rm -f \
              arch/arm64/Kconfig.rej \
              arch/arm64/Kconfig.orig

            if grep -q \
                "select ARCH_SUPPORTS_PGO_CLANG" \
                arch/arm64/Kconfig; then

              echo "[OK] ARCH_SUPPORTS_PGO_CLANG already present"

            elif grep -q \
                "select ARCH_SUPPORTS_THINLTO" \
                arch/arm64/Kconfig; then

              sed -i \
                '/select ARCH_SUPPORTS_THINLTO/a\  select ARCH_SUPPORTS_PGO_CLANG' \
                arch/arm64/Kconfig

              echo "[OK] Inserted ARCH_SUPPORTS_PGO_CLANG"

            else

              echo "[FAIL] Could not find ARCH_SUPPORTS_THINLTO"
              exit 1

            fi

          else

            echo "[OK] arch/arm64/Kconfig applied cleanly from patch"

          fi

          echo
          echo "============================================================"
          echo "NORMALIZE INDENTATION (tabs, not spaces) FOR SELECT LINES"
          echo "============================================================"

          # The patch/fuzz application can occasionally leave the PGO
          # select line (and the line right after it) indented with
          # spaces instead of a tab. Kconfig tolerates this, but we
          # normalize it anyway to keep the file consistent.

          sed -i \
            's/^[ ]\{1,\}select ARCH_SUPPORTS_PGO_CLANG$/\tselect ARCH_SUPPORTS_PGO_CLANG/' \
            arch/arm64/Kconfig

          sed -i \
            's/^[ ]\{1,\}select ARCH_SUPPORTS_POLLY_CLANG$/\tselect ARCH_SUPPORTS_POLLY_CLANG/' \
            arch/arm64/Kconfig

          echo "[OK] Indentation normalized"

          echo
          echo "============================================================"
          echo "VERIFY NO REMAINING REJECTED HUNKS"
          echo "============================================================"

          if find . -name "*.rej" | grep -q .; then

            echo "[FAIL] Rejected hunks still remain:"

            find . -name "*.rej" \
              -exec echo "--- {} ---" \; \
              -exec cat {} \;

            exit 1

          fi

          echo "[OK] No rejected hunks remain"

          echo
          echo "============================================================"
          echo "VERIFY ARCH_SUPPORTS_PGO_CLANG"
          echo "============================================================"

          if grep -n \
              "ARCH_SUPPORTS_PGO_CLANG" \
              arch/arm64/Kconfig; then

            echo "[OK] ARCH_SUPPORTS_PGO_CLANG confirmed"

          else

            echo "[FAIL] ARCH_SUPPORTS_PGO_CLANG missing"
            exit 1

          fi

          echo
          echo "Changed files:"
          git status --short

      # ============================================================
      # 8. FIX PGO LINKER CONTEXT
      # ============================================================
      - name: Fix PGO Linker Context
        run: |
          set -e

          LDSH="include/asm-generic/vmlinux.lds.h"
          ARM64_LDS_MK="arch/arm64/kernel/Makefile"
          ARM64_LDS_S="arch/arm64/kernel/vmlinux.lds.S"

          echo "============================================================"
          echo "FIX PGO LINKER CONTEXT"
          echo "============================================================"

          echo
          echo "[1] Verify PGO_CLANG_DATA definition"

          if grep -q \
              -E '^#(if defined\(CONFIG_PGO_CLANG\) && defined\(LINKER_SCRIPT\)|ifdef CONFIG_PGO_CLANG)$' \
              "$LDSH" && \
             grep -q \
              '^#define PGO_CLANG_DATA' \
              "$LDSH"; then

            echo "[OK] PGO_CLANG_DATA definition found"

          else

            echo "[FAIL] PGO_CLANG_DATA definition not found"

            grep -n \
              -E 'PGO_CLANG_DATA|CONFIG_PGO_CLANG|LINKER_SCRIPT' \
              "$LDSH" || true

            exit 1

          fi

          echo
          echo "[2] Verify PGO_CLANG_DATA placement"

          if ! grep -q \
              "__llvm_prf_data_start" \
              "$LDSH"; then

            echo "[FAIL] PGO_CLANG_DATA definition is missing"
            exit 1

          fi

          if awk '
            /^#define RW_DATA_SECTION/ {
              in_rw=1
              next
            }

            in_rw && /^#define / {
              exit
            }

            in_rw && /BUG_TABLE/ {
              if (getline nextline > 0 && nextline ~ /PGO_CLANG_DATA/) {
                found=1
              }
              exit
            }

            END {
              exit(found ? 0 : 1)
            }
          ' "$LDSH"; then

            echo "[OK] PGO_CLANG_DATA already follows BUG_TABLE"

          else

            echo "[WARN] PGO_CLANG_DATA is not immediately after BUG_TABLE"
            echo "[INFO] Fixing RW_DATA_SECTION"

            TMP_LDSH="${LDSH}.pgo.tmp"

            awk '
              BEGIN {
                in_rw=0
                pending=0
                inserted=0
              }

              /^#define RW_DATA_SECTION/ {
                in_rw=1
              }

              in_rw && /^#define / && $0 !~ /^#define RW_DATA_SECTION/ {
                in_rw=0
              }

              pending {
                if ($0 ~ /PGO_CLANG_DATA/) {
                  print
                  inserted=1
                  pending=0
                  next
                }

                print "  PGO_CLANG_DATA"
                inserted=1
                pending=0
              }

              {
                print
              }

              in_rw && /BUG_TABLE/ {
                pending=1
              }

              END {
                if (pending) {
                  print "  PGO_CLANG_DATA"
                  inserted=1
                }

                if (!inserted) {
                  exit 1
                }
              }
            ' "$LDSH" > "$TMP_LDSH"

            mv "$TMP_LDSH" "$LDSH"

            echo "[OK] PGO_CLANG_DATA inserted after BUG_TABLE"

          fi

          echo
          echo "[3] Final BUG_TABLE -> PGO_CLANG_DATA check"

          if awk '
            /^#define RW_DATA_SECTION/ {
              in_rw=1
              next
            }

            in_rw && /^#define / {
              exit
            }

            in_rw && /BUG_TABLE/ {
              if (getline nextline > 0 && nextline ~ /PGO_CLANG_DATA/) {
                found=1
              }
              exit
            }

            END {
              exit(found ? 0 : 1)
            }
          ' "$LDSH"; then

            echo "[OK] BUG_TABLE -> PGO_CLANG_DATA"

          else

            echo "[FAIL] PGO_CLANG_DATA is not immediately after BUG_TABLE"

            grep -n \
              -B5 \
              -A10 \
              "BUG_TABLE" \
              "$LDSH" || true

            exit 1

          fi

          echo
          echo "[4] Verify vmlinux.lds.S has no manual PGO marker"

          if grep -q \
              "^#define PGO_CLANG_LINKER$" \
              "$ARM64_LDS_S"; then

            echo "[FAIL] PGO_CLANG_LINKER must not be defined in vmlinux.lds.S"
            exit 1

          else

            echo "[OK] No manual PGO linker marker in vmlinux.lds.S"

          fi

          echo
          echo "[5] Verify arch/arm64/kernel/Makefile unchanged"

          if git diff --quiet -- "$ARM64_LDS_MK"; then

            echo "[OK] arch/arm64/kernel/Makefile unchanged"

          else

            echo "[FAIL] arch/arm64/kernel/Makefile was modified"
            git diff -- "$ARM64_LDS_MK"
            exit 1

          fi

          echo
          echo "[6] Final PGO linker context"

          grep -n \
            -B5 \
            -A15 \
            "BUG_TABLE" \
            "$LDSH" || true

          echo
          echo "PGO linker condition:"

          grep -n \
            -B3 \
            -A20 \
            -E '#if defined\(CONFIG_PGO_CLANG\)|#ifdef CONFIG_PGO_CLANG|LINKER_SCRIPT' \
            "$LDSH" || true

          echo
          echo "============================================================"
          echo "[OK] PGO linker context configured"
          echo "============================================================"

      # ============================================================
      # 9. VERIFY PGO INTEGRATION
      # ============================================================
      - name: Verify PGO Integration
        run: |
          set -e

          echo "============================================================"
          echo "VERIFY PGO INTEGRATION"
          echo "============================================================"

          FAIL=0

          echo
          echo "[1] Root Makefile"

          if grep -n \
              "CFLAGS_PGO_CLANG" \
              Makefile; then

            echo "[OK] CFLAGS_PGO_CLANG found"

          else

            echo "[FAIL] CFLAGS_PGO_CLANG missing"
            FAIL=1

          fi

          echo
          echo "[2] arch/Kconfig"

          if grep -n \
              'source "kernel/pgo/Kconfig"' \
              arch/Kconfig; then

            echo "[OK] kernel/pgo/Kconfig found"

          else

            echo "[FAIL] kernel/pgo/Kconfig missing"
            FAIL=1

          fi

          echo
          echo "[3] ARM64 Kconfig"

          if grep -n \
              "ARCH_SUPPORTS_PGO_CLANG" \
              arch/arm64/Kconfig; then

            echo "[OK] ARM64 PGO support found"

          else

            echo "[FAIL] ARM64 PGO support missing"
            FAIL=1

          fi

          echo
          echo "[4] ARM64 VDSO"

          if grep -n \
              "PGO_PROFILE := n" \
              arch/arm64/kernel/vdso/Makefile; then

            echo "[OK] VDSO PGO disabled"

          else

            echo "[FAIL] VDSO PGO setting missing"
            FAIL=1

          fi

          echo
          echo "[5] kernel/Makefile"

          if grep -n \
              'obj-\$(CONFIG_PGO_CLANG).*pgo' \
              kernel/Makefile; then

            echo "[OK] kernel/pgo registered"

          else

            echo "[FAIL] kernel/pgo not registered"
            FAIL=1

          fi

          echo
          echo "[6] scripts/Makefile.lib"

          if grep -n \
              "CFLAGS_PGO_CLANG" \
              scripts/Makefile.lib; then

            echo "[OK] PGO flags integrated"

          else

            echo "[FAIL] PGO flags missing"
            FAIL=1

          fi

          echo
          echo "[7] vmlinux linker"

          if grep -n \
              "__llvm_prf_data" \
              include/asm-generic/vmlinux.lds.h; then

            echo "[OK] LLVM PGO linker sections found"

          else

            echo "[FAIL] LLVM PGO linker sections missing"
            FAIL=1

          fi

          echo
          echo "[8] BUG_TABLE -> PGO_CLANG_DATA"

          if awk '
            /^#define RW_DATA_SECTION/ {
              in_rw=1
              next
            }

            in_rw && /^#define / {
              exit
            }

            in_rw && /BUG_TABLE/ {
              if (getline nextline > 0 && nextline ~ /PGO_CLANG_DATA/) {
                found=1
              }
              exit
            }

            END {
              exit(found ? 0 : 1)
            }
          ' include/asm-generic/vmlinux.lds.h; then

            echo "[OK] BUG_TABLE -> PGO_CLANG_DATA"

          else

            echo "[FAIL] PGO_CLANG_DATA placement incorrect"
            FAIL=1

          fi

          echo
          echo "[9] PGO linker marker"

          if grep -n \
              "^#define PGO_CLANG_LINKER$" \
              arch/arm64/kernel/vmlinux.lds.S; then

            echo "[FAIL] PGO_CLANG_LINKER must not be defined directly"
            FAIL=1

          else

            echo "[OK] No manual PGO_CLANG_LINKER definition"

          fi

          echo
          echo "[10] PGO_CLANG_DATA definition"

          if grep -q \
              -E '^#(if defined\(CONFIG_PGO_CLANG\) && defined\(LINKER_SCRIPT\)|ifdef CONFIG_PGO_CLANG)$' \
              include/asm-generic/vmlinux.lds.h && \
             grep -q \
              '^#define PGO_CLANG_DATA' \
              include/asm-generic/vmlinux.lds.h; then

            echo "[OK] PGO_CLANG_DATA definition is valid"

          else

            echo "[FAIL] PGO_CLANG_DATA definition is invalid"
            FAIL=1

          fi

          echo
          echo "[11] kernel/pgo files"

          if [ -f kernel/pgo/Kconfig ] && \
             [ -f kernel/pgo/Makefile ] && \
             [ -f kernel/pgo/fs.c ] && \
             [ -f kernel/pgo/instrument.c ] && \
             [ -f kernel/pgo/pgo.h ]; then

            echo "[OK] kernel/pgo files complete"

          else

            echo "[FAIL] kernel/pgo files incomplete"
            FAIL=1

          fi

          echo
          echo "[12] Protected files"

          if git diff --quiet -- arch/arm64/Makefile; then

            echo "[OK] arch/arm64/Makefile unchanged"

          else

            echo "[FAIL] arch/arm64/Makefile was modified"
            FAIL=1

          fi

          if git diff --quiet -- arch/arm64/kernel/Makefile; then

            echo "[OK] arch/arm64/kernel/Makefile unchanged"

          else

            echo "[FAIL] arch/arm64/kernel/Makefile was modified"
            FAIL=1

          fi

          if git diff --quiet -- \
              drivers/firmware/efi/libstub/Makefile; then

            echo "[OK] EFI libstub Makefile unchanged"

          else

            echo "[FAIL] EFI libstub Makefile was modified"
            FAIL=1

          fi

          echo
          echo "============================================================"

          if [ "$FAIL" -ne 0 ]; then

            echo "PGO INTEGRATION: FAILED"
            exit 1

          fi

          echo "PGO INTEGRATION: OK"

      # ============================================================
      # 10. RUN VIOLET DEFCONFIG
      # ============================================================
      - name: Run Violet Defconfig
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "VIOLET PERF DEFCONFIG"
          echo "============================================================"

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            vendor/violet-perf_defconfig

          echo
          echo "============================================================"
          echo "CHECK PGO CONFIGURATION"
          echo "============================================================"

          if grep -q \
              "^CONFIG_PGO_CLANG=y$" \
              out/.config; then

            echo "[OK] CONFIG_PGO_CLANG=y"

          else

            echo "[FAIL] CONFIG_PGO_CLANG is not enabled"

            grep -E \
              "CONFIG_(ARCH_SUPPORTS_PGO_CLANG|PGO_CLANG|PROC_FS)=" \
              out/.config || true

            exit 1

          fi

          if grep -q \
              "^CONFIG_ARCH_SUPPORTS_PGO_CLANG=y$" \
              out/.config; then

            echo "[OK] CONFIG_ARCH_SUPPORTS_PGO_CLANG=y"

          else

            echo "[FAIL] CONFIG_ARCH_SUPPORTS_PGO_CLANG is not enabled"
            exit 1

          fi

          if grep -q \
              "^CONFIG_PROC_FS=y$" \
              out/.config; then

            echo "[OK] CONFIG_PROC_FS=y"

          else

            echo "[FAIL] CONFIG_PROC_FS is required"
            exit 1

          fi

          echo
          echo "Relevant configuration:"

          grep -E \
            "CONFIG_(ARCH_SUPPORTS_PGO_CLANG|PGO_CLANG|PROC_FS)=" \
            out/.config

      # ============================================================
      # 10A. DISABLE CC_STACKPROTECTOR_STRONG (WORKAROUND)
      #
      # The top-level Makefile's "prepare-compiler-check" target hard
      # -fails (exit 1) if CONFIG_CC_STACKPROTECTOR_STRONG (or
      # _REGULAR) is enabled and `cc-option` reports the matching
      # flag (-fstack-protector-strong / -fstack-protector) as
      # unsupported by $(CC). In this CI environment that cc-option
      # probe fails for this specific clang + old GCC 4.9
      # cross-toolchain combination, even though the flag itself is
      # trivially supported by clang 12 in isolation.
      #
      # Crucially: this hard failure ONLY triggers when stackp-name
      # is defined, i.e. only when STRONG or REGULAR is set. If
      # neither is set, the Makefile falls back to a *non-fatal*
      # cc-option probe for -fno-stack-protector (see Makefile lines
      # 781-792). So disabling both here sidesteps the broken check
      # entirely, at the cost of losing stack-protector hardening
      # for this particular PGO build.
      # ============================================================
      - name: Disable CC_STACKPROTECTOR_STRONG (workaround)
        run: |
          set -e

          echo "============================================================"
          echo "DISABLE CC_STACKPROTECTOR_STRONG / REGULAR (WORKAROUND)"
          echo "============================================================"

          echo
          echo "Before:"
          grep -E \
            "CONFIG_CC_STACKPROTECTOR" \
            out/.config \
            || echo "(no CC_STACKPROTECTOR lines present)"

          sed -i \
            -e '/CONFIG_CC_STACKPROTECTOR_REGULAR/d' \
            -e '/CONFIG_CC_STACKPROTECTOR_STRONG/d' \
            -e '/CONFIG_CC_STACKPROTECTOR_AUTO/d' \
            -e '/CONFIG_CC_STACKPROTECTOR_NONE/d' \
            out/.config

          {
            echo "# CONFIG_CC_STACKPROTECTOR_REGULAR is not set"
            echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set"
            echo "# CONFIG_CC_STACKPROTECTOR_AUTO is not set"
            echo "CONFIG_CC_STACKPROTECTOR_NONE=y"
          } >> out/.config

          echo
          echo "After:"
          grep -E \
            "CONFIG_CC_STACKPROTECTOR" \
            out/.config

          echo
          echo "[OK] Stack protector STRONG/REGULAR disabled to avoid"
          echo "     the broken prepare-compiler-check cc-option probe."

      # ============================================================
      # 11. DEBUG PGO LINKER PREPROCESSING
      #
      # NOTE (fix vs patchfinal2): GCC_TOOLCHAIN is intentionally NOT
      # passed to the "make prepare" calls below. Doing so breaks the
      # early Kbuild "prepare-compiler-check" cc-option test for
      # -fstack-protector-strong (clang tries to resolve headers/crt
      # against the old GCC 4.9 android prebuilt at this early stage
      # and the test compile fails, which Kbuild reports as an
      # unrelated-looking "flag not supported by compiler" error and
      # hard-stops the build). This matches the proven-working v13
      # script, which never sets GCC_TOOLCHAIN for "prepare".
      # ============================================================
      - name: Debug PGO Linker Preprocessing
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          DEBUG_DIR="$GITHUB_WORKSPACE/pgo-debug"
          mkdir -p "$DEBUG_DIR"

          LOG="$DEBUG_DIR/kbuild-vmlinux-lds.log"

          echo "============================================================"
          echo "DEBUG PGO CONFIG + LINKER PREPROCESSING"
          echo "============================================================"

          echo
          echo "============================================================"
          echo "[1] SOURCE CONFIGURATION"
          echo "============================================================"

          {
            echo "===== arch/arm64/kernel/Makefile ====="

            if git diff --quiet -- arch/arm64/kernel/Makefile; then
              echo "[OK] File unchanged"
            else
              echo "[FAIL] File modified"
            fi

            echo
            echo "===== BUG_TABLE -> PGO_CLANG_DATA ====="

            grep -n \
              -B5 \
              -A12 \
              "BUG_TABLE" \
              include/asm-generic/vmlinux.lds.h \
              || true

            echo
            echo "===== PGO_CLANG_DATA DEFINITION ====="

            grep -n \
              -B3 \
              -A35 \
              "PGO_CLANG_DATA" \
              include/asm-generic/vmlinux.lds.h \
              || true

            echo
            echo "===== PGO_CLANG_DATA REFERENCES ====="

            grep -n \
              -B8 \
              -A12 \
              "PGO_CLANG_DATA" \
              include/asm-generic/vmlinux.lds.h \
              || true

          } | tee "$DEBUG_DIR/source-config.txt"

          echo
          echo "============================================================"
          echo "[2] KCONFIG STATUS"
          echo "============================================================"

          {
            echo "===== out/.config ====="

            grep -n \
              -E \
              '^CONFIG_(PGO_CLANG|ARCH_SUPPORTS_PGO_CLANG)=' \
              out/.config \
              || true

            echo
            echo "===== include/linux/kconfig.h ====="

            grep -n \
              "CONFIG_PGO_CLANG" \
              include/linux/kconfig.h \
              || true

          } | tee "$DEBUG_DIR/pgo-config-status.txt"

          echo "============================================================"
          echo "[3] GENERATE KCONFIG HEADERS"
          echo "============================================================"

          echo "[INFO] clang path:"
          which clang

          echo "[INFO] clang version:"
          clang --version | head -n 1

          echo "[INFO] Preparing kernel environment (no GCC_TOOLCHAIN here)..."

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            prepare

          echo "============================================================"
          echo "[TEST 5] cc-option environment (no GCC_TOOLCHAIN)"
          echo "============================================================"

          echo "[INFO] CC:"
          make -s O=out ARCH=arm64 LLVM=1 CC=clang \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            -pn 2>/dev/null | grep '^CC[[:space:]]*=' | head -n 1

          echo "[INFO] KBUILD_CPPFLAGS:"
          make -s O=out ARCH=arm64 LLVM=1 CC=clang \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            -pn 2>/dev/null | grep '^KBUILD_CPPFLAGS[[:space:]]*=' | head -n 1

          echo "[INFO] KBUILD_CFLAGS:"
          make -s O=out ARCH=arm64 LLVM=1 CC=clang \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            -pn 2>/dev/null | grep '^KBUILD_CFLAGS[[:space:]]*=' | head -n 1

          echo "[INFO] CC_OPTION_CFLAGS:"
          make -s O=out ARCH=arm64 LLVM=1 CC=clang \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            -pn 2>/dev/null | grep '^CC_OPTION_CFLAGS[[:space:]]*=' | head -n 1

          echo "============================================================"
          echo "[TEST 6] Exact compiler test with kernel flags"
          echo "============================================================"

          CC_OPTION_CFLAGS="$(make -s O=out ARCH=arm64 LLVM=1 CC=clang \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            -pn 2>/dev/null | sed -n 's/^CC_OPTION_CFLAGS[[:space:]]*=[[:space:]]*//p')"

          KBUILD_CPPFLAGS="$(make -s O=out ARCH=arm64 LLVM=1 CC=clang \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            -pn 2>/dev/null | sed -n 's/^KBUILD_CPPFLAGS[[:space:]]*=[[:space:]]*//p')"

          echo "[INFO] Running:"
          echo "clang -Werror $KBUILD_CPPFLAGS $CC_OPTION_CFLAGS -fstack-protector-strong -c -x c /dev/null"

          echo "------------------------------------------------------------"

          clang -Werror \
            $KBUILD_CPPFLAGS \
            $CC_OPTION_CFLAGS \
            -fstack-protector-strong \
            -c -x c /dev/null \
            -o /tmp/kernel-cc-option-test.o

          CC_RESULT=$?

          echo "------------------------------------------------------------"

          if [ "$CC_RESULT" -eq 0 ]; then
              echo "[PASS] Exact cc-option reproduction succeeded"
          else
              echo "[FAIL] Exact cc-option reproduction failed"
          fi

          rm -f /tmp/kernel-cc-option-test.o

          echo "============================================================"
          echo "[7] Confirm Kconfig/generated headers prepared"
          echo "============================================================"

          echo "[OK] Kconfig/generated headers prepared (from step [3])"

          echo
          echo "============================================================"
          echo "[4] FIND GENERATED CONFIG HEADERS"
          echo "============================================================"

          {
            echo "===== CONFIG HEADER LOCATIONS ====="

            find out/include include \
              -type f \
              \( \
                -name autoconf.h \
                -o -name auto.conf \
              \) \
              -print \
              2>/dev/null \
              | sort

            echo
            echo "===== PGO CONFIG DEFINITIONS ====="

            grep -R -n \
              -E \
              '#define[[:space:]]+CONFIG_(PGO_CLANG|ARCH_SUPPORTS_PGO_CLANG)[[:space:]]+1' \
              out/include \
              include \
              2>/dev/null || true

          } | tee "$DEBUG_DIR/pgo-config-definitions.txt"

          echo
          echo "============================================================"
          echo "[5] CHECK GENERATED AUTOCONF"
          echo "============================================================"

          {
            echo "===== autoconf.h files ====="

            find out/include \
              -type f \
              -name autoconf.h \
              -print \
              2>/dev/null \
              | sort

            echo
            echo "===== PGO definitions ====="

            find out/include \
              -type f \
              -name autoconf.h \
              -exec grep -Hn \
                -E \
                'CONFIG_(PGO_CLANG|ARCH_SUPPORTS_PGO_CLANG)' \
                {} \; \
              2>/dev/null || true

          } | tee "$DEBUG_DIR/autoconf-pgo.txt"

          echo
          echo "============================================================"
          echo "[6] DIRECT CLANG PREPROCESSOR MACRO TEST"
          echo "============================================================"

          cd out

          clang \
            -E \
            -dM \
            -nostdinc \
            -isystem "$CLANG_PATH/lib64/clang/12.0.5/include" \
            -I../arch/arm64/include \
            -I./arch/arm64/include/generated \
            -I../include \
            -I./include \
            -I../arch/arm64/include/uapi \
            -I./arch/arm64/include/generated/uapi \
            -I../include/uapi \
            -I./include/generated/uapi \
            -include ../include/linux/kconfig.h \
            -D__KERNEL__ \
            -Qunused-arguments \
            -mlittle-endian \
            -DKASAN_SHADOW_SCALE_SHIFT=3 \
            -DTEXT_OFFSET=0x00080000 \
            -DLINKER_SCRIPT \
            -D__ASSEMBLY__ \
            ../arch/arm64/kernel/vmlinux.lds.S \
            2>/dev/null \
            | grep -E \
              'CONFIG_(PGO_CLANG|ARCH_SUPPORTS_PGO_CLANG)|LINKER_SCRIPT' \
            | tee "$DEBUG_DIR/preprocessor-macros.txt" \
            || true

          cd ..

          echo
          echo "============================================================"
          echo "[7] FIND ALL BUG_TABLE CONTEXTS"
          echo "============================================================"

          {
            echo "===== BUG_TABLE occurrences ====="

            grep -R -n \
              -B12 \
              -A20 \
              "BUG_TABLE" \
              include/asm-generic/vmlinux.lds.h \
              arch/arm64 \
              2>/dev/null || true

          } | tee "$DEBUG_DIR/all-bug-table-context.txt"

          echo
          echo "============================================================"
          echo "[8] FIND RW_DATA_SECTION"
          echo "============================================================"

          {
            grep -n \
              -B10 \
              -A50 \
              "define RW_DATA_SECTION" \
              include/asm-generic/vmlinux.lds.h \
              2>/dev/null || true

            echo
            echo "===== DATA_DATA ====="

            grep -n \
              -B10 \
              -A30 \
              "define DATA_DATA" \
              include/asm-generic/vmlinux.lds.h \
              2>/dev/null || true

          } | tee "$DEBUG_DIR/rw-data-section.txt"

          echo
          echo "============================================================"
          echo "[9] FIND PGO_CLANG_DATA REFERENCES"
          echo "============================================================"

          {
            grep -n \
              -B10 \
              -A20 \
              "PGO_CLANG_DATA" \
              include/asm-generic/vmlinux.lds.h \
              2>/dev/null || true

            echo
            echo "===== ALL REPOSITORY REFERENCES ====="

            grep -R -n \
              "PGO_CLANG_DATA" \
              include \
              arch \
              kernel \
              2>/dev/null || true

          } | tee "$DEBUG_DIR/pgo-clang-data-usage.txt"

          echo
          echo "============================================================"
          echo "[10] ACTUAL vmlinux.lds PREPROCESSING"
          echo "============================================================"

          cd out

          rm -f \
            arch/arm64/kernel/vmlinux.lds \
            arch/arm64/kernel/.vmlinux.lds.d \
            arch/arm64/kernel/.vmlinux.lds.cmd \
            arch/arm64/kernel/.vmlinux.lds.tmp

          clang \
            -E \
            -Wp,-MD,arch/arm64/kernel/.vmlinux.lds.d \
            -nostdinc \
            -isystem "$CLANG_PATH/lib64/clang/12.0.5/include" \
            -I../arch/arm64/include \
            -I./arch/arm64/include/generated \
            -I../include \
            -I./include \
            -I../arch/arm64/include/uapi \
            -I./arch/arm64/include/generated/uapi \
            -I../include/uapi \
            -I./include/generated/uapi \
            -include ../include/linux/kconfig.h \
            -D__KERNEL__ \
            -Qunused-arguments \
            -mlittle-endian \
            -DKASAN_SHADOW_SCALE_SHIFT=3 \
            -DTEXT_OFFSET=0x00080000 \
            -DLINKER_SCRIPT \
            -P \
            -Uarm64 \
            -D__ASSEMBLY__ \
            -o arch/arm64/kernel/vmlinux.lds \
            ../arch/arm64/kernel/vmlinux.lds.S

          cd ..

          echo "[OK] vmlinux.lds preprocessing completed"

          echo
          echo "============================================================"
          echo "[11] CHECK GENERATED LINKER SCRIPT"
          echo "============================================================"

          {
            echo "===== LLVM PGO symbols ====="

            grep -n \
              "__llvm_prf_" \
              out/arch/arm64/kernel/vmlinux.lds \
              || true

            echo
            echo "===== BUG_TABLE ====="

            grep -n \
              "BUG_TABLE\|__bug_table" \
              out/arch/arm64/kernel/vmlinux.lds \
              || true

            echo
            echo "===== DATA ====="

            grep -n \
              "\.data" \
              out/arch/arm64/kernel/vmlinux.lds \
              | head -n 20 \
              || true

          } | tee "$DEBUG_DIR/pgo-symbols.txt"

          echo
          echo "============================================================"
          echo "[12] GENERATED .data LINKER CONTEXT"
          echo "============================================================"

          {
            LINE=$(grep -n \
              '\.data :' \
              out/arch/arm64/kernel/vmlinux.lds \
              | head -n 1 \
              | cut -d: -f1 || true)

            if [ -n "$LINE" ]; then

              START=$((LINE - 3))
              END=$((LINE + 12))

              if [ "$START" -lt 1 ]; then
                START=1
              fi

              sed -n "${START},${END}p" \
                out/arch/arm64/kernel/vmlinux.lds

            fi

          } | tee "$DEBUG_DIR/generated-data-context.txt"

          echo
          echo "============================================================"
          echo "[13] PGO LINKER RESULT"
          echo "============================================================"

          if grep -q \
              "__llvm_prf_data_start" \
              out/arch/arm64/kernel/vmlinux.lds && \
             grep -q \
              "__llvm_prf_data_end" \
              out/arch/arm64/kernel/vmlinux.lds && \
             grep -q \
              "__llvm_prf_cnts_start" \
              out/arch/arm64/kernel/vmlinux.lds && \
             grep -q \
              "__llvm_prf_cnts_end" \
              out/arch/arm64/kernel/vmlinux.lds && \
             grep -q \
              "__llvm_prf_names_start" \
              out/arch/arm64/kernel/vmlinux.lds && \
             grep -q \
              "__llvm_prf_names_end" \
              out/arch/arm64/kernel/vmlinux.lds && \
             grep -q \
              "__llvm_prf_vals_start" \
              out/arch/arm64/kernel/vmlinux.lds && \
             grep -q \
              "__llvm_prf_vals_end" \
              out/arch/arm64/kernel/vmlinux.lds && \
             grep -q \
              "__llvm_prf_vnds_start" \
              out/arch/arm64/kernel/vmlinux.lds && \
             grep -q \
              "__llvm_prf_vnds_end" \
              out/arch/arm64/kernel/vmlinux.lds; then

            echo "[OK] ALL LLVM PGO LINKER SYMBOLS FOUND"

          else

            echo "[FAIL] LLVM PGO linker symbols are missing"
            echo
            echo "This is a diagnostic failure only."
            echo "No kernel build is started."

          fi

          echo
          echo "============================================================"
          echo "[14] KBUILD DRY RUN"
          echo "============================================================"

          set +e

          make V=1 -n \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            arch/arm64/kernel/vmlinux.lds \
            > "$LOG" 2>&1

          MAKE_STATUS=$?

          set -e

          echo "Kbuild dry-run exit code: $MAKE_STATUS"

          echo
          echo "============================================================"
          echo "[15] EXTRACT vmlinux.lds COMMAND"
          echo "============================================================"

          grep -n \
            -E \
            'vmlinux\.lds(\.S)?|LINKER_SCRIPT|CPPFLAGS_vmlinux.lds|clang|cpp' \
            "$LOG" \
            | tee "$DEBUG_DIR/relevant-lines.txt" \
            || true

          echo
          echo "============================================================"
          echo "[16] PGO DEFINES"
          echo "============================================================"

          grep -n \
            -E \
            'CONFIG_PGO_CLANG|ARCH_SUPPORTS_PGO_CLANG|-DLINKER_SCRIPT' \
            "$LOG" \
            | tee "$DEBUG_DIR/pgo-defines.txt" \
            || true

          echo
          echo "============================================================"
          echo "[17] KBUILD VARIABLES"
          echo "============================================================"

          make -pn \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            CC=clang \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            2>/dev/null \
            | grep -E \
              '^(CPPFLAGS_vmlinux\.lds|KBUILD_CPPFLAGS|cppflags-y)[[:space:]]*=' \
            | tee "$DEBUG_DIR/kbuild-variables.txt" \
            || true

          echo
          echo "============================================================"
          echo "[18] ENVIRONMENT"
          echo "============================================================"

          {
            echo "PATH=$PATH"
            echo "CLANG_PATH=$CLANG_PATH"
            echo "GCC64_PATH=$GCC64_PATH"
            echo "GCC32_PATH=$GCC32_PATH"
            echo "CROSS_COMPILE=$CROSS_COMPILE"
            echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"
            echo "CLANG_TRIPLE=$CLANG_TRIPLE"

          } | tee "$DEBUG_DIR/environment.txt"

          echo
          echo "============================================================"
          echo "[19] DEBUG FILE LIST"
          echo "============================================================"

          find "$DEBUG_DIR" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "============================================================"
          echo "PGO LINKER DEBUG COMPLETE"
          echo "============================================================"

      # ============================================================
      # 11A. UPLOAD PGO DEBUG ARTIFACTS
      # ============================================================
      - name: Upload PGO Debug Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgo-linker-debug
          path: |
            pgo-debug/
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # 12. CHECK CLANG PGO SUPPORT
      # ============================================================
      - name: Check Clang PGO Support
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "CLANG PGO SUPPORT"
          echo "============================================================"

          cat > pgo_test.c <<'EOF'
          int test_pgo(int x)
          {
              if (x > 100)
                  return x * 2;

              return x + 1;
          }

          int main(void)
          {
              return test_pgo(10);
          }
          EOF

          echo
          echo "Clang:"
          clang --version

          echo
          echo "llvm-profdata:"
          command -v llvm-profdata

          if llvm-profdata merge --help >/dev/null 2>&1; then

            echo "[OK] llvm-profdata merge supported"

          else

            echo "[FAIL] llvm-profdata merge failed"
            exit 1

          fi

          echo
          echo "============================================================"
          echo "TEST -fprofile-generate"
          echo "============================================================"

          clang \
            -O2 \
            -fprofile-generate \
            -c pgo_test.c \
            -o pgo_generate.o

          echo "[OK] -fprofile-generate supported"

          echo
          echo "============================================================"
          echo "TEST -fprofile-instr-generate"
          echo "============================================================"

          clang \
            -O2 \
            -fprofile-instr-generate \
            -c pgo_test.c \
            -o pgo_instr.o

          echo "[OK] -fprofile-instr-generate supported"

          echo
          echo "============================================================"
          echo "TEST -fprofile-instr-use"
          echo "============================================================"

          clang \
            -O2 \
            -fprofile-instr-use=/tmp/nonexistent.profdata \
            -c pgo_test.c \
            -o /dev/null \
            2>pgo-use-error.log \
            || true

          if grep -qi \
              "unknown argument" \
              pgo-use-error.log; then

            echo "[FAIL] -fprofile-instr-use not recognized"

            cat pgo-use-error.log

            exit 1

          fi

          echo "[OK] -fprofile-instr-use recognized"

      # ============================================================
      # 13. BUILD FULL KERNEL WITH PGO
      # ============================================================
      - name: Build Kernel With PGO
        run: |
          set -o pipefail

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "BUILD FULL KERNEL WITH PGO"
          echo "============================================================"

          rm -f \
            pgo-build.log \
            pgo-build-full.log

          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            V=1 \
            2>&1 \
            | tee pgo-build-full.log \
            | awk '
                /clang/ && / -c / {

                  if ($0 ~ /__ASSEMBLY__|assembler/) {
                    label="  AS      "
                  } else {
                    label="  CC      "
                  }

                  if (match($0, /-o ([^ ]+)/, m)) {
                    print label m[1]
                  }

                  next
                }

                /ld\.lld/ && / -o / {

                  if (match($0, /-o ([^ ]+)/, m)) {
                    print "  LD      " m[1]
                  }

                  next
                }

                /error:|Error:|FAILED|No rule to make target|Stop\./ {
                  print
                }
              ' \
            | tee pgo-build.log

          echo
          echo "============================================================"
          echo "[OK] Full kernel build completed"
          echo "============================================================"

          echo
          echo "Short build log:"
          cat pgo-build.log

          echo
          echo "Full verbose build log:"
          ls -lh pgo-build-full.log

      # ============================================================
      # 14. VERIFY PGO COMPILER FLAGS
      # ============================================================
      - name: Verify PGO Compiler Flags
        run: |
          set -e

          echo "============================================================"
          echo "VERIFY PGO COMPILER FLAGS"
          echo "============================================================"

          if [ ! -f pgo-build-full.log ]; then

            echo "[FAIL] pgo-build-full.log not found"
            exit 1

          fi

          if grep -q \
              -- "-fprofile-generate" \
              pgo-build-full.log; then

            echo "[OK] -fprofile-generate found in kernel build"

          else

            echo "[FAIL] -fprofile-generate not found in kernel build"
            exit 1

          fi

          echo
          echo "Number of occurrences:"

          grep -o \
            -- "-fprofile-generate" \
            pgo-build-full.log \
            | wc -l

      # ============================================================
      # 15. VERIFY LLVM PGO SECTIONS IN OBJECTS
      # ============================================================
      - name: Verify LLVM PGO Sections
        if: always()
        run: |
          set +e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "VERIFY LLVM PGO SECTIONS IN OBJECTS"
          echo "============================================================"

          FOUND=0

          for OBJ in \
            out/kernel/pgo/fs.o \
            out/kernel/pgo/instrument.o
          do

            echo
            echo "------------------------------------------------------------"
            echo "OBJECT: $OBJ"
            echo "------------------------------------------------------------"

            if [ ! -f "$OBJ" ]; then

              echo "[WARN] Object not found"
              continue

            fi

            echo
            echo "--- ELF SECTIONS ---"

            llvm-readelf -SW "$OBJ" 2>/dev/null | \
              grep -E \
                'llvm_prf|profile' \
              || true

            echo
            echo "--- LLVM PGO SYMBOLS ---"

            llvm-nm -a "$OBJ" 2>/dev/null | \
              grep -E \
                '__llvm_prf_' \
              || true

            if llvm-readelf -SW "$OBJ" 2>/dev/null | \
                grep -qE 'llvm_prf|profile'; then

              FOUND=1

            fi

          done

          echo
          echo "============================================================"

          if [ "$FOUND" -eq 1 ]; then

            echo "[OK] LLVM PGO sections confirmed in object files"

          else

            echo "[WARN] No LLVM PGO sections found in inspected objects"

          fi

      # ============================================================
      # 16. VERIFY FINAL VMLINUX PGO SECTIONS
      # ============================================================
      - name: Verify Vmlinux PGO Sections
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "VERIFY FINAL VMLINUX PGO SECTIONS"
          echo "============================================================"

          if [ ! -f out/vmlinux ]; then

            echo "[FAIL] out/vmlinux not found"
            exit 1

          fi

          echo
          echo "LLVM PGO sections:"

          llvm-readelf -SW out/vmlinux | \
            grep -E \
              'llvm_prf|profile' \
            || true

          echo
          echo "LLVM PGO symbols:"

          llvm-nm -a out/vmlinux 2>/dev/null | \
            grep -E \
              '__llvm_prf_' \
            || true

          echo
          echo "============================================================"

          if llvm-readelf -SW out/vmlinux | \
              grep -qE 'llvm_prf|profile'; then

            echo "[OK] LLVM PGO sections found in vmlinux"

          else

            echo "[FAIL] No LLVM PGO sections found in vmlinux"
            exit 1

          fi

      # ============================================================
      # 17. SAVE FINAL CONFIG
      # ============================================================
      - name: Save Final PGO Configuration
        run: |
          set -e

          cp \
            out/.config \
            pgo-final-defconfig

          echo "============================================================"
          echo "FINAL PGO CONFIGURATION"
          echo "============================================================"

          grep -E \
            "CONFIG_(ARCH_SUPPORTS_PGO_CLANG|PGO_CLANG|PROC_FS)=" \
            out/.config

      # ============================================================
      # 18. UPLOAD BUILD ARTIFACTS
      # ============================================================
      - name: Upload PGO Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-pgo-4.14-r416183b
          path: |
            out/vmlinux
            out/.config
            pgo-final-defconfig
            pgo-build.log
            pgo-build-full.log
            pgo-use-error.log
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # 19. FINAL SUMMARY
      # ============================================================
      - name: Final Summary
        if: always()
        run: |
          echo
          echo "============================================================"
          echo "             CLANG PGO BUILD SUMMARY"
          echo "============================================================"

          echo
          echo "Kernel:"
          git describe --always --dirty --broken || true

          echo
          echo "Branch:"
          git branch --show-current || true

          echo
          echo "Clang:"
          clang --version | head -n 1 || true

          echo
          echo "LLD:"
          ld.lld --version | head -n 1 || true

          echo
          echo "llvm-profdata:"
          command -v llvm-profdata || true

          echo
          echo "PGO configuration:"

          grep -E \
            "CONFIG_(ARCH_SUPPORTS_PGO_CLANG|PGO_CLANG|PROC_FS)=" \
            out/.config \
            2>/dev/null \
            || true

          echo
          echo "PGO flags:"

          if [ -f pgo-build-full.log ]; then

            echo "-fprofile-generate occurrences:"

            grep -o \
              -- "-fprofile-generate" \
              pgo-build-full.log \
              | wc -l \
              || true

          fi

          echo
          echo "Short build log:"

          if [ -f pgo-build.log ]; then

            cat pgo-build.log

          else

            echo "not available"

          fi

          echo
          echo "PGO linker section placement:"

          if awk '
            /^#define RW_DATA_SECTION/ {
              in_rw=1
              next
            }

            in_rw && /^#define / {
              exit
            }

            in_rw && /BUG_TABLE/ {
              if (getline nextline > 0 && nextline ~ /PGO_CLANG_DATA/) {
                found=1
              }
              exit
            }

            END {
              exit(found ? 0 : 1)
            }
          ' include/asm-generic/vmlinux.lds.h; then

            echo "[OK] BUG_TABLE -> PGO_CLANG_DATA"

          else

            echo "[FAIL] PGO_CLANG_DATA placement invalid"

          fi

          echo
          echo "Protected linker Makefiles:"

          if git diff --quiet -- arch/arm64/kernel/Makefile; then
            echo "[OK] arch/arm64/kernel/Makefile unchanged"
          else
            echo "[FAIL] arch/arm64/kernel/Makefile modified"
          fi

          if git diff --quiet -- arch/arm64/Makefile; then
            echo "[OK] arch/arm64/Makefile unchanged"
          else
            echo "[FAIL] arch/arm64/Makefile modified"
          fi

          echo
          echo "PGO linker condition:"

          grep -n \
            "LINKER_SCRIPT" \
            include/asm-generic/vmlinux.lds.h \
            2>/dev/null \
            || true

          echo
          echo "Final vmlinux:"

          if [ -f out/vmlinux ]; then

            ls -lh out/vmlinux

          else

            echo "not built"

          fi

          echo
          echo "============================================================"
