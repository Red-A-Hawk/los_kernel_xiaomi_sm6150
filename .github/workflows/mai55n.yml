name: Droidspaces Kconfig Checker

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'CONFIG symbol to search for (optional)'
        required: false
        default: ''
  push:
    paths:
      - '**/Kconfig*'
      - '**/Makefile'
      - '**/Kbuild'
  pull_request:
    paths:
      - '**/Kconfig*'
      - '**/Makefile'
      - '**/Kbuild'

jobs:
  check-kconfig:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Search for a specific Kconfig symbol
        if: ${{ github.event.inputs.symbol != '' }}
        run: |
          SYM="${{ github.event.inputs.symbol }}"
          SYM="${SYM#CONFIG_}"

          {
            echo "## Kconfig Search: CONFIG_$SYM"
            echo
            echo "### Definition"
            echo '```'

            FOUND=0

            while IFS= read -r file; do
              if grep -qE "^[[:space:]]*config[[:space:]]+${SYM}[[:space:]]*$" "$file"; then
                FOUND=1

                echo ">>> $file"

                awk -v sym="$SYM" '
                  $0 ~ "^[[:space:]]*config[[:space:]]+" sym "[[:space:]]*$" {
                    p=1
                  }
                  p {
                    print
                  }
                  p && /^[[:space:]]*$/ {
                    exit
                  }
                ' "$file"

                echo
              fi
            done < <(find . -type f -name "Kconfig*")

            if [ "$FOUND" -eq 0 ]; then
              echo "CONFIG_$SYM is not defined in any Kconfig file."
              echo "The symbol may have been renamed, removed, or replaced in this kernel branch."
            fi

            echo '```'
            echo
            echo "### Makefile / Kbuild References"
            echo '```'

            grep -rn "CONFIG_${SYM}" \
              --include="Makefile" \
              --include="Kbuild" \
              . || echo "No Makefile/Kbuild references found."

            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Audit Droidspaces required Kconfig symbols
        shell: bash
        run: |
          set +e

          echo "Droidspaces CONFIG symbol audit" > kconfig_audit.txt
          echo "=========================================" >> kconfig_audit.txt
          echo "" >> kconfig_audit.txt

          cat > /tmp/droidspaces_symbols.txt << 'EOF'
          SYSCTL
          SYSVIPC
          POSIX_MQUEUE
          NAMESPACES
          PID_NS
          UTS_NS
          IPC_NS
          SECCOMP
          SECCOMP_FILTER
          CGROUPS
          CGROUP_DEVICE
          CGROUP_PIDS
          MEMCG
          CGROUP_SCHED
          FAIR_GROUP_SCHED
          CGROUP_FREEZER
          CGROUP_NET_PRIO
          DEVTMPFS
          OVERLAY_FS
          TMPFS_POSIX_ACL
          TMPFS_XATTR
          FW_LOADER
          FW_LOADER_USER_HELPER
          FW_LOADER_COMPRESS
          NET_NS
          VETH
          BRIDGE
          NETFILTER
          BRIDGE_NETFILTER
          NETFILTER_ADVANCED
          NF_CONNTRACK
          IP_NF_IPTABLES
          IP_NF_FILTER
          NF_NAT
          NF_TABLES
          IP_NF_TARGET_MASQUERADE
          NETFILTER_XT_TARGET_MASQUERADE
          NETFILTER_XT_TARGET_TCPMSS
          NETFILTER_XT_MATCH_ADDRTYPE
          NF_CONNTRACK_NETLINK
          NF_NAT_REDIRECT
          IP_ADVANCED_ROUTER
          IP_MULTIPLE_TABLES
          NF_CONNTRACK_IPV4
          NF_NAT_IPV4
          IP_NF_NAT
          USER_NS
          EOF

          NOT_DEFINED=0
          DEFINED_NOT_BUILT=0
          OK=0

          while IFS= read -r sym; do
            sym="$(echo "$sym" | xargs)"

            [ -z "$sym" ] && continue

            echo "-----------------------------------------" >> kconfig_audit.txt
            echo "CONFIG_$sym" >> kconfig_audit.txt

            hit="$(grep -rlE \
              "^[[:space:]]*config[[:space:]]+${sym}[[:space:]]*$" \
              --include="Kconfig*" \
              . 2>/dev/null | head -1)"

            makefile_hits="$(grep -rl \
              "CONFIG_${sym}" \
              --include="Makefile" \
              --include="Kbuild" \
              . 2>/dev/null)"

            if [ -z "$hit" ]; then
              echo "STATUS: NOT_DEFINED" >> kconfig_audit.txt
              echo "CONFIG_$sym is not defined in any Kconfig file." >> kconfig_audit.txt

              NOT_DEFINED=$((NOT_DEFINED + 1))
              continue
            fi

            if [ -z "$makefile_hits" ]; then
              echo "STATUS: DEFINED_NOT_DIRECTLY_BUILT" >> kconfig_audit.txt
              echo "DEFINED_IN: $hit" >> kconfig_audit.txt
              echo "No direct Makefile/Kbuild reference found." >> kconfig_audit.txt

              DEFINED_NOT_BUILT=$((DEFINED_NOT_BUILT + 1))
            else
              echo "STATUS: DEFINED_AND_REFERENCED" >> kconfig_audit.txt
              echo "DEFINED_IN: $hit" >> kconfig_audit.txt
              echo "REFERENCED_BY:" >> kconfig_audit.txt

              echo "$makefile_hits" | sed 's/^/  /' >> kconfig_audit.txt

              OK=$((OK + 1))
            fi

            echo "KCONFIG_BLOCK:" >> kconfig_audit.txt

            awk -v sym="$sym" '
              $0 ~ "^[[:space:]]*config[[:space:]]+" sym "[[:space:]]*$" {
                p=1
                print
                next
              }

              p && /^[[:space:]]*config[[:space:]]+/ {
                exit
              }

              p {
                print
              }
            ' "$hit" | head -80 >> kconfig_audit.txt

            echo "" >> kconfig_audit.txt

          done < /tmp/droidspaces_symbols.txt

          echo "=========================================" >> kconfig_audit.txt
          echo "SUMMARY" >> kconfig_audit.txt
          echo "=========================================" >> kconfig_audit.txt
          echo "DEFINED_AND_REFERENCED: $OK" >> kconfig_audit.txt
          echo "DEFINED_NOT_DIRECTLY_BUILT: $DEFINED_NOT_BUILT" >> kconfig_audit.txt
          echo "NOT_DEFINED: $NOT_DEFINED" >> kconfig_audit.txt

          {
            echo "## Droidspaces Kconfig Audit"
            echo
            echo "| Status | Count |"
            echo "|---|---:|"
            echo "| Defined and referenced | $OK |"
            echo "| Defined but no direct Makefile/Kbuild reference | $DEFINED_NOT_BUILT |"
            echo "| Not defined | $NOT_DEFINED |"
            echo
            echo "### Full Audit"
            echo '```text'
            cat kconfig_audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          cat kconfig_audit.txt

      - name: Upload full report
        uses: actions/upload-artifact@v4
        with:
          name: droidspaces-kconfig-audit
          path: kconfig_audit.txt
          if-no-files-found: error
