name: DTS Label + Kconfig Checker

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'اسم الـ label أو CONFIG اللي عايز تدور عليه (اختياري)'
        required: false
        default: ''
  push:
    paths:
      - '**/*.dts'
      - '**/*.dtsi'
      - '**/Kconfig*'
  pull_request:
    paths:
      - '**/*.dts'
      - '**/*.dtsi'
      - '**/Kconfig*'

jobs:
  check-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Search for a specific DTS symbol (manual trigger)
        if: ${{ github.event.inputs.symbol != '' }}
        run: |
          SYM="${{ github.event.inputs.symbol }}"
          echo "## نتائج البحث عن: $SYM" >> $GITHUB_STEP_SUMMARY
          echo "### التعريفات (label:)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -rn "^\s*${SYM}:" --include="*.dts" --include="*.dtsi" . >> $GITHUB_STEP_SUMMARY || echo "لا يوجد تعريف!" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### الاستخدامات (&label)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -rn "&${SYM}\b" --include="*.dts" --include="*.dtsi" . >> $GITHUB_STEP_SUMMARY || echo "لا يوجد استخدام!" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Search for a specific Kconfig symbol (manual trigger)
        if: ${{ github.event.inputs.symbol != '' }}
        run: |
          SYM="${{ github.event.inputs.symbol }}"
          # يشيل بادئة CONFIG_ لو المستخدم كتبها بالغلط
          SYM="${SYM#CONFIG_}"

          echo "## نتائج بحث Kconfig عن: CONFIG_$SYM" >> $GITHUB_STEP_SUMMARY

          echo "### التعريف (config $SYM)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          FOUND=0
          while IFS= read -r file; do
            if grep -qE "^\s*config\s+${SYM}\s*$" "$file"; then
              FOUND=1
              echo ">>> $file" >> $GITHUB_STEP_SUMMARY
              # يطبع من سطر التعريف لحد أول سطر فاضي بعده (كتلة التعريف كاملة)
              awk -v sym="$SYM" '
                $0 ~ "^[[:space:]]*config[[:space:]]+"sym"[[:space:]]*$" {p=1}
                p {print}
                p && /^\s*$/ {exit}
              ' "$file" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done < <(find . -type f -name "Kconfig*")

          if [ "$FOUND" -eq 0 ]; then
            echo "❌ الرمز CONFIG_$SYM غير معرّف في أي ملف Kconfig بهذا السورس." >> $GITHUB_STEP_SUMMARY
            echo "   (يعني إما اتغيّر اسمه بهذا الفرع، أو الميزة محذوفة تمامًا)" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### أين يُستخدم فعليًا (obj-\$(CONFIG_$SYM) بملفات Makefile)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -rn "CONFIG_${SYM}" --include="Makefile" --include="Kbuild" . >> $GITHUB_STEP_SUMMARY || echo "لا يوجد استخدام في أي Makefile!" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Audit ALL DTS labels (finds broken references automatically)
        run: |
          echo "## فحص شامل: DTS labels مستخدمة بدون تعريف" > audit_report.txt
          echo "" >> audit_report.txt

          grep -rhoE "&[a-zA-Z0-9_]+" --include="*.dts" --include="*.dtsi" . \
            | sed 's/^&//' | sort -u > /tmp/used_labels.txt

          grep -rhoE "^\s*[a-zA-Z0-9_]+:" --include="*.dts" --include="*.dtsi" . \
            | sed 's/[[:space:]]*//g; s/://' | sort -u > /tmp/defined_labels.txt

          MISSING=0
          while read -r sym; do
            if ! grep -qx "$sym" /tmp/defined_labels.txt; then
              echo "❌ $sym غير معرّف في أي مكان لكنه مُستخدم هنا:" >> audit_report.txt
              grep -rn "&${sym}\b" --include="*.dts" --include="*.dtsi" . >> audit_report.txt
              echo "" >> audit_report.txt
              MISSING=$((MISSING+1))
            fi
          done < /tmp/used_labels.txt

          if [ "$MISSING" -eq 0 ]; then
            echo "✅ كل الـ labels المستخدمة معرّفة بشكل صحيح." >> audit_report.txt
          fi

          cat audit_report.txt >> $GITHUB_STEP_SUMMARY

      - name: Audit Droidspaces required Kconfig symbols
        run: |
          echo "## فحص شامل: Droidspaces CONFIG symbols" > kconfig_audit.txt
          echo "" >> kconfig_audit.txt

          # نفس القائمة المطلوبة من توثيق Droidspaces (Step 1 - Legacy)
          cat > /tmp/droidspaces_symbols.txt << 'EOF'
          SYSCTL
          SYSVIPC
          POSIX_MQUEUE
          NAMESPACES
          PID_NS
          UTS_NS
          IPC_NS
          SECCOMP
          SECCOMP_FILTER
          CGROUPS
          CGROUP_DEVICE
          CGROUP_PIDS
          MEMCG
          CGROUP_SCHED
          FAIR_GROUP_SCHED
          CGROUP_FREEZER
          CGROUP_NET_PRIO
          DEVTMPFS
          OVERLAY_FS
          TMPFS_POSIX_ACL
          TMPFS_XATTR
          FW_LOADER
          FW_LOADER_USER_HELPER
          FW_LOADER_COMPRESS
          NET_NS
          VETH
          BRIDGE
          NETFILTER
          BRIDGE_NETFILTER
          NETFILTER_ADVANCED
          NF_CONNTRACK
          IP_NF_IPTABLES
          IP_NF_FILTER
          NF_NAT
          NF_TABLES
          IP_NF_TARGET_MASQUERADE
          NETFILTER_XT_TARGET_MASQUERADE
          NETFILTER_XT_TARGET_TCPMSS
          NETFILTER_XT_MATCH_ADDRTYPE
          NF_CONNTRACK_NETLINK
          NF_NAT_REDIRECT
          IP_ADVANCED_ROUTER
          IP_MULTIPLE_TABLES
          NF_CONNTRACK_IPV4
          NF_NAT_IPV4
          IP_NF_NAT
          USER_NS
          EOF

          NOT_FOUND=0
          while read -r sym; do
            [ -z "$sym" ] && continue

            hit="$(grep -rlE "^\s*config\s+${sym}\s*$" --include="Kconfig*" . | head -1)"

            if [ -z "$hit" ]; then
              echo "❌ CONFIG_$sym: غير معرّف في أي ملف Kconfig بهذا الفرع" >> kconfig_audit.txt
              NOT_FOUND=$((NOT_FOUND+1))
            else
              deps="$(awk -v s="$sym" '
                $0 ~ "^[[:space:]]*config[[:space:]]+"s"[[:space:]]*$" {p=1; next}
                p && /depends on|select/ {print "    "$0}
                p && /^\s*$/ {exit}
              ' "$hit")"
              echo "✅ CONFIG_$sym: معرّف في $hit" >> kconfig_audit.txt
              [ -n "$deps" ] && echo "$deps" >> kconfig_audit.txt
            fi
          done < /tmp/droidspaces_symbols.txt

          echo "" >> kconfig_audit.txt
          echo "الإجمالي غير الموجود: $NOT_FOUND" >> kconfig_audit.txt

          cat kconfig_audit.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload full report
        uses: actions/upload-artifact@v4
        with:
          name: dts-kconfig-audit
          path: |
            audit_report.txt
            kconfig_audit.txt
