name: Create xxx-16 Branch

on:
  workflow_dispatch:

jobs:
  create-branch:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout decff209
        uses: actions/checkout@v4
        with:
          ref: decff20960fbe1dda48b9bcf8d60a3cf5e63b9ba
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source commit
        run: |
          set -e

          COMMIT="decff20960fbe1dda48b9bcf8d60a3cf5e63b9ba"

          echo "Current commit:"
          git rev-parse HEAD

          test "$(git rev-parse HEAD)" = "$COMMIT"

      - name: Create and push new branch
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATE_TOKEN }}
        run: |
          set -e

          git checkout -b xxx-16
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/Red-A-Hawk/los_kernel_xiaomi_sm6150.git"
          git push origin xxx-16

          echo "Branch 'xxx-16' created and pushed successfully."
