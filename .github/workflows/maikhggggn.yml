name: Build ARM64 Clang PGO v11

on:
  workflow_dispatch:

jobs:
  build:
    name: ARM64 Clang PGO
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            git \
            wget \
            curl \
            cpio \
            zip \
            unzip \
            rsync \
            python3 \
            python3-pip \
            libssl-dev \
            libelf-dev \
            device-tree-compiler \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            openjdk-17-jdk

          echo
          echo "============================================================"
          echo "DEPENDENCIES INSTALLED"
          echo "============================================================"

      # ============================================================
      # 3. DOWNLOAD TOOLCHAINS
      # ============================================================
      - name: Download toolchains
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/toolchains"

          echo "============================================================"
          echo "DOWNLOAD LINEAGEOS CLANG r416183b"
          echo "============================================================"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            "$GITHUB_WORKSPACE/toolchains/clang"

          echo
          echo "============================================================"
          echo "DOWNLOAD GCC64"
          echo "============================================================"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            "$GITHUB_WORKSPACE/toolchains/gcc64"

          echo
          echo "============================================================"
          echo "DOWNLOAD GCC32"
          echo "============================================================"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            "$GITHUB_WORKSPACE/toolchains/gcc32"

      # ============================================================
      # 4. SETUP TOOLCHAIN
      # ============================================================
      - name: Setup toolchain environment
        run: |
          set -e

          CLANG_PATH="$GITHUB_WORKSPACE/toolchains/clang/bin"
          GCC64_PATH="$GITHUB_WORKSPACE/toolchains/gcc64/bin"
          GCC32_PATH="$GITHUB_WORKSPACE/toolchains/gcc32/bin"

          echo "$CLANG_PATH" >> "$GITHUB_PATH"
          echo "$GCC64_PATH" >> "$GITHUB_PATH"
          echo "$GCC32_PATH" >> "$GITHUB_PATH"

          echo "CLANG_PATH=$CLANG_PATH" >> "$GITHUB_ENV"
          echo "GCC64_PATH=$GCC64_PATH" >> "$GITHUB_ENV"
          echo "GCC32_PATH=$GCC32_PATH" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE=aarch64-linux-android-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-" >> "$GITHUB_ENV"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

          echo
          echo "============================================================"
          echo "TOOLCHAIN ENVIRONMENT"
          echo "============================================================"

          echo "CLANG_PATH=$CLANG_PATH"
          echo "GCC64_PATH=$GCC64_PATH"
          echo "GCC32_PATH=$GCC32_PATH"
          echo "CROSS_COMPILE=aarch64-linux-android-"
          echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-"

      # ============================================================
      # 5. VERIFY TOOLCHAINS
      # ============================================================
      - name: Verify toolchains
        run: |
          set -e

          echo "============================================================"
          echo "CLANG"
          echo "============================================================"

          which clang
          clang --version

          echo
          echo "============================================================"
          echo "LD.LLD"
          echo "============================================================"

          which ld.lld
          ld.lld --version

          echo
          echo "============================================================"
          echo "LLVM TOOLS"
          echo "============================================================"

          which llvm-ar
          which llvm-as
          which llvm-nm
          which llvm-objcopy
          which llvm-objdump
          which llvm-strip

          echo
          echo "============================================================"
          echo "GCC64"
          echo "============================================================"

          which aarch64-linux-android-gcc
          aarch64-linux-android-gcc --version | head -n 1

          echo
          echo "============================================================"
          echo "GCC32"
          echo "============================================================"

          which arm-linux-androideabi-gcc
          arm-linux-androideabi-gcc --version | head -n 1

      # ============================================================
      # 6. DOWNLOAD PGO PATCH
      # ============================================================
      - name: Download PGO Patch
        run: |
          set -e

          PATCH_URL="https://raw.githubusercontent.com/Red-A-Hawk/Patch/kernel_xiaomi_violet/0001-ARM64-Clang-PGO-4.14-RedHawk-final.patch"
          PATCH_FILE="$GITHUB_WORKSPACE/0001-ARM64-Clang-PGO-4.14-RedHawk-final.patch"

          echo "============================================================"
          echo "DOWNLOAD PGO PATCH"
          echo "============================================================"

          wget -O "$PATCH_FILE" "$PATCH_URL"

          echo
          echo "Patch size:"
          wc -c "$PATCH_FILE"

          echo
          echo "============================================================"
          echo "PGO LINKER HUNK FROM PATCH"
          echo "============================================================"

          grep -n -A45 -B5 "PGO_CLANG_DATA" "$PATCH_FILE" || true

      # ============================================================
      # 7. APPLY PGO PATCH
      # ============================================================
      - name: Apply PGO patch
        run: |
          set -e

          PATCH_FILE="$GITHUB_WORKSPACE/0001-ARM64-Clang-PGO-4.14-RedHawk-final.patch"

          echo "============================================================"
          echo "APPLY PGO PATCH"
          echo "============================================================"

          set +e

          patch -p1 \
            --fuzz=3 \
            --ignore-whitespace \
            --no-backup-if-mismatch \
            < "$PATCH_FILE"

          PATCH_STATUS=$?

          set -e

          echo
          echo "patch exit status: $PATCH_STATUS"

          # --------------------------------------------------------
          # Handle known arch/arm64/Kconfig context mismatch
          # --------------------------------------------------------
          if [ -f arch/arm64/Kconfig.rej ]; then

            echo
            echo "============================================================"
            echo "HANDLE arch/arm64/Kconfig REJECT"
            echo "============================================================"

            cat arch/arm64/Kconfig.rej

            rm -f arch/arm64/Kconfig.rej

            if ! grep -q 'ARCH_SUPPORTS_PGO_CLANG' arch/arm64/Kconfig; then

              python3 <<'PY'
from pathlib import Path

path = Path("arch/arm64/Kconfig")
text = path.read_text()

if 'select ARCH_SUPPORTS_PGO_CLANG' not in text:
    marker = 'select ARCH_SUPPORTS_THINLTO'

    if marker not in text:
        raise SystemExit(
            "[FAIL] Could not find ARCH_SUPPORTS_THINLTO "
            "in arch/arm64/Kconfig"
        )

    text = text.replace(
        marker,
        marker + '\n\tselect ARCH_SUPPORTS_PGO_CLANG',
        1
    )

    path.write_text(text)

print("[OK] ARCH_SUPPORTS_PGO_CLANG inserted")
PY

            fi

          fi

          # --------------------------------------------------------
          # Any remaining reject is fatal
          # --------------------------------------------------------
          REJECTS="$(find . -name '*.rej' -print)"

          if [ -n "$REJECTS" ]; then
            echo
            echo "============================================================"
            echo "PATCH REJECTS"
            echo "============================================================"

            echo "$REJECTS"

            while IFS= read -r rej; do
              echo
              echo "----- $rej -----"
              cat "$rej"
            done <<< "$REJECTS"

            exit 1
          fi

          echo
          echo "============================================================"
          echo "PATCH RESULT"
          echo "============================================================"

          echo "[OK] No remaining patch rejects"

      # ============================================================
      # 8. FIX PGO LINKER SECTION
      # ============================================================
      - name: Fix PGO linker section placement
        run: |
          set -e

          echo "============================================================"
          echo "FIX PGO LINKER SECTION"
          echo "============================================================"

          python3 <<'PY'
from pathlib import Path

path = Path("include/asm-generic/vmlinux.lds.h")

if not path.exists():
    raise SystemExit(
        "[FAIL] include/asm-generic/vmlinux.lds.h not found"
    )

lines = path.read_text().splitlines(True)

# ------------------------------------------------------------
# Find RW_DATA_SECTION
# ------------------------------------------------------------
rw_start = None

for i, line in enumerate(lines):
    if line.startswith("#define RW_DATA_SECTION"):
        rw_start = i
        break

if rw_start is None:
    raise SystemExit(
        "[FAIL] RW_DATA_SECTION not found"
    )

# ------------------------------------------------------------
# Find BUG_TABLE inside RW_DATA_SECTION
# ------------------------------------------------------------
bug_index = None

for i in range(rw_start + 1, len(lines)):

    if lines[i].startswith("#define "):
        break

    if "BUG_TABLE" in lines[i]:
        bug_index = i
        break

if bug_index is None:
    raise SystemExit(
        "[FAIL] BUG_TABLE inside RW_DATA_SECTION not found"
    )

# ------------------------------------------------------------
# Check whether PGO_CLANG_DATA already follows BUG_TABLE
# ------------------------------------------------------------
if (
    bug_index + 1 < len(lines)
    and "PGO_CLANG_DATA" in lines[bug_index + 1]
):
    print(
        "[OK] PGO_CLANG_DATA already follows BUG_TABLE"
    )

else:

    indent = (
        lines[bug_index]
        [:len(lines[bug_index]) -
         len(lines[bug_index].lstrip())]
    )

    lines.insert(
        bug_index + 1,
        indent + "PGO_CLANG_DATA\n"
    )

    path.write_text("".join(lines))

    print(
        "[FIX] Added PGO_CLANG_DATA after BUG_TABLE"
    )
PY

          echo
          echo "============================================================"
          echo "VERIFY EXACT PGO PLACEMENT"
          echo "============================================================"

          python3 <<'PY'
from pathlib import Path

path = Path("include/asm-generic/vmlinux.lds.h")
lines = path.read_text().splitlines()

rw_start = None

for i, line in enumerate(lines):
    if line.startswith("#define RW_DATA_SECTION"):
        rw_start = i
        break

if rw_start is None:
    raise SystemExit(
        "[FAIL] RW_DATA_SECTION not found"
    )

bug_index = None

for i in range(rw_start + 1, len(lines)):
    if lines[i].startswith("#define "):
        break

    if "BUG_TABLE" in lines[i]:
        bug_index = i
        break

if bug_index is None:
    raise SystemExit(
        "[FAIL] BUG_TABLE not found"
    )

if bug_index + 1 >= len(lines):
    raise SystemExit(
        "[FAIL] Nothing follows BUG_TABLE"
    )

if "PGO_CLANG_DATA" not in lines[bug_index + 1]:
    print(
        "[FAIL] PGO_CLANG_DATA is not directly after BUG_TABLE"
    )

    print()
    print("Relevant lines:")

    for n in range(
        max(0, bug_index - 3),
        min(len(lines), bug_index + 5)
    ):
        print(f"{n + 1}: {lines[n]}")

    raise SystemExit(1)

print(
    "[OK] PGO_CLANG_DATA is directly after BUG_TABLE"
)

print()
print("Relevant lines:")

for n in range(
    max(0, bug_index - 3),
    min(len(lines), bug_index + 5)
):
    print(f"{n + 1}: {lines[n]}")
PY

      # ============================================================
      # 9. VERIFY PGO INTEGRATION
      # ============================================================
      - name: Verify PGO integration
        run: |
          set -e

          echo "============================================================"
          echo "VERIFY PGO INTEGRATION"
          echo "============================================================"

          FAIL=0

          echo
          echo "--- Root Makefile ---"

          if grep -q 'CFLAGS_PGO_CLANG := -fprofile-generate' Makefile; then
            echo "[OK] CFLAGS_PGO_CLANG"
          else
            echo "[FAIL] CFLAGS_PGO_CLANG missing"
            FAIL=1
          fi

          echo
          echo "--- arch/Kconfig ---"

          if grep -q 'source "kernel/pgo/Kconfig"' arch/Kconfig; then
            echo "[OK] kernel/pgo/Kconfig source"
          else
            echo "[FAIL] kernel/pgo/Kconfig source missing"
            FAIL=1
          fi

          echo
          echo "--- ARM64 Kconfig ---"

          if grep -q 'select ARCH_SUPPORTS_PGO_CLANG' arch/arm64/Kconfig; then
            echo "[OK] ARCH_SUPPORTS_PGO_CLANG"
          else
            echo "[FAIL] ARCH_SUPPORTS_PGO_CLANG missing"
            FAIL=1
          fi

          echo
          echo "--- VDSO Makefile ---"

          if grep -q 'PGO_PROFILE := n' arch/arm64/kernel/vdso/Makefile; then
            echo "[OK] VDSO PGO_PROFILE"
          else
            echo "[FAIL] VDSO PGO_PROFILE missing"
            FAIL=1
          fi

          echo
          echo "--- kernel/Makefile ---"

          if grep -q 'obj-$(CONFIG_PGO_CLANG) += pgo/' kernel/Makefile; then
            echo "[OK] kernel/pgo build rule"
          else
            echo "[FAIL] kernel/pgo build rule missing"
            FAIL=1
          fi

          echo
          echo "--- scripts/Makefile.lib ---"

          if grep -q 'CFLAGS_PGO_CLANG' scripts/Makefile.lib; then
            echo "[OK] scripts/Makefile.lib PGO flags"
          else
            echo "[FAIL] scripts/Makefile.lib PGO flags missing"
            FAIL=1
          fi

          echo
          echo "--- vmlinux.lds.h definition ---"

          if grep -q '__llvm_prf_data_start' include/asm-generic/vmlinux.lds.h; then
            echo "[OK] __llvm_prf_data_start"
          else
            echo "[FAIL] __llvm_prf_data_start missing"
            FAIL=1
          fi

          if grep -q '__llvm_prf_names_start' include/asm-generic/vmlinux.lds.h; then
            echo "[OK] __llvm_prf_names_start"
          else
            echo "[FAIL] __llvm_prf_names_start missing"
            FAIL=1
          fi

          echo
          echo "--- PGO_CLANG_DATA invocation ---"

          python3 <<'PY'
from pathlib import Path

path = Path("include/asm-generic/vmlinux.lds.h")
lines = path.read_text().splitlines()

rw_start = None

for i, line in enumerate(lines):
    if line.startswith("#define RW_DATA_SECTION"):
        rw_start = i
        break

if rw_start is None:
    raise SystemExit(
        "[FAIL] RW_DATA_SECTION not found"
    )

bug_index = None

for i in range(rw_start + 1, len(lines)):
    if lines[i].startswith("#define "):
        break

    if "BUG_TABLE" in lines[i]:
        bug_index = i
        break

if bug_index is None:
    raise SystemExit(
        "[FAIL] BUG_TABLE not found"
    )

if (
    bug_index + 1 >= len(lines)
    or "PGO_CLANG_DATA" not in lines[bug_index + 1]
):
    raise SystemExit(
        "[FAIL] PGO_CLANG_DATA is not invoked "
        "after BUG_TABLE"
    )

print(
    "[OK] PGO_CLANG_DATA invoked by RW_DATA_SECTION"
)
PY

          echo
          echo "--- PGO files ---"

          for file in \
            kernel/pgo/Kconfig \
            kernel/pgo/Makefile \
            kernel/pgo/fs.c \
            kernel/pgo/instrument.c \
            kernel/pgo/pgo.h
          do
            if [ -f "$file" ]; then
              echo "[OK] $file"
            else
              echo "[FAIL] $file missing"
              FAIL=1
            fi
          done

          echo
          echo "============================================================"

          if [ "$FAIL" -ne 0 ]; then
            echo "[FAIL] PGO integration verification failed"
            exit 1
          fi

          echo "[OK] PGO integration verified"

      # ============================================================
      # 10. DEFCONFIG
      # ============================================================
      - name: Run Violet defconfig
        run: |
          set -e

          echo "============================================================"
          echo "RUN VIOLET PERF DEFCONFIG"
          echo "============================================================"

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/violet-perf_defconfig

          echo
          echo "============================================================"
          echo "VERIFY PGO CONFIG"
          echo "============================================================"

          grep -E \
            'CONFIG_(PGO_CLANG|ARCH_SUPPORTS_PGO_CLANG|LTO|THINLTO|POLLY)' \
            out/.config || true

          echo
          echo "PGO CONFIG:"

          grep 'CONFIG_PGO_CLANG' out/.config || true
          grep 'CONFIG_ARCH_SUPPORTS_PGO_CLANG' out/.config || true

      # ============================================================
      # 11. DEBUG PGO LINKER PREPROCESSING
      # ============================================================
      - name: Debug PGO linker preprocessing
        run: |
          set -e

          echo "============================================================"
          echo "PGO LINKER DEBUG"
          echo "============================================================"

          rm -rf pgo-debug
          mkdir -p pgo-debug

          echo
          echo "--- Kernel version ---"

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            kernelversion \
            | tee pgo-debug/kernel-version.txt

          echo
          echo "--- Verify PGO configuration ---"

          grep -E \
            'CONFIG_(PGO_CLANG|ARCH_SUPPORTS_PGO_CLANG|PROC_FS)' \
            out/.config \
            | tee pgo-debug/pgo-config.txt || true

          echo
          echo "--- Generate prepare headers ---"

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            prepare \
            2>&1 | tee pgo-debug/prepare.log

          echo
          echo "--- Preprocess ARM64 vmlinux linker script ---"

          set +e

          make \
            V=1 \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            arch/arm64/kernel/vmlinux.lds \
            2>&1 | tee pgo-debug/vmlinux-lds-build.log

          LDS_STATUS=${PIPESTATUS[0]}

          set -e

          echo "$LDS_STATUS" > pgo-debug/lds-status.txt

          if [ "$LDS_STATUS" -ne 0 ]; then
            echo "[WARN] vmlinux.lds target returned status $LDS_STATUS"
          else
            echo "[OK] vmlinux.lds generated"
          fi

          echo
          echo "--- Locate generated linker script ---"

          find out arch/arm64/kernel \
            -name 'vmlinux.lds' \
            -o -name '*.lds' \
            | tee pgo-debug/linker-files.txt

          echo
          echo "--- Check PGO symbols in generated linker script ---"

          LDS_FILE="out/arch/arm64/kernel/vmlinux.lds"

          if [ -f "$LDS_FILE" ]; then

            grep -n \
              -E \
              '__llvm_prf_(data|cnts|names|vals|vnds)_(start|end)' \
              "$LDS_FILE" \
              | tee pgo-debug/pgo-symbols.txt || true

            cp "$LDS_FILE" \
              pgo-debug/vmlinux.lds

          else
            echo "[WARN] Generated linker script not found"
          fi

          echo
          echo "--- Check source placement ---"

          grep -n \
            -A8 \
            -B8 \
            'BUG_TABLE' \
            include/asm-generic/vmlinux.lds.h \
            | tee pgo-debug/source-placement.txt

          echo
          echo "--- Check LINKER_SCRIPT propagation ---"

          grep -R \
            -n \
            'DLINKER_SCRIPT\|LINKER_SCRIPT' \
            arch/arm64 \
            scripts \
            Makefile \
            2>/dev/null \
            | head -100 \
            | tee pgo-debug/linker-script-flags.txt || true

          echo
          echo "--- Check generated compiler/linker commands ---"

          grep -R \
            -n \
            'vmlinux.lds' \
            out \
            2>/dev/null \
            | head -100 \
            | tee pgo-debug/vmlinux-lds-commands.txt || true

          echo
          echo "============================================================"
          echo "PGO LINKER DEBUG COMPLETE"
          echo "============================================================"

      # ============================================================
      # 11A. UPLOAD DEBUG ARTIFACT
      # ============================================================
      - name: Upload PGO linker debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgo-linker-debug
          path: pgo-debug/
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # 12. CHECK CLANG PGO SUPPORT
      # ============================================================
      - name: Check Clang PGO support
        run: |
          set -e

          echo "============================================================"
          echo "CHECK CLANG PGO SUPPORT"
          echo "============================================================"

          clang --version

          echo
          echo "Test -fprofile-generate"

          printf 'int main(void) { return 0; }\n' > /tmp/pgo-test.c

          clang \
            -fprofile-generate \
            -c \
            /tmp/pgo-test.c \
            -o /tmp/pgo-test.o

          echo "[OK] -fprofile-generate"

          echo
          echo "Test -fprofile-instr-generate"

          clang \
            -fprofile-instr-generate \
            -c \
            /tmp/pgo-test.c \
            -o /tmp/pgo-test-instr.o

          echo "[OK] -fprofile-instr-generate"

          echo
          echo "Test -fprofile-instr-use"

          clang \
            -fprofile-instr-use=/dev/null \
            -c \
            /tmp/pgo-test.c \
            -o /tmp/pgo-test-use.o \
            2>&1 || true

          echo
          echo "Test llvm-profdata"

          llvm-profdata --version

          echo
          echo "[OK] Clang PGO toolchain support detected"

      # ============================================================
      # 13. BUILD FULL KERNEL
      # ============================================================
      - name: Build full kernel
        run: |
          set -e

          echo "============================================================"
          echo "BUILD FULL ARM64 KERNEL WITH CLANG PGO"
          echo "============================================================"

          echo
          echo "Toolchain:"

          clang --version | head -n 1
          ld.lld --version | head -n 1

          echo
          echo "Environment:"

          echo "ARCH=arm64"
          echo "LLVM=1"
          echo "LLVM_IAS=1"
          echo "CC=clang"
          echo "LD=ld.lld"
          echo "AR=llvm-ar"
          echo "AS=llvm-as"
          echo "NM=llvm-nm"
          echo "OBJCOPY=llvm-objcopy"
          echo "OBJDUMP=llvm-objdump"
          echo "STRIP=llvm-strip"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"
          echo "CLANG_TRIPLE=$CLANG_TRIPLE"

          echo
          echo "============================================================"
          echo "CONFIGURATION"
          echo "============================================================"

          grep -E \
            'CONFIG_(PGO_CLANG|ARCH_SUPPORTS_PGO_CLANG|LTO|THINLTO|POLLY)' \
            out/.config \
            || true

          echo
          echo "============================================================"
          echo "START BUILD"
          echo "============================================================"

          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            2>&1 | tee build.log

      # ============================================================
      # 14. VERIFY PGO COMPILER FLAGS
      # ============================================================
      - name: Verify PGO compiler flags
        if: always()
        run: |
          set -e

          echo "============================================================"
          echo "VERIFY PGO COMPILER FLAGS"
          echo "============================================================"

          if [ -f build.log ]; then

            echo
            echo "--- PGO flags found in build log ---"

            grep -n \
              -- '-fprofile-generate' \
              build.log \
              | head -100 \
              || true

            echo
            echo "--- PGO flag count ---"

            grep -o \
              -- '-fprofile-generate' \
              build.log \
              | wc -l \
              || true

          else
            echo "[WARN] build.log not found"
          fi

      # ============================================================
      # 15. VERIFY LLVM PGO OBJECT SECTIONS
      # ============================================================
      - name: Verify LLVM PGO object sections
        if: always()
        run: |
          set -e

          echo "============================================================"
          echo "VERIFY LLVM PGO OBJECT SECTIONS"
          echo "============================================================"

          FAIL=0

          OBJECTS="$(find out -type f \( \
            -name '*.o' \
            -o -name '*.ko' \
          \) 2>/dev/null | head -500)"

          if [ -z "$OBJECTS" ]; then
            echo "[WARN] No object files found"
            exit 0
          fi

          FOUND=0

          while IFS= read -r obj; do

            if llvm-nm "$obj" 2>/dev/null | \
              grep -q '__llvm_prf_'; then

              echo
              echo "--- $obj ---"

              llvm-nm "$obj" 2>/dev/null | \
                grep '__llvm_prf_' \
                | head -30

              FOUND=1

            fi

          done <<< "$OBJECTS"

          echo

          if [ "$FOUND" -eq 1 ]; then
            echo "[OK] LLVM PGO symbols confirmed in object files"
          else
            echo "[FAIL] No LLVM PGO symbols found in object files"
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi

      # ============================================================
      # 16. VERIFY FINAL VMLINUX PGO SECTIONS
      # ============================================================
      - name: Verify final vmlinux PGO sections
        if: always()
        run: |
          set -e

          echo "============================================================"
          echo "VERIFY FINAL VMLINUX PGO SECTIONS"
          echo "============================================================"

          if [ ! -f out/vmlinux ]; then
            echo "[WARN] out/vmlinux not found"
            exit 0
          fi

          echo
          echo "--- LLVM PGO sections ---"

          llvm-objdump -h out/vmlinux 2>/dev/null | \
            grep -E \
              '__llvm_prf_(data|cnts|names|vals|vnds)' \
            || true

          echo
          echo "--- LLVM PGO symbols ---"

          llvm-nm out/vmlinux 2>/dev/null | \
            grep -E \
              '__llvm_prf_(data|cnts|names|vals|vnds)_(start|end)' \
            || true

          echo
          echo "============================================================"
          echo "REQUIRED SYMBOL CHECK"
          echo "============================================================"

          FAIL=0

          for symbol in \
            __llvm_prf_data_start \
            __llvm_prf_data_end \
            __llvm_prf_cnts_start \
            __llvm_prf_cnts_end \
            __llvm_prf_names_start \
            __llvm_prf_names_end \
            __llvm_prf_vals_start \
            __llvm_prf_vals_end \
            __llvm_prf_vnds_start \
            __llvm_prf_vnds_end
          do

            if llvm-nm out/vmlinux 2>/dev/null | \
              grep -q "$symbol"; then

              echo "[OK] $symbol"

            else

              echo "[FAIL] $symbol missing"
              FAIL=1

            fi

          done

          if [ "$FAIL" -ne 0 ]; then
            echo
            echo "[FAIL] Required LLVM PGO symbols missing"
            exit 1
          fi

          echo
          echo "[OK] Final vmlinux contains all required LLVM PGO symbols"

      # ============================================================
      # 17. SAVE FINAL CONFIG
      # ============================================================
      - name: Save final defconfig
        if: always()
        run: |
          set -e

          if [ -f out/.config ]; then

            cp \
              out/.config \
              final-defconfig

            echo "============================================================"
            echo "FINAL PGO CONFIG"
            echo "============================================================"

            grep -E \
              'CONFIG_(PGO_CLANG|ARCH_SUPPORTS_PGO_CLANG|LTO|THINLTO|POLLY)' \
              final-defconfig \
              || true

          else

            echo "[WARN] out/.config not found"

          fi

      # ============================================================
      # 18. UPLOAD BUILD ARTIFACTS
      # ============================================================
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-clang-pgo-build
          path: |
            out/Image
            out/Image.gz
            out/dtbs/**
            out/arch/arm64/boot/**
            out/vmlinux
            out/.config
            final-defconfig
            build.log
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # 19. FINAL SUMMARY
      # ============================================================
      - name: Final summary
        if: always()
        run: |
          echo
          echo "============================================================"
          echo "ARM64 CLANG PGO BUILD SUMMARY"
          echo "============================================================"

          echo
          echo "Kernel:"
          echo "Linux 4.14.357-openela"

          echo
          echo "Target:"
          echo "ARM64 / Qualcomm SM6150 / Xiaomi Violet"

          echo
          echo "Branch:"
          echo "16"

          echo
          echo "Clang:"
          clang --version | head -n 1 || true

          echo
          echo "PGO configuration:"

          if [ -f out/.config ]; then
            grep -E \
              'CONFIG_(PGO_CLANG|ARCH_SUPPORTS_PGO_CLANG)' \
              out/.config \
              || true
          fi

          echo
          echo "PGO linker source:"

          grep -n \
            -A3 \
            -B3 \
            'BUG_TABLE' \
            include/asm-generic/vmlinux.lds.h \
            | tail -20 \
            || true

          echo
          echo "============================================================"
          echo "DEBUG ARTIFACT"
          echo "============================================================"

          echo "pgo-linker-debug"

          echo
          echo "============================================================"
          echo "DONE"
          echo "============================================================"
