name: Build PGO Only patch - Clang r416183b

on:
  workflow_dispatch:

jobs:
  build-pgo:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout kernel
      # ============================================================

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1


      # ============================================================
      # 2. Install dependencies
      # ============================================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt update

          sudo apt install -y \
            git \
            curl \
            wget \
            build-essential \
            gcc \
            g++ \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            device-tree-compiler \
            python3 \
            file


      # ============================================================
      # 3. Clone LineageOS Toolchains
      # ============================================================

      - name: Clone LineageOS Toolchains
        run: |
          set -e

          echo "========================================"
          echo "CLONING TOOLCHAINS"
          echo "========================================"

          rm -rf clang gcc64 gcc32

          echo
          echo "========================================"
          echo "CLANG r416183b"
          echo "========================================"

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            clang

          echo
          echo "========================================"
          echo "GCC64 4.9"
          echo "========================================"

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          echo
          echo "========================================"
          echo "GCC32 4.9"
          echo "========================================"

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32


      # ============================================================
      # 4. Setup Toolchain
      # ============================================================

      - name: Setup Toolchain
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          echo "PATH=$PATH" >> "$GITHUB_ENV"

          echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> "$GITHUB_ENV"
          echo "GCC64_PATH=$GITHUB_WORKSPACE/gcc64" >> "$GITHUB_ENV"
          echo "GCC32_PATH=$GITHUB_WORKSPACE/gcc32" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE=aarch64-linux-android-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-" >> "$GITHUB_ENV"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"


      # ============================================================
      # 5. Verify Toolchain
      # ============================================================

      - name: Verify Toolchain
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "========================================"
          echo "CLANG"
          echo "========================================"

          which clang
          clang --version

          echo
          echo "========================================"
          echo "LLD"
          echo "========================================"

          which ld.lld
          ld.lld --version

          echo
          echo "========================================"
          echo "LLVM TOOLS"
          echo "========================================"

          for tool in \
            llvm-ar \
            llvm-nm \
            llvm-objcopy \
            llvm-objdump \
            llvm-strip \
            llvm-profdata \
            opt

          do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "[FOUND] $tool"
              command -v "$tool"
            else
              echo "[MISSING] $tool"
            fi
          done

          echo
          echo "========================================"
          echo "GCC64"
          echo "========================================"

          which aarch64-linux-android-gcc
          aarch64-linux-android-gcc --version | head -1

          echo
          echo "========================================"
          echo "GCC32"
          echo "========================================"

          which arm-linux-androideabi-gcc
          arm-linux-androideabi-gcc --version | head -1


      # ============================================================
      # 6. Download PGO Patch
      # ============================================================

      - name: Download PGO Patch
        run: |
          set -e

          echo "========================================"
          echo "DOWNLOAD PGO PATCH"
          echo "========================================"

          curl -L \
            --fail \
            --retry 3 \
            -o 0001-ARM64-Clang-PGO-4.14-1.patch \
            https://raw.githubusercontent.com/Red-A-Hawk/Patch/kernel_xiaomi_violet/0001-ARM64-Clang-PGO-4.14-1.patch

          echo
          echo "Patch information:"
          wc -l 0001-ARM64-Clang-PGO-4.14-1.patch
          wc -c 0001-ARM64-Clang-PGO-4.14-1.patch

          echo
          echo "Patch SHA256:"
          sha256sum 0001-ARM64-Clang-PGO-4.14-1.patch


      # ============================================================
      # 7. Check PGO Patch
      # ============================================================

      - name: Check PGO Patch
        run: |
          set -e

          echo "========================================"
          echo "CHECKING PGO PATCH"
          echo "========================================"

          git apply \
            --check \
            0001-ARM64-Clang-PGO-4.14-1.patch

          echo
          echo "[OK] Patch applies cleanly"


      # ============================================================
      # 8. Apply PGO Patch
      # ============================================================

      - name: Apply PGO Patch
        run: |
          set -e

          echo "========================================"
          echo "APPLYING PGO PATCH"
          echo "========================================"

          git apply \
            0001-ARM64-Clang-PGO-4.14-1.patch

          echo
          echo "[OK] PGO patch applied"


      # ============================================================
      # 9. Verify PGO Source Integration
      # ============================================================

      - name: Verify PGO Integration
        run: |
          set -e

          echo "========================================"
          echo "VERIFY PGO INTEGRATION"
          echo "========================================"

          echo
          echo "Checking PGO files:"

          test -f kernel/pgo/Kconfig
          test -f kernel/pgo/Makefile
          test -f kernel/pgo/fs.c
          test -f kernel/pgo/instrument.c
          test -f kernel/pgo/pgo.h

          echo "[OK] kernel/pgo files found"

          echo
          echo "Checking PGO Kconfig:"

          grep -n "config PGO_CLANG" \
            kernel/pgo/Kconfig

          echo
          echo "Checking ARM64 PGO support:"

          grep -n "ARCH_SUPPORTS_PGO_CLANG" \
            arch/arm64/Kconfig

          echo
          echo "Checking PGO compiler flag:"

          grep -n "CFLAGS_PGO_CLANG" \
            Makefile

          echo
          echo "Checking profile-generate flag:"

          grep -n "fprofile-generate" \
            Makefile

          echo
          echo "[OK] PGO source integration verified"


      # ============================================================
      # 10. Prepare Output Directory
      # ============================================================

      - name: Prepare Build Directory
        run: |
          set -e

          rm -rf out

          mkdir -p out

          echo "[OK] Build directory prepared"


      # ============================================================
      # 11. Load Original Defconfig
      # ============================================================

      - name: Load violet-perf Defconfig
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "========================================"
          echo "LOADING DEFCONFIG"
          echo "========================================"

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            vendor/violet-perf_defconfig

          echo
          echo "[OK] vendor/violet-perf_defconfig loaded"


      # ============================================================
      # 12. Enable PGO
      # ============================================================

      - name: Enable CONFIG_PGO_CLANG
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "========================================"
          echo "ENABLE PGO"
          echo "========================================"

          if [ ! -x scripts/config ]; then
            echo "[INFO] Building scripts/config"

            make \
              O=out \
              ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE="$CLANG_TRIPLE" \
              CROSS_COMPILE="$CROSS_COMPILE" \
              CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
              scripts

          fi

          echo
          echo "Enabling CONFIG_PGO_CLANG..."

          scripts/config \
            --file out/.config \
            --enable CONFIG_PGO_CLANG

          echo
          echo "Running olddefconfig..."

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            olddefconfig

          echo
          echo "CONFIG_PGO_CLANG result:"

          grep -n \
            "^CONFIG_PGO_CLANG=" \
            out/.config

          echo
          echo "[OK] PGO configuration enabled"


      # ============================================================
      # 13. Verify PGO Configuration
      # ============================================================

      - name: Verify PGO Configuration
        run: |
          set -e

          echo "========================================"
          echo "PGO CONFIGURATION"
          echo "========================================"

          if grep -q "^CONFIG_PGO_CLANG=y$" out/.config; then
            echo "[PASS] CONFIG_PGO_CLANG=y"
          else
            echo "[FAIL] CONFIG_PGO_CLANG is not enabled"
            grep "PGO" out/.config || true
            exit 1
          fi

          echo
          echo "PROC_FS:"

          grep "^CONFIG_PROC_FS=" out/.config || true

          echo
          echo "LTO:"

          grep "^CONFIG_LTO" out/.config || true

          echo
          echo "THINLTO:"

          grep "^CONFIG_THINLTO" out/.config || true

          echo
          echo "POLLY:"

          grep "^CONFIG_.*POLLY" out/.config || true

          echo
          echo "[OK] Configuration check completed"


      # ============================================================
      # 14. Export Final Defconfig
      # ============================================================

      - name: Save Final Defconfig
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            savedefconfig

          cp \
            out/defconfig \
            out/violet-pgo-defconfig

          echo "[OK] Final PGO defconfig saved"


      # ============================================================
      # 15. Build PGO Instrumented Kernel
      # ============================================================

      - name: Build PGO Kernel
        run: |
          set -o pipefail

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "========================================"
          echo "BUILDING PGO INSTRUMENTED KERNEL"
          echo "========================================"

          echo
          echo "Compiler:"
          clang --version

          echo
          echo "PGO configuration:"
          grep "^CONFIG_PGO_CLANG=" out/.config

          echo
          echo "PGO compiler flag from Makefile:"
          grep "CFLAGS_PGO_CLANG" Makefile

          echo
          echo "========================================"
          echo "START BUILD"
          echo "========================================"

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            -j"$(nproc)" \
            2>&1 | tee pgo-build.log


      # ============================================================
      # 16. Verify Kernel Build
      # ============================================================

      - name: Verify Kernel Build
        if: always()
        run: |
          set +e

          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          echo
          echo "Searching kernel outputs..."

          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            -print \
            2>/dev/null || true

          echo
          echo "vmlinux:"

          if [ -f out/vmlinux ]; then
            echo "[FOUND] out/vmlinux"
            ls -lh out/vmlinux
            file out/vmlinux
          else
            echo "[MISSING] out/vmlinux"
          fi

          echo
          echo "Image:"

          if [ -f out/arch/arm64/boot/Image ]; then
            echo "[FOUND] Image"
            ls -lh out/arch/arm64/boot/Image
          else
            echo "[MISSING] Image"
          fi

          echo
          echo "Image.gz:"

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "[FOUND] Image.gz"
            ls -lh out/arch/arm64/boot/Image.gz
          else
            echo "[MISSING] Image.gz"
          fi

          echo
          echo "dtb/dtbo:"

          find out/arch/arm64/boot \
            -type f \
            \( \
              -name "*.dtb" \
              -o \
              -name "*.dtbo" \
            \) \
            -print \
            2>/dev/null || true


      # ============================================================
      # 17. Verify PGO LLVM Sections
      # ============================================================

      - name: Verify LLVM PGO Sections
        if: always()
        run: |
          set +e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "========================================"
          echo "LLVM PGO SECTIONS"
          echo "========================================"

          if [ -f out/vmlinux ]; then

            echo
            echo "Searching LLVM profiling sections..."

            llvm-objdump \
              -h \
              out/vmlinux \
              2>/dev/null \
              | grep -E \
                "__llvm_prf_(data|cnts|names|vals|vnds)" \
              || true

            echo
            echo "Searching LLVM profiling symbols..."

            llvm-nm \
              out/vmlinux \
              2>/dev/null \
              | grep "__llvm_prf_" \
              | head -50 \
              || true

          else

            echo "[SKIP] vmlinux was not generated"

          fi


      # ============================================================
      # 18. Check Build Log for PGO
      # ============================================================

      - name: Inspect PGO Build Log
        if: always()
        run: |
          set +e

          echo "========================================"
          echo "PGO BUILD LOG ANALYSIS"
          echo "========================================"

          if [ -f pgo-build.log ]; then

            echo
            echo "Occurrences of fprofile-generate:"

            grep -n \
              "fprofile-generate" \
              pgo-build.log \
              | head -50 \
              || true

            echo
            echo "Occurrences of PGO:"

            grep -ni \
              "PGO" \
              pgo-build.log \
              | head -100 \
              || true

          else

            echo "[MISSING] pgo-build.log"

          fi


      # ============================================================
      # 19. Final PGO Summary
      # ============================================================

      - name: Final PGO Summary
        if: always()
        run: |
          set +e

          echo
          echo "========================================"
          echo "FINAL PGO SUMMARY"
          echo "========================================"

          echo
          echo "Compiler:"
          clang --version

          echo
          echo "PGO configuration:"

          if [ -f out/.config ]; then
            grep "^CONFIG_PGO_CLANG=" \
              out/.config \
              || true
          fi

          echo
          echo "PGO source:"

          if [ -d kernel/pgo ]; then
            echo "[FOUND] kernel/pgo"
          else
            echo "[MISSING] kernel/pgo"
          fi

          echo
          echo "Kernel:"

          if [ -f out/vmlinux ]; then
            echo "[BUILT] vmlinux"
            ls -lh out/vmlinux
          else
            echo "[NOT BUILT] vmlinux"
          fi

          echo
          echo "ARM64 Image:"

          if [ -f out/arch/arm64/boot/Image ]; then
            echo "[BUILT] Image"
            ls -lh out/arch/arm64/boot/Image
          else
            echo "[NOT BUILT] Image"
          fi

          echo
          echo "========================================"
          echo "PGO TEST FINISHED"
          echo "========================================"


      # ============================================================
      # 20. Upload PGO Build Artifacts
      # ============================================================

      - name: Upload PGO Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PGO-Clang-r416183b
          path: |
            0001-ARM64-Clang-PGO-4.14-1.patch
            pgo-build.log
            out/.config
            out/defconfig
            out/violet-pgo-defconfig
            out/vmlinux
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/*.dtb
            out/arch/arm64/boot/*.dtbo
          if-no-files-found: warn
