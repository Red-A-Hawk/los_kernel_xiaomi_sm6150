name: Build PGO patchh- Kernel 4.14 - Clang r416183b

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      KERNEL_REPO: https://github.com/Red-A-Hawk/los_kernel_xiaomi_sm6150.git
      KERNEL_BRANCH: 16
      PGO_PATCH_URL: https://raw.githubusercontent.com/Red-A-Hawk/Patch/kernel_xiaomi_violet/0001-ARM64-Clang-PGO-4.14-RedHawk.patch

      CLANG_REPO: https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git
      CLANG_DIR: ${{ github.workspace }}/clang

      ARCH: arm64
      DEFCONFIG: vendor/violet-perf_defconfig

    steps:

      # ============================================================
      # 1. Install dependencies
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            device-tree-compiler \
            python3 \
            python3-pip \
            rsync \
            unzip \
            cpio \
            lz4 \
            xz-utils \
            zstd \
            binutils-aarch64-linux-gnu

      # ============================================================
      # 2. Clone kernel branch 16
      # ============================================================
      - name: Clone kernel
        shell: bash
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            kernel

          cd kernel

          echo "Kernel commit:"
          git rev-parse HEAD

          echo "Kernel version:"
          make kernelversion

      # ============================================================
      # 3. Clone Clang r416183b
      # ============================================================
      - name: Setup Clang r416183b
        shell: bash
        run: |
          set -eux

          git clone \
            --depth=1 \
            "${CLANG_REPO}" \
            "${CLANG_DIR}"

          echo "Clang directory:"
          ls -la "${CLANG_DIR}"

          echo "Checking Clang:"
          "${CLANG_DIR}/bin/clang" --version

          echo "Checking LLVM tools:"
          for tool in \
            clang \
            clang++ \
            ld.lld \
            llvm-ar \
            llvm-nm \
            llvm-objcopy \
            llvm-objdump \
            llvm-strip \
            llvm-profdata
          do
            if [ -x "${CLANG_DIR}/bin/${tool}" ]; then
              echo "FOUND: ${tool}"
            else
              echo "MISSING: ${tool}"
            fi
          done

      # ============================================================
      # 4. Apply Red-A-Hawk PGO patch
      # ============================================================
      - name: Apply PGO patch
        shell: bash
        run: |
          set -eux

          cd kernel

          curl -L \
            --fail \
            --retry 3 \
            -o 0001-ARM64-Clang-PGO-4.14-RedHawk.patch \
            "${PGO_PATCH_URL}"

          echo "Patch SHA256:"
          sha256sum 0001-ARM64-Clang-PGO-4.14-RedHawk.patch

          echo "Patch information:"
          head -20 0001-ARM64-Clang-PGO-4.14-RedHawk.patch

          echo "Checking patch..."

          git apply --check \
            0001-ARM64-Clang-PGO-4.14-RedHawk.patch

          echo "Patch check PASSED"

          git apply \
            0001-ARM64-Clang-PGO-4.14-RedHawk.patch

          echo "PGO patch applied successfully."

      # ============================================================
      # 5. Verify PGO source was actually added
      # ============================================================
      - name: Verify PGO integration
        shell: bash
        run: |
          set -eux

          cd kernel

          test -f kernel/pgo/Kconfig
          test -f kernel/pgo/Makefile
          test -f kernel/pgo/fs.c
          test -f kernel/pgo/instrument.c
          test -f kernel/pgo/pgo.h
          test -f Documentation/dev-tools/pgo.rst

          grep -q "CONFIG_PGO_CLANG" arch/Kconfig
          grep -q "ARCH_SUPPORTS_PGO_CLANG" arch/arm64/Kconfig
          grep -q "CFLAGS_PGO_CLANG" Makefile
          grep -q "PGO_PROFILE" scripts/Makefile.lib
          grep -q "PGO_CLANG_DATA" include/asm-generic/vmlinux.lds.h

          echo "=========================================="
          echo "PGO source integration: OK"
          echo "=========================================="

      # ============================================================
      # 6. Prepare build directory
      # ============================================================
      - name: Prepare build directory
        shell: bash
        run: |
          set -eux

          cd kernel

          rm -rf out
          mkdir -p out

      # ============================================================
      # 7. Load original Violet defconfig
      # ============================================================
      - name: Load violet-perf_defconfig
        shell: bash
        run: |
          set -eux

          cd kernel

          make \
            O=out \
            ARCH=arm64 \
            CC="${CLANG_DIR}/bin/clang" \
            LD="${CLANG_DIR}/bin/ld.lld" \
            AR="${CLANG_DIR}/bin/llvm-ar" \
            NM="${CLANG_DIR}/bin/llvm-nm" \
            OBJCOPY="${CLANG_DIR}/bin/llvm-objcopy" \
            OBJDUMP="${CLANG_DIR}/bin/llvm-objdump" \
            STRIP="${CLANG_DIR}/bin/llvm-strip" \
            "${DEFCONFIG}"

      # ============================================================
      # 8. Enable PGO
      # ============================================================
      - name: Enable CONFIG_PGO_CLANG
        shell: bash
        run: |
          set -eux

          cd kernel

          if [ ! -x scripts/config ]; then
            echo "scripts/config not found"
            exit 1
          fi

          # PGO requires procfs.
          scripts/config \
            --file out/.config \
            --enable CONFIG_PROC_FS \
            --enable CONFIG_PGO_CLANG

          # Ensure PGO is the only NEW optimization feature enabled
          # by this workflow.
          scripts/config \
            --file out/.config \
            --disable CONFIG_POLLY_CLANG \
            --disable CONFIG_BOLT

          make \
            O=out \
            ARCH=arm64 \
            CC="${CLANG_DIR}/bin/clang" \
            LD="${CLANG_DIR}/bin/ld.lld" \
            olddefconfig

      # ============================================================
      # 9. Verify final configuration
      # ============================================================
      - name: Verify PGO configuration
        shell: bash
        run: |
          set -eux

          cd kernel

          echo "CONFIG_PGO_CLANG:"
          grep '^CONFIG_PGO_CLANG=' out/.config

          echo "CONFIG_PROC_FS:"
          grep '^CONFIG_PROC_FS=' out/.config

          echo "PGO-related configuration:"
          grep -E \
            'CONFIG_(PGO|POLLY|BOLT|PROC_FS)' \
            out/.config || true

          test "$(grep '^CONFIG_PGO_CLANG=y' out/.config | wc -l)" -eq 1

          if grep -q '^CONFIG_POLLY_CLANG=y' out/.config; then
            echo "ERROR: Polly is enabled"
            exit 1
          fi

          if grep -q '^CONFIG_BOLT=y' out/.config; then
            echo "ERROR: BOLT is enabled"
            exit 1
          fi

          echo "=========================================="
          echo "PGO CONFIGURATION: OK"
          echo "=========================================="

      # ============================================================
      # 10. Build kernel
      # ============================================================
      - name: Build kernel
        shell: bash
        run: |
          set -eux

          cd kernel

          export PATH="${CLANG_DIR}/bin:${PATH}"

          echo "Compiler:"
          clang --version

          echo "Linker:"
          ld.lld --version

          echo "Building with PGO instrumentation..."

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            -j"$(nproc --all)"

      # ============================================================
      # 11. Verify generated kernel
      # ============================================================
      - name: Verify build output
        shell: bash
        run: |
          set -eux

          cd kernel

          echo "=========================================="
          echo "Build output"
          echo "=========================================="

          test -f out/.config
          test -f out/vmlinux

          if [ -f out/arch/arm64/boot/Image ]; then
            echo "Image: FOUND"
            ls -lh out/arch/arm64/boot/Image
          else
            echo "Image: NOT FOUND"
          fi

          echo "vmlinux:"
          ls -lh out/vmlinux

          echo "PGO symbols:"
          llvm-nm out/vmlinux 2>/dev/null | grep -E \
            '__llvm_prf_(data|cnts|names|vals|vnds)' \
            | head -30 || true

      # ============================================================
      # 12. Save final defconfig
      # ============================================================
      - name: Save final defconfig
        shell: bash
        run: |
          set -eux

          cd kernel

          cp out/.config \
            out/PGO-final-defconfig

          grep '^CONFIG_PGO_CLANG=' \
            out/.config

      # ============================================================
      # 13. Upload kernel artifacts
      # ============================================================
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-pgo-clang-r416183b
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/vmlinux
            kernel/out/.config
            kernel/out/PGO-final-defconfig
            kernel/0001-ARM64-Clang-PGO-4.14-RedHawk.patch
          if-no-files-found: warn

      # ============================================================
      # 14. Upload build log / metadata
      # ============================================================
      - name: Save build information
        if: always()
        shell: bash
        run: |
          cd kernel

          {
            echo "===== KERNEL ====="
            make kernelversion || true

            echo
            echo "===== COMMIT ====="
            git rev-parse HEAD || true

            echo
            echo "===== CLANG ====="
            "${CLANG_DIR}/bin/clang" --version || true

            echo
            echo "===== LLD ====="
            "${CLANG_DIR}/bin/ld.lld" --version || true

            echo
            echo "===== PGO CONFIG ====="
            grep -E \
              '^CONFIG_(PGO|PROC_FS|POLLY|BOLT)' \
              out/.config 2>/dev/null || true

            echo
            echo "===== PATCH SHA256 ====="
            sha256sum \
              0001-ARM64-Clang-PGO-4.14-RedHawk.patch \
              2>/dev/null || true
          } > pgo-build-info.txt

      - name: Upload build information
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgo-build-info
          path: kernel/pgo-build-info.txt
          if-no-files-found: warn
