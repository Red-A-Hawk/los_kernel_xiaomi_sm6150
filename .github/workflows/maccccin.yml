name: Check Stack Protector Strong - r416183b

on:
  workflow_dispatch:

jobs:
  check-stack-protector:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout kernel
      # ============================================================

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      # ============================================================
      # 2. Install dependencies
      # ============================================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt update

          sudo apt install -y \
            git \
            curl \
            build-essential \
            gcc \
            g++ \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            device-tree-compiler

      # ============================================================
      # 3. Clone LineageOS Toolchains
      # ============================================================

      - name: Clone LineageOS Toolchains
        run: |
          set -e

          echo "========================================"
          echo "CLONING TOOLCHAINS"
          echo "========================================"

          rm -rf clang gcc64 gcc32

          echo
          echo "========================================"
          echo "CLANG r416183b"
          echo "========================================"

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            clang

          echo
          echo "========================================"
          echo "GCC64 4.9"
          echo "========================================"

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          echo
          echo "========================================"
          echo "GCC32 4.9"
          echo "========================================"

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

      # ============================================================
      # 4. Setup Toolchain
      # ============================================================

      - name: Setup Toolchain
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          echo "PATH=$PATH" >> "$GITHUB_ENV"

          echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> "$GITHUB_ENV"
          echo "GCC64_PATH=$GITHUB_WORKSPACE/gcc64" >> "$GITHUB_ENV"
          echo "GCC32_PATH=$GITHUB_WORKSPACE/gcc32" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE=aarch64-linux-android-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-" >> "$GITHUB_ENV"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

      # ============================================================
      # 5. Verify Clang
      # ============================================================

      - name: Verify Clang
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "========================================"
          echo "CLANG"
          echo "========================================"

          which clang
          clang --version

          echo
          echo "========================================"
          echo "GCC64"
          echo "========================================"

          which aarch64-linux-android-gcc
          aarch64-linux-android-gcc --version | head -1

          echo
          echo "========================================"
          echo "GCC32"
          echo "========================================"

          which arm-linux-androideabi-gcc
          arm-linux-androideabi-gcc --version | head -1

      # ============================================================
      # 6. Debug Kbuild Stack Protector
      # ============================================================

      - name: Debug Stack Protector Kbuild Check
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          export ARCH=arm64
          export CC=clang
          export LLVM=1
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          echo
          echo "========================================"
          echo "STACK PROTECTOR KBUILD DEBUG"
          echo "========================================"

          echo
          echo "========================================"
          echo "COMPILER"
          echo "========================================"

          echo "CC=$CC"
          echo "ARCH=$ARCH"
          echo "LLVM=$LLVM"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"
          echo "CLANG_TRIPLE=$CLANG_TRIPLE"

          which clang
          clang --version

          echo
          echo "========================================"
          echo "STACK PROTECTOR SCRIPTS"
          echo "========================================"

          find scripts -maxdepth 2 -type f \
            \( \
              -name '*stack-protector*' \
              -o \
              -name '*has-stack*' \
            \) \
            -print

          echo
          echo "========================================"
          echo "SEARCH stackp-check"
          echo "========================================"

          grep -Rni \
            "stackp-check\|has-stack-protector" \
            Makefile \
            scripts \
            arch \
            2>/dev/null \
            | head -200 \
            || true

          echo
          echo "========================================"
          echo "STACK PROTECTOR VARIABLES"
          echo "========================================"

          grep -Rni \
            "stackp-flag\|stackp-name\|stackp-check" \
            Makefile \
            arch \
            scripts \
            2>/dev/null \
            | head -200 \
            || true

          echo
          echo "========================================"
          echo "FIND ARM64 STACK PROTECTOR CHECK"
          echo "========================================"

          STACK_SCRIPT=""

          for file in \
            scripts/gcc-arm64_has-stack-protector.sh \
            scripts/gcc-arm64_has-stack-protector.sh \
            scripts/gcc-arm64_has-stack-protector
          do
            if [ -f "$file" ]; then
              STACK_SCRIPT="$file"
              break
            fi
          done

          if [ -n "$STACK_SCRIPT" ]; then

            echo "[FOUND] $STACK_SCRIPT"

            echo
            echo "----------------------------------------"
            echo "SCRIPT CONTENT"
            echo "----------------------------------------"

            cat "$STACK_SCRIPT"

          else

            echo "[INFO] ARM64 stack protector script was not found using expected names."

            echo
            echo "Searching entire tree..."

            find . \
              -type f \
              \( \
                -name '*stack*protector*' \
                -o \
                -name '*has-stack*' \
              \) \
              -print \
              | head -100

          fi

          echo
          echo "========================================"
          echo "DIRECT COMPILER TEST"
          echo "========================================"

          echo
          echo "Command:"
          echo "clang -target aarch64-linux-gnu -fstack-protector-strong -c -x c /dev/null -o /tmp/test.o"

          if clang \
              -target aarch64-linux-gnu \
              -fstack-protector-strong \
              -c \
              -x c \
              /dev/null \
              -o /tmp/test.o \
              2>/tmp/stack-protector-direct-error.log; then

            echo
            echo "[OK] Direct Clang test passed"
            file /tmp/test.o

          else

            echo
            echo "[FAIL] Direct Clang test failed"
            cat /tmp/stack-protector-direct-error.log

          fi

          echo
          echo "========================================"
          echo "KBUILD COMPILER OPTION TEST"
          echo "========================================"

          echo
          echo "Testing cc-option through Kbuild..."

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            -f /dev/null \
            2>/dev/null \
            || true

          echo
          echo "========================================"
          echo "RUNNING DEFCONFIG"
          echo "========================================"

          rm -rf out

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            vendor/violet-perf_defconfig

          echo
          echo "========================================"
          echo "STACK PROTECTOR CONFIG"
          echo "========================================"

          grep -E \
            "CONFIG_HAVE_CC_STACKPROTECTOR|CONFIG_CC_STACKPROTECTOR" \
            out/.config \
            || true

          echo
          echo "========================================"
          echo "KBUILD PREPARE COMPILER CHECK"
          echo "========================================"

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            prepare \
            V=1 \
            2>&1 | tee /tmp/kbuild-stack-protector.log

      # ============================================================
      # 7. Final Result
      # ============================================================

      - name: Final Result
        if: always()
        run: |
          echo
          echo "========================================"
          echo "TEST COMPLETE"
          echo "========================================"

          echo
          echo "========================================"
          echo "KBUILD LOG"
          echo "========================================"

          if [ -f /tmp/kbuild-stack-protector.log ]; then
            grep -i \
              "stack\|protector\|prepare-compiler-check" \
              /tmp/kbuild-stack-protector.log \
              | tail -100 \
              || true
          fi
