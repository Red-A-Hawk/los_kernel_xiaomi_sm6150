name: Extract Clang PGO DebugFs v16

on:
  workflow_dispatch:

jobs:
  extract-pgo-patch:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT BRANCH 16
      # ============================================================
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            patch \
            curl \
            binutils \
            build-essential

      # ============================================================
      # 3. DOWNLOAD ORIGINAL PATCH 2
      # ============================================================
      - name: Download Original PGO Patch
        shell: bash
        run: |
          set -e

          URL="https://raw.githubusercontent.com/Red-A-Hawk/Patch/kernel_xiaomi_violet/0001-Add-Clang-PGO-support.patch"

          echo "============================================================"
          echo "DOWNLOAD ORIGINAL PATCH"
          echo "============================================================"

          curl -L \
            --fail \
            --retry 3 \
            -o original-pgo.patch \
            "$URL"

          test -s original-pgo.patch

          echo
          echo "[OK] Original patch downloaded"

          echo
          echo "Patch size:"
          wc -l original-pgo.patch

      # ============================================================
      # 4. CREATE WORKING TREE
      # ============================================================
      - name: Prepare Working Tree
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "PREPARE WORKING TREE"
          echo "============================================================"

          git status --short

          git reset --hard HEAD
          git clean -fdx

          echo
          echo "[OK] Working tree clean"

      # ============================================================
      # 5. EXTRACT THE FIVE NEW PGO FILES
      # ============================================================
      - name: Extract PGO Source Files
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "EXTRACT PGO SOURCE FILES"
          echo "============================================================"

          mkdir -p kernel/pgo

          extract_file() {
            local file="$1"

            echo
            echo "Extracting: $file"

            awk -v target="$file" '
              BEGIN {
                found = 0
                in_file = 0
              }

              $0 == "diff --git a/" target " b/" target {
                found = 1
                in_file = 1
                next
              }

              found && /^diff --git / {
                exit
              }

              in_file && /^\+\+\+ b\// {
                next
              }

              in_file && /^@@/ {
                next
              }

              in_file && /^\+/ {
                line = substr($0, 2)
                print line
              }
            ' original-pgo.patch > "$file"

            test -s "$file"

            echo "[OK] $file"
            wc -l "$file"
          }

          extract_file "kernel/pgo/Kconfig"
          extract_file "kernel/pgo/Makefile"
          extract_file "kernel/pgo/fs.c"
          extract_file "kernel/pgo/instrument.c"
          extract_file "kernel/pgo/pgo.h"

          echo
          echo "============================================================"
          echo "EXTRACTED FILES"
          echo "============================================================"

          find kernel/pgo -type f -maxdepth 1 -print

      # ============================================================
      # 6. REMOVE ONLY CC_IS_CLANG
      # ============================================================
      - name: Remove CC_IS_CLANG Dependency
        shell: bash
        run: |
          set -e

          FILE="kernel/pgo/Kconfig"

          echo "============================================================"
          echo "REMOVE CC_IS_CLANG"
          echo "============================================================"

          grep -n "CC_IS_CLANG" "$FILE" || true

          sed -i '/depends on CC_IS_CLANG/d' "$FILE"

          if grep -q "CC_IS_CLANG" "$FILE"; then
            echo "[ERROR] CC_IS_CLANG still exists"
            exit 1
          fi

          echo
          echo "[OK] Only CC_IS_CLANG dependency removed"

          echo
          echo "Result:"
          sed -n '1,25p' "$FILE"

      # ============================================================
      # 7. MODIFY arch/Kconfig
      # ============================================================
      - name: Modify arch/Kconfig
        shell: bash
        run: |
          set -e

          FILE="arch/Kconfig"

          echo "============================================================"
          echo "MODIFY arch/Kconfig"
          echo "============================================================"

          if grep -qF 'source "kernel/pgo/Kconfig"' "$FILE"; then
            echo "[OK] kernel/pgo/Kconfig already present"
            exit 0
          fi

          awk '
            $0 == "source \"kernel/gcov/Kconfig\"" {
              print
              print "source \"kernel/pgo/Kconfig\""
              next
            }

            {
              print
            }
          ' "$FILE" > "$FILE.tmp"

          mv "$FILE.tmp" "$FILE"

          grep -qF 'source "kernel/pgo/Kconfig"' "$FILE"

          echo "[OK] arch/Kconfig modified"

      # ============================================================
      # 8. MODIFY arch/arm64/Kconfig
      # ============================================================
      - name: Modify arch/arm64/Kconfig
        shell: bash
        run: |
          set -e

          FILE="arch/arm64/Kconfig"

          echo "============================================================"
          echo "MODIFY arch/arm64/Kconfig"
          echo "============================================================"

          if grep -qF 'select ARCH_SUPPORTS_PGO_CLANG' "$FILE"; then
            echo "[OK] ARCH_SUPPORTS_PGO_CLANG already selected"
            exit 0
          fi

          awk '
            $0 ~ /^[[:space:]]*select ARCH_SUPPORTS_THINLTO[[:space:]]*$/ {
              print
              print "\tselect ARCH_SUPPORTS_PGO_CLANG"
              next
            }

            {
              print
            }
          ' "$FILE" > "$FILE.tmp"

          mv "$FILE.tmp" "$FILE"

          grep -qF 'select ARCH_SUPPORTS_PGO_CLANG' "$FILE"

          echo "[OK] arch/arm64/Kconfig modified"

          echo
          echo "Relevant section:"
          grep -B4 -A5 -n \
            'select ARCH_SUPPORTS_PGO_CLANG' \
            "$FILE"

      # ============================================================
      # 9. MODIFY VIOLET DEFCONFIG
      # ============================================================
      - name: Modify Violet Defconfig
        shell: bash
        run: |
          set -e

          FILE="arch/arm64/configs/vendor/violet-perf_defconfig"

          echo "============================================================"
          echo "MODIFY VIOLET DEFCONFIG"
          echo "============================================================"

          if grep -qF '^CONFIG_DEBUG_FS=y' "$FILE"; then
            echo "[OK] CONFIG_DEBUG_FS already enabled"
            exit 0
          fi

          if ! grep -qF '# CONFIG_DEBUG_FS is not set' "$FILE"; then
            echo "[ERROR] Original DEBUG_FS line not found"
            exit 1
          fi

          sed -i \
            's/^# CONFIG_DEBUG_FS is not set$/CONFIG_DEBUG_FS=y/' \
            "$FILE"

          grep -qF 'CONFIG_DEBUG_FS=y' "$FILE"

          echo "[OK] CONFIG_DEBUG_FS=y"

      # ============================================================
      # 10. MODIFY VDSO MAKEFILE
      # ============================================================
      - name: Modify VDSO Makefile
        shell: bash
        run: |
          set -e

          FILE="arch/arm64/kernel/vdso/Makefile"

          echo "============================================================"
          echo "MODIFY VDSO MAKEFILE"
          echo "============================================================"

          if grep -qF 'PGO_PROFILE := n' "$FILE"; then
            echo "[OK] PGO_PROFILE already present"
            exit 0
          fi

          awk '
            $0 == "GCOV_PROFILE := n" {
              print
              print "PGO_PROFILE := n"
              next
            }

            {
              print
            }
          ' "$FILE" > "$FILE.tmp"

          mv "$FILE.tmp" "$FILE"

          grep -qF 'PGO_PROFILE := n' "$FILE"

          echo "[OK] VDSO PGO disabled"

      # ============================================================
      # 11. MODIFY vmlinux.lds.h
      # ============================================================
      - name: Modify vmlinux.lds.h
        shell: bash
        run: |
          set -e

          FILE="include/asm-generic/vmlinux.lds.h"

          echo "============================================================"
          echo "MODIFY vmlinux.lds.h"
          echo "============================================================"

          if grep -qF '#define PGO_CLANG_DATA' "$FILE"; then
            echo "[OK] PGO linker macro already exists"
          else
            awk '
              BEGIN {
                inserted_macro = 0
              }

              $0 == "#endif" && prev_bug_table {
                print

                print ""
                print "#ifdef CONFIG_PGO_CLANG"
                print "#define PGO_CLANG_DATA							\\"
                print "	__llvm_prf_data : AT(ADDR(__llvm_prf_data) - LOAD_OFFSET) {	\\"
                print "		VMLINUX_SYMBOL(__llvm_prf_data_start) = .;		\\"
                print "		*(__llvm_prf_data)					\\"
                print "		VMLINUX_SYMBOL(__llvm_prf_data_end) = .;		\\"
                print "	}								\\"
                print "	__llvm_prf_cnts : AT(ADDR(__llvm_prf_cnts) - LOAD_OFFSET) {	\\"
                print "		VMLINUX_SYMBOL(__llvm_prf_cnts_start) = .;		\\"
                print "		*(__llvm_prf_cnts)					\\"
                print "		VMLINUX_SYMBOL(__llvm_prf_cnts_end) = .;		\\"
                print "	}								\\"
                print "	__llvm_prf_names : AT(ADDR(__llvm_prf_names) - LOAD_OFFSET) {	\\"
                print "		VMLINUX_SYMBOL(__llvm_prf_names_start) = .;		\\"
                print "		*(__llvm_prf_names)					\\"
                print "		VMLINUX_SYMBOL(__llvm_prf_names_end) = .;		\\"
                print "	}								\\"
                print "	__llvm_prf_vals : AT(ADDR(__llvm_prf_vals) - LOAD_OFFSET) {	\\"
                print "		VMLINUX_SYMBOL(__llvm_prf_vals_start) = .;		\\"
                print "		*(__llvm_prf_vals)					\\"
                print "		VMLINUX_SYMBOL(__llvm_prf_vals_end) = .;		\\"
                print "	}								\\"
                print "	__llvm_prf_vnds : AT(ADDR(__llvm_prf_vnds) - LOAD_OFFSET) {	\\"
                print "		VMLINUX_SYMBOL(__llvm_prf_vnds_start) = .;		\\"
                print "		*(__llvm_prf_vnds)					\\"
                print "		VMLINUX_SYMBOL(__llvm_prf_vnds_end) = .;		\\"
                print "	}"
                print "#else"
                print "#define PGO_CLANG_DATA"
                print "#endif"
                print ""

                inserted_macro = 1
                prev_bug_table = 0

                next
              }

              $0 == "#define BUG_TABLE" {
                prev_bug_table = 1
              }

              {
                print
              }
            ' "$FILE" > "$FILE.tmp"

            mv "$FILE.tmp" "$FILE"
          fi

          # --------------------------------------------------------
          # Insert PGO_CLANG_DATA into RW_DATA_SECTION
          # --------------------------------------------------------
          if ! grep -qF '	PGO_CLANG_DATA' "$FILE"; then

            awk '
              BEGIN {
                in_rw = 0
                inserted = 0
              }

              /^#define RW_DATA_SECTION/ {
                in_rw = 1
              }

              in_rw && $0 == "\tBUG_TABLE\t\t\t\t\t\t\t\\" {
                print
                print "\tPGO_CLANG_DATA"
                inserted = 1
                in_rw = 0
                next
              }

              {
                print
              }
            ' "$FILE" > "$FILE.tmp"

            mv "$FILE.tmp" "$FILE"
          fi

          # --------------------------------------------------------
          # Fallback: match BUG_TABLE line inside RW_DATA_SECTION
          # --------------------------------------------------------
          if ! grep -qF '	PGO_CLANG_DATA' "$FILE"; then

            awk '
              BEGIN {
                in_rw = 0
                inserted = 0
              }

              /^#define RW_DATA_SECTION/ {
                in_rw = 1
              }

              in_rw && /BUG_TABLE/ {
                print
                print "\tPGO_CLANG_DATA"
                inserted = 1
                in_rw = 0
                next
              }

              {
                print
              }
            ' "$FILE" > "$FILE.tmp"

            mv "$FILE.tmp" "$FILE"
          fi

          grep -qF '#define PGO_CLANG_DATA' "$FILE"
          grep -qF 'PGO_CLANG_DATA' "$FILE"

          echo
          echo "[OK] vmlinux.lds.h modified"

          echo
          echo "PGO linker references:"
          grep -n \
            -E 'PGO_CLANG_DATA|__llvm_prf_(data|cnts|names|vals|vnds)' \
            "$FILE"

      # ============================================================
      # 12. MODIFY kernel/Makefile
      # ============================================================
      - name: Modify kernel/Makefile
        shell: bash
        run: |
          set -e

          FILE="kernel/Makefile"

          echo "============================================================"
          echo "MODIFY kernel/Makefile"
          echo "============================================================"

          if grep -qF 'obj-$(CONFIG_PGO_CLANG) += pgo/' "$FILE"; then
            echo "[OK] PGO kernel object already present"
            exit 0
          fi

          awk '
            $0 == "obj-$(CONFIG_CFI_CLANG) += cfi.o" {
              print
              print "obj-$(CONFIG_PGO_CLANG) += pgo/"
              next
            }

            {
              print
            }
          ' "$FILE" > "$FILE.tmp"

          mv "$FILE.tmp" "$FILE"

          grep -qF 'obj-$(CONFIG_PGO_CLANG) += pgo/' "$FILE"

          echo "[OK] kernel/Makefile modified"

      # ============================================================
      # 13. MODIFY TOP-LEVEL Makefile
      # ============================================================
      - name: Modify Top-level Makefile
        shell: bash
        run: |
          set -e

          FILE="Makefile"

          echo "============================================================"
          echo "MODIFY TOP-LEVEL Makefile"
          echo "============================================================"

          # --------------------------------------------------------
          # Add CFLAGS_PGO_CLANG after all: vmlinux
          # --------------------------------------------------------
          if ! grep -qF 'CFLAGS_PGO_CLANG := -fprofile-generate' "$FILE"; then

            awk '
              $0 == "all: vmlinux" {
                print
                print ""
                print "CFLAGS_PGO_CLANG := -fprofile-generate"
                print "export CFLAGS_PGO_CLANG"
                next
              }

              {
                print
              }
            ' "$FILE" > "$FILE.tmp"

            mv "$FILE.tmp" "$FILE"
          fi

          # --------------------------------------------------------
          # Add PGO compiler flags before CONFIG_CFI_CLANG
          # --------------------------------------------------------
          if ! grep -qF 'KBUILD_CFLAGS	+= -mllvm -disable-preinline -fno-if-conversion' "$FILE"; then

            awk '
              $0 == "ifdef CONFIG_CFI_CLANG" {

                print "ifdef CONFIG_PGO_CLANG"
                print "# NOTE: do not enable together with LTO_CLANG / POLLY_CLANG. Instrumented"
                print "# builds should be compiled with PGO_CLANG alone; re-enable LTO/Polly only"
                print "# for the final rebuild that consumes the collected .profdata."
                print "KBUILD_CFLAGS	+= -mllvm -disable-preinline -fno-if-conversion"
                print "endif"
                print ""

                print
                next
              }

              {
                print
              }
            ' "$FILE" > "$FILE.tmp"

            mv "$FILE.tmp" "$FILE"
          fi

          grep -qF 'CFLAGS_PGO_CLANG := -fprofile-generate' "$FILE"
          grep -qF 'export CFLAGS_PGO_CLANG' "$FILE"
          grep -qF 'KBUILD_CFLAGS	+= -mllvm -disable-preinline -fno-if-conversion' "$FILE"

          echo "[OK] Top-level Makefile modified"

          echo
          echo "Relevant PGO section:"
          grep -n -B4 -A10 \
            'CFLAGS_PGO_CLANG' \
            "$FILE"

      # ============================================================
      # 14. MODIFY scripts/Makefile.lib
      # ============================================================
      - name: Modify scripts/Makefile.lib
        shell: bash
        run: |
          set -e

          FILE="scripts/Makefile.lib"

          echo "============================================================"
          echo "MODIFY scripts/Makefile.lib"
          echo "============================================================"

          if grep -qF '$(CFLAGS_PGO_CLANG)' "$FILE"; then
            echo "[OK] PGO flags already exist"
            exit 0
          fi

          awk '
            BEGIN {
              in_gcov = 0
              inserted = 0
            }

            # Start of GCOV block.
            $0 == "ifeq ($(CONFIG_GCOV_KERNEL),y)" {
              in_gcov = 1
              print
              next
            }

            # First endif after GCOV block.
            in_gcov && $0 == "endif" {
              print

              print "#"
              print "# Enable clang'\''s PGO profiling flags for a file or directory depending on"
              print "# variables PGO_PROFILE_obj.o and PGO_PROFILE."
              print "#"
              print "ifeq ($(CONFIG_PGO_CLANG),y)"
              print "_c_flags += $(if $(patsubst n%,, \\"
              print "		$(PGO_PROFILE_$(basetarget).o)$(PGO_PROFILE)y), \\"
              print "		$(CFLAGS_PGO_CLANG))"
              print "endif"
              print ""

              inserted = 1
              in_gcov = 0
              next
            }

            {
              print
            }
          ' "$FILE" > "$FILE.tmp"

          mv "$FILE.tmp" "$FILE"

          grep -qF 'Enable clang'\''s PGO profiling flags' "$FILE"
          grep -qF 'ifeq ($(CONFIG_PGO_CLANG),y)' "$FILE"
          grep -qF '$(CFLAGS_PGO_CLANG)' "$FILE"

          echo
          echo "[OK] scripts/Makefile.lib modified"

          echo
          echo "Relevant section:"
          sed -n '95,140p' "$FILE"

      # ============================================================
      # 15. SHOW ALL CHANGES
      # ============================================================
      - name: Show Changes
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "GIT STATUS"
          echo "============================================================"

          git status --short

          echo
          echo "============================================================"
          echo "CHANGED FILES"
          echo "============================================================"

          git diff --name-status

          echo
          echo "============================================================"
          echo "DIFF STAT"
          echo "============================================================"

          git diff --stat

      # ============================================================
      # 16. VERIFY PGO FILES
      # ============================================================
      - name: Verify PGO Files
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "VERIFY PGO FILES"
          echo "============================================================"

          for f in \
            kernel/pgo/Kconfig \
            kernel/pgo/Makefile \
            kernel/pgo/fs.c \
            kernel/pgo/instrument.c \
            kernel/pgo/pgo.h
          do
            test -f "$f"
            test -s "$f"
            echo "[OK] $f"
          done

          echo
          echo "Checking Kconfig dependencies..."

          grep -qF 'depends on DEBUG_FS' kernel/pgo/Kconfig
          grep -qF 'depends on ARCH_SUPPORTS_PGO_CLANG' kernel/pgo/Kconfig

          if grep -qF 'depends on CC_IS_CLANG' kernel/pgo/Kconfig; then
            echo "[ERROR] CC_IS_CLANG still present"
            exit 1
          fi

          echo "[OK] Kconfig dependency check"

      # ============================================================
      # 17. VERIFY EXPECTED MODIFICATIONS
      # ============================================================
      - name: Verify Existing Files
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "VERIFY EXISTING FILES"
          echo "============================================================"

          grep -qF 'source "kernel/pgo/Kconfig"' \
            arch/Kconfig

          grep -qF 'select ARCH_SUPPORTS_PGO_CLANG' \
            arch/arm64/Kconfig

          grep -qF 'CONFIG_DEBUG_FS=y' \
            arch/arm64/configs/vendor/violet-perf_defconfig

          grep -qF 'PGO_PROFILE := n' \
            arch/arm64/kernel/vdso/Makefile

          grep -qF '#define PGO_CLANG_DATA' \
            include/asm-generic/vmlinux.lds.h

          grep -qF 'PGO_CLANG_DATA' \
            include/asm-generic/vmlinux.lds.h

          grep -qF 'obj-$(CONFIG_PGO_CLANG) += pgo/' \
            kernel/Makefile

          grep -qF 'CFLAGS_PGO_CLANG := -fprofile-generate' \
            Makefile

          grep -qF 'export CFLAGS_PGO_CLANG' \
            Makefile

          grep -qF 'KBUILD_CFLAGS	+= -mllvm -disable-preinline -fno-if-conversion' \
            Makefile

          grep -qF '$(CFLAGS_PGO_CLANG)' \
            scripts/Makefile.lib

          echo "[OK] All expected modifications verified"

      # ============================================================
      # 18. GENERATE REAL GIT PATCH
      # ============================================================
      - name: Generate Real Git Patch
        shell: bash
        run: |
          set -e

          PATCH="0001-Add-Clang-PGO-support-4.14-debugfs.patch"

          echo "============================================================"
          echo "GENERATE REAL GIT PATCH"
          echo "============================================================"

          git diff \
            --binary \
            --full-index \
            > "$PATCH"

          test -s "$PATCH"

          echo
          echo "[OK] Patch generated"

          echo
          echo "Patch:"
          ls -lh "$PATCH"

          echo
          echo "Lines:"
          wc -l "$PATCH"

      # ============================================================
      # 19. CHECK PATCH FORMAT
      # ============================================================
      - name: Check Patch Format
        shell: bash
        run: |
          set -e

          PATCH="0001-Add-Clang-PGO-support-4.14-debugfs.patch"

          echo "============================================================"
          echo "CHECK PATCH FORMAT"
          echo "============================================================"

          grep -qF 'diff --git a/arch/Kconfig b/arch/Kconfig' "$PATCH"
          grep -qF 'diff --git a/arch/arm64/Kconfig b/arch/arm64/Kconfig' "$PATCH"
          grep -qF 'diff --git a/kernel/pgo/Kconfig b/kernel/pgo/Kconfig' "$PATCH"
          grep -qF 'diff --git a/kernel/pgo/Makefile b/kernel/pgo/Makefile' "$PATCH"
          grep -qF 'diff --git a/kernel/pgo/fs.c b/kernel/pgo/fs.c' "$PATCH"
          grep -qF 'diff --git a/kernel/pgo/instrument.c b/kernel/pgo/instrument.c' "$PATCH"
          grep -qF 'diff --git a/kernel/pgo/pgo.h b/kernel/pgo/pgo.h' "$PATCH"

          if grep -qF 'index 0000000..0000000' "$PATCH"; then
            echo "[ERROR] Invalid zero blob index detected"
            exit 1
          fi

          echo "[OK] Patch format looks valid"

      # ============================================================
      # 20. CREATE CLEAN TEST CLONE
      # ============================================================
      - name: Test Patch Against Clean Branch 16
        shell: bash
        run: |
          set -e

          PATCH="$GITHUB_WORKSPACE/0001-Add-Clang-PGO-support-4.14-debugfs.patch"

          echo "============================================================"
          echo "CREATE CLEAN TEST CLONE"
          echo "============================================================"

          cd "$RUNNER_TEMP"

          rm -rf pgo-test

          git clone \
            --depth 1 \
            --branch 16 \
            https://github.com/Red-A-Hawk/los_kernel_xiaomi_sm6150.git \
            pgo-test

          cd pgo-test

          echo
          echo "HEAD:"
          git rev-parse HEAD

          echo
          echo "============================================================"
          echo "git apply --check"
          echo "============================================================"

          git apply --check "$PATCH"

          echo
          echo "[OK] git apply --check PASSED"

          echo
          echo "============================================================"
          echo "APPLY PATCH"
          echo "============================================================"

          git apply "$PATCH"

          echo
          echo "[OK] git apply PASSED"

          echo
          echo "============================================================"
          echo "VERIFY APPLIED TREE"
          echo "============================================================"

          test -f kernel/pgo/Kconfig
          test -f kernel/pgo/Makefile
          test -f kernel/pgo/fs.c
          test -f kernel/pgo/instrument.c
          test -f kernel/pgo/pgo.h

          grep -qF 'select ARCH_SUPPORTS_PGO_CLANG' \
            arch/arm64/Kconfig

          grep -qF 'source "kernel/pgo/Kconfig"' \
            arch/Kconfig

          grep -qF 'CONFIG_DEBUG_FS=y' \
            arch/arm64/configs/vendor/violet-perf_defconfig

          if grep -qF 'depends on CC_IS_CLANG' kernel/pgo/Kconfig; then
            echo "[ERROR] CC_IS_CLANG found in applied patch"
            exit 1
          fi

          echo
          echo "[OK] Clean-tree patch test PASSED"

      # ============================================================
      # 21. UPLOAD FINAL PATCH
      # ============================================================
      - name: Upload Final Patch
        uses: actions/upload-artifact@v4
        with:
          name: clang-pgo-4.14-debugfs-patch
          path: |
            0001-Add-Clang-PGO-support-4.14-debugfs.patch
            original-pgo.patch
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 22. UPLOAD MODIFIED FILES FOR INSPECTION
      # ============================================================
      - name: Upload Modified Sources
        uses: actions/upload-artifact@v4
        with:
          name: clang-pgo-4.14-debugfs-sources
          path: |
            kernel/pgo/
            arch/Kconfig
            arch/arm64/Kconfig
            arch/arm64/configs/vendor/violet-perf_defconfig
            arch/arm64/kernel/vdso/Makefile
            include/asm-generic/vmlinux.lds.h
            kernel/Makefile
            Makefile
            scripts/Makefile.lib
          if-no-files-found: error
          retention-days: 30
