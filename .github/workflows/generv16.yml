name: Extract Clang PGO DebugFS v16

on:
  workflow_dispatch:

jobs:
  extract-pgo-patch:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT BRANCH 16
      # ============================================================
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            patch \
            curl \
            binutils \
            build-essential

      # ============================================================
      # 3. DOWNLOAD ORIGINAL PATCH 2
      # ============================================================
      - name: Download Original PGO Patch
        shell: bash
        run: |
          set -e

          PATCH="$GITHUB_WORKSPACE/original-pgo.patch"

          URL="https://raw.githubusercontent.com/Red-A-Hawk/Patch/kernel_xiaomi_violet/0001-Add-Clang-PGO-support.patch"

          echo "============================================================"
          echo "DOWNLOAD ORIGINAL PATCH"
          echo "============================================================"

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            -o "$PATCH" \
            "$URL"

          test -f "$PATCH"
          test -s "$PATCH"

          echo
          echo "[OK] Patch downloaded"

          echo
          echo "Path:"
          echo "$PATCH"

          echo
          echo "Size:"
          ls -lh "$PATCH"

          echo
          echo "Lines:"
          wc -l "$PATCH"

      # ============================================================
      # 4. VERIFY ORIGINAL PATCH
      # ============================================================
      - name: Verify Original PGO Patch
        shell: bash
        run: |
          set -e

          PATCH="$GITHUB_WORKSPACE/original-pgo.patch"

          echo "============================================================"
          echo "VERIFY ORIGINAL PATCH"
          echo "============================================================"

          test -f "$PATCH"
          test -s "$PATCH"

          for file in \
            "kernel/pgo/Kconfig" \
            "kernel/pgo/Makefile" \
            "kernel/pgo/fs.c" \
            "kernel/pgo/instrument.c" \
            "kernel/pgo/pgo.h"
          do
            if ! grep -qF "diff --git a/$file b/$file" "$PATCH"; then
              echo "[ERROR] Missing: $file"
              exit 1
            fi

            echo "[OK] Found: $file"
          done

          echo
          echo "[OK] Original patch verified"

      # ============================================================
      # 5. RESET WORKING TREE
      # ============================================================
      - name: Prepare Working Tree
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "PREPARE WORKING TREE"
          echo "============================================================"

          git reset --hard HEAD
          git clean -fdx

          echo
          echo "HEAD:"
          git rev-parse HEAD

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "[OK] Working tree clean"

      # ============================================================
      # 6. EXTRACT FIVE PGO FILES
      # ============================================================
      - name: Extract PGO Source Files
        shell: bash
        run: |
          set -e

          PATCH="$GITHUB_WORKSPACE/original-pgo.patch"

          echo "============================================================"
          echo "EXTRACT PGO SOURCE FILES"
          echo "============================================================"

          test -f "$PATCH"
          test -s "$PATCH"

          mkdir -p kernel/pgo

          extract_file() {
            local file="$1"

            echo
            echo "------------------------------------------------------------"
            echo "Extracting: $file"
            echo "------------------------------------------------------------"

            awk -v target="$file" '
              BEGIN {
                found = 0
              }

              $0 == "diff --git a/" target " b/" target {
                found = 1
                next
              }

              found && /^diff --git / {
                exit
              }

              found && /^--- / {
                next
              }

              found && /^\+\+\+ / {
                next
              }

              found && /^@@/ {
                next
              }

              found && /^\+/ {
                print substr($0, 2)
              }
            ' "$PATCH" > "$GITHUB_WORKSPACE/$file"

            test -f "$GITHUB_WORKSPACE/$file"
            test -s "$GITHUB_WORKSPACE/$file"

            echo "[OK] $file"

            echo "Lines:"
            wc -l "$GITHUB_WORKSPACE/$file"
          }

          extract_file "kernel/pgo/Kconfig"
          extract_file "kernel/pgo/Makefile"
          extract_file "kernel/pgo/fs.c"
          extract_file "kernel/pgo/instrument.c"
          extract_file "kernel/pgo/pgo.h"

          echo
          echo "============================================================"
          echo "EXTRACTED FILES"
          echo "============================================================"

          ls -lh kernel/pgo/

      # ============================================================
      # 7. REMOVE ONLY CC_IS_CLANG
      # ============================================================
      - name: Remove CC_IS_CLANG Dependency
        shell: bash
        run: |
          set -e

          FILE="$GITHUB_WORKSPACE/kernel/pgo/Kconfig"

          echo "============================================================"
          echo "REMOVE CC_IS_CLANG"
          echo "============================================================"

          echo "Before:"
          grep -n "CC_IS_CLANG" "$FILE" || true

          sed -i '/^[[:space:]]*depends on CC_IS_CLANG[[:space:]]*$/d' "$FILE"

          if grep -qF 'depends on CC_IS_CLANG' "$FILE"; then
            echo "[ERROR] CC_IS_CLANG still exists"
            exit 1
          fi

          echo
          echo "[OK] CC_IS_CLANG removed"

          echo
          echo "Kconfig:"
          sed -n '1,35p' "$FILE"

      # ============================================================
      # 8. MODIFY arch/Kconfig
      # ============================================================
      - name: Modify arch/Kconfig
        shell: bash
        run: |
          set -e

          FILE="arch/Kconfig"

          echo "============================================================"
          echo "MODIFY arch/Kconfig"
          echo "============================================================"

          if grep -qF 'source "kernel/pgo/Kconfig"' "$FILE"; then
            echo "[OK] PGO Kconfig source already exists"
            exit 0
          fi

          awk '
            $0 == "source \"kernel/gcov/Kconfig\"" {
              print
              print "source \"kernel/pgo/Kconfig\""
              next
            }

            {
              print
            }
          ' "$FILE" > "$FILE.tmp"

          mv "$FILE.tmp" "$FILE"

          grep -qF 'source "kernel/pgo/Kconfig"' "$FILE"

          echo "[OK] arch/Kconfig modified"

      # ============================================================
      # 9. MODIFY arch/arm64/Kconfig
      # ============================================================
      - name: Modify arch/arm64/Kconfig
        shell: bash
        run: |
          set -e

          FILE="arch/arm64/Kconfig"

          echo "============================================================"
          echo "MODIFY arch/arm64/Kconfig"
          echo "============================================================"

          if grep -qF 'select ARCH_SUPPORTS_PGO_CLANG' "$FILE"; then
            echo "[OK] ARCH_SUPPORTS_PGO_CLANG already selected"
            exit 0
          fi

          awk '
            $0 ~ /^[[:space:]]*select ARCH_SUPPORTS_THINLTO[[:space:]]*$/ {
              print
              print "\tselect ARCH_SUPPORTS_PGO_CLANG"
              next
            }

            {
              print
            }
          ' "$FILE" > "$FILE.tmp"

          mv "$FILE.tmp" "$FILE"

          grep -qF 'select ARCH_SUPPORTS_PGO_CLANG' "$FILE"

          echo "[OK] arch/arm64/Kconfig modified"

          echo
          echo "Relevant section:"
          grep -B5 -A5 \
            -n 'select ARCH_SUPPORTS_PGO_CLANG' \
            "$FILE"

      # ============================================================
      # 10. MODIFY VIOLET DEFCONFIG
      # ============================================================
      - name: Modify Violet Defconfig
        shell: bash
        run: |
          set -e

          FILE="arch/arm64/configs/vendor/violet-perf_defconfig"

          echo "============================================================"
          echo "MODIFY VIOLET DEFCONFIG"
          echo "============================================================"

          if grep -qF '^CONFIG_DEBUG_FS=y' "$FILE"; then
            echo "[OK] CONFIG_DEBUG_FS already enabled"
            exit 0
          fi

          if ! grep -qF '# CONFIG_DEBUG_FS is not set' "$FILE"; then
            echo "[ERROR] Original DEBUG_FS line not found"
            exit 1
          fi

          sed -i \
            's/^# CONFIG_DEBUG_FS is not set$/CONFIG_DEBUG_FS=y/' \
            "$FILE"

          grep -qF 'CONFIG_DEBUG_FS=y' "$FILE"

          echo "[OK] CONFIG_DEBUG_FS=y"

      # ============================================================
      # 11. MODIFY VDSO MAKEFILE
      # ============================================================
      - name: Modify VDSO Makefile
        shell: bash
        run: |
          set -e

          FILE="arch/arm64/kernel/vdso/Makefile"

          echo "============================================================"
          echo "MODIFY VDSO MAKEFILE"
          echo "============================================================"

          if grep -qF 'PGO_PROFILE := n' "$FILE"; then
            echo "[OK] PGO_PROFILE already present"
            exit 0
          fi

          if ! grep -qF 'GCOV_PROFILE := n' "$FILE"; then
            echo "[ERROR] GCOV_PROFILE marker not found"
            exit 1
          fi

          awk '
            $0 == "GCOV_PROFILE := n" {
              print
              print "PGO_PROFILE := n"
              next
            }

            {
              print
            }
          ' "$FILE" > "$FILE.tmp"

          mv "$FILE.tmp" "$FILE"

          grep -qF 'PGO_PROFILE := n' "$FILE"

          echo "[OK] VDSO PGO disabled"

      # ============================================================
      # 12. MODIFY vmlinux.lds.h
      # ============================================================
      - name: Modify vmlinux.lds.h
        shell: bash
        run: |
          set -e

          FILE="include/asm-generic/vmlinux.lds.h"

          echo "============================================================"
          echo "MODIFY vmlinux.lds.h"
          echo "============================================================"

          # --------------------------------------------------------
          # Add PGO_CLANG_DATA definition
          # --------------------------------------------------------
          if ! grep -qF '#define PGO_CLANG_DATA' "$FILE"; then

            awk '
              BEGIN {
                inserted = 0
              }

              $0 == "#define BUG_TABLE" {
                in_bug = 1
                print
                next
              }

              in_bug && $0 == "#endif" && inserted == 0 {

                print

                print ""
                print "#ifdef CONFIG_PGO_CLANG"
                print "#define PGO_CLANG_DATA                                         \\"
                print "	__llvm_prf_data : AT(ADDR(__llvm_prf_data) - LOAD_OFFSET) { \\"
                print "		VMLINUX_SYMBOL(__llvm_prf_data_start) = .;            \\"
                print "		*(__llvm_prf_data)                                    \\"
                print "		VMLINUX_SYMBOL(__llvm_prf_data_end) = .;              \\"
                print "	}                                                       \\"
                print "	__llvm_prf_cnts : AT(ADDR(__llvm_prf_cnts) - LOAD_OFFSET) { \\"
                print "		VMLINUX_SYMBOL(__llvm_prf_cnts_start) = .;            \\"
                print "		*(__llvm_prf_cnts)                                    \\"
                print "		VMLINUX_SYMBOL(__llvm_prf_cnts_end) = .;              \\"
                print "	}                                                       \\"
                print "	__llvm_prf_names : AT(ADDR(__llvm_prf_names) - LOAD_OFFSET) { \\"
                print "		VMLINUX_SYMBOL(__llvm_prf_names_start) = .;           \\"
                print "		*(__llvm_prf_names)                                   \\"
                print "		VMLINUX_SYMBOL(__llvm_prf_names_end) = .;             \\"
                print "	}                                                       \\"
                print "	__llvm_prf_vals : AT(ADDR(__llvm_prf_vals) - LOAD_OFFSET) { \\"
                print "		VMLINUX_SYMBOL(__llvm_prf_vals_start) = .;            \\"
                print "		*(__llvm_prf_vals)                                    \\"
                print "		VMLINUX_SYMBOL(__llvm_prf_vals_end) = .;              \\"
                print "	}                                                       \\"
                print "	__llvm_prf_vnds : AT(ADDR(__llvm_prf_vnds) - LOAD_OFFSET) { \\"
                print "		VMLINUX_SYMBOL(__llvm_prf_vnds_start) = .;            \\"
                print "		*(__llvm_prf_vnds)                                    \\"
                print "		VMLINUX_SYMBOL(__llvm_prf_vnds_end) = .;              \\"
                print "	}"
                print "#else"
                print "#define PGO_CLANG_DATA"
                print "#endif"
                print ""

                inserted = 1
                in_bug = 0

                next
              }

              {
                print
              }
            ' "$FILE" > "$FILE.tmp"

            mv "$FILE.tmp" "$FILE"
          fi

          # --------------------------------------------------------
          # Insert PGO_CLANG_DATA into RW_DATA_SECTION
          # --------------------------------------------------------
          if ! grep -qF 'PGO_CLANG_DATA' "$FILE"; then

            awk '
              BEGIN {
                in_rw = 0
                inserted = 0
              }

              /^#define RW_DATA_SECTION/ {
                in_rw = 1
              }

              in_rw && /BUG_TABLE/ && inserted == 0 {
                print
                print "\tPGO_CLANG_DATA"
                inserted = 1
                next
              }

              {
                print
              }
            ' "$FILE" > "$FILE.tmp"

            mv "$FILE.tmp" "$FILE"
          fi

          grep -qF '#define PGO_CLANG_DATA' "$FILE"
          grep -qF 'PGO_CLANG_DATA' "$FILE"

          echo
          echo "[OK] vmlinux.lds.h modified"

          echo
          echo "PGO linker entries:"
          grep -n \
            -E 'PGO_CLANG_DATA|__llvm_prf_(data|cnts|names|vals|vnds)' \
            "$FILE" || true

      # ============================================================
      # 13. MODIFY kernel/Makefile
      # ============================================================
      - name: Modify kernel/Makefile
        shell: bash
        run: |
          set -e

          FILE="kernel/Makefile"

          echo "============================================================"
          echo "MODIFY kernel/Makefile"
          echo "============================================================"

          if grep -qF 'obj-$(CONFIG_PGO_CLANG) += pgo/' "$FILE"; then
            echo "[OK] PGO object already present"
            exit 0
          fi

          if ! grep -qF 'obj-$(CONFIG_CFI_CLANG) += cfi.o' "$FILE"; then
            echo "[ERROR] CFI marker not found"
            exit 1
          fi

          awk '
            $0 == "obj-$(CONFIG_CFI_CLANG) += cfi.o" {
              print
              print "obj-$(CONFIG_PGO_CLANG) += pgo/"
              next
            }

            {
              print
            }
          ' "$FILE" > "$FILE.tmp"

          mv "$FILE.tmp" "$FILE"

          grep -qF 'obj-$(CONFIG_PGO_CLANG) += pgo/' "$FILE"

          echo "[OK] kernel/Makefile modified"

      # ============================================================
      # 14. MODIFY TOP-LEVEL Makefile
      # ============================================================
      - name: Modify Top-level Makefile
        shell: bash
        run: |
          set -e

          FILE="Makefile"

          echo "============================================================"
          echo "MODIFY TOP-LEVEL Makefile"
          echo "============================================================"

          # --------------------------------------------------------
          # CFLAGS_PGO_CLANG
          # --------------------------------------------------------
          if ! grep -qF 'CFLAGS_PGO_CLANG := -fprofile-generate' "$FILE"; then

            if ! grep -qF 'all: vmlinux' "$FILE"; then
              echo "[ERROR] all: vmlinux marker not found"
              exit 1
            fi

            awk '
              $0 == "all: vmlinux" {
                print
                print ""
                print "CFLAGS_PGO_CLANG := -fprofile-generate"
                print "export CFLAGS_PGO_CLANG"
                next
              }

              {
                print
              }
            ' "$FILE" > "$FILE.tmp"

            mv "$FILE.tmp" "$FILE"
          fi

          # --------------------------------------------------------
          # PGO compiler flags
          # --------------------------------------------------------
          if ! grep -qF 'KBUILD_CFLAGS	+= -mllvm -disable-preinline -fno-if-conversion' "$FILE"; then

            if ! grep -qF 'ifdef CONFIG_CFI_CLANG' "$FILE"; then
              echo "[ERROR] CONFIG_CFI_CLANG marker not found"
              exit 1
            fi

            awk '
              $0 == "ifdef CONFIG_CFI_CLANG" {

                print "ifdef CONFIG_PGO_CLANG"
                print "# NOTE: do not enable together with LTO_CLANG / POLLY_CLANG. Instrumented"
                print "# builds should be compiled with PGO_CLANG alone; re-enable LTO/Polly only"
                print "# for the final rebuild that consumes the collected .profdata."
                print "KBUILD_CFLAGS	+= -mllvm -disable-preinline -fno-if-conversion"
                print "endif"
                print ""

                print
                next
              }

              {
                print
              }
            ' "$FILE" > "$FILE.tmp"

            mv "$FILE.tmp" "$FILE"
          fi

          grep -qF 'CFLAGS_PGO_CLANG := -fprofile-generate' "$FILE"
          grep -qF 'export CFLAGS_PGO_CLANG' "$FILE"
          grep -qF 'KBUILD_CFLAGS	+= -mllvm -disable-preinline -fno-if-conversion' "$FILE"

          echo
          echo "[OK] Top-level Makefile modified"

          echo
          echo "Relevant section:"
          grep -n -B5 -A12 \
            'CFLAGS_PGO_CLANG' \
            "$FILE"

      # ============================================================
      # 15. MODIFY scripts/Makefile.lib
      # ============================================================
      - name: Modify scripts/Makefile.lib
        shell: bash
        run: |
          set -e

          FILE="scripts/Makefile.lib"

          echo "============================================================"
          echo "MODIFY scripts/Makefile.lib"
          echo "============================================================"

          if grep -qF '$(CFLAGS_PGO_CLANG)' "$FILE"; then
            echo "[OK] PGO flags already exist"
            exit 0
          fi

          if ! grep -qF 'ifeq ($(CONFIG_GCOV_KERNEL),y)' "$FILE"; then
            echo "[ERROR] GCOV block not found"
            exit 1
          fi

          awk '
            BEGIN {
              in_gcov = 0
              inserted = 0
            }

            # Start GCOV block.
            $0 == "ifeq ($(CONFIG_GCOV_KERNEL),y)" {
              in_gcov = 1
              print
              next
            }

            # End of GCOV block.
            in_gcov && $0 == "endif" && inserted == 0 {

              print

              print "#"
              print "# Enable clang'\''s PGO profiling flags for a file or directory depending on"
              print "# variables PGO_PROFILE_obj.o and PGO_PROFILE."
              print "#"
              print "ifeq ($(CONFIG_PGO_CLANG),y)"
              print "_c_flags += $(if $(patsubst n%,, \\"
              print "		$(PGO_PROFILE_$(basetarget).o)$(PGO_PROFILE)y), \\"
              print "		$(CFLAGS_PGO_CLANG))"
              print "endif"
              print ""

              inserted = 1
              in_gcov = 0

              next
            }

            {
              print
            }
          ' "$FILE" > "$FILE.tmp"

          mv "$FILE.tmp" "$FILE"

          grep -qF 'Enable clang'\''s PGO profiling flags' "$FILE"
          grep -qF 'ifeq ($(CONFIG_PGO_CLANG),y)' "$FILE"
          grep -qF '$(CFLAGS_PGO_CLANG)' "$FILE"

          echo
          echo "[OK] scripts/Makefile.lib modified"

          echo
          echo "Relevant section:"
          sed -n '95,145p' "$FILE"

      # ============================================================
      # 16. VERIFY ALL MODIFICATIONS
      # ============================================================
      - name: Verify Modified Tree
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "VERIFY MODIFIED TREE"
          echo "============================================================"

          # --------------------------------------------------------
          # PGO files
          # --------------------------------------------------------
          for file in \
            kernel/pgo/Kconfig \
            kernel/pgo/Makefile \
            kernel/pgo/fs.c \
            kernel/pgo/instrument.c \
            kernel/pgo/pgo.h
          do
            test -f "$file"
            test -s "$file"

            echo "[OK] $file"
          done

          # --------------------------------------------------------
          # Kconfig
          # --------------------------------------------------------
          grep -qF 'source "kernel/pgo/Kconfig"' \
            arch/Kconfig

          grep -qF 'select ARCH_SUPPORTS_PGO_CLANG' \
            arch/arm64/Kconfig

          grep -qF 'depends on DEBUG_FS' \
            kernel/pgo/Kconfig

          grep -qF 'depends on ARCH_SUPPORTS_PGO_CLANG' \
            kernel/pgo/Kconfig

          if grep -qF 'depends on CC_IS_CLANG' kernel/pgo/Kconfig; then
            echo "[ERROR] CC_IS_CLANG still exists"
            exit 1
          fi

          # --------------------------------------------------------
          # Defconfig
          # --------------------------------------------------------
          grep -qF 'CONFIG_DEBUG_FS=y' \
            arch/arm64/configs/vendor/violet-perf_defconfig

          # --------------------------------------------------------
          # VDSO
          # --------------------------------------------------------
          grep -qF 'PGO_PROFILE := n' \
            arch/arm64/kernel/vdso/Makefile

          # --------------------------------------------------------
          # Linker
          # --------------------------------------------------------
          grep -qF '#define PGO_CLANG_DATA' \
            include/asm-generic/vmlinux.lds.h

          grep -qF 'PGO_CLANG_DATA' \
            include/asm-generic/vmlinux.lds.h

          # --------------------------------------------------------
          # Kernel Makefile
          # --------------------------------------------------------
          grep -qF 'obj-$(CONFIG_PGO_CLANG) += pgo/' \
            kernel/Makefile

          # --------------------------------------------------------
          # Top-level Makefile
          # --------------------------------------------------------
          grep -qF 'CFLAGS_PGO_CLANG := -fprofile-generate' \
            Makefile

          grep -qF 'export CFLAGS_PGO_CLANG' \
            Makefile

          grep -qF 'KBUILD_CFLAGS	+= -mllvm -disable-preinline -fno-if-conversion' \
            Makefile

          # --------------------------------------------------------
          # scripts/Makefile.lib
          # --------------------------------------------------------
          grep -qF 'ifeq ($(CONFIG_PGO_CLANG),y)' \
            scripts/Makefile.lib

          grep -qF '$(CFLAGS_PGO_CLANG)' \
            scripts/Makefile.lib

          echo
          echo "============================================================"
          echo "[OK] ALL MODIFICATIONS VERIFIED"
          echo "============================================================"

      # ============================================================
      # 17. SHOW GIT STATUS
      # ============================================================
      - name: Show Git Status
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "GIT STATUS"
          echo "============================================================"

          git status --short

          echo
          echo "============================================================"
          echo "CHANGED FILES"
          echo "============================================================"

          git diff --name-status

          echo
          echo "============================================================"
          echo "DIFF STAT"
          echo "============================================================"

          git diff --stat

      # ============================================================
      # 18. GENERATE REAL GIT PATCH
      # ============================================================
      - name: Generate Real Git Patch
        shell: bash
        run: |
          set -e

          PATCH="$GITHUB_WORKSPACE/0001-Add-Clang-PGO-support-4.14-debugfs.patch"

          echo "============================================================"
          echo "GENERATE REAL GIT PATCH"
          echo "============================================================"

          git diff \
            --binary \
            --full-index \
            > "$PATCH"

          test -f "$PATCH"
          test -s "$PATCH"

          echo
          echo "[OK] Real Git patch generated"

          echo
          echo "Patch:"
          ls -lh "$PATCH"

          echo
          echo "Lines:"
          wc -l "$PATCH"

      # ============================================================
      # 19. VERIFY PATCH CONTENT
      # ============================================================
      - name: Verify Generated Patch
        shell: bash
        run: |
          set -e

          PATCH="$GITHUB_WORKSPACE/0001-Add-Clang-PGO-support-4.14-debugfs.patch"

          echo "============================================================"
          echo "VERIFY GENERATED PATCH"
          echo "============================================================"

          test -f "$PATCH"
          test -s "$PATCH"

          # --------------------------------------------------------
          # Required files
          # --------------------------------------------------------
          for file in \
            "arch/Kconfig" \
            "arch/arm64/Kconfig" \
            "arch/arm64/configs/vendor/violet-perf_defconfig" \
            "arch/arm64/kernel/vdso/Makefile" \
            "include/asm-generic/vmlinux.lds.h" \
            "kernel/Makefile" \
            "kernel/pgo/Kconfig" \
            "kernel/pgo/Makefile" \
            "kernel/pgo/fs.c" \
            "kernel/pgo/instrument.c" \
            "kernel/pgo/pgo.h" \
            "Makefile" \
            "scripts/Makefile.lib"
          do
            if ! grep -qF "diff --git a/$file b/$file" "$PATCH"; then
              echo "[ERROR] Missing diff for: $file"
              exit 1
            fi

            echo "[OK] $file"
          done

          # --------------------------------------------------------
          # No bogus zero index
          # --------------------------------------------------------
          if grep -qF 'index 0000000..0000000' "$PATCH"; then
            echo "[ERROR] Bogus zero blob index found"
            exit 1
          fi

          # --------------------------------------------------------
          # CC_IS_CLANG must not exist
          # --------------------------------------------------------
          if grep -qF 'depends on CC_IS_CLANG' "$PATCH"; then
            echo "[ERROR] CC_IS_CLANG still appears in generated patch"
            exit 1
          fi

          echo
          echo "[OK] Generated patch content verified"

      # ============================================================
      # 20. CREATE CLEAN CLONE
      # ============================================================
      - name: Clone Clean Branch 16
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "CLONE CLEAN BRANCH 16"
          echo "============================================================"

          rm -rf "$RUNNER_TEMP/pgo-test"

          git clone \
            --depth 1 \
            --branch 16 \
            https://github.com/Red-A-Hawk/los_kernel_xiaomi_sm6150.git \
            "$RUNNER_TEMP/pgo-test"

          cd "$RUNNER_TEMP/pgo-test"

          echo
          echo "Clean clone HEAD:"
          git rev-parse HEAD

          echo
          echo "[OK] Clean branch cloned"

      # ============================================================
      # 21. TEST PATCH WITH git apply --check
      # ============================================================
      - name: Test Patch With git apply --check
        shell: bash
        run: |
          set -e

          PATCH="$GITHUB_WORKSPACE/0001-Add-Clang-PGO-support-4.14-debugfs.patch"

          cd "$RUNNER_TEMP/pgo-test"

          echo "============================================================"
          echo "git apply --check"
          echo "============================================================"

          git apply --check "$PATCH"

          echo
          echo "============================================================"
          echo "[OK] git apply --check PASSED"
          echo "============================================================"

      # ============================================================
      # 22. APPLY PATCH TO CLEAN TREE
      # ============================================================
      - name: Apply Patch To Clean Tree
        shell: bash
        run: |
          set -e

          PATCH="$GITHUB_WORKSPACE/0001-Add-Clang-PGO-support-4.14-debugfs.patch"

          cd "$RUNNER_TEMP/pgo-test"

          echo "============================================================"
          echo "APPLY PATCH"
          echo "============================================================"

          git apply "$PATCH"

          echo
          echo "[OK] Patch applied successfully"

      # ============================================================
      # 23. VERIFY CLEAN TREE AFTER PATCH
      # ============================================================
      - name: Verify Applied Patch
        shell: bash
        run: |
          set -e

          cd "$RUNNER_TEMP/pgo-test"

          echo "============================================================"
          echo "VERIFY APPLIED PATCH"
          echo "============================================================"

          for file in \
            kernel/pgo/Kconfig \
            kernel/pgo/Makefile \
            kernel/pgo/fs.c \
            kernel/pgo/instrument.c \
            kernel/pgo/pgo.h
          do
            test -f "$file"
            test -s "$file"

            echo "[OK] $file"
          done

          grep -qF 'source "kernel/pgo/Kconfig"' \
            arch/Kconfig

          grep -qF 'select ARCH_SUPPORTS_PGO_CLANG' \
            arch/arm64/Kconfig

          grep -qF 'CONFIG_DEBUG_FS=y' \
            arch/arm64/configs/vendor/violet-perf_defconfig

          grep -qF 'PGO_PROFILE := n' \
            arch/arm64/kernel/vdso/Makefile

          grep -qF 'PGO_CLANG_DATA' \
            include/asm-generic/vmlinux.lds.h

          grep -qF 'obj-$(CONFIG_PGO_CLANG) += pgo/' \
            kernel/Makefile

          grep -qF 'CFLAGS_PGO_CLANG := -fprofile-generate' \
            Makefile

          grep -qF '$(CFLAGS_PGO_CLANG)' \
            scripts/Makefile.lib

          if grep -qF 'depends on CC_IS_CLANG' kernel/pgo/Kconfig; then
            echo "[ERROR] CC_IS_CLANG found after applying patch"
            exit 1
          fi

          echo
          echo "============================================================"
          echo "[OK] CLEAN TREE PATCH TEST PASSED"
          echo "============================================================"

      # ============================================================
      # 24. SHOW FINAL PATCH STATISTICS
      # ============================================================
      - name: Final Patch Statistics
        shell: bash
        run: |
          set -e

          PATCH="$GITHUB_WORKSPACE/0001-Add-Clang-PGO-support-4.14-debugfs.patch"

          echo "============================================================"
          echo "FINAL PATCH"
          echo "============================================================"

          ls -lh "$PATCH"

          echo
          echo "Lines:"
          wc -l "$PATCH"

          echo
          echo "Files:"
          grep '^diff --git ' "$PATCH"

          echo
          echo "============================================================"
          echo "PATCH READY"
          echo "============================================================"

      # ============================================================
      # 25. UPLOAD FINAL PATCH
      # ============================================================
      - name: Upload Final Patch
        uses: actions/upload-artifact@v4
        with:
          name: clang-pgo-4.14-debugfs-patch
          path: |
            0001-Add-Clang-PGO-support-4.14-debugfs.patch
            original-pgo.patch
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 26. UPLOAD MODIFIED SOURCES
      # ============================================================
      - name: Upload Modified Sources
        uses: actions/upload-artifact@v4
        with:
          name: clang-pgo-4.14-debugfs-sources
          path: |
            kernel/pgo/
            arch/Kconfig
            arch/arm64/Kconfig
            arch/arm64/configs/vendor/violet-perf_defconfig
            arch/arm64/kernel/vdso/Makefile
            include/asm-generic/vmlinux.lds.h
            kernel/Makefile
            Makefile
            scripts/Makefile.lib
          if-no-files-found: error
          retention-days: 30
