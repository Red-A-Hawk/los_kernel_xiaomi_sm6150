name: Generate Full VIOLET Defconfig

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install ARM64 Kconfig build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            make \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            device-tree-compiler

      - name: Configure ARM64 compiler
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "========================================"
          echo "ARM64 TOOLCHAIN"
          echo "========================================"

          echo "ARCH=$ARCH"
          echo "CROSS_COMPILE=$CROSS_COMPILE"

          "$CROSS_COMPILE"gcc --version | head -n 1
          "$CROSS_COMPILE"ld --version | head -n 1

          test -x "$(command -v aarch64-linux-gnu-gcc)"
          test -x "$(command -v aarch64-linux-gnu-ld)"

          echo
          echo "ARM64 COMPILER: READY"

      - name: Verify VIOLET inputs
        run: |
          set -e

          test -f arch/arm64/configs/vendor/sdmsteppe-perf_defconfig
          test -f arch/arm64/configs/vendor/violet.config
          test -f Kconfig
          test -f scripts/kconfig/merge_config.sh

          echo "========================================"
          echo "INPUT CONFIGURATIONS"
          echo "========================================"

          echo
          echo "BASE:"
          echo "arch/arm64/configs/vendor/sdmsteppe-perf_defconfig"

          echo
          echo "VIOLET:"
          echo "arch/arm64/configs/vendor/violet.config"

          echo
          echo "KCONFIG:"
          echo "Kconfig"

          echo
          echo "ALL INPUTS: FOUND"

      - name: Prepare output
        run: |
          set -e

          rm -rf out artifact
          mkdir -p out artifact

      - name: Generate ARM64 base configuration
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "========================================"
          echo "GENERATING BASE CONFIGURATION"
          echo "========================================"

          make O=out vendor/sdmsteppe-perf_defconfig

          test -s out/.config

          cp out/.config out/base.config

          echo
          echo "BASE DEFCONFIG: GENERATED"
          echo "Lines:"
          wc -l < out/base.config

      - name: Save requested VIOLET fragment
        run: |
          set -e

          cp arch/arm64/configs/vendor/violet.config out/violet.requested.config

          echo "========================================"
          echo "VIOLET REQUEST"
          echo "========================================"

          grep -E \
            '^(CONFIG_[A-Za-z0-9_]+)=|^# CONFIG_[A-Za-z0-9_]+ is not set$' \
            out/violet.requested.config > out/violet.requested.symbols

          echo "Requested symbols:"
          wc -l < out/violet.requested.symbols

      - name: Merge sdmsteppe + VIOLET
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "========================================"
          echo "KCONFIG MERGE"
          echo "========================================"

          echo "Merging:"
          echo "  sdmsteppe-perf_defconfig"
          echo "  + violet.config"
          echo "  + Kconfig"

          ./scripts/kconfig/merge_config.sh \
            -O out \
            out/base.config \
            arch/arm64/configs/vendor/violet.config

          test -s out/.config

          cp out/.config out/after-merge.config

          echo
          echo "MERGE COMPLETED"

      - name: Resolve configuration through Kconfig
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "========================================"
          echo "KCONFIG RESOLUTION"
          echo "========================================"

          make O=out olddefconfig

          test -s out/.config

          cp out/.config out/final.config

          echo
          echo "KCONFIG RESOLUTION: COMPLETED"

      - name: Verify every VIOLET request
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING VIOLET REQUESTS"
          echo "========================================"

          failed=0
          total=0
          changed=0

          get_value() {
            symbol="$1"

            grep -E \
              "^${symbol}=|^# ${symbol} is not set$" \
              out/final.config \
              | head -n 1 || true
          }

          while IFS= read -r line; do

            case "$line" in

              CONFIG_*=*)
                symbol="${line%%=*}"
                expected="$line"
                ;;

              \#\ CONFIG_*\ is\ not\ set)
                symbol="$(printf '%s\n' "$line" \
                  | sed 's/^# //; s/ is not set$//')"
                expected="$line"
                ;;

              *)
                continue
                ;;

            esac

            total=$((total + 1))

            actual="$(get_value "$symbol")"

            if [ "$actual" = "$expected" ]; then
              echo "OK      $expected"
            else
              echo "KCONFIG $expected"
              echo "        -> $actual"
              changed=$((changed + 1))
            fi

          done < out/violet.requested.symbols

          echo
          echo "========================================"
          echo "VIOLET KCONFIG RESULT"
          echo "========================================"

          echo "Requested symbols : $total"
          echo "Changed by Kconfig: $changed"

          echo

          if [ "$changed" -ne 0 ]; then
            echo "NOTE:"
            echo "Some VIOLET requests were resolved differently by Kconfig."
            echo "This is a Kconfig dependency/result, not a merge failure."
          else
            echo "ALL VIOLET REQUESTS SURVIVED KCONFIG"
          fi

      - name: Generate clean Full VIOLET defconfig
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "========================================"
          echo "GENERATING FULL VIOLET DEFCONFIG"
          echo "========================================"

          make O=out savedefconfig

          test -s out/defconfig

          cp out/defconfig artifact/violet_full_defconfig

          echo
          echo "FULL VIOLET DEFCONFIG GENERATED"
          echo
          echo "File:"
          echo "artifact/violet_full_defconfig"

          echo
          echo "Lines:"
          wc -l < artifact/violet_full_defconfig

      - name: Final Kconfig integrity test
        run: |
          set -e

          echo "========================================"
          echo "FINAL INTEGRITY TEST"
          echo "========================================"

          test -s artifact/violet_full_defconfig

          echo "Re-loading generated VIOLET defconfig..."

          rm -rf verify
          mkdir -p verify

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          cp artifact/violet_full_defconfig verify/defconfig

          make O=verify defconfig

          test -s verify/.config

          if ! cmp -s out/final.config verify/.config; then
            echo
            echo "WARNING:"
            echo "Generated defconfig does not reproduce byte-identical .config."
            echo "This can happen because defconfig is a minimal representation."
          else
            echo
            echo "REPRODUCIBILITY: EXACT"
          fi

          echo
          echo "========================================"
          echo "PIPELINE RESULT"
          echo "========================================"

          echo "sdmsteppe-perf_defconfig : OK"
          echo "violet.config             : OK"
          echo "Kconfig merge             : OK"
          echo "Kconfig resolution        : OK"
          echo "Full VIOLET defconfig     : OK"

          echo
          echo "OUTPUT:"
          echo "artifact/violet_full_defconfig"

      - name: Upload Full VIOLET defconfig
        uses: actions/upload-artifact@v4
        with:
          name: violet-full-defconfig
          path: artifact/violet_full_defconfig
          if-no-files-found: error
