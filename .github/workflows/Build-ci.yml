name: Violet Kconfig Forensic Analyzer

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            gcc \
            make \
            rsync

      - name: Prepare ARM64 Kconfig environment
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          echo "ARCH=$ARCH" >> "$GITHUB_ENV"
          echo "SUBARCH=$SUBARCH" >> "$GITHUB_ENV"

          mkdir -p out
          mkdir -p analysis

          echo "========================================"
          echo "KERNEL IDENTITY"
          echo "========================================"

          echo "ARCH=$ARCH"
          echo "SUBARCH=$SUBARCH"

          echo
          echo "KERNEL MAKEFILE:"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' Makefile || true

          echo
          echo "VIOLET CONFIG:"
          test -f arch/arm64/configs/vendor/violet.config

          echo
          echo "BASE DEFCONFIG:"
          test -f arch/arm64/configs/vendor/sdmsteppe-perf_defconfig

      - name: Generate correct ARM64 base configuration
        run: |
          set -e

          rm -f out/.config

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/sdmsteppe-perf_defconfig

          test -f out/.config

          cp out/.config analysis/01-base.config

      - name: Merge Violet configuration
        run: |
          set -e

          ./scripts/kconfig/merge_config.sh \
            -O out \
            out/.config \
            arch/arm64/configs/vendor/violet.config

          test -f out/.config

          cp out/.config analysis/02-after-merge.config

      - name: Resolve configuration with ARM64 Kconfig
        run: |
          set -e

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          test -f out/.config

          cp out/.config analysis/03-final.config

      - name: Build forensic report
        run: |
          set +e

          REPORT="analysis/VIOLET_KCONFIG_FORENSIC_REPORT.txt"

          : > "$REPORT"

          {
            echo "############################################################"
            echo "# VIOLET KCONFIG FORENSIC REPORT"
            echo "############################################################"
            echo
            echo "This report analyzes Kconfig behavior only."
            echo "The kernel source tree is not modified."
            echo
            echo "============================================================"
            echo "1. ENVIRONMENT"
            echo "============================================================"
            echo
            echo "ARCH=$ARCH"
            echo "SUBARCH=$SUBARCH"
            echo "HOST_ARCH=$(uname -m)"
            echo
            echo "Kernel Makefile:"
            grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' Makefile || true
            echo

            echo "============================================================"
            echo "2. BASE DEFCONFIG"
            echo "============================================================"
            echo
            echo "arch/arm64/configs/vendor/sdmsteppe-perf_defconfig"
            echo

            echo "============================================================"
            echo "3. TARGET SYMBOLS THROUGH CONFIGURATION TIMELINE"
            echo "============================================================"

            for FILE in \
              analysis/01-base.config \
              analysis/02-after-merge.config \
              analysis/03-final.config
            do
              echo
              echo "------------------------------------------------------------"
              echo "$FILE"
              echo "------------------------------------------------------------"

              for SYMBOL in \
                CONFIG_ARCH_QCOM \
                CONFIG_ARCH_SM6150 \
                CONFIG_ARCH_SDMMAGPIE \
                CONFIG_MACH_XIAOMI_VIOLET \
                CONFIG_MACH_XIAOMI_TUCANA \
                CONFIG_MACH_XIAOMI_SM6150 \
                CONFIG_MACH_XIAOMI_SDMMAGPIE \
                CONFIG_MMC \
                CONFIG_MMC_SDHCI \
                CONFIG_MMC_SDHCI_PLTFM \
                CONFIG_MMC_SDHCI_MSM
              do
                echo
                echo "[$SYMBOL]"

                grep -E \
                  "^${SYMBOL}=|^# ${SYMBOL} is not set" \
                  "$FILE" || echo "NOT PRESENT"
              done
            done

            echo
            echo "============================================================"
            echo "4. VIOLET.FRAGMENT REQUESTS"
            echo "============================================================"
            echo

            grep -E \
              '^[[:space:]]*(CONFIG_[A-Za-z0-9_]+)(=| )|^[[:space:]]*# CONFIG_[A-Za-z0-9_]+ is not set' \
              arch/arm64/configs/vendor/violet.config || true

            echo
            echo "============================================================"
            echo "5. TARGET SYMBOL DEFINITIONS"
            echo "============================================================"

            for SYMBOL in \
              ARCH_QCOM \
              ARCH_SM6150 \
              ARCH_SDMMAGPIE \
              MACH_XIAOMI_VIOLET \
              MACH_XIAOMI_TUCANA \
              MACH_XIAOMI_SM6150 \
              MACH_XIAOMI_SDMMAGPIE \
              MMC_SDHCI_MSM
            do
              echo
              echo "------------------------------------------------------------"
              echo "SYMBOL: $SYMBOL"
              echo "------------------------------------------------------------"

              grep -R -n \
                --include='Kconfig' \
                --include='Kconfig.platforms' \
                -E "^[[:space:]]*config ${SYMBOL}$" \
                arch drivers 2>/dev/null || true
            done

            echo
            echo "============================================================"
            echo "6. DEPENDENCY LINES"
            echo "============================================================"

            grep -R -n \
              --include='Kconfig' \
              --include='Kconfig.platforms' \
              -E \
              'depends on .*ARCH_QCOM|depends on .*ARCH_SM6150|select .*MACH_XIAOMI|depends on .*MMC_SDHCI_PLTFM|depends on .*ARCH_MSM' \
              arch/arm64 drivers 2>/dev/null || true

            echo
            echo "============================================================"
            echo "7. MERGE TOOL"
            echo "============================================================"

            echo
            echo "merge_config.sh:"
            test -f scripts/kconfig/merge_config.sh \
              && echo "PRESENT" \
              || echo "MISSING"

            echo
            echo "merge_config.sh options:"
            grep -E \
              'ALLTARGET=|make .*KCONFIG_ALLCONFIG|allnoconfig|alldefconfig' \
              scripts/kconfig/merge_config.sh 2>/dev/null || true

            echo
            echo "============================================================"
            echo "8. KCONFIG WARNINGS"
            echo "============================================================"

            if grep -R -n \
              -E \
              '/boot/config-|arch/x86/configs|Can't find default configuration' \
              analysis 2>/dev/null
            then
              echo
              echo "WARNING: WRONG ARCH OR HOST CONFIG DETECTED"
            else
              echo
              echo "No x86 /boot configuration contamination detected."
            fi

            echo
            echo "============================================================"
            echo "9. FINAL TARGET STATUS"
            echo "============================================================"

            for SYMBOL in \
              CONFIG_ARCH_QCOM \
              CONFIG_ARCH_SM6150 \
              CONFIG_ARCH_SDMMAGPIE \
              CONFIG_MACH_XIAOMI_VIOLET \
              CONFIG_MACH_XIAOMI_TUCANA \
              CONFIG_MACH_XIAOMI_SM6150 \
              CONFIG_MACH_XIAOMI_SDMMAGPIE \
              CONFIG_MMC_SDHCI_MSM
            do
              echo
              echo "[$SYMBOL]"

              VALUE=$(grep -E \
                "^${SYMBOL}=|^# ${SYMBOL} is not set" \
                analysis/03-final.config 2>/dev/null || true)

              if [ -n "$VALUE" ]; then
                echo "$VALUE"
              else
                echo "NOT PRESENT"
              fi
            done

            echo
            echo "============================================================"
            echo "10. RESULT INTERPRETATION"
            echo "============================================================"
            echo

            echo "Configuration stages:"
            echo
            echo "BASE"
            echo "  analysis/01-base.config"
            echo
            echo "      ↓"
            echo
            echo "AFTER MERGE"
            echo "  analysis/02-after-merge.config"
            echo
            echo "      ↓"
            echo
            echo "FINAL KCONFIG"
            echo "  analysis/03-final.config"
            echo

            echo "If a symbol disappears between BASE and AFTER MERGE,"
            echo "the merge stage or its input configuration is responsible."
            echo
            echo "If a symbol exists AFTER MERGE but disappears in FINAL,"
            echo "Kconfig dependency resolution is responsible."
            echo
            echo "If a symbol is already absent from BASE,"
            echo "the selected defconfig does not enable it."
            echo

            echo "============================================================"
            echo "11. IMPORTANT ARCH CHECK"
            echo "============================================================"
            echo
            echo "Expected:"
            echo "ARCH=arm64"
            echo "Defconfig path:"
            echo "arch/arm64/configs/vendor/sdmsteppe-perf_defconfig"
            echo
            echo "The workflow must never use:"
            echo "arch/x86/configs/vendor/sdmsteppe-perf_defconfig"
            echo
            echo "The workflow must never use:"
            echo "/boot/config-6.8.0-1064-azure"
            echo

            echo "############################################################"
            echo "# END OF FORENSIC REPORT"
            echo "############################################################"

          } >> "$REPORT"

          echo "REPORT GENERATED:"
          cat "$REPORT"

      - name: Upload single forensic artifact
        uses: actions/upload-artifact@v4
        with:
          name: violet-kconfig-forensic
          path: analysis/VIOLET_KCONFIG_FORENSIC_REPORT.txt
          if-no-files-found: error
