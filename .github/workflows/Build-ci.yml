name: Generate Modern Violet Defconfig (Fixed)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            build-essential \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            python3

      - name: Verify required kernel configs
        run: |
          set -e

          test -f arch/arm64/configs/vendor/sdmsteppe-perf_defconfig
          test -f arch/arm64/configs/vendor/violet.config

          echo "Found:"
          echo "  vendor/sdmsteppe-perf_defconfig"
          echo "  vendor/violet.config"

      - name: Generate Qualcomm SM6150 base configuration
        run: |
          set -e

          rm -rf out
          mkdir -p out

          make O=out ARCH=arm64 vendor/sdmsteppe-perf_defconfig

          test -s out/.config

          echo "Base configuration generated successfully."

      - name: Merge Violet configuration
        run: |
          set -e

          ./scripts/kconfig/merge_config.sh \
            -O out \
            out/.config \
            arch/arm64/configs/vendor/violet.config

          test -s out/.config

          echo "Violet configuration merged successfully."

      - name: Resolve final configuration
        run: |
          set -e

          make O=out ARCH=arm64 olddefconfig

          test -s out/.config

          echo "Final configuration resolved successfully."

      - name: Save full Violet configuration
        run: |
          set -e

          cp out/.config violet-full.config

          test -s violet-full.config

          echo "Created:"
          echo "  violet-full.config"

      - name: Generate Violet perf defconfig
        run: |
          set -e

          make O=out ARCH=arm64 savedefconfig

          test -s out/defconfig

          cp out/defconfig violet-perf_defconfig

          test -s violet-perf_defconfig

          echo "Created:"
          echo "  violet-perf_defconfig"

      - name: Show generated defconfig
        run: |
          set -e

          echo "========================================"
          echo "GENERATED VIOLET PERF DEFCONFIG"
          echo "========================================"

          cat violet-perf_defconfig

          echo
          echo "========================================"
          echo "LINE COUNTS"
          echo "========================================"

          echo "violet-perf_defconfig:"
          wc -l violet-perf_defconfig

          echo
          echo "violet-full.config:"
          wc -l violet-full.config

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modern-violet-defconfig
          path: |
            violet-perf_defconfig
            violet-full.config
          if-no-files-found: error
