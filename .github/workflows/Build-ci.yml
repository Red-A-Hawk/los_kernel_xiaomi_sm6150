name: Generate Modern Violet Defconfig (Kconfig Analysis)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            build-essential \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            python3

      - name: Verify required files
        run: |
          set -e

          test -f arch/arm64/configs/vendor/sdmsteppe-perf_defconfig
          test -f arch/arm64/configs/vendor/violet.config
          test -x scripts/kconfig/merge_config.sh

          echo "Required files found."

      - name: Generate base configuration
        run: |
          set -e

          rm -rf out
          mkdir -p out

          make O=out ARCH=arm64 vendor/sdmsteppe-perf_defconfig

          test -s out/.config

          echo "Base configuration generated."

      - name: Save base configuration
        run: |
          mkdir -p analysis

          cp out/.config analysis/base.config
          cp arch/arm64/configs/vendor/sdmsteppe-perf_defconfig \
            analysis/sdmsteppe-perf_defconfig
          cp arch/arm64/configs/vendor/violet.config \
            analysis/violet.config

      - name: Merge Violet fragment and capture complete log
        run: |
          set +e

          ./scripts/kconfig/merge_config.sh \
            -O out \
            out/.config \
            arch/arm64/configs/vendor/violet.config \
            2>&1 | tee analysis/merge-config.log

          MERGE_STATUS=${PIPESTATUS[0]}

          echo
          echo "merge_config.sh exit code: $MERGE_STATUS"

          if [ "$MERGE_STATUS" -ne 0 ]; then
            echo "merge_config.sh failed."
          else
            echo "merge_config.sh completed."
          fi

          test -s out/.config

      - name: Capture configuration after merge
        if: always()
        run: |
          set +e

          cp out/.config analysis/after-merge.config 2>/dev/null || true

          echo "=== TARGET SYMBOLS AFTER MERGE ===" \
            > analysis/target-symbols-after-merge.txt

          for symbol in \
            CONFIG_ARCH_QCOM \
            CONFIG_ARCH_SM6150 \
            CONFIG_ARCH_SDMMAGPIE \
            CONFIG_MACH_XIAOMI_VIOLET
          do
            echo >> analysis/target-symbols-after-merge.txt
            echo "[$symbol]" >> analysis/target-symbols-after-merge.txt

            grep -E \
              "^${symbol}=|^# ${symbol} is not set" \
              out/.config \
              >> analysis/target-symbols-after-merge.txt
          done

      - name: Resolve final configuration
        run: |
          set -e

          make O=out ARCH=arm64 olddefconfig

          test -s out/.config

          echo "Final configuration resolved."

      - name: Capture Kconfig resolution
        if: always()
        run: |
          set +e

          cp out/.config analysis/final.config

          {
            echo "========================================"
            echo "FINAL TARGET SYMBOLS"
            echo "========================================"

            for symbol in \
              CONFIG_ARCH_QCOM \
              CONFIG_ARCH_SM6150 \
              CONFIG_ARCH_SDMMAGPIE \
              CONFIG_MACH_XIAOMI_VIOLET
            do
              echo
              echo "[$symbol]"

              grep -E \
                "^${symbol}=|^# ${symbol} is not set" \
                out/.config
            done

            echo
            echo "========================================"
            echo "QCOM RELATED SYMBOLS"
            echo "========================================"

            grep -E \
              "^CONFIG_(ARCH_QCOM|ARCH_SM6150|ARCH_SDMMAGPIE|QCOM|MSM|SM6150)" \
              out/.config

          } > analysis/final-symbols.txt

      - name: Inspect Kconfig definitions
        if: always()
        run: |
          set +e

          {
            echo "========================================"
            echo "ARCH_QCOM DEFINITIONS"
            echo "========================================"

            grep -R -n \
              -E "^[[:space:]]*(config|menuconfig)[[:space:]]+ARCH_QCOM([[:space:]]|$)" \
              arch/arm64 arch/arm drivers 2>/dev/null

            echo
            echo "========================================"
            echo "ARCH_SM6150 DEFINITIONS"
            echo "========================================"

            grep -R -n \
              -E "^[[:space:]]*(config|menuconfig)[[:space:]]+ARCH_SM6150([[:space:]]|$)" \
              arch/arm64 arch/arm drivers 2>/dev/null

            echo
            echo "========================================"
            echo "MACH_XIAOMI_VIOLET DEFINITIONS"
            echo "========================================"

            grep -R -n \
              -E "^[[:space:]]*(config|menuconfig)[[:space:]]+MACH_XIAOMI_VIOLET([[:space:]]|$)" \
              . 2>/dev/null \
              | grep -v "/.git/"

            echo
            echo "========================================"
            echo "ALL TARGET REFERENCES"
            echo "========================================"

            grep -R -n \
              -E "ARCH_QCOM|ARCH_SM6150|MACH_XIAOMI_VIOLET" \
              arch/arm64 arch/arm drivers 2>/dev/null \
              | grep -v "/.git/"

          } > analysis/kconfig-definitions.txt

      - name: Generate final files
        run: |
          set -e

          cp out/.config violet-full.config

          make O=out ARCH=arm64 savedefconfig

          test -s out/defconfig

          cp out/defconfig violet-perf_defconfig

      - name: Show final result
        run: |
          echo "========================================"
          echo "FINAL FILES"
          echo "========================================"

          echo
          echo "violet-full.config:"
          wc -l violet-full.config

          echo
          echo "violet-perf_defconfig:"
          wc -l violet-perf_defconfig

          echo
          echo "========================================"
          echo "TARGET SYMBOLS"
          echo "========================================"

          grep -E \
            "^CONFIG_ARCH_QCOM=|^# CONFIG_ARCH_QCOM is not set|^CONFIG_ARCH_SM6150=|^# CONFIG_ARCH_SM6150 is not set|^CONFIG_MACH_XIAOMI_VIOLET=|^# CONFIG_MACH_XIAOMI_VIOLET is not set" \
            violet-full.config || true

      - name: Upload generated configs
        uses: actions/upload-artifact@v4
        with:
          name: modern-violet-defconfig
          path: |
            violet-full.config
            violet-perf_defconfig
          if-no-files-found: error

      - name: Upload Kconfig analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violet-kconfig-analysis
          path: analysis/
          if-no-files-found: warn
