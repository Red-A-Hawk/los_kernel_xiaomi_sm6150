name: Generate Clean VIOLET Defconfig

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            make \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            device-tree-compiler

      - name: Verify kernel and VIOLET files
        run: |
          set -e

          echo "=== KERNEL ==="
          make kernelversion

          echo
          echo "=== ARCH ==="
          test -f arch/arm64/Kconfig

          echo
          echo "=== BASE DEFCONFIG ==="
          test -f arch/arm64/configs/vendor/sdmsteppe-perf_defconfig

          echo
          echo "=== VIOLET CONFIG ==="
          test -f arch/arm64/configs/vendor/violet.config

          echo
          echo "=== VIOLET REQUESTS ==="
          grep -E \
            '^CONFIG_MACH_XIAOMI_VIOLET=y$|^CONFIG_MMC_SDHCI_MSM=y$' \
            arch/arm64/configs/vendor/violet.config

      - name: Prepare output
        run: |
          set -e

          rm -rf out
          mkdir -p out
          mkdir -p artifact

      - name: Generate base configuration
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out vendor/sdmsteppe-perf_defconfig

          cp out/.config out/base.config

          echo
          echo "=== BASE VIOLET PLATFORM ==="

          grep -E \
            '^CONFIG_ARCH_QCOM=y$|^CONFIG_ARCH_SM6150=y$|^CONFIG_ARCH_SDMMAGPIE=y$|^# CONFIG_MACH_XIAOMI_VIOLET is not set$' \
            out/.config || true

      - name: Merge VIOLET fragment
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          ./scripts/kconfig/merge_config.sh \
            -O out \
            out/base.config \
            arch/arm64/configs/vendor/violet.config

      - name: Resolve VIOLET with Kconfig
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out olddefconfig

      - name: Verify resolved VIOLET configuration
        run: |
          set -e

          echo "========================================"
          echo "VIOLET KCONFIG VERIFICATION"
          echo "========================================"

          check() {
            symbol="$1"
            expected="$2"

            actual="$(grep -E "^${symbol}=|^# ${symbol} is not set" out/.config | head -n 1 || true)"

            echo
            echo "[${symbol}]"
            echo "Expected: ${expected}"
            echo "Actual:   ${actual:-NOT PRESENT}"

            if [ "$actual" != "$expected" ]; then
              echo "FAIL"
              exit 1
            fi

            echo "OK"
          }

          check CONFIG_ARCH_QCOM "CONFIG_ARCH_QCOM=y"
          check CONFIG_ARCH_SM6150 "CONFIG_ARCH_SM6150=y"
          check CONFIG_MACH_XIAOMI_VIOLET "CONFIG_MACH_XIAOMI_VIOLET=y"
          check CONFIG_MMC "CONFIG_MMC=y"
          check CONFIG_MMC_SDHCI "CONFIG_MMC_SDHCI=y"
          check CONFIG_MMC_SDHCI_PLTFM "CONFIG_MMC_SDHCI_PLTFM=y"
          check CONFIG_MMC_SDHCI_MSM "CONFIG_MMC_SDHCI_MSM=y"

          echo
          echo "========================================"
          echo "VIOLET PLATFORM: VALID"
          echo "========================================"

      - name: Verify VIOLET drivers
        run: |
          set -e

          echo "=== VIOLET CONFIG SYMBOLS ==="

          grep '^CONFIG_' \
            arch/arm64/configs/vendor/violet.config

          echo
          echo "=== RESOLVED VIOLET SYMBOLS ==="

          while read -r line; do
            case "$line" in
              CONFIG_*=*)
                symbol="${line%%=*}"
                grep -E "^${symbol}=|^# ${symbol} is not set" \
                  out/.config || true
                ;;
            esac
          done < arch/arm64/configs/vendor/violet.config

      - name: Generate clean defconfig
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out savedefconfig

          cp out/defconfig \
            artifact/violet_defconfig

      - name: Final VIOLET-only validation
        run: |
          set -e

          echo "========================================"
          echo "FINAL VIOLET DEFCONFIG"
          echo "========================================"

          test -s artifact/violet_defconfig

          grep -E \
            '^CONFIG_ARCH_QCOM=y$|^CONFIG_ARCH_SM6150=y$|^CONFIG_MACH_XIAOMI_VIOLET=y$|^CONFIG_MMC_SDHCI_MSM=y$' \
            artifact/violet_defconfig

          echo
          echo "=== CHECK TUCANA ==="

          if grep -q '^CONFIG_MACH_XIAOMI_TUCANA=y$' \
            artifact/violet_defconfig; then
            echo "ERROR: TUCANA is enabled"
            exit 1
          fi

          echo "TUCANA: NOT ENABLED"

          echo
          echo "========================================"
          echo "VIOLET DEFCONFIG READY"
          echo "========================================"

      - name: Create artifact report
        run: |
          set -e

          {
            echo "========================================"
            echo "VIOLET SM6150 DEFCONFIG"
            echo "========================================"
            echo
            echo "Git ref: 16"
            echo "Architecture: arm64"
            echo "Platform: Qualcomm SM6150"
            echo "Board: Xiaomi VIOLET"
            echo
            echo "Required symbols:"
            echo
            grep -E \
              '^CONFIG_ARCH_QCOM=y$|^CONFIG_ARCH_SM6150=y$|^CONFIG_MACH_XIAOMI_VIOLET=y$|^CONFIG_MMC_SDHCI_MSM=y$' \
              artifact/violet_defconfig
            echo
            echo "TUCANA:"
            echo "CONFIG_MACH_XIAOMI_TUCANA is not enabled"
            echo
            echo "Generated with:"
            echo "make savedefconfig"
            echo
            echo "========================================"
          } > artifact/README.txt

      - name: Upload VIOLET artifact
        uses: actions/upload-artifact@v4
        with:
          name: violet-defconfig
          path: artifact/
          if-no-files-found: error
