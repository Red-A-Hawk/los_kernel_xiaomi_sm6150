name: Generate Full VIOLET Defconfig

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install ARM64 toolchain and dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            make \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            device-tree-compiler

      - name: Verify ARM64 compiler
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "========================================"
          echo "ARM64 TOOLCHAIN"
          echo "========================================"

          echo "ARCH=$ARCH"
          echo "CROSS_COMPILE=$CROSS_COMPILE"

          command -v "${CROSS_COMPILE}gcc"
          command -v "${CROSS_COMPILE}ld"

          "${CROSS_COMPILE}gcc" --version | head -n 1
          "${CROSS_COMPILE}ld" --version | head -n 1

          echo
          echo "ARM64 COMPILER: READY"

      - name: Verify VIOLET inputs
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING INPUTS"
          echo "========================================"

          test -f Kconfig
          test -f scripts/kconfig/merge_config.sh
          test -f arch/arm64/configs/vendor/sdmsteppe-perf_defconfig
          test -f arch/arm64/configs/vendor/violet.config

          echo
          echo "BASE:"
          echo "arch/arm64/configs/vendor/sdmsteppe-perf_defconfig"

          echo
          echo "VIOLET:"
          echo "arch/arm64/configs/vendor/violet.config"

          echo
          echo "KCONFIG:"
          echo "Kconfig"

          echo
          echo "ALL INPUTS: FOUND"

      - name: Prepare workspace
        run: |
          set -e

          rm -rf out artifact
          mkdir -p out artifact

      - name: Generate base sdmsteppe configuration
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "========================================"
          echo "BASE DEFCONFIG"
          echo "========================================"

          make O=out vendor/sdmsteppe-perf_defconfig

          test -s out/.config

          cp out/.config out/base.config

          echo
          echo "BASE CONFIG GENERATED"
          echo "Lines:"
          wc -l < out/base.config

      - name: Record VIOLET requested symbols
        run: |
          set -e

          echo "========================================"
          echo "VIOLET REQUEST"
          echo "========================================"

          grep -E \
            '^(CONFIG_[A-Za-z0-9_]+)=|^# CONFIG_[A-Za-z0-9_]+ is not set$' \
            arch/arm64/configs/vendor/violet.config \
            > out/violet.requested.symbols

          test -s out/violet.requested.symbols

          echo "VIOLET requested symbols:"
          wc -l < out/violet.requested.symbols

      - name: Merge sdmsteppe and VIOLET through Kconfig
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "========================================"
          echo "KCONFIG MERGE"
          echo "========================================"

          echo "Merging:"
          echo "  sdmsteppe-perf_defconfig"
          echo "  + violet.config"
          echo "  + Kconfig"

          ./scripts/kconfig/merge_config.sh \
            -O out \
            out/base.config \
            arch/arm64/configs/vendor/violet.config

          test -s out/.config

          cp out/.config out/after-merge.config

          echo
          echo "MERGE COMPLETED"

      - name: Resolve final configuration with Kconfig
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "========================================"
          echo "KCONFIG RESOLUTION"
          echo "========================================"

          make O=out olddefconfig

          test -s out/.config

          cp out/.config out/final.config

          echo
          echo "KCONFIG RESOLUTION: COMPLETED"

      - name: Verify every VIOLET symbol
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING VIOLET REQUESTS"
          echo "========================================"

          failed=0
          total=0
          changed=0

          get_value() {
            symbol="$1"

            grep -E \
              "^${symbol}=|^# ${symbol} is not set$" \
              out/final.config \
              | head -n 1 || true
          }

          while IFS= read -r line; do

            case "$line" in

              CONFIG_*=*)
                symbol="${line%%=*}"
                expected="$line"
                ;;

              \#\ CONFIG_*\ is\ not\ set)
                symbol="$(printf '%s\n' "$line" \
                  | sed 's/^# //; s/ is not set$//')"
                expected="$line"
                ;;

              *)
                continue
                ;;

            esac

            total=$((total + 1))

            actual="$(get_value "$symbol")"

            if [ "$actual" = "$expected" ]; then
              echo "OK      $expected"
            else
              echo "CHANGED $expected"
              echo "        -> ${actual:-NOT PRESENT}"
              changed=$((changed + 1))
              failed=1
            fi

          done < out/violet.requested.symbols

          echo
          echo "========================================"
          echo "VIOLET KCONFIG RESULT"
          echo "========================================"

          echo "Requested symbols : $total"
          echo "Changed by Kconfig: $changed"

          echo

          if [ "$failed" -ne 0 ]; then
            echo "ERROR: VIOLET CONFIGURATION CHANGED"
            exit 1
          fi

          echo "ALL VIOLET REQUESTS SURVIVED KCONFIG"

      - name: Verify VIOLET board selection
        run: |
          set -e

          echo "========================================"
          echo "VIOLET BOARD CHECK"
          echo "========================================"

          grep -q '^CONFIG_MACH_XIAOMI_VIOLET=y$' out/final.config

          echo "CONFIG_MACH_XIAOMI_VIOLET=y"

          echo
          echo "VIOLET BOARD: ENABLED"

      - name: Export FULL VIOLET configuration
        run: |
          set -e

          echo "========================================"
          echo "EXPORTING FULL VIOLET DEFCONFIG"
          echo "========================================"

          echo "IMPORTANT:"
          echo "Using final Kconfig .config directly."
          echo "savedefconfig is NOT used."

          cp out/final.config artifact/violet_full_defconfig

          test -s artifact/violet_full_defconfig

          echo
          echo "========================================"
          echo "FULL CONFIGURATION"
          echo "========================================"

          echo "Lines:"
          wc -l artifact/violet_full_defconfig

          echo
          echo "VIOLET CONFIG:"
          grep -E \
            '^CONFIG_MACH_XIAOMI_VIOLET=y$|^CONFIG_MACH_XIAOMI_SM6150=y$|^CONFIG_ARCH_QCOM=y$|^CONFIG_ARCH_SM6150=y$|^CONFIG_MMC_SDHCI_MSM=y$' \
            artifact/violet_full_defconfig || true

      - name: Full configuration integrity check
        run: |
          set -e

          echo "========================================"
          echo "FINAL INTEGRITY CHECK"
          echo "========================================"

          test -s artifact/violet_full_defconfig

          grep -q '^CONFIG_MACH_XIAOMI_VIOLET=y$' \
            artifact/violet_full_defconfig

          grep -q '^CONFIG_ARCH_QCOM=y$' \
            artifact/violet_full_defconfig

          grep -q '^CONFIG_ARCH_SM6150=y$' \
            artifact/violet_full_defconfig

          grep -q '^CONFIG_MMC=y$' \
            artifact/violet_full_defconfig

          grep -q '^CONFIG_MMC_SDHCI=y$' \
            artifact/violet_full_defconfig

          grep -q '^CONFIG_MMC_SDHCI_PLTFM=y$' \
            artifact/violet_full_defconfig

          grep -q '^CONFIG_MMC_SDHCI_MSM=y$' \
            artifact/violet_full_defconfig

          echo
          echo "========================================"
          echo "FINAL RESULT"
          echo "========================================"

          echo "sdmsteppe-perf_defconfig : OK"
          echo "violet.config             : OK"
          echo "ARM64 compiler            : OK"
          echo "Kconfig merge             : OK"
          echo "Kconfig resolution        : OK"
          echo "26/26 VIOLET requests     : OK"
          echo "FULL .config exported     : OK"

          echo
          echo "FULL VIOLET DEFCONFIG: READY"

          echo
          echo "Artifact:"
          echo "violet_full_defconfig"

      - name: Upload single VIOLET artifact
        uses: actions/upload-artifact@v4
        with:
          name: violet-full-defconfig
          path: artifact/violet_full_defconfig
          if-no-files-found: error
          retention-days: 30
