- name: Diagnose Kconfig resolution
        if: always()
        run: |
          set +e

          mkdir -p kconfig-diagnostics

          echo "========================================" > kconfig-diagnostics/summary.txt
          echo "KCONFIG DIAGNOSTIC SUMMARY" >> kconfig-diagnostics/summary.txt
          echo "========================================" >> kconfig-diagnostics/summary.txt

          echo >> kconfig-diagnostics/summary.txt
          echo "=== FINAL CONFIG VALUES ===" >> kconfig-diagnostics/summary.txt
          grep -E "CONFIG_(ARCH_QCOM|ARCH_SM6150|ARCH_SDMMAGPIE|MACH_XIAOMI_VIOLET|QCOM_SCM|TOUCHSCREEN_FTS_F7B|TOUCHSCREEN_NT36xxx|TOUCHSCREEN_XIAOMI_TOUCHFEATURE|TOUCHSCREEN_NVT_F7B|INPUT_FINGERPRINT|FINGERPRINT_FPC1020|FINGERPRINT_GF3208|SND_SOC_TAS2563|TAS2563_CODEC|TAS2563_MISC|TAS2563_REGMAP)" \
            out/.config \
            >> kconfig-diagnostics/summary.txt

          echo >> kconfig-diagnostics/summary.txt
          echo "=== BASE DEFCONFIG ===" >> kconfig-diagnostics/summary.txt
          cat arch/arm64/configs/vendor/sdmsteppe-perf_defconfig \
            > kconfig-diagnostics/sdmsteppe-perf_defconfig.txt

          echo >> kconfig-diagnostics/summary.txt
          echo "=== VIOLET FRAGMENT ===" >> kconfig-diagnostics/summary.txt
          cat arch/arm64/configs/vendor/violet.config \
            > kconfig-diagnostics/violet.config.txt

          echo >> kconfig-diagnostics/summary.txt
          echo "=== FINAL FULL CONFIG ===" >> kconfig-diagnostics/summary.txt
          cp out/.config kconfig-diagnostics/final.config

          echo >> kconfig-diagnostics/summary.txt
          echo "=== FINAL DEFCONFIG ===" >> kconfig-diagnostics/summary.txt
          if [ -f out/defconfig ]; then
            cp out/defconfig kconfig-diagnostics/final-defconfig
          fi

          echo >> kconfig-diagnostics/summary.txt
          echo "=== KCONFIG DEFINITIONS ===" >> kconfig-diagnostics/summary.txt

          echo >> kconfig-diagnostics/summary.txt
          echo "--- ARCH_QCOM definitions ---" >> kconfig-diagnostics/summary.txt
          grep -R -n -E "^[[:space:]]*config ARCH_QCOM([[:space:]]|$)" \
            arch/arm64 arch/arm 2>/dev/null \
            >> kconfig-diagnostics/summary.txt

          echo >> kconfig-diagnostics/summary.txt
          echo "--- ARCH_SM6150 definitions ---" >> kconfig-diagnostics/summary.txt
          grep -R -n -E "^[[:space:]]*config ARCH_SM6150([[:space:]]|$)" \
            arch/arm64 arch/arm 2>/dev/null \
            >> kconfig-diagnostics/summary.txt

          echo >> kconfig-diagnostics/summary.txt
          echo "--- MACH_XIAOMI_VIOLET definitions ---" >> kconfig-diagnostics/summary.txt
          grep -R -n -E "^[[:space:]]*config MACH_XIAOMI_VIOLET([[:space:]]|$)" \
            . 2>/dev/null | grep -v "/\.git/" \
            >> kconfig-diagnostics/summary.txt

          echo >> kconfig-diagnostics/summary.txt
          echo "=== SYMBOL REFERENCES ===" >> kconfig-diagnostics/summary.txt

          grep -R -n -E "ARCH_QCOM|ARCH_SM6150|MACH_XIAOMI_VIOLET" \
            arch/arm64 arch/arm drivers 2>/dev/null \
            | grep -v "/\.git/" \
            > kconfig-diagnostics/symbol-references.txt

          echo >> kconfig-diagnostics/summary.txt
          echo "=== KCONFIG FILE LIST ===" >> kconfig-diagnostics/summary.txt

          find arch/arm64 arch/arm drivers \
            -type f \( -name "Kconfig" -o -name "Kconfig.*" \) \
            2>/dev/null \
            | sort \
            > kconfig-diagnostics/kconfig-files.txt

          echo >> kconfig-diagnostics/summary.txt
          echo "=== MAKE VERSION ===" >> kconfig-diagnostics/summary.txt
          make --version | head -n 2 >> kconfig-diagnostics/summary.txt

          echo >> kconfig-diagnostics/summary.txt
          echo "=== KERNEL VERSION ===" >> kconfig-diagnostics/summary.txt
          head -n 5 Makefile >> kconfig-diagnostics/summary.txt

          echo >> kconfig-diagnostics/summary.txt
          echo "=== MERGE CONFIG SCRIPT ===" >> kconfig-diagnostics/summary.txt
          sed -n '1,260p' scripts/kconfig/merge_config.sh \
            > kconfig-diagnostics/merge_config.sh.txt

          echo >> kconfig-diagnostics/summary.txt
          echo "=== OLDDEFCONFIG OUTPUT ===" >> kconfig-diagnostics/summary.txt
          make O=out ARCH=arm64 olddefconfig \
            > kconfig-diagnostics/olddefconfig.log 2>&1

          echo >> kconfig-diagnostics/summary.txt
          echo "=== FINAL CONFIG CHECK ===" >> kconfig-diagnostics/summary.txt
          {
            echo "ARCH_QCOM:"
            grep -E "^# CONFIG_ARCH_QCOM is not set$|^CONFIG_ARCH_QCOM=" out/.config
            echo
            echo "ARCH_SM6150:"
            grep -E "^# CONFIG_ARCH_SM6150 is not set$|^CONFIG_ARCH_SM6150=" out/.config
            echo
            echo "ARCH_SDMMAGPIE:"
            grep -E "^# CONFIG_ARCH_SDMMAGPIE is not set$|^CONFIG_ARCH_SDMMAGPIE=" out/.config
            echo
            echo "MACH_XIAOMI_VIOLET:"
            grep -E "^# CONFIG_MACH_XIAOMI_VIOLET is not set$|^CONFIG_MACH_XIAOMI_VIOLET=" out/.config
          } >> kconfig-diagnostics/summary.txt

          echo
          echo "========================================"
          echo "KCONFIG DIAGNOSTICS COLLECTED"
          echo "========================================"

          cat kconfig-diagnostics/summary.txt

      - name: Upload Kconfig diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violet-kconfig-diagnostics
          path: kconfig-diagnostics/
          if-no-files-found: warn
