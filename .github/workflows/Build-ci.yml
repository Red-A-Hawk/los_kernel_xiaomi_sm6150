name: Generate Full VIOLET Defconfig

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install ARM64 toolchain
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            make \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            device-tree-compiler

      - name: Verify ARM64 compiler
        run: |
          set -e
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "========================================"
          echo "ARM64 TOOLCHAIN"
          echo "========================================"

          "$CROSS_COMPILE"gcc --version | head -n 1
          "$CROSS_COMPILE"ld --version | head -n 1

      - name: Verify VIOLET sources
        run: |
          set -e

          test -f arch/arm64/configs/vendor/sdmsteppe-perf_defconfig
          test -f arch/arm64/configs/vendor/violet.config
          test -f Kconfig

          echo "========================================"
          echo "SOURCES VERIFIED"
          echo "========================================"
          echo "sdmsteppe-perf_defconfig : OK"
          echo "violet.config             : OK"
          echo "Kconfig                   : OK"

      - name: Generate base configuration
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          rm -rf out artifact
          mkdir -p out artifact

          echo "========================================"
          echo "BASE KCONFIG"
          echo "========================================"
          echo "sdmsteppe-perf_defconfig"

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/sdmsteppe-perf_defconfig

          test -s out/.config

          cp out/.config out/base.config

          echo "BASE CONFIG GENERATED"
          wc -l out/base.config

      - name: Merge VIOLET
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "========================================"
          echo "KCONFIG MERGE"
          echo "========================================"
          echo "sdmsteppe-perf_defconfig"
          echo "+"
          echo "violet.config"
          echo "+"
          echo "Kconfig"

          ./scripts/kconfig/merge_config.sh \
            -O out \
            out/base.config \
            arch/arm64/configs/vendor/violet.config

          test -s out/.config

          echo "MERGE COMPLETED"

      - name: Resolve Kconfig
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "========================================"
          echo "KCONFIG RESOLUTION"
          echo "========================================"

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          test -s out/.config

          echo "KCONFIG RESOLUTION: COMPLETED"

      - name: Verify VIOLET configuration
        run: |
          set -e

          echo "========================================"
          echo "VIOLET VALIDATION"
          echo "========================================"

          grep -q '^CONFIG_ARCH_QCOM=y$' out/.config
          grep -q '^CONFIG_ARCH_SM6150=y$' out/.config
          grep -q '^CONFIG_MACH_XIAOMI_VIOLET=y$' out/.config
          grep -q '^CONFIG_MMC=y$' out/.config
          grep -q '^CONFIG_MMC_SDHCI=y$' out/.config
          grep -q '^CONFIG_MMC_SDHCI_PLTFM=y$' out/.config
          grep -q '^CONFIG_MMC_SDHCI_MSM=y$' out/.config

          echo "CONFIG_ARCH_QCOM=y                    OK"
          echo "CONFIG_ARCH_SM6150=y                  OK"
          echo "CONFIG_MACH_XIAOMI_VIOLET=y           OK"
          echo "CONFIG_MMC=y                           OK"
          echo "CONFIG_MMC_SDHCI=y                    OK"
          echo "CONFIG_MMC_SDHCI_PLTFM=y               OK"
          echo "CONFIG_MMC_SDHCI_MSM=y                 OK"

          echo
          echo "VIOLET CONFIGURATION: VALID"

      - name: Export FULL VIOLET defconfig
        run: |
          set -e

          echo "========================================"
          echo "EXPORTING FULL VIOLET DEFCONFIG"
          echo "========================================"

          cp out/.config artifact/violet_full_defconfig

          test -s artifact/violet_full_defconfig

          echo
          echo "FULL CONFIGURATION:"
          wc -l artifact/violet_full_defconfig

          echo
          echo "OUTPUT:"
          echo "artifact/violet_full_defconfig"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: violet-full-defconfig
          path: artifact/violet_full_defconfig
          if-no-files-found: error
