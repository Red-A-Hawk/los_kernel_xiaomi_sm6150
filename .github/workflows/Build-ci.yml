name: Generate Full VIOLET Defconfig

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            make \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            device-tree-compiler

      - name: Verify toolchain
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "=== ARCH ==="
          echo "$ARCH"

          echo
          echo "=== CROSS COMPILER ==="
          "$CROSS_COMPILE"gcc --version | head -n 1

          echo
          echo "=== CROSS LINKER ==="
          "$CROSS_COMPILE"ld --version | head -n 1

      - name: Verify VIOLET configuration
        run: |
          set -e

          test -f arch/arm64/configs/vendor/sdmsteppe-perf_defconfig
          test -f arch/arm64/configs/vendor/violet.config

          echo "========================================"
          echo "VIOLET CONFIGURATION"
          echo "========================================"

          grep -E \
            '^CONFIG_MACH_XIAOMI_VIOLET=y$|^CONFIG_MMC_SDHCI_MSM=y$' \
            arch/arm64/configs/vendor/violet.config

      - name: Prepare output
        run: |
          set -e

          rm -rf out
          mkdir -p out
          mkdir -p artifact

      - name: Generate base configuration
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out vendor/sdmsteppe-perf_defconfig

          cp out/.config out/base.config

      - name: Merge VIOLET configuration
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          ./scripts/kconfig/merge_config.sh \
            -O out \
            out/base.config \
            arch/arm64/configs/vendor/violet.config

      - name: Resolve final VIOLET configuration
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out olddefconfig

      - name: Validate VIOLET
        run: |
          set -e

          echo "========================================"
          echo "FINAL VIOLET VALIDATION"
          echo "========================================"

          check_symbol() {
            symbol="$1"
            expected="$2"

            actual="$(grep -E "^${symbol}=|^# ${symbol} is not set" \
              out/.config | head -n 1 || true)"

            echo
            echo "[$symbol]"
            echo "EXPECTED: $expected"
            echo "ACTUAL:   ${actual:-NOT PRESENT}"

            if [ "$actual" != "$expected" ]; then
              echo "ERROR: VIOLET symbol validation failed"
              exit 1
            fi
          }

          check_symbol CONFIG_ARCH_QCOM "CONFIG_ARCH_QCOM=y"
          check_symbol CONFIG_ARCH_SM6150 "CONFIG_ARCH_SM6150=y"
          check_symbol CONFIG_MACH_XIAOMI_VIOLET "CONFIG_MACH_XIAOMI_VIOLET=y"
          check_symbol CONFIG_MMC "CONFIG_MMC=y"
          check_symbol CONFIG_MMC_SDHCI "CONFIG_MMC_SDHCI=y"
          check_symbol CONFIG_MMC_SDHCI_PLTFM "CONFIG_MMC_SDHCI_PLTFM=y"
          check_symbol CONFIG_MMC_SDHCI_MSM "CONFIG_MMC_SDHCI_MSM=y"

          echo
          echo "========================================"
          echo "VIOLET VALIDATION: PASSED"
          echo "========================================"

      - name: Verify all VIOLET fragment symbols
        run: |
          set -e

          echo "========================================"
          echo "CHECKING VIOLET FRAGMENT"
          echo "========================================"

          failed=0

          while IFS= read -r line; do

            case "$line" in

              CONFIG_*=*)
                symbol="${line%%=*}"
                expected="$line"

                actual="$(grep -E "^${symbol}=|^# ${symbol} is not set" \
                  out/.config | head -n 1 || true)"

                if [ "$actual" != "$expected" ]; then
                  echo "MISMATCH:"
                  echo "  $expected"
                  echo "  actual: ${actual:-NOT PRESENT}"
                  failed=1
                fi
                ;;

              \#\ CONFIG_*\ is\ not\ set)
                symbol="$(echo "$line" | sed 's/^# //; s/ is not set$//')"

                actual="$(grep -E "^${symbol}=|^# ${symbol} is not set" \
                  out/.config | head -n 1 || true)"

                if [ "$actual" != "$line" ]; then
                  echo "MISMATCH:"
                  echo "  $line"
                  echo "  actual: ${actual:-NOT PRESENT}"
                  failed=1
                fi
                ;;

            esac

          done < arch/arm64/configs/vendor/violet.config

          echo

          if [ "$failed" -ne 0 ]; then
            echo "VIOLET FRAGMENT VALIDATION: FAILED"
            exit 1
          fi

          echo "VIOLET FRAGMENT VALIDATION: PASSED"

      - name: Export FULL VIOLET defconfig
        run: |
          set -e

          echo "========================================"
          echo "EXPORTING FULL VIOLET DEFCONFIG"
          echo "========================================"

          cp out/.config artifact/violet_full_defconfig

          test -s artifact/violet_full_defconfig

          echo
          echo "Full configuration lines:"
          wc -l artifact/violet_full_defconfig

          echo
          echo "VIOLET symbols:"
          grep -E \
            '^CONFIG_ARCH_QCOM=y$|^CONFIG_ARCH_SM6150=y$|^CONFIG_MACH_XIAOMI_VIOLET=y$|^CONFIG_MMC_SDHCI_MSM=y$' \
            artifact/violet_full_defconfig

      - name: Final integrity check
        run: |
          set -e

          echo "========================================"
          echo "FINAL INTEGRITY CHECK"
          echo "========================================"

          test -f artifact/violet_full_defconfig

          grep -q '^CONFIG_ARCH_QCOM=y$' \
            artifact/violet_full_defconfig

          grep -q '^CONFIG_ARCH_SM6150=y$' \
            artifact/violet_full_defconfig

          grep -q '^CONFIG_MACH_XIAOMI_VIOLET=y$' \
            artifact/violet_full_defconfig

          grep -q '^CONFIG_MMC_SDHCI_MSM=y$' \
            artifact/violet_full_defconfig

          if grep -q '^CONFIG_MACH_XIAOMI_TUCANA=y$' \
            artifact/violet_full_defconfig; then
            echo "ERROR: TUCANA unexpectedly enabled"
            exit 1
          fi

          echo
          echo "FULL VIOLET DEFCONFIG: READY"
          echo
          echo "Output:"
          echo "artifact/violet_full_defconfig"

      - name: Upload FULL VIOLET defconfig
        uses: actions/upload-artifact@v4
        with:
          name: violet-full-defconfig
          path: artifact/violet_full_defconfig
          if-no-files-found: error
