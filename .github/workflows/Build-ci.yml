name: Generate Full VIOLET Defconfig

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            make \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            device-tree-compiler

      - name: Verify ARM64 compiler
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "========================================"
          echo "ARM64 TOOLCHAIN"
          echo "========================================"

          echo "ARCH=$ARCH"
          echo "CROSS_COMPILE=$CROSS_COMPILE"

          command -v "${CROSS_COMPILE}gcc"
          command -v "${CROSS_COMPILE}ld"

          "${CROSS_COMPILE}gcc" --version | head -n 1
          "${CROSS_COMPILE}ld" --version | head -n 1

      - name: Verify VIOLET inputs
        run: |
          set -e

          BASE="arch/arm64/configs/vendor/sdmsteppe-perf_defconfig"
          VIOLET="arch/arm64/configs/vendor/violet.config"

          test -f "$BASE"
          test -f "$VIOLET"

          echo "========================================"
          echo "VIOLET INPUTS"
          echo "========================================"

          echo "BASE:"
          echo "$BASE"

          echo
          echo "VIOLET FRAGMENT:"
          echo "$VIOLET"

          echo
          echo "VIOLET BOARD:"
          grep -E '^CONFIG_MACH_XIAOMI_VIOLET=y$' "$VIOLET"

      - name: Prepare output
        run: |
          set -e

          rm -rf out
          mkdir -p out
          mkdir -p artifact

      - name: Generate base ARM64 configuration
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out vendor/sdmsteppe-perf_defconfig

          test -s out/.config

          cp out/.config out/base.config

          echo "========================================"
          echo "BASE CONFIG GENERATED"
          echo "========================================"

          grep -E \
            '^CONFIG_ARCH_QCOM=y$|^CONFIG_ARCH_SM6150=y$' \
            out/.config || true

      - name: Merge VIOLET fragment
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "========================================"
          echo "MERGING VIOLET"
          echo "========================================"

          ./scripts/kconfig/merge_config.sh \
            -m \
            -O out \
            out/base.config \
            arch/arm64/configs/vendor/violet.config

          test -s out/.config

      - name: Resolve Kconfig
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "========================================"
          echo "KCONFIG RESOLUTION"
          echo "========================================"

          make O=out olddefconfig

          test -s out/.config

      - name: Verify VIOLET result
        run: |
          set -e

          echo "========================================"
          echo "VIOLET RESULT"
          echo "========================================"

          check() {
            symbol="$1"

            value="$(grep -E "^${symbol}=|^# ${symbol} is not set$" \
              out/.config | head -n 1 || true)"

            echo "${symbol}: ${value:-NOT PRESENT}"
          }

          check CONFIG_ARCH_QCOM
          check CONFIG_ARCH_SM6150
          check CONFIG_MACH_XIAOMI_VIOLET
          check CONFIG_MACH_XIAOMI_SM6150
          check CONFIG_MMC
          check CONFIG_MMC_SDHCI
          check CONFIG_MMC_SDHCI_PLTFM
          check CONFIG_MMC_SDHCI_MSM

          echo
          echo "Required VIOLET board symbol:"

          grep -q '^CONFIG_MACH_XIAOMI_VIOLET=y$' out/.config

          echo "CONFIG_MACH_XIAOMI_VIOLET=y"

      - name: Generate clean VIOLET defconfig
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "========================================"
          echo "GENERATING CLEAN VIOLET DEFCONFIG"
          echo "========================================"

          make O=out savedefconfig

          test -s out/defconfig

          cp out/defconfig artifact/violet_full_defconfig

          echo
          echo "Generated:"
          echo "artifact/violet_full_defconfig"

          echo
          echo "Lines:"
          wc -l artifact/violet_full_defconfig

      - name: Validate exported VIOLET defconfig
        run: |
          set -e

          CONFIG="artifact/violet_full_defconfig"

          echo "========================================"
          echo "VALIDATING EXPORTED DEFCONFIG"
          echo "========================================"

          test -s "$CONFIG"

          grep -q '^CONFIG_MACH_XIAOMI_VIOLET=y$' "$CONFIG"

          echo "VIOLET board: OK"

          echo
          echo "Important resolved symbols:"

          grep -E \
            '^CONFIG_ARCH_QCOM=|^CONFIG_ARCH_SM6150=|^CONFIG_MACH_XIAOMI=|^CONFIG_MACH_XIAOMI_SM6150=|^CONFIG_MACH_XIAOMI_VIOLET=|^CONFIG_MMC=|^CONFIG_MMC_SDHCI=|^CONFIG_MMC_SDHCI_PLTFM=|^CONFIG_MMC_SDHCI_MSM=' \
            "$CONFIG" || true

          echo
          echo "========================================"
          echo "FULL VIOLET DEFCONFIG READY"
          echo "========================================"

      - name: Upload VIOLET defconfig
        uses: actions/upload-artifact@v4
        with:
          name: violet-full-defconfig
          path: artifact/violet_full_defconfig
          if-no-files-found: error
