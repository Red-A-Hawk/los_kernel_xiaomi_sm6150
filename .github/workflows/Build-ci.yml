name: Generate Modern Violet Defconfig (Kconfig Debug)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            build-essential \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            python3

      - name: Verify required configs
        run: |
          set -e

          test -f arch/arm64/configs/vendor/sdmsteppe-perf_defconfig
          test -f arch/arm64/configs/vendor/violet.config

          echo "Required configuration files found."

      - name: Generate base configuration
        run: |
          set -e

          rm -rf out
          mkdir -p out

          make O=out ARCH=arm64 vendor/sdmsteppe-perf_defconfig

          test -s out/.config

      - name: Merge Violet configuration
        run: |
          set -e

          ./scripts/kconfig/merge_config.sh \
            -O out \
            out/.config \
            arch/arm64/configs/vendor/violet.config

          test -s out/.config

      - name: Resolve configuration
        run: |
          set -e

          make O=out ARCH=arm64 olddefconfig

          test -s out/.config

      - name: Kconfig Debug Report
        if: always()
        run: |
          set +e

          mkdir -p kconfig-debug

          REPORT="kconfig-debug/kconfig-debug.txt"

          echo "========================================" > "$REPORT"
          echo "VIOLET KCONFIG DEBUG REPORT" >> "$REPORT"
          echo "========================================" >> "$REPORT"

          echo >> "$REPORT"
          echo "=== KERNEL VERSION ===" >> "$REPORT"
          head -n 10 Makefile >> "$REPORT"

          echo >> "$REPORT"
          echo "=== BASE DEFCONFIG ===" >> "$REPORT"
          cat arch/arm64/configs/vendor/sdmsteppe-perf_defconfig >> "$REPORT"

          echo >> "$REPORT"
          echo "=== VIOLET FRAGMENT ===" >> "$REPORT"
          cat arch/arm64/configs/vendor/violet.config >> "$REPORT"

          echo >> "$REPORT"
          echo "=== FINAL VALUES ===" >> "$REPORT"

          for symbol in \
            CONFIG_ARCH_QCOM \
            CONFIG_ARCH_SM6150 \
            CONFIG_ARCH_SDMMAGPIE \
            CONFIG_MACH_XIAOMI_VIOLET
          do
            echo >> "$REPORT"
            echo "--- $symbol ---" >> "$REPORT"
            grep -E "^${symbol}=|^# ${symbol} is not set" \
              out/.config >> "$REPORT"
          done

          echo >> "$REPORT"
          echo "=== ALL CONFIG DEFINITIONS ===" >> "$REPORT"

          grep -R -n -E \
            "^[[:space:]]*(config|menuconfig)[[:space:]]+(ARCH_QCOM|ARCH_SM6150|ARCH_SDMMAGPIE|MACH_XIAOMI_VIOLET)([[:space:]]|$)" \
            arch/arm64 arch/arm drivers 2>/dev/null \
            >> "$REPORT"

          echo >> "$REPORT"
          echo "=== ALL REFERENCES TO TARGET SYMBOLS ===" >> "$REPORT"

          grep -R -n -E \
            "ARCH_QCOM|ARCH_SM6150|ARCH_SDMMAGPIE|MACH_XIAOMI_VIOLET" \
            arch/arm64 arch/arm drivers 2>/dev/null \
            | grep -v "/.git/" \
            >> "$REPORT"

          echo >> "$REPORT"
          echo "=== KCONFIG FILES ===" >> "$REPORT"

          find arch/arm64 arch/arm drivers \
            -type f \( -name "Kconfig" -o -name "Kconfig.*" \) \
            2>/dev/null \
            | sort \
            > kconfig-debug/kconfig-files.txt

          echo >> "$REPORT"
          echo "=== MERGE CONFIG LOGIC ===" >> "$REPORT"

          sed -n '1,260p' scripts/kconfig/merge_config.sh \
            > kconfig-debug/merge_config.sh.txt

          echo >> "$REPORT"
          echo "=== FINAL FULL CONFIG ===" >> "$REPORT"

          cp out/.config kconfig-debug/final.config

          echo >> "$REPORT"
          echo "=== SYMBOL SEARCH IN FINAL CONFIG ===" >> "$REPORT"

          grep -n -E \
            "ARCH_QCOM|ARCH_SM6150|ARCH_SDMMAGPIE|MACH_XIAOMI_VIOLET" \
            out/.config \
            >> "$REPORT"

          echo >> "$REPORT"
          echo "=== KCONFIG DEBUG COMPLETE ===" >> "$REPORT"

          cat "$REPORT"

      - name: Save full configuration
        run: |
          set -e

          cp out/.config violet-full.config

          test -s violet-full.config

      - name: Generate final defconfig
        run: |
          set -e

          make O=out ARCH=arm64 savedefconfig

          test -s out/defconfig

          cp out/defconfig violet-perf_defconfig

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-violet-defconfig-debug
          path: |
            violet-perf_defconfig
            violet-full.config
            kconfig-debug/
          if-no-files-found: error
