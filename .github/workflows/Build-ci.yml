name: Violet Kconfig Forensic Analyzer

on:
  workflow_dispatch:

jobs:
  forensic:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make gcc g++ \
            libelf-dev python3 rsync cpio

      - name: Prepare forensic workspace
        run: |
          set -e

          rm -rf out forensic
          mkdir -p out forensic

          cat > forensic/violet.config <<'EOF'
          CONFIG_SND_SOC_TAS2563=y
          CONFIG_TAS2563_CODEC=y
          CONFIG_TAS2563_MISC=y
          CONFIG_TAS2563_REGMAP=y
          CONFIG_MACH_XIAOMI_VIOLET=y
          CONFIG_INPUT_FINGERPRINT=y
          CONFIG_FINGERPRINT_FPC1020=y
          CONFIG_FINGERPRINT_GF3208=y
          CONFIG_MMC=y
          CONFIG_MMC_PERF_PROFILING=y
          CONFIG_MMC_BLOCK_MINORS=32
          CONFIG_MMC_BLOCK_DEFERRED_RESUME=y
          CONFIG_MMC_TEST=m
          CONFIG_MMC_PARANOID_SD_INIT=y
          CONFIG_MMC_CLKGATE=y
          CONFIG_MMC_SDHCI=y
          CONFIG_MMC_SDHCI_PLTFM=y
          CONFIG_MMC_SDHCI_MSM=y
          CONFIG_MMC_CQ_HCI=y
          CONFIG_MMC_CQ_HCI_CRYPTO=y
          CONFIG_MMC_CQ_HCI_CRYPTO_QTI=y
          CONFIG_TOUCHSCREEN_FTS_F7B=y
          CONFIG_TOUCHSCREEN_NT36xxx=y
          CONFIG_TOUCHSCREEN_XIAOMI_TOUCHFEATURE=y
          CONFIG_TOUCHSCREEN_XIAOMI_TOUCHFEATURE_GAMEMODE=y
          CONFIG_TOUCHSCREEN_NVT_F7B=y
          EOF

      - name: Build Kconfig
        run: |
          set -e

          make O=out olddefconfig

      - name: Generate base configuration
        run: |
          set -e

          make O=out \
            KCONFIG_CONFIG="$PWD/out/.config" \
            vendor/sdmsteppe-perf_defconfig

          cp out/.config forensic/01-base-generated.config

      - name: Capture base symbols
        run: |
          set +e

          {
            echo "========================================"
            echo "BASE CONFIGURATION"
            echo "========================================"

            echo
            echo "[CONFIG_ARCH_QCOM]"
            grep -E '^CONFIG_ARCH_QCOM=|^# CONFIG_ARCH_QCOM is not set' \
              forensic/01-base-generated.config

            echo
            echo "[CONFIG_ARCH_SM6150]"
            grep -E '^CONFIG_ARCH_SM6150=|^# CONFIG_ARCH_SM6150 is not set' \
              forensic/01-base-generated.config

            echo
            echo "[CONFIG_ARCH_SDMMAGPIE]"
            grep -E '^CONFIG_ARCH_SDMMAGPIE=|^# CONFIG_ARCH_SDMMAGPIE is not set' \
              forensic/01-base-generated.config

            echo
            echo "[CONFIG_MACH_XIAOMI_VIOLET]"
            grep -E '^CONFIG_MACH_XIAOMI_VIOLET=|^# CONFIG_MACH_XIAOMI_VIOLET is not set' \
              forensic/01-base-generated.config

            echo
            echo "[CONFIG_MACH_XIAOMI_SM6150]"
            grep -E '^CONFIG_MACH_XIAOMI_SM6150=|^# CONFIG_MACH_XIAOMI_SM6150 is not set' \
              forensic/01-base-generated.config

            echo
            echo "[CONFIG_MACH_XIAOMI_TUCANA]"
            grep -E '^CONFIG_MACH_XIAOMI_TUCANA=|^# CONFIG_MACH_XIAOMI_TUCANA is not set' \
              forensic/01-base-generated.config

            echo
            echo "[CONFIG_MACH_XIAOMI_SDMMAGPIE]"
            grep -E '^CONFIG_MACH_XIAOMI_SDMMAGPIE=|^# CONFIG_MACH_XIAOMI_SDMMAGPIE is not set' \
              forensic/01-base-generated.config

            echo
            echo "[CONFIG_MMC]"
            grep -E '^CONFIG_MMC=|^# CONFIG_MMC is not set' \
              forensic/01-base-generated.config

            echo
            echo "[CONFIG_MMC_SDHCI]"
            grep -E '^CONFIG_MMC_SDHCI=|^# CONFIG_MMC_SDHCI is not set' \
              forensic/01-base-generated.config

            echo
            echo "[CONFIG_MMC_SDHCI_PLTFM]"
            grep -E '^CONFIG_MMC_SDHCI_PLTFM=|^# CONFIG_MMC_SDHCI_PLTFM is not set' \
              forensic/01-base-generated.config

            echo
            echo "[CONFIG_MMC_SDHCI_MSM]"
            grep -E '^CONFIG_MMC_SDHCI_MSM=|^# CONFIG_MMC_SDHCI_MSM is not set' \
              forensic/01-base-generated.config
          } > forensic/02-base-symbols.txt

      - name: Create exact merged Kconfig input
        run: |
          set -e

          BASE="forensic/01-base-generated.config"
          FRAGMENT="forensic/violet.config"
          MERGED="forensic/03-merged-input.config"

          cp "$BASE" "$MERGED"

          while IFS= read -r line; do
            case "$line" in
              CONFIG_*=*)
                symbol="${line%%=*}"
                sed -i "/^${symbol}=/d" "$MERGED"
                sed -i "/^# ${symbol} is not set$/d" "$MERGED"
                ;;
              "# CONFIG_"*" is not set")
                symbol="${line#\# }"
                symbol="${symbol% is not set}"
                sed -i "/^${symbol}=/d" "$MERGED"
                sed -i "/^# ${symbol} is not set$/d" "$MERGED"
                ;;
            esac
          done < "$FRAGMENT"

          printf '\n' >> "$MERGED"
          cat "$FRAGMENT" >> "$MERGED"

          cp "$MERGED" out/merged-input.config

      - name: Verify merged input before Kconfig
        run: |
          set +e

          {
            echo "========================================"
            echo "EXACT KCONFIG INPUT BEFORE RESOLUTION"
            echo "========================================"

            for symbol in \
              CONFIG_ARCH_QCOM \
              CONFIG_ARCH_SM6150 \
              CONFIG_ARCH_SDMMAGPIE \
              CONFIG_MACH_XIAOMI_VIOLET \
              CONFIG_MACH_XIAOMI_SM6150 \
              CONFIG_MACH_XIAOMI_TUCANA \
              CONFIG_MACH_XIAOMI_SDMMAGPIE \
              CONFIG_MMC \
              CONFIG_MMC_SDHCI \
              CONFIG_MMC_SDHCI_PLTFM \
              CONFIG_MMC_SDHCI_MSM
            do
              echo
              echo "[$symbol]"
              grep -E "^${symbol}=|^# ${symbol} is not set" \
                forensic/03-merged-input.config || echo "NOT PRESENT"
            done
          } > forensic/04-merged-input-symbols.txt

      - name: Run alldefconfig with exact merged input
        run: |
          set +e

          rm -f out/.config

          KCONFIG_ALLCONFIG="$PWD/forensic/03-merged-input.config" \
            make O=out alldefconfig \
            > forensic/05-alldefconfig.log 2>&1

          echo $? > forensic/05-alldefconfig.exit

          cp out/.config forensic/06-after-alldefconfig.config 2>/dev/null || true

      - name: Capture alldefconfig symbols
        run: |
          set +e

          {
            echo "========================================"
            echo "AFTER ALLDEFCONFIG"
            echo "========================================"

            for symbol in \
              CONFIG_ARCH_QCOM \
              CONFIG_ARCH_SM6150 \
              CONFIG_ARCH_SDMMAGPIE \
              CONFIG_MACH_XIAOMI_VIOLET \
              CONFIG_MACH_XIAOMI_SM6150 \
              CONFIG_MACH_XIAOMI_TUCANA \
              CONFIG_MACH_XIAOMI_SDMMAGPIE \
              CONFIG_MMC \
              CONFIG_MMC_SDHCI \
              CONFIG_MMC_SDHCI_PLTFM \
              CONFIG_MMC_SDHCI_MSM
            do
              echo
              echo "[$symbol]"
              grep -E "^${symbol}=|^# ${symbol} is not set" \
                forensic/06-after-alldefconfig.config || echo "NOT PRESENT"
            done
          } > forensic/07-after-alldefconfig-symbols.txt

      - name: Run olddefconfig
        run: |
          set +e

          make O=out olddefconfig \
            > forensic/08-olddefconfig.log 2>&1

          echo $? > forensic/08-olddefconfig.exit

          cp out/.config forensic/09-final.config 2>/dev/null || true

      - name: Capture final symbols
        run: |
          set +e

          {
            echo "========================================"
            echo "FINAL CONFIGURATION"
            echo "========================================"

            for symbol in \
              CONFIG_ARCH_QCOM \
              CONFIG_ARCH_SM6150 \
              CONFIG_ARCH_SDMMAGPIE \
              CONFIG_MACH_XIAOMI_VIOLET \
              CONFIG_MACH_XIAOMI_SM6150 \
              CONFIG_MACH_XIAOMI_TUCANA \
              CONFIG_MACH_XIAOMI_SDMMAGPIE \
              CONFIG_MMC \
              CONFIG_MMC_SDHCI \
              CONFIG_MMC_SDHCI_PLTFM \
              CONFIG_MMC_SDHCI_MSM
            do
              echo
              echo "[$symbol]"
              grep -E "^${symbol}=|^# ${symbol} is not set" \
                forensic/09-final.config || echo "NOT PRESENT"
            done
          } > forensic/10-final-symbols.txt

      - name: Analyze symbol transitions
        run: |
          set +e

          {
            echo "############################################################"
            echo "# VIOLET KCONFIG FORENSIC ANALYSIS"
            echo "############################################################"
            echo
            echo "Kernel:"
            sed -n 's/^VERSION = /VERSION=/p;
                     s/^PATCHLEVEL = /PATCHLEVEL=/p;
                     s/^SUBLEVEL = /SUBLEVEL=/p;
                     s/^EXTRAVERSION = /EXTRAVERSION=/p' Makefile
            echo
            echo "Base: vendor/sdmsteppe-perf_defconfig"
            echo

            for symbol in \
              CONFIG_ARCH_QCOM \
              CONFIG_ARCH_SM6150 \
              CONFIG_ARCH_SDMMAGPIE \
              CONFIG_MACH_XIAOMI_VIOLET \
              CONFIG_MACH_XIAOMI_SM6150 \
              CONFIG_MACH_XIAOMI_TUCANA \
              CONFIG_MACH_XIAOMI_SDMMAGPIE \
              CONFIG_MMC \
              CONFIG_MMC_SDHCI \
              CONFIG_MMC_SDHCI_PLTFM \
              CONFIG_MMC_SDHCI_MSM
            do

              echo "============================================================"
              echo "$symbol"
              echo "============================================================"

              echo
              echo "[1] BASE"
              grep -E "^${symbol}=|^# ${symbol} is not set" \
                forensic/01-base-generated.config || echo "NOT PRESENT"

              echo
              echo "[2] MERGED INPUT"
              grep -E "^${symbol}=|^# ${symbol} is not set" \
                forensic/03-merged-input.config || echo "NOT PRESENT"

              echo
              echo "[3] AFTER ALLDEFCONFIG"
              grep -E "^${symbol}=|^# ${symbol} is not set" \
                forensic/06-after-alldefconfig.config || echo "NOT PRESENT"

              echo
              echo "[4] FINAL AFTER OLDDEFCONFIG"
              grep -E "^${symbol}=|^# ${symbol} is not set" \
                forensic/09-final.config || echo "NOT PRESENT"

              echo
            done

            echo "============================================================"
            echo "INTERPRETATION"
            echo "============================================================"
            echo
            echo "BASE -> MERGED INPUT"
            echo "Shows what the merge operation actually created."
            echo
            echo "MERGED INPUT -> ALLDEFCONFIG"
            echo "Shows what Kconfig accepts/rejects during initial resolution."
            echo
            echo "ALLDEFCONFIG -> OLDDEFCONFIG"
            echo "Shows what olddefconfig changes after dependency/default resolution."
            echo
            echo "If ARCH_QCOM exists in MERGED INPUT but disappears in"
            echo "AFTER ALLDEFCONFIG, Kconfig dependency resolution is responsible."
            echo
            echo "If ARCH_QCOM disappears before ALLDEFCONFIG, the merge stage"
            echo "is responsible."
            echo
            echo "If MACH_XIAOMI_VIOLET is present after ALLDEFCONFIG but disappears"
            echo "after OLDDEFCONFIG, inspect its dependency/select chain."
            echo
          } > forensic/11-FORENSIC-REPORT.txt

      - name: Collect exact Kconfig definitions
        run: |
          set +e

          {
            echo "############################################################"
            echo "# EXACT KCONFIG DEFINITIONS"
            echo "############################################################"
            echo

            for symbol in \
              ARCH_QCOM \
              ARCH_SM6150 \
              ARCH_SDMMAGPIE \
              MACH_XIAOMI_VIOLET \
              MACH_XIAOMI_SM6150 \
              MACH_XIAOMI_TUCANA \
              MACH_XIAOMI_SDMMAGPIE \
              MMC_SDHCI_MSM
            do
              echo
              echo "============================================================"
              echo "$symbol"
              echo "============================================================"

              grep -R -n -B 2 -A 18 \
                "^[[:space:]]*config ${symbol}$" \
                arch drivers 2>/dev/null | head -80
            done
          } > forensic/12-KCONFIG-DEFINITIONS.txt

      - name: Collect direct references and dependencies
        run: |
          set +e

          {
            echo "############################################################"
            echo "# DIRECT REFERENCES / DEPENDENCY EVIDENCE"
            echo "############################################################"
            echo

            for symbol in \
              ARCH_QCOM \
              ARCH_SM6150 \
              ARCH_SDMMAGPIE \
              MACH_XIAOMI_VIOLET \
              MACH_XIAOMI_SM6150 \
              MACH_XIAOMI_TUCANA \
              MACH_XIAOMI_SDMMAGPIE \
              MMC_SDHCI_MSM
            do
              echo
              echo "============================================================"
              echo "REFERENCES: $symbol"
              echo "============================================================"

              grep -R -n \
                -E "depends on .*${symbol}|select .*${symbol}|default .*${symbol}|config ${symbol}$|CONFIG_${symbol}" \
                arch drivers 2>/dev/null | head -200
            done
          } > forensic/13-REFERENCES.txt

      - name: Collect Kconfig warnings
        run: |
          set +e

          {
            echo "========================================"
            echo "ALLDEFCONFIG WARNINGS"
            echo "========================================"
            cat forensic/05-alldefconfig.log

            echo
            echo "========================================"
            echo "OLDDEFCONFIG WARNINGS"
            echo "========================================"
            cat forensic/08-olddefconfig.log
          } > forensic/14-KCONFIG-WARNINGS.txt

      - name: Generate final summary
        run: |
          set +e

          {
            echo "############################################################"
            echo "# VIOLET KCONFIG FORENSIC SUMMARY"
            echo "############################################################"
            echo
            echo "KERNEL:"
            grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) =' Makefile
            echo
            echo "BASE DEFCONFIG:"
            echo "vendor/sdmsteppe-perf_defconfig"
            echo
            echo "============================================================"
            echo "CRITICAL TRANSITION"
            echo "============================================================"
            echo

            for symbol in \
              CONFIG_ARCH_QCOM \
              CONFIG_ARCH_SM6150 \
              CONFIG_ARCH_SDMMAGPIE \
              CONFIG_MACH_XIAOMI_VIOLET \
              CONFIG_MACH_XIAOMI_SM6150 \
              CONFIG_MMC_SDHCI_MSM
            do
              echo "[$symbol]"

              echo -n "BASE: "
              grep -E "^${symbol}=|^# ${symbol} is not set" \
                forensic/01-base-generated.config | head -1 || echo "NOT PRESENT"

              echo -n "MERGED: "
              grep -E "^${symbol}=|^# ${symbol} is not set" \
                forensic/03-merged-input.config | head -1 || echo "NOT PRESENT"

              echo -n "ALLDEF: "
              grep -E "^${symbol}=|^# ${symbol} is not set" \
                forensic/06-after-alldefconfig.config | head -1 || echo "NOT PRESENT"

              echo -n "FINAL: "
              grep -E "^${symbol}=|^# ${symbol} is not set" \
                forensic/09-final.config | head -1 || echo "NOT PRESENT"

              echo
            done

            echo "============================================================"
            echo "EXIT CODES"
            echo "============================================================"
            echo
            echo "alldefconfig: $(cat forensic/05-alldefconfig.exit 2>/dev/null)"
            echo "olddefconfig: $(cat forensic/08-olddefconfig.exit 2>/dev/null)"
            echo
            echo "The decisive file is:"
            echo "03-merged-input.config"
            echo
            echo "It records exactly what was passed to Kconfig through"
            echo "KCONFIG_ALLCONFIG."
            echo
          } > forensic/00-SUMMARY.txt

      - name: Package single forensic artifact
        run: |
          set -e

          mkdir -p artifact

          cp -r forensic artifact/

          tar -czf violet-kconfig-forensic.tar.gz artifact/

      - name: Upload forensic artifact
        uses: actions/upload-artifact@v4
        with:
          name: violet-kconfig-forensic
          path: violet-kconfig-forensic.tar.gz
          if-no-files-found: error
          retention-days: 30
